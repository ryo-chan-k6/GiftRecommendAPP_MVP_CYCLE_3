schema_version: "1.0"
definition_type: "error_catalog"

error_catalog:
  domain: "EXT"
  domain_label: "External API"
  mvp_scope: true
  codes:
    - code: "GRS-EXT-100"
      internal_name: "External API Failed"
      http_status: 502
      retryable: true
      severity: error
      user_message_key: "error.ext.100"
      owner_types: ["api_call", "batch_run"]
      mvp_scope: true
    - code: "GRS-EXT-101"
      internal_name: "External API Timeout"
      http_status: 504
      retryable: true
      severity: error
      user_message_key: "error.ext.101"
      owner_types: ["api_call", "batch_run"]
      mvp_scope: true
    - code: "GRS-EXT-102"
      internal_name: "External API Rate Limited"
      http_status: 429
      retryable: true
      severity: warn
      user_message_key: "error.ext.102"
      owner_types: ["api_call", "batch_run"]
      mvp_scope: true
    - code: "GRS-EXT-103"
      internal_name: "Invalid External Response"
      http_status: 502
      retryable: true
      severity: error
      user_message_key: "error.ext.103"
      owner_types: ["batch_run"]
      mvp_scope: true
    - code: "GRS-EXT-104"
      internal_name: "External Item Not Found"
      http_status: 404
      retryable: false
      severity: warn
      user_message_key: "error.ext.104"
      owner_types: ["batch_run"]
      mvp_scope: true
    - code: "GRS-EXT-105"
      internal_name: "Invalid External Request Parameter"
      http_status: 400
      retryable: false
      severity: warn
      user_message_key: "error.ext.105"
      owner_types: ["batch_run"]
      mvp_scope: true
    - code: "GRS-EXT-999"
      internal_name: "External Integration Unexpected Error"
      http_status: 500
      retryable: true
      severity: error
      user_message_key: "error.ext.999"
      owner_types: ["api_call", "batch_run"]
      mvp_scope: true
