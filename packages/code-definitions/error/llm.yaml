schema_version: "1.0"
definition_type: "error_catalog"

error_catalog:
  domain: "LLM"
  domain_label: "LLM / Embedding"
  mvp_scope: true
  codes:
    - code: "GRS-LLM-100"
      internal_name: "LLM API Failed"
      http_status: 502
      retryable: true
      severity: error
      user_message_key: "error.llm.100"
      owner_types: ["recommendation_run", "batch_run"]
      mvp_scope: true
    - code: "GRS-LLM-101"
      internal_name: "LLM API Timeout"
      http_status: 504
      retryable: true
      severity: error
      user_message_key: "error.llm.101"
      owner_types: ["recommendation_run", "batch_run"]
      mvp_scope: true
    - code: "GRS-LLM-102"
      internal_name: "LLM Rate Limited"
      http_status: 429
      retryable: true
      severity: warn
      user_message_key: "error.llm.102"
      owner_types: ["recommendation_run", "batch_run"]
      mvp_scope: true
    - code: "GRS-LLM-103"
      internal_name: "Embedding Generation Failed"
      http_status: 500
      retryable: true
      severity: error
      user_message_key: "error.llm.103"
      owner_types: ["recommendation_run", "batch_run"]
      mvp_scope: true
    - code: "GRS-LLM-104"
      internal_name: "LLM Response Parse Failed"
      http_status: 500
      retryable: true
      severity: error
      user_message_key: "error.llm.104"
      owner_types: ["recommendation_run"]
      mvp_scope: true
    - code: "GRS-LLM-999"
      internal_name: "LLM Unexpected Error"
      http_status: 500
      retryable: true
      severity: error
      user_message_key: "error.llm.999"
      owner_types: ["recommendation_run", "batch_run"]
      mvp_scope: true
