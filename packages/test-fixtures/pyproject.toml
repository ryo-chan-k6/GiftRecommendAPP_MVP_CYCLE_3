[project]
name = "gift-recommendation-test-fixtures"
version = "0.0.0"
description = "Gift Recommendation Service MVP reusable test fixtures for packages and apps"
readme = "README.md"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gift_recommendation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
