[project]
name = "gift-recommendation-shared-logic"
version = "0.0.0"
description = "Gift Recommendation Service MVP shared domain logic for reco and batch"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gift_recommendation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
