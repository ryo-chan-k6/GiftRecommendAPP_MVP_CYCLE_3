[project]
name = "gift-recommendation-batch"
version = "0.0.0"
description = "Gift Recommendation Service batch jobs (Phase4a infrastructure scaffold)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "psycopg[binary]>=3.2.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
