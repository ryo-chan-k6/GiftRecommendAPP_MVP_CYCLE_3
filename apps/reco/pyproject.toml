[project]
name = "gift-recommendation-reco"
version = "0.0.0"
description = "Gift Recommendation Service reco engine (Phase4a pipeline and domain scaffold)"
readme = "README.md"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
