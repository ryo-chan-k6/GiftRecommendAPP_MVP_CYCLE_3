# Reco stg 推奨設定（#1720）
# prod は別 app（例: okuri-reco-prod）を作成し、本ファイルをコピーして app / APP_ENV を調整する。
# 実デプロイ・Secret 登録は Human（簡易stg構築手順 §6.5）。

app = 'okuri-reco-stg'
primary_region = 'nrt'

[build]
  dockerfile = 'infra/fly/Dockerfile'
  ignorefile = 'infra/fly/.dockerignore'

[env]
  APP_ENV = 'stg'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Authenticated health（/internal/reco/v1/health）は X-Internal-Api-Key 必須のため、
# プラットフォーム check に Key を埋め込まない。プロセス待受のみ TCP で確認する。
[checks]
  [checks.reco_tcp]
    type = 'tcp'
    port = 8000
    interval = '15s'
    timeout = '2s'
    grace_period = '30s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
