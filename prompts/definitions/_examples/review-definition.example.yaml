schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-002-recommendation-input-pr"
  title: "SCR-002 画面仕様書 PRレビュー"
  summary: "SCR-002 レコメンド条件入力画面仕様書作成 Task の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

target:
  pr: null
  issue: "#102"
  task_definition: "prompts/definitions/tasks/scr-002-recommendation-input/screen-spec.yaml"
  source_branch: "docs/task-302-scr-002-recommendation-input-screen-spec"
  target_branch: "feature/epic-301-web-screens"
  parent_epic_issue: "[Epic]SCR-002:レコメンド条件入力画面"
  parent_epic_branch: "feature/epic-301-web-screens"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: true
  db: true
  generated: true
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/scr-002-recommendation-input/screen-spec.yaml"
    required: true
  issue:
    number: "#102"
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-301-web-screens"
  docs:
    - path: "docs/06_実装設計/web/SCR-002_レコメンド条件入力画面画面仕様書.md"
      required: true
      purpose: "作成成果物の内容確認"
  files: []
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables:
      - path: "prompts/templates/docs/screen-spec.md"
        required: true
        purpose: "Task成果物が指定テンプレートに沿って作成されているか確認するため"
        applies_to:
          - "docs/06_実装設計/web/SCR-002 レコメンド条件入力画面仕様書.md"

review_points:
  common:
    - "Task Definitionのscopeを満たしているか"
    - "out_of_scopeの変更が混在していないか"
    - "acceptance_criteriaを満たしているか"
    - "PR本文に変更内容、検証結果、未実施事項が記載されているか"
    - "Human Review観点が明記されているか"
  docs:
    - "指定された文書テンプレートに沿って作成されているか"
    - "画面仕様書が指定パスに作成されているか"
    - "表示項目、表示条件、空状態、エラー状態が記載されているか"
    - "関連APIとの接続点が記載されているか"
    - "用語揺れがないか"
    - "Notion転記を想定したMarkdown体裁になっているか"
  source: []
  tests:
    - "docs作成Taskとして必要なmanual checkが記載されているか"
    - "未実施テストの理由がPR本文に記載されているか"
  api_contract:
    - "OpenAPI変更が混在していないか"
    - "Orval再生成が混在していないか"
    - "generated API client変更が混在していないか"
  db:
    - "DB schema変更が混在していないか"
    - "migration変更が混在していないか"
  generated:
    - "generatedファイルを手動編集していないか"
  cicd: []
  security:
    - "secretや.env実値が含まれていないか"
  branch:
    - "Task Branchからdevelopへ直接PRしていないか"
    - "PR targetがParent Epic Branchであるか"
    - "Task PRでRelated to #102が使われているか"
    - "Task PRでCloses #102を使っていないか"
  project:
    - "レビュー結果に応じたStatus更新意図が明確か"

acceptance_check:
  use_task_acceptance_criteria: true
  additional_criteria:
    - "PR本文に実施済み検証と未実施テストの理由が記載されている"
    - "Human Reviewで確認してほしい事項が明記されている"
    - "AI Review結果をPRコメントに記録できる形式になっている"
    - "Task Definitionで文書テンプレートが指定されている場合、成果物がそのテンプレートに沿っている"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteriaを満たしている"
      - "修正必須事項がない"
      - "scope外変更がない"
      - "Human Reviewで確認すべき事項が整理されている"
  request_changes:
    conditions:
      - "同一Branchで修正可能なdocs不備がある"
      - "PR本文に必要情報が不足している"
      - "検証結果または未実施理由が不足している"
  needs_human_decision:
    conditions:
      - "画面仕様のMVP範囲判断が必要"
      - "scope外変更を同一PRに含めるべきか判断が必要"
      - "未実施テストを許容してHuman Reviewへ進めてよいか判断が必要"
  split_required:
    conditions:
      - "OpenAPI変更が混在している"
      - "DB schema変更が混在している"
      - "別Issue化すべき設計変更が混在している"
  blocked:
    conditions:
      - "PR diffを確認できない"
      - "Task Definitionが存在しない"
      - "IssueとPRの対応が不明"
      - "secretや.env実値の混入が疑われる"
      - "Task成果物に指定された文書テンプレートを確認できない"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false
  ai_logs:
    required: false
    path: null

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: false
  reason: "通常PRレビューのため、レビュー結果はPRコメントを正本とする"

human_decision_points:
  - "画面仕様がMVP範囲として妥当か"
  - "未実施テストの理由を許容してHuman Reviewへ進めてよいか"

stop_conditions:
  - "PRが存在しない場合"
  - "Task Definitionが存在しない場合"
  - "IssueとPRの対応が不明な場合"
  - "diffを確認できない場合"
  - "OpenAPI変更が混在している場合"
  - "DB schema変更が混在している場合"
  - "generatedファイルの手動編集が疑われる場合"
  - "secretや.env実値の混入が疑われる場合"
  - "Human Reviewを省略する前提になっている場合"
  - "AIがmerge判断を行う必要がある場合"
  - "指定された文書テンプレートが存在しない場合"
  - "Task Definitionの output.docs[].template と Review Definition の input.templates.deliverables[].path が不一致の場合"

notes:
  - "docs作成Taskのため、source code変更は原則scope外とする"
  - "このファイルはReview Definitionの記入例であり、実レビューの正本ではない"
  - "Task Definitionとの共通キーは Task Definition設計書 §9.1 実運用YAMLに準拠する"
