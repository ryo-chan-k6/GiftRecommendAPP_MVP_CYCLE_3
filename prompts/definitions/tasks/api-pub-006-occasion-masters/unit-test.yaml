schema_version: "1.0"
definition_type: "task"

task:
  id: "task-api-pub-006-occasion-masters-unit-test"
  title: "API-PUB-006:Occasionマスタ取得単体テスト"
  summary: "API-PUB-006（Occasionマスタ取得）エンドポイント層に対し、実装仕様書 §9 の fixture ベース unit 観点カバレッジを整理・拡充する（Phase4b 3/3）。実装 Task #1176 のスモーク UT を維持しつつ、残ギャップを埋める。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]API-PUB-006:Occasionマスタ取得"
  epic_issue_number: 388
  epic_branch: "feature/epic-388-pub-006-occasion-masters"
  related_issues:
    - number: 388
      purpose: "親 Epic"
    - number: 1176
      purpose: "前提 Task（エンドポイント実装・スモーク UT）"
    - number: 1171
      purpose: "前提 Task（API実装仕様書）"
  related_prs:
    - number: 1179
      purpose: "実装 Task PR（親 Epic Branch merge が /work-issue 開始条件）"
    - number: 1172
      purpose: "実装仕様書 PR（Epic Branch merge 済み）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "test-ai"
  support:
    - "worker-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Phase4b 縦串の 3/3。実装 Task（#1176 / PR #1179）で masters/occasions とスモーク UT が追加済み。
  本 Task は実装仕様書 §9 の観点を fixture ベース unit として PR に明示し、不足があれば
  `apps/api/tests/unit/app/masters/**` を拡充する。
  §9 No.8（generated）/ No.9（SCR-002 manual）は out_of_scope。
  Epic `allowed_paths` に tests パスが欠落しているため、PUB-001 と同様に追記する。

objective: |
  API-PUB-006 の unit テストを実装仕様書 §9（fixture 化可能な範囲）に沿って充足し、Epic PR → develop の前提を満たす。

scope:
  - "エンドポイント / Repository 層単体テストの拡充またはカバレッジ確認（`apps/api/tests/unit/app/masters/**`）"
  - "実装仕様書 §9 の unit 観点対応表を PR 本文に記載"
  - "不足ケースがあれば追加（空配列と GRS-CFG-005 境界、error metric、stack 非露出、非 GET 等）"
  - "親 Epic `epic_scope.allowed_paths` に `apps/api/tests/unit/app/masters/**` を追記（PUB-001 整合）"
  - "Task / Review Definition 整備"

out_of_scope:
  - "実 Postgres 結合テスト"
  - "integration / e2e / contract test（OpenAPI 変更を伴うもの）"
  - "OpenAPI / generated 変更"
  - "apps/web / apps/reco 変更"
  - "SCR-002 画面確認（§9 No.9）"
  - "Epic PR の develop merge（Human 判断）"
  - "PUB-005 / 007 / 008 のテスト追加"

input:
  docs:
    - path: "docs/06_実装設計/api/API-PUB-006_Occasionマスタ取得API実装仕様書.md"
      required: true
      purpose: "§9 実装テスト観点の正本"
    - path: "docs/06_実装設計/api/API-PUB-006_Occasionマスタ取得API契約仕様書.md"
      required: true
      purpose: "契約外形"
  templates: []
  files:
    - path: "apps/api/src/app/masters/"
      required: true
    - path: "apps/api/tests/unit/app/masters/occasions.smoke.test.ts"
      required: true
  issues:
    - number: 1176
      purpose: "前提実装"
  prs:
    - number: 1179
      purpose: "実装 PR（blocking）"

output:
  docs: []
  files:
    - path: "prompts/definitions/epics/api-pub-006-occasion-masters/epic.yaml"
      action: "update"
      required: false
      purpose: "allowed_paths に tests を追記"
  tests:
    - path: "apps/api/tests/unit/app/masters/**"
      action: "create_or_update"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"

deliverables:
  - "§9 unit 観点カバレッジ表（PR 本文）"
  - "不足ケースのテスト追加"
  - "Epic allowed_paths 追記（必要な場合）"
  - "Task / Review Definition"

acceptance_criteria:
  - "実装仕様書 §9 の fixture 化可能観点がテストまたは明示スキップ理由でカバーされている"
  - "`pnpm --filter @gift-recommendation/api test` が SUCCESS"
  - "OpenAPI / generated / apps/web / apps/reco 変更を含まない"
  - "epic_scope.allowed_paths 内（本 Task で tests パス追記後）"
  - "secret / .env 実値を含まない"

branch:
  no_branch: false
  name: "test/task-<issue-number>-api-pub-006-occasion-masters-unit-test"
  summary: "api-pub-006-occasion-masters-unit-test"
  base: "feature/epic-388-pub-006-occasion-masters"
  target: "feature/epic-388-pub-006-occasion-masters"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-12"
    due_date: "2026-07-14"

issue:
  unit: "task"
  type: "test"
  area: "api"

dependencies:
  epics: []
  issues:
    - number: 1176
      purpose: "実装 Task"
  prs:
    - number: 1179
      purpose: "実装 PR Epic merge（blocking）"
  blocking: true

parallel_control:
  depends_on:
    - "prompts/definitions/tasks/api-pub-006-occasion-masters/implementation.yaml"
  blocks: []
  exclusive_files:
    - "apps/api/tests/unit/app/masters/**"
    - "prompts/definitions/epics/api-pub-006-occasion-masters/epic.yaml"
    - "prompts/definitions/tasks/api-pub-006-occasion-masters/unit-test.yaml"
    - "prompts/definitions/reviews/api-pub-006-occasion-masters/unit-test/**"
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
    - "unit test"
    - "build or typecheck"
    - "secret check"
  commands:
    - "pnpm --filter @gift-recommendation/api test"
  not_required:
    - "integration test"
    - "e2e test"
  skip_reason:
    "integration test": "実 DB 結合は対象外。Scaffold fixture で代替"
    "e2e test": "本 Task 対象外"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "§9 カバレッジが十分か"
    - "空配列と GRS-CFG-005 が区別されているか"
    - "secret 非露出"
    - "Epic allowed_paths 追記が妥当か"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常 UT は ai-logs に保存しない"

risk_points:
  - "PR #1179 未 merge のまま開始する運用ミス"

human_decision_points:
  - "Epic allowed_paths への tests 追記を本 Task で行ってよいか（推奨: 実施）"

stop_conditions:
  - "PR #1179 が親 Epic Branch に merge されていない場合"
  - "secret / .env 実値を扱う必要が出た場合"
  - "実 Postgres 結合が必須と判明した場合"

notes:
  - "PUB-001 unit-test.yaml と同型。実装 PR merge まで /work-issue 開始不可。"
  - "後続: Epic PR → develop（縦串完了後・Human merge 判断）。"
  - "次手順: /start-task @prompts/definitions/tasks/api-pub-006-occasion-masters/unit-test.yaml"
