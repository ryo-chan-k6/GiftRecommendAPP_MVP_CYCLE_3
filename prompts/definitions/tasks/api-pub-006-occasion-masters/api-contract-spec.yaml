    - path: "docs/03_ドメイン要件定義/非機能要件定義書/論理ER.md"
      required: false
      purpose: "occasion_master 属性を確認するため"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase1 1a（契約面のみ）と Phase4 実装仕様書分離の正本を確認するため"
  templates:
