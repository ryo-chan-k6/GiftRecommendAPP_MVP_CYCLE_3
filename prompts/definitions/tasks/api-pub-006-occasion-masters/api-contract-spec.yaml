background: |
  Phase1 ① API契約仕様書（1a）として、API-PUB-006（Occasionマスタ取得 / Public API）の契約面（Request / Response / Error / Validation / 互換性 / OpenAPI 反映方針）を確定する。
  実装フェーズ実行プロセス設計書 §4.1（分離後モデル）に従い、処理フロー・MOD-API 連携・依存コンポーネント詳細チェック・結合テスト観点などの実装面は本 Task の対象外とし、`api-implementation-spec.yaml` で Phase4 実装設計時に作成する。
  API-INT-001（Recoヘルスチェック）は別 Epic/Task の対象。本 Task では Public I/F の契約確定に必要な範囲で Occasion Master 選択肢の表面定義のみ行う。

objective: |
  API-PUB-006（Occasionマスタ取得 / Public API、`GET /api/v1/masters/occasions`）について、Contract Gate および後続 OpenAPI Contract Task の入力となる API 契約仕様書を作成する。
  成果物は prompts/templates/docs/api-contract-spec.md に準拠し、契約面のみを記載する（api-implementation-spec.md の章は含めない）。
  OpenAPI / Orval / generated の実ファイル変更は後続 Contract Task へ分離する。

scope:
  - "API-PUB-006 の API 契約仕様書を新規作成する（成果物: API-PUB-006_Occasionマスタ取得API契約仕様書.md）"
  - "API基本情報（API ID / API種別 Public / Method GET / Endpoint /api/v1/masters/occasions / Base URL / Version / Provider apps/api / Consumer apps/web（SCR-002） / 認証要否 / 冪等性 / MVP対象）を定義する"
  - "Request Header / Path Parameters / Query Parameters / Request Body（なし）を整理する"
  - "Response Header / Status Code / Response Body（Occasion 選択肢一覧）を整理する"
  - "Error Response仕様（GRS-CFG-* / GRS-DB-*）を整理する"
  - "バリデーション仕様を整理する"
  - "OpenAPI / Orval / generated 反映方針（packages/contracts/openapi/public-api.yaml、apps/web/src/generated/api/ 再生成）を整理する（方針のみ。ファイル変更は out_of_scope）"
  - "互換性・破壊的変更・契約面テスト観点を整理する"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
  - "API実装仕様書（api-implementation-spec.md 準拠）の作成（prompts/definitions/tasks/api-pub-006-occasion-masters/api-implementation-spec.yaml）"
  - "処理概要（MOD-API-011 / MOD-API-012 の詳細フロー）・Master Repository マッピング詳細・provider/consumer 実装影響の詳細・結合テスト観点の確定"
  - "API-PUB-005 / 007 / 008（他マスタ取得）の個別API仕様書作成"
  - "Reco モジュール（MOD-RECO-*）本体の設計・実装"
  - "OpenAPI定義ファイル（packages/contracts/openapi/public-api.yaml 等）の作成・更新"
  - "Orval設定ファイル（orval.config.ts）の作成・更新"
  - "generated API client（apps/web/src/generated/api/）の再生成"
  - "apps/api の実装"
  - "apps/web の実装"
  - "apps/reco の実装"
  - "DB schema 変更"
  - "DDL 作成・変更"
  - "認証・認可方式そのものの変更"
  - "API一覧全体の再設計"
  - "他 API（API-PUB-001〜005 / 007〜008 / API-INT-001 / 002）の仕様書作成"

