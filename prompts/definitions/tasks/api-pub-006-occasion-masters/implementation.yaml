background: |
  Phase4b 縦串の 2/3（apps/api 実装）。前提: 実装仕様書 #1171 / PR #1172 が親 Epic Branch に merge 済み。
  契約・OpenAPI・occasion_master テーブル定義は develop 反映済み。
  Provider は apps/api（`apps/api/src/app/masters/**`）、Consumer は apps/web（SCR-002・本 Task 対象外）。
  Pair 情報は Public Response に含めない。網羅的単体テストは後続 unit-test Task に委譲する。

objective: |
  `GET /api/v1/masters/occasions` を契約・OpenAPI・実装仕様書に沿って apps/api 上で提供する。
  Express Router（MOD-API-011 / MOD-API-012）、`occasion_master` 読取（`is_active=true` / ORDER BY）、
  Response 組立（is_active / Pair 非公開）、0 件空配列と GRS-CFG-005 境界、
  エラーマップ、masters_occasions_* metric 境界を整える。

scope:
  - "`apps/api/src/app/masters/**` の新規実装（Router / Controller / Occasion Repository）"
  - "`GET /api/v1/masters/occasions` の成功 Response（`data.occasions` + `meta`）"
  - "`occasion_master` の `is_active=true` フィルタと `ORDER BY display_order, occasion_code`"
  - "0 件時 200 空配列と GRS-DB-002 / GRS-CFG-005 のエラー境界"
  - "trace / requestId の Header ↔ meta 一貫（`resolveRequestMeta`）"
  - "`masters_occasions_request_count` / `masters_occasions_error_count` の最小記録（logger 境界）"
  - "親アプリへの Router mount（`/api/v1/masters`）"
  - "実装スモーク単体テスト（最小限。網羅は後続 Task）"
  - "Task / Review Definition 整備"

out_of_scope:
  - "packages/contracts/openapi/** の変更"
  - "Orval / generated の再生成・手動編集"
  - "apps/web/** の変更"
  - "apps/reco/** の変更"
  - "API-PUB-006 契約仕様書・実装仕様書 docs の変更"
  - "DB schema 変更・migration・seed 変更"
  - "API-PUB-005 / 007 / 008 のエンドポイント実装（Router 共通化は閉じすぎない範囲で可だが、本 Task の必須は occasions のみ）"
  - "網羅的単体テスト Task（Phase4b 3/3）"
  - "結合テスト・E2E"

