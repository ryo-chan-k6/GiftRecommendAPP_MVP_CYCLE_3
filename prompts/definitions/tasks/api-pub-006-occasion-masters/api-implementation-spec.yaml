background: |
  Phase4b 縦串の 1/3（実装面仕様書）。契約面は `API-PUB-006_Occasionマスタ取得API契約仕様書.md`（#402 / PR #410）を正とする。
  OpenAPI 断片（#424 / PR #425）および `occasion_master` テーブル定義書（#445 / PR #448）は develop 反映済み。
  本 Task は契約・OpenAPI・DB schema を変更せず、apps/api の MOD-API-011 Master Controller / MOD-API-012 Master Repository 実装 Task が参照可能な **実装面のみ** を整理する。
  Provider は apps/api（`apps/api/src/app/masters/**`）、Consumer は apps/web（SCR-002）。
  Pair 情報（`pair_master`）は Public Response に含めない（契約・API一覧）。
  レーン4第1波（並列計画）。Epic Branch は develop 同期済みを前提とする。

objective: |
  API-PUB-006（Occasionマスタ取得 / Public API）について、apps/api masters 実装 Task / 単体テスト Task が参照可能な粒度の **API実装仕様書（実装面のみ）** を新規作成する。
  成果物は prompts/templates/docs/api-implementation-spec.md に準拠し、契約面（`api-contract-spec.md`）の章は再掲しない。
  Express Router、MOD-API-011/012 責務、`occasion_master` 読取（`is_active=true` / ORDER BY）、Response 組立、エラーマップ、ログ・メトリクス書き込み境界を明記する。
  OpenAPI 正本パスおよび generated client 利用方針は実装影響として記載するが、本 Task では当該ファイルを変更しない。

scope:
  - "API-PUB-006（Occasionマスタ取得 / Public API）のAPI実装仕様書を新規作成する（成果物ファイル名: API-PUB-006_Occasionマスタ取得API実装仕様書.md）"
  - "前提契約（契約仕様書パス / OpenAPI / Contract Gate 状態 / occasion_master テーブル定義）を整理する"
  - "実装方針（Express Router / MOD-API-011 / MOD-API-012 / request-meta / DI）を整理する"
  - "処理フロー（Mermaid）と処理詳細を整理する（Request 受付 → meta 解決 → Master Repository 読取 → Response 組立）"
  - "DB 列 → Public Response（occasionCode / occasionLabel / displayOrder）の内部DTOマッピングを整理する（is_active は Response に含めない）"
  - "0 件時 200 空配列と GRS-CFG-005（参照不能）の境界を実装面で整理する"
  - "generated client 利用方針（apps/web 側 SCR-002）を整理する（記載のみ）"
  - "provider（apps/api masters）/ consumer（apps/web SCR-002）の実装影響を整理する"
  - "エラーマップ（GRS-DB-* / GRS-CFG-* / GRS-COM-*）と trace 伝播を整理する"
  - "ログ・メトリクス（masters_occasions_request_count / masters_occasions_error_count）書き込み境界を整理する"
  - "実装結合テスト観点を整理する"
  - "非機能（タイムアウト・冪等・副作用なし・認証不要・Pair 非公開）の実装面を整理する"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
