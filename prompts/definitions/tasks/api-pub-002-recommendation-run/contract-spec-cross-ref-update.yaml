    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API実装仕様書.md"
      required: true
      purpose: "API-INT-002 実装正本パス確認（§5.4 追記用）"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
