background: |
  `docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md`（Task #358 / develop 反映済み）の §5.4 および §15 に、API-INT-002 契約正本として旧統合ファイル名 `API-INT-002_Reco推薦実行API仕様書.md` と「未作成時は API一覧」フォールバックが残っている。
  API-INT-002 契約仕様書・実装仕様書は Epic #366 配下 Task により develop 上に存在する。本 Task は契約内容の再定義ではなく、相互参照パスの docs メンテナンスのみを行う。

objective: |
  API-PUB-002 契約仕様書の API-INT-002 参照を現行正本パスへ更新し、「未作成」表記を解消する。
  §5.4 には契約正本に加え、実装正本（参照のみ）行の追加を推奨する（契約面本文への実装再掲は行わない）。

scope:
  - "API-PUB-002_レコメンド実行API契約仕様書.md §5.4 の `契約正本` 行を `API-INT-002_Reco推薦実行API契約仕様書.md` へ更新し、「未作成」フォールバックを削除する"
  - "同ファイル §15 関連資料の `内部 API（参照）` 行を同上に更新する"
  - "（推奨）§5.4 に `実装正本（参照のみ）` 行を追加（`API-INT-002_Reco推薦実行API実装仕様書.md`）"
  - "Task Definition / Review Definition の整備（本 Task）"

out_of_scope:
  - "Request / Response / Error / Validation 等の契約定義変更"
  - "API-INT-002 契約仕様書本体の編集（Epic #366 配下 Task #1122）"
  - "API-PUB-002 実装仕様書（#364）の変更"
  - "packages/contracts/openapi/**、Orval、generated"
  - "apps/api / apps/web / apps/reco 実装"

