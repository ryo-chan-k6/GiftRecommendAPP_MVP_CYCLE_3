    - "test-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  RecommendationRequestRepository は ScaffoldDbSession 経由で INSERT 相当を呼ぶが、scaffold は実 PostgreSQL に書かない。
  reco の production Run Recorder は recommendation_request 行の存在を要求する（#1137 診断: recommendation_request not found）。
  #1138 / PR #1143 で Router はマウント済み。本 Task で実 DB 永続化を行い、発行 ID で reco が Request を参照できる状態にする。
  Epic #357 Reopen は行わず、develop ベース・develop 向け PR の横断 follow-up とする。

objective: |
  PUB-002 処理で recommendation_request をローカル PostgreSQL に実永続化し、発行した recommendationRequestId で reco が Request を参照できる状態にする。
  失敗時は既存 Public エラー方針と整合させる。ローカル開発手順書 §10.4.4 No.2 を更新する。

scope:
  - "api 側の実 DB session（DATABASE_URL）導入、または既存基盤があればそれを利用"
  - "RecommendationRequestRepository / Router 依存注入を実 session に切り替え（ローカル dev で実 DB）"
  - "recommendation_request テーブルへの INSERT が成功し、psql で行を確認できること"
  - "失敗時の Public エラー（REQUEST_SAVE_FAILED 等）との整合"
  - "単体テスト: session mock / 実 DB は test_policy で明示（CI は mock / scaffold）"
  - "ローカル開発手順書 §10.4.4 No.2 の記述更新"
  - "Task / Review Definition 整備"

out_of_scope:
  - "supabase/migrations/** 変更（テーブルは既存前提）"
  - "OpenAPI / Orval / generated 変更"
  - "reco pair_reader / config version / production ports 全面置換（別 Issue #1140 / #1141）"
  - "Batch / Epic C fixture 全面整備"
  - "本番 Neon 接続や secret 実値の docs 記載"
  - "Epic #357 Reopen"
  - "SCR-002 / web 画面"

