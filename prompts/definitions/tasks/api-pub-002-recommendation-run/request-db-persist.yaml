  summary: "Epic #357 クローズ後 follow-up。ScaffoldDbSession を DATABASE_URL 経由の実 PostgreSQL session に差し替え、PUB-002 で recommendation_request を実永続化する（#1137 縦串スモークで確認したギャップ No.2）。"
  phase: "06_実装設計"

work_mode: "ai-agent"

