  related_issues:
    - number: 357
      purpose: "履歴参照（Epic クローズ済み）"
    - number: 1137
      purpose: "ローカル縦串スモークで scaffold 永続化ギャップを確認"
    - number: 1138
      purpose: "Router マウント（先行・完了推奨）"
    - number: 1128
      purpose: "recommendations モジュール実装"
  related_prs:
    - number: 1142
