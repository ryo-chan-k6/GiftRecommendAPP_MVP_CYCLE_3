  epic_issue: "[Epic]API-PUB-002:レコメンド実行"
  epic_issue_number: 357
  epic_branch: "develop"
  related_issues:
    - number: 357
      purpose: "履歴参照（Epic クローズ済み）"
    - number: 1137
      purpose: "ローカル縦串スモークで Router 未マウント（404）を確認"
    - number: 1128
      purpose: "recommendations モジュール実装（マウントは epic_scope 外）"
    - number: 1135
      purpose: "app.ts 導入（health のみ配線）"
  related_prs:
    - number: 1129
      purpose: "実装 PR（マウント未実施の経緯）"
    - number: 1136
      purpose: "app.ts / health 導入"
    - number: 1142
      purpose: "縦串スモーク（既知ギャップ記録）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  API-PUB-002 実装（#1128 / PR #1129）で `apps/api/src/app/recommendations/**` は追加済みだが、Router マウントは epic_scope 外として意図的に未実施だった。
  #1135 / PR #1136 で `apps/api/src/app.ts` が導入され `GET /api/v1/health` のみ配線された結果、ローカルで `POST /api/v1/recommendations` は HTTP 404 となる（#1137 / PR #1142 で確認）。
  Epic #357 Reopen は行わず、develop ベース・develop 向け PR の横断 follow-up とする。

objective: |
  `createApp()` に `createRecommendationsRouter` をマウントし、ローカル起動した api で `POST /api/v1/recommendations` が 404 にならない状態にする。
  health 既存挙動を壊さない。ローカル開発手順書の「Router 未マウント」記述を更新する。

scope:
  - "`apps/api/src/app.ts`（または同等のアプリ組立）へ `POST /api/v1/recommendations` を配線"
  - "health 既存挙動を壊さないこと"
  - "マウント後の最小確認（curl で 404 以外。Validation 422 / scaffold 経路の応答でも可）"
  - "必要なら単体テストで Router が app に載っていることを確認"
  - "ローカル開発手順書 §9.4 / §10.4 の「未マウント」記述を現状に合わせて更新"
  - "Task / Review Definition 整備"

out_of_scope:
  - "OpenAPI / Orval / generated 変更"
  - "`ScaffoldDbSession` → 実 DB 置換（別 Issue: recommendation_request 実DB永続化）"
  - "reco composition / pair_master / config version 修正"
  - "SCR-002 / web 画面"
  - "DB migration"
  - "Epic #357 Reopen"

input:
  docs:
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API実装仕様書.md"
      required: true
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
      required: true
    - path: "docs/06_実装設計/cross_cutting/ローカル開発手順書.md"
      required: true
  files:
    - path: "apps/api/src/app.ts"
      required: true
    - path: "apps/api/src/app/recommendations/routes.ts"
      required: true
    - path: "apps/api/src/app/health/routes.ts"
      required: true
    - path: "apps/api/src/app/recommendations/index.ts"
      required: true

output:
  docs:
    - path: "docs/06_実装設計/cross_cutting/ローカル開発手順書.md"
      action: "update"
      required: true
  files:
    - path: "apps/api/src/app.ts"
      action: "update"
      required: true
    - path: "apps/api/tests/unit/app/app.mount.test.ts"
      action: "create"
      required: false

