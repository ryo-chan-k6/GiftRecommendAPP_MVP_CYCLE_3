schema_version: "1.0"
definition_type: "task"

task:
  id: "task-api-pub-002-recommendation-run-router-mount"
  title: "API-PUB-002:レコメンド実行Routerマウント"
  summary: "Epic #357 クローズ後 follow-up。createApp() に createRecommendationsRouter をマウントし、POST /api/v1/recommendations が 404 にならない状態にする（#1137 縦串スモークで確認したギャップ No.1）。"
  phase: "06_実装設計"

work_mode: "ai-agent"

