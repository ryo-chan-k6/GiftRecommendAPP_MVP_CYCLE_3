  - "Task Definition / Review Definition が作成され、Issue に path が反映されている"
  - "`createApp()` 経由で `POST /api/v1/recommendations` が到達する（404 でない）"
  - "`GET /api/v1/health` が従来どおり 200"
  - "ローカル開発手順書の「Router 未マウント」記述が更新されている"
  - "OpenAPI / generated / migration 変更がない"
  - "PR target が develop（Epic #357 クローズ後 follow-up 例外を PR 本文で説明）"

