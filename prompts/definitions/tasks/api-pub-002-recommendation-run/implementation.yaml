task:
  id: "task-api-pub-002-recommendation-run-implementation"
  title: "API-PUB-002:レコメンド実行API実装"
  summary: "API-PUB-002（レコメンド実行 / Public API、`POST /api/v1/recommendations`）の apps/api 実装（MOD-API-001〜006）を新規実装する。契約仕様書・実装仕様書・OpenAPI Contract（#1126）を前提に、Validation・Request 永続化・createRecoClient 経由の API-INT-002 呼び出し・Public Response 整形・エラーマップを提供する（Phase4b 3/4）。"

work_mode: "ai-agent"

