background: |
  Phase4b 縦串（実装仕様書 → OpenAPI Contract → apps/api 実装 → 単体テスト）の 3/4 である。
  前提として API実装仕様書（#364 / PR #1120）および OpenAPI Contract Task（#1126 / PR #1127）が親 Epic Branch に merge 済みであること。
  現状 `apps/api/src/app/recommendations/**` は未実装。Phase4a `api-foundation` により middleware / logger / db scaffold / error-response / reco-client wrapper（`createRecoClient` / `GeneratedRecoClient`、#1112 develop merge 済み）は利用可能。
  本 Task では Express ルート層（MOD-API-001〜006）を新規作成し、Public Validation・Request 永続化・API-INT-002 呼び出し・Public Response マッピング・エラーマップを実装する。
  網羅的単体テストは Phase4b 4/4 の後続 unit-test Task に委譲する。

objective: |
  `POST /api/v1/recommendations` を apps/api 上で提供し、契約仕様書および実装仕様書に沿った HTTP I/F を実装する。
  `createRecoClient({ mode: "generated" })` 経由で API-INT-002 を呼び出し、正常系（0 件含む）・Validation 異常系・reco / transport 失敗時の Public Error を返却できる状態にする。

scope:
  - "`apps/api/src/app/recommendations/**` への MOD-API-001〜006 新規実装（routes / controller / validator / application-service / request-repository / response-mapper / types）"
  - "`POST /api/v1/recommendations` Express Router の提供（親アプリへマウント可能な `Router` エクスポート）"
  - "契約仕様書 §9 に基づく Public Request Validation（Zod 等、既存 validation middleware 方針に整合）"
  - "`recommendation_request` 永続化（MOD-API-004。`apps/api/src/infrastructure/db/**` scaffold 利用）"
  - "Public Body → API-INT-002 Request マッピング（§5.1。`execution.mode=ui` 固定）"
  - "`createRecoClient().runRecommendation()` 呼び出し（MOD-API-005。wrapper 経由のみ）"
  - "Internal Result → Public `data` / `meta` マッピング（§5.2。スコア系・debug フィールド除外、`items[]` / `isFallback` / 0 件 `empty`）"
  - "reco / transport 失敗 → Public HTTP / GRS-* エラーマップ（§7.3。`error-mapper.ts` / Application Service 連携）"
  - "trace / request_id の Header ↔ `meta` 一貫（`request-meta` middleware 整合）"
  - "access_log / error_log の最小記録（既存 logger 利用）"
  - "実装スモーク単体テスト（最小限。網羅は後続 Task）"
  - "Task / Review Definition 整備（本ファイルおよび pr-review.yaml）"

out_of_scope:
  - "packages/contracts/openapi/** の変更"
  - "apps/web/src/generated/api/** の再生成"
  - "apps/api/src/generated/reco-client/** の手動編集・再生成"
  - "apps/api/src/infrastructure/reco-client/** の wrapper 本体変更（#1112 正本。バグ修正のみ可・要 PR 説明）"
  - "apps/reco/** の変更"
  - "apps/web/** の変更（画面・api-client wrapper）"
  - "API-PUB-002 / API-INT-002 契約仕様書・実装仕様書 docs の変更"
  - "DB schema 変更・migration・seed"
  - "網羅的単体テスト Task（Phase4b 4/4）"
  - "結合テスト・E2E"

