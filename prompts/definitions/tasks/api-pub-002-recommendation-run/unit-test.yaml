    - "テストがスタブ前提で安定して再現可能か"
    - "既存実装の意図と矛盾するアサーションがないか"
    - "integration 観点を unit で無理に検証していないか"
    - "Public API 層への変更がテスト成立に必要な最小限か"
    - "epic_scope 外（OpenAPI / generated / apps/reco / apps/web）の変更が混入していないか"
    - "secret や .env 実値が含まれていないか"
  specialist_reviews:
