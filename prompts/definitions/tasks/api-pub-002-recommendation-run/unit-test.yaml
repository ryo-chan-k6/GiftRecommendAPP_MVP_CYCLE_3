schema_version: "1.0"
definition_type: "task"

task:
  id: "task-api-pub-002-recommendation-run-unit-test"
  title: "API-PUB-002:レコメンド実行API単体テスト"
  summary: "API-PUB-002（レコメンド実行 / Public API）の apps/api 実装（`apps/api/src/app/recommendations/**`）に対し、契約仕様書 §12・実装仕様書 §10 の unit 観点を満たす単体テストを `apps/api/tests/unit/app/recommendations/**` に追加・拡充する（Phase4b 4/4）。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]API-PUB-002:レコメンド実行"
  epic_issue_number: 357
  epic_branch: "feature/epic-357-api-pub-002-recommendation-run"
  related_issues:
    - number: 358
      purpose: "前提 Task（API契約仕様書）"
    - number: 364
      purpose: "前提 Task（API実装仕様書）"
    - number: 1126
      purpose: "前提 Contract Task（OpenAPI 契約反映）"
    - number: 1128
      purpose: "前提 Task（apps/api 実装）"
  related_prs:
    - number: 359
      purpose: "契約仕様書 develop merge"
    - number: 1120
      purpose: "実装仕様書 Epic Branch merge"
    - number: 1127
      purpose: "OpenAPI Contract Epic Branch merge"
    - number: 1129
      purpose: "apps/api 実装 Epic Branch merge"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "test-ai"
  support:
    - "worker-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Phase4b 縦串（実装仕様書 → OpenAPI Contract → apps/api 実装 → 単体テスト）の 4/4 である。
  実装 Task（#1128 / PR #1129）により `apps/api/src/app/recommendations/**` と最小スモークテスト（`recommendations.smoke.test.ts`）が親 Epic Branch に merge 済みである。
  実装 Task の `out_of_scope` として網羅的単体テストは本 Task に委譲されていた。
  本 Task では reco-client / Repository をスタブ差し替えし、Validation・Response マッピング・Public フィルタ・Error Mapper・trace meta・createRecoClient 利用を unit 範囲で検証する。
  本 Task 完了後、Epic #357 の Phase4b 縦串は完了し、Epic PR → develop 統合の判断へ進む。

objective: |
  API-PUB-002 Public API 層の単体テストを契約仕様書 §12（contract / unit 相当）および実装仕様書 §10 の unit 範囲に沿って整備し、`node:test` で再現可能な検証を提供する。
  既存スモークテストを活かしつつ、不足観点（Validation 追加・予算整合・Public フィルタ網羅・Error Mapper・trace・createRecoClient mode）を追加する。

scope:
  - "Public API 層単体テストの追加・拡充（`apps/api/tests/unit/app/recommendations/**`）"
  - "契約仕様書 §12 の unit 相当観点（validation / 0 件 / 予算矛盾 / Response 外形）のカバレッジ整理とテストケース追加"
  - "実装仕様書 §10 のうちスタブ reco-client / Repository で検証可能な unit 観点のテスト追加（No.3 Validation、No.6 Public フィルタ、No.8 createRecoClient）"
  - "既存スモークテスト（`recommendations.smoke.test.ts`）の維持・整理（fixture 共通化は過剰にしない）"
  - "テスト用 fixture / helper の整理（recommendations 層テスト専用）"
  - "親 Epic `epic_scope.allowed_paths` への `apps/api/tests/unit/app/recommendations/**` 追記（#1129 でのスモークテスト追加と整合）"
  - "Task / Review Definition 整備（本ファイルおよび `prompts/definitions/reviews/api-pub-002-recommendation-run/unit-test/pr-review.yaml`）"

out_of_scope:
  - "integration test（実 reco 接続・DB 実接続・LLM 障害シミュレーション）"
  - "e2e test / contract test（OpenAPI generated client typecheck）"
  - "OpenAPI / generated / packages/contracts 変更"
  - "apps/reco/** の変更"
  - "apps/web/** の変更"
  - "apps/api/src/infrastructure/reco-client/** の機能追加（テスト成立に必要な最小修正のみ可。要 PR 説明）"
  - "Public API 層の機能追加（バグ修正のみ可）"
  - "本番 DB / 外部 API 依存テスト"
  - "実装仕様書 §11 未決事項の仕様確定（Human Review / 別 Task）"

input:
  docs:
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
      required: true
      purpose: "§12 契約面テスト観点・Validation・Response schema の正本"
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API実装仕様書.md"
      required: true
      purpose: "§10 実装テスト観点・マッピング・エラー・trace の正本"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
      purpose: "GRS-* 期待値"
    - path: "docs/05_アプリケーション設計/アプリ/api/API設計方針書.md"
      required: false
      purpose: "Public Error / タイムアウト方針の参照"
    - path: "docs/04_ドメインモデル設計/RecommendationRequest定義書.md"
      required: false
      purpose: "テスト入力 fixture 設計"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: false
      purpose: "テスト期待値設計"
  templates: []
  files:
    - path: "apps/api/src/app/recommendations/**"
      required: true
      purpose: "テスト対象"
    - path: "apps/api/tests/unit/app/recommendations/recommendations.smoke.test.ts"
      required: true
      purpose: "既存スモークテスト（拡充起点）"
    - path: "apps/api/src/lib/reco-client/factory.ts"
      required: true
      purpose: "createRecoClient DI（スタブ差し替え境界）"
    - path: "apps/api/package.json"
      required: true
      purpose: "test / build スクリプト確認"
  issues:
    - number: 1128
      purpose: "前提 Task（実装）"
    - number: 364
      purpose: "前提 Task（API実装仕様書）"
    - number: 1126
      purpose: "前提 Contract Task（OpenAPI）"
  prs:
    - number: 1129
      purpose: "前提 PR（実装）"
    - number: 1127
      purpose: "前提 PR（OpenAPI Contract）"
    - number: 1120
      purpose: "前提 PR（実装仕様書）"

output:
  docs: []
  files:
    - path: "prompts/definitions/epics/api-pub-002-recommendation-run/epic.yaml"
      action: "update"
      required: false
  tests:
    - path: "apps/api/tests/unit/app/recommendations/recommendations.smoke.test.ts"
      action: "update"
      required: true
    - path: "apps/api/tests/unit/app/recommendations/**"
      action: "create_or_update"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "契約仕様書 §12 unit 相当観点・実装仕様書 §10 unit 観点に対応する node:test テストスイート"
  - "テスト観点とテストケースの対応表（PR 本文またはコメント）"
  - "`pnpm --filter @gift-recommendation/api test` 実行結果（成功ログ）"
  - "親 Epic epic_scope.allowed_paths への tests パス追記（必要時）"
  - "Task / Review Definition（本ファイル・pr-review.yaml）"

acceptance_criteria:
  - "契約仕様書 §12 の unit 相当観点（validation / 0 件 / 予算矛盾 / Response 外形）がテストケースとしてカバーされている（対応表を PR に記載）"
  - "実装仕様書 §10 の unit 観点（No.3 Validation、No.6 Public フィルタ、No.8 createRecoClient）がカバーされている"
  - "既存スモークテストが引き続き成功する"
  - "`pnpm --filter @gift-recommendation/api build` が SUCCESS"
  - "`pnpm --filter @gift-recommendation/api test` が SUCCESS"
  - "integration 観点（実装仕様書 §10 No.1, 2, 4, 5, 7, 9 等）は本 Task で未実施であることを PR に明記している"
  - "テストが本番 DB / 外部 API / secret に依存していない"
  - "Public API 層の不要な機能変更を含まない（テスト成立に必要な最小修正のみ）"
  - "OpenAPI / generated / apps/reco / apps/web の変更を含まない"
  - "epic_scope 内に差分が収まっている"
  - "secret、APIキー、.env 実値が含まれていない"

