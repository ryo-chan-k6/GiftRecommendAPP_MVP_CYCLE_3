    - "unit test"
    - "api build（typecheck）"
    - "coverage mapping（§12 / §10 unit 観点との対応）"
    - "secret check"
  commands:
    - "pnpm --filter @gift-recommendation/api build"
    - "pnpm --filter @gift-recommendation/api test"
  manual_checks:
    - "§12 / §10 unit 観点ごとに対応テストケース名または PR 表でトレースできることを確認する"
    - "スタブ reco-client / Repository 前提で安定して再現可能であることを確認する"
    - "テスト fixture に実データ・secret が含まれていないことを確認する"
    - "apps/api/src/app/recommendations/** への変更がテスト成立に必要な最小限であることを確認する"
  not_required:
