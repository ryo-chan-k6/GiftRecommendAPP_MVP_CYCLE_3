  - "契約仕様書 §12 / 実装仕様書 §10 と実装の乖離があり、テスト追加前に実装修正が必要な場合（別 Task または Human 判断）"
  - "integration test が必要と判断され scope を超える場合"
  - "OpenAPI / generated / DB schema 変更が必要になった場合"
  - "secret や .env 実値をテストに含める必要が出た場合"

