schema_version: "1.0"
definition_type: "task"

task:
  id: "task-api-pub-002-recommendation-run-api-spec"
  title: "API-PUB-002:レコメンド実行API仕様書作成"
  summary: "API-PUB-002（レコメンド実行 / Public API、POST /api/v1/recommendations）の個別API仕様書（API-PUB-002_レコメンド実行API仕様書.md）を、API設計方針書・API一覧・Recommendation Request/Result定義書・エラーコード定義書・ログ・Observability設計書・API-INT-002仕様書（連携先）に基づいて作成する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]API-PUB-002:レコメンド実行"
  epic_issue_number: null  # 実Issue起票後に追記。/start-task §5.1 で GitHub 実在確認。
  epic_branch: "feature/epic-<issue-number>-api-pub-002-recommendation-run"
  related_issues: []
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
    - "contract-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "contract-ai"

background: |
  06_実装設計において、apps/api 実装・OpenAPI（paths/recommendations）定義・Orval 生成・apps/web の api-client 利用・E2E テスト設計の前提となる Public API 仕様書を作成する。
  本Taskでは、API一覧の API-PUB-002（レコメンド実行 / Public API）を対象に、web→api 間の Request / Response / Error / Validation / 処理概要 / provider-consumer 影響を整理する。
  api→reco 間の Internal API（API-INT-002 / `POST /internal/reco/v1/recommendations/run`）は本Taskの対象外（[Task]API-INT-002:Reco推薦実行API仕様書作成 で仕様化）であり、本Taskでは「内部で API-INT-002 を呼び出す」点とリクエスト/レスポンス変換方針のみ記載する。

objective: |
  API-PUB-002（レコメンド実行 / Public API、`POST /api/v1/recommendations`）について、apps/api 実装・OpenAPI 化・Contract Task 化・apps/web の api-client 利用・レビューが可能な粒度の個別API仕様書を作成する。
  作成する仕様書は prompts/templates/docs/api-spec.md に準拠する。

scope:
  - "API-PUB-002（レコメンド実行 / Public API）の個別API仕様書を新規作成する（成果物ファイル名: API-PUB-002_レコメンド実行API仕様書.md）"
  - "API基本情報（API ID / API種別 Public / Method POST / Endpoint /api/v1/recommendations / Base URL / Version / Provider apps/api / Consumer apps/web / 認証要否 / 冪等性 / MVP対象）を定義する"
  - "Request Header / Path Parameters / Query Parameters / Request Body（贈答相手・用途・予算・好み・避けたい条件・NG条件・表示件数等）を整理する"
  - "Response Header / Status Code / Response Body（推薦結果一覧・推薦理由・商品表示情報・外部EC URL・traceId 等）を整理する"
  - "Error Response仕様（GRS-REQ-* / GRS-REC-* / GRS-DB-* / GRS-LLM-* 等）を整理する"
  - "0件結果を正常系として返す方針（API一覧 §API-PUB-002 メモ）を明示する"
  - "バリデーション仕様を整理する"
  - "処理概要（apps/api 受付 → MOD-API-002 Validator → MOD-API-003 Application Service → MOD-API-004 Request Repository → MOD-API-005 Reco Client → API-INT-002 呼び出し → MOD-API-006 Response Mapper → web 返却）を Mermaid または文章で整理する"
  - "Request / Response と内部DTO・Recommendation Request / Result 定義のマッピングを整理する"
  - "provider（apps/api）/ consumer（apps/web）影響を整理する"
  - "OpenAPI / Orval / generated 方針（paths/recommendations 配下、api-client 再生成）を整理する"
  - "セキュリティ仕様・非機能仕様・ログ監視・テスト観点を整理する"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
  - "API-INT-002（Reco推薦実行 / Internal API、`POST /internal/reco/v1/recommendations/run`）の個別API仕様書作成"
  - "Reco モジュール（MOD-RECO-001〜029）本体の設計・実装"
  - "OpenAPI定義ファイル（openapi/paths/recommendations 等）の作成・更新"
  - "Orval設定ファイル（orval.config.ts）の作成・更新"
  - "generated API client（apps/web/src/lib/api-client/recommendations/generated/**）の再生成"
  - "apps/api の実装"
  - "apps/web の実装（画面側 SCR-002 等）"
  - "apps/reco の実装"
  - "DB schema 変更"
  - "DDL 作成・変更"
  - "認証・認可方式そのものの変更"
  - "API一覧全体の再設計"
  - "レコメンドアルゴリズムの変更"
  - "Recommendation Request / Result 定義書そのものの変更"
  - "画面仕様書（SCR-002 等）の作成"
  - "他 API（API-PUB-001 / 003〜008 / API-INT-001 / 002）の仕様書作成"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/api/API設計方針書.md"
      required: true
      purpose: "URL 設計、HTTP Method、認証、エラー形式、バージョニング等の API 設計方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "API-PUB-002 の endpoint（/api/v1/recommendations）、API種別（Public API）、Provider（apps/api）、Consumer（apps/web）、MVP対象（○）、関連画面、関連エラーコードを確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
      purpose: "Error Response、HTTP Status、GRS-REQ-* / GRS-REC-* / GRS-DB-* / GRS-LLM-* 等のエラーコード参照、ユーザー向け表示方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: true
      purpose: "API-PUB-002 の trace_id / access_log / phase_log / error_log / metric 対象を仕様書へ反映するため"
    - path: "docs/05_アプリケーション設計/アプリ/モジュール一覧.md"
      required: true
      purpose: "MOD-API-001（Recommendation Controller）/ MOD-API-002（Request Validator）/ MOD-API-003（Application Service）/ MOD-API-004（Request Repository）/ MOD-API-005（Reco Client）/ MOD-API-006（Response Mapper）の責務境界を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能一覧.md"
      required: true
      purpose: "レコメンド実行が対応する機能と MVP 対象範囲を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能×モジュール対応表.md"
      required: false
      purpose: "レコメンド実行 API と関連モジュールの対応を確認するため"
    - path: "docs/04_ドメインモデル設計/RecommendationRequest定義書.md"
      required: true
      purpose: "Recommendation Request のドメイン定義（贈答条件・予算・好み・避けたい条件・NG条件等）を Request Body へ反映するため"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: true
      purpose: "Recommendation Result のドメイン定義（推薦結果一覧・推薦理由・商品表示情報等）を Response Body へ反映するため"
    - path: "docs/04_ドメインモデル設計/Reason生成定義書.md"
      required: false
      purpose: "推薦理由を Response に含める場合の項目・禁止表現・根拠を確認するため"
    - path: "docs/04_ドメインモデル設計/Retrieval定義書.md"
      required: false
      purpose: "0件結果を正常系として扱う前提（候補抽出・Hard Filter）を確認するため"
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API仕様書.md"
      required: false
      purpose: "本Taskで Public API が内部呼び出しする API-INT-002 の Request / Response を参照するため（API-INT-002 Task 完了後に追記）。未作成時は API一覧の API-INT-002 行と Recommendation Request/Result 定義書を参照する"
    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: false
      purpose: "Public API の認証要否・権限条件・APIアクセス制御方針を確認するため。MVP では非認証想定だが、方針書側の確定状況に合わせて反映する"
    - path: "docs/03_ドメイン要件定義/非機能要件定義書/非機能要件定義書（目次）.md"
      required: false
      purpose: "レスポンスタイム、可用性、セキュリティ等の非機能要件を確認するため（詳細は同ディレクトリ配下の各要件文書を参照）"
  templates:
    - path: "prompts/templates/docs/api-spec.md"
      required: true
      purpose: "個別API仕様書を標準フォーマットで作成するため"
      applies_to:
        - "docs/06_実装設計/api/API-PUB-002_レコメンド実行API仕様書.md"
  files: []
  issues: []
  prs: []

output:
  docs:
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API仕様書.md"
