schema_version: "1.0"
definition_type: "task"

task:
  id: "task-api-pub-002-recommendation-run-api-contract-spec"
  title: "API-PUB-002:レコメンド実行API契約仕様書作成"
  summary: "API-PUB-002（レコメンド実行 / Public API、POST /api/v1/recommendations）の API 契約仕様書（API-PUB-002_レコメンド実行API契約仕様書.md）を、api-contract-spec.md 準拠で作成する。実装面は別 Task（api-implementation-spec.yaml）へ分離する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]API-PUB-002:レコメンド実行"
  epic_issue_number: 357
  epic_branch: "feature/epic-357-api-pub-002-recommendation-run"
  related_issues: []
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
    - "contract-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "contract-ai"

background: |
  Phase1 ① API契約仕様書（1a）として、API-PUB-002（レコメンド実行 / Public API）の契約面（Request / Response / Error / Validation / 互換性 / OpenAPI 反映方針）を確定する。
  実装フェーズ実行プロセス設計書 §4.1（分離後モデル）に従い、処理フロー・MOD-API 連携・内部 DTO マッピング・結合テスト観点などの実装面は本 Task の対象外とし、`api-implementation-spec.yaml` で Phase4 実装設計時に作成する。
  api→reco 間の Internal API（API-INT-002）は別 Epic/Task の対象。本 Task では Public I/F の契約確定に必要な範囲で API-INT-002 への参照方針のみ記載する（詳細処理は実装仕様書 Task へ）。

objective: |
  API-PUB-002（レコメンド実行 / Public API、`POST /api/v1/recommendations`）について、Contract Gate および後続 OpenAPI Contract Task の入力となる API 契約仕様書を作成する。
  成果物は prompts/templates/docs/api-contract-spec.md に準拠し、契約面のみを記載する（api-implementation-spec.md の章は含めない）。
  OpenAPI / Orval / generated の実ファイル変更は後続 Contract Task へ分離する。

scope:
  - "API-PUB-002 の API 契約仕様書を新規作成する（成果物: API-PUB-002_レコメンド実行API契約仕様書.md）"
  - "API基本情報（API ID / API種別 Public / Method POST / Endpoint /api/v1/recommendations / Base URL / Version / Provider apps/api / Consumer apps/web / 認証要否 / 冪等性 / MVP対象）を定義する"
  - "Request Header / Path Parameters / Query Parameters / Request Body（贈答相手・用途・予算・好み・避けたい条件・NG条件・表示件数等）を整理する"
  - "Response Header / Status Code / Response Body（推薦結果一覧・推薦理由・商品表示情報・外部EC URL・traceId 等）を整理する"
  - "Error Response仕様（GRS-REQ-* / GRS-REC-* / GRS-DB-* / GRS-LLM-* 等）を整理する"
  - "0件結果を正常系として返す方針（API一覧 §API-PUB-002 メモ）を明示する"
  - "バリデーション仕様を整理する"
  - "OpenAPI / Orval / generated 反映方針（packages/contracts/openapi/public-api.yaml、apps/web/src/generated/api/ 再生成）を整理する（方針のみ。ファイル変更は out_of_scope）"
  - "互換性・破壊的変更・契約面テスト観点を整理する"
  - "API-INT-002 への内部呼び出しは契約上の前提として参照方針のみ記載する（処理フロー・モジュール責務の詳細は実装仕様書 Task へ）"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
  - "API実装仕様書（api-implementation-spec.md 準拠）の作成（prompts/definitions/tasks/api-pub-002-recommendation-run/api-implementation-spec.yaml）"
  - "処理概要（MOD-API-002〜006 の詳細フロー）・内部 DTO マッピング・provider/consumer 実装影響の詳細・結合テスト観点の確定"
  - "API-INT-002（Reco推薦実行 / Internal API）の個別API仕様書作成"
  - "Reco モジュール（MOD-RECO-001〜029）本体の設計・実装"
  - "OpenAPI定義ファイル（packages/contracts/openapi/public-api.yaml 等）の作成・更新"
  - "Orval設定ファイル（orval.config.ts）の作成・更新"
  - "generated API client（apps/web/src/generated/api/）の再生成"
  - "apps/api の実装"
  - "apps/web の実装（画面側 SCR-002 等）"
  - "apps/reco の実装"
  - "DB schema 変更"
  - "DDL 作成・変更"
  - "認証・認可方式そのものの変更"
  - "API一覧全体の再設計"
  - "レコメンドアルゴリズムの変更"
  - "Recommendation Request / Result 定義書そのものの変更"
  - "画面仕様書（SCR-002 等）の作成"
  - "他 API（API-PUB-001 / 003〜008 / API-INT-001 / 002）の仕様書作成"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/api/API設計方針書.md"
      required: true
      purpose: "URL 設計、HTTP Method、認証、エラー形式、バージョニング等の API 設計方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "API-PUB-002 の endpoint、API種別、Provider、Consumer、MVP対象、関連画面、関連エラーコードを確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
      purpose: "Error Response、HTTP Status、GRS-* エラーコード参照、ユーザー向け表示方針を確認するため"
    - path: "docs/04_ドメインモデル設計/RecommendationRequest定義書.md"
      required: true
      purpose: "Recommendation Request のドメイン定義を Request Body へ反映するため"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: true
      purpose: "Recommendation Result のドメイン定義を Response Body へ反映するため"
    - path: "docs/04_ドメインモデル設計/Reason生成定義書.md"
      required: false
      purpose: "推薦理由を Response に含める場合の項目・禁止表現・根拠を確認するため"
    - path: "docs/04_ドメインモデル設計/Retrieval定義書.md"
      required: false
      purpose: "0件結果を正常系として扱う前提を確認するため"
    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: false
      purpose: "Public API の認証要否・権限条件を確認するため"
    - path: "docs/03_ドメイン要件定義/非機能要件定義書/非機能要件定義書（目次）.md"
      required: false
      purpose: "契約面に影響する非機能要件を確認するため"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase1 1a（契約面のみ）と Phase4 実装仕様書分離の正本を確認するため"
  templates:
    - path: "prompts/templates/docs/api-contract-spec.md"
      required: true
      purpose: "API 契約仕様書の標準フォーマット"
      applies_to:
        - "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
  files: []
  issues: []
  prs: []

output:
  docs:
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
      action: "create"
      required: true
      template: "prompts/templates/docs/api-contract-spec.md"
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "API-PUB-002（レコメンド実行）API 契約仕様書（API-PUB-002_レコメンド実行API契約仕様書.md）"
  - "Request / Response / Error Response / Validation 定義"
  - "0件結果の正常系方針"
  - "OpenAPI / Orval / generated 反映方針（方針整理のみ）"
  - "互換性・契約面テスト観点"
  - "未決事項・人間判断事項の整理"

acceptance_criteria:
  - "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md が作成されている"
  - "prompts/templates/docs/api-contract-spec.md に準拠している（実装面章・内部処理詳細を含まない）"
  - "API設計方針書と矛盾する URL / HTTP Method / 認証 / Error 形式を定義していない"
  - "API一覧の API-PUB-002 と矛盾する endpoint / HTTP Method / API種別 / MVP対象 / Provider / Consumer / 関連画面 を定義していない"
  - "Recommendation Request 定義書に基づいて Request Body が整理されている"
  - "Recommendation Result 定義書に基づいて Response Body が整理されている"
  - "Error Response とエラーコードがエラーコード定義書と整合している"
  - "0件結果を正常系として返す方針が明記されている（API一覧 §API-PUB-002 メモ準拠）"
  - "OpenAPI / Orval / generated の扱いと Contract Task 分離方針が記載されている"
  - "本Task内で OpenAPI / Orval / generated / 実装ファイルを変更していない"
  - "api-implementation-spec.md 相当の処理フロー・MOD-API 詳細・結合テスト観点を本成果物に含めていない"
  - "Task タイトル・成果物ファイル名が分離後モデル（契約/実装の別成果物）と整合している"
  - "未決事項がある場合、未決事項として明記されている"
  - "secret、APIキー、.env 実値、接続文字列の実値を含んでいない"
  - "Human Review で確認してほしい事項が明記されている"

