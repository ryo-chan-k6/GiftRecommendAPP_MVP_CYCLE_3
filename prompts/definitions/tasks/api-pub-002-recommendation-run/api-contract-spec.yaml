  - "必須 `input.templates` が存在しない場合"
  - "必須 `input.docs` 間に矛盾があり、AI Agent だけで判断できない場合"
  - "API一覧に API-PUB-002 が存在しない場合"
  - "正式 Endpoint / HTTP Method / API種別 が確定できない場合"
  - "Recommendation Request / Result 定義書と API 契約の対応が確定できない場合"
  - "実装面仕様の作成が必要と判明した場合（api-implementation-spec Task へ分離）"
  - "OpenAPI 変更が必要になった場合（Contract Task として分離）"
  - "Orval 再生成が必要になった場合（Contract Task として分離）"
  - "generated ファイルの手動編集が必要に見える場合"
  - "DB schema 変更が必要になった場合"
  - "認証・認可仕様変更が必要になった場合"
  - "secret や .env 実値を扱う必要が出た場合"
  - "scope 外の実装作業が必要になった場合"
  - "本Task差分が親 Epic #357 の epic_scope.allowed_paths から外れた場合"

notes:
  - "本Taskは Phase1 ① API契約仕様書（1a）。実装フェーズ実行プロセス設計書 §4.1・§5 Phase1 に準拠。"
  - "実装面は prompts/definitions/tasks/api-pub-002-recommendation-run/api-implementation-spec.yaml（Phase4 実装設計。API-INT-002 仕様書完了後を推奨）。"
  - "Human 判断（2026-06-02）: 契約面と実装面の Task 分離（推奨案 B）を採用。旧統合モデル（1ファイルに両テンプレ）は本 Task では適用しない。"
  - "Issue #358 / Epic #357。OpenAPI・Orval・generated・apps 実装は Contract Task / 実装 Task へ分離。"
  - "出力先は docs/06_実装設計/api/（プロジェクトディレクトリ構成定義書 §10.5）。"
