risk_points:
  - "契約面のみに絞った結果、API-INT-002 未確定時に Response 項目の確定が遅れる可能性"
  - "Public Response に reason / score / debug 情報をどこまで含めるか判断が必要になる可能性"
  - "MVP の認証要否（非認証想定）と認証・認可方針書との差異が判明する可能性"
  - "後続 OpenAPI Contract Task で契約仕様書との差分修正が必要になる可能性"

human_decision_points:
  - "API-PUB-002 の正式 Endpoint（`POST /api/v1/recommendations`）と認証要否（MVP では非認証）の最終確認"
  - "Response Body に含める reason / score / debug 情報 / trace 情報の範囲（契約面として確定する範囲）"
  - "0件結果を 200 OK + 空配列 で返すかの最終確認（API一覧では正常系扱い）"
  - "OpenAPI（paths/recommendations）更新を後続 Contract Task として分離するかの確認"

stop_conditions:
