background: |
  Phase4b 評価・改善系。Epic #1522 bootstrap 済み。MVP △。出力 feedback_analysis_result / feedback_metric は物理未整備。
  物理書込 IF = IF-DB-BATCH-019（論理契約）。scaffold は in-memory / stub。migration 禁止・物理 DDL は別 DB Task。
  入力 recommendation_feedback は DDL 整備済み（api / IF-DB-API-002）。本 Batch は SELECT のみ。
  モジュール: MOD-BATCH-042。Aggregator / Classifier は内部責務。043/044 は out of scope。
  MOD-BATCH-019（Raw Product Reader）≠ Batch ID BATCH-019。
  workflow: 独立子 batch-feedback-analysis.yml。親接続は後続。
  Contract Gate 不要。§18.2 Human 判断（feedback_metric 物理化・冪等・status 等）は推奨案どおり Human 確定済み（§18.1 No.17〜23）。

objective: |
  BATCH-019 バッチ仕様書を作成し、後続実装・UT の入力正本とする。

scope:
  - "BATCH-019_Feedback分析バッチ仕様書.md 新規作成"
  - "IF-DB-BATCH-019 論理契約・scaffold in-memory/stub・migration 禁止・別 DB Task の明記"
  - "入力 recommendation_feedback・任意 SELECT 参照の明記"
  - "MOD-BATCH-042・043/044 out of scope・MOD-BATCH-019 混同禁止"
  - "独立子 batch-feedback-analysis.yml・Contract Gate 不要・secret 禁止"
  - "冪等キー候補・feedback_analysis_status 読み替え・feedback_metric 方針を §18 に確定反映"
  - "Task / Review Definition"

out_of_scope:
