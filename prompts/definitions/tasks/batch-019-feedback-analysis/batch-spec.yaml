  - "supabase/migrations/** および出力テーブル物理 DDL 本整備"
  - "MOD-BATCH-043 / 044 本格実装・自動 Issue 起票"
  - "週次親 workflow 全体改修"
  - "apps/reco / apps/api / apps/web 破壊変更 / OpenAPI 変更"
