schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-parent-schedule-phase2-daily-rerun-d1"
  title: "batch-parent-schedule-phase2:daily親D1再実行検証"
  summary: "daily親を低max_itemsで再実行し、初回D1のBATCH-017 PARTIAL解消を親全体で確認・正本化する。"
  type: "test"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-parent-schedule-phase2:daily schedule有効化再判断"
  epic_issue_number: 1732
  epic_branch: "chore/epic-1732-batch-parent-schedule-phase2"
  related_issues:
    - 1715
    - 1717
    - 1726
    - 1735
    - 1739
  related_prs:
    - 1736
    - 1740

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  #1715 のdaily親D1はBATCH-017で失敗しPARTIALだった。その後#1717 / #1726で
  pipeline batch_run_log / UUID前提を修正したが、daily親全体での再実行PASSは未確認。
  #1739のシステムエラー通知チャンネルUI到達はHuman確認済みだがdocsは確認待ち表記である。

objective: |
  daily親をschedule無効のまま低max_itemsでworkflow_dispatchし、
  BATCH-017 PARTIAL解消と後段needs連鎖を親全体で確認して正本docsへ記録する。

scope:
  - "daily親workflow_dispatch（max_items=1, run_retry_after=false）"
  - "親・複合子・葉jobのconclusion確認"
  - "BATCH-017 import_summaryの再確認"
  - "初回D1 PARTIALとの差分・判定の正本化"
  - "#1739システムエラー通知チャンネルUI到達Human確認の正本反映"
  - "案B再判断材料への結果反映"

out_of_scope:
  - "on.scheduleコメント解除"
  - "production定期実行"
  - "weekly / manual親の実行"
  - "run_retry_after=true"
  - "失敗原因に対するsource / workflow修正"
  - "GitHub Variables / Secretsの値の表示・変更"
  - "API / DB / OpenAPI / generated変更"

input:
  docs:
    - path: "docs/15_運用・改善/運用手順/親workflow手動検証手順_D1.md"
      required: true
    - path: "docs/15_運用・改善/運用手順/親workflow手動検証結果_D1.md"
      required: true
    - path: "docs/15_運用・改善/運用手順/BATCH_import連鎖_GHA_live化メモ_C3.md"
      required: true
    - path: "docs/15_運用・改善/運用手順/親workflow_daily_schedule案B再判断材料.md"
      required: true
    - path: "docs/15_運用・改善/運用手順/親workflow_Slack失敗通知E2E結果.md"
      required: true
  files:
    - path: ".github/workflows/batch-daily-orchestrator.yml"
      required: true

output:
  docs:
    - path: "docs/15_運用・改善/運用手順/親workflow_daily再検証結果_D1.md"
      action: "create"
      required: true
    - path: "docs/15_運用・改善/運用手順/親workflow_daily_schedule案B再判断材料.md"
      action: "update"
      required: true
    - path: "docs/15_運用・改善/運用手順/親workflow_Slack失敗通知E2E結果.md"
      action: "update"
      required: true
  files:
    - path: "prompts/definitions/tasks/batch-parent-schedule-phase2/daily-rerun-d1.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-parent-schedule-phase2/daily-rerun-d1/pr-review.yaml"
      action: "create"
      required: true
  generated:
    expected: false
    paths: []
    handling: "generated差分なし"

deliverables:
  - "daily親D1再検証結果docs"
  - "案B再判断材料への結果反映"
  - "Slack UI到達Human確認の正本反映"
  - "Task / Review Definition"

acceptance_criteria:
  - "daily親をmax_items=1 / run_retry_after=falseで実行している"
  - "Run URL・ref・inputs・親/各job conclusionをsecretなしで記録している"
  - "BATCH-017 import_summaryの結果を明示している"
  - "初回D1 PARTIALとの差分と最新判定を明示している"
  - "#1739新チャンネルUI到達をHuman確認済みとして記録している"
  - "schedule有効化・source / workflow修正を含まない"
  - "Related to Task Issue / PR target = 親Epic Branch"

branch:
  no_branch: false
  summary: "batch-daily-rerun-d1"
  base: "chore/epic-1732-batch-parent-schedule-phase2"
  target: "chore/epic-1732-batch-parent-schedule-phase2"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    status: "In Progress"
    phase: "07_開発・単体テスト"
    priority: "high"
    planned_start: "2026-07-30"
    due_date: "2026-08-01"

issue:
  unit: "task"
  type: "test"
  area: "batch"
  number: 1742

dependencies:
  epics:
    - 1732
  notes: "#1717 / #1726 / #1739完了前提。stg Environment承認が必要な場合はHuman対応を待つ。"

parallel_control:
  exclusive_files:
    - "docs/15_運用・改善/運用手順/親workflow_daily再検証結果_D1.md"
    - "docs/15_運用・改善/運用手順/親workflow_daily_schedule案B再判断材料.md"
    - "docs/15_運用・改善/運用手順/親workflow_Slack失敗通知E2E結果.md"
    - "prompts/definitions/tasks/batch-parent-schedule-phase2/daily-rerun-d1.yaml"
    - "prompts/definitions/reviews/batch-parent-schedule-phase2/daily-rerun-d1/pr-review.yaml"
  notes: "workflow / sourceは変更しない"

contract_gate:
  required: false
  gate_id: null
  prerequisite_contract_tasks: []
  verify_at: []
  blocked_message: null

test_policy:
  required:
    - "daily親workflow_dispatch E2E"
    - "親・各job conclusion確認"
    - "BATCH-017 import_summary確認"
    - "Markdown / secret非含有確認"
  commands: []
  not_required:
    - "アプリunit test"
  skip_reason:
    app_tests: "実運用workflow E2Eとdocs更新のみ"

review:
  ai_review_required: true
  human_review_required: true
  specialist_reviews:
    docs: true
    test: true
    contract: false
    security: true
  review_points:
    - "実際のRun結果とdocsのconclusionが一致するか"
    - "BATCH-017 PARTIAL解消可否を過大評価していないか"
    - "案B採用をAIが確定していないか"
    - "schedule / workflow / source変更が混入していないか"
    - "secret / channel ID実値を含まないか"

human_decision_points:
  - "stg Environment承認"
  - "再検証結果を踏まえた案B採否"

stop_conditions:
  - "stg Environment承認が必要"
  - "Runが失敗し修正方針の選択が必要"
  - "Variables / Secrets実値の閲覧・変更が必要"
  - "schedule有効化が必要に見える"

operation_logging:
  issue: true
  pr: true
  slack: true
  ai_logs: false
