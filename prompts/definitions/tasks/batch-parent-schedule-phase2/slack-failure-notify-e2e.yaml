schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-parent-schedule-phase2-slack-failure-notify-e2e"
  title: "batch-parent-schedule-phase2:Slack失敗通知E2E検証"
  summary: "daily親のnotify_failure経路でSlack実送信を安全に検証し、結果を正本docsへ記録する。schedule有効化は行わない。"
  type: "test"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-parent-schedule-phase2:daily schedule有効化再判断"
  epic_issue_number: 1732
  epic_branch: "chore/epic-1732-batch-parent-schedule-phase2"
  related_issues:
    - 1730
    - 1733
    - 1637
  related_prs:
    - 1734

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  #1730 / #1729 で daily / weekly 親に Slack 失敗通知を配線済みだが、
  実送信 E2E は未確認。案B再判断材料（#1733）§9 の high 優先候補である。

objective: |
  Batch Daily Orchestrator の notify_failure 経路で Slack へ失敗通知が届くことを
  低コスト・低破壊で確認し、secret なしで結果を正本 docs に残す。

scope:
  - "daily 親 notify_failure の E2E（意図的失敗による発火）"
  - "GHA job log / summary から送信成否を確認（secret 非出力）"
  - "結果 docs の正本化（Run URL・失敗 job・成否・残リスク）"
  - "案B再判断材料への E2E 結果反映（必要最小）"
  - "一時的な意図的失敗 job は検証後に除去し、最終差分に残さない"

out_of_scope:
  - "on.schedule コメント解除"
  - "production 定期実行"
  - "weekly / manual 親の E2E（別 Task）"
  - "daily 親 D1 再実行の全面検証（別 Task）"
  - "GitHub Secrets / Variables の値の表示・変更"
  - "Slack token / channel ID 実値の docs 記載"
  - "成功通知の新設"
  - "API / DB / OpenAPI / generated 変更"

input:
  docs:
    - path: "docs/15_運用・改善/運用手順/親workflow_daily_schedule案B再判断材料.md"
      required: true
    - path: "docs/06_実装設計/github_actions/Slack通知共通ワークフロー仕様書.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ親workflow_schedule有効化ギャップ一覧.md"
      required: true
  files:
    - path: ".github/workflows/batch-daily-orchestrator.yml"
      required: true
    - path: ".github/scripts/slack-notify.cjs"
      required: true

output:
  docs:
    - path: "docs/15_運用・改善/運用手順/親workflow_Slack失敗通知E2E結果.md"
      action: "create"
      required: true
    - path: "docs/15_運用・改善/運用手順/親workflow_daily_schedule案B再判断材料.md"
      action: "update"
      required: false
  files:
    - path: "prompts/definitions/tasks/batch-parent-schedule-phase2/slack-failure-notify-e2e.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-parent-schedule-phase2/slack-failure-notify-e2e/pr-review.yaml"
      action: "create"
      required: true
  generated:
    expected: false
    paths: []
    handling: "generated差分なし"

deliverables:
  - "Slack失敗通知 E2E 結果 docs"
  - "Task / Review Definition"
  - "（任意）案B再判断材料への結果反映"

acceptance_criteria:
  - "notify_failure が意図的失敗で発火した Run が記録されている"
  - "Slack 送信成否が GHA log/summary 根拠で記載されている（secret なし）"
  - "channel 到達の Human 確認要否が明示されている"
  - "最終差分に意図的失敗 job / schedule 有効化が含まれていない"
  - "Related to Task Issue / PR target = 親Epic Branch"

branch:
  no_branch: false
  summary: "batch-schedule-slack-e2e"
  base: "chore/epic-1732-batch-parent-schedule-phase2"
  target: "chore/epic-1732-batch-parent-schedule-phase2"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    status: "In Progress"
    phase: "07_開発・単体テスト"
    priority: "high"
    planned_start: "2026-07-30"
    due_date: "2026-08-01"

issue:
  unit: "task"
  type: "test"
  area: "batch"
  number: 1735

dependencies:
  epics:
    - 1732
  notes: "#1730 配線完了前提。#1733 判断材料の後続 high 候補。"

parallel_control:
  exclusive_files:
    - "docs/15_運用・改善/運用手順/親workflow_Slack失敗通知E2E結果.md"
    - "prompts/definitions/tasks/batch-parent-schedule-phase2/slack-failure-notify-e2e.yaml"
    - "prompts/definitions/reviews/batch-parent-schedule-phase2/slack-failure-notify-e2e/pr-review.yaml"
  notes: "最終PRに daily/weekly orchestrator YAML の恒久変更を含めない"

contract_gate:
  required: false
  gate_id: null
  prerequisite_contract_tasks: []
  verify_at: []
  blocked_message: null

test_policy:
  required:
    - "Slack失敗通知 E2E（意図的失敗 → notify_failure → postSlackMessage 成否確認）"
  commands: []
  not_required:
    - "アプリ unit test"
  skip_reason:
    app_tests: "workflow通知経路のE2Eが対象。アプリコード変更なし"

review:
  ai_review_required: true
  human_review_required: true
  specialist_reviews:
    docs: true
    test: true
    contract: false
    security: true
  review_points:
    - "secret / token / channel ID 実値が docs に含まれていないか"
    - "最終差分に意図的失敗 job や schedule 有効化が残っていないか"
    - "E2E結果が事実・推論・未確認・Human確認事項に分離されているか"
    - "PR targetが親Epic Branchか"

human_decision_points:
  - "Slack channel への実メッセージ到達確認（GHA上の ok と実UI確認の差）"
  - "incident メンションの運用可否"

stop_conditions:
  - "Secrets/Variables 実値の閲覧が必要になった"
  - "stg Environment 承認待ちで検証が進まず方針変更が必要"
  - "schedule 有効化が必要に見える"

operation_logging:
  issue: true
  pr: true
  slack: true
  ai_logs: false
