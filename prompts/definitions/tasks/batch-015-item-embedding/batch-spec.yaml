background: |
  Phase4b Item Embedding 生成段。Epic #1479 bootstrap 済み。BATCH-014 develop merge 済み（#1467 / PR #1477）。
  物理書込 IF = IF-VEC-BATCH-001。外部呼出 IF = IF-EXT-005。IF-DB-BATCH-015 は BATCH-014 handoff（混同禁止）。
  MVP 初版は scaffold-first。Queue 終端 succeeded は本 Batch。Contract Gate 不要。

objective: |
  BATCH-015 バッチ仕様書を作成し、後続実装・UT の入力正本とする。

scope:
  - "BATCH-015_Item Embedding生成バッチ仕様書.md 新規作成"
  - "IF-VEC-BATCH-001 / IF-EXT-005 / IF-DB-BATCH-015（BATCH-014）/ IF-DB-BATCH-016（BATCH-016）境界の明記"
  - "冪等キー item_id + model_version_id + embedding_input_hash"
  - "scaffold-first・api_call_log・Queue 終端 succeeded・独立 workflow batch-item-embedding.yml"
  - "MOD-BATCH-036/037 と MOD-BATCH-015（Recheck）混同防止"
  - "Task / Review Definition"

out_of_scope:
  - "Python 実装・workflow YAML 本体・UT"
  - "BATCH-014 再実装 / BATCH-016 以降"
  - "apps/reco 破壊変更 / migration / 親チェーン全体改修"
  - "本番 OpenAI 実呼出の強制"

