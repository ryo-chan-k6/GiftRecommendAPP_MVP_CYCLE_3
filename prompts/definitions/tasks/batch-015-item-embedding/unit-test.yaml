schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-015-item-embedding-unit-test"
  title: "BATCH-015:Item Embedding生成Batch単体テスト"
  summary: "BATCH-015 実装に対し、仕様書 §16 の unit 観点カバレッジを整理・拡充する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]BATCH-015:Item Embedding生成Batch"
  epic_issue_number: 1479
  epic_branch: "feature/epic-1479-batch-015-item-embedding"
  related_issues:
    - number: 1482
      purpose: "実装（CLOSED）"
    - number: 1480
      purpose: "仕様書（CLOSED）"
  related_prs:
    - number: 1485
      purpose: "実装 MERGED"
    - number: 1481
      purpose: "仕様書 MERGED"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "test-ai"
  support:
    - "worker-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  実装 Task #1482 / PR #1485 は Epic Branch merge 済み。§16 unit 観点を拡充する。
  既存 test_item_embedding.py には実装タスクで作成された 16 件の最小 UT が存在する。

objective: |
  BATCH-015 の単体テストを仕様書 §16 に沿って充足し、Epic 縦串を完了可能にする。

scope:
  - "§16 unit 観点カバレッジ表を PR 本文に記載"
  - "test_item_embedding.py 拡充"
  - "Task / Review Definition"

out_of_scope:
  - "integration test（実 DB）"
  - "Epic PR develop merge（Human）"
  - "機能追加を主目的とする実装変更"
  - "apps/reco / BATCH-016 以降"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-015_Item Embedding生成バッチ仕様書.md"
      required: true
      purpose: "§16 テスト観点の正本"
  files:
    - path: "apps/batch/tests/unit/application/test_item_embedding.py"
      required: true
      purpose: "既存最小 UT（16 件）"
    - path: "apps/batch/src/batch/application/item_embedding/**"
      required: true
      purpose: "テスト対象実装"

output:
  files:
    - path: "prompts/definitions/tasks/batch-015-item-embedding/unit-test.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-015-item-embedding/unit-test/pr-review.yaml"
      action: "create"
      required: true
  tests:
    - path: "apps/batch/tests/unit/application/test_item_embedding.py"
      action: "update"
      required: true

acceptance_criteria:
  - "§16 対応表が PR 本文にある"
  - "不足 unit 観点が fixture/mock で追加されている"
  - "pytest 成功（対象ファイル + tests/unit 全体）"
  - "secret 非含有"
  - "PR target が親 Epic Branch"

branch:
  no_branch: false
  name: "test/task-1486-batch-015-item-embedding-unit-test"
  summary: "batch-015-item-embedding-unit-test"
  base: "feature/epic-1479-batch-015-item-embedding"
  target: "feature/epic-1479-batch-015-item-embedding"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "In Progress"
    priority: "high"

issue:
  number: 1486
  unit: "task"
  type: "test"
  area: "batch"

contract_gate:
  required: false

parallel_control:
  exclusive_files:
    - "apps/batch/tests/unit/application/test_item_embedding.py"
  conflict_risk: "low"

test_policy:
  required:
    - "batch unit test（BATCH-015 §16）"
  commands:
    - "cd apps/batch && uv run python -m pytest tests/unit/application/test_item_embedding.py -q --tb=short"
    - "cd apps/batch && uv run python -m pytest tests/unit -q --tb=short"
  not_required:
    - "integration test（実 DB）"
  skip_reason:
    "integration test（実 DB）": "fixture/mock を正とする"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "§16 対応表"
    - "実 DB / secret 非依存"
    - "PR target"
    - "IF-VEC-BATCH-001 Upsert・1536 次元・冪等再実行"
    - "IF-DB-BATCH-015 handoff 消費・hash 再算出なし"
    - "IF-DB-BATCH-016 非使用"
    - "Queue 終端 succeeded / フィルタ網羅 / skip"
    - "部分成功 GRS-BAT-002・concurrency GRS-BAT-003"
    - "api_call_log / fixture の secret・ベクトル全文非含有"
  specialist_reviews:
    test: true
    security: true

notes:
  - "後続: Epic PR → develop"
