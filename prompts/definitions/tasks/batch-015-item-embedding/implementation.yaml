  - "IF-VEC-BATCH-001 item_embedding Upsert（3 列冪等）"
  - "IF-DB-BATCH-015 handoff 消費のみ（hash 再算出禁止）"
  - "§9.3 skip（item_id + model_version_id + embedding_input_hash）"
  - "Queue 終端 succeeded（semantic 一連 / embedding 経路）"
  - "config BATCH_ITEM_EMBEDDING_*"
  - "batch-item-embedding.yml"
  - "最小 UT"
  - "Task / Review Definition"

out_of_scope:
  - "embedding_input_hash モジュール本体の編集"
  - "IF-DB-BATCH-016 / BATCH-016"
  - "apps/reco 本体変更"
  - "親 meaning-generation 全体改修 / 接続タイミング確定"
  - "OpenAPI / migration / generated 変更"
  - "実 DB 配線 / 実 OpenAI 呼出"
  - "包括的 UT Task"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-015_Item Embedding生成バッチ仕様書.md"
      required: true

output:
  files:
    - path: "apps/batch/src/batch/application/item_embedding/**"
      action: "create"
      required: true
    - path: ".github/workflows/batch-item-embedding.yml"
      action: "create"
      required: true
    - path: "apps/batch/src/batch/config/**"
      action: "modify"
      required: true
    - path: "apps/batch/src/batch/infrastructure/external_ai/**"
      action: "modify"
      required: false
  tests:
    - path: "apps/batch/tests/unit/application/test_item_embedding.py"
      action: "create"
      required: true

acceptance_criteria:
  - "主要 Phase が追跡できる"
  - "handoff 消費・skip・Upsert・Queue succeeded を UT 検証"
  - "hash 再算出しない / IF-DB-BATCH-016 非書込"
  - "scaffold 1536 次元 / embedding_source_type=item_text_context"
  - "非 scaffold-demo は exit 3"
  - "secret / ベクトル全文ログ非含有"

branch:
  no_branch: false
  name: "feature/task-1482-batch-015-item-embedding-implementation"
  summary: "batch-015-item-embedding-implementation"
  base: "feature/epic-1479-batch-015-item-embedding"
  target: "feature/epic-1479-batch-015-item-embedding"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "In Progress"
    priority: "high"

issue:
  number: 1482
  unit: "task"
  type: "feature"
  area: "batch"

contract_gate:
  required: false

parallel_control:
  exclusive_files:
    - "apps/batch/src/batch/application/item_embedding/**"
    - ".github/workflows/batch-item-embedding.yml"
  conflict_risk: "medium"

test_policy:
  required:
    - "batch unit test（BATCH-015 最小）"
  commands:
    - "cd apps/batch && uv run python -m pytest tests/unit/application/test_item_embedding.py -q --tb=short"

review:
