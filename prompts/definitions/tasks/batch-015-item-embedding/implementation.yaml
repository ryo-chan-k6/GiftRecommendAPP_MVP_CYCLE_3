  仕様書 #1480 / PR #1481 Epic Branch merge 済み。§18.1 で IF 区別 / scaffold-first / Queue 終端 / 独立子 workflow を確定。

objective: |
  scaffold-first 実装と batch-item-embedding.yml を整備する。

scope:
