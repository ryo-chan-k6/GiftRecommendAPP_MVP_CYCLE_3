work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]BATCH-015:Item Embedding生成Batch"
  epic_issue_number: 1479
  epic_branch: "feature/epic-1479-batch-015-item-embedding"
  related_issues:
    - number: 1480
      purpose: "仕様書（CLOSED）"
  related_prs:
    - number: 1481
      purpose: "仕様書 PR（MERGED）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

