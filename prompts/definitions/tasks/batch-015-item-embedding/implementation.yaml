    - "IF-DB-BATCH-016 非書込 / hash 再算出禁止"
    - "Queue 終端 succeeded が本 Batch"
    - "scaffold-first（実 OpenAI 非呼出）/ 1536 次元"
    - "MOD-BATCH-015（Recheck）と混同しない（036/037）"
    - "apps/reco 本体・generated 非変更"
  specialist_reviews:
    test: true
    security: true

notes:
  - "Issue #1482"
