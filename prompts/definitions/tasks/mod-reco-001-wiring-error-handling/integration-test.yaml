      required: true
      purpose: "配線後 build_default_stub_ports()"
    - path: "apps/reco/tests/unit/application/test_recommendation_orchestrator.py"
      required: true
      purpose: "更新対象"
  issues:
    - number: 1029
      purpose: "親 Epic"
  prs: []

output:
