  title: "MOD-RECO-001:Orchestrator Wiring（ログ・エラー）統合テスト"
  summary: "ログ・エラー配線後の Orchestrator デフォルト経路について、test_recommendation_orchestrator.py 等で 024→029 Error Log 接続（§14 integration）を検証する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]MOD-RECO-001:Orchestrator Wiring（ログ・エラー）"
  epic_issue_number: 1029
  epic_branch: "feature/epic-1029-mod-reco-001-wiring-error-handling"
