  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Epic #1029 配下で wiring Task（#1030）により error_handler 本実装配線完了後、Orchestrator デフォルト composition の integration 観点を検証する。
  対象: MOD-RECO-001 §14 No.9、MOD-RECO-024 §14 No.10、MOD-RECO-029 §14 No.10。
  InMemory ErrorLogRepository 等、本番 DB 非依存の fixture / mock を用いる。

objective: |
  配線後の Orchestrator デフォルト経路テストを green にし、失敗時 024→029 Error Log 接続を pytest で検証する。

scope:
  - "`apps/reco/tests/unit/application/test_recommendation_orchestrator.py` の期待値更新・ケース追加"
  - "024→029 Error Log 接続のデフォルト composition 検証"
  - "テスト用 fixture / helper（Orchestrator デフォルト経路専用）"

out_of_scope:
  - "stubs.py / ports.py / orchestrator.py の配線変更（wiring Task）"
  - "024 / 029 モジュール本体の変更（テスト成立に必要な最小修正のみ可）"
  - "integration test（E2E）/ API contract test"
  - "本番 DB / 外部 API 依存テスト"
  - "028 Phase Log / 025 Metric 配線"

input:
  docs:
    - path: "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md"
      required: true
      purpose: "§14 No.9"
    - path: "docs/06_実装設計/reco/MOD-RECO-024_Reco Error Handlerモジュール仕様書.md"
      required: true
      purpose: "§14 No.10"
    - path: "docs/06_実装設計/reco/MOD-RECO-029_Error Log Writerモジュール仕様書.md"
      required: true
      purpose: "§14 No.10"
  templates: []
  files:
