  - "観点とテストケースの対応表（PR 本文）"

acceptance_criteria:
  - "MOD-RECO-001 / 024 / 029 §14 integration 観点がテストでカバーされている"
  - "`cd apps/reco && uv run pytest tests/unit/application/test_recommendation_orchestrator.py -q` が成功する"
  - "本番 DB / 外部 API / secret に依存していない"

