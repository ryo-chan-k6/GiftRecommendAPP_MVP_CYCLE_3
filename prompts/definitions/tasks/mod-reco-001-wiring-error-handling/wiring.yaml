background: |
  Epic #1029 配下のフェーズ Wiring Task。MOD-RECO-024 §16.2 順序3 に従い、Orchestrator デフォルト composition の error_handler を本実装へ差し替える。
  029 Error Log Writer は Orchestrator から直接配線せず、`build_default_reco_error_handler(error_log_writer=build_default_error_log_writer())` 等で 024 へ DI する。
  `ErrorHandlerPort.handle()` に `cause` 引数を追加し、`orchestrator.py` の `ModuleExecutionError` 捕捉経路から `cause=exc` を渡す（024 §16.1 No.6）。
  `MODULE_ERROR_CODES`（Orchestrator constants）の surface 決定責務は 024 へ移行済みのため、Orchestrator 側の重複 mapping 削除を wiring scope に含めてよい（Human Review 必須）。
  integration テスト期待値更新は integration-test Task（#1031）へ委譲する。
  `stubs.py` は exclusive_files のため Epic 配下で直列実行する。

objective: |
  error_handler Port を build_default_stub_ports() で RecoErrorHandler 本実装（029 ErrorLogWriter DI 込み）へ差し替え、Orchestrator から cause 委譲を接続する。
  デフォルト経路 integration テストの green 化は integration-test Task に委譲する。

scope:
  - "`apps/reco/src/reco/application/recommendation-orchestrator/stubs.py` の error_handler Port 差し替え"
  - "`apps/reco/src/reco/application/recommendation-orchestrator/ports.py` の ErrorHandlerPort に `cause` 追加"
  - "`apps/reco/src/reco/application/recommendation-orchestrator/orchestrator.py` の `_ports.error_handler.handle(..., cause=...)` 接続"
  - "`constants.py` の `MODULE_ERROR_CODES` 等、024 へ移行済み surface mapping の Orchestrator 側整理（最小 diff）"
  - "reco-error-handler / error-log-writer の `build_default_*` factory import と package 読み込み"
  - "必要に応じた `recommendation-orchestrator/__init__.py` export 整理（epic_scope 内）"

out_of_scope:
  - "MOD-RECO-024 / MOD-RECO-029 モジュール本体の変更"
  - "`execution_context.py` の型付きフィールド追加"
  - "`test_recommendation_orchestrator.py` の期待値更新（integration-test Task）"
  - "028 Phase Log / 025 Metric Logger 配線"
  - "他フェーズ Port の再配線"
  - "`StubErrorHandler` クラスの削除"
  - "段階3 Composition（本番 DB Repository）"
  - "MOD-RECO-001 モジュール仕様書 §8.4.2 更新（Epic PR / 別 docs Task）"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / DB schema 変更"

