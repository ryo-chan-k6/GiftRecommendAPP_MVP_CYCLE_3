  #1811は完了扱いにしない。案B genre IDs・--live-embedding既定ONは本Task外。

objective: |
  Human承認後に、Phase2対応のcrontab載せ替え手順と登録済み記録欄を正本化し、
  Humanが親シェル経由のみで009〜016を無人運用に拡張できる状態にする。
  実crontab編集後は登録済み記録をdocsへ同期する。

