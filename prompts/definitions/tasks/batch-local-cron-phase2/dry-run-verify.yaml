  impl後、liveなしで --dry-run により009〜016配線とPhase1互換スキップを検証しdocsへ残す。
  cron-cutover（実crontab載せ替え）はHumanゲートであり本Taskでは行わない。

objective: |
  dry-run結果をsecretなしで正本docsへ同期し、載せ替え判断の材料を揃える。

scope:
  - "親シェル --dry-run（Phase2配線ON）の実行と結果記録"
  - "親シェル --dry-run（Phase1互換スキップ）の実行と結果記録"
  - "運用手順docs / 必要なら experiments log への同期"
  - "cron-cutover着手条件（Phase1観測完了 or Human明示承認）の再確認記載"

out_of_scope:
  - "scripts新規配線の本実装（前Task impl）"
  - "実crontab変更・載せ替え"
  - "AIによる --live-rakuten 実行 / 実Batch live"
  - "BATCH-018 / 019"
  - "#1792 schedule有効化 / #1607 / GHA楽天live"
  - "secret実値の表示・変更"
  - "Phase1 #1811 の再開・完了扱い"

input:
  docs:
    - path: "ai-logs/human-decisions/2026-08-01-batch-local-cron-ops-next.md"
      required: true
    - path: "docs/15_運用・改善/運用手順/local薄いオーケストレータ設計・運用手順.md"
      required: true
    - path: "docs/15_運用・改善/運用手順/local_cron_Phase1_crontab運用手順.md"
      required: true
    - path: "scripts/batch/README.md"
      required: true
  files:
    - path: "scripts/batch/local_daily_orchestrator.sh"
      required: true
    - path: "scripts/batch/local_weekly_orchestrator.sh"
      required: true

output:
