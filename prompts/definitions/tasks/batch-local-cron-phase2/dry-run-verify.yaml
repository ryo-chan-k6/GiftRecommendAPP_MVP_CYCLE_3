    test: true
    contract: false
    security: true
  review_points:
    - "dry-run結果が再現可能に記録されているか"
    - "Phase1互換スキップが確認されているか"
    - "live / crontab変更が混入していないか"
    - "secret実値がないか"

operation_logging:
