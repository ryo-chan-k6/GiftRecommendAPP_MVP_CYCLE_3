  summary: "親シェルの--dry-run（Phase2配線ON / Phase1互換スキップ）を実施し結果をdocs同期する。AI live・実crontab変更は禁止。"
  workstream_key: "batch-local-cron-phase2"
  phase: "dry-run-verify"

work_mode: "ai-agent"

