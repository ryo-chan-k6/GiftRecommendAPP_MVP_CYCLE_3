    - "local_daily / local_weekly --dry-run（Phase2 ON）"
    - "local_daily / local_weekly --dry-run（Phase1互換スキップ）"
  commands: []
  manual_checks:
    - "AIが --live-rakuten を実行していない"
    - "実crontabを変更していない"
  not_required:
