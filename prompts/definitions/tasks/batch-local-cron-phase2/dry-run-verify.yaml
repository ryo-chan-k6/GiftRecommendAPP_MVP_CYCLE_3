human_decision_points:
  - "dry-run結果を踏まえたcrontab載せ替え可否（後続cron-cutover）"

stop_conditions:
  - "AI liveや実crontab変更が必要に見えた場合"
  - "impl未反映でdry-run対象が不明な場合"
  - "secret実値が必要に見える場合"

notes:
  - "着手条件: impl Taskが親Epic Branchへ反映済み"
  - "後続cron-cutoverはHumanゲート。本Taskでは着手しない"
  - "親Epic Issue #1818 / Branch chore/epic-1818-batch-local-cron-phase2"
