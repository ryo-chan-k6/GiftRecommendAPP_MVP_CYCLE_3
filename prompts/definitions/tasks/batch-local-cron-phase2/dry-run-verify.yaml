    phase: "15_運用・改善"
    priority: "high"
    planned_start: "2026-08-01"
    due_date: "2026-08-03"

issue:
  number: 1824
  unit: "task"
  type: "test"
  area: "batch"

dependencies:
  epics: []
  issues:
    - 1745
    - 1811
    - 1798
  prs:
    - 1810
    - 1815
  tasks:
