    - path: "docs/15_運用・改善/運用手順/**"
      action: "create_or_update"
      required: true
  files:
    - path: "ai-logs/experiments/**"
      action: "create"
      required: false

acceptance_criteria:
  - "Phase2配線ONとPhase1互換スキップの双方のdry-run結果がdocsにある"
  - "secret / token / 接続文字列実値がない"
  - "実crontab変更・AI liveを含まない"
  - "cron-cutoverはHumanゲートである旨が明記されている"

branch:
  no_branch: false
  summary: "phase2-dry-run-verify"
  name: "test/task-1824-phase2-dry-run-verify"
  base: "chore/epic-1818-batch-local-cron-phase2"
  target: "chore/epic-1818-batch-local-cron-phase2"
  worktree_required: true

