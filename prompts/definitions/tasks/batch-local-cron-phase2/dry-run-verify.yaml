    - "task-batch-local-cron-phase2-impl"
  blocks:
    - "task-batch-local-cron-phase2-cron-cutover"
  exclusive_files:
    - "docs/15_運用・改善/運用手順/local薄いオーケストレータ設計・運用手順.md"
  conflict_risk: "low"
  contract_impact: false
  generated_impact: false
  db_impact: false

