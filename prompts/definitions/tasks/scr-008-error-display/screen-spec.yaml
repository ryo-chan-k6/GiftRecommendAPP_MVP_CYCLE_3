background: |
  06_実装設計において、web 実装の前提となる画面仕様書を作成する。
  SCR-008 は独立 URL 画面ではなく、主に SCR-002 推薦実行失敗時の UI 状態として扱う（画面遷移図正本）。
  D1 S3（api 停止→エラー UI→条件入力へ戻る）は pass 済み。本 Task で正本仕様を固定する。

objective: |
  SCR-008（エラー表示）について、実装・レビューが可能な粒度の画面仕様書を作成する。
  作成する仕様書は prompts/templates/docs/screen-spec.md に準拠する。

scope:
  - "SCR-008 の画面仕様書を新規作成する（成果物: SCR-008_エラー表示画面仕様書.md）"
  - "画面目的・対象ユーザー・表示パターンを整理する"
  - "画面状態であること（独立 URL ではないこと）と復帰導線を整理する"
  - "推薦実行失敗（API / 通信）とフィールド入力エラーの分担を整理する"
  - "Alert / EmptyState 等 UI 部品との対応を整理する"
  - "専用エラー route 新設が MVP out of scope であることを明示する"
  - "画面一覧の「再実行」操作の MVP 扱いを明記する（Human Review 観点）"

out_of_scope:
  - "他画面（SCR-008 以外）の画面仕様書作成"
  - "専用エラー用 URL route の新設・実装"
  - "SCR-003 / SCR-009 の包括仕様（遷移・隣接状態としての言及に留める）"
  - "SCR-005 / SCR-006 / SCR-007 の本仕様変更"
  - "OpenAPI / generated / ソースコード実装"
  - "API-PUB-002 契約・実装の変更"
  - "認証・認可方式そのものの変更"

