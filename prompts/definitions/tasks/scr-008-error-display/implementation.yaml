    due_date: "2026-07-18"

issue:
  unit: "task"
  type: "feature"
  area: "web"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "専用 route を新設していないか"
    - "SCR-009（0件）と混同していないか"
    - "SCR-003 実装との競合差分が最小か"
    - "再実行が画面仕様（Human Review 採否待ちの提案含む）と矛盾していないか"
    - "テストが仕様の主操作をカバーしているか"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: false

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: false
  reason: "通常の画面実装 Task。成果は code / test、レビューは PR を正とする。"

risk_points:
  - "SCR-003 #1371 と recommendation-input 同時編集による conflict"
  - "empty 経路を error に誤配線する"

human_decision_points:
  - "再実行ボタンを残すこと（画面仕様 §6.2 は提案表記だが merge 済み仕様・現状実装と整合）"

stop_conditions:
  - "親 Epic Branch に画面仕様書が無い場合"
  - "専用エラー route 新設が必須と判断された場合"
  - "SCR-003 実装との conflict 解消に設計判断が必要な場合"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "PR target は親 Epic Branch"
  - "AI Review 用 Review Definition を PR head に含める"
