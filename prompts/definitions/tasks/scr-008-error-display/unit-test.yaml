  実装 Task で RecommendationRunErrorView の component test は追加済み。本 Task では RecommendationInputPage の error 経路統合テストを追加する。

objective: |
  SCR-008 画面状態の単体テストを拡充し、推薦実行失敗・復帰・再実行の主要導線を再現可能に検証する。

