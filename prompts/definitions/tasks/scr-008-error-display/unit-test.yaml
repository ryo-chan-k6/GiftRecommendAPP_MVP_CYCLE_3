  - "API-PUB-002 失敗応答 / 通信例外 → SCR-008 表示 / 条件入力へ戻る / 再実行"
  - "Task / Review Definition 整備"

out_of_scope:
  - "画面仕様書・実装本体の機能追加（軽微なテスト容易性修正は最小限可）"
  - "E2E / Playwright 全面整備"
  - "OpenAPI / generated 変更"
  - "apps/api / apps/reco / apps/batch の変更"
  - "SCR-003 / SCR-009 包括変更"

