background: |
  BATCH-004 仕様書（#1224）は §18.1 No.7 / §18.1.1 で専用候補テーブル方針を確定したが、
  カラム定義・enum・IF-ID・DDL 詳細は付随 Epic #1227 に委譲していた。
  #1227（T1–T3 / T4b / T5–T7）は Epic Branch へ merge 済み（PR #1276）。
  一方 BATCH-004 仕様書には「付随 Task で確定」「候補 status（仮）」「IF-DB-BATCH-020 未記載」等の陳腐化が残る。
  制約本体（物理名・UNIQUE・Writer/008 境界・競合・Retention）は正本と一致しており再設計は不要。
  本 Task は docs 正本追随に限定し、実装・DDL・BATCH-008・Writer 実装（#1231）は行わない。

objective: |
  BATCH-004 バッチ仕様書を #1227 確定成果（テーブル定義書 / IF-020·021 / enum / BATCH-008 / Retention）へ追随させ、
  後続実装 Task（および T4a Writer）が IF・列・UPSERT・復帰写像を BATCH-004 から辿れる状態にする。

scope:
  - "BATCH-004 仕様書 §10.1 に IF-DB-BATCH-020 と Writer 列名（candidate_active_status / reason_code / detection_basis / candidate_status=detected 等）を追記"
  - "§9（必要最小）に api_success / available / active の復帰写像を追記"
  - "§12 に candidate_status（Writer 終端 detected）を追記"
  - "§14 の候補テーブル表記を物理名へ寄せる（任意）"
  - "§18.1 No.7 備考 / §18.1.1 / §18.2 の「付随で確定」陳腐化を解消し、テーブル定義書・IF・Retention へ誘導"
  - "§19 に IF-020/021・enum・Retention 運用手順を追加"
  - "§20 を付随完了・残は #1231 Writer 実装と明記"
  - "§17.1 変更履歴・ドキュメント更新日を追記"
  - "本 Task / Review Definition を prompts/definitions に配置"

out_of_scope:
  - "Python 実装・GitHub Actions workflow YAML"
  - "DDL / supabase migration / enum YAML の再変更"
  - "インターフェース一覧・テーブル定義書・BATCH-008 仕様書・Retention 手順の再編集"
  - "T4a Writer 実装（#1231）"
  - "FETCH / Raw / cursor 境界の再設計"
  - "OpenAPI / Orval / generated"
  - "他 Batch 仕様書の変更"

