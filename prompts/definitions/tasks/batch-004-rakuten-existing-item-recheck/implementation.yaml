    path: null

deliverables:
  - "BATCH-004 既存商品再確認ジョブ実装（Writer 含む）"
  - "batch-rakuten-existing-item-recheck.yml"
  - "最小 unit test（fixture / mock）"

acceptance_criteria:
  - "仕様書主要 Phase（plan/cursor/fetch/adapt/raw_save/resolve/cursor_update/finalize）がコード上で追跡できる"
  - "recheck のみを消費し、genre/keyword/update_sort/ranking_supplement を消費しない"
  - "IF-DB-BATCH-020 で candidate_status=detected の upsert ができる"
  - "Item / Staging / item.active_status を本 Batch で更新しない"
  - "Raw 冪等（object_key / content_hash）と fetch_cursor 進捗がある"
  - "empty_hit / availability_zero / api_success→active の写像がある"
  - ".github/workflows/batch-rakuten-existing-item-recheck.yml が存在し workflow_dispatch / workflow_call を持つ"
  - "secret / .env 実値を含まない"
  - "OpenAPI / generated / migration / item_active_status/** を変更していない"
  - "親 Epic allowed_paths 外を編集していない"
  - "最小 unit test がローカルで実行可能である"
  - "#1231 を Related / 吸収として Issue コメントまたは本文で明示している"

