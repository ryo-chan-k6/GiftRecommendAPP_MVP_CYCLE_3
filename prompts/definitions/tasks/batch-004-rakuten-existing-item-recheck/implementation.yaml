      required: true
      purpose: "同型実装の参照"
    - path: "apps/batch/src/batch/infrastructure/rakuten/**"
      required: true
      purpose: "Item Search client/adapter"
    - path: "apps/batch/src/batch/application/item_active_status/**"
      required: false
      purpose: "Applier 参照のみ（編集禁止）"
  issues:
    - number: 1282
      purpose: "仕様追随"
    - number: 1231
      purpose: "Writer 吸収"
  prs:
    - number: 1283
      purpose: "仕様追随 merge"

output:
  docs: []
  files:
    - path: "apps/batch/src/batch/application/item_recheck/**"
      action: "create"
      required: true
    - path: "apps/batch/src/batch/infrastructure/rakuten/**"
      action: "update"
      required: true
    - path: ".github/workflows/batch-rakuten-existing-item-recheck.yml"
      action: "create"
      required: true
    - path: "prompts/definitions/tasks/batch-004-rakuten-existing-item-recheck/implementation.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-004-rakuten-existing-item-recheck/implementation/pr-review.yaml"
      action: "create"
      required: true
  tests:
