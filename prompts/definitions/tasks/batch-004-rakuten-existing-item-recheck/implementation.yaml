schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-004-rakuten-existing-item-recheck-implementation"
  title: "BATCH-004:楽天既存商品再確認Batch実装"
  summary: "BATCH-004（楽天既存商品再確認Batch）を仕様書に基づき apps/batch へ実装する。itemCode 指定再確認、Raw保存、fetch_cursor(recheck)、IF-DB-BATCH-020 Writer、独立 workflow を対象とする。#1231 Writer は本 Task に吸収する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]BATCH-004:楽天既存商品再確認Batch"
  epic_issue_number: 1222
  epic_branch: "feature/epic-1222-batch-004-rakuten-existing-item-recheck"
  related_issues:
    - number: 1224
      purpose: "バッチ仕様書初版（CLOSED）"
    - number: 1282
      purpose: "仕様書 #1227 追随（CLOSED）"
    - number: 1231
      purpose: "Writer 単独 Issue（本 Task に吸収・完了扱いへ）"
    - number: 1227
      purpose: "候補テーブル付随（CLOSED / tip 取込済み）"
  related_prs:
    - number: 1283
      purpose: "仕様追随 Epic Branch merge 済み"
    - number: 1276
      purpose: "候補テーブル Epic merge 済み"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Phase4b レーン B1 Fetch 第4段。仕様書 #1224 / 追随 #1282 および #1227（候補テーブル）は Epic Branch 取込済み。
  BATCH-003 同型で item_recheck を実装する。Contract Gate 不要。unit は fixture / mock 正。
  #1231（Writer）は親が #1227 だったが、DDL 取込後は本実装に含める（単独 Task は吸収）。

objective: |
  BATCH-004 について、仕様書の処理ステップ（plan → cursor → fetch → adapt → raw_save → resolve → cursor_update → finalize）を
  apps/batch 上で実行可能な実装と、起動用独立 workflow（batch-rakuten-existing-item-recheck.yml）を整備する。
  IF-DB-BATCH-020 で item_active_status_candidate へ detected upsert する。Item / Staging は更新しない。

scope:
  - "BATCH-004 ジョブ application 実装（recheck_plan / fetch_cursor(recheck) / Phase 実行 / 部分失敗）"
  - "itemCode 指定の Rakuten Item Search 利用（scaffold/mock。空ヒットは empty_hit 候補化）"
  - "Raw Object / Metadata / fetch_cursor 進捗（exhausted 等）"
  - "IF-DB-BATCH-020 Writer（§9.3 Resolver 写像・UPSERT detected）"
  - "batch_run_log / phase_log / api_call_log / error_log 連携"
  - ".github/workflows/batch-rakuten-existing-item-recheck.yml（workflow_call / workflow_dispatch）"
  - "最小 unit test（正常系・Raw冪等・候補upsert・Item非更新・recheck専任・empty_hit / availability）"
  - "infrastructure/rakuten の empty Items / availability 対応（BATCH-003 互換維持）"
  - "Task / Review Definition、#1231 吸収注記"

out_of_scope:
  - "バッチ仕様書の全面書き換え（軽微な実装追随注記以外）"
  - "他 Batch 実装（genre_sync / ranking_snapshot / item_pseudo_diff 破壊変更禁止）"
  - "item_active_status/**（BATCH-008 Applier / Retention）の編集"
  - "親 existing-item-recheck チェーン workflow 全体改修"
  - "OpenAPI / Orval / generated / DB migration"
  - "本番楽天APIへの大量・課金影響のある実呼出検証"
  - "包括的 UT Task（後続 unit-test Task）"
  - "Staging / Item 本更新 / active_status 本更新"

