background: |
  Epic #1222 / PR #1296 は develop merge 済み。UT（#1291）で Rate Limit 時 cursor=paused が
  未実装であることを Should として明示した。fetch_cursor テーブル定義書 §5.3・§17.1 No.3 により
  api_call_log rate_limited（GRS-EXT-102）後の同一処理内 paused 遷移は MVP 必須。
  Epic Reopen せず develop ベース・develop 向け follow-up とする。

objective: |
  BATCH-004 item_recheck が GRS-EXT-102 発生時に当該 recheck カーソルを paused へ更新し、
  unit test で検証する。待機・リトライループの本格実装は本 Task では行わない。

scope:
  - "item_recheck: GRS-EXT-102 時に fetch_cursor を paused 更新（page は進めない）"
  - "関連 unit test の更新（paused 断言。未実装注記の削除）"
  - "必要なら BATCH-004 仕様書 §16 No.5 の実装追随注記（最小）"
  - "Task / Review Definition"

out_of_scope:
  - "待機 sleep / 指数バックオフの本番 Rate Limiter 本実装"
  - "他 Batch（BATCH-001〜003）の paused 対応"
  - "Epic #1222 Reopen"
  - "OpenAPI / migration / item_active_status/**"
  - "実楽天API検証"

