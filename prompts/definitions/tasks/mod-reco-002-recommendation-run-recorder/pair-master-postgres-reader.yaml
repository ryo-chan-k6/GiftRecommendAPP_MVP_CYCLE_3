background: |
  build_production_observability_modules は Run Recorder に Postgres repository を渡す一方、
  pair_reader は InMemoryPairMasterReader({("friend","birthday"): SCAFFOLD_PAIR_ID}) のまま。
  master seed の pair_master には boss × thanks 等が存在するが参照されない。
  #1137 診断では INT-002 が pair_id could not be resolved（HTTP 500 GRS-REC-002）となった。
  #1139 / PR #1144 で api 側実 DB 永続化は完了。本 Task で production pair_reader を Postgres 実装へ置換する。
  Parent は縦串 follow-up として #357（CLOSED）/ develop 直 PR とする（MOD-RECO-002 専用 Epic 新規起票なし。Human 判断）。

objective: |
  production composition で pair_master を PostgreSQL から解決し、少なくとも boss × thanks
  （および master seed 上の有効ペア）で pair_id 解決が成功する状態にする。
  scaffold / DEFAULT composition の InMemory は維持する。ローカル開発手順書 §10.4.4 No.3 を更新する。

scope:
  - "PostgresPairMasterReader 実装: relationship_code × occasion_code → pair_id（is_active=true）"
  - "build_production_observability_modules の pair_reader を Postgres 実装へ置換"
  - "unit / 必要なら ScriptedDatabaseSession による reader テスト"
  - "composition wiring テスト更新"
  - "ローカル開発手順書 §10.4.4 No.3 更新"
  - "scaffold / DEFAULT composition の InMemory は維持"
  - "Task / Review Definition 整備"

out_of_scope:
  - "Run Recorder の config version 整合（別 Issue #1141）"
  - "candidate retrieval 以降の stub ports 全面 production 化"
  - "OpenAPI / migration 変更"
  - "api Router / 実 DB 永続化（#1138 / #1139）"
  - "Batch 意味生成"
  - "Epic #357 / #776 Reopen"
  - "MOD-RECO-002 専用 Epic 新規起票"

