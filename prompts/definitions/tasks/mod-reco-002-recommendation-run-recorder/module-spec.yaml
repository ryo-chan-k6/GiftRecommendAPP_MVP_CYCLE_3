background: |
  06_実装設計において、MOD-RECO-002（Recommendation Run Recorder）の Recoモジュール仕様書を作成する。
  本 Task は当該モジュール本体に責務を限定し、API-INT-002 エンドポイント層や他 Recoモジュール本体の仕様は別 Epic / Task とする。
  MOD-RECO-001 Orchestrator 仕様書のポート契約（`ExecutionContext` 入出力）と整合させる。

objective: |
  MOD-RECO-002 について、apps/reco 実装・単体テスト・レビューが可能な粒度のモジュール仕様書を作成する。
  作成する仕様書は prompts/templates/docs/module-spec.md に準拠する。
  確定方針に合わせ、関連正本 docs（Orchestrator 仕様書・Recoモジュール一覧・状態遷移設計書・機能×モジュール対応表）の横断整合も本 Task で行う。

scope:
  - "MOD-RECO-002 のモジュール仕様書を新規作成する"
  - "モジュール基本情報・主責務・対象外責務・入出力・処理フロー・例外・ログ・テスト観点を整理する"
  - "Orchestrator（MOD-RECO-001）との呼び出し関係・失敗時の扱いを整理する"
  - "MOD-RECO-002 確定方針（003→002 INSERT・reco が accepted INSERT）に合わせ関連正本 docs を整合更新する"

exception_scope:
  reason: "Issue #777 Human 判断により、正本整合に必要な最小限の apps/reco 変更を本 Task に含める（Epic #776 forbidden_paths の例外）"
  paths:
    - "apps/reco/src/reco/application/recommendation-orchestrator/**"
    - "apps/reco/src/reco/domain/recommendation/run.py"
    - "apps/reco/tests/unit/application/test_recommendation_orchestrator.py"
    - "apps/reco/tests/unit/domain/test_domain_scaffold.py"
  allowed_changes:
    - "Orchestrator 物理呼び出し順（003→002）と ORCHESTRATOR_MODULE_ORDER の整合"
    - "RunStatus を DB enum（accepted/running/succeeded/failed/canceled）へ整合"
    - "上記に伴う stub / 単体テストの最小更新"

out_of_scope:
  - "他 Recoモジュール本体のモジュール仕様書の新規作成（MOD-RECO-001 は呼び出し順整合のための限定的更新のみ）"
  - "MOD-RECO-002 本体実装（recommendation-run-recorder/**）"
  - "OpenAPI / DB schema 変更"

