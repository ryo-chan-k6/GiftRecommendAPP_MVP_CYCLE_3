background: |
  #1137 診断で、recommendation_request 行と scaffold pair まで進めても INT-002 は
  HTTP 500 GRS-REC-002 / one or more config version ids do not exist となった。
  RecommendationRunRecorder は execution_context.config_versions の semantic/model/matching/ranking id を
  run_repository.version_exists で DB 確認する。production composition は observability のみ Postgres 置換し、
  config_resolver は InMemory 固定 UUID（b/c1111…）のまま。master seed の model/matching/ranking は
  gen_random_uuid() のため不一致。本 Task は version 解決整合まで。retrieval 以降の stub ports 全面置換は out of scope。

objective: |
  production composition 上で Run Recorder の config version 解決が master seed（ローカル DB）と整合し、
  version_exists 失敗で Run 作成が止まらない状態にする。
  stub ports 全面置換は含めない。手順書 §10.4.4 No.4 の config version 部分を更新する。

scope:
  - "config version id の解決経路調査と、DB 上の current version と一致させる最小修正"
  - "production composition で ConfigVersionResolver が DB is_current を参照する配線（または同等の最小整合）"
  - "version_exists がローカル master seed で true になること"
  - "unit / 必要なら ScriptedDatabaseSession テスト"
  - "ローカル開発手順書 §10.4.4 No.4 のうち config version 部分を更新"
  - "Task / Review Definition 整備"
  - "seed 変更が必要な場合は Human 承認を PR に明示（原則は seed 変更なしで DB 読取を優先）"

out_of_scope:
  - "candidate retrieval / matching / ranking 等の stub → production ports 全面置換"
  - "Batch 意味生成・Embedding 実 API 呼び出し必須化"
  - "OpenAPI / migration 変更"
  - "api Router / 実 DB（#1138 / #1139）"
  - "pair_master reader（#1140）"
  - "推薦品質評価・大規模 fixture"
  - "Epic #357 / #776 Reopen"

