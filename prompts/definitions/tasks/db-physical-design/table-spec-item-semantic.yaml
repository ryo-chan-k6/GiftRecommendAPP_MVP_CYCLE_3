background: |
  Phase2 子 Task ③ Batch R03 No.1。論理ER §10.2・テーブル一覧 §7 No.28。
  Batch（BATCH-010）で生成する商品側 Semantic Concept 派生データ。Online 推薦（reco）では参照のみ。
  親 Epic Branch 最新（enum #440 merge 済み、item #495 merge 済み、semantic_config 系 #462–#463 merge 済み、item_generation_queue #507 merge 推奨）を前提とする。
  `semantic_config_version_id` との version 紐づけ方針は本 Task で確定する（`semantic_config_version_テーブル定義書` §8.2 は ON / LOGICAL 候補を記載）。
  Issue #513 / Branch `docs/task-513-item-semantic-table-spec` で作業する。

objective: |
  `item_semantic` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `semantic_config_version_id` との version 紐づけ方針・`semantic_json` 保持方針・BATCH-010 入出力・再生成冪等方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の item_semantic テーブル定義書作成"
  - "物理ER Item派生データ系・論理ER §10.2 との突合"
  - "item / semantic_config_version 参照整合（FK 方針・Index・冪等キー）"
  - "item_generation_queue（BATCH-010 入力）・item_テーブル定義書との生成経路整理"
  - "semantic_concept / semantic_rule との concept_code 参照整合（semantic_json 内）"
  - "バッチ設計方針書 BATCH-010・バッチ処理一覧・バッチ依存関係図との入出力整合"
  - "論理ER §16 Online/Batch 責務境界（batch 更新・reco 参照のみ）の反映"
  - "Task / Review Definition の整備"

out_of_scope:
  - "item_feature / item_meaning / item_embedding テーブル定義書（同 Batch R03 他 Task）"
  - "feature_input_hash / embedding_input_hash の永続化先テーブル定義"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

