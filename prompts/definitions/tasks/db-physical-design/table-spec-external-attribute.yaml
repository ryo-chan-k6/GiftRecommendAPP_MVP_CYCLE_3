background: |
  Phase2 子 Task ③ Batch R09 No.3（最終バッチ）。テーブル一覧 §5 No.14。
  楽天属性情報の外部参照マスタ。保持する場合は Feature 推定補助の候補情報として扱う。
  MVP では **任意テーブル（△）** であり、物理ER では MVP DDL 作成対象 60 テーブルから除外されているが、本 Task では **テーブル定義書として設計を文書化** し、採用判断・後続 DDL Task への引き継ぎを可能にする。
  楽天商品検索APIの `attributeIds` / `attributeFlag`、楽天属性検索API（任意）、ジャンル検索APIの `attributes` / `tagGroups` 正規化結果が入力候補となる。
  `item` テーブル定義書では MVP 時点で `attributeIds` は normalized_hash 入力に含めるのみとし、属性マスタ参照は未作成前提である。
  親 Epic Branch 最新（#495 item / #517 staging_item merge 済み前提）を前提とする。

objective: |
  `external_attribute` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `item`（`attributeIds` シグナル）・`staging_attribute`（反映前 Staging）との関係、MVP 任意テーブルであること、Batch Upsert 方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の external_attribute テーブル定義書作成"
  - "物理ER Item系・外部商品データ連携系との突合"
  - "論理ER・テーブル一覧 §5 No.14・§5 補足 No.9（MVP任意）・§6 No.24 staging_attribute との整合"
  - "外部商品データ連携設計書 §4.5 楽天属性検索API・§12.2–§12.3 属性データ連携・attributeIds マッピングとの整合"
  - "item_テーブル定義書 §12.3 attributeIds / normalized_hash 方針との参照関係整理"
  - "staging_attribute → external_attribute Upsert 関係の参照方針を明記（staging_attribute 本体定義は別 Task）"
  - "正本定義表・モジュール一覧 MOD-BATCH-031 External Attribute Updater との整合"
  - "外部商品データ連携設計書 §10.3 の `item_attribute` 表記と `external_attribute` 物理名の差分解消方針整理"
  - "Task / Review Definition の整備"

out_of_scope:
  - "staging_attribute テーブル定義書本体（別 Task）"
  - "item / item_image / item_review_summary 等のテーブル定義書（本 Task では attributeIds 参照方針の整理のみ）"
  - "DDL・migration（Task ④⑤。MVP では物理ER 上も作成しない方針）"
  - "db/seeds ファイルの作成（Task ⑤）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

