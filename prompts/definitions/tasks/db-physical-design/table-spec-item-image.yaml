acceptance_criteria:
  - "item_image テーブル定義書が docs/06_実装設計/database/ に存在する"
  - "物理ER・論理ER §8.3・テーブル一覧 §5 と矛盾しない"
  - "is_primary / display_order / image_size_type 方針が明記されている"
  - "source / source_system / source_api 列を item_image に持たない方針が §5 / §6 で明記されている"
  - "最新のみ Upsert + item 単位同期置換（消えた URL は DELETE）が §12 に明記されている"
  - "is_active 列を MVP 物理 DDL に持たない方針が明記されている"
  - "is_primary partial unique（item_id WHERE is_primary=true）と Upsert 用 UNIQUE (item_id, image_url) が明記されている"
  - "主画像選定方針（mediumImageUrls[0] → smallImageUrls[0] → プレースホルダー）が明記されている"
  - "item.item_id への物理 FK（ON・`item_テーブル定義書` §8.2 と一致）方針が明記されている"
  - "item 定義書 §5.1 の責務境界（画像 URL は item_image）と矛盾しない"
  - "staging_item_image → item_image Upsert 方針が参照として整理されている"
  - "DDL 適用順序が item 作成後（`item_テーブル定義書` §15）と整合している"
  - "recommendation_result_item.item_image_url_snapshot との参照関係が明記されている"
  - "apps/** 変更がない"
  - "Task PR target が親 Epic Branch"

