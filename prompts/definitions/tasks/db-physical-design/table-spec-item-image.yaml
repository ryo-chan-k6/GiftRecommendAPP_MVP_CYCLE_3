background: |
  Phase2 子 Task ③ Batch R01 No.5。論理ER §8.3 Item Image 方針に対応。
  楽天商品検索APIの `mediumImageUrls` / `smallImageUrls` 由来の画像URL参照情報を保持する。
  MVP では画像バイナリ非保存。`staging_item_image` → `item_image` の Upsert 関係は物理ER・バッチ設計方針に従う。
  `recommendation_result_item.item_image_url_snapshot` の元データとして `item_image.is_primary=true` を参照する。
  先行 Task `item` テーブル定義書（#495 / PR #500 merge 済み）では、`item_image.item_id` への物理 FK（`ON`）・責務境界（§5.1 / §8.2）・Upsert 後の子テーブル反映順（§12.1）が確定済み。

objective: |
  `item_image` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  主画像選定方針（medium → small → プレースホルダー）と `item` への FK / `display_order` を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の item_image テーブル定義書作成"
  - "論理ER §8.2–§8.3・外部商品データ連携設計書 §11.3・リソース一覧 §12.3 の出所列方針整合（source / source_system / source_api 不採用）"
  - "物理ER Item系・Staging Item Image との突合"
  - "論理ER §8.2–§8.3・テーブル一覧 §5 No.11・§7.3 Snapshot 項目との整合"
  - "item_テーブル定義書 §5.1 / §8.2 / §12.1 / §12.3 / §13 との FK・責務境界・Upsert 順序の突合"
  - "外部商品データ連携設計書 §11.3–§11.5・楽天API 画像項目マッピングとの整合"
  - "recommendation_result_item の image snapshot 参照関係を明記"
  - "staging_item_image → item_image Upsert 関係の参照方針を明記"
  - "Task / Review Definition の整備"

out_of_scope:
  - "item テーブル定義書（#495）"
  - "staging_item_image テーブル定義書"
  - "画像バイナリ保存・CDN 設計"
  - "DDL・migration（Task ④⑤）"
  - "db/seeds ファイルの作成（Task ⑤）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

