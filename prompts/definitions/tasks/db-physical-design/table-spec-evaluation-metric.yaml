background: |
  Phase2 子 Task ③ Batch R09 No.2（Evaluation系最終バッチ）。テーブル一覧 §10 No.55。MVP△。
  評価指標（Precision / Recall / NDCG / MRR / HitRate / Diversity / RiskRate 等）の集計結果正本。
  `evaluation_result` に属する派生 / Metric 行。`evaluation_run` とは **evaluation_result_id 経由** で間接参照（Run 直接 FK なし）。
  BATCH-018（Offline Evaluation Batch）・MOD-BATCH-040 Evaluation Metric Calculator・MOD-BATCH-041 Evaluation Result Writer が
  IF-DB-BATCH-018 経由で INSERT する対象のひとつ。
  物理ER Evaluation系分類・論理ER §12.1 / §12.2・Evaluation評価定義書 §10 を前提とする。
  親 Epic Branch 最新（#565 / #566 / #567 merge 済み）および **#573 evaluation_result テーブル定義書 merge 済み** を前提とする。
  Issue #574 / Branch `docs/task-574-evaluation-metric-table-spec` で作業する。

objective: |
  `evaluation_metric` の物理カラム・制約・Index・冪等キーを table-spec.md テンプレ準拠で定義する。
  `evaluation_result` との 1:N has 関係、`evaluation_run` との間接関係（Result 経由）、
  `metric_name` / `metric_value` / `metric_detail_json` の責務分離、
  Evaluation評価定義書 §10.3 指標一覧・§14.4 offline_eval_result 論理項目との差分整理、
  BATCH-018 / IF-DB-BATCH-018 / MOD-BATCH-040 保存 I/F を明記し、
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の evaluation_metric テーブル定義書作成"
  - "物理ER Evaluation系・§9 has 関係（evaluation_result → evaluation_metric）・§10 Index・§11 制約との突合"
  - "論理ER §12.1 Evaluation系 ER 図・§12.2 evaluation_metric 属性（evaluation_metric_id, evaluation_result_id, metric_name, metric_value, metric_detail_json）との整合"
  - "テーブル一覧 §10 No.55・Evaluation系補足（再評価追記・Retention）との整合"
  - "Evaluation評価定義書 §10.3 評価指標・§10.5 MVP目標値・§14.4 offline_eval_result 論理項目との差分整理（列正規化 vs EAV 行）"
  - "状態遷移設計書 Evaluation Result / Evaluation Metric 追記中心方針との整合"
  - "正本定義表・リソース一覧・リソース責務定義表 Evaluation Metric 派生区分との突合"
  - "インターフェース一覧 IF-DB-BATCH-018・処理構成定義書 §13 Offline Evaluation・バッチ処理一覧 BATCH-018 との整合"
  - "バッチ設計方針書 / バッチ依存関係図 / 機能×モジュール対応表 MOD-BATCH-040 / MOD-BATCH-041 との整合"
  - "エラーコード定義書 GRS-EVAL-004 Evaluation Metric Failed との整合"
  - "evaluation_run_テーブル定義書 §8.2 被参照（evaluation_result_id 経由 has）・§5.9 再評価追記方針との双方向整合（#567 merge 済み正本）"
  - "evaluation_result_テーブル定義書 §5 has 関係・evaluation_result_id FK / Index 引き継ぎとの双方向整合（#573 merge 済み正本）"
  - "evaluation_dataset_テーブル定義書 Retention / 再評価追記方針（上書きせず新規 Run 追記）との整合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "evaluation_result テーブル定義書の再作成（#573 は別 Task。merge 済みを参照）"
  - "evaluation_run / evaluation_case / evaluation_dataset テーブル定義書の再作成（merge 済みを参照）"
  - "evaluation_metric_name enum / packages 正本の新規作成（必要時は Human Review 論点として整理のみ）"
  - "Evaluation Metric 計算アルゴリズム詳細（MOD-BATCH-040 実装 / バッチ仕様書の責務）"
  - "人手評価（human_eval_*）テーブル定義"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"
  - "BATCH-018 バッチ仕様書本体の作成（バッチ仕様書 Task の責務）"

