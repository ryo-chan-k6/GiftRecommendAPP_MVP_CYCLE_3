review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: true

contract_gate:
  required: false

human_decision_points: []

human_review_decisions:
  - id: 1
    topic: "evaluation_result_id の物理 FK"
    decision: "物理 FK ON / ON DELETE RESTRICT（evaluation_result §8.2 has 関係・#573 §17.1 No.4 踏襲）"
  - id: 2
    topic: "evaluation_run_id 物理列"
    decision: "MVP は物理列なし。evaluation_result 経由の間接参照のみ（evaluation_run §8.2・#567 No.1 踏襲）"
  - id: 3
    topic: "metric_name 命名規則"
    decision: "snake_case `{base}_at_{k}`（例: `precision_at_10`）。Evaluation §10.3 / §14.4 対応。MVP 既定 K=10（§10.5）"
  - id: 4
    topic: "冪等キー（evaluation_result_id, metric_name）"
    decision: "UNIQUE 制約採用（`uq_evaluation_metric_result_name`）。INSERT のみ。UPSERT なし"
  - id: 5
    topic: "metric_value 型"
    decision: "`numeric(12,6) NOT NULL`。比率・NDCG 等を単一列で保持。DB CHECK で 0〜1 固定はしない"
  - id: 6
    topic: "metric_detail_json 責務"
    decision: "nullable JSONB。k・分子分母・MMR パラメータ・内訳等。metric_name に k を埋め込む場合も補助情報を保持可"
  - id: 7
    topic: "Retention"
    decision: "365 日（`created_at` 基準）。MVP 自動 DELETE なし。evaluation_result / evaluation_run と同値"
  - id: 8
    topic: "再評価時の上書き方針"
    decision: "Metric 行は INSERT のみ（UPDATE なし）。再評価は新規 Run → 新規 Result → 新規 Metric 追記"

notes:
  - "Batch R09 No.2: evaluation_metric（Evaluation系最終バッチ No.2。No.1 は #573 evaluation_result）"
