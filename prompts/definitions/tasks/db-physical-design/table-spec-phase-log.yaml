background: |
  Phase2 子 Task ③ テーブル一覧 §11 No.57。論理ER §13.2・物理ER Log / Observability系分類。
  `recommendation_run_phase_log` は物理化せず、`phase_log` に Run / Batch / Evaluation のフェーズ記録を統合する（テーブル一覧 §11 補足・物理ER §16）。
  IF-DB-RECO-009（Phase / Error Log 保存）・IF-OBS-001（Phase Log 記録）の DB 正本。
  親 Epic Branch 最新（enum #440、api_call_log #527 merge 済み前提）を前提とする。
  推奨先行 Task #534（batch_run_log）は未 merge でも、物理ER §9・論理ER §13・ログ・Observability設計書 §10 を正本として着手可能とする。
  Issue #535 / Branch `docs/task-535-phase-log-table-spec` で作業する。

objective: |
  `phase_log` の物理カラム・制約・Index・保持方針を table-spec.md テンプレ準拠で定義する。
  polymorphic `owner_type` / `owner_id` による `recommendation_run` / `batch_run_log` / `evaluation_run` 等への LOGICAL FK（records 関係）、`phase_name` の owner 別 CHECK（`recommendation_run_phase_name` / `batch_run_phase_name`）、`phase_status` 状態遷移を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の phase_log テーブル定義書作成"
  - "物理ER Log 系分類・§9 records 関係（polymorphic owner_type + owner_id）・§10 idx_phase_log_owner との突合"
  - "論理ER §13.1 ER 図・§13.2 属性・recommendation_run_phase_log 統合方針との整合"
  - "テーブル一覧 §11 No.57・Log / Observability 系補足（trace / retention / recommendation_run_phase_log 統合）との整合"
  - "状態遷移設計書 §12.2 ログ保存方針・§13 状態遷移と ER 対応との整合"
  - "enum定義書 §6.4 phase_status・§6.15 owner_type・§6.18 recommendation_run_phase_name・§6.19 batch_run_phase_name との整合"
  - "packages/code-definitions（owner_type / phase_status / recommendation_run_phase_name / batch_run_phase_name）との突合"
  - "ログ・Observability設計書 §9.3 owner_type 候補・§10 Phase Log 設計（主要項目・Run/Batch Phase 一覧）・§20.2 Retention との突合・差分整理"
  - "インターフェース一覧 IF-DB-RECO-009 / IF-OBS-001・処理構成定義書の phase_log 責務との整合"
  - "api_call_log テーブル定義書との Log 系章構成・trace キー方針の一貫性整理"
  - "batch_run_log / error_log テーブル定義書との双方向整合（本 Task では関係整理。相手テーブル本体は別 Task）"
  - "Task / Review Definition の整備"

out_of_scope:
  - "recommendation_run_phase_log テーブル定義書（物理化しない。§11 補足）"
  - "batch_run_log / error_log テーブル定義書の再作成（#534 / #536）"
  - "api_call_log テーブル定義書の再作成（#527 merge 済み）"
  - "evaluation_run_phase_name enum の新規定義（Evaluation 系テーブル定義 Task へ委譲。本 Task では owner_type=evaluation_run 時の MVP 扱いを整理のみ）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

