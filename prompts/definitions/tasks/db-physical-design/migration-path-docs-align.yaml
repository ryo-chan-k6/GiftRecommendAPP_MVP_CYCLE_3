  docs:
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      action: "update"
      required: true
    - path: "docs/06_実装設計/database/物理ER.md"
      action: "update"
      required: true
    - path: "docs/06_実装設計/database/マイグレーション方針書.md"
      action: "update"
      required: true
  files:
    - path: "prompts/definitions/epics/db-physical-design/epic.yaml"
      action: "update"
      required: true
    - path: "prompts/definitions/tasks/db-physical-design/physical-er-spec.yaml"
      action: "update"
      required: true
    - path: "prompts/definitions/tasks/db-physical-design/enum-code-definitions.yaml"
      action: "update"
      required: true
    - path: "prompts/definitions/tasks/db-physical-design/migration-path-docs-align.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/db-physical-design/migration-path-docs-align/pr-review.yaml"
      action: "create"
      required: true

acceptance_criteria:
  - "docs/ 内で Phase2 フロー説明が `supabase/migrations` と矛盾しない"
  - "`db/migrations` 残存は「使用しない」旨の注記のみ（ディレクトリ構成定義書・マイグレーション方針書）"
  - "epic/task Definition の output / exclusive paths が `supabase/migrations/**` に整合"
  - "マイグレーション方針書 §16.7 No.7 が完了状態"
  - "docs-only（DB スキーマ変更なし）"
  - "Review Definition が prompts/definitions/reviews/db-physical-design/migration-path-docs-align/ に存在する"

branch:
