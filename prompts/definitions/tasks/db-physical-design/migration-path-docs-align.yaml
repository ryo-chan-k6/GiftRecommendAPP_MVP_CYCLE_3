background: |
  Epic #435 は CLOSED（develop merge 済み）。Phase2 完了後の残課題として、
  実装フェーズ実行プロセス設計書 L118 の `db/migrations` 表記が、
  マイグレーション方針書 §5・プロジェクトディレクトリ構成定義書 §9.1 の
  `supabase/migrations/` 適用正本と矛盾していた。本 Task は docs-only で整合する。

objective: |
  migration 適用正本を `supabase/migrations/` に揃えるため、設計書・epic/task Definition・
  マイグレーション方針書 §16.7 を更新し、Phase2 フロー説明の矛盾を解消する。

scope:
  - "実装フェーズ実行プロセス設計書 §6.3 L118: `supabase/migrations` / `db/seeds`"
  - "物理ER: migration 適用正本表記の更新"
  - "epic.yaml / physical-er-spec.yaml / enum-code-definitions.yaml のパス整合"
  - "マイグレーション方針書: §16.7 Task B 完了、out_of_scope の別 Task 記述解消"
  - "Task / Review Definition の整備"

out_of_scope:
  - "DDL / supabase/migrations スキーマ変更"
  - "db/seeds 変更"
  - "apps/** 実装"
  - "packages/contracts/**・generated 変更"
  - "プロジェクトディレクトリ構成定義書の §54 注記削除（意図的残存）"

