      required: true
      purpose: "Phase2 フロー L118 の正本"
    - path: "docs/06_実装設計/database/マイグレーション方針書.md"
      required: true
      purpose: "§5 正本関係・§16.7 Task B"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "migration 命名・適用正本表記"
    - path: "docs/00_共通/ディレクトリ構成/プロジェクトディレクトリ構成定義書.md"
      required: true
      purpose: "§9.1 supabase/migrations 正本（変更不要の確認用）"
  files:
    - path: "prompts/definitions/epics/db-physical-design/epic.yaml"
      required: true
    - path: "prompts/definitions/tasks/db-physical-design/physical-er-spec.yaml"
      required: true
    - path: "prompts/definitions/tasks/db-physical-design/enum-code-definitions.yaml"
      required: true

