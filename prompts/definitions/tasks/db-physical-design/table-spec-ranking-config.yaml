background: |
  Phase2 子 Task ③。実装フェーズ実行プロセス設計書 §6.3 の「テーブル定義書（1テーブル=1Task）」に対応。
  物理ER §15 適用順序どおり Master / Config 系を継続する。
  先行 Task ② enum 定義書・Task ③ relationship_master / occasion_master テーブル定義書を前提とする。

objective: |
  `ranking_config` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の ranking_config テーブル定義書作成"
  - "物理ER・論理ER §11.1・Ranking定義書・テーブル一覧 §9 との突合"
  - "relationship_master / occasion_master テーブル定義書の章構成・MVP 方針を踏襲"
  - "Task / Review Definition の整備"

out_of_scope:
  - "他テーブルのテーブル定義書"
  - "DDL・migration（Task ④⑤）"
  - "db/seeds ファイルの作成（Task ⑤）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更"

input:
  docs:
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "テーブル分類・FK・Index 方針"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "enum 参照（本テーブルは state enum なし）"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§11.1 エンティティ属性・正本区分"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§9 Master / Config系・用途"
    - path: "docs/04_ドメインモデル設計/Ranking定義書.md"
      required: true
      purpose: "Ranking パラメータ・parameter_json 想定キー"
    - path: "docs/06_実装設計/database/relationship_master_テーブル定義書.md"
      required: true
      purpose: "Master / Config 系テーブル定義書の構成踏襲"
    - path: "docs/06_実装設計/database/occasion_master_テーブル定義書.md"
      required: true
      purpose: "Master / Config 系テーブル定義書の構成踏襲"
  templates:
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "成果物テンプレート"

output:
  docs:
    - path: "docs/06_実装設計/database/ranking_config_テーブル定義書.md"
      action: "create"
      required: true
      template: "prompts/templates/docs/table-spec.md"
  files:
    - path: "prompts/definitions/tasks/db-physical-design/table-spec-ranking-config.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/db-physical-design/table-spec-ranking-config/pr-review.yaml"
      action: "create"
      required: true

acceptance_criteria:
  - "ranking_config テーブル定義書が docs/06_実装設計/database/ に存在する"
  - "物理ER・論理ER §11.1・Ranking定義書と矛盾しない"
  - "recommendation_run.ranking_config_id との LOGICAL 参照方針が明記されている"
  - "apps/** 変更がない"
  - "Task PR target が親 Epic Branch"

branch:
  no_branch: false
  summary: "ranking-config-table-spec"
  base: null
  target: null
  worktree_required: true

project:
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"

issue:
  unit: "task"
  type: "docs"
  area: "db"

dependencies:
  issues:
    - number: 440
      purpose: "Task ② enum/コード定義 完了"
  blocking: true

parallel_control:
  exclusive_files:
    - "docs/06_実装設計/database/ranking_config_テーブル定義書.md"
  conflict_risk: "low"
  db_impact: false

test_policy:
  manual_checks:
    - "物理ER §8・§9・§11 とカラム・制約の整合"
    - "Ranking定義書の parameter_json 想定キーとの整合"
    - "relationship_master / occasion_master テーブル定義書との章構成一貫性"
    - "apps 実装層への変更がないこと"
  not_required:
    - "unit test"
  skip_reason:
    "unit test": "Phase2 docs 整備 Task のため"

review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: true

notes:
  - "テーブル一覧 §1.1: Task 識別子は物理テーブル名 ranking_config を使用"
  - "論点: ranking_config_id(uuid PK), config_name/config_version/parameter_json/is_current/created_at, recommendation_run LOGICAL FK"
  - "model_version テーブル定義 Task との責務分担は Human Review 論点とする"
