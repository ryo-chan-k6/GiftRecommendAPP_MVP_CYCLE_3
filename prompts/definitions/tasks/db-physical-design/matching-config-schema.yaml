background: |
  Epic #435 は Done（develop merge 済み）。MOD-RECO-015 モジュール仕様書（Issue #905 / PR #909）で、
  Social / Symbolic 集約重みは matching_config 経由で解決する前提を Human 判断（案 B）で確定した。
  現行 DB 正本には ranking_config は存在するが matching_config は未存在。model_version への JSON 列追加（案 A）は採用しない。
  Matching定義書 §13.1 は論理上 model_version 管理を記載するが、MVP DB 正本は matching_config.parameter_json にマッピングする（ranking_config と同型の責務分担）。

objective: |
  1. matching_config テーブル定義書を ranking_config_テーブル定義書.md と対称の粒度で作成する。
  2. 増分 DDL（db/ddl/ + supabase/migrations/）で matching_config テーブルを追加する。
  3. MVP 初期 seed（均等 Feature 重み）を supabase/seeds/masters/ に追加する。
  4. Run 再現性のため recommendation_run.matching_config_id（および必要な追随列）を docs / DDL に反映する。
  後続 Task（MOD-RECO-003 / MOD-RECO-014 / MOD-RECO-015 実装）が DB 正本を参照できる状態にする。

scope:
  - "docs/06_実装設計/database/matching_config_テーブル定義書.md 新規作成（prompts/templates/docs/table-spec.md 準拠）"
  - "ranking_config_テーブル定義書.md の章構成・制約方針を踏襲（config_name / config_version / parameter_json / is_current / created_at）"
  - "parameter_json MVP キー定義（social_feature_weights / symbolic_feature_weights および Matching定義書 §13.1 のその他キー列挙）"
  - "増分 DDL 作成（例: db/ddl/d14_matching_config.sql、適用正本 supabase/migrations/{timestamp}_matching_config.sql）"
  - "seed 追加（supabase/seeds/masters/09_config_versions.sql または専用 seed。config_name 初期値案: mvp_matching_config）"
  - "MVP 初期 seed: Social / Symbolic Feature 重みは均等（Matching定義書 §7.2 / §8.2 相当）"
  - "recommendation_run / recommendation_result / evaluation_run への matching_config_id 列追加（ranking_config_id と同型の LOGICAL 参照方針）"
  - "関連 docs 追随（物理ER / 論理ER / テーブル一覧 / run 定義書 / Matching定義書 §13.1 マッピング注記 / DDLバッチ分割表 D14 追記）"
  - "Task / Review Definition の整備（本ファイルおよび pr-review.yaml）"

out_of_scope:
  - "apps/reco/** 実装（MOD-RECO-003 Task へ）"
  - "MOD-RECO-014 / MOD-RECO-015 モジュール実装・仕様書本体の大幅改稿（§13 マッピング注記は本 Task で実施）"
  - "OpenAPI / generated 変更"
  - "ranking_config / model_version 既存行の破壊的変更"

