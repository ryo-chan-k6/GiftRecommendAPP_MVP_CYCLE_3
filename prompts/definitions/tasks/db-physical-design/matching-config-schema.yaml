task:
  id: "task-db-physical-design-matching-config-schema"
  title: "matching_config:Matching Config物理設計整備（テーブル定義・DDL・seed）"
  summary: "Human 判断（案 B）に基づき matching_config を ranking_config と対称に新設する。テーブル定義書・増分 DDL・seed・Run 再現性列（matching_config_id）追随を整備し、後続 Reco Config 解決 Task の DB 正本とする。"
  phase: "06_実装設計"

work_mode: "ai-agent"

