      required: true
      purpose: "epic_scope.allowed_paths と修正対象 path の整合確認"
  issues:
    - number: 435
      purpose: "親 Epic"
    - number: 440
      purpose: "enum/コード定義 Task（merge 済み前提）"
  prs: []

