  title: "db-physical-design:関連ドキュメント反映漏れチェック"
  summary: "62 テーブル定義書完了後・Epic PR → develop マージ前に、テーブル一覧・論理ER・物理ER・enum定義書・テーブル定義書群および横断参照 docs の反映漏れ・不整合・参照切れを棚卸しし、Blocker 級は修正する Phase2 Epic マージ前ゲート Task。"
  phase: "06_実装設計"

work_mode: "ai-agent"

parent:
  epic_id: "epic-db-physical-design"
  epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  epic_issue_number: 435
  epic_branch: "docs/epic-435-db-physical-design"
  related_issues:
    - number: 440
      purpose: "Task ② enum/コード定義（enum定義書・packages/code-definitions 正本。merge 済み前提）"
    - number: 439
      purpose: "Task ① 物理ER 仕様書（物理ER.md 正本。merge 済み前提）"
  related_prs: []

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
    - "docs-reviewer-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  Phase2 子 Task ③（テーブル定義書）が Batch R01〜R09 で **62/62 完了**（Epic Branch HEAD `deb1877` 時点）。
  Epic PR → develop マージ（Human 判断）の前に、テーブル定義書と関連 docs の横断整合を確認する Epic マージ前ゲート Task。
  Issue #582 / Branch `docs/task-582-related-docs-reflection-check` で作業する。

objective: |
  テーブル一覧・論理ER・物理ER・enum定義書・62 件のテーブル定義書・横断参照 docs について、反映漏れ・不整合・参照切れを棚卸しする。
  事実 / 推論 / 未確認を区別して一覧化し、Blocker 級は本 Task Branch 上で修正する。
  Epic PR → develop 進行可否の判断材料を PR 本文に整理する。

scope:
  - "チェック観点に沿った棚卸しの実施（テーブル一覧 62 件と定義書ファイルの対応、論理ER / 物理ER と各定義書のエンティティ・関係、enum定義書と定義書・#505 以降の enum 参照、定義書間 FK / 参照関係、横断 docs 参照切れ）"
  - "（未作成）プレースホルダ（コード定義書・データ保持・削除方針書）の扱い明記と一貫性確認"
  - "Issue 対象外事項（phase_log 統合、raw_product_object 非 DB 化）の記載一貫性確認"
  - "反映漏れ・不整合の一覧化（事実 / 推論 / 未確認の区分、Blocker / Must / Should / Question 分類）"
  - "Blocker 級不整合の docs 修正（本 Task scope 内で同一 PR に含める）"
  - "Epic PR → develop 進行可否の判断材料を PR 本文に記載"
  - "成果物一覧 §4.1（db-physical-design 成果物ステータス）の追加・更新"
  - "成果物連関図・成果物一覧×Task Definition化方針書の enum定義書名称整合"

out_of_scope:
  - "Epic PR の merge（Human 判断）"
  - "`develop` への直接反映"
  - "コード定義書・データ保持・削除方針書の新規本文作成（別 Task 化を検討）"
  - "DDL・migration / seed の新規作成・変更"
  - "apps/** 実装変更"
  - "packages/contracts/**・generated 変更"
  - "個別テーブル定義書の仕様再設計（本 Task は横断整合・反映漏れが主目的）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "62 テーブルと定義書ファイルの対応・（未作成）プレースホルダ・phase_log / raw_product_object 方針の正本"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "エンティティ・関係と各テーブル定義書の突合"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "物理エンティティ・FK・Index 方針と各テーブル定義書の突合"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "enum 定義とテーブル定義書・#440 以降追記の整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/正本定義表.md"
      required: true
      purpose: "正本区分・enum / コード定義の横断参照"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase2 成果物・Task 分割・Epic マージ前ゲートの位置づけ"
    - path: "docs/00_共通/成果物管理/成果物一覧.md"
      required: true
      purpose: "成果物ステータス・（未作成）表記の横断確認"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: false
      purpose: "Task / Epic 識別子と成果物対応の参考"
    - path: "docs/06_実装設計/database/"
      required: true
      purpose: "62 件の *_テーブル定義書.md の横断突合（glob 参照）"
  templates:
    - path: "prompts/templates/pr/task-pr.md"
      required: true
      purpose: "PR 本文テンプレート（棚卸し結果・判断材料の記載。/create-pr）"
  files:
