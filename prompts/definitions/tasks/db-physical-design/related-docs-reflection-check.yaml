risk_points:
  - "62 件の定義書と横断 docs の突合漏れ"
  - "enum 追記（#440 以降）と個別定義書の enum 参照の不整合"
  - "phase_log 統合方針の記載揺れ（recommendation_run_phase_log 等の残存記述）"
  - "raw_product_object 非 DB 化方針の記載揺れ"
  - "Blocker と Must の境界判断で Human 確認が必要になる可能性"

human_decision_points:
  - "Blocker 級と Must 級の境界（Epic PR を止めるかどうか）"
  - "修正が大規模化した場合の別 Task 化判断"
  - "コード定義書・データ保持・削除方針書を本 Epic 内で先行着手するか（out_of_scope 原則）"
  - "Epic PR → develop の merge 可否（Human 判断。本 Task は判断材料の整理まで）"

stop_conditions:
  - "正本 docs 間で矛盾があり、AI が独断で解消できない場合"
  - "Blocker 修正に DDL / migration / apps 変更が必要になった場合"
  - "62 件の定義書のうち欠落ファイルがあり、前提が満たされない場合"
  - "Epic Branch が Batch R01〜R09 完了状態でない場合"
  - "正本 docs 間の優先順位判断が Human 必要な場合"

notes:
