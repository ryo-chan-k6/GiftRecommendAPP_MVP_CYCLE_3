  - "Epic PR → develop 進行可否の判断材料が PR に記載されている"
  - "Task PR target が親 Epic Branch である"
  - "out_of_scope（Epic merge / develop 直接 / コード定義書・データ保持方針新規作成 / DDL / apps / OpenAPI）に該当する変更が含まれていない"

