  ai_review_required: true
  review_points:
    - "棚卸し結果が事実 / 推論 / 未確認で区別されているか"
    - "Blocker 級の扱い（修正 or Human 判断明示）が適切か"
    - "Epic PR 進行判断材料が PR 本文に記載されているか"
    - "out_of_scope 変更が混在していないか"
  specialist_reviews:
