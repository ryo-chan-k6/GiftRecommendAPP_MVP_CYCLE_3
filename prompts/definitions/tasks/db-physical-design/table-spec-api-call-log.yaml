background: |
  Phase2 子 Task ③ Batch R04 No.5。論理ER §9.2・テーブル一覧 §6 No.18。
  外部 API 呼び出しの監査・再実行・レート制御ログ。`fetch_cursor` → `api_call_log` → `raw_product_metadata` の連携中核。
  IF-DB-BATCH-002（API Call Log 保存）・IF-OBS-004（API Call Log 記録）の DB 正本。
  親 Epic Branch 最新（enum #440、fetch_cursor #505、raw_product_metadata #506 merge 済み前提）を前提とする。
  Issue #527 / Branch `docs/task-527-api-call-log-table-spec` で作業する。

objective: |
  `api_call_log` の物理カラム・制約・Index・保持方針を table-spec.md テンプレ準拠で定義する。
  `batch_run_log` / `fetch_cursor` との LOGICAL FK、`raw_product_metadata` との produces 関係、`call_status` 状態遷移（状態遷移設計書 §6.2）と Fetch Cursor 連動（§11.2）を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の api_call_log テーブル定義書作成"
  - "物理ER 外部商品データ連携系・Log 系分類・§9 FK 関係・§10 idx_api_call_log_batch との突合"
  - "論理ER §9.2 属性・§9.3 フロー・§14 状態一覧との整合"
  - "テーブル一覧 §6 No.18・Log / Observability 系補足との整合"
  - "状態遷移設計書 §6.2（call_status）・§11.2 / §11.3（異常系・再実行）との整合"
  - "enum定義書 §6.6 api_call_status・§6.24 source_api との整合"
  - "ログ・Observability設計書 §14（api_call_log 主要項目・保存禁止情報・Retention）との突合・差分整理"
  - "外部商品データ連携設計書 §8.4（request_params 等）と api_call_log 責務境界の整理"
  - "fetch_cursor_テーブル定義書 §5.2 / §5.3（controls・rate_limited → paused）との双方向整合"
  - "raw_product_metadata_テーブル定義書 §5.2（produces・api_call_log_id nullable・trace）との双方向整合"
  - "インターフェース一覧 IF-DB-BATCH-002 / IF-OBS-004・バッチ設計方針書 Rate Limit 方針との整合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "fetch_cursor / raw_product_metadata テーブル定義書の再作成（#505 / #506 merge 済み）"
  - "batch_run_log / phase_log / error_log テーブル定義書"
  - "raw_product_object（Object Storage 正本）のテーブル定義書"
  - "staging_* / product_diff_result 等の他外部商品データ連携系テーブル定義書"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

