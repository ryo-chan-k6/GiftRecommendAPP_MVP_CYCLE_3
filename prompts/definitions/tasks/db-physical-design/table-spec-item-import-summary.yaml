background: |
  Phase2 子 Task ③ Batch R05 No.1。論理ER §9.2・テーブル一覧 §6 No.26。
  外部商品取込バッチ（BATCH-017 Import Summary作成 / `MOD-BATCH-047` Item Import Summary Writer）の実行サマリ。
  Staging → item 昇格フロー（BATCH-005〜007）および product_diff_result 差分判定結果を集約し、運用・Observability で件数を把握する。
  親 Epic Branch 最新（product_diff_result #526 / PR #531、staging_item #517 / PR #522 merge 済み前提）を前提とする。
  Issue #533 / Branch `docs/task-533-item-import-summary-table-spec` で作業する。

objective: |
  `item_import_summary` の物理カラム・制約・Index・集計仕様を table-spec.md テンプレ準拠で定義する。
  `batch_run_log` / `product_diff_result` / `staging_item` との関係、BATCH-017 INSERT 方針、Retention 方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の item_import_summary テーブル定義書作成"
  - "物理ER Log系・batch_run_log summarizes 関係・論理ER §9.2 / §14・テーブル一覧 §6 No.26 との突合"
  - "ログ・Observability設計書 §6.2 / §13.3 / §20.2 / §22・IF-OBS-006 との整合"
  - "バッチ設計方針書 BATCH-017 / §14.1 集計単位・§15.2 Batch ID伝播・GRS-BAT-005 失敗件数記録との整合"
  - "バッチ処理一覧・バッチ依存関係図・機能×モジュール対応表（MOD-BATCH-047）との整合"
  - "インターフェース一覧 IF-DB-BATCH-017（INSERT）・IF-OBS-006 との整合"
  - "状態遷移設計書 §6.6 Item反映一部失敗時の failed_count 集計との整合"
  - "enum定義書 / packages/code-definitions/batch/source_api.yaml との source_api 整合"
  - "product_diff_result_テーブル定義書 §5.1（件数集計は item_import_summary 責務）との突合"
  - "staging_item_テーブル定義書（Staging → item 昇格フロー・BATCH-005〜007 文脈）との突合"
  - "処理構成定義書・正本定義表・リソース一覧・リソース責務定義表との整合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "batch_run_log / phase_log / error_log テーブル定義書（#534〜#536 別 Task）"
  - "api_call_log テーブル定義書の再作成（既存定義書を参照のみ）"
  - "product_diff_result / staging_item テーブル定義書の再作成（merge 済みを参照）"
  - "item / raw_product_metadata 等の他テーブル定義書"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

