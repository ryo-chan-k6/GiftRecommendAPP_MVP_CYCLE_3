  summary: "物理ER・論理ER・テーブル一覧・ログ・Observability設計書・バッチ設計方針書・product_diff_result / staging_item テーブル定義書を入力に、外部商品取込バッチの実行サマリ正本 `item_import_summary` のテーブル定義書を作成する。Phase2 子 Task ③ Batch R05 No.1。"
