background: |
  Phase2 子 Task ③ Batch2-2。Semantic / Feature 定義系の version 管理テーブル。
  物理ER §9 では `semantic_config` への物理 FK（ON）、`recommendation_run` への LOGICAL 被参照を定義。
  先行 Task ② enum 定義書・Master / Config 系テーブル定義書・semantic_config テーブル定義書を前提とする。

objective: |
  `semantic_config_version` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  後続 DDL Task が migration を作成できる粒度まで確定する。

