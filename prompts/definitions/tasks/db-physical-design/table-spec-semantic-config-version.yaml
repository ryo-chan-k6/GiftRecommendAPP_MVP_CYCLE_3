  - "table-spec.md テンプレ準拠の semantic_config_version テーブル定義書作成"
  - "物理ER・論理ER §11.1・テーブル一覧 §8・API-PUB-007 との突合"
  - "relationship_master / ranking_config / model_version テーブル定義書の章構成・MVP 方針を踏襲"
  - "Task / Review Definition の整備"

out_of_scope:
