  - "`evaluation_result.recommendation_result_id` が LOGICAL 参照のまま（物理 FK なし）である"
  - "`evaluation_metric` → `evaluation_result` 物理 FK ON / `(evaluation_result_id, metric_name)` UNIQUE が定義書どおりである"
