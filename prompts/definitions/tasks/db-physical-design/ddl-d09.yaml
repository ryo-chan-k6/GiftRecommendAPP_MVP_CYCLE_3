background: |
  Phase2 子 Task ④ DDL の **バッチ D09（Evaluation 系・MVP△）**。オフライン評価（BATCH-018）の Dataset → Run → Result → Metric チェーンの基盤となる。
  対象 5 テーブルは [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §13 に列挙される。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）、D02（`db/ddl/d02_semantic_feature_definitions.sql`、Issue #599 / PR #615 merge 済み）、D03（`db/ddl/d03_master_config.sql`、Issue #600 / PR #616 merge 済み）、D04（`db/ddl/d04_item.sql`、Issue #601 / PR #617 merge 済み）、D05（`db/ddl/d05_external_product_integration.sql`、Issue #602 / PR #618 merge 済み）、D06（`db/ddl/d06_item_derived.sql`、Issue #603 / PR #619 merge 済み）、D07（`db/ddl/d07_online_recommendation.sql`、Issue #604 / PR #620 merge 済み）、D08（`db/ddl/d08_user_meaning.sql`、Issue #605 / PR #621 merge 済み）適用後に本バッチを実行する前提とする。
  `recommendation_request_id` / `recommendation_result_id` / `batch_run_id` / Config version 3 列は **LOGICAL 参照（物理 FK なし）** が正本方針。バッチ内物理 FK は Evaluation 系親子関係および D07 `recommendation_request` / `recommendation_result` 参照方針に従う。
  Issue #606 / Branch `chore/task-606-d09-ddl` で作業する。

objective: |
  `db/ddl/d09_evaluation.sql` を作成し、D09 対象 5 テーブルの PostgreSQL DDL を各テーブル定義書・物理 ER・enum定義書・コード定義書・マイグレーション方針書と整合させる。
  バッチ内の CREATE 順序は FK 依存に従う（`evaluation_dataset` → `evaluation_case` → `evaluation_run` → `evaluation_result` → `evaluation_metric`）。
  `evaluation_case.recommendation_request_id` / `evaluation_result.recommendation_result_id` / `evaluation_run.batch_run_id` / version 3 列は LOGICAL 参照のままとする。

scope:
  - "`db/ddl/d09_evaluation.sql` の新規作成"
  - "D09 対象 5 テーブルの `CREATE TABLE`、PK、UNIQUE、Index、CHECK、バッチ内で成立する物理 FK"
  - "  - `evaluation_dataset`"
  - "  - `evaluation_case`"
  - "  - `evaluation_run`"
  - "  - `evaluation_result`"
  - "  - `evaluation_metric`"
  - "D01〜D08 適用済み前提で実行可能な SQL（enum 型は D01 参照、`recommendation_request` / `recommendation_result` は D07 参照）"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "D10 以降のテーブル `CREATE TABLE`（Log / Metric 系）"
  - "D12 遅延 FK / 索引追加（後追い制約 Task）"
  - "`evaluation_case.recommendation_request_id` → `recommendation_request` 物理 FK（LOGICAL + Index 方針）"
  - "`evaluation_result.recommendation_result_id` → `recommendation_result` 物理 FK（LOGICAL + Index 方針）"
  - "`evaluation_run.batch_run_id` → `batch_run_log` 物理 FK（D10 先行のため LOGICAL 方針）"
  - "`evaluation_run` の version 3 列 → Config 系物理 FK（LOGICAL 方針）"
  - "`evaluation_run.recommendation_run_id` 物理列（MVP 非採用。Result 経由間接連携）"
  - "`evaluation_metric.evaluation_run_id` 物理列（Result 経由間接参照）"
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`db/seeds/**` の作成（Task ⑤）"
  - "`packages/code-definitions/**` の変更"
  - "`apps/**` 実装変更"
  - "docs の変更（DDLバッチ分割表・テーブル定義書は参照のみ）"

