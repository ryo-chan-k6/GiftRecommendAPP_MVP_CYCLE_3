  - "`evaluation_case` → `evaluation_dataset` 物理 FK ON / `uq_evaluation_case_dataset_label` が定義書どおりである"
  - "`evaluation_case.recommendation_request_id` が LOGICAL 参照のまま（物理 FK なし）である"
  - "`evaluation_run` → `evaluation_dataset` 物理 FK ON が定義書どおりである"
