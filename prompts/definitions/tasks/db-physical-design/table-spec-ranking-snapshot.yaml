background: |
  Phase2 子 Task ③ Batch R01 No.4。実装フェーズ実行プロセス設計書 §6.3 の「テーブル定義書（1テーブル=1Task）」に対応。
  楽天ランキングは差分反映ではなく取得回ごとの Snapshot として管理し、`item_popularity_signal` の親ヘッダとなる。
  物理ER §4.1 No.2・§16 引き継ぎ事項およびテーブル一覧 §14 No.1–2 を前提とする。
  先行 Task #494（external_genre / PR #499 merge 済み）で確定した `external_genre_id`（`bigint` 自然キー）・LOGICAL 参照方針を踏襲する。
  Issue #496 / Branch `docs/task-496-ranking-snapshot-table-spec` で作業する。

objective: |
  `ranking_snapshot` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `item_popularity_signal` との 1対多関係および冪等キー方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。
  `staging_ranking_signal` → `item_popularity_signal` 経路との関係を整理する。

scope:
  - "table-spec.md テンプレ準拠の ranking_snapshot テーブル定義書作成"
  - "物理ER Ranking Snapshot 系・Item 系との突合"
  - "論理ER §8.4・テーブル一覧 §5 No.15・§14 No.1–2 との整合"
  - "external_genre テーブル定義書 §8.2・external_genre_id（bigint）LOGICAL 参照方針との突合"
  - "staging_ranking_signal → item_popularity_signal 経路との関係整理"
  - "先行 merge 済み Item 系テーブル定義書（external_genre 等）の章構成を踏襲"
  - "Task / Review Definition の整備"

out_of_scope:
  - "item_popularity_signal テーブル定義書（Batch R02）"
  - "他テーブルのテーブル定義書"
  - "DDL・migration（Task ④⑤）"
  - "db/seeds ファイルの作成（Task ⑤）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

