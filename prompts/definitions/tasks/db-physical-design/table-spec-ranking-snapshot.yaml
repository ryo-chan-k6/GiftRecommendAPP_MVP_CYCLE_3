    - path: "docs/06_実装設計/database/external_genre_テーブル定義書.md"
      required: true
      purpose: "external_genre_id（bigint PK）・source + external_genre_id Upsert 方針・§8.2 被参照関係（merge 済み前提）"
    - path: "docs/06_実装設計/database/normalization_rule_テーブル定義書.md"
      required: true
      purpose: "Batch R01 系テーブル定義書の章構成・MVP 方針参考（merge 済み前提）"
  templates:
