background: |
  Phase2 子 Task ③ Batch R01 No.1。実装フェーズ実行プロセス設計書 §6.3 の「テーブル定義書（1テーブル=1Task）」に対応。
  Semantic / Feature 定義系の残件。Master / Config 系および Feature Rule 群（#462–#478 等）merge 済みを前提とする。
  `semantic_config_version` §8.1 では `normalization_rule` を子テーブル（contains / ON FK）として先行定義しているが、物理ER §8 一覧・テーブル一覧 §8 には未掲載。
  Issue #493 / Branch `docs/task-493-normalization-rule-table-spec` で作業する。

objective: |
  `normalization_rule` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `feature_normalization_version`（正規化 version / パラメータ正本）との責務分離を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。
  あわせて物理ER §8・§5 分解一覧およびテーブル一覧 §8 へ `normalization_rule` を追記し、正本 docs 間の未掲載ギャップを解消する。

scope:
  - "table-spec.md テンプレ準拠の normalization_rule テーブル定義書作成"
  - "物理ER.md への normalization_rule 行追加（§8 テーブル一覧・§5 feature_rule 分解一覧・必要に応じて FK/Index 方針）"
  - "テーブル一覧.md §8 への normalization_rule 行追加（§9 以降の通し No. 繰り下げ・§13 集計更新を含む）"
  - "物理ER Semantic/Feature定義系・FK方針との突合"
  - "論理ER §10.2・semantic_config_version §8.1・Featureルール定義書 §14 との整合"
  - "先行 merge 済みテーブル定義書（feature_definition / feature_normalization_version / relationship_rule 等）の章構成を踏襲"
  - "Task / Review Definition の整備"

out_of_scope:
  - "他テーブルのテーブル定義書"
  - "DDL・migration（Task ④⑤）"
  - "db/seeds ファイルの作成（Task ⑤）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"
  - "論理ER.md へのエンティティ追記（別 docs Task 化を検討）"

