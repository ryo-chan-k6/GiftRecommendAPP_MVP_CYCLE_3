background: |
  Phase2 子 Task ③ Wave2（Semantic / Feature 定義系 Rule 群）No.8。
  Wave1（semantic_config / semantic_config_version）merge 済み前提。
  `input_type_rule` は好み・避けたい・NG など入力種別ごとの Feature 適用方法を管理する内部 Rule である。
  物理ER・テーブル一覧では MVP `partial`（△）として扱い、MVP で物理テーブルを作成するかは Human Review で判断する。
  Featureルール定義書 §17 には input_type_rule 専用の論理項目節がなく、§2.1 / §11 のドメイン定義を物理設計へ落とし込む必要がある。
  Issue #477 / Branch `docs/task-477-input-type-rule-table-spec` で作業する。

objective: |
  `input_type_rule` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  MVP partial 採用方針と Public API 非公開を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の input_type_rule テーブル定義書作成"
  - "物理ER §8–§11・論理ER §10.2・Featureルール定義書 §2.1 / §11 との突合"
  - "semantic_config_version テーブル定義書の contains FK 方針を踏襲"
  - "MVP partial（テーブル一覧 △）採用方針を table-spec §17 未決事項へ整理"
  - "API-PUB-007 / API-PUB-008 に基づく Public API 非公開方針の明記"
  - "Task / Review Definition の整備"

out_of_scope:
