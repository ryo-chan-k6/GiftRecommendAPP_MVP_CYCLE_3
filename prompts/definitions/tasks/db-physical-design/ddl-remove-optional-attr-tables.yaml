background: |
  Epic #435 完了後フォローアップ Task 2。物理ER §17 No.7 では MVP で
  external_attribute / staging_attribute を作成しない（60 テーブル）が、
  DDL/migration には 62 テーブル含有の矛盾が残っていた。
  Human 判断（方針B）で DDL/migration から 2 テーブルを除去する。

objective: |
  物理ER §17 No.7・テーブル定義書の「MVP DDL は作成しない」と
  db/ddl / supabase/migrations の実体を 60 テーブルで一致させる。
  テーブル定義書 62 件は維持（2 件は定義のみ・DDL 未作成）。

scope:
  - "db/ddl/d04_item.sql から external_attribute 除去"
  - "db/ddl/d05_external_product_integration.sql から staging_attribute 除去"
  - "supabase/migrations/20260617120000_initial_schema.sql を d01..d12 再統合で上書き"
  - "db/ddl/d13_ddl_cross_check.sql 期待 60 件に更新"
  - "DDLバッチ分割表・成果物一覧・マイグレーション方針書 §12/§16 更新"
  - "scripts/epic-435-final-integration-check.py の分離検証"
  - "Task / Review Definition の整備"

out_of_scope:
  - "external_attribute_テーブル定義書.md / staging_attribute_テーブル定義書.md の削除"
  - "evaluation 系・reco_score_distribution_metric の DDL 変更"
  - "apps/** 実装"
  - "新規 supabase/migrations ファイル追加（2 本目）"

