background: |
  Phase2 子 Task ③ Batch R01 No.2。Item系・外部商品データ連携の上流マスタ。
  BATCH-001 による楽天ジャンル階層の内部正本として、`item` / `item_popularity_signal` / `fetch_cursor` 等から参照される。
  `staging_genre` → `external_genre` の Upsert 関係は物理ER・バッチ設計方針に従う。

objective: |
  `external_genre` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  ジャンル階層（parent / level / is_leaf）と Batch Upsert 方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の external_genre テーブル定義書作成"
  - "物理ER Item系・外部商品データ連携系との突合"
  - "論理ER §8.2・テーブル一覧 §5 No.13・§5 補足（ジャンル差分反映）・外部商品データ連携設計書 §12 との整合"
  - "staging_genre → external_genre Upsert 関係の参照方針を明記"
  - "Task / Review Definition の整備"

out_of_scope:
  - "他テーブルのテーブル定義書（staging_genre / item 等）"
  - "DDL・migration（Task ④⑤）"
  - "db/seeds ファイルの作成（Task ⑤）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

