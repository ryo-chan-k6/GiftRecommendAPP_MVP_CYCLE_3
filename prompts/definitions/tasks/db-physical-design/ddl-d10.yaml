acceptance_criteria:
  - "DDL ファイルが `db/ddl/d10_log_observability.sql` に存在する"
  - "D10 対象 3 テーブルが DDLバッチ分割表 §14 と一致する"
  - "各テーブルの列・型・制約が対応するテーブル定義書と矛盾しない"
  - "D01〜D09 適用済み前提で本ファイルが実行可能である"
  - "`batch_run_log` の `run_status` / `batch_type` CHECK と終端 / 非終端 `completed_at` CHECK が定義書どおりである"
  - "`batch_run_log` の count / duration 非負 CHECK が定義書どおりである"
  - "`phase_log` の MVP `owner_type` 3 値 CHECK が定義書どおりである"
  - "`phase_log` の owner 別 `phase_name` CHECK（recommendation_run / batch_run）が定義書どおりである"
  - "`phase_log` の `evaluation_run` owner 時 `phase_name` DB CHECK は MVP 省略である"
  - "`phase_log` の終端 / 非終端 `completed_at` CHECK が定義書どおりである"
  - "`error_log` の `owner_type` / `service` / `severity` CHECK が定義書どおりである"
  - "`error_log` の `system` owner 時 `owner_id` NULL 可 CHECK が定義書どおりである"
  - "`error_log` の `error_code` 形式 CHECK が定義書どおりである"
  - "polymorphic owner および `batch_run_id` 被参照に **物理 FK を付与していない**"
  - "D11 以降テーブルの CREATE が誤って本ファイルに含まれていない"
  - "`packages/code-definitions/**` および `apps/**` に変更がない"
  - "Task PR target が親 Epic Branch"

