background: |
  Phase2 子 Task ④ DDL の **バッチ D10（Log 系・MVP○）**。Batch / Online / Evaluation 横断の Observability 基盤となる Log 3 テーブルの基盤。
  対象 3 テーブルは [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §14 に列挙される。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）〜 D09（`db/ddl/d09_evaluation.sql`、Issue #606 / PR #622 merge 済み）適用後に本バッチを実行する前提とする。
  `batch_run_log` は Log 系ヘッダ。`phase_log` / `error_log` の polymorphic owner 参照は **LOGICAL 参照（物理 FK なし）** が正本方針。retention 詳細は ⑥ データ保持・削除方針書 Task で確定し、本 Task では列・索引のみ定義する。
  Issue #607 / Branch `chore/task-607-d10-ddl` で作業する。

objective: |
  `db/ddl/d10_log_observability.sql` を作成し、D10 対象 3 テーブルの PostgreSQL DDL を各テーブル定義書・物理 ER・enum定義書・コード定義書・マイグレーション方針書と整合させる。
  バッチ内の CREATE 順序は FK 依存に従う（`batch_run_log` → `phase_log` → `error_log`）。
  polymorphic `owner_type` / `owner_id` および下流テーブルからの `batch_run_id` 参照は LOGICAL 参照のままとする。

scope:
  - "`db/ddl/d10_log_observability.sql` の新規作成"
  - "D10 対象 3 テーブルの `CREATE TABLE`、PK、Index、CHECK"
  - "  - `batch_run_log`"
  - "  - `phase_log`"
  - "  - `error_log`"
  - "D01〜D09 適用済み前提で実行可能な SQL（enum 型は D01 参照、owner 正本テーブルは D05〜D09 参照）"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "D11 以降のテーブル `CREATE TABLE`（Metric 系）"
  - "D12 遅延 FK / 索引追加（後追い制約 Task）"
  - "`phase_log` / `error_log` の polymorphic owner 物理 FK（LOGICAL 方針）"
  - "`api_call_log.batch_run_id` → `batch_run_log` 物理 FK（D05 先行のため LOGICAL 方針）"
  - "`evaluation_run.batch_run_id` → `batch_run_log` 物理 FK（LOGICAL 方針）"
  - "retention ポリシーの DDL 実装（列・索引のみ。保持期間は ⑥ Task で確定）"
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`db/seeds/**` の作成（Task ⑤）"
  - "`packages/code-definitions/**` の変更"
  - "`apps/**` 実装変更"
  - "docs の変更（DDLバッチ分割表・テーブル定義書は参照のみ）"

