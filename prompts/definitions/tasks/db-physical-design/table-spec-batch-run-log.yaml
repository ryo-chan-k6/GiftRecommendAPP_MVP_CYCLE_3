background: |
  Phase2 子 Task ③ Batch R05 No.2。テーブル一覧 §6 No.56。
  Batch 実行単位のログ正本。`phase_log` / `error_log` の親（owner_type=batch_run）。
  `api_call_log` / `item_import_summary` / `product_diff_result` / `ranking_snapshot` 等の上流ヘッダ。
  IF-DB-BATCH-001（Batch Run Log 保存）・IF-OBS-003（Batch Run Log 記録）の DB 正本。
  親 Epic Branch 最新（enum #440、api_call_log #527 merge 済み前提）を前提とする。
  Issue #534 / Branch `docs/task-534-batch-run-log-table-spec` で作業する。

objective: |
  `batch_run_log` の物理カラム・制約・Index・実行状態を table-spec.md テンプレ準拠で定義する。
  `run_status` 状態遷移（状態遷移設計書 §6.1）と `phase_log` / `error_log` との親子関係（owner_type / owner_id）、
  下流テーブル（`api_call_log` 等）との LOGICAL FK を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の batch_run_log テーブル定義書作成"
  - "物理ER Log / Observability系分類・§9 FK 関係（phase_log / error_log / api_call_log / item_import_summary 等）との突合"
  - "論理ER §13.2 Log / 状態管理系エンティティ・§14.4 Raw / Staging / Item 上流関係との整合"
  - "テーブル一覧 §6 No.56・Log / Observability 系補足との整合"
  - "状態遷移設計書 §6.1（run_status）・§6.1.3 集計値方針との整合"
  - "enum定義書 §6.5 batch_run_status との整合"
  - "ログ・Observability設計書 §13.2（batch_run_log 主要項目）・§9.3 owner_type・§10.2 phase_log 親子・Retention との突合・差分整理"
  - "バッチ設計方針書 Batch Run 起動・終了・集計更新方針との整合"
  - "インターフェース一覧 IF-DB-BATCH-001 / IF-OBS-003 との整合"
  - "正本定義表 Batch Run Log 正本区分（Log）・Batch 管理主体との整合"
  - "api_call_log_テーブル定義書 §5.2（batch_run_id LOGICAL 参照・has 関係）との双方向整合"
  - "phase_log / error_log との親子関係（owner_type=batch_run / owner_id=batch_run_id）の明記"
  - "Task / Review Definition の整備"

out_of_scope:
  - "phase_log / error_log テーブル定義書（別 Task 化予定。本 Task では親子関係の整理のみ）"
  - "item_import_summary テーブル定義書"
  - "api_call_log テーブル定義書の再作成（#527 merge 済み）"
  - "recommendation_run / recommendation_run_phase_log テーブル定義書"
  - "staging_* / raw_product_metadata / fetch_cursor 等の他外部商品データ連携系テーブル定義書"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

