background: |
  Phase2 子 Task ③ Batch R07 No.1。テーブル一覧 §4 No.7。
  Online推薦時に reco（MOD-RECO-004 User Semantic Extractor）が生成する User 側 Semantic Concept 派生データ。
  物理ER §4.1 User意味推定系・§9 `recommendation_run.recommendation_run_id → user_semantic.recommendation_run_id`（generates / ON / 1:N）を前提とする。
  親 Epic Branch 最新（enum #440、semantic_config 系 #462–#463、item_semantic #513、recommendation_run #543 merge 済み）を前提とする。
  `semantic_config_version_id` との version 紐づけ方針は本 Task で確定する（`semantic_config_version_テーブル定義書` §8.2 は LOGICAL 候補。`item_semantic` は ON 採用との対称差分を明記する）。
  Issue #553 / Branch `docs/task-553-user-semantic-table-spec` で作業する。

objective: |
  `user_semantic` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `recommendation_run_id` への物理 FK（ON）・`semantic_config_version_id` との version 紐づけ方針・`extracted_semantic_json` 保持方針・IF-DB-RECO-003 保存 I/F を明記し、
  `item_semantic`（Batch / item 単位）との対称関係と差分（更新主体・親キー・JSON 列名・FK 方針）を整理して、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の user_semantic テーブル定義書作成"
  - "物理ER User意味推定系・§9 recommendation_run → user_semantic generates（ON 1:N）・§10 Index 方針との突合"
  - "論理ER §10.2 user_semantic 属性・§16 Online/Batch 責務境界（reco 生成・Run 単位）との整合"
  - "テーブル一覧 §4 No.7・User意味推定系補足（Online 生成・Feature Engine 共通）との整合"
  - "recommendation_run_テーブル定義書 §8.2 被参照関係・Run 開始時 semantic_config_version 解決との整合"
  - "semantic_config_version_テーブル定義書 §8.2 generates_with（LOGICAL 候補）・item_semantic（ON）との対称差分整理"
  - "item_semantic_テーブル定義書との対称関係（Semantic Concept 派生・version スナップショット・concept_code 参照）整理"
  - "semantic_concept / semantic_rule との extracted_semantic_json 内 concept_code 参照整合"
  - "正本定義表・リソース一覧・リソース責務定義表（User Semantic 派生正本）との整合"
  - "インターフェース一覧 IF-DB-RECO-003・機能×モジュール対応表 MOD-RECO-004・処理構成定義書との生成・保存 I/F 整理"
  - "認証・認可方針書（reco 作成主体）・ログ・Observability設計書（trace / phase との責務境界）との整合"
  - "Task / Review Definition の整備（必要時更新）"

out_of_scope:
  - "user_feature / user_meaning テーブル定義書（Batch R07 他 Task）"
  - "recommendation_run / recommendation_request テーブル定義書の再作成（merge 済みを参照）"
  - "item_semantic / item_feature / item_meaning テーブル定義書の再作成（#513 merge 済みを参照）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

