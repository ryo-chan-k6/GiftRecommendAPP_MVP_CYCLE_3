background: |
  Phase2 子 Task ③ Batch R06 No.1。論理ER §3 / §14.1・テーブル一覧 §3 No.2。
  Online推薦実行単位の正本。`recommendation_request` に紐づく run ライフサイクル（Request → Run → Result）の中核。
  IF-DB-RECO-001（Config / Version 参照）・IF-DB-RECO-002（Recommendation Run 保存）の DB 正本。
  親 Epic Branch 最新（enum #440、pair_master #449、Config / Version #450 / #451 / #463、Log #535 / #536、recommendation_request #537 merge 済み前提）を前提とする。
  Issue #543 / Branch `docs/task-543-recommendation-run-table-spec` で作業する。

objective: |
  `recommendation_run` の物理カラム・制約・Index・実行状態（`run_status`）を table-spec.md テンプレ準拠で定義する。
  `recommendation_request` との 1:N executes 関係、`recommendation_result` との 1:0..1 produces 関係、`pair_id` 物理 FK、`semantic_config_version_id` / `model_version_id` / `ranking_config_id` LOGICAL FK、phase_log / error_log との Log 連携を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の recommendation_run テーブル定義書作成"
  - "物理ER Online推薦系・§9 FK 関係（executes / produces / resolved_at_run / used_by / records / may_have）・§10 Index・§11 制約・§12 run_status との突合"
  - "論理ER §3 recommendation_run 属性・§14.1 Request → Run → Result フロー・§13 recommendation_run_phase_log 統合方針との整合"
  - "テーブル一覧 §3 No.2・Online推薦系補足（Run 単位状態 / pair 解決 / version 再現性）との整合"
  - "状態遷移設計書 §5.1 Recommendation Run 状態遷移・§5.1.4 Phase Log 方針・§13 ER 対応との整合"
  - "enum定義書 §6.1 recommendation_run_status・§6.15 owner_type（recommendation_run）との整合"
  - "packages/code-definitions/state/recommendation_run_status.yaml との整合"
  - "recommendation_request_テーブル定義書 §5.7 Config / Model Version 責務境界・pair_id Run 側保持との双方向整合"
  - "pair_master / semantic_config_version / model_version / ranking_config テーブル定義書（被参照 FK / Index 方針）との双方向整合"
  - "phase_log / error_log テーブル定義書（owner_type=recommendation_run・records / may_have 関係）との双方向整合"
  - "正本定義表・リソース一覧・リソース責務定義表・ログ・Observability設計書（trace キー）との突合"
  - "インターフェース一覧 IF-DB-RECO-001 / IF-DB-RECO-002 / IF-DB-RECO-009・処理構成定義書・処理フロー概要図との整合"
  - "API-INT-002 Reco推薦実行API契約仕様書（Run 生成・状態返却の DB 正本）との整合"
  - "機能×モジュール対応表 MOD-RECO-002 Recommendation Run Recorder との整合"
  - "物理ER §17 No.1（pair_id Run 保持）・§17.1 No.4 / No.6（version 列 Run 正本・LOGICAL FK）の反映"
  - "Task / Review Definition の整備"

out_of_scope:
  - "recommendation_result / recommendation_result_item / recommendation_reason / recommendation_feedback 等の Online推薦系子テーブル定義書（R06 以降別 Task）"
  - "user_semantic / user_feature / user_meaning テーブル定義書"
  - "recommendation_run_phase_log 独立テーブル（MVP では phase_log に統合）"
  - "recommendation_request / pair_master / Config / Log テーブル定義書の再作成（merge 済みを参照）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

input:
