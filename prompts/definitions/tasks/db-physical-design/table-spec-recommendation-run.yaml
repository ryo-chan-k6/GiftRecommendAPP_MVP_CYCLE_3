  summary: "物理ER・論理ER・状態遷移設計書・enum定義書・recommendation_request / Config / Master / Log テーブル定義書・API-INT-002 を入力に、Online推薦実行正本 `recommendation_run` のテーブル定義書を作成する。Phase2 子 Task ③ Batch R06 No.1。"
  phase: "06_実装設計"

