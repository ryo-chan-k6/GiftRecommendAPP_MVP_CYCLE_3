test_policy:
  manual_checks:
    - "物理ER §9 recommendation_request → recommendation_run executes（ON）・recommendation_run → recommendation_result produces（ON）との整合"
    - "物理ER §9 pair_master → recommendation_run resolved_at_run（ON）・semantic_config_version / model_version / ranking_config used_by（LOGICAL）との整合"
    - "物理ER §10 idx_recommendation_run_request_id / idx_recommendation_run_status / idx_recommendation_run_pair_id との整合"
    - "物理ER §11 fk_recommendation_run_pair 制約との整合"
    - "論理ER §3 属性（recommendation_request_id, semantic_config_version_id, model_version_id, ranking_config_id, started_at, completed_at, run_status）との整合"
    - "論理ER §14.1 Request → Run → Result フロー・再実行 1:N 方針との整合"
    - "テーブル一覧 §3 No.2・Online推薦系補足（Run 単位状態 / pair / version）との整合"
    - "状態遷移設計書 §5.1 run_status 遷移・started_at / completed_at 設定契機との整合"
    - "enum定義書 §6.1 recommendation_run_status・packages/code-definitions/state/recommendation_run_status.yaml との整合"
    - "recommendation_request 定義書 §5.7 version 列 Run 側正本・pair_id Run 側との双方向整合"
    - "pair_master / semantic_config_version / model_version / ranking_config 定義書との被参照 FK 整合"
    - "phase_log / error_log 定義書 owner_type=recommendation_run 連携との双方向整合"
    - "recommendation_run_phase_log 非物理化（phase_log 統合）方針の明記"
    - "インターフェース一覧 IF-DB-RECO-001 / IF-DB-RECO-002 / IF-DB-RECO-009 との整合"
    - "apps 実装層への変更がないこと"
  not_required:
    - "unit test"
  skip_reason:
    "unit test": "Phase2 docs 整備 Task のため"

review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: true

contract_gate:
  required: false

human_decision_points: []

human_review_decisions:
  - id: 1
    topic: "pair_id の保持先"
    decision: "`recommendation_run` に保持。`recommendation_request` は relationship_code / occasion_code のみ（物理ER §17 No.1）"
  - id: 2
    topic: "semantic_config_version_id / model_version_id / ranking_config_id 保持先"
    decision: "個別列正本は recommendation_run。Request は validated_payload のみ（Human Review #537 No.4）"
  - id: 3
    topic: "version 列の物理 FK"
    decision: "semantic_config_version_id / model_version_id / ranking_config_id は LOGICAL FK 維持（物理 FK なし）。pair_id のみ物理 FK ON（Human Review #537 No.6）"
  - id: 4
    topic: "recommendation_run_phase_log 物理化"
    decision: "MVP 物理テーブルなし。phase_log（owner_type=recommendation_run）に統合"
  - id: 5
    topic: "Online推薦コア Retention"
    decision: "MVP DELETE なし。具体保持期間は Phase2 ⑥ データ保持方針 Task で確定"
  - id: 6
    topic: "Run 再実行方針"
    decision: "同一 Run を再開せず、同一 Request に対する新規 Run として再実行（状態遷移設計書 §11）"

notes:
  - "Batch R06 No.1: recommendation_run（Online推薦系）"
  - "Issue #543 / Branch docs/task-543-recommendation-run-table-spec"
  - "Issue 本文のテーブル一覧参照 §4 は User意味推定系を指すため、正本は §3 No.2 を用いる"
