    - "物理ER §8 FK 表（item_id ON・1:0..1）とカラム・制約・Index の整合"
    - "論理ER §8.2 属性（item_review_summary_id / item_id / review_average / review_count / fetched_at）との整合"
    - "論理ER §8.3 出所列方針（item_image / item_review_summary 同型・source 系列なし）との整合"
    - "論理ER §7.3 review_average_snapshot / review_count_snapshot と recommendation_result_item の関係"
    - "テーブル一覧 §5 No.12 の分類・用途・batch 更新主体との整合"
    - "外部商品データ連携設計書 §9.2 reviewAverage/reviewCount Staging 変換・§10.3 反映先との整合"
    - "インターフェース一覧の Feature推定非利用（表示・Snapshot用途）方針の明記"
    - "item_テーブル定義書 §8.2（item_id 物理 FK ON）・§12.1（item Upsert 後に子テーブル反映）との整合"
