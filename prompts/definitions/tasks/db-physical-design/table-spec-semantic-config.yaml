schema_version: "1.0"
definition_type: "task"

task:
  id: "task-db-physical-design-table-spec-semantic-config"
  title: "semantic_config:Semantic Configテーブル定義書作成"
  summary: "物理ER・論理ER・Featureルール定義書・テーブル一覧を入力に、semantic_config のテーブル定義書を作成する。Phase2 子 Task ③ Batch2-1（Semantic / Feature定義系）の先頭 Task。"
  phase: "06_実装設計"

work_mode: "ai-agent"

parent:
  epic_id: "epic-db-physical-design"
  epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  epic_issue_number: 435
  epic_branch: "docs/epic-435-db-physical-design"
  related_issues:
    - number: 440
      purpose: "先行 Task ② enum/コード定義（merge 済み前提）"
    - number: 442
      purpose: "先行 Task ③ relationship_master テーブル定義書（merge 済み前提）"
    - number: 445
      purpose: "先行 Task ③ occasion_master テーブル定義書（merge 済み前提）"
    - number: 451
      purpose: "参考 Task ③ ranking_config テーブル定義書（Config 系構成参考）"
  related_prs:
    - number: 441
      purpose: "Task ② PR（merge 済み前提）"
    - number: 443
      purpose: "Task ③ relationship_master PR（merge 済み前提）"
    - number: 448
      purpose: "Task ③ occasion_master PR（merge 済み前提）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  Phase2 子 Task ③ Batch2-1。実装フェーズ実行プロセス設計書 §6.3 の「テーブル定義書（1テーブル=1Task）」に対応。
  物理ER §15 適用順序どおり Semantic / Feature定義系（§8）を着手する。
  先行 Task ② enum 定義書・Task ③ Master / Config 系テーブル定義書を前提とする。

objective: |
  `semantic_config` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  後続 DDL Task および semantic_config_version テーブル定義 Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の semantic_config テーブル定義書作成"
  - "物理ER §8 Semantic/Feature定義系・§9 FK（semantic_config → semantic_config_version ON）との突合"
  - "論理ER §11.1・テーブル一覧 §8・Featureルール定義書との整合"
  - "relationship_master / ranking_config テーブル定義書の章構成・MVP 方針を踏襲"
  - "Task / Review Definition の整備"

out_of_scope:
  - "他テーブルのテーブル定義書（semantic_config_version 等）"
  - "DDL・migration（Task ④⑤）"
  - "db/seeds ファイルの作成（Task ⑤）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更"

input:
  docs:
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "テーブル分類・FK・Index 方針"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "enum 参照（本テーブルは state enum なし）"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§10.2 / §11.1 エンティティ属性・正本区分"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§8 Semantic / Feature定義系・用途"
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: true
      purpose: "Feature 8 軸参照（子テーブル側との責務分担）"
    - path: "docs/06_実装設計/api/API-PUB-007_Semantic設定取得API契約仕様書.md"
      required: true
      purpose: "configName 表面公開と内部 Config 非公開の境界"
    - path: "docs/06_実装設計/database/relationship_master_テーブル定義書.md"
      required: true
      purpose: "Master / Config 系テーブル定義書の構成踏襲"
    - path: "docs/06_実装設計/database/ranking_config_テーブル定義書.md"
      required: false
      purpose: "Config 系 UUID PK・系列管理構成参考（未 merge 時は worktree 参照可）"
  templates:
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "成果物テンプレート"

output:
  docs:
    - path: "docs/06_実装設計/database/semantic_config_テーブル定義書.md"
      action: "create"
      required: true
      template: "prompts/templates/docs/table-spec.md"
  files:
    - path: "prompts/definitions/tasks/db-physical-design/table-spec-semantic-config.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/db-physical-design/table-spec-semantic-config/pr-review.yaml"
      action: "create"
      required: true

acceptance_criteria:
  - "semantic_config テーブル定義書が docs/06_実装設計/database/ に存在する"
  - "物理ER §8・§9・論理ER §11.1・テーブル一覧 §8 と矛盾しない"
  - "semantic_config_version への物理 FK 被参照元（ON）方針が明記されている"
  - "Public API 非公開（内部 Config）方針が明記されている"
  - "apps/** 変更がない"
  - "Task PR target が親 Epic Branch"

branch:
  no_branch: false
  summary: "semantic-config-table-spec"
  base: null
  target: null
  worktree_required: true

project:
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"

issue:
  unit: "task"
  type: "docs"
  area: "db"

dependencies:
  issues:
    - number: 440
      purpose: "Task ② enum/コード定義 完了"
  blocking: true

parallel_control:
  exclusive_files:
    - "docs/06_実装設計/database/semantic_config_テーブル定義書.md"
  conflict_risk: "low"
  db_impact: false

test_policy:
  manual_checks:
    - "物理ER §8・§9 とカラム・制約の整合"
    - "論理ER §11.1 属性との整合"
    - "API-PUB-007 configName 表面公開と内部 Config 非公開の整合"
    - "relationship_master / ranking_config テーブル定義書との章構成一貫性"
    - "apps 実装層への変更がないこと"
  not_required:
    - "unit test"
  skip_reason:
    "unit test": "Phase2 docs 整備 Task のため"

review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: true

notes:
  - "テーブル一覧 §1.1: Task 識別子は物理テーブル名 semantic_config を使用"
  - "論点: semantic_config_id(uuid PK), config_name/config_description/is_active/created_at, semantic_config_version 物理 FK 被参照元, Public API 非公開"
  - "is_active と semantic_config_version.is_current の解決階層は Human Review 論点とする"
