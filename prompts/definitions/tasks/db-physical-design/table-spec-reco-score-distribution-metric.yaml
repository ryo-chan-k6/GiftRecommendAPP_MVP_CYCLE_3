background: |
  Phase2 子 Task ③ Batch R08 No.2。テーブル一覧 §11 No.62。
  Matching / Ranking スコア分布の Observability 指標。MVP は `partial`（△）。主な更新主体は **reco**（Online 推薦実行時）。
  物理ER §8 Log / Observability系 / Metric 分類・`metric` schema 候補を前提とする。
  親 Epic Branch 最新（batch_run_log #534、recommendation_run #543、recommendation_result #544、recommendation_result_item #545、
  feature_distribution_metric #556、meaning_distribution_metric #557 merge 済み）を前提とする。
  `feature_distribution_metric_テーブル定義書` / `meaning_distribution_metric_テーブル定義書` の §5.5 / §5.7 / §17.1（Human Review 先例）を Metric 系列の対称設計参考とする。
  Issue #564 / Branch `docs/task-564-reco-score-distribution-metric-table-spec` で作業する。

objective: |
  `reco_score_distribution_metric` の物理カラム・制約・Index・集計粒度を table-spec.md テンプレ準拠で定義する。
  `batch_run_log` / `recommendation_result` / `recommendation_result_item` との関係（LOGICAL FK・集計入力・Run / Result trace）と
  reco 実行時の Metric 保存方針・ログ・Observability設計書 §11.2 / §12.9–§12.12 / §22.3 のスコア分布方針を明記し、
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の reco_score_distribution_metric テーブル定義書作成"
  - "物理ER Log / Observability系・Metric 分類・§8–§11 との突合"
  - "テーブル一覧 §11 No.62・Log / Observability 系補足（Metric 系・retention）との整合"
  - "ログ・Observability設計書 §11.2 推薦Runメトリクス・§12.9 集計粒度（run / daily / version）・§12.10–§12.12 分布メトリクス候補カラム・§20.2 Retention との突合・差分整理"
  - "ログ・Observability設計書 §22.3 reco 記録方針（matching score / final_score 分布）との整合"
  - "論理ER §14 Online推薦フロー・RecommendationResult定義書 §15.1 スコア項目との整合"
  - "batch_run_log_テーブル定義書 §5.2 LOGICAL FK 方針との整合（batch_run_id 任意参照・trace 境界）"
  - "recommendation_run_テーブル定義書との Run 単位 trace・version スナップショット整合"
  - "recommendation_result_テーブル定義書との Result ヘッダ trace・1 Run : 0..1 Result 境界整合"
  - "recommendation_result_item_テーブル定義書 §5 / §6 との集計入力責務境界（個別スコア vs 分布統計量）"
  - "phase_log_テーブル定義書 §5.7 Reco 品質メトリクス記録境界（phase 名追加なし方針）との整合"
  - "feature_distribution_metric_テーブル定義書 / meaning_distribution_metric_テーブル定義書 との対称設計（aggregation_scope・冪等キー・Retention・entity_type / value_layer 境界）参考"
  - "feature_distribution_metric / meaning_distribution_metric / normalization_distribution_metric との責務分離（本 Task は Matching / Ranking スコア軸のみ）"
  - "インターフェース一覧 IF-OBS-005（Metric 記録・△）・IF-DB-RECO-007 保存フローとの整合整理"
  - "Task / Review Definition の整備"

out_of_scope:
  - "feature_distribution_metric / meaning_distribution_metric / normalization_distribution_metric テーブル定義書の再作成（merge 済み / 並行 Task を参照）"
  - "batch_run_log / phase_log / recommendation_run / recommendation_result / recommendation_result_item テーブル定義書の再作成（merge 済みを参照）"
  - "BATCH-016 分布メトリクス集計 Batch の再定義（Feature / Meaning / Normalization 系の責務）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"
  - "候補全件スコアの永続化（Observability §12.10 方針どおり Result Item 上位 K 件のみ正本）"
  - "enum定義書への reco 専用 phase 追加（必要時は Human Review 論点として整理のみ）"

