  title: "evaluation_case:Evaluation Caseテーブル定義書作成"
  summary: "物理ER・論理ER §12.2・Evaluation評価定義書・テーブル一覧 §10 No.52・evaluation_dataset / recommendation_request テーブル定義書・BATCH-018 / IF-SHARED-004 を入力に、オフライン評価ケース正本 `evaluation_case` のテーブル定義書を作成する。Phase2 子 Task ③ Batch R08 No.4。"
  phase: "06_実装設計"

work_mode: "ai-agent"

