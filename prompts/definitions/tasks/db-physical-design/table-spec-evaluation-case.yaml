background: |
  Phase2 子 Task ③ Batch R08 No.4。テーブル一覧 §10 No.52。MVP△。
  評価ケース定義。`evaluation_dataset` に属する個別テストケースの内部正本。
  BATCH-018（Offline Evaluation Batch）が Dataset 内 Case を読み取り、IF-SHARED-004 / `mode=evaluation` で reco pipeline を実行する入力正本。
  物理ER §9：`evaluation_dataset.evaluation_dataset_id` → `evaluation_case.evaluation_dataset_id`（contains・物理 FK ON・1:N）。
  論理ER §12.2：`input_condition_json` / `expected_result_json` / `case_label` / `is_active` を主要属性とする。
  親 Epic Branch 最新（enum #440、Master #442 / #445、recommendation_request #537 merge 済み）および **#565 evaluation_dataset テーブル定義書 merge 済み** を前提とする。
  Issue #566 / Branch `docs/task-566-evaluation-case-table-spec` で作業する。

objective: |
  `evaluation_case` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `evaluation_dataset` との親子関係（contains・物理 FK ON）、`input_condition_json` / `expected_result_json` の JSONB 責務、
  `recommendation_request` との may_reference 関係（論理ER §12.1）、BATCH-018 / IF-SHARED-004 / API-INT-002 evaluation mode との I/F を明記し、
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の evaluation_case テーブル定義書作成"
  - "物理ER Evaluation系・§9 contains（evaluation_dataset → evaluation_case）・§10 Index 方針との突合"
  - "論理ER §12.1 Evaluation系 ER 図・§12.2 evaluation_case 属性との整合"
  - "テーブル一覧 §10 No.52・Evaluation系補足（MVP△・オフライン評価）との整合"
  - "Evaluation評価定義書 §5.2 評価ケース構成・§14.2 offline_eval_case 論理項目との差分整理"
  - "正本定義表 §5.12 Evaluation Case 内部正本・制御更新可方針との整合"
  - "リソース一覧 / リソース責務定義表 Evaluation Case 分類との整合"
  - "処理構成定義書 §13 Offline Evaluation・バッチ処理一覧 BATCH-018 入出力との整合"
  - "バッチ設計方針書 / バッチ依存関係図 / 機能×モジュール対応表 MOD-BATCH-039 との整合"
  - "インターフェース一覧 IF-SHARED-004（evaluation_case → mode=evaluation → recommendation_result / metrics）との整合"
  - "API-INT-002 Reco推薦実行API契約仕様書 evaluation mode 前提との整合"
  - "recommendation_request_テーブル定義書 §5.4 / §5.5 入力条件列・payload 方針との input_condition_json マッピング整理"
  - "evaluation_dataset_テーブル定義書 §5 親子関係・Dataset 単位一意性方針との双方向整合（#565 merge 済み正本）"
  - "エラーコード定義書 GRS-EVAL-002（Invalid Evaluation Case）との整合"
  - "全体テスト計画書 evaluation_case 相当管理方針との突合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "evaluation_dataset / evaluation_run / evaluation_result / evaluation_metric テーブル定義書の再作成（#565 / #567 等は別 Task）"
  - "recommendation_request テーブル定義書の再作成（merge 済みを参照）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"
  - "BATCH-018 バッチ仕様書本体の作成（バッチ仕様書 Task の責務）"
  - "Evaluation Metric 計算ロジック・人手評価 UI の実装詳細"

