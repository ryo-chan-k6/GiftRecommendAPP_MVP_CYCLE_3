background: |
  Phase2 子 Task ③ Batch R08 No.1。テーブル一覧 §11 No.61。
  正規化前後（raw / z-score / sigmoid）分布の Observability 指標。BATCH-013（Feature 正規化）で候補生成、BATCH-016（分布メトリクス集計 Batch）で batch が `item_feature` 等から集計して本テーブルへ保存する。
  物理ER §8 Log / Observability系 / Metric 分類・`metric` schema 候補を前提とする。
  親 Epic Branch 最新（enum #440、feature_normalization_version #458、item_feature #514、batch_run_log #534、phase_log #535、feature_distribution_metric #556、meaning_distribution_metric #557 merge 済み）を前提とする。
  `feature_distribution_metric_テーブル定義書` / `meaning_distribution_metric_テーブル定義書` §5.5 / §5.8 / §17.1（Human Review #556 / #557 決定済み）を Metric 系列の対称設計正本として踏襲する。
  Issue #563 / Branch `docs/task-563-normalization-distribution-metric-table-spec` で作業する。

objective: |
  `normalization_distribution_metric` の物理カラム・制約・Index・集計粒度を table-spec.md テンプレ準拠で定義する。
  `batch_run_log` / `feature_normalization_version` / `item_feature` との関係（LOGICAL FK・正規化 version 再現性・集計入力・raw / z-score / sigmoid 軸）と
  BATCH-013 / BATCH-016 / IF-DB-BATCH-016 保存 I/F・ログ・Observability設計書 §12.6–§12.12 の正規化分布統計量方針を明記し、
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の normalization_distribution_metric テーブル定義書作成"
  - "物理ER Log / Observability系・Metric 分類・§8–§11 との突合"
  - "テーブル一覧 §11 No.61・Log / Observability 系補足（Metric 系・retention）との整合"
  - "ログ・Observability設計書 §12.6 正規化分布メトリクス・§12.10 集計単位・§12.11–§12.12 分布メトリクス候補カラム・§20.2 Retention（365日以上）との突合・差分整理"
  - "バッチ処理一覧 BATCH-013 / BATCH-016・バッチ設計方針書・バッチ依存関係図・機能×モジュール対応表 MOD-BATCH-038 との整合"
  - "インターフェース一覧 IF-DB-BATCH-016（分布メトリクス保存・INSERT）との整合"
  - "batch_run_log_テーブル定義書 §5.2 親子・LOGICAL FK 方針との整合（batch_run_id 参照）"
  - "feature_normalization_version_テーブル定義書 §5.2 / §7.1 / §8.2 との関係（正規化 version 正本・LOGICAL FK・冪等キー・再現性）"
  - "item_feature_テーブル定義書 §5.3 / §8 との集計入力（raw_feature_value / normalized_feature_value・feature_normalization_version_id）責務境界"
  - "feature_distribution_metric_テーブル定義書 §5.5 / §5.8 / §17.1 との対称設計（aggregation_scope・冪等キー・Retention・value_layer 境界）整合"
  - "meaning_distribution_metric_テーブル定義書 §5.5 / §5.6 / §17.1 との Metric 系列整合（phase_log trace 境界含む）"
  - "phase_log_テーブル定義書 feature_distribution_metric_recorded フェーズとの trace 境界（normalization 専用 phase の要否整理）"
  - "feature_distribution_metric / meaning_distribution_metric / reco_score_distribution_metric との責務分離（本 Task は正規化前後分布のみ）"
  - "Task / Review Definition の整備"

out_of_scope:
  - "feature_distribution_metric / meaning_distribution_metric / reco_score_distribution_metric テーブル定義書の再作成（#556 / #557 merge 済みを参照）"
  - "batch_run_log / phase_log / error_log / item_feature / feature_normalization_version テーブル定義書の再作成（merge 済みを参照）"
