background: |
  Phase2 子 Task ③ Batch R04 No.3。論理ER §9.2・テーブル一覧 §6 No.23。
  外部ジャンル情報の Staging 中間正本。`external_genre` マスタへの Upsert 前データ。
  `raw_product_metadata` → `staging_genre`（transforms_to）→ `external_genre`（upserts）のジャンル昇格フローの中核。
  BATCH-001（楽天ジャンル同期）・BATCH-005（Raw取込・Staging変換）で作成・更新され、ジャンル反映フェーズで `external_genre` へ Upsert する。
  親 Epic Branch 最新（enum #440、raw_product_metadata #506、external_genre #494、staging_item #517 merge 済み前提）を前提とする。
  Issue #525 / Branch `docs/task-525-staging-genre-table-spec` で作業する。

objective: |
  `staging_genre` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `raw_product_metadata` との transforms_to 関係、`external_genre` への Upsert キー（`source` + `external_genre_id`）・列マッピング、BATCH-001 / BATCH-005 との関係を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の staging_genre テーブル定義書作成"
  - "物理ER 外部商品データ連携系・論理ER §9.2・テーブル一覧 §6 No.23 との突合"
  - "外部商品データ連携設計書 §12（ジャンルデータ連携）・§4.4 楽天ジャンル検索API マッピングとの整合"
  - "raw_product_metadata_テーブル定義書 §5.5 transforms_to 関係・ジャンル Raw 保存方針との整合"
  - "external_genre_テーブル定義書 §5.2 Upsert 関係・列マッピング・楽天API マッピングとの突合"
  - "staging_item_テーブル定義書 §8.3 関連 Staging・Retention・LOGICAL FK 方針との一貫性"
  - "バッチ設計方針書 BATCH-001 / BATCH-005・バッチ処理一覧・処理構成定義書 MOD-BATCH-020〜022 との登録/反映方針整理"
  - "インターフェース一覧 IF-DB-BATCH-005（Staging 保存）等との整合"
  - "staging_item / staging_item_image / staging_ranking_signal 等への関係整理（本体定義は別 Task へ委譲）"
  - "Task / Review Definition の整備"

out_of_scope:
  - "staging_item / staging_item_image / staging_ranking_signal / staging_attribute テーブル定義書（別 Task）"
  - "external_genre / item / product_diff_result テーブル定義書（本 Task では Upsert / transforms_to 関係の整理のみ）"
  - "api_call_log / fetch_cursor テーブル定義書"
  - "raw_product_object（Object Storage 正本・DB 非管理）のテーブル定義書"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

