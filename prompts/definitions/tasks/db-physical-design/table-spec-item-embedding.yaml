background: |
  Phase2 子 Task ③ Batch R03 No.4。論理ER §10.2・テーブル一覧 §7 No.31。
  Item Embedding（Retrieval 用ベクトル）の商品側正本。pgvector 想定。Batch 事前生成・Online 参照のみの責務境界を物理定義する。
  親 Epic Branch 最新（item #495 / model_version #450 / item_generation_queue #507 / item_semantic #513 / item_feature #514 merge 済み）を前提とする。
  BATCH-014（embedding_input_hash 算出）→ BATCH-015（Item Embedding 生成）の出力先テーブル。
  Issue #516 / Branch `docs/task-516-item-embedding-table-spec` で作業する。

objective: |
  `item_embedding` の物理カラム・制約・Index（btree / HNSW vector）・更新仕様を table-spec.md テンプレ準拠で定義する。
  冪等キー（`item_id` + `model_version_id` + `embedding_input_hash`）と
  `model_version_id` / `embedding_source_type` / `embedding_vector` の保持・参照方針を明記し、
  `model_version` および `item_meaning`（Item派生データ系・Matching 用スカラー正本）との関係を整理し、
  後続 DDL Task が migration（pgvector extension 含む）を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の item_embedding テーブル定義書作成"
  - "物理ER Item派生データ系・論理ER §10.2・テーブル一覧 §7 No.31 との突合"
  - "物理ER §9 FK（item_id ON / model_version_id ON）・§10 Index（idx_item_embedding_item_model / idx_item_embedding_vector HNSW）・§11 制約（uq_item_embedding_idempotent）との整合"
  - "物理ER §17 No.6（HNSW 第一候補）・§15 migration 適用順序（pgvector extension）の反映"
  - "model_version_テーブル定義書 §8.1（generates_with ON FK）・enum定義書 §12.1 No.3（embedding_source_type）との整合"
  - "item_テーブル定義書 §8.2 / item_generation_queue_テーブル定義書 §5 / §12 との再生成トリガー・Queue 消化先整合"
  - "item_feature_テーブル定義書 §5 / §8 との Item派生データ系パイプライン（feature → meaning → embedding）参照整理"
  - "item_meaning との関係整理（同一 item_id 配下の派生正本・Matching vs Retrieval 責務分離。未 merge 時は論理ER・テーブル一覧を正とする）"
  - "BATCH-014 / BATCH-015・バッチ依存関係図・インターフェース一覧 IF-DB-BATCH-015 との整合"
  - "論理ER §16.1 / §16.2 Online/Batch 責務境界（batch 更新・Online 参照のみ）の反映"
  - "Task / Review Definition の整備"

out_of_scope:
  - "item_meaning テーブル定義書本体（別 Task #515 / Batch R03 No.3）"
  - "user_embedding / query_embedding テーブル定義書（User意味推定系・別 Task）"
  - "embedding_input_hash 算出ロジックの実装詳細（BATCH-014 バッチ仕様書の責務）"
  - "embedding_source_type の packages/code-definitions YAML 正本化（本 Task では enum定義書 §12.1 方針の転記まで。YAML 正本化は後続 enum Task）"
  - "DDL・migration / seed（pgvector extension 適用 DDL 含む）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

