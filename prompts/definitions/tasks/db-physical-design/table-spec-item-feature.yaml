background: |
  Phase2 子 Task ③ Batch R03 No.2。論理ER §10.2・テーブル一覧 §7 No.29。
  8次元 Feature 値の商品側正本。Batch 事前生成・Online 参照のみの責務境界を物理定義する。
  親 Epic Branch 最新（item #495 / feature_definition #470 / feature_normalization_version #458 / item_generation_queue #507 merge 済み）を前提とする。
  BATCH-011（feature_input_hash 算出）→ BATCH-012（raw Feature 生成）→ BATCH-013（正規化）の出力先テーブル。
  Issue #514 / Branch `docs/task-514-item-feature-table-spec` で作業する。

objective: |
  `item_feature` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  冪等キー（`item_id` + `semantic_config_version_id` + `feature_code` + `feature_input_hash` + `feature_normalization_version_id`）と
  `feature_input_hash` / `feature_normalization_version_id` の保持・参照方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の item_feature テーブル定義書作成"
  - "物理ER Item派生データ系・論理ER §10.2・テーブル一覧 §7 No.29 との突合"
  - "物理ER §9 FK（item_id ON / semantic_config_version_id ON / feature_normalization_version_id LOGICAL）・§10 Index・§11 制約（uq_item_feature_idempotent / chk_feature_value_range）との整合"
  - "feature_definition / feature_normalization_version / normalization_rule テーブル定義書との参照キー・冪等キー整合"
  - "item_テーブル定義書 §8.2 / item_generation_queue_テーブル定義書 §5 / §12 との再生成トリガー・Queue 消化先整合"
  - "BATCH-011 / BATCH-012 / BATCH-013・バッチ依存関係図・インターフェース一覧 IF-DB-BATCH-012 との整合"
  - "enum定義書 §6.16 feature_code・packages/code-definitions/semantic/feature_code.yaml との整合"
  - "論理ER §16.1 / §16.2 Online/Batch 責務境界（batch 更新・Online 参照のみ）の反映"
  - "Task / Review Definition の整備"

out_of_scope:
  - "item_semantic / item_meaning / item_embedding テーブル定義書（別 Task / Batch R03）"
  - "user_feature テーブル定義書（User意味推定系・別 Task）"
  - "feature_input_hash 算出ロジックの実装詳細（BATCH-011 バッチ仕様書の責務）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

