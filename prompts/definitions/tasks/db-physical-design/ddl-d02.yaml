background: |
  Phase2 子 Task ④ DDL の **バッチ D02（Semantic / Feature 定義系）**。FK 依存の浅い層であり、D03 以降の Master / Item / Online 推薦系の前提となる。
  対象 12 テーブルは [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §6 に列挙される。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）適用後に本バッチを実行する前提とする。
  Issue #599 / Branch `chore/task-599-d02-ddl` で作業する。

objective: |
  `db/ddl/d02_semantic_feature_definitions.sql` を作成し、D02 対象 12 テーブルの PostgreSQL DDL を各テーブル定義書・物理 ER・enum定義書・コード定義書・マイグレーション方針書と整合させる。
  バッチ内の CREATE 順序は FK 依存に従う（`semantic_config` → `semantic_config_version` → `semantic_concept` / `feature_definition` → 各 `*_rule`）。

scope:
  - "`db/ddl/d02_semantic_feature_definitions.sql` の新規作成"
  - "D02 対象 12 テーブルの `CREATE TABLE`、PK、UNIQUE、Index、CHECK、バッチ内で成立する物理 FK"
  - "  - `semantic_config`"
  - "  - `semantic_config_version`"
  - "  - `feature_definition`"
  - "  - `semantic_concept`"
  - "  - `semantic_rule`"
  - "  - `relationship_rule`"
  - "  - `occasion_rule`"
  - "  - `pair_rule`"
  - "  - `concept_feature_rule`"
  - "  - `input_type_rule`"
  - "  - `feature_integration_rule`"
  - "  - `normalization_rule`"
  - "D01 適用済み前提で実行可能な SQL（enum 型・拡張は D01 参照）"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "D03 以降のテーブル `CREATE TABLE`（`feature_normalization_version` 等）"
  - "D03 テーブルへの物理 FK の `ALTER TABLE ... ADD CONSTRAINT`（`normalization_rule.feature_normalization_version_id` 等。D12 で後追い）"
  - "Master テーブル（`relationship_master` 等）への物理 FK（各 Rule 定義書の LOGICAL 参照方針に従い MVP では付与しない）"
  - "version 内 Concept 整合の複合 FK（`semantic_rule` 等。seed / reco 運用で担保）"
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`db/seeds/**` の作成（Task ⑤）"
  - "`packages/code-definitions/**` の変更"
  - "`apps/**` 実装変更"
  - "docs の変更（DDLバッチ分割表・テーブル定義書は参照のみ）"

