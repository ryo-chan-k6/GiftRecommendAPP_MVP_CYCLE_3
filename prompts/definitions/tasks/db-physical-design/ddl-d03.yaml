  - "後続: D04（#601）以降は本 Task 完了後に着手"
  - "D02 延期 FK: `pair_rule.pair_id` → `pair_master` は本 Task で後追い。`normalization_rule.feature_normalization_version_id` → `feature_normalization_version` は D12（#609）"
  - "Human Review 論点: Master / Config 系の LOGICAL 参照方針、`reason_template` の Master code 列 CHECK 範囲、Config version 管理パターン（`is_current` / `config_name` 等）"
