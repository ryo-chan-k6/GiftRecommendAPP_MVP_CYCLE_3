  no_branch: false
  summary: "d03-ddl"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

project:
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"

issue:
  number: 600
  unit: "task"
  type: "chore"
  area: "db"

