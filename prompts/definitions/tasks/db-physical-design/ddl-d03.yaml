  issues:
    - number: 435
      purpose: "親 Epic"
    - number: 611
      purpose: "先行 D01（extension / enum 型）完了"
    - number: 599
      purpose: "先行 D02（Semantic / Feature 定義系）完了"
    - number: 440
      purpose: "enum定義書・コード定義書完了"
    - number: 589
      purpose: "マイグレーション方針書完了"
  blocking: false

parallel_control:
  depends_on:
    - task_id: "task-db-physical-design-ddl-d02"
      issue: 599
      purpose: "D02 Semantic / Feature 定義系の適用前提（`pair_rule` 等）"
  exclusive_files:
    - "db/ddl/d03_master_config.sql"
    - "prompts/definitions/tasks/db-physical-design/ddl-d03.yaml"
