  conflict_risk: "low"
  db_impact: true

test_policy:
  manual_checks:
    - "D03 対象 7 テーブルがすべて `CREATE TABLE` されていること"
    - "各テーブルの PK / UNIQUE / Index / CHECK がテーブル定義書 §7〜§9 と一致すること"
    - "`pair_rule` → `pair_master` の延期物理 FK が定義書どおりであること"
    - "`normalization_rule` → `feature_normalization_version` の物理 FK が本ファイルに含まれないこと"
    - "`reason_template` の Master 参照が LOGICAL のまま（物理 FK なし）であること"
    - "D01 / D02 適用後に `psql` またはローカル DB 検証環境（#612）で構文・適用が通ること（可能な範囲）"
    - "`apps/**`・`packages/code-definitions/**` に意図しない変更がないこと"
  not_required:
    - "unit test"
    - "integration test"
    - "supabase migration apply"
  skip_reason:
    "unit test": "DDL 参照用 SQL のためアプリ unit test 対象外"
    "integration test": "migration 適用は Task ⑤（supabase 統合）で実施"
    "supabase migration apply": "本 Task は `db/ddl/` 参照用 DDL のみ。適用正本は Task ⑤"

review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
