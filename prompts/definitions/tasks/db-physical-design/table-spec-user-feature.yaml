background: |
  Phase2 子 Task ③ Batch R07 No.2。論理ER §7.2 / §10.2・テーブル一覧 §4 No.8。
  8次元 Feature 値の User 側正本。Online 推薦時に reco が生成・参照する責務境界を物理定義する。
  親 Epic Branch 最新（recommendation_run #543 / feature_definition #470 / feature_normalization_version #458 / item_feature #514 / Feature Rule 系 #473〜#478 merge 済み）を前提とする。
  User Feature Generator（MOD-RECO-007）が Relationship / Occasion / Pair / Concept 入力を統合し、正規化後に本テーブルへ保存する（処理構成定義書・Featureルール定義書 §18.1）。
  Issue #554 / Branch `docs/task-554-user-feature-table-spec` で作業する。

objective: |
  `user_feature` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `recommendation_run_id` 単位の 8 行モデル、`feature_normalization_version_id` の保持・参照方針、`source_type`（enum定義書 §12.1）を明記し、
  `item_feature` との対称関係（User 側 Run 単位 / Item 側商品単位の差分）を §8 系で整理する。
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の user_feature テーブル定義書作成"
  - "物理ER User意味推定系・論理ER §7.2 / §10.2・テーブル一覧 §4 No.8 との突合"
  - "物理ER §9 FK（recommendation_run_id ON / feature_normalization_version_id LOGICAL）・§11 制約（chk_feature_value_range）との整合"
  - "item_feature_テーブル定義書との対称関係・差分（Run 単位 / 商品単位、batch vs reco 更新主体、冪等キー有無）の明記"
  - "feature_definition / feature_normalization_version / normalization_rule テーブル定義書との参照キー整合"
  - "relationship_rule / occasion_rule / pair_rule / concept_feature_rule / input_type_rule / feature_integration_rule テーブル定義書との User Feature 生成入力整合"
  - "recommendation_run_テーブル定義書 §8.2 / 処理構成定義書 MOD-RECO-007 / 機能×モジュール対応表との整合"
  - "インターフェース一覧 IF-DB-RECO-003（User Semantic / Feature 保存）との整合"
  - "enum定義書 §6.16 feature_code・§12.1 user_feature_source_type・packages/code-definitions/semantic/feature_code.yaml との整合"
  - "論理ER §16.3（reco 生成）・§16.1（Online 中に item_feature 等を更新しない）との責務境界反映"
  - "Task / Review Definition の整備"

out_of_scope:
  - "user_semantic / user_meaning テーブル定義書（別 Task / Batch R07）"
  - "item_feature / item_semantic / item_meaning / item_embedding テーブル定義書（Item派生データ系・別 Batch）"
  - "User Feature 統合・正規化アルゴリズムの実装詳細（reco モジュール実装の責務）"
  - "feature_input_hash / item_generation_queue（Item 側 Batch 専用。User 側には適用しない）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

