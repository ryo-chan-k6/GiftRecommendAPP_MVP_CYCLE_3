background: |
  Phase2 子 Task ③ Wave2（Semantic / Feature 定義系 Rule 群）No.6。
  Wave1（semantic_config / semantic_config_version）および pair_master（Human Review #465）merge 済み前提。
  Featureルール定義書 §17.3 は relationship_code / occasion_code 列を論理項目とするが、
  pair_master テーブル定義書 §17.1 No.3 により物理 FK は **pair_id** を採用する（Human 決定済み）。
  推奨着手順: feature_definition → semantic_concept → semantic_rule → relationship_rule / occasion_rule / pair_rule → concept_feature_rule → partial 2 件。

objective: |
  `pair_rule` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の pair_rule テーブル定義書作成"
  - "物理ER §8–§11・論理ER §10.2・Featureルール定義書 §17.3 との突合"
  - "pair_master / feature_definition / semantic_config_version テーブル定義書の FK・章構成を踏襲"
  - "`pair_id` 物理 FK、`semantic_config_version_id` 物理 FK、`feature_code` + `feature_delta` 行モデルの明記"
  - "Public API 非公開方針（API-PUB-007 / API-PUB-008）の明記"
  - "Task / Review Definition の整備"

out_of_scope:
  - "他テーブルのテーブル定義書"
  - "DDL・migration（Task ④⑤）"
  - "db/seeds ファイルの作成（Task ⑤）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

