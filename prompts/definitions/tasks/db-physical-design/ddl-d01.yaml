background: |
  Phase2 子 Task ④ DDL の **先頭バッチ（D01）**。全テーブル DDL（D02〜）より先に `pgvector` 拡張と enum 型を定義する。
  `enum定義書.md` §4.1 に従い、PostgreSQL 型名には **論理 ID**（例: `recommendation_run_status`）を使用する。
  同一物理列名 `run_status` / `phase_name` は論理 ID で分離する（`recommendation_run_status` vs `batch_run_status`、`recommendation_run_phase_name` vs `batch_run_phase_name`）。
  親 Epic Branch 最新（enum定義書 #440 / コード定義書 #587 / マイグレーション方針書 #589 merge 済み、テーブル定義書 62 件完了）を前提とする。
  Issue #611 / Branch `chore/task-611-d01-extensions-and-enums-ddl` で作業する。

objective: |
  `db/ddl/d01_extensions_and_enums.sql` を作成し、以下を `enum定義書.md`・物理 ER §12・マイグレーション方針書 §8.1 / §13 と整合させる。
  1. `CREATE EXTENSION IF NOT EXISTS vector;`
  2. `enum定義書.md` §5 の論理 ID **26 件**の `CREATE TYPE`（値は §6 準拠、`enabled: yes` の値のみ）

scope:
  - "`db/ddl/d01_extensions_and_enums.sql` の新規作成"
  - "`CREATE EXTENSION IF NOT EXISTS vector;`"
  - "以下 26 型の `CREATE TYPE`（値は `enum定義書.md` §6 準拠）"
  - "  - `recommendation_run_status`, `recommendation_result_status`, `recommendation_feedback_status`"
  - "  - `phase_status`, `batch_run_status`, `api_call_status`, `raw_import_status`"
  - "  - `fetch_cursor_status`, `fetch_cursor_type`, `source_api`, `product_diff_status`"
  - "  - `item_active_status`, `item_generation_queue_status`, `evaluation_run_status`"
  - "  - `request_mode`, `feedback_target_type`, `feedback_type`, `owner_type`"
  - "  - `feature_code`, `item_generation_type`"
  - "  - `recommendation_run_phase_name`, `batch_run_phase_name`, `batch_type`"
  - "  - `input_type`, `application_method`, `polarity`"
  - "同一物理列名 `run_status` / `phase_name` の論理 ID 分離（enum定義書 §4.1）"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "テーブル `CREATE TABLE`（D02 以降）"
  - "`phase_log.phase_name` の owner 別 CHECK（各テーブル DDL Task）"
  - "`evaluation_run_phase_name` の定義（Evaluation 系で別途検討）"
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`packages/code-definitions/**` の変更"
  - "`apps/**` 実装変更"
  - "docs の変更（DDLバッチ分割表・enum定義書は参照のみ）"

