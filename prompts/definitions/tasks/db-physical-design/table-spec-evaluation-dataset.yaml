schema_version: "1.0"
definition_type: "task"

task:
  id: "task-db-physical-design-table-spec-evaluation-dataset"
  title: "evaluation_dataset:Evaluation Datasetテーブル定義書作成"
  summary: "物理ER・論理ER §12 Evaluation系・テーブル一覧 §10 No.51・BATCH-018・リソース責務定義表を入力に、評価用データセット正本 `evaluation_dataset` のテーブル定義書を作成する。Phase2 子 Task ③ Batch R08 No.3。"
  phase: "06_実装設計"

work_mode: "ai-agent"

parent:
  epic_id: "epic-db-physical-design"
  epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  epic_issue_number: 435
  epic_branch: "docs/epic-435-db-physical-design"
  related_issues:
    - number: 440
      purpose: "先行 Task ② enum/コード定義（evaluation_run_status 等。merge 済み前提）"
    - number: 535
      purpose: "phase_log テーブル定義書（evaluation_run owner。merge 済み前提）"
    - number: 536
      purpose: "error_log テーブル定義書（evaluation_run owner。merge 済み前提）"
    - number: 566
      purpose: "並行可能: evaluation_case テーブル定義書（子テーブル・contains FK 被参照）"
    - number: 567
      purpose: "並行可能: evaluation_run テーブル定義書（子テーブル・executed_by FK 被参照）"
  related_prs:
    - number: 441
      purpose: "Task ② PR（enum。merge 済み前提）"
    - number: 540
      purpose: "Task #535 PR（phase_log。merge 済み前提）"
    - number: 541
      purpose: "Task #536 PR（error_log。merge 済み前提）"

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  Phase2 子 Task ③ Batch R08 No.3。テーブル一覧 §10 No.51。
  評価用データセット正本。`evaluation_case` / `evaluation_run` の親エンティティ。
  BATCH-018（Offline Evaluation Batch）・IF-DB-BATCH-018 / IF-SHARED-004 の入力正本。
  物理ER Evaluation系分類・論理ER §12.1 / §12.2 を前提とする。
  親 Epic Branch 最新（enum #440、phase_log #535、error_log #536 merge 済み前提）を前提とする。
  Issue #565 / Branch `docs/task-565-evaluation-dataset-table-spec` で作業する。

objective: |
  `evaluation_dataset` の物理カラム・制約・Index を table-spec.md テンプレ準拠で定義する。
  `evaluation_case` との 1:N contains 関係、`evaluation_run` との 1:N executed_by 関係、
  データセット version / 有効化方針、BATCH-018 読取 I/F を明記し、
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の evaluation_dataset テーブル定義書作成"
  - "物理ER Evaluation系分類・§7–§11・Mermaid ER（contains / executed_by）との突合"
  - "論理ER §12.1 Evaluation系 ER 図・§12.2 evaluation_dataset 属性（dataset_name / dataset_description / dataset_version / is_active / created_at）との整合"
  - "テーブル一覧 §10 No.51・Evaluation系補足（MVP partial・オフライン評価）との整合"
  - "状態遷移設計書 §8.1.3 再評価方針（同一 Dataset で新規 Run / Result 追記）との整合"
  - "リソース一覧・リソース責務定義表 §6.12 Evaluation Dataset 責務（batch / database 更新・正本区分）との突合"
  - "インターフェース一覧 IF-DB-BATCH-018 / IF-SHARED-004・バッチ処理一覧 BATCH-018・バッチ設計方針書との整合"
  - "機能×モジュール対応表 / モジュール一覧 MOD-BATCH-039 Offline Evaluation Runner との整合"
  - "処理構成定義書・システム物理構成図の evaluation_dataset 取得フローとの整合"
  - "ログ・Observability設計書 evaluation_run_id trace キーとの境界整理（本テーブルは trace キーではない）"
  - "evaluation_case / evaluation_run 子テーブル定義 Task（#566 / #567）への FK / Index 引き継ぎ方針の明記"
  - "Task / Review Definition の整備"

out_of_scope:
  - "evaluation_case / evaluation_run / evaluation_result / evaluation_metric テーブル定義書（R08 別 Task #566 / #567 以降）"
  - "evaluation_run_status / evaluation_run_phase_name の新規 enum 定義（#440 merge 済みを参照。phase_name は Evaluation Task へ委譲）"
  - "semantic_config_version / model_version / ranking_config テーブル定義書の再作成（evaluation_run Task で参照）"
  - "phase_log / error_log テーブル定義書の再作成（merge 済みを参照）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"
  - "評価メトリクス算出ロジック・BATCH-018 バッチ仕様書の詳細実装"

input:
  docs:
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "Evaluation系分類・contains / executed_by ER・§9 FK（evaluation_case）・§7–§11"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "evaluation_run_status（§6.12）・request_mode evaluation（§6.13）参照。本テーブルは state enum なし"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§12.1 Evaluation系 ER 図・§12.2 evaluation_dataset 属性・正本区分"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§10 No.51 Evaluation Dataset・Evaluation系補足方針"
    - path: "docs/05_アプリケーション設計/アプリ/database/リソース一覧.md"
      required: true
