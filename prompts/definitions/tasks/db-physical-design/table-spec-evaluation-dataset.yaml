  - "evaluation_dataset テーブル定義書が docs/06_実装設計/database/ に存在する"
  - "evaluation_case / evaluation_run との親子関係（contains / executed_by）が明記されている"
  - "物理ER・論理ER §12.2・テーブル一覧 §10 No.51 と矛盾しない"
  - "dataset_name / dataset_version / is_active の MVP 方針が明記されている"
  - "BATCH-018 / IF-DB-BATCH-018 の読取正本としての責務が明記されている"
  - "apps/** 変更がない"
  - "Task PR target が親 Epic Branch"

branch:
  no_branch: false
  summary: "evaluation-dataset-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

project:
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"

issue:
  number: 565
  unit: "task"
  type: "docs"
  area: "db"

dependencies:
  issues:
    - number: 435
      purpose: "親 Epic 完了前提"
    - number: 440
      purpose: "Task ② enum/コード定義 完了（merge 済み前提）"
    - number: 535
      purpose: "phase_log テーブル定義書 完了（Log 系 R05。merge 済み前提）"
    - number: 536
      purpose: "error_log テーブル定義書 完了（Log 系 R05。merge 済み前提）"
  blocking: true

parallel_control:
  exclusive_files:
    - "docs/06_実装設計/database/evaluation_dataset_テーブル定義書.md"
  conflict_risk: "low"
  db_impact: false

test_policy:
  manual_checks:
    - "物理ER Mermaid ER evaluation_dataset → evaluation_case contains / evaluation_run executed_by との整合"
    - "物理ER §9 evaluation_dataset → evaluation_case contains（ON）1:N との整合"
    - "論理ER §12.2 属性（evaluation_dataset_id, dataset_name, dataset_description, dataset_version, is_active, created_at）との整合"
    - "テーブル一覧 §10 No.51・Evaluation系補足（MVP partial）との整合"
    - "状態遷移設計書 §8.1.3 同一 Dataset 再評価追記方針との整合"
    - "リソース責務定義表 §6.12 Evaluation Dataset 責務との整合"
    - "BATCH-018 / IF-DB-BATCH-018 / IF-SHARED-004 入出力との整合"
    - "evaluation_case / evaluation_run 子テーブルへの FK 引き継ぎ方針（evaluation_dataset_id 被参照）の明記"
    - "物理ER §9 に evaluation_run.executed_by FK 行が未掲載の場合、本定義書での方針確定と差分整理"
    - "apps 実装層への変更がないこと"
  not_required:
    - "unit test"
  skip_reason:
    "unit test": "Phase2 docs 整備 Task のため"

review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: true

contract_gate:
  required: false

human_decision_points: []

human_review_decisions:
  - id: 1
    topic: "dataset_name + dataset_version の UNIQUE"
    decision: "組み合わせ UNIQUE（uq_evaluation_dataset_name_version）。dataset_name 単独 UNIQUE は採用しない"
  - id: 2
    topic: "dataset_version の形式"
    decision: "semver 基本形 v1.0.0（chk_dataset_version_format）。semantic_config_version 同型"
  - id: 3
    topic: "is_active 列の MVP 物理 DDL"
    decision: "採用（boolean NOT NULL DEFAULT true）。semantic_config / occasion_master 踏襲"
  - id: 4
    topic: "evaluation_run.executed_by の物理 FK"
    decision: "evaluation_run.evaluation_dataset_id へ物理 FK ON / ON DELETE RESTRICT。物理ER §9 に反映"
  - id: 5
    topic: "Evaluation Dataset の Retention"
    decision: "365 日（created_at 基準）。MVP は自動 DELETE なし。日常は is_active=false"

notes:
  - "Batch R08 No.3: evaluation_dataset（Evaluation系ルート正本）"
  - "Issue #565 / Branch docs/task-565-evaluation-dataset-table-spec"
  - "R08 並行: #566 evaluation_case / #567 evaluation_run"
  - "先行 merge 済み前提: #440 / PR #441（enum）、#535 / PR #540（phase_log）、#536 / PR #541（error_log）"
  - "Human Review #565 確定: §17.1 No.1〜No.5（UNIQUE / semver / is_active / executed_by FK / Retention 365日）"
  - "OpenAPI / generated は Epic 終盤 Task #469 で一括同期"
