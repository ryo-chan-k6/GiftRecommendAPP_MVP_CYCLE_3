    - path: "docs/05_アプリケーション設計/アプリ/database/リソース責務定義表.md"
      required: true
      purpose: "§6.12 Evaluation Dataset 責務・正本 / 派生の境界"
    - path: "docs/05_アプリケーション設計/アプリ/状態遷移設計書.md"
      required: true
      purpose: "§8 Evaluation 状態遷移・§8.1.3 同一 Dataset 再評価の追記方針"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-BATCH-018 Evaluation保存・IF-SHARED-004 Offline Evaluation推薦実行"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-018 Offline Evaluation Batch 入出力"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "BATCH-018 評価データセット利用方針"
    - path: "docs/05_アプリケーション設計/アプリ/機能×モジュール対応表.md"
      required: true
      purpose: "BATCH-018 / MOD-BATCH-039 入出力"
    - path: "docs/05_アプリケーション設計/アプリ/モジュール一覧.md"
      required: true
      purpose: "MOD-BATCH-039 Offline Evaluation Runner"
    - path: "docs/05_アプリケーション設計/アプリ/処理構成定義書.md"
      required: true
      purpose: "Offline Evaluation フロー上の evaluation_dataset 取得位置"
    - path: "docs/05_アプリケーション設計/基盤/システム物理構成図.md"
      required: true
      purpose: "GHA → DB evaluation_dataset 取得フロー"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: true
      purpose: "evaluation_run trace キーとの責務境界"
    - path: "docs/06_実装設計/database/phase_log_テーブル定義書.md"
      required: true
      purpose: "evaluation_run owner 連携の文脈整理（merge 済み前提）"
    - path: "docs/06_実装設計/database/error_log_テーブル定義書.md"
      required: true
      purpose: "evaluation_run owner 連携の文脈整理（merge 済み前提）"
    - path: "docs/06_実装設計/database/semantic_config_テーブル定義書.md"
      required: false
