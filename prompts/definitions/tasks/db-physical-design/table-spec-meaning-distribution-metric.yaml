background: |
  Phase2 子 Task ③ Batch R07 No.5。テーブル一覧 §11 No.60。
  Social / Symbolic / λ_ctx 分布の Observability 指標。BATCH-016（分布メトリクス集計Batch）で batch が `item_meaning` / `user_meaning` 等から集計して生成する。
  物理ER §8 Log / Observability系 / Metric 分類・`metric` schema 候補を前提とする。
  親 Epic Branch 最新（enum #440、item_meaning #515、batch_run_log #534、phase_log #535、user_meaning #555、feature_distribution_metric #556 merge 済み）を前提とする。
  `feature_distribution_metric_テーブル定義書` §5.5 / §5.8 / §17.1（Human Review #556 決定済み）を Metric 系列の対称設計正本として踏襲する。
  Issue #557 / Branch `docs/task-557-meaning-distribution-metric-table-spec` で作業する。

objective: |
  `meaning_distribution_metric` の物理カラム・制約・Index・集計粒度を table-spec.md テンプレ準拠で定義する。
  `batch_run_log` / `item_meaning` / `user_meaning` との関係（LOGICAL FK・集計入力・Social / Symbolic / λ_ctx 軸）と
  BATCH-016 / IF-DB-BATCH-016 保存 I/F・ログ・Observability設計書 §12.10–§12.12 の分布統計量方針を明記し、
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の meaning_distribution_metric テーブル定義書作成"
  - "物理ER Log / Observability系・Metric 分類・§8–§11 との突合"
  - "テーブル一覧 §11 No.60・Log / Observability 系補足（Metric 系・retention）との整合"
  - "ログ・Observability設計書 §12.10 集計単位・§12.11–§12.12 分布メトリクス候補カラム・§20.2 Retention（365日以上）との突合・差分整理"
  - "バッチ処理一覧 BATCH-016・バッチ設計方針書・バッチ依存関係図・機能×モジュール対応表 MOD-BATCH-038 との整合"
  - "インターフェース一覧 IF-DB-BATCH-016（分布メトリクス保存・INSERT）との整合"
  - "batch_run_log_テーブル定義書 §5.2 親子・LOGICAL FK 方針との整合（batch_run_id 参照）"
  - "item_meaning_テーブル定義書 §5.5 分布メトリクス責務境界・§8.2 BATCH-016 集計入力との整合"
  - "user_meaning_テーブル定義書 §5.6 分布メトリクス責務境界・user_social / user_symbolic / lambda_ctx 集計入力との整合"
  - "feature_distribution_metric_テーブル定義書 §5.5 / §5.8 / §17.1 との対称設計（aggregation_scope・冪等キー・Retention・entity_type 境界）整合"
  - "phase_log_テーブル定義書 feature_distribution_metric_recorded フェーズとの trace 境界（meaning 専用 phase の要否整理）"
  - "normalization_distribution_metric / reco_score_distribution_metric との責務分離（本 Task は Meaning 軸のみ）"
  - "Task / Review Definition の整備"

out_of_scope:
  - "feature_distribution_metric / normalization_distribution_metric / reco_score_distribution_metric テーブル定義書の再作成（#556 merge 済みを参照）"
  - "batch_run_log / phase_log / error_log / item_meaning / user_meaning テーブル定義書の再作成（merge 済みを参照）"
