background: |
  Phase2 子 Task ③ Batch R06 No.4。論理ER §7.2・テーブル一覧 §3 No.5。
  推薦理由の派生Snapshot正本。`recommendation_result_item` ごとの理由文・バッジ・根拠を保持する。
  IF-DB-RECO-008（Reason保存）の DB 正本。
  `reason_template`（#457 / PR #459 merge 済み前提）を解決結果として `template_id` に論理参照する。
  親 Epic Branch 最新（recommendation_run #543 / recommendation_result #544 / recommendation_result_item #545 merge 済み前提）を前提とする。
  `recommendation_result_item_テーブル定義書.md` §8.2（has / 1:N・FK ON）・§5.5（Reason 項目は本テーブル側・api JOIN 返却）と双方向整合する。
  Issue #546 / Branch `docs/task-546-recommendation-reason-table-spec` で作業する。

objective: |
  `recommendation_reason` の物理カラム・制約・Index・`reason_basis_json` 保持方針を table-spec.md テンプレ準拠で定義する。
  `recommendation_result_item` への has 関係（1:N・物理 FK ON）・`reason_template` への template_id LOGICAL 参照・Reason生成定義書 §14.2 / §15.1 との整合を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の recommendation_reason テーブル定義書作成"
  - "物理ER Online推薦系・§9 FK（recommendation_result_item has）・§10 Index・§11 制約との突合"
  - "論理ER §7.2 Online推薦系属性・§14 Result Item → Reason 関係との整合"
  - "テーブル一覧 §3 No.5・Online推薦系補足（推薦理由文・理由要素）との整合"
  - "Reason生成定義書 §14.1〜§14.3 reason_basis・§15.1 recommendation_reason 論理項目との整合"
  - "RecommendationResult定義書 §11（Reason / Feedback 関係）・API 返却項目（reasonSummary / reasonBadges）との整合"
  - "reason_template_テーブル定義書（template_id LOGICAL 参照・reason_basis_json 必須項目・方式 B 利用記録）との双方向整合"
  - "recommendation_result_item_テーブル定義書 §8.2 / §5.5（has 1:N・Reason 項目非保持・api JOIN 方針）との双方向整合"
  - "正本定義表・リソース一覧・リソース責務定義表・機能×モジュール対応表（MOD-RECO-023）との突合"
  - "インターフェース一覧 IF-DB-RECO-008・処理構成定義書・処理フロー概要図・ログ・Observability設計書との整合"
  - "API-PUB-002 / API-INT-002（reasonSummary / reasonBadges → DB 物理列マッピング）との整合"
  - "認証・認可方針書（Reason 参照・Feedback 対象）・phase_log 設計（llm_prompt_version 参照）との整合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "recommendation_result_item / recommendation_feedback テーブル定義書の再作成（#545 / #547 別 Task）"
  - "reason_template テーブル定義書の再作成（#457 merge 済みを参照）"
  - "recommendation_run / recommendation_result / recommendation_request テーブル定義書の再作成"
  - "物理ER §9 への reason_template → recommendation_reason 関係行の追記（reason_template 定義書 follow-up と同方針）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

