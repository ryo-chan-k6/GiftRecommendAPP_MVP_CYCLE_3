  manual_checks:
    - "物理ER §9 recommendation_result_item → recommendation_reason has（FK ON・1:N）との整合"
    - "論理ER §7.2 属性（reason_badges_json / reason_summary / reason_detail / reason_points_json / caution_note / reason_basis_json）との整合"
    - "論理ER §14 Result Item → Reason 1対多関係との整合"
