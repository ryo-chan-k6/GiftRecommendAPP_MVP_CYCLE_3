background: |
  Phase2 子 Task ③ Batch R07 No.4。テーブル一覧 §11 No.59。
  Feature 分布の Observability 指標。BATCH-016（分布メトリクス集計Batch）で batch が `item_feature` 等から集計して生成する。
  物理ER §8 Log / Observability系 / Metric 分類・`metric` schema 候補を前提とする。
  親 Epic Branch 最新（enum #440、feature_definition #470、item_feature #514、batch_run_log #534、phase_log #535 merge 済み）を前提とする。
  Issue #556 / Branch `docs/task-556-feature-distribution-metric-table-spec` で作業する。

objective: |
  `feature_distribution_metric` の物理カラム・制約・Index・集計粒度を table-spec.md テンプレ準拠で定義する。
  `batch_run_log` / `feature_definition` / `item_feature` との関係（LOGICAL FK・集計入力・feature_code 参照）と
  BATCH-016 / IF-DB-BATCH-016 保存 I/F・ログ・Observability設計書 §12.10–§12.12 の分布統計量方針を明記し、
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の feature_distribution_metric テーブル定義書作成"
  - "物理ER Log / Observability系・Metric 分類・§8–§11 との突合"
  - "テーブル一覧 §11 No.59・Log / Observability 系補足（Metric 系・retention）との整合"
  - "ログ・Observability設計書 §12.10 集計単位・§12.11–§12.12 分布メトリクス候補カラム・§20.2 Retention（365日以上）との突合・差分整理"
  - "バッチ処理一覧 BATCH-016・バッチ設計方針書・バッチ依存関係図・機能×モジュール対応表 MOD-BATCH-038 との整合"
  - "インターフェース一覧 IF-DB-BATCH-016（分布メトリクス保存・INSERT）との整合"
  - "batch_run_log_テーブル定義書 §5.2 親子・LOGICAL FK 方針との整合（batch_run_id 参照）"
  - "feature_definition_テーブル定義書 §8 feature_code 正本参照・chk_feature_code_mvp との整合"
  - "item_feature_テーブル定義書との集計入力（raw_value / normalized_value・value_layer）責務境界"
  - "phase_log_テーブル定義書 feature_distribution_metric_recorded フェーズとの trace 境界"
  - "enum定義書 §6.16 feature_code・packages/code-definitions/semantic/feature_code.yaml との整合"
  - "meaning_distribution_metric / normalization_distribution_metric との責務分離（本 Task は feature 軸のみ）"
  - "Task / Review Definition の整備"

out_of_scope:
  - "meaning_distribution_metric / normalization_distribution_metric / reco_score_distribution_metric テーブル定義書（別 Task）"
  - "batch_run_log / phase_log / error_log / item_feature / feature_definition テーブル定義書の再作成（merge 済みを参照）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"
  - "分布集計ロジックの実装詳細（BATCH-016 バッチ仕様書の責務）"

