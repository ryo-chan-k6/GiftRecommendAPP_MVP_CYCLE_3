background: |
  Phase2 子 Task ④ DDL の **バッチ D07（Online 推薦系）**。Online 推薦フロー Request → Run → Result チェーンおよび Result Item / Reason / Feedback の基盤となる。
  対象 6 テーブルは [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §11 に列挙される。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）、D02（`db/ddl/d02_semantic_feature_definitions.sql`、Issue #599 / PR #615 merge 済み）、D03（`db/ddl/d03_master_config.sql`、Issue #600 / PR #616 merge 済み）、D04（`db/ddl/d04_item.sql`、Issue #601 / PR #617 merge 済み）、D05（`db/ddl/d05_external_product_integration.sql`、Issue #602 / PR #618 merge 済み）、D06（`db/ddl/d06_item_derived.sql`、Issue #603 / PR #619 merge 済み）適用後に本バッチを実行する前提とする。
  `relationship_master` / `occasion_master` / Config 系 / trace 列は **LOGICAL 参照（物理 FK なし）** が正本方針。`pair_id` のみ `pair_master` への物理 FK ON（物理ER §17 No.1）。
  Issue #604 / Branch `chore/task-604-d07-ddl` で作業する。

objective: |
  `db/ddl/d07_online_recommendation.sql` を作成し、D07 対象 6 テーブルの PostgreSQL DDL を各テーブル定義書・物理 ER・enum定義書・コード定義書・マイグレーション方針書と整合させる。
  バッチ内の CREATE 順序は FK 依存に従う（`recommendation_request` → `recommendation_run` → `recommendation_result` → `recommendation_result_item` → `recommendation_reason` → `recommendation_feedback`）。
  D08（`user_semantic` / `user_feature` / `user_meaning`）から Run への後追い物理 FK は本 Task では付与しない。

scope:
  - "`db/ddl/d07_online_recommendation.sql` の新規作成"
  - "D07 対象 6 テーブルの `CREATE TABLE`、PK、UNIQUE、Index、CHECK、バッチ内で成立する物理 FK"
  - "  - `recommendation_request`"
  - "  - `recommendation_run`"
  - "  - `recommendation_result`"
  - "  - `recommendation_result_item`"
  - "  - `recommendation_reason`"
  - "  - `recommendation_feedback`"
  - "D01〜D06 適用済み前提で実行可能な SQL（enum 型は D01 参照、`pair_master` / Config 系は D03 参照、`item` は D04 参照）"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "D08 以降のテーブル `CREATE TABLE`（`user_semantic` / `user_feature` / `user_meaning` 等）"
  - "D08 から `recommendation_run` への後追い物理 FK（各テーブル定義書の D08 Task 委譲方針に従い MVP では付与しない）"
  - "D09 以降 Evaluation / Metric 系テーブルの `CREATE TABLE`"
  - "D10 `batch_run_log` 等 Log 系テーブルの `CREATE TABLE`"
  - "`recommendation_request` → Master 系の後追い物理 FK（`relationship_code` / `occasion_code` は LOGICAL + Index 方針）"
  - "`recommendation_run` / `recommendation_result` の Config version 列への物理 FK（LOGICAL + Index 方針）"
  - "`recommendation_reason.template_id` → `reason_template` 物理 FK（LOGICAL 方針）"
  - "`recommendation_feedback` の trace / Item / Reason 列への物理 FK（Result 以外は LOGICAL 方針）"
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`db/seeds/**` の作成（Task ⑤）"
  - "`packages/code-definitions/**` の変更"
  - "`apps/**` 実装変更"
  - "docs の変更（DDLバッチ分割表・テーブル定義書は参照のみ）"

