background: |
  Phase2 子 Task ③ Batch R03 No.5。論理ER §9.2・テーブル一覧 §6 No.20。
  外部商品取込の Staging 正本。`raw_product_metadata` → `staging_item` → `item` 昇格フローの中核。
  BATCH-005（Raw取込・Staging変換）で作成、BATCH-006（商品差分判定）・BATCH-007（Item反映）の入力となる。
  親 Epic Branch 最新（enum #440、fetch_cursor #505、raw_product_metadata #506、item #495 merge 済み前提）を前提とする。
  Issue #517 / Branch `docs/task-517-staging-item-table-spec` で作業する。

objective: |
  `staging_item` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `raw_product_metadata` との transforms_to 関係、`item` への Upsert キー（`source` + `external_item_code`）、`normalized_hash` / `diff_status`（product_diff_status）・BATCH-005〜007 との関係を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の staging_item テーブル定義書作成"
  - "物理ER 外部商品データ連携系・論理ER §9.2 / §9.3・テーブル一覧 §6 No.20 との突合"
  - "状態遷移設計書 §6.5 Product Diff Result 状態・enum定義書 product_diff_status との整合"
  - "packages/code-definitions/state/product_diff_status.yaml との突合"
  - "外部商品データ連携設計書 §6.3〜§6.4（差分判定・normalized_hash 対象）・§7 フローとの突合"
  - "raw_product_metadata_テーブル定義書 §8 transforms_to 関係・normalized_hash 責務分担との整合"
  - "item_テーブル定義書 §8 / §12（Staging→Item Upsert キー・normalized_hash 経路）との突合"
  - "バッチ設計方針書 BATCH-005 / BATCH-006 / BATCH-007・処理構成定義書 MOD-BATCH-020〜022 との登録/反映/差分判定方針整理"
  - "インターフェース一覧 IF-DB-BATCH-005（Staging 保存）等との整合"
  - "product_diff_result / staging_item_image 等への関係整理（本体定義は別 Task へ委譲）"
  - "Task / Review Definition の整備"

out_of_scope:
  - "staging_item_image / staging_ranking_signal / staging_genre / staging_attribute テーブル定義書（別 Task）"
  - "product_diff_result / item_import_summary テーブル定義書（本 Task では judged_as / 集計関係の整理のみ）"
  - "api_call_log テーブル定義書"
  - "raw_product_object（Object Storage 正本・DB 非管理）のテーブル定義書"
  - "item_review_summary 等 Item 子テーブルへの列マッピング詳細（staging レビュー列は本 Task で整理、子テーブル反映は #503 参照）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

