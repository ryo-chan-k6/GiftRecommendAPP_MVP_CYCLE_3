  - "D11 対象 4 テーブルが DDLバッチ分割表 §15 と一致する"
  - "各テーブルの列・型・制約が対応するテーブル定義書と矛盾しない"
  - "D01〜D10 適用済み前提で本ファイルが実行可能である"
  - "`feature_distribution_metric` の MVP `feature_code` CHECK・`value_layer` / `aggregation_scope` CHECK・batch_run 必須 CHECK・部分 UNIQUE が定義書どおりである"
  - "`feature_distribution_metric` の normalized 層 `feature_normalization_version_id` 必須 CHECK が定義書どおりである"
  - "`meaning_distribution_metric` の entity_type / value_layer / lambda_ctx 組み合わせ CHECK が定義書どおりである"
  - "`meaning_distribution_metric` の `feature_normalization_version_id` NOT NULL CHECK が定義書どおりである"
  - "`normalization_distribution_metric` の MVP `value_layer`（raw / sigmoid のみ）CHECK が定義書どおりである"
  - "`normalization_distribution_metric` の `feature_normalization_version_id` NOT NULL CHECK が定義書どおりである"
  - "`reco_score_distribution_metric` の MVP partial `score_type` / `aggregation_scope=run` CHECK が定義書どおりである"
  - "`reco_score_distribution_metric` の run / result 必須 CHECK・`batch_run_id IS NULL` MVP CHECK・`sample_count >= 1` CHECK が定義書どおりである"
  - "Metric 参照先への **物理 FK を付与していない**"
  - "D12 以降テーブルの CREATE が誤って本ファイルに含まれていない"
  - "`packages/code-definitions/**` および `apps/**` に変更がない"
  - "Task PR target が親 Epic Branch"

