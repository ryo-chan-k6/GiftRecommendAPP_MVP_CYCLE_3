background: |
  Phase2 子 Task ④ DDL の **バッチ D11（Metric 系・MVP△ 1 件含む）**。Batch / Online 横断の分布 Metric 4 テーブルの基盤。
  対象 4 テーブルは [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §15 に列挙される。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）〜 D10（`db/ddl/d10_log_observability.sql`、Issue #607 / PR #623 merge 済み）適用後に本バッチを実行する前提とする。
  参照先テーブル（`batch_run_log` / `semantic_config_version` / `feature_definition` / `item_feature` / `item_meaning` / `user_meaning` / `feature_normalization_version` / `recommendation_run` / `recommendation_result` / `ranking_config`）への参照は **LOGICAL 参照（物理 FK なし）** が正本方針。
  retention 詳細は ⑥ データ保持・削除方針書 Task で確定し、本 Task では列・索引・CHECK のみ定義する。
  Issue #608 / Branch `chore/task-608-d11-ddl` で作業する。

objective: |
  `db/ddl/d11_metric.sql` を作成し、D11 対象 4 テーブルの PostgreSQL DDL を各テーブル定義書・物理 ER・enum定義書・コード定義書・マイグレーション方針書と整合させる。
  バッチ内の CREATE 順序は Metric 系列の依存に従う（`feature_distribution_metric` → `meaning_distribution_metric` → `normalization_distribution_metric` → `reco_score_distribution_metric`）。
  参照先への物理 FK は付与せず、UNIQUE / 部分 UNIQUE / CHECK / Index をテーブル定義書 §7〜§10 どおりに定義する。

scope:
  - "`db/ddl/d11_metric.sql` の新規作成"
  - "D11 対象 4 テーブルの `CREATE TABLE`、PK、Index、CHECK、UNIQUE"
  - "  - `feature_distribution_metric`（MVP○）"
  - "  - `meaning_distribution_metric`（MVP○）"
  - "  - `normalization_distribution_metric`（MVP○）"
  - "  - `reco_score_distribution_metric`（MVP△ / partial）"
  - "D01〜D10 適用済み前提で実行可能な SQL（enum 型は D01 参照、LOGICAL 参照元は D02〜D10 参照）"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序（change_id: `d11_metric`）への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "D12 遅延 FK / 索引追加（後追い制約 Task）"
  - "D10 Log 3 テーブルの `CREATE TABLE`（D10 完了済み）"
  - "`phase_log.phase_name` への Metric 記録 phase 追加（enum / CHECK 更新は別 Task）"
  - "Metric 参照先テーブルへの **物理 FK** 付与（LOGICAL 方針）"
  - "retention ポリシーの DDL 実装（列・索引のみ。保持期間は ⑥ Task で確定）"
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`db/seeds/**` の作成（Task ⑤）"
  - "`packages/code-definitions/**` の変更"
  - "`apps/**` 実装変更"
  - "docs の変更（DDLバッチ分割表・テーブル定義書は参照のみ）"

