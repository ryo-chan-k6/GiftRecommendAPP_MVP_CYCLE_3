background: |
  Phase2 子 Task ③ Batch R04 No.4。論理ER §9.2・テーブル一覧 §6 No.25。
  取込前後の商品差分判定結果。Staging → 本番昇格（BATCH-007）・有効状態更新（BATCH-008）・意味生成キュー登録（BATCH-009）の判断根拠。
  BATCH-006（Product Diff Detector / `MOD-BATCH-014`）で `staging_item.normalized_hash` と `item.normalized_hash` を比較し、`new` / `updated` / `unchanged` / `unavailable` を確定する。
  親 Epic Branch 最新（enum #440、raw_product_metadata #506、staging_item #517、item #495 merge 済み前提）を前提とする。
  Issue #526 / Branch `docs/task-526-product-diff-result-table-spec` で作業する。

objective: |
  `product_diff_result` の物理カラム・制約・Index・差分種別（`product_diff_status`）を table-spec.md テンプレ準拠で定義する。
  `staging_item` との judged_as 関係（`staging_item_id`）、`item` との hash 比較経路（`source` + `external_item_code` → `old_hash` / `new_hash`）、BATCH-006 INSERT / BATCH-007〜009 読取・Retention 方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の product_diff_result テーブル定義書作成"
  - "物理ER 外部商品データ連携系・論理ER §9.2 / §9.3 / §14.4・テーブル一覧 §6 No.25 との突合"
  - "状態遷移設計書 §6.5 Product Diff Result 状態・enum定義書 product_diff_status との整合"
  - "packages/code-definitions/state/product_diff_status.yaml との突合"
  - "外部商品データ連携設計書 §6.3〜§6.4（差分判定・normalized_hash 対象）・§7 フローとの突合"
  - "staging_item_テーブル定義書 §5.4 judged_as / §12.3 BATCH-006 差分判定フローとの整合"
  - "item_テーブル定義書 §12（Staging→Item Upsert・normalized_hash 冪等方針）との突合"
  - "raw_product_metadata_テーブル定義書 §8（取込上流 trace 経路）との整合"
  - "バッチ設計方針書 BATCH-006 / BATCH-007 / BATCH-008 / BATCH-009・§17.1 冪等キーとの整合"
  - "バッチ処理一覧・バッチ依存関係図・機能×モジュール対応表（MOD-BATCH-012〜014 / Product Diff Result Repository）との整合"
  - "インターフェース一覧 IF-DB-BATCH-006（Product Diff 保存）との整合"
  - "物理ER §10 Index（idx_product_diff_batch_code）・§11 制約・§13 Retention 方針の明記"
  - "Task / Review Definition の整備"

out_of_scope:
  - "staging_item / item / raw_product_metadata テーブル定義書（先行 Task 完了済み）"
  - "staging_item_image / staging_ranking_signal / staging_genre / item_import_summary テーブル定義書（別 Task）"
  - "api_call_log / batch_run_log テーブル定義書"
  - "meaning_input_diff テーブル定義書（BATCH-009 入力の別概念）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

