background: |
  Phase2 子 Task ③ Wave2（Semantic / Feature 定義系 Rule 群）No.9。
  Wave1（semantic_config / semantic_config_version）および Wave2 No.1〜No.6（feature_definition / relationship_rule / occasion_rule / pair_rule）merge 済み前提。
  本テーブルは MVP partial（テーブル一覧 △・物理ER partial）。Featureルール定義書 §12 の統合式・§12.3 初期重みを DB 化するかは Human Review 論点。
  推奨着手順: … → concept_feature_rule → partial 2 件（input_type_rule / feature_integration_rule）。

objective: |
  `feature_integration_rule` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  後続 DDL Task が migration を作成できる粒度まで確定する。
  MVP partial 採用時は §12 統合式・§12.3 初期重みを DB カラムまたは正規化行モデルで保持する方針を明記する。

scope:
  - "table-spec.md テンプレ準拠の feature_integration_rule テーブル定義書作成"
