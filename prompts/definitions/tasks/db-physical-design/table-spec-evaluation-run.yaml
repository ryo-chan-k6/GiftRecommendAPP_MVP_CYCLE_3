    - "状態遷移設計書 §8.1.3 / §11.3 再評価・再実行方針（新規 Run 追記）との整合"
    - "enum定義書 §6.12 evaluation_run_status・packages/code-definitions/state/evaluation_run_status.yaml との整合"
    - "semantic_config_version / model_version / ranking_config 定義書との被参照 LOGICAL FK 整合（§17.1 No.8 踏襲）"
    - "phase_log / error_log 定義書 owner_type=evaluation_run 連携との双方向整合"
    - "evaluation_run_phase_log 非物理化（phase_log 統合）方針の明記"
    - "インターフェース一覧 IF-DB-BATCH-018 / IF-SHARED-004 との整合"
    - "ログ・Observability設計書 evaluation_run_id trace キーとの整合"
    - "apps 実装層への変更がないこと"
  not_required:
