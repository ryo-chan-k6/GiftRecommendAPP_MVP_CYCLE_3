background: |
  Phase2 子 Task ③ Batch R08 No.5。テーブル一覧 §10 No.53。MVP△。
  評価実行単位の正本。`evaluation_result` / `evaluation_metric` の親エンティティ。
  BATCH-018（Offline Evaluation Batch）・IF-DB-BATCH-018 / IF-SHARED-004 の実行単位 DB 正本。
  物理ER Evaluation系分類・論理ER §12.1 / §12.2・状態遷移設計書 §8.1 を前提とする。
  親 Epic Branch 最新（enum #440、Config / Version #450 / #451 / #463、Log #535 / #536、recommendation_run #543 merge 済み）および
  **#565 evaluation_dataset テーブル定義書 merge 済み** を前提とする。
  Issue #567 / Branch `docs/task-567-evaluation-run-table-spec` で作業する。

objective: |
  `evaluation_run` の物理カラム・制約・Index・実行状態（`evaluation_status`）を table-spec.md テンプレ準拠で定義する。
  `evaluation_dataset` との 1:N executed_by 関係、`evaluation_result` との 1:N produces 関係、
  `semantic_config_version_id` / `model_version_id` / `ranking_config_id` LOGICAL FK、
  phase_log / error_log との Log 連携、`evaluation_run_id` trace キーを明記し、
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の evaluation_run テーブル定義書作成"
  - "物理ER Evaluation系・§9 FK 関係（executed_by / produces / used_by / records / may_have）・§10 Index・§11 制約・§12 evaluation_status との突合"
  - "論理ER §12.1 Evaluation系 ER 図・§12.2 evaluation_run 属性・§13 EVALUATION_RUN → phase_log / error_log との整合"
  - "テーブル一覧 §10 No.53・Evaluation系補足（mode=evaluation 連携・MVP partial）との整合"
  - "状態遷移設計書 §8.1 Evaluation Run 状態遷移・§8.1.3 再評価追記方針・§11.3 再実行方針・§13 ER 対応との整合"
  - "enum定義書 §6.12 evaluation_run_status・§6.15 owner_type（evaluation_run）との整合"
  - "packages/code-definitions/state/evaluation_run_status.yaml との整合"
  - "evaluation_dataset_テーブル定義書 §5.4 executed_by FK / idx_evaluation_run_dataset_id 引き継ぎとの双方向整合（#565 merge 済み正本）"
  - "semantic_config_version / model_version / ranking_config テーブル定義書（被参照 LOGICAL FK / Index 方針）との双方向整合"
  - "phase_log / error_log テーブル定義書（owner_type=evaluation_run・records / may_have 関係）との双方向整合"
  - "recommendation_run_テーブル定義書（Run 系設計先例・version 列 LOGICAL FK 方針）との対称整合"
  - "正本定義表・リソース一覧・リソース責務定義表・ログ・Observability設計書（evaluation_run_id trace キー）との突合"
  - "インターフェース一覧 IF-DB-BATCH-018 / IF-SHARED-004・処理構成定義書 §13 Offline Evaluation・バッチ処理一覧 BATCH-018 との整合"
  - "API-INT-002 Reco推薦実行API契約仕様書（mode=evaluation 実行境界）との整合"
  - "機能×モジュール対応表 MOD-BATCH-039 Offline Evaluation Runner との整合"
  - "evaluation_run_phase_name enum / packages 正本の MVP 方針整理（phase_log §11.3 DB CHECK 省略前提との整合）"
  - "Task / Review Definition の整備"

out_of_scope:
  - "evaluation_result / evaluation_metric テーブル定義書（R08 以降別 Task）"
  - "evaluation_case テーブル定義書の再作成（#566 は別 Task。merge 済みを参照）"
  - "evaluation_dataset テーブル定義書の再作成（#565 merge 済みを参照）"
  - "evaluation_run_phase_log 独立テーブル（MVP では phase_log に統合）"
  - "recommendation_request / pair_master 等 Online推薦系テーブル定義書の再作成"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"
  - "BATCH-018 バッチ仕様書本体の作成（バッチ仕様書 Task の責務）"

