human_decision_points: []

human_review_decisions:
  - id: 1
    topic: "evaluation_dataset_id の物理 FK"
    decision: "`evaluation_run.evaluation_dataset_id` へ物理 FK ON / ON DELETE RESTRICT（Human Review #565 No.4）"
  - id: 2
    topic: "semantic_config_version_id / model_version_id / ranking_config_id の物理 FK"
    decision: "個別列正本は evaluation_run。MVP は LOGICAL FK 維持（物理 FK なし）。recommendation_run / semantic_config_version §17.1 No.8 踏襲"
  - id: 3
    topic: "evaluation_run → evaluation_result produces カーディナリティ"
    decision: "1:N（1 Run あたり複数 Case 分の evaluation_result を生成し得る）。物理ER §9 produces ON 1:N"
  - id: 4
    topic: "evaluation_run_phase_log 物理化"
    decision: "MVP 物理テーブルなし。phase_log（owner_type=evaluation_run）に統合"
  - id: 5
    topic: "Evaluation Run 再実行方針"
    decision: "同一 Run を再開せず、新しい Evaluation Run として再実行（状態遷移設計書 §11.3）"
  - id: 6
    topic: "evaluation_status 列名"
    decision: "物理列名 `evaluation_status`。packages 正本 ID は `evaluation_run_status`（enum定義書 §6.12）"
  - id: 7
    topic: "recommendation_run_id 物理列"
    decision: "MVP は物理列なし。evaluation_result.recommendation_result_id 経由で間接連携"
  - id: 8
    topic: "batch_run_id 物理列"
    decision: "nullable 採用（LOGICAL FK）。BATCH-018 実行 trace"
  - id: 9
    topic: "evaluation_run_phase_name enum"
    decision: "本 Task では新規定義しない。phase_log MVP DB CHECK 省略継続"
  - id: 10
    topic: "Evaluation Run Retention"
    decision: "365 日（created_at 基準）。MVP 自動 DELETE なし。evaluation_dataset と同値"

