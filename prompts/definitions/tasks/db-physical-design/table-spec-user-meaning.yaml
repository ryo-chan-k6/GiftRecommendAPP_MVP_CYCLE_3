background: |
  Phase2 子 Task ③ Batch R07 No.3。テーブル一覧 §4 No.9。
  User Feature を Social / Symbolic へ射影した User 側 Meaning。Online 推薦時に reco が生成・参照する。
  物理ER §4.1 User意味推定系・§9 `recommendation_run.recommendation_run_id → user_meaning.recommendation_run_id`（generates / ON / 1:0..1）を前提とする。
  先行 Task #543（recommendation_run / PR #548 merge 済み）の recommendation_run_id 物理 FK ON 方針を踏襲する。
  先行 Task #553（user_semantic）・#554（user_feature）merge 済み。生成元 Feature 正本は `user_feature_テーブル定義書` の `feature_value` 列とする。
  対称参照 Task #515（item_meaning / PR #520 merge 推奨）の Social / Symbolic 射影ルール・値域を踏襲する。
  Issue #555 / Branch `docs/task-555-user-meaning-table-spec` で作業する。

objective: |
  `user_meaning` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `user_feature`（正規化済み Feature）から `user_social` / `user_symbolic` への射影・`lambda_ctx` 保持方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の user_meaning テーブル定義書作成"
  - "物理ER User意味推定系・FK・Index 方針との突合"
  - "論理ER §10.2 user_meaning 属性・item_meaning 対称性・テーブル一覧 §4 No.9・正本定義表 user_social / user_symbolic との整合"
  - "GiftMeaningSpace定義書 §5–§7 Social / Symbolic 射影ルール・semantic_config_version 重みとの整合"
  - "Matching定義書 §4.5 lambda_ctx・§9 Context Score 算出前提との整合"
  - "処理構成定義書・機能×モジュール対応表 MOD-RECO-008 User Meaning Projector / MOD-RECO-009 User Context Builder との生成経路整理"
  - "インターフェース一覧 IF-DB-RECO-003（user_semantic / user_feature / user_meaning 保存）との整合"
  - "状態遷移設計書 user_meaning_projected Phase・phase_log 連携との整合"
  - "recommendation_run_テーブル定義書 §8.2 被参照関係・semantic_config_version_id Run 側保持との version 再現性整理"
  - "user_feature テーブル定義書（#554 merge 済み）・user_semantic テーブル定義書（#553 merge 済み）との生成元 Feature / パイプライン関係整理"
  - "item_meaning_テーブル定義書（#515 merge 済み時）との Social / Symbolic 対称性・version 参照粒度差整理"
  - "ログ・Observability設計書 user_social_mean / user_symbolic_mean 等メトリクス列との責務境界整理"
  - "Task / Review Definition の整備"

out_of_scope:
  - "user_semantic / user_feature テーブル定義書本体（Batch R07 別 Task）"
  - "item_meaning / item_feature テーブル定義書の再作成（#515 / #514 を参照）"
  - "meaning_distribution_metric テーブル定義書（Metric 系別 Task）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

