    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "request_mode（§6.13）・owner_type recommendation_request（§6.15）参照"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§3 recommendation_request 属性・§14.1 Request → Run → Result フロー"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
