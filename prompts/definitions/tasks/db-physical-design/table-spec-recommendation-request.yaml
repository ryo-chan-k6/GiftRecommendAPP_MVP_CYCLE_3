background: |
  Phase2 子 Task ③ Batch R05 No.5。論理ER §14.1・テーブル一覧 §3 No.1。
  Online推薦リクエスト正本。request → run → result フローの起点（R06 `recommendation_run` 等の前提）。
  IF-DB-API-001（Recommendation Request 保存）の DB 正本。
  親 Epic Branch 最新（enum #440、relationship_master #442、occasion_master #445、pair_master #449 merge 済み前提）を前提とする。
  Issue #537 / Branch `docs/task-537-recommendation-request-table-spec` で作業する。

objective: |
  `recommendation_request` の物理カラム・制約・Index・入力コンテキスト保持方針（個別カラム + JSONB 併用）を table-spec.md テンプレ準拠で定義する。
  Online推薦フロー（Request → Run → Result）の起点、`relationship_master` / `occasion_master` との LOGICAL 参照、後続 `recommendation_run` への 1:N executes 関係を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の recommendation_request テーブル定義書作成"
  - "物理ER Online推薦系・§9 FK 関係・§11 制約（§17 No.2）・§12 request_mode との突合"
  - "論理ER §3 / §14.1 Recommendation Request → Run → Result フローとの整合"
  - "テーブル一覧 §3 No.1・Online推薦系補足（mode / budget / payload 方針）との整合"
  - "RecommendationRequest定義書 §10 状態・§11 DB 項目・§11.2 payload 併用方針との整合"
  - "enum定義書 §6.13 request_mode・§6.15 owner_type（recommendation_request）との整合"
  - "packages/code-definitions/application/request_mode.yaml との整合"
  - "API-PUB-002 レコメンド実行API契約仕様書（request body → DB 列マッピング）との整合"
  - "インターフェース一覧 IF-DB-API-001・処理構成定義書・処理フロー概要図との整合"
  - "正本定義表・リソース一覧・リソース責務定義表・ログ・Observability設計書（trace キー）との突合"
  - "認証・認可方針書（user_id nullable 方針）との整合"
  - "relationship_master / occasion_master / pair_master テーブル定義書（LOGICAL 参照・pair_id 保持先）との双方向整合"
  - "物理ER §17 No.1（pair_id は recommendation_run 保持）・No.2（個別カラム + JSONB 併用）の反映"
  - "Task / Review Definition の整備"

out_of_scope:
  - "recommendation_run / recommendation_result / recommendation_result_item 等の Online推薦系テーブル定義書（R06 以降別 Task）"
  - "user_semantic / user_feature / user_meaning テーブル定義書"
  - "relationship_master / occasion_master / pair_master テーブル定義書の再作成（merge 済みを参照）"
  - "recommendation_request_condition 独立テーブル（MVP では非採用）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

