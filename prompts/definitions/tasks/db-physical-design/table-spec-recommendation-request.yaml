human_decision_points: []

human_review_decisions:
  - id: 1
    topic: "request_status 物理列"
    decision: "MVP 物理列なし。Validation 失敗は INSERT しない。成功行は暗黙 accepted"
  - id: 2
    topic: "user_id nullable 列"
    decision: "MVP 物理列なし。認証 Epic まで追加しない"
  - id: 3
    topic: "requested_at vs created_at"
    decision: "物理名 created_at。論理ER requested_at と同一意味"
  - id: 4
    topic: "semantic_config_version_id / model_version_id 保持先"
    decision: "個別列正本は recommendation_run。Request は validated_payload のみ（evaluation 指定の記録）"
  - id: 5
    topic: "Online推薦コア Retention"
    decision: "MVP DELETE なし。具体保持期間は Phase2 ⑥ データ保持方針 Task で確定"
  - id: 6
    topic: "version 列の物理 FK"
    decision: "recommendation_run 側は LOGICAL FK 維持（物理 FK なし）"

