    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
      required: true
      purpose: "request body 項目と DB 物理列のマッピング（mode → request_mode 等）"
    - path: "docs/06_実装設計/database/relationship_master_テーブル定義書.md"
      required: true
      purpose: "§5.2 selected_by LOGICAL 参照・relationship_code 整合（merge 済み前提）"
    - path: "docs/06_実装設計/database/occasion_master_テーブル定義書.md"
      required: true
      purpose: "§5.2 selected_by LOGICAL 参照・occasion_code 整合（merge 済み前提）"
    - path: "docs/06_実装設計/database/pair_master_テーブル定義書.md"
      required: true
