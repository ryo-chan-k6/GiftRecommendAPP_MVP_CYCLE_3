background: |
  Phase2 子 Task ④ DDL の **バッチ D04（Item 系）**。Online / Batch が参照する商品正本・補助情報・ランキング Snapshot の基盤となる。
  対象 7 テーブルは [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §8 に列挙される。`external_attribute` は MVP△（DDL 参照用に含める。DDLバッチ分割表 §3）。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）、D02（`db/ddl/d02_semantic_feature_definitions.sql`、Issue #599 / PR #615 merge 済み）、D03（`db/ddl/d03_master_config.sql`、Issue #600 / PR #616 merge 済み）適用後に本バッチを実行する前提とする。
  Issue #601 / Branch `chore/task-601-d04-ddl` で作業する。

objective: |
  `db/ddl/d04_item.sql` を作成し、D04 対象 7 テーブルの PostgreSQL DDL を各テーブル定義書・物理 ER・enum定義書・コード定義書・マイグレーション方針書と整合させる。
  バッチ内の CREATE 順序は FK 依存に従う（`external_genre` → `item` → `item_image` / `item_review_summary` / `external_attribute` → `ranking_snapshot` → `item_popularity_signal`）。
  `item` / `ranking_snapshot` / `item_popularity_signal` から `external_genre` への参照は LOGICAL のまま（物理 FK なし）。`item_popularity_signal.ranking_snapshot_id` → `ranking_snapshot` は物理 FK ON。

scope:
  - "`db/ddl/d04_item.sql` の新規作成"
  - "D04 対象 7 テーブルの `CREATE TABLE`、PK、UNIQUE、Index、CHECK、バッチ内で成立する物理 FK"
  - "  - `external_genre`"
  - "  - `item`"
  - "  - `item_image`"
  - "  - `item_review_summary`"
  - "  - `external_attribute`（MVP△。DDL 参照用に含める）"
  - "  - `ranking_snapshot`"
  - "  - `item_popularity_signal`"
  - "D01 / D02 / D03 適用済み前提で実行可能な SQL（enum 型・拡張は D01 参照）"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "D05 以降のテーブル `CREATE TABLE`（`staging_item` / `fetch_cursor` 等）"
  - "D05 以降バッチから Item 系への後追い物理 FK（各テーブル定義書の LOGICAL 参照方針に従い MVP では付与しない）"
  - "`recommendation_result_item` 等 Online 推薦系から Item / Snapshot への物理 FK（D07。LOGICAL / snapshot 列コピー方針）"
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`db/seeds/**` の作成（Task ⑤）"
  - "`packages/code-definitions/**` の変更"
  - "`apps/**` 実装変更"
  - "docs の変更（DDLバッチ分割表・テーブル定義書は参照のみ）"

