background: |
  Phase2 子 Task ③ Batch R06 No.3。論理ER §7.3・テーブル一覧 §3 No.4。
  推薦結果の商品明細正本。スコア・順位・item 参照および表示時点の商品情報 Snapshot を保持する。
  IF-DB-RECO-007（Recommendation Result 保存）の明細側 DB 正本。
  親 Epic Branch 最新（item #495 / item_image #497 / item_review_summary merge 済み前提、recommendation_request #537 merge 済み前提）を前提とする。
  同 Batch の `recommendation_run`（#543）・`recommendation_result`（#544）は並行 Task。未 merge 時は物理ER・論理ER を正本として着手し、merge 後に双方向整合を確認する。
  Issue #545 / Branch `docs/task-545-recommendation-result-item-table-spec` で作業する。

objective: |
  `recommendation_result_item` の物理カラム・制約・Index・Snapshot 保持方針を table-spec.md テンプレ準拠で定義する。
  `recommendation_result` への contains 関係・`item` への snapshotted_by 関係・Snapshot 列の UPDATE 禁止方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の recommendation_result_item テーブル定義書作成"
  - "物理ER Online推薦系・§9 FK（contains / snapshotted_by / has reason / receives feedback）・§10 Index・§11 Snapshot UPDATE 禁止方針との突合"
  - "論理ER §7.3 Snapshot 項目・§14 Online推薦系エンティティ属性との整合"
  - "テーブル一覧 §3 No.4・Online推薦系補足（result item snapshot）との整合"
  - "RecommendationResult定義書 §6.2 / §10.2 / §11（Ranking / Reason / Feedback 関係）との整合"
  - "Ranking定義書 §14.3 recommendation_result_item 反映項目との整合"
  - "item_テーブル定義書・item_image_テーブル定義書・item_review_summary_テーブル定義書との Snapshot 元データ参照関係の双方向整合"
  - "正本定義表・リソース一覧・リソース責務定義表・機能×モジュール対応表（rank / final_score）との突合"
  - "インターフェース一覧 IF-DB-RECO-007・処理構成定義書・処理フロー概要図・ログ・Observability設計書との整合"
  - "API-PUB-002 / API-INT-002 の Result Item 応答項目と DB 物理列のマッピング整理"
  - "認証・認可方針書（Feedback 対象としての Result Item 参照）との整合"
  - "状態遷移設計書（Snapshot 上書き禁止）・外部商品データ連携設計書 §11.5 Result Snapshot との整合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "recommendation_run / recommendation_result テーブル定義書の再作成（#543 / #544 並行 Task）"
  - "recommendation_reason / recommendation_feedback テーブル定義書（R06 No.4 / No.5 別 Task）"
  - "item / item_image / item_review_summary テーブル定義書の再作成（merge 済みを参照）"
  - "recommendation_request テーブル定義書の再作成"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

