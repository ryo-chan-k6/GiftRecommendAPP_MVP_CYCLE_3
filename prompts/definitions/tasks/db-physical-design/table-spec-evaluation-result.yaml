background: |
  Phase2 子 Task ③ Batch R09 No.1（Evaluation系最終バッチの先頭）。テーブル一覧 §10 No.54。MVP△。
  評価実行の個別結果。`evaluation_run` に属し、`evaluation_case` を入力として IF-SHARED-004 / `mode=evaluation` で得た Recommendation Result と紐づく。
  BATCH-018（Offline Evaluation Batch）・IF-DB-BATCH-018 の INSERT 対象のひとつ。MOD-BATCH-041 Evaluation Result Writer の書込先。
  物理ER Evaluation系分類・論理ER §12.1 / §12.2・Evaluation評価定義書 §14.4 を前提とする。
  親 Epic Branch 最新（enum #440、recommendation_result #544、evaluation_dataset #565、evaluation_case #566、evaluation_run #567 merge 済み）を前提とする。
  Issue #573 / Branch `docs/task-573-evaluation-result-table-spec` で作業する。

objective: |
  `evaluation_result` の物理カラム・制約・Index を table-spec.md テンプレ準拠で定義する。
  `evaluation_run` との produces（1:N）、`evaluation_case` との executed_as（1:N）、
  `recommendation_result` との may_reference（LOGICAL FK）、冗長 `evaluation_dataset_id` の再現性方針、
  `evaluation_metric` との has（1:N・子テーブル）関係を明記し、
  後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の evaluation_result テーブル定義書作成"
  - "物理ER Evaluation系・§9 FK 関係（produces / executed_as / has / may_reference）・§10 Index・§11 制約との突合"
  - "論理ER §12.1 Evaluation系 ER 図・§12.2 evaluation_result 属性との整合"
  - "テーブル一覧 §10 No.54・Evaluation系補足（recommendation_result 間接連携・produces 1:N）との整合"
  - "Evaluation評価定義書 §14.4 offline_eval_result 論理項目と evaluation_metric 分離方針の差分整理"
  - "正本定義表・リソース一覧・リソース責務定義表・ログ・Observability設計書（長期保持候補）との突合"
  - "evaluation_run_テーブル定義書 §5.2 / §8.1 / §17.1（produces・recommendation_result_id 経由連携）との双方向整合"
  - "evaluation_case_テーブル定義書 §5.2 / §8.1（executed_as 被参照）との双方向整合"
  - "evaluation_dataset_テーブル定義書 §5（冗長 evaluation_dataset_id・再評価追記方針）との双方向整合"
  - "recommendation_result_テーブル定義書 §8.2（references LOGICAL 被参照）との双方向整合"
  - "インターフェース一覧 IF-DB-BATCH-018 / IF-SHARED-004・処理構成定義書 §13 Offline Evaluation・バッチ処理一覧 BATCH-018 との整合"
  - "API-INT-002 Reco推薦実行API契約仕様書（mode=evaluation 実行境界）との整合"
  - "機能×モジュール対応表 MOD-BATCH-041 Evaluation Result Writer との整合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "evaluation_metric テーブル定義書（R09 No.2 別 Task）"
  - "evaluation_run / evaluation_case / evaluation_dataset / recommendation_result テーブル定義書の再作成（merge 済みを参照）"
  - "human_eval_task / human_eval_result 等人手評価テーブル（MVP 未物理化）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"
  - "BATCH-018 バッチ仕様書本体の作成（バッチ仕様書 Task の責務）"
  - "Evaluation Metric 計算ロジックの実装詳細"

