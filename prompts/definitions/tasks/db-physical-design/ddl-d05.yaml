background: |
  Phase2 子 Task ④ DDL の **バッチ D05（外部商品データ連携系）**。Batch による Raw 参照・Staging・差分判定・Import Summary の基盤となる。
  対象 10 テーブルは [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §9 に列挙される。`staging_attribute` は MVP△（DDL 参照用に含める。DDLバッチ分割表 §3）。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）、D02（`db/ddl/d02_semantic_feature_definitions.sql`、Issue #599 / PR #615 merge 済み）、D03（`db/ddl/d03_master_config.sql`、Issue #600 / PR #616 merge 済み）、D04（`db/ddl/d04_item.sql`、Issue #601 / PR #617 merge 済み）適用後に本バッチを実行する前提とする。
  Staging 系・Log 系は **物理 FK なし（LOGICAL + Index）** が正本方針（物理ER §9・§13、各テーブル定義書 §8）。
  Issue #602 / Branch `chore/task-602-d05-ddl` で作業する。

objective: |
  `db/ddl/d05_external_product_integration.sql` を作成し、D05 対象 10 テーブルの PostgreSQL DDL を各テーブル定義書・物理 ER・enum定義書・コード定義書・マイグレーション方針書と整合させる。
  バッチ内の CREATE 順序は FK 依存に従う（`fetch_cursor` → `api_call_log` → `raw_product_metadata` → Staging 系 → `product_diff_result` → `item_import_summary`）。
  `batch_run_log`（D10）への参照は LOGICAL のまま（物理 FK なし）。`item` / `external_genre` / `external_attribute` への参照も LOGICAL 維持。

scope:
  - "`db/ddl/d05_external_product_integration.sql` の新規作成"
  - "D05 対象 10 テーブルの `CREATE TABLE`、PK、UNIQUE、Index、CHECK、バッチ内で成立する物理 FK"
  - "  - `fetch_cursor`"
  - "  - `api_call_log`"
  - "  - `raw_product_metadata`"
  - "  - `staging_item`"
  - "  - `staging_item_image`"
  - "  - `staging_ranking_signal`"
  - "  - `staging_genre`"
  - "  - `staging_attribute`（MVP△。DDL 参照用に含める）"
  - "  - `product_diff_result`"
  - "  - `item_import_summary`"
  - "D01〜D04 適用済み前提で実行可能な SQL（enum 型・拡張は D01 参照、`item` / `external_genre` / `external_attribute` は D04 参照）"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "D06 以降のテーブル `CREATE TABLE`（`item_semantic` / `recommendation_request` 等）"
  - "D10 `batch_run_log` 等 Log 系テーブルの `CREATE TABLE`（`api_call_log` / `item_import_summary` からの LOGICAL 参照のみ）"
  - "D04 Item 系から Staging / Raw への後追い物理 FK（各テーブル定義書の LOGICAL 参照方針に従い MVP では付与しない）"
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`db/seeds/**` の作成（Task ⑤）"
  - "`packages/code-definitions/**` の変更"
  - "`apps/**` 実装変更"
  - "docs の変更（DDLバッチ分割表・テーブル定義書は参照のみ）"

