background: |
  Phase2 子 Task ③ Batch R09 No.4（最終バッチ）。テーブル一覧 §6 No.24。
  External Attribute 反映前の属性データを保持する Staging 中間正本。
  楽天商品検索APIの `attributeIds` / `attributeFlag`、楽天属性検索API（任意）、ジャンル検索APIの `attributes` / `tagGroups` 正規化結果が入力候補となる。
  `raw_product_metadata` → `staging_attribute`（transforms_to）→ `external_attribute`（upserts）の属性昇格フローの中核。
  BATCH-005（Raw取込・Staging変換）および MOD-BATCH-031 External Attribute Updater で作成・更新され、属性反映フェーズで `external_attribute` へ Upsert する。
  MVP では **任意テーブル（△）** であり、物理ER では MVP DDL 作成対象 60 テーブルから除外されているが、本 Task では **テーブル定義書として設計を文書化** し、採用判断・後続 DDL Task への引き継ぎを可能にする。
  処理構成定義書 §10.2 の `staging_item_attribute` 表記とテーブル一覧 `staging_attribute` の名称差分を物理 DDL 方針として解消する。
  親 Epic Branch 最新（enum #440、raw_product_metadata #506、external_attribute #575、staging_item #517、staging_genre #525、product_diff_result #526 merge 済み前提）を前提とする。
  Issue #576 / Branch `docs/task-576-staging-attribute-table-spec` で作業する。

objective: |
  `staging_attribute` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `raw_product_metadata` との transforms_to 関係、`external_attribute` への Upsert キー・列マッピング、`product_diff_result` との **責務分離**（属性 Staging は差分判定入力外）、MVP 任意テーブルであること、BATCH-005 / MOD-BATCH-031 との関係を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の staging_attribute テーブル定義書作成"
  - "物理ER 外部商品データ連携系・テーブル一覧 §6 No.24・§5 補足 No.9（MVP任意）との突合"
  - "論理ER・外部商品データ連携設計書 §4.5 楽天属性検索API・§12.2–§12.3 属性データ連携・attributeIds マッピングとの整合"
  - "raw_product_metadata_テーブル定義書 §5 transforms_to 関係・source_api = attribute_search / genre_search 属性ノードとの整合"
  - "external_attribute_テーブル定義書 §5 Upsert 関係・Upsert キー・列マッピング・楽天API マッピングとの突合"
  - "product_diff_result_テーブル定義書 §5 責務境界・BATCH-005〜006 パイプライン上の sibling 関係（直接 FK なし）の整理"
  - "staging_item_テーブル定義書 §5 attributeIds（Payload / hash 入力のみ・DB 列なし）との参照関係整理"
  - "staging_genre_テーブル定義書 §5 transforms_to / upserts・Staging 系章構成・Retention 方針との一貫性"
  - "正本定義表・モジュール一覧 MOD-BATCH-031 External Attribute Updater・処理構成定義書 §10.2–§10.3 との整合"
  - "バッチ設計方針書 BATCH-005 / 属性マスタ Upsert 方針・インターフェース一覧 IF-DB-BATCH-005 等との整合"
  - "処理構成定義書 `staging_item_attribute` / `item_attribute` 表記と物理名 `staging_attribute` / `external_attribute` の差分解消"
  - "Task / Review Definition の整備"

out_of_scope:
  - "external_attribute テーブル定義書の再作成（#575 merge 済み正本を参照）"
  - "product_diff_result / staging_item / staging_genre テーブル定義書の再作成（本 Task では関係整理のみ）"
  - "item / item_image / item_review_summary 等のテーブル定義書"
  - "api_call_log / fetch_cursor テーブル定義書"
  - "DDL・migration / seed（MVP では物理ER 上も作成しない方針）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"
  - "物理ER 本体の Mermaid / 関係表への追記（Epic 横断更新 Task へ委譲。本 Task では参照・差分明示のみ）"

