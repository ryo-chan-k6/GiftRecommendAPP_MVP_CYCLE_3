background: |
  Phase2 子 Task ④ DDL の **バッチ D12（遅延 FK / 索引追加）**。D02〜D11 でテーブル作成順・循環参照回避のため `ALTER TABLE` に延期した物理 FK を後追い付与する。
  対象 scope は [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §16 および [物理ER.md](../../../docs/06_実装設計/database/物理ER.md) §9・§10・§11・§17 を正とする。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）〜 D11（`db/ddl/d11_metric.sql`、Issue #608 / PR #624 merge 済み）適用後に本バッチを実行する前提とする。
  既知の延期 FK 候補:
  - `normalization_rule.feature_normalization_version_id` → `feature_normalization_version`（D02 / D03 コメント・`normalization_rule_テーブル定義書` §17.1 No.3）
  - Metric 4 テーブル → `semantic_config_version`（D11 コメント・各 Metric テーブル定義書 §8.1 / 物理ER §11）
  `item_embedding` の HNSW 索引（`idx_item_embedding_vector`）は D06 で作成済みのため、本 Task では **重複作成しない**（物理ER §17 No.6）。
  Issue #609 / Branch `chore/task-609-d12-ddl` で作業する。

objective: |
  `db/ddl/d12_deferred_fk_indexes.sql` を作成し、D02〜D11 で延期された後追い物理 FK を PostgreSQL `ALTER TABLE ... ADD CONSTRAINT` で定義する。
  作業開始時に `db/ddl/d01_*.sql`〜`d11_*.sql` を棚卸しし、コメント・テーブル定義書・物理ER に記載の延期 FK / 索引のうち **未適用分のみ** を本ファイルに集約する。
  制約名・`ON DELETE` 方針は各テーブル定義書 §8〜§10 および物理ER §11 に従う。

scope:
  - "`db/ddl/d12_deferred_fk_indexes.sql` の新規作成"
  - "D02〜D11 で延期された後追い物理 FK の `ALTER TABLE ... ADD CONSTRAINT`"
  - "  - `normalization_rule.feature_normalization_version_id` → `feature_normalization_version`（`fk_normalization_rule_feature_normalization_version`）"
  - "  - `feature_distribution_metric.semantic_config_version_id` → `semantic_config_version`（`fk_fdm_semantic_config_version_id`）"
  - "  - `meaning_distribution_metric.semantic_config_version_id` → `semantic_config_version`（`fk_mdm_semantic_config_version_id`）"
  - "  - `normalization_distribution_metric.semantic_config_version_id` → `semantic_config_version`（`fk_ndm_semantic_config_version_id`）"
  - "  - `reco_score_distribution_metric.semantic_config_version_id` → `semantic_config_version`（`fk_rsdm_semantic_config_version_id`）"
  - "棚卸しで発見した、その他の延期物理 FK / 後追い Index（物理ER §9・§10・§11 および各 DDL コメントに根拠があるもの）"
  - "D01〜D11 適用済み前提で実行可能な SQL"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "新規テーブルの `CREATE TABLE`（D02〜D11 で完了済み）"
  - "`item_embedding` HNSW 索引の重複作成（D06 `idx_item_embedding_vector` 作成済み）"
  - "Batch / Staging / Log / Metric の `batch_run_id` 等への物理 FK（LOGICAL 方針）"
  - "`user_semantic.semantic_config_version_id` への物理 FK（LOGICAL + Index 方針。`user_semantic_テーブル定義書` §17.1 No.1）"
  - "`recommendation_request` → Master 系の後追い物理 FK（LOGICAL + Index 方針）"
  - "D13 横断整合チェックの実施（別 Task #610）"
  - "`supabase/migrations/` への統合（Task ⑤）"
