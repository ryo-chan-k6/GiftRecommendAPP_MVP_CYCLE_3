background: |
  Phase2 子 Task ③ Batch R04 No.1。論理ER §9.2・テーブル一覧 §6 No.21。
  外部商品取込 Staging の画像データ。`raw_product_metadata` → `staging_item_image`（BATCH-005）→ `item_image`（BATCH-007）昇格フローの Staging 側。
  楽天商品検索 API の `smallImageUrls` / `mediumImageUrls` を URL 行として保持する。MVP では画像バイナリ非保存。
  親 Epic Branch 最新（raw_product_metadata #506、staging_item #517、item_image #497 merge 済み前提）を前提とする。
  Issue #523 / Branch `docs/task-523-staging-item-image-table-spec` で作業する。

objective: |
  `staging_item_image` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `raw_product_metadata` との transforms_to 関係、`staging_item` との兄弟紐づけ（`raw_metadata_id` + `external_item_code`）、`item_image` への Upsert 反映（`external_item_code` + `item.source` → `item_id`）を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の staging_item_image テーブル定義書作成"
  - "物理ER 外部商品データ連携系・論理ER §9.2 / §14.4・テーブル一覧 §6 No.21 との突合"
  - "raw_product_metadata_テーブル定義書 §8 transforms_to 関係との整合"
  - "staging_item_テーブル定義書 §8.3 兄弟 Staging 紐づけ（raw_metadata_id + external_item_code）との整合"
  - "item_image_テーブル定義書 §5.5 / §12.1 staging_item_image → item_image 反映・同期置換との突合"
  - "item_テーブル定義書 §8 / §12（item.source 解決・Upsert 順序）との突合"
  - "外部商品データ連携設計書 §11 商品画像データ・楽天 API 画像項目マッピングとの整合"
  - "バッチ設計方針書 BATCH-005 / BATCH-007・処理構成定義書 MOD-BATCH-022 / MOD-BATCH-024 との登録/反映方針整理"
  - "インターフェース一覧 IF-DB-BATCH-005（Staging 保存）との整合"
  - "物理ER §13 Staging 系 Retention（成功 Batch 後即 DELETE）方針の明記"
  - "Task / Review Definition の整備"

out_of_scope:
  - "staging_item / item_image / raw_product_metadata / item テーブル定義書（先行 Task 完了済み）"
  - "staging_ranking_signal / staging_genre / product_diff_result テーブル定義書（別 Task）"
  - "画像バイナリ保存・CDN 設計"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

