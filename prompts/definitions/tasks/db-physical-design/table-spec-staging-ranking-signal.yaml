background: |
  Phase2 子 Task ③ Batch R04 No.2。論理ER §9.2・テーブル一覧 §6 No.22。
  外部ランキング信号の Staging 正本。`ranking_snapshot` 昇格前の中間データ。
  BATCH-005（Raw取込・Staging変換）で `raw_product_metadata` から生成され、BATCH-002 / IF-DB-BATCH-008 経由で `ranking_snapshot` → `item_popularity_signal` へ昇格する。
  物理ER §8 transforms_to・§17 No.3（Staging 系物理 FK なし）を前提とする。
  先行 Task #496（ranking_snapshot / PR #501 merge 済み）・#517（staging_item / PR #522 merge 済み）・#504（item_popularity_signal / PR #509 merge 済み）・#506（raw_product_metadata / PR #511 merge 済み）を前提とする。
  Issue #524 / Branch `docs/task-524-staging-ranking-signal-table-spec` で作業する。

objective: |
  `staging_ranking_signal` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `raw_product_metadata` との transforms_to 関係、`ranking_snapshot` / `item_popularity_signal` への昇格経路、`staging_item` との責務分離を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の staging_ranking_signal テーブル定義書作成"
  - "物理ER 外部商品データ連携系・transforms_to / upserts・§17 Staging 系 FK 方針との突合"
  - "論理ER §9.2 外部商品データ連携系エンティティ属性・§14.4 Raw / Staging / Item 関係との整合"
  - "テーブル一覧 §6 No.22・Staging 系補足・Ranking 方針との整合"
  - "外部商品データ連携設計書 §4.3 楽天ランキング API・§13 ランキングデータ連携方針との突合"
  - "raw_product_metadata_テーブル定義書 §8 transforms_to 関係・§5 責務境界との整合"
  - "ranking_snapshot_テーブル定義書 §5.2 staging 経路・2 層 Snapshot 構造との整合"
  - "item_popularity_signal_テーブル定義書 §5.2 staging 経路・冗長列方針との整合"
  - "staging_item_テーブル定義書 §5 責務境界・BATCH-005 sibling Staging との関係整理"
  - "external_genre_テーブル定義書 §8.2 external_genre_id（bigint）LOGICAL 参照方針との整合"
  - "バッチ設計方針書 BATCH-005 / BATCH-002・§11.5 / §12.3・インターフェース一覧 IF-DB-BATCH-005 / IF-DB-BATCH-008 との整合"
  - "staging_item / staging_item_image と同型の Staging 系章構成・LOGICAL FK 方針を踏襲"
  - "Task / Review Definition の整備"

out_of_scope:
  - "ranking_snapshot / item_popularity_signal テーブル定義書の再作成（#496 / #504 merge 済み）"
  - "staging_item / staging_item_image / staging_genre テーブル定義書の再作成（別 Task）"
  - "item / external_genre テーブル定義書の再作成"
  - "DDL・migration / seed"
