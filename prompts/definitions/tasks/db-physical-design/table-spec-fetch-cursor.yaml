background: |
  Phase2 子 Task ③ Batch R02 No.3。論理ER §9.2・テーブル一覧 §6 No.17。
  楽天API疑似差分取得（BATCH-003 / BATCH-004）の走査状態（cursor）を batch が管理する。
  `fetch_cursor` → `api_call_log` → `raw_product_metadata` の連携の起点となる。
  親 Epic Branch 最新（enum #440 merge 済み、external_genre #494 merge 済み前提）を前提とする。
  Issue #505 / Branch `docs/task-505-fetch-cursor-table-spec` で作業する。

objective: |
  `fetch_cursor` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `cursor_status` 状態遷移（状態遷移設計書 §6.4）と `api_call_log` との関係（LOGICAL FK・rate_limited → paused 検討）を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の fetch_cursor テーブル定義書作成"
  - "物理ER 外部商品データ連携系・論理ER §9.2 / §9.3 との突合"
  - "状態遷移設計書 §6.4（cursor_status）・§11.2 / §11.3（api_call_log 連動）との整合"
  - "enum定義書 §6.8 fetch_cursor_status との整合"
  - "external_genre テーブル定義書 §8.2（target_external_genre_id LOGICAL 参照）との突合"
  - "api_call_log との 1:N controls 関係の整理（api_call_log 本体定義は別 Task へ委譲）"
  - "IF-DB-BATCH-003（Fetch Cursor 参照・更新）との整合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "api_call_log テーブル定義書（別 Task 化予定。本 Task では関係整理のみ）"
  - "raw_product_metadata テーブル定義書（#506 / Batch R02 No.4）"
  - "product_diff_result / staging_* 等の他外部商品データ連携系テーブル定義書"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

