background: |
  Phase2 子 Task ③ Batch R02 No.5。論理ER §8.2・テーブル一覧 §7 No.27。
  Item Semantic / Feature / Embedding 再生成の Queue 制御。`queue_status` 状態管理対象。
  BATCH-009（商品意味生成キュー登録）〜 BATCH-015（Item Embedding 生成）の起点テーブル。
  親 Epic Branch 最新（enum #440 merge 済み、item #495 merge 済み前提）を前提とする。
  Issue #507 / Branch `docs/task-507-item-generation-queue-table-spec` で作業する。

objective: |
  `item_generation_queue` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `queue_status` 状態遷移（状態遷移設計書 §7.2）と `generation_type`（semantic / feature / embedding）・`retry_count`・`item` 紐づけ方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の item_generation_queue テーブル定義書作成"
  - "物理ER Item派生データ系・論理ER §8.2 / §15 状態カラム・テーブル一覧 §7 No.27 との突合"
  - "状態遷移設計書 §7.2（queue_status）・§11.2 / §11.3（失敗・再実行方針）との整合"
  - "enum定義書 §6.11 item_generation_queue_status・§6.17 item_generation_type との整合"
  - "packages/code-definitions（item_generation_queue_status.yaml / item_generation_type.yaml）との突合"
  - "item_テーブル定義書 §8.2 / §12.1（item_id 物理 FK ON・hash 変更時キュー登録）との突合"
  - "バッチ設計方針書 BATCH-009〜015・バッチ依存関係図・バッチ処理一覧との登録/消化/再実行方針整理"
  - "インターフェース一覧 IF-DB-BATCH-010（キュー登録）・IF-DB-BATCH-012（hash 保存連携）との整合"
  - "item 更新・version 更新時の再生成トリガー方針（meaning_input_diff / semantic_config_version / model_version 等）の整理"
  - "ログ・Observability設計書・エラーコード定義書（GRS-BAT-007〜009）との trace キー整理"
  - "Task / Review Definition の整備"

out_of_scope:
  - "item_semantic / item_feature / item_meaning / item_embedding テーブル定義書（Batch R03）"
  - "feature_input_hash / embedding_input_hash の永続化先テーブル定義（別 Task または派生メタデータ整理）"
  - "product_diff_result / meaning_input_diff の本体定義書（本 Task ではトリガー条件の参照整理のみ）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

