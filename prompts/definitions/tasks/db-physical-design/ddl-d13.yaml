background: |
  Phase2 子 Task ④ DDL の **終盤ゲート D13（DDL 横断整合チェック）**。D01〜D12 の `db/ddl/*.sql` が揃った後、テーブル定義書・物理 ER・enum 定義書・コード定義書との整合を確認する Epic 終盤ゲート Task（#582 / #469 と同型のチェックリスト + 修正 PR）。
  対象 scope は [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §17 および [マイグレーション方針書.md](../../../docs/06_実装設計/database/マイグレーション方針書.md) §8.1・§8.2 を正とする。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）〜 D12（`db/ddl/d12_deferred_fk_indexes.sql`、Issue #609 / PR #625 merge 済み）適用後に本バッチを実行する前提とする。
  `db/ddl/d13_ddl_cross_check.sql` は **スキーマ追加用ではなく**、D01〜D12 適用済み DB に対する横断検証 SQL（件数・存在確認・主要制約の突合）を集約する。
  Issue #610 / Branch `chore/task-610-d13-ddl` で作業する。

objective: |
  1. D01〜D12 の `db/ddl/*.sql` を棚卸しし、テーブル定義書・物理 ER・enum 定義書・コード定義書・DDLバッチ分割表と横断突合する。
  2. `db/ddl/d13_ddl_cross_check.sql` を作成し、D01 適用済み前提で D02〜D12 適用後に実行可能な検証 SQL を定義する。
  3. 不整合を事実 / 推論 / 未確認に区分し、Blocker / Must / Should / Question に分類する（チェックリストは PR 本文に記載）。
  4. Blocker 級不整合は本 Task Branch 上で `db/ddl/d01_*.sql`〜`d12_*.sql` を修正する（同一 PR に含める）。
  5. Task ⑤（`supabase/migrations/` 統合）および Epic PR → develop 進行の判断材料を PR 本文に整理する。

scope:
  - "`db/ddl/d13_ddl_cross_check.sql` の新規作成"
  - "D01〜D12 DDL と docs の横断整合チェック（enum 26 件・MVP 対象 62 テーブル・物理 FK / 索引 / CHECK の主要観点）"
  - "チェック観点に沿った棚卸し結果の一覧化（事実 / 推論 / 未確認、Blocker / Must / Should / Question）"
  - "Blocker 級不整合の `db/ddl/d01_*.sql`〜`d12_*.sql` 修正（本 Task scope 内で同一 PR に含める）"
  - "D01（extension / enum 型）適用済み前提で D02〜D12 + D13 検証 SQL が実行可能であることの確認"
  - "ローカル DB 検証手順書に沿った実 DB 検証（可能な範囲）"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`db/seeds/**` の作成（Task ⑤）"
  - "docs の仕様再設計・大規模修正（本 Task は DDL 横断整合が主目的。docs 修正は Blocker 級かつ DDL 修正だけでは解消不能な場合は Human 判断）"
