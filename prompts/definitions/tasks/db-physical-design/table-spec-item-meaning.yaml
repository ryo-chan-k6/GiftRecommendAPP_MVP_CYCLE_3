background: |
  Phase2 子 Task ③ Batch R03 No.3。テーブル一覧 §7 No.30。
  Item Feature を Social / Symbolic へ射影した商品側 Meaning。Batch 事前生成・Online 参照のみ。
  物理ER §4.1 Item派生データ系・§9 `item.item_id → item_meaning.item_id`（has / ON / 1:N）を前提とする。
  先行 Task #495（item / PR #500 merge 済み）の item_id 物理 FK ON 方針を踏襲する。
  先行 Task #507（item_generation_queue / PR #512 merge 済み）の派生生成 Queue 経路を参照する。
  先行 Item 派生系 Task #508–#511 / PR merge 済みを前提とする。
  Issue #515 / Branch `docs/task-515-item-meaning-table-spec` で作業する。

objective: |
  `item_meaning` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `item_feature`（正規化済み Feature）から `item_social` / `item_symbolic` への射影・生成関係を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の item_meaning テーブル定義書作成"
  - "物理ER Item派生データ系・FK・Index 方針との突合"
  - "論理ER §10.2 user_meaning 対称性・テーブル一覧 §7 No.30・正本定義表 item_social / item_symbolic との整合"
  - "GiftMeaningSpace定義書 §5–§7 Social / Symbolic 射影ルール・semantic_config_version 重みとの整合"
  - "バッチ設計方針書 §13 Item Semantic / Feature / Meaning 生成パイプライン・BATCH-013 出力との整合"
  - "バッチ処理一覧 BATCH-012 / BATCH-013・インターフェース一覧 IF-DB-BATCH-014 との生成・保存 I/F 整理"
  - "item_テーブル定義書 §8.2 被参照関係・item_generation_queue テーブル定義書との派生生成経路整理"
  - "item_feature テーブル定義書（#514 merge 済み時）または論理ER §10.2 / 物理ER §11 との生成元 Feature 関係整理"
  - "ログ・Observability設計書 item_social_mean / item_symbolic_mean 等メトリクス列との責務境界整理"
  - "Task / Review Definition の整備"

out_of_scope:
  - "item_semantic / item_feature / item_embedding テーブル定義書本体（Batch R03 別 Task）"
  - "user_meaning テーブル定義書（Online / User意味推定系）"
  - "meaning_distribution_metric テーブル定義書（Metric 系別 Task）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

