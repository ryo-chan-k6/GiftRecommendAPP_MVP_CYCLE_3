    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: true
      purpose: "recommendation_result に user_id なし・Request 経由追跡方針"
    - path: "docs/05_アプリケーション設計/アプリ/状態遷移設計書.md"
      required: true
      purpose: "§5.2 result_status 遷移（generated / empty / failed）・生成後不変方針"
    - path: "docs/06_実装設計/database/recommendation_request_テーブル定義書.md"
      required: true
      purpose: "has 関係（recommendation_request_id 物理 FK ON）・Request 再実行 1:N 方針（merge 済み前提）"
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
      required: true
      purpose: "Response recommendationResultId → recommendation_result_id マッピング"
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API契約仕様書.md"
      required: true
      purpose: "Internal Response recommendationResultId マッピング"
    - path: "docs/06_実装設計/api/API-PUB-004_Feedback送信API契約仕様書.md"
