      purpose: "recommendation_request テーブル定義書（has 関係の親 Request。merge 済み前提）"
    - number: 543
      purpose: "推奨先行: recommendation_run テーブル定義書（produces 関係の親 Run。Batch R06 No.1。未 merge 時も物理ER・論理ER §14.1 で着手可能）"
    - number: 545
      purpose: "並行可能: recommendation_result_item テーブル定義書（contains 関係の子。Batch R06 No.3）"
    - number: 546
      purpose: "並行可能: recommendation_reason テーブル定義書（result_item 経由の子。Batch R06 No.4）"
    - number: 547
      purpose: "並行可能: recommendation_feedback テーブル定義書（receives 関係の子。Batch R06 No.5）"
