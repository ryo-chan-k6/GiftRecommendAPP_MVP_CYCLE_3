background: |
  Phase2 子 Task ③ Batch R06 No.2。論理ER §14.1・テーブル一覧 §3 No.3。
  Online推薦結果ヘッダ正本。`recommendation_result_item` / `recommendation_reason` / `recommendation_feedback` の親。
  IF-DB-RECO-007（Recommendation Result 保存）の DB 正本（ヘッダ部分）。
  親 Epic Branch 最新（recommendation_request #537 / PR #542 merge 済み前提）を前提とする。
  推奨先行 Task #543（recommendation_run）は未 merge でも、物理ER §9・論理ER §14.1 を正本として着手可能とする。
  Issue #544 / Branch `docs/task-544-recommendation-result-table-spec` で作業する。

objective: |
  `recommendation_result` の物理カラム・制約・Index・`result_status` 状態方針を table-spec.md テンプレ準拠で定義する。
  Online推薦フロー（Request → Run → Result → Result Item）の Result ヘッダ、`recommendation_request` / `recommendation_run` との物理 FK（§17 No.3）、後続 `recommendation_result_item` への 1:N contains 関係を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の recommendation_result テーブル定義書作成"
  - "物理ER Online推薦系・§9 FK（produces / has）・§10 Index・§11 制約（uq_result_per_run）・§17 No.3 物理 FK 方針との突合"
  - "論理ER §3 / §14.1 Request → Run → Result フロー・§14.2 Result → Item 関係との整合"
  - "テーブル一覧 §3 No.3・Online推薦系補足（0件結果は empty 正常扱い）との整合"
  - "RecommendationResult定義書 §10 DB 項目・§9 API 返却・生成後不変方針との整合"
  - "enum定義書 §6.2 recommendation_result_status・§8 テーブル列マッピングとの整合"
  - "packages/code-definitions/state/recommendation_result_status.yaml との整合"
  - "状態遷移設計書 §5.2 Recommendation Result 状態遷移（generated / empty / failed）との整合"
  - "recommendation_request テーブル定義書（has 関係・Request 再実行で複数 Result）との双方向整合"
  - "API-PUB-002 / API-INT-002（recommendationResultId → recommendation_result_id マッピング）との整合"
  - "API-PUB-004（Feedback 前提 resultId）との整合"
  - "インターフェース一覧 IF-DB-RECO-007・処理構成定義書・処理フロー概要図との整合"
  - "正本定義表・リソース一覧・リソース責務定義表・ログ・Observability設計書（recommendation_result_id trace / Retention）との突合"
  - "認証・認可方針書（user_id なし・Request 経由追跡）との整合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "recommendation_result_item / recommendation_reason / recommendation_feedback テーブル定義書（R06 No.3〜5 別 Task）"
  - "recommendation_run テーブル定義書の再作成（#543。merge 済みを参照。未 merge 時は物理ER §9 を正本）"
  - "recommendation_request テーブル定義書の再作成（#537 merge 済みを参照）"
  - "user_semantic / user_feature / user_meaning テーブル定義書"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

