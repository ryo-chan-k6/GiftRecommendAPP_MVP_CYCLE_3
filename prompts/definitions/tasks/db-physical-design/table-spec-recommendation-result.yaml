review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: true

contract_gate:
  required: false

human_decision_points: []

human_review_decisions:
  - id: 1
    topic: "result_status 物理列"
    decision: "MVP 物理列あり。値は generated / empty / failed。生成後原則 UPDATE しない（終端状態）"
  - id: 2
    topic: "uq_result_per_run"
    decision: "recommendation_run_id に unique 制約（1 Run 1 Result）。物理ER §11 uq_result_per_run に整合"
  - id: 3
    topic: "generated_at 物理列名"
    decision: "論理ER generated_at と同一意味。物理名は generated_at を優先（created_at 併記は DDL Task で最終判断）"
  - id: 4
    topic: "Online推薦コア Retention"
    decision: "MVP DELETE なし。具体保持期間は Phase2 ⑥ データ保持方針 Task で確定（Observability 180〜365日候補を注記）"
  - id: 5
    topic: "version 列の保持先（Result vs Run）"
    decision: "Run 側に実行コンテキスト正本。Result ヘッダは表示・評価に必要な最小 version 参照を LOGICAL FK または冗長保持で整理（RecommendationResult定義書 §10.1 と Run 定義書の整合を本 Task で明記）"
  - id: 6
    topic: "0件結果の扱い"
    decision: "error ではなく result_status=empty の正常 Result として保存（テーブル一覧 Online推薦系補足）"

notes:
  - "Batch R06 No.2: recommendation_result（Online推薦系ヘッダ）"
  - "Issue #544 / Branch docs/task-544-recommendation-result-table-spec"
  - "Issue 本文のテーブル一覧参照 §4 は User意味推定系を指すため、正本は §3 No.3 を用いる"
  - "R06 No.1 recommendation_run（#543）未 merge 時は物理ER §9・論理ER §14.1 を正本として着手可能"
  - "R06 No.3 recommendation_result_item 等は本 Task の後続 Task。Result 側から 1:N contains 関係のみ整理"
  - "先行 merge 済み前提: #537 / PR #542（recommendation_request）"
  - "Human Review 決定事項: human_review_decisions 参照"
  - "OpenAPI / generated は Epic 終盤 Task #469 で一括同期"
