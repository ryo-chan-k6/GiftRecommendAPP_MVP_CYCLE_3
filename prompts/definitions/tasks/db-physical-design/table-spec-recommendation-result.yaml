  - "recommendation_run / recommendation_result_item との関係（produces / contains）が明記されている"
  - "recommendation_request との has 関係（1:N・物理 FK ON）が明記されている"
  - "物理ER・論理ER §3 / §14.1・テーブル一覧 §3 No.3 と矛盾しない"
  - "result_status（generated / empty / failed）と enum定義書 §6.2 が一致している"
  - "uq_result_per_run（1 Run 1 Result）方針が明記されている"
  - "生成後原則 UPDATE しない方針（状態遷移設計書 §5.2.3）が明記されている"
  - "apps/** 変更がない"
  - "Task PR target が親 Epic Branch"

branch:
  no_branch: false
