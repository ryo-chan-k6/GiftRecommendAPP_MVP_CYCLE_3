    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "Online推薦系分類・recommendation_run produces / recommendation_request has・§10 idx_recommendation_result_run_id・§11 uq_result_per_run・§17 No.3 物理 FK"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "recommendation_result_status（§6.2）・result_status 列マッピング（§8）参照"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§3 recommendation_result 属性・§14.1 Request → Run → Result・§14.2 Result → Item"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§3 No.3 Recommendation Result・Online推薦系補足（0件結果方針）"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: true
      purpose: "§10.1 recommendation_result DB 項目・§9 API 返却・生成後不変方針"
    - path: "docs/05_アプリケーション設計/アプリ/database/正本定義表.md"
      required: true
      purpose: "Recommendation Result 正本区分（内部正本）・reco 保存主体"
    - path: "docs/05_アプリケーション設計/アプリ/database/リソース一覧.md"
      required: true
      purpose: "Recommendation Result リソース分類・更新主体"
    - path: "docs/05_アプリケーション設計/アプリ/database/リソース責務定義表.md"
      required: true
      purpose: "Result 保存責務・正本 / 派生の境界"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-RECO-007 Recommendation Result 保存 I/F"
    - path: "docs/05_アプリケーション設計/アプリ/処理構成定義書.md"
