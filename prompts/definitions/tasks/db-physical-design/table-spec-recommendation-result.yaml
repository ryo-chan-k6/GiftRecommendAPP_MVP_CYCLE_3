    - "docs/06_実装設計/database/recommendation_result_テーブル定義書.md"
  conflict_risk: "low"
  db_impact: false

test_policy:
  manual_checks:
    - "物理ER §9 recommendation_run produces / recommendation_request has 関係との整合"
    - "物理ER §10 idx_recommendation_result_run_id・§11 uq_result_per_run との整合"
    - "論理ER §3 属性（recommendation_request_id, recommendation_run_id, result_count, generated_at, result_status）との整合"
    - "論理ER §14.1 Request → Run → Result フローとの整合"
    - "RecommendationResult定義書 §10.1 項目表との整合（論理ER 差分は明示）"
    - "enum定義書 §6.2 / packages/code-definitions/state/recommendation_result_status.yaml との整合"
    - "状態遷移設計書 §5.2 result_status 遷移・生成後不変方針との整合"
    - "recommendation_request 定義書 has 関係との双方向整合"
    - "API-PUB-002 / API-INT-002 recommendationResultId マッピングとの整合"
    - "テーブル一覧 §3 No.3・0件結果 empty 正常扱いとの整合"
    - "ログ・Observability設計書 recommendation_result_id trace / Retention 方針との整合"
