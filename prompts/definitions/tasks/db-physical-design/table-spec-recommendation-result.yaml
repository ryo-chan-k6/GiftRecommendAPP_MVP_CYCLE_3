task:
  id: "task-db-physical-design-table-spec-recommendation-result"
  title: "recommendation_result:Recommendation Resultテーブル定義書作成"
  summary: "物理ER・論理ER・RecommendationResult定義書・enum定義書・recommendation_request テーブル定義書・API-PUB-002 / API-INT-002 を入力に、Online推薦結果ヘッダ正本 `recommendation_result` のテーブル定義書を作成する。Phase2 子 Task ③ Batch R06 No.2。"
  phase: "06_実装設計"

work_mode: "ai-agent"

