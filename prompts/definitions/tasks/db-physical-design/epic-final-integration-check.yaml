parallel_control:
  depends_on: []
  blocks:
    - "Epic PR → develop（本 Task 完了・Human Review 後）"
  exclusive_files:
    - "docs/00_共通/成果物管理/成果物一覧.md"
    - "prompts/definitions/epics/db-physical-design/epic.yaml"
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: false

contract_gate:
  required: false

test_policy:
  required:
    - "docs review"
    - "epic final integration check script"
  commands:
    - "python3 scripts/epic-435-final-integration-check.py"
  manual_checks:
    - "成果物一覧 §4.1 が ①〜⑥ 完了状態と一致"
    - "supabase/migrations/ が非空で db/ddl と整合"
    - "db/seeds/masters/ が初期データ定義書と整合"
    - "（未作成）プレースホルダと作成済み成果物の重複がない"
    - "apps/** / packages/contracts/** 変更なし"
  not_required:
    - "unit test"
    - "e2e test"
  skip_reason:
    "unit test": "Epic 終盤横断チェック Task のため"
    "e2e test": "Epic 終盤横断チェック Task のため"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "①〜⑥ 棚卸し結果が事実 / 推論 / 未確認で区別されているか"
    - "Blocker 級の扱いが適切か"
    - "Epic PR 進行判断材料が PR 本文に記載されているか"
    - "out_of_scope 変更が混在していないか"
  specialist_reviews:
    docs: true
    test: false
    contract: false
    security: false

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: true
    experiments: false
  reason: "Epic 終盤横断影響の棚卸し。通常結果は PR を正本とする。"

risk_points:
  - "成果物一覧 §4.1 の更新漏れ"
  - "migration と db/ddl の転記差分"
  - "プレースホルダファイル残存"
  - "MVP△ テーブルの go/no-go 判断"

human_decision_points:
  - "Epic PR → develop の merge 可否（Human 判断。本 Task は判断材料の整理まで）"
  - "MVP△ テーブル 4 件の Epic 含有方針の最終確認"
  - "Blocker と Must の境界"

stop_conditions:
  - "正本 docs 間で矛盾があり、AI が独断で解消できない場合"
  - "Blocker 修正に DDL / migration 大規模変更が必要になった場合"
  - "①〜⑥ の前提成果物が Epic Branch に存在しない場合"

notes:
  - "Epic PR 直前ゲート。#582・#469・D13 を補完する全体整合チェック"
  - "Review Definition: prompts/definitions/reviews/db-physical-design/epic-final-integration-check/pr-review.yaml"
  - "棚卸し結果の正本は PR 本文"
