  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"
    planned_start: "2026-06-17"
    due_date: "2026-06-19"

issue:
  number: 633
  unit: "task"
  type: "docs"
  area: "db"

dependencies:
  epics: []
  issues:
    - number: 435
      purpose: "親 Epic"
    - number: 582
      purpose: "docs 横断ゲート完了"
    - number: 469
      purpose: "OpenAPI/Orval 同期完了"
    - number: 610
      purpose: "D13 DDL ゲート完了"
    - number: 627
      purpose: "⑤ migration/seed 完了"
    - number: 631
      purpose: "⑥ データ保持方針完了"
  prs: []
  tasks: []
