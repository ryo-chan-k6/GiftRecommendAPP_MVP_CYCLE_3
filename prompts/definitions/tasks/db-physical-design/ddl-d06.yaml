background: |
  Phase2 子 Task ④ DDL の **バッチ D06（Item 派生データ系）**。Batch 事前生成の Semantic / Feature / Meaning / Embedding および Generation Queue の基盤となる。
  対象 5 テーブルは [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §10 に列挙される。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）、D02（`db/ddl/d02_semantic_feature_definitions.sql`、Issue #599 / PR #615 merge 済み）、D03（`db/ddl/d03_master_config.sql`、Issue #600 / PR #616 merge 済み）、D04（`db/ddl/d04_item.sql`、Issue #601 / PR #617 merge 済み）、D05（`db/ddl/d05_external_product_integration.sql`、Issue #602 / PR #618 merge 済み）適用後に本バッチを実行する前提とする。
  `item_generation_queue` / 派生テーブル間は **物理 FK なし**（`item_id` 経由の論理関連）。`feature_normalization_version_id` は **LOGICAL + Index**（`item_feature` / `item_meaning`）。
  Issue #603 / Branch `chore/task-603-d06-ddl` で作業する。

objective: |
  `db/ddl/d06_item_derived.sql` を作成し、D06 対象 5 テーブルの PostgreSQL DDL を各テーブル定義書・物理 ER・enum定義書・コード定義書・マイグレーション方針書と整合させる。
  バッチ内の CREATE 順序は FK 依存に従う（`item_generation_queue` → `item_semantic` → `item_feature` → `item_meaning` → `item_embedding`）。
  `item_embedding` には pgvector `vector` 型と HNSW Index を含める（extension は D01 前提）。

scope:
  - "`db/ddl/d06_item_derived.sql` の新規作成"
  - "D06 対象 5 テーブルの `CREATE TABLE`、PK、UNIQUE、Index、CHECK、バッチ内で成立する物理 FK"
  - "  - `item_generation_queue`"
  - "  - `item_semantic`"
  - "  - `item_feature`"
  - "  - `item_meaning`"
  - "  - `item_embedding`（pgvector / HNSW Index 含む）"
  - "D01〜D05 適用済み前提で実行可能な SQL（enum 型・拡張は D01 参照、`item` は D04 参照、`semantic_config_version` は D02 参照、`model_version` は D03 参照）"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "D07 以降のテーブル `CREATE TABLE`（`recommendation_request` 等）"
  - "D08 以降 User 意味推定系テーブルの `CREATE TABLE`"
  - "D09 以降 Evaluation / Metric 系テーブルの `CREATE TABLE`"
  - "D10 `batch_run_log` 等 Log 系テーブルの `CREATE TABLE`"
  - "`item_generation_queue` と派生テーブル間の後追い物理 FK（各テーブル定義書の LOGICAL 参照方針に従い MVP では付与しない）"
  - "`feature_definition` / `feature_normalization_version` への物理 FK（LOGICAL + Index 方針）"
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`db/seeds/**` の作成（Task ⑤）"
  - "`packages/code-definitions/**` の変更"
  - "`apps/**` 実装変更"
  - "docs の変更（DDLバッチ分割表・テーブル定義書は参照のみ）"

