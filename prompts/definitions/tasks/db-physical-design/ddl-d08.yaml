background: |
  Phase2 子 Task ④ DDL の **バッチ D08（User 意味推定系）**。Online 推薦時に reco が生成する User 派生データの基盤となる。
  対象 3 テーブルは [DDLバッチ分割表.md](../../../docs/06_実装設計/database/DDLバッチ分割表.md) §12 に列挙される。
  先行 D01（`db/ddl/d01_extensions_and_enums.sql`、Issue #611 / PR #614 merge 済み）、D02（`db/ddl/d02_semantic_feature_definitions.sql`、Issue #599 / PR #615 merge 済み）、D03（`db/ddl/d03_master_config.sql`、Issue #600 / PR #616 merge 済み）、D04（`db/ddl/d04_item.sql`、Issue #601 / PR #617 merge 済み）、D05（`db/ddl/d05_external_product_integration.sql`、Issue #602 / PR #618 merge 済み）、D06（`db/ddl/d06_item_derived.sql`、Issue #603 / PR #619 merge 済み）、D07（`db/ddl/d07_online_recommendation.sql`、Issue #604 / PR #620 merge 済み）適用後に本バッチを実行する前提とする。
  `semantic_config_version` / `feature_definition` / `feature_normalization_version` 参照は **LOGICAL 参照（物理 FK なし）** が正本方針。`recommendation_run_id` のみ `recommendation_run` への物理 FK ON。
  Issue #605 / Branch `chore/task-605-d08-ddl` で作業する。

objective: |
  `db/ddl/d08_user_meaning.sql` を作成し、D08 対象 3 テーブルの PostgreSQL DDL を各テーブル定義書・物理 ER・enum定義書・コード定義書・マイグレーション方針書と整合させる。
  バッチ内の CREATE 順序は FK 依存に従う（`user_semantic` → `user_feature` → `user_meaning`）。
  `user_feature` → `user_semantic` の生成順序依存はアプリ層制約であり、バッチ内物理 FK は付与しない。

scope:
  - "`db/ddl/d08_user_meaning.sql` の新規作成"
  - "D08 対象 3 テーブルの `CREATE TABLE`、PK、UNIQUE、Index、CHECK、バッチ内で成立する物理 FK"
  - "  - `user_semantic`"
  - "  - `user_feature`"
  - "  - `user_meaning`"
  - "D01〜D07 適用済み前提で実行可能な SQL（enum 型は D01 参照、`recommendation_run` は D07 参照）"
  - "マイグレーション方針書 §8.1 のファイル命名・バッチ順序への準拠"
  - "Task / Review Definition の整備（本 Task で未作成の場合）"

out_of_scope:
  - "D09 以降のテーブル `CREATE TABLE`（Evaluation / Metric / Log 系）"
  - "D12 遅延 FK / 索引追加（後追い制約 Task）"
  - "`user_feature` → `user_semantic` の物理 FK（生成順序はアプリ層制約。LOGICAL 参照方針）"
  - "`user_semantic.semantic_config_version_id` → `semantic_config_version` 物理 FK（LOGICAL + Index 方針）"
  - "`user_feature.feature_code` / `feature_normalization_version_id` への物理 FK（LOGICAL 方針）"
  - "`user_meaning.feature_normalization_version_id` への物理 FK（LOGICAL 方針）"
  - "`user_meaning` 行への `semantic_config_version_id` denormalize（Run 経由参照方針）"
  - "`supabase/migrations/` への統合（Task ⑤）"
  - "`db/seeds/**` の作成（Task ⑤）"
  - "`packages/code-definitions/**` の変更"
  - "`apps/**` 実装変更"
  - "docs の変更（DDLバッチ分割表・テーブル定義書は参照のみ）"

