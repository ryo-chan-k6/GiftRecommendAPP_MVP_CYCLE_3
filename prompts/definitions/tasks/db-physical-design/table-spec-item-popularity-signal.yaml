background: |
  Phase2 子 Task ③ Batch R02 No.2。実装フェーズ実行プロセス設計書 §6.3 の「テーブル定義書（1テーブル=1Task）」に対応。
  楽天ランキングAPI由来の人気補助シグナルを、`ranking_snapshot` 配下の順位明細として管理する。
  物理ER §4.1 Item系・§9 FK・§10 Index・テーブル一覧 §14 No.2（冪等キー: `ranking_snapshot_id + rank`）を前提とする。
  先行 Task #496（ranking_snapshot / PR #501 merge 済み）で確定した親ヘッダ・2 層 Snapshot 構造・staging 経路整理を踏襲する。
  先行 Task #495（item / PR #500 merge 済み）の `item_id` LOGICAL 参照・item 未解決時 code 紐づけ方針を踏襲する。
  先行 Task #494（external_genre / PR #499 merge 済み）の `external_genre_id`（bigint 自然キー）LOGICAL 参照方針を踏襲する。
  Issue #504 / Branch `docs/task-504-item-popularity-signal-table-spec` で作業する。

objective: |
  `item_popularity_signal` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  冪等キー（`ranking_snapshot_id + rank`）と Item 紐づけ（`item_id` / `external_item_code`）方針を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。
  `staging_ranking_signal` → `ranking_snapshot` → `item_popularity_signal` 経路およびヘッダ/明細の冗長列扱いを整理する。

scope:
  - "table-spec.md テンプレ準拠の item_popularity_signal テーブル定義書作成"
  - "物理ER Item系・Ranking Snapshot 系・FK・Index 方針との突合"
  - "論理ER §8.2–§8.4・§9 Staging 系 ER・テーブル一覧 §5 No.16・§14 No.2 との整合"
  - "ranking_snapshot テーブル定義書 §5.2 / §8.2 / §12 との親子・冪等・データフロー突合"
  - "item_テーブル定義書 §8.2 / §13（popularityBadge JOIN）・external_genre テーブル定義書 §8.2 との参照整合"
  - "バッチ設計方針書 §11.5・§12.3・外部商品データ連携設計書・インターフェース一覧 IF-DB-BATCH-008 との整合"
  - "item_image / item_review_summary と同型の出所列方針（source / source_api 不採用）の明記"
  - "先行 merge 済み Item 系テーブル定義書の章構成を踏襲"
  - "Task / Review Definition の整備"

out_of_scope:
  - "ranking_snapshot テーブル定義書の再作成（#496 merge 済み）"
  - "item / external_genre / staging_ranking_signal テーブル定義書"
  - "DDL・migration（Task ④⑤）"
  - "db/seeds ファイルの作成（Task ⑤）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

