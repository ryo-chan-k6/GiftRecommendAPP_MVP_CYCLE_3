background: |
  Phase2 子 Task ③ Batch R02 No.4。論理ER §9.2・テーブル一覧 §6 No.19。
  Object Storage 上の Raw JSON 本体（`raw_product_object`）への DB 側 Metadata 参照。`import_status` 状態管理対象。
  `fetch_cursor` → `api_call_log` → `raw_product_metadata` → `staging_*` の外部商品データ連携系中核テーブル。
  親 Epic Branch 最新（enum #440 merge 済み、item #495 merge 済み前提）を前提とする。
  推奨先行 Task #505（fetch_cursor）は未 merge でも、物理ER §9・論理ER §9.3・状態遷移設計書 §6.3 を正本として着手可能とする。
  Issue #506 / Branch `docs/task-506-raw-product-metadata-table-spec` で作業する。

objective: |
  `raw_product_metadata` の物理カラム・制約・Index・更新仕様を table-spec.md テンプレ準拠で定義する。
  `object_key` / `content_hash` と `raw_product_object`（Object Storage 正本）の 1 対 1 参照、`api_call_log` との produces 関係（LOGICAL FK）、`import_status` 状態遷移（状態遷移設計書 §6.3）を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の raw_product_metadata テーブル定義書作成"
  - "物理ER Raw/Metadata 系・論理ER §9.2 / §9.3・テーブル一覧 §6 No.19 との突合"
  - "状態遷移設計書 §6.3（import_status）・enum定義書 §6.7 raw_import_status との整合"
  - "外部商品データ連携設計書 §8（Object Storage Key / Raw Metadata 項目）との突合・差分整理"
  - "raw_product_object（Object Storage 正本・DB 非管理）との 1 対 1 参照方針の明記"
  - "api_call_log との 1:N produces 関係（LOGICAL FK）の整理（api_call_log 本体定義は別 Task へ委譲）"
  - "staging_item / staging_item_image / staging_ranking_signal / staging_genre への transforms_to 関係整理"
  - "IF-DB-BATCH-004（Raw Metadata 保存）・ログ・Observability 設計書との整合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "raw_product_object（Object Storage 正本・DB 非管理）のテーブル定義書"
  - "api_call_log テーブル定義書（別 Task 化予定。本 Task では関係整理のみ）"
  - "staging_* / product_diff_result 等の Staging 系テーブル定義書（Batch R03/R04）"
  - "fetch_cursor テーブル定義書（#505）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

