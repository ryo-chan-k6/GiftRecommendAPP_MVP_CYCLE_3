background: |
  Phase2 子 Task ③ Batch R06 No.5。論理ER §7.2・テーブル一覧 §3 No.6。
  ユーザーからの推薦 Feedback 正本。Online推薦系の最終テーブル。
  IF-DB-API-002（Feedback 保存）の DB 正本。
  親 Epic Branch 最新（recommendation_request #537 / PR #542、recommendation_run #543 / PR #548、recommendation_result #544 / PR #549 merge 済み前提）を前提とする。
  Issue #547 / Branch `docs/task-547-recommendation-feedback-table-spec` で作業する。

objective: |
  `recommendation_feedback` の物理カラム・制約・Index・`feedback_status` 状態方針を table-spec.md テンプレ準拠で定義する。
  Online推薦フロー（Request → Run → Result → Feedback）の Feedback 正本、`recommendation_result` / `recommendation_result_item` / `recommendation_reason` との receives 関係、API-PUB-004 Request Body → DB 列マッピングを明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の recommendation_feedback テーブル定義書作成"
  - "物理ER Online推薦系・§9 FK（receives）・§10 Index・§11 制約・§17 No.3 物理 FK 方針との突合"
  - "論理ER §3 / §7.2 Feedback 属性・§14.1 Request → Run → Result フローとの整合"
  - "テーブル一覧 §3 No.6・Online推薦系補足（Feedback 正本・api 保存）との整合"
  - "RecommendationFeedback定義書 §7〜§9 / §12.1 DB 項目・§13.2 重複時更新方針との整合"
  - "enum定義書 §6.3 feedback_status・§6.14 feedback_target_type・§6.26 feedback_type・§7 / §8 列マッピングとの整合"
  - "packages/code-definitions/state/recommendation_feedback_status.yaml との整合"
  - "packages/code-definitions/application/feedback_target_type.yaml との整合"
  - "packages/code-definitions/application/feedback_type.yaml の新規作成と enum定義書 §6.26 への反映"
  - "状態遷移設計書 §5.3 Recommendation Feedback 状態遷移との整合（API 冪等更新との差分明示）"
  - "recommendation_result_item / recommendation_reason テーブル定義書（#545 / #546 merge 済み）との receives 双方向整合"
  - "recommendation_result テーブル定義書（receives・recommendation_result_id 物理 FK ON）との双方向整合"
  - "recommendation_run / recommendation_request テーブル定義書（trace 用 denormalized 列方針）との整合"
  - "API-PUB-004（Path resultId・Request Body → DB 列・冪等更新キー）との整合"
  - "インターフェース一覧 IF-DB-API-002・処理構成定義書・処理フロー概要図との整合"
  - "正本定義表・リソース一覧・リソース責務定義表・ログ・Observability設計書（recommendation_feedback_id trace / Retention）との突合"
  - "認証・認可方針書（user_id なし・session_id 匿名 Feedback）との整合"
  - "エラーコード定義書（GRS-FDB-*）・error_log owner_type との整合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "recommendation_feedback_summary 集計テーブル（RecommendationFeedback定義書 §12.2。MVP 非必須）"
  - "feedback_analysis_result 等 Evaluation 系テーブル（物理ER §2 No.7。後続 Task）"
  - "recommendation_result / recommendation_result_item / recommendation_reason テーブル定義書の receives 双方向参照更新（§8.2 等。再作成は対象外）"
  - "user_semantic / user_feature / user_meaning テーブル定義書"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 / api-pub-004 OpenAPI Task へ委譲）"

