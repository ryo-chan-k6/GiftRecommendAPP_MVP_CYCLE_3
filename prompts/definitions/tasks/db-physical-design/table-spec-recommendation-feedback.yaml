review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: true

contract_gate:
  required: false

human_decision_points: []

human_review_decisions:
  - id: 1
    topic: "feedback_status 物理列"
    decision: "MVP 物理列あり。値は submitted / invalid / ignored。invalid は原則 INSERT しない（error_log 参照）"
  - id: 2
    topic: "user_id nullable 列"
    decision: "MVP 物理列なし。認証 Epic まで追加しない（認証・認可方針書）"
  - id: 3
    topic: "submitted_at 物理列名"
    decision: "論理ER submitted_at と同一意味。物理名は submitted_at を優先"
  - id: 4
    topic: "冪等更新（重複 Feedback）"
    decision: "session_id + 同一対象 + 同一 feedback_type の一致時は UPDATE 許容（API-PUB-004 §14 #406）。状態遷移設計書 §5.3.3 の『原則更新しない』は分析結果を Feedback 本体に書かない意味で整理"
  - id: 5
    topic: "recommendation_result_id FK"
    decision: "物理 FK ON（NOT NULL）。Path resultId の正本参照"
  - id: 6
    topic: "recommendation_result_item_id / recommendation_reason_id"
    decision: "nullable。feedback_target_type に応じた条件付き必須。物理 FK は LOGICAL（§17 No.3）"
  - id: 7
    topic: "recommendation_run_id / recommendation_request_id"
    decision: "MVP は denormalized trace 列として保持可（LOGICAL FK）。JOIN 省略・Observability 用"
  - id: 8
    topic: "feedback_rating 必須"
    decision: "MVP NOT NULL（1〜5）。API-PUB-004 §14 #406 確定"
  - id: 9
    topic: "feedback_text 最大長"
    decision: "500 文字（API-PUB-004 §14 #406 確定）。物理名は feedback_text（API comment マッピング）"
  - id: 10
    topic: "Online推薦コア Retention"
    decision: "MVP DELETE なし。暫定 365 日（≥ Result）。Phase2 ⑥ で一括確定"
  - id: 11
    topic: "feedback_type 正本"
    decision: "feedback_type.yaml + enum定義書 §6.26 を正本。DDL CHECK は enabled 値"
  - id: 12
    topic: "anonymous_user_id MVP"
    decision: "物理列は nullable で保持。MVP は api が書き込まず常に NULL。識別は session_id のみ"

