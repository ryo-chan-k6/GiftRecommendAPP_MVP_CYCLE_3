background: |
  Phase2 子 Task ③ Batch R05 No.4。論理ER §13.2・テーブル一覧 §6 No.58。
  Batch / Online 横断のエラーログ正本。api / reco / batch / 外部 API / DB / Storage で発生したエラーを polymorphic owner（owner_type / owner_id）で記録する。
  IF-OBS-002（Error Log 記録）・IF-DB-API-008 / IF-DB-RECO-009 の DB 正本。
  親 Epic Branch 最新（item_import_summary #533 / PR #538、api_call_log #527 / PR #532 merge 済み前提）を前提とする。
  batch_run_log（#534）/ phase_log（#535）は同 Batch 先行 Task。merge 済みであればテーブル定義書を正本入力とし、未 merge 時は論理ER / 物理ER / ログ・Observability設計書を参照する。
  Issue #536 / Branch `docs/task-536-error-log-table-spec` で作業する。

objective: |
  `error_log` の物理カラム・制約・Index・保持方針を table-spec.md テンプレ準拠で定義する。
  `batch_run_log` / `phase_log` / `recommendation_run` との polymorphic owner 関係、error_code / severity / retryable / trace_id 方針、マスキング・Retention を明記し、後続 DDL Task が migration を作成できる粒度まで確定する。

scope:
  - "table-spec.md テンプレ準拠の error_log テーブル定義書作成"
  - "物理ER Log系・batch_run_log / recommendation_run may_have 関係・§10 idx_error_log_owner との突合"
  - "論理ER §13.2 Log系エンティティ属性・§14 主要リレーションとの整合"
  - "テーブル一覧 §6 No.58 Error Log・Log / Observability 系補足との整合"
  - "ログ・Observability設計書 §9 Error Log設計（主要項目・owner_type候補・記録対象）・§20.2 Retention 90〜180日との整合"
  - "enum定義書 §6.15 owner_type（polymorphic）・§10.2 error_code 正本分担との整合"
  - "エラーコード定義書・packages/code-definitions/error との error_code 形式 CHECK 方針"
  - "状態遷移設計書 §5 Log系整理（error_log は状態カラムなし）との整合"
  - "バッチ設計方針書 Error Handler / error_log 記録方針・GRS-BAT-* / GRS-EXT-* / GRS-RAW-* との整合"
  - "インターフェース一覧 IF-OBS-002 / IF-DB-API-008 / IF-DB-RECO-009 との整合"
  - "正本定義表・リソース一覧・リソース責務定義表・処理構成定義書との整合"
  - "batch_run_log_テーブル定義書 / phase_log_テーブル定義書（#534 / #535 merge 済み時）との双方向整合"
  - "api_call_log_テーブル定義書（owner_type=api_call 時の owner_id 整合）との突合"
  - "item_import_summary_テーブル定義書（Log 系章構成・FK 方針参考）との突合"
  - "Task / Review Definition の整備"

out_of_scope:
  - "batch_run_log / phase_log テーブル定義書の再作成（#534 / #535 別 Task）"
  - "api_call_log / item_import_summary テーブル定義書の再作成（merge 済みを参照のみ）"
  - "recommendation_run / recommendation_request 等 Online 系テーブル定義書"
  - "error_code 全件の packages YAML 正本化（Phase4a へ委譲）"
  - "DDL・migration / seed"
  - "apps/** 実装"
  - "OpenAPI / generated 変更（#469 へ委譲）"

