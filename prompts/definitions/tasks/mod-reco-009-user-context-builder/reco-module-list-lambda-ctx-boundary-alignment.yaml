background: |
  Issue #830（MOD-RECO-008 モジュール仕様書）および Issue #838（MOD-RECO-009 モジュール仕様書）の Human 判断により、`lambda_ctx`（`λ_ctx`）算出・`user_meaning` INSERT 主体は **MOD-RECO-009**、Social / Symbolic 射影のみは **MOD-RECO-008** と確定した（`user_meaning_テーブル定義書` §5.4 をモジュール境界の正本とする）。
  一方、`docs/05_アプリケーション設計/アプリ/reco/Recoモジュール一覧.md` の §4 / §5.2 / §6.7 / §8.1 等では、依然として `MOD-RECO-008` が `λ_ctx` を算出する記載が残っており、確定モジュール仕様書と矛盾する。
  MOD-RECO-009 モジュール仕様書 §16 未決事項 No.2 および §19 備考で、本 Task（Issue #839）への切り出しが明示されている。

objective: |
  Recoモジュール一覧を、確定済み `lambda_ctx` モジュール境界（`008` = 射影のみ、`009` = `lambda_ctx` 算出・`user_meaning` INSERT・User Context 生成）と矛盾しない状態に更新する。
  併せて MOD-RECO-009 モジュール仕様書の §16 未決事項 No.2 を解消し、docs 間の参照を一貫させる。

scope:
  - "Recoモジュール一覧 §4 一覧表の `MOD-RECO-008` / `MOD-RECO-009` 主責務・入出力文言を修正する"
  - "Recoモジュール一覧 §5.2 処理順序表の `MOD-RECO-008` 出力から `λ_ctx` を除去し、`MOD-RECO-009` の入出力に `lambda_ctx` / `user_meaning` 完成を反映する"
  - "Recoモジュール一覧 §6.7 User Meaning射影から `λ_ctx` 算出責務を除去する（出力は `user_social` / `user_symbolic` のみ）"
  - "Recoモジュール一覧 §6.8 User Context生成に `lambda_ctx` 算出・`user_meaning` INSERT（IF-DB-RECO-003）責務を追記する"
  - "Recoモジュール一覧 §8.1 Online推薦データフローで `λ_ctx` の算出タイミングを `MOD-RECO-009` に整合させる"
  - "MOD-RECO-009 モジュール仕様書 §16 未決事項 No.2 を解消する（確定済み論点へ移行または削除）"
  - "MOD-RECO-008 モジュール仕様書 §16.1 No.9 / §19 備考の「別 docs Task」参照を Issue #839 完了状態へ更新する"
  - "Review Definition（`prompts/definitions/reviews/mod-reco-009-user-context-builder/reco-module-list-lambda-ctx-boundary-alignment/pr-review.yaml`）を整備する"

out_of_scope:
  - "apps/reco の実装"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema / migration / DDL 変更"
  - "`lambda_ctx_rule` 物理スキーマ設計（MOD-RECO-009 仕様書 §16 未決 No.1）"
  - "コンテキスト境界定義書 UM-05 等、ドメイン正本の用語変更（別 Task 候補）"
  - "機能×モジュール対応表の変更（現状 `008` 出力に `λ_ctx` なしで整合済み。差分があれば報告のみ）"
  - "Orchestrator 実装・Wiring 変更"
  - "MOD-RECO-001 §8.2 ステップ表の変更（必要時は脚注のみ・本 Task では一覧中心）"

