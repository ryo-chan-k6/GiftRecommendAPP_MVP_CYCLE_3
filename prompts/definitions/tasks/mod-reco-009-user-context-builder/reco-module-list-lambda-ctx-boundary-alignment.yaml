background: |
  Issue #838（MOD-RECO-009 モジュール仕様書）の Human 判断により、λ_ctx 算出主体は MOD-RECO-009 と確定した。
  正本は user_meaning_テーブル定義書 §5.4 および MOD-RECO-008 §16.1 No.9 である。
  一方、Recoモジュール一覧 §4 / §5.2 / §6.7 / §8.1 には MOD-RECO-008 が λ_ctx を算出する旧記載が残っており、モジュール境界と矛盾する。

objective: |
  Recoモジュール一覧の λ_ctx 算出責務を MOD-RECO-009 へ移管し、MOD-RECO-008 の入出力記載から λ_ctx を除去する。
  必要に応じて MOD-RECO-001 §8.2 の脚注または論理 I/O 説明を整合させる。

scope:
  - "Recoモジュール一覧 §4 一覧表の MOD-RECO-008 / 009 主責務修正"
  - "Recoモジュール一覧 §5.2 処理順序表の 008 出力・009 入出力修正"
  - "Recoモジュール一覧 §6.7 MOD-RECO-008 から λ_ctx 算出責務削除"
  - "Recoモジュール一覧 §6.8 MOD-RECO-009 に lambda_ctx 算出責務追加"
  - "Recoモジュール一覧 §8.1 データフロー図の λ_ctx 位置修正"
  - "MOD-RECO-001 §8.2 ステップ表の λ_ctx 論理 I/O 脚注（必要時）"

out_of_scope:
  - "各 MOD-RECO-* モジュール仕様書本文の変更（008 / 009 は確定済み）"
  - "user_meaning_テーブル定義書の変更"
  - "OpenAPI / generated 変更"
  - "apps 実装変更"
  - "DB migration / DDL 変更"

