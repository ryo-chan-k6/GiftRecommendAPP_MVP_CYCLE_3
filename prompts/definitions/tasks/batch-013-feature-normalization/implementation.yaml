schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-013-feature-normalization-implementation"
  title: "BATCH-013:Feature正規化Batch実装"
  summary: "BATCH-013 を scaffold-first 実装する。IF-SHARED-003 in-process 呼出（sigmoid）、IF-DB-BATCH-014 の normalized UPDATE + item_meaning UPSERT、独立 workflow を対象とする。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]BATCH-013:Feature正規化Batch"
  epic_issue_number: 1455
  epic_branch: "feature/epic-1455-batch-013-feature-normalization"
  related_issues:
    - number: 1456
      purpose: "仕様書（CLOSED）"
  related_prs:
    - number: 1458
      purpose: "仕様書 PR（MERGED）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

