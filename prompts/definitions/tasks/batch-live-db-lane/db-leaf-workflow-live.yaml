    - "Environment/Secrets方針が正本と一致するか（stg + STG_DATABASE_URL）"
    - "UUID / Run ID分離が崩れていないか"
    - "schedule有効化・production Secrets変更を含まないか"
    - "stg手動検証結果または未実施理由があるか"
    - "secret実値が含まれていないか"
    - "CI/CD（workflow）差分がscope内か"
    - "Related to / PR target = 親Epic Branch"

human_decision_points:
  - "親Epic #1750 が open（Doneでない）でも本Taskを開始してよい理由: 本Taskは親Epicの中核子作業そのものであり、親の完了を待たず子Taskを進めるのが正式フローである。dependencies.blocking=false。統括#1745はformal parentではなく追跡のみ。"
  - "meaning連鎖を一括liveするか段階liveか（010/015 scaffold維持前提）。段階が必要なら staged_execution に従い別Issueは増やさない"
  - "stg実データ量・max_items・破壊的書込の許容範囲"
  - "stg Environment の required reviewers 運用負荷の許容"
  - "distribution-metrics（016）末尾と既live 017の接続方針"

stop_conditions:
