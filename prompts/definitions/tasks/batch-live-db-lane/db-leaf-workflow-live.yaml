    path: null

deliverables:
  - "葉009/011〜014/016のstg live化（scaffold解除）"
  - "meaning複合経路のDB葉整合（010/015 scaffold維持可）"
  - "既live 005〜008/017の回帰確認記録"
  - "stg手動検証結果docs（secretなし）"
  - "Task / Review Definition"

acceptance_criteria:
  - "葉009/011/012/013/014/016がenvironment: stg + STG_DATABASE_URL経路でscaffold-demoなし"
  - "job_run_idがUUID方針と整合し、複合経路のpipeline IDと分離されている"
  - "meaning複合が010/015 scaffold維持でも破綻しない"
  - "005〜008/017の意図しない破壊変更が無い（回帰確認記録あり）"
  - "stg手動検証結果docsがあり、run URL・conclusion・secretなしを満たす（または未実施理由が明示）"
  - "001〜004楽天live / 010/015 AI live / schedule / 018/019 / production Secrets変更 / DDL破壊が混入していない"
  - "generated / OpenAPI差分が無い"
  - "Related to（Closes禁止）/ PR target = 親Epic Branch"
  - "Review DefinitionがPR headに含まれる"

