  title: "reco-stg-latency-region-migration:Supabase stg東京リージョン移行と手順書更新"
  summary: "Supabase stg を Fly（NRT）と同一リージョンの東京（ap-northeast-1）へ再作成し、migration / master seed を再投入する。移行手順を簡易stg構築手順へ反映する。"
  phase: "07_開発・単体テスト"

work_mode: "human-led"

parent:
  epic_id: "epic-reco-stg-latency"
  epic_issue: "[Epic]reco-stg-latency:Reco stgレイテンシ改善"
  epic_issue_number: 1747
  epic_branch: "fix/epic-1747-reco-stg-latency"
  related_issues:
    - 1747
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  Reco 推薦実行が GRS-REC-101 / HTTP 504 になる主因は、Supabase stg
  （ap-southeast-1 / シンガポール）と Fly（NRT / 東京）のリージョン差による
  クエリ往復レイテンシ。config_resolved duration_ms 2,786ms ÷ 13 SELECT で
  1 クエリ約 214ms。health（SELECT 1 相当）約 0.27s とも整合する。

  Supabase はプロジェクト作成後のリージョン変更ができないため、
  東京リージョンで新規プロジェクトを作り直し、migration / master seed を
  再投入する。DATABASE_URL を Render / Fly（必要なら GitHub Secrets）で差し替える。

objective: |
  Supabase stg を東京（ap-northeast-1）へ移行し、Reco / API から同一リージョンの
  DB へ接続できる状態にする。移行手順を簡易stg構築手順へ反映する。

scope:
  - "Supabase stg プロジェクトを東京リージョンで新規作成する"
  - "既存の migration を新プロジェクトへ適用する"
  - "master seed を再投入する"
  - "DATABASE_URL を Render / Fly（必要なら GitHub Secrets）へ差し替える"
  - "旧 stg プロジェクトの扱い（廃止/停止）を決めて実施する"
  - "移行手順を簡易stg構築手順へ反映する"

out_of_scope:
  - "prod 環境のリージョン設計・移行"
  - "DB スキーマ・migration 内容の変更"
  - "推薦ロジック・コード変更"
  - "apps/api / apps/reco のソース変更"
  - "secret 実値の docs / Issue / PR への記載"

input:
  files:
    - path: "infra/render/README.md"
      required: true
      purpose: "API（Render）env の DATABASE_URL 差し替え先"
    - path: "infra/fly/README.md"
      required: true
      purpose: "Reco（Fly）secret の DATABASE_URL 差し替え先"
  docs:
    - path: "docs/15_運用・改善/運用手順/簡易stg構築手順.md"
      required: true
      purpose: "更新対象の正本"
    - path: "docs/14_リリース/デプロイ設定/デプロイ設定書.md"
      required: true
      purpose: "プロバイダ・リージョン方針"

output:
  files:
    - path: "docs/15_運用・改善/運用手順/簡易stg構築手順.md"
      action: "update"
      required: true
  docs:
    - path: "docs/15_運用・改善/運用手順/簡易stg構築手順.md"
      action: "update"
      required: true
      template: null
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"

deliverables:
  - "東京リージョンの Supabase stg（migration / seed 済み）"
  - "差し替え済み DATABASE_URL（Render / Fly）"
  - "更新した簡易stg構築手順"

acceptance_criteria:
  - "Supabase stg が東京（ap-northeast-1）で稼働している"
  - "Reco health が 200 を返し、応答が従来より短縮している"
  - "簡易stg構築手順に東京リージョン前提と移行手順が反映されている"
  - "secret 実値が docs / Issue / PR に含まれない"
  - "Related to #<Task Issue番号>、PR target が親 Epic Branch"

