background: |
  Reco 推薦実行が GRS-REC-101 / HTTP 504 になる主因は、Supabase stg
  （ap-southeast-1 / シンガポール）と Fly（NRT / 東京）のリージョン差による
  クエリ往復レイテンシ。config_resolved duration_ms 2,786ms ÷ 13 SELECT で
  1 クエリ約 214ms。health（SELECT 1 相当）約 0.27s とも整合する。

  Supabase はプロジェクト作成後のリージョン変更ができないため、
  東京リージョンで新規プロジェクトを作り直し、migration / master seed を
  再投入する。DATABASE_URL を Render / Fly（必要なら GitHub Secrets）で差し替える。

  進捗（2026-07-31 時点の事実）:
  インフラ移行 P1〜P8 は Human により実施済み。残作業は P9（手順書反映）のみ。

  移行後の stg 実測:
  - config_resolved duration_ms: 2,786ms → 約 253ms
  - 推薦実行: HTTP 504 / GRS-REC-101 → 完走（パイプライン約 1.0s）

  なお移行により MOD-RECO-005 の scaffold 起因の GRS-REC-005 が露出したが、
  これは Epic #1753 で解消済みであり本 Task の scope 外である。

objective: |
  Supabase stg を東京（ap-northeast-1）へ移行し、Reco / API から同一リージョンの
  DB へ接続できる状態にする。移行手順を簡易stg構築手順へ反映する。

scope:
  - "Supabase stg プロジェクトを東京リージョンで新規作成する"
  - "既存の migration を新プロジェクトへ適用する"
  - "master seed を再投入する"
  - "DATABASE_URL を Render / Fly（必要なら GitHub Secrets）へ差し替える"
  - "旧 stg プロジェクトの扱い（廃止/停止）を決めて実施する"
  - "移行手順を簡易stg構築手順へ反映する"

out_of_scope:
  - "prod 環境のリージョン設計・移行"
  - "DB スキーマ・migration 内容の変更"
  - "推薦ロジック・コード変更"
  - "apps/api / apps/reco のソース変更"
  - "secret 実値の docs / Issue / PR への記載"

