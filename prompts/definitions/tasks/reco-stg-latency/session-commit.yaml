    - "autocommit / read-only 設定が書き込み経路に影響していないか"
    - "例外時の接続返却と DatabaseError ラップが維持されているか"
    - "DatabaseSession Protocol の互換が保たれているか"
    - "secret 実値がないか"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true

human_decision_points:
  - "autocommit 化 と read-only トランザクションのどちらを採るか"

notes:
  - "B（本 Task）と C（config キャッシュ）は Human 決定により別 Task"
  - "リージョン差が 504 の主因のため、本 Task 単独では 504 を解消しない補助改善"

operation_logging:
  level: "standard"
  ai_logs:
    cross_cutting: false
  reason: "Reco 内部の DB トランザクション方式変更。通常の Issue / PR で管理する"

stop_conditions:
