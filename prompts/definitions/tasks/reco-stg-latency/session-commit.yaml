    - "integration test（実 DB 接続）"
  skip_reason:
    "stg 実測での hard timeout 内完走": "リージョン移行 Task 完了後に Epic として確認する"
    "integration test（実 DB 接続）": "stg / local DB の準備が前提のため別途"

