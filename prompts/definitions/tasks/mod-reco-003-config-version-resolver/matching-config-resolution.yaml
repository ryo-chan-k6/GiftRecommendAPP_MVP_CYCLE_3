background: |
  親 Epic #778 は Done（develop merge 済み）。前提 Task #906（matching_config テーブル + seed + Run 列）は PR #910 で develop merge 済み。
  現行 MOD-RECO-003 実装は semantic_config_version_id / model_versions.* / ranking_config_id を解決するが matching_config は未解決。
  MOD-RECO-015 は config_versions から Social / Symbolic Feature 重みを参照する（§8.3.2）。
  Human 判断（2026-07-02）: Matching パラメータ正本は matching_config（案 B）。本 Task は Resolver が is_current = true の matching_config を解決し config_versions へ渡す。

objective: |
  1. MOD-RECO-003 モジュール仕様書を更新し、matching_config_id 解決と parameter_json 重みの config_versions への引き渡しを定義する。
  2. apps/reco/src/reco/application/config-version-resolver/** を更新し matching_config を解決する。
  3. ResolvedConfigVersions / execution_context.config_versions に matching_config_id および Matching 重みを追加する。
  4. MOD-RECO-002 Recommendation Run Recorder が recommendation_run.matching_config_id を記録できるよう必要最小限の追随を行う。

scope:
  - "docs/06_実装設計/reco/MOD-RECO-003_Config Version Resolverモジュール仕様書.md 更新（matching_config_id / 重み解決・§8 系フロー・失敗時エラー・案 B 責務分担）"
  - "apps/reco/src/reco/application/config-version-resolver/models.py 更新（ResolvedConfigVersions.matching_config_id 等）"
  - "apps/reco/src/reco/application/config-version-resolver/resolver.py 更新"
  - "apps/reco/src/reco/application/config-version-resolver/in_memory_repository.py 更新（テスト用 default）"
  - "DB repository（存在する場合）への matching_config SELECT 追加"
  - "apps/reco/src/reco/application/recommendation-run-recorder/** の matching_config_id 記録追随（#906 DDL 前提・必要最小限）"
  - "apps/reco/src/reco/infrastructure/db/repositories/recommendation_run_repository.py 更新（必要最小限）"
  - "Orchestrator 統合テストの追随（存在する場合）"
  - "config-version-resolver unit test 更新（matching_config 解決成功 / 失敗）"
  - "run recorder smoke（matching_config_id 記録）"
  - "Task / Review Definition の整備（本ファイルおよび pr-review.yaml）"

out_of_scope:
  - "DB DDL / seed / テーブル定義書（#906）"
  - "MOD-RECO-014 / MOD-RECO-015 本体実装"
  - "MOD-RECO-016 Context Scorer 実装（docs に parameter_json 参照設計の予告は可）"
  - "OpenAPI / generated 変更"
  - "網羅的 unit-test Task 相当のテスト追加"

