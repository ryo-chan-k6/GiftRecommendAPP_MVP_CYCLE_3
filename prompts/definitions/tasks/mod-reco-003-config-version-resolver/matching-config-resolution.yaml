  summary: "Human 判断（案 B）に基づき、MOD-RECO-003 が Run 開始時に matching_config を解決し execution_context.config_versions へ Social / Symbolic Feature 重みを渡す。仕様書更新・Resolver / Run Recorder 追随・最小テストを行う。"
  phase: "07_開発・単体テスト"

work_mode: "ai-agent"

