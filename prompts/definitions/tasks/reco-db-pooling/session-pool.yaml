    test: true
    contract: false
    security: true

human_decision_points:
  - "本番運用に向けた性能要件の再確認を別途行うか（本 Task では未確定）"

notes:
  - "health.py が独自に PostgresDatabaseSession を生成している点に注意 → 本 Task で app.state.database_session 共有に変更"
  - "apps/reco の依存は psycopg[binary]>=3.2.0。psycopg-pool は別パッケージとして追加する"
  - |
    Human 決定（2026-07-30 / #1737・#1738）:
    - ライブラリ: psycopg_pool.ConnectionPool
    - ライフサイクル: PostgresDatabaseSession がプール所有。open()/close()。lifespan で open/close
    - health: app.state.database_session 共有
    - プールサイズ: min_size=1, max_size=2（コード定数）
    - PIPELINE_*_TIMEOUT_MS は変更しない
  - |
    Human 決定（2026-07-30 / PR #1741 AI Review 指摘対応・案A）:
    - タイムアウトも設定値化する
    - timeout（接続取得待ち）既定 2.0 秒。PIPELINE_HARD_TIMEOUT_MS = 4,000ms 内に収めるため psycopg_pool 既定の 30 秒から短縮
    - open_timeout（起動時ウォームアップ上限）既定 5.0 秒。DB 到達不能時に lifespan を止めない（open 失敗は握りつぶし、以降の query が DatabaseError になる）
    - いずれも PostgresDatabaseSession / create_database_session の引数で上書き可能。環境変数化は本 Task では行わない

stop_conditions:
  - "PIPELINE_HARD_TIMEOUT_MS の変更が必要と判断された場合"
  - "プール導入だけでは 4,000ms 以内に収まらないと判明した場合"
  - "DB スキーマ変更が必要になった場合"
  - "DatabaseSession Protocol の破壊的変更が必要になった場合"

