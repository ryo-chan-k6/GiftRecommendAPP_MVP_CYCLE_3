    - "プールサイズが Fly の 512MB / shared CPU 1 に対して過大でないか"
    - "DatabaseSession Protocol の互換が保たれているか"
    - "例外時に接続がプールへ返却されるか"
    - "DatabaseError へのラップが維持されているか"
    - "mask_database_url によるログのマスクが維持されているか"
    - "secret 実値がないか"
    - "Related to #1738、PR target が親 Epic Branch か"
