background: |
  apps/reco/src/reco/infrastructure/db/session.py の PostgresDatabaseSession は、
  query() / execute() の内部で毎回 psycopg.connect() している。
  コネクションプールがないため、DB アクセス 1 回ごとに TCP 接続・TLS ハンドシェイク・
  Postgres 認証が発生する。

  stg 実測:
  - Reco 401（DB probe に到達しない）: 約 0.07s
  - Reco health（SELECT 1）: 約 0.76s
  - API health（DB なし）: 約 0.17s
  - API masters/relationships（1 クエリ）: 約 1.10s
  - API masters/occasions（1 クエリ）: 約 1.26s

  DB アクセス 1 回あたり約 0.7〜1.1 秒。Orchestrator は 21 モジュールを順に実行し、
  その多くが DB を参照するため PIPELINE_HARD_TIMEOUT_MS = 4_000 を超過する。
  結果としてレコメンド実行が GRS-REC-101 / HTTP 504 で失敗し、
  phase_log（owner_type = recommendation_run）にも 1 行も記録されない。

  build_production_ports() では単一の session インスタンスを全リポジトリで共有しているため、
  PostgresDatabaseSession 内でプール化すれば全モジュールに効く。

objective: |
  PostgresDatabaseSession の DB アクセスをコネクションプール経由にし、
  2 回目以降の DB アクセスから接続確立コストを排除する。

scope:
  - "apps/reco/src/reco/infrastructure/db/session.py のプール導入"
  - "プールサイズ・タイムアウトの設定値化"
  - "プールのライフサイクル管理（生成・クローズ）"
  - "psycopg-pool の依存追加"
  - "DatabaseSession Protocol 互換の維持"
  - "unit test の追加・修正"
  - "Task Definition / Review Definition の配置"

out_of_scope:
  - "PIPELINE_SOFT_TIMEOUT_MS / PIPELINE_HARD_TIMEOUT_MS の値変更"
  - "apps/api 側の同種問題（masters で 1 クエリ約 1 秒）"
  - "Fly コールドスタート対策（min_machines_running / RECO_REQUEST_TIMEOUT_MS）"
  - "Supabase / Render / Fly のリージョン再配置"
  - "推薦ロジック・スコアリングの変更"
  - "個別リポジトリ実装（Postgres*Repository）の SQL 変更"
  - "DB スキーマ・migration の変更"
  - "secret 実値の取り扱い"

