  - "テスト用 fixture / mock（モジュール専用）"

out_of_scope:
  - "integration test / e2e test"
  - "Orchestrator 統合テスト（別 Task）"
  - "モジュール本体の機能追加（テスト成立に必要な最小修正のみ可）"
  - "OpenAPI / DB schema 変更"

input:
