      action: "create"
      required: true
    - path: "docs/90_PoC/計画/TV要件・実施方針/TV-009_Feature生成性能.md"
      action: "update"
      required: true
    - path: "docs/90_PoC/管理/TV進捗一覧.md"
      action: "update"
      required: true
  files:
