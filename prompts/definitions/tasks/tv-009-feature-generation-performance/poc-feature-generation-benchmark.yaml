  - "検証計画（最小）と結果 doc（性能フィジビリティ/）"
  - "計測スクリプト + README（apps 非改修・in-memory）"
  - "TV-009 方針・設計反映メモ（最小）"
  - "本 Task / Review Definition"

out_of_scope:
  - "TV-007 E2E 再実施"
  - "User Meaning 性能改善"
  - "apps/** 改修"
  - "apps/batch/** 改修・BATCH exclusive 奪取"
  - "BATCH-012 本番ジョブ全体の必須計測（未実施理由可）"
  - "production"
  - "正式設計独断更新"
  - "secret 実値"
  - "PR merge"

input:
