background: |
  Phase3 環境再計画（2026-06-18）により、従来の Phase3 を Phase3a（設計・正本化・完了）と
  Phase3b（開発環境構築・未着手）に分割する。Epic #436（environment-setup）は PR #584 で develop merge 済み。
  本 Task はプロセス正本（実装フェーズ実行プロセス設計書）へ分割・Task 表・依存関係を反映する。

objective: |
  実装フェーズ実行プロセス設計書を Phase3a/3b 分割後の計画に合わせて更新し、
  Phase3b Epic A / Epic C の Task 候補表と Phase4a 依存（Phase3b Epic A 完了）を明確化する。

scope:
  - "§4 段取り全体像: Phase3a / Phase3b 分割（Mermaid・説明表）"
  - "§5 各Phase詳細: Phase3a（完了）/ Phase3b（未着手）節への分割、Epic #436 完了注記"
  - "§6.4: 現行 5 Task を Phase3a に移し、Phase3b Epic A / C（Epic B defer）Task 表を追加"
  - "§6.5: Phase3（env）依存を Phase3b Epic A 完了に明確化"
  - "§7.2: Phase3b 並列方針の更新"
  - "§8.2: Phase3b ローカル dev 環境の Human 判断（確定済み）の追記・整理"
  - "本 Task 用 Task Definition / Review Definition の整備"

out_of_scope:
  - "Phase3b Epic A / Epic C の Epic Definition 作成"
  - "Phase3b Epic A / Epic C の個別 Task Definition 量産"
  - "ローカル開発手順書の Neon 削除（別 Task A3/A6）"
  - "Issue #132 の Close 操作"
  - "Epic A / Epic C の Issue 起票"
  - "apps/** / packages/** / db/** / openapi/** の変更"

