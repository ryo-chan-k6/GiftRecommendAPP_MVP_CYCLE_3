      required: true
      purpose: "更新対象の正本"
    - path: "ai-logs/human-decisions/2026-06-18-local-dev-redis-docker-compose-adoption.md"
      required: true
      purpose: "§8.2 Human 判断の根拠"
  files: []
  issues:
