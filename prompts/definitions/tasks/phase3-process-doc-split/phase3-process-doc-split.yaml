      action: "create"
      required: true
    - path: "prompts/definitions/reviews/phase3-process-doc-split/pr-review.yaml"
      action: "create"
      required: true

deliverables:
  - "実装フェーズ実行プロセス設計書の Phase3a/3b 分割更新"
  - "Phase3b Epic A / Epic C Task 候補表"
