background: |
  BATCH-001 は --genre-ids 起点＋直下 children のみ。全地図化には未同期 children を次 Run の --genre-ids に載せる段階実行が必要。
  weekly 親は 001 に加え 002 以降も回るため、キャンペーンでは葉 CLI または専用ラッパを使う。
  local_daily / local_weekly 親シェル本体は forbidden（定常cron非干渉）。

objective: |
  Human が Decision 枠内で安全に段階同期できる手順、または最小ラッパ（dry-run可）を提供する。

scope:
  - "BFS/段階同期の運用手順docs（次Run用 genre-ids の作り方、1 Run上限遵守、停止条件）"
  - "必要なら scripts/batch 配下の専用ラッパ最小実装（--dry-run可。weekly親を呼ばない）"
  - "葉 CLI（python -m batch.application.genre_sync）呼び出し例の正本化"
  - "定常cron・#1811/#1818 との時間分離・非干渉の注意書き"

out_of_scope:
  - "AIによる --live-rakuten 実行"
  - "local_daily_orchestrator.sh / local_weekly_orchestrator.sh の改修"
  - "定常crontab変更"
  - "商品収集大規模拡大"
  - "GHA schedule / #1607 / GHA楽天live"
  - "OpenAPI / generated / apps/web|api|reco"
  - "#1811 / #1818 の変更・完了操作"

