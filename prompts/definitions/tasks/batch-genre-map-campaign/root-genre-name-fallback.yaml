  Human live（genre-ids=0）で BATCH-001 が failed。error_log / api_call_log は GRS-EXT-103
 （invalid genre payload: missing nameJa/jaName/genreName）。genre_id=100005 等は過去 succeeded。
  楽天 root は名称が空になることがある。Decision の root 0 BFS を続行するには adapt 側フォールバックが必要。
  Epic allowed_paths に infrastructure/rakuten と tests を最小追加する（キャンペーンブロッカー解消）。

objective: |
  root genreId=0 で名称欠落時も adapt→upsert が進み、キャンペーン初回 Run が再開可能になる。

scope:
