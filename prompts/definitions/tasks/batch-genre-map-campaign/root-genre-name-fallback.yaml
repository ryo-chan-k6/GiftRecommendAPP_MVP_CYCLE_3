  - "unit test（空 nameJa / 欠落 / 非rootは従来どおり GRS-EXT-103）"
  - "Epic allowed_paths に adapter・該当 tests を最小追加"
  - "BFS手順docsへ root 名フォールバックの注意を最小追記"
  - "必要なら Review Definition 追加"

