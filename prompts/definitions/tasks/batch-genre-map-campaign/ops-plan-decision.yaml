      action: "create"
      required: true
    - path: "prompts/definitions/tasks/batch-genre-map-campaign/**"
      action: "update"
      required: false

deliverables:
  - "キャンペーン枠 Human Decision Log"
  - "正本docs同期（運用方針のキャンペーン節など）"

acceptance_criteria:
  - "Decision Log に起点・1 Run上限・停止条件・定常cron非干渉・QPS・Human live境界が明示されている"
  - "root 0 BFS 採否と 1 Run上限が Human 判断点として採択または未決明示されている"
  - "正本docsと矛盾しない"
  - "定常crontab変更・GHA楽天live・#1607・secret実値・#1811/#1818完了操作を含まない"

