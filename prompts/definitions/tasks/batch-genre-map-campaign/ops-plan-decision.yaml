commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  ジャンル地図キャンペーン着手ゲート。BATCH-001 は直下 children のみのため、全地図化は段階実行が前提。
  Phase1 定常cron（#1811）と混在させない。AIは運用枠を独断確定しない。

objective: |
  キャンペーン枠を Human Decision Log で明示し、楽天Fetch運用方針等の正本docsと矛盾なく同期する。
  特に root 0 BFS 採否と 1 Run genre 上限・停止条件を Human 判断点として残す／採択する。

scope:
  - "キャンペーン枠 Decision Log 作成（起点、1 Run上限、停止条件、定常cron非干渉、QPS、Human live境界）"
  - "推奨案の整理（root 0 BFS採択、1 Run上限=20件案、QPS=2維持）と Human 採択欄"
  - "楽天Fetch運用方針・必要最小の運用手順docs同期"
  - "後続 inventory / runner / collect-docs Task の着手ゲートを採択結果へ反映"

out_of_scope:
  - "external_genre 棚卸し実行本体（inventory Task）"
  - "BFSラッパ実装・live実行本体"
  - "定常crontab変更"
  - "AIによる --live-rakuten 実行"
  - "#1792 / #1607 / GHA楽天live"
  - "secret実値の表示・変更"
  - "apps/web|api|reco / OpenAPI / generated"
  - "#1811 / #1818 の Status・本文の完了操作"

input:
  docs:
    - path: "docs/15_運用・改善/運用手順/楽天Fetch運用方針.md"
      required: true
    - path: "docs/15_運用・改善/運用手順/local_cron_Phase1_crontab運用手順.md"
      required: true
    - path: "docs/06_実装設計/batch/BATCH-001_楽天ジャンル同期バッチ仕様書.md"
      required: true
    - path: "ai-logs/human-decisions/2026-07-31-rakuten-fetch-mvp-fetch-plan.md"
      required: true
    - path: "ai-logs/human-decisions/2026-07-30-rakuten-fetch-ops-policy.md"
      required: true
    - path: "prompts/definitions/epics/batch-genre-map-campaign/epic.yaml"
      required: true
  files: []

