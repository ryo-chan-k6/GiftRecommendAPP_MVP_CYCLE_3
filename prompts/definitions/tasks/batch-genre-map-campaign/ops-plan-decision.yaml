  title: "batch-genre-map-campaign:キャンペーン枠Human Decision Log化"
  summary: "ジャンル地図キャンペーンの枠（起点=0、1 Run上限、停止条件、定常cron非干渉、QPS、Human live境界）を Human Decision Log 化し正本docsへ同期する。live実行・定常crontab変更は含まない。"
  workstream_key: "batch-genre-map-campaign"
  phase: "decision"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-genre-map-campaign:楽天ジャンル地図キャンペーン"
  epic_issue_number: 1827
  epic_branch: "chore/epic-1827-batch-genre-map-campaign"
