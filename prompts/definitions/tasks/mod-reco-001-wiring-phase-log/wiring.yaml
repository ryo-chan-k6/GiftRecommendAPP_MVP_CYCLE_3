background: |
  Epic 配下のフェーズ Wiring Task。MOD-RECO-028 §16.3 順序3 に従い、Orchestrator デフォルト composition の phase_log_writer を本実装へ差し替える。
  `build_default_phase_log_writer()`（InMemory PhaseLogRepository）を stubs.py から DI する。
  Orchestrator 本体（ports.py / orchestrator.py）は PhaseLogWriterPort 契約が既存のため変更しない（028 §16.1 No.7）。
  integration テスト期待値更新は integration-test Task へ委譲する。
  `stubs.py` は exclusive_files のため Epic 配下で直列実行する。

objective: |
  phase_log_writer Port を build_default_stub_ports() で PhaseLogWriter 本実装へ差し替える。
  デフォルト経路 integration テストの green 化は integration-test Task に委譲する。

scope:
  - "`apps/reco/src/reco/application/recommendation-orchestrator/stubs.py` の phase_log_writer Port 差し替え"
  - "`_ensure_phase_log_writer_package()` / `_build_default_orchestrator_phase_log_writer()` 等の factory 接続"
  - "phase-log-writer の `build_default_phase_log_writer` import と package 読み込み"

out_of_scope:
  - "MOD-RECO-028 モジュール本体の変更"
  - "`ports.py` / `orchestrator.py` の変更（Port 契約は既存）"
  - "`execution_context.py` の型付きフィールド追加"
  - "`test_recommendation_orchestrator.py` の期待値更新（integration-test Task）"
  - "024 / 029 エラー経路 / 025 Metric Logger 配線"
  - "他フェーズ Port の再配線"
  - "`StubPhaseLogWriter` クラスの削除"
  - "Orchestrator phase_name enum 整合（028 §16.3 順序5）"
  - "段階3 Composition（本番 DB Repository）"
  - "MOD-RECO-001 モジュール仕様書 §8.4.2 更新（Epic PR / 別 docs Task）"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / DB schema 変更"

