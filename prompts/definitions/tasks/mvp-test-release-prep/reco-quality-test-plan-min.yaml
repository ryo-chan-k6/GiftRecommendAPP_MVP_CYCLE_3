schema_version: "1.0"
definition_type: "task"

task:
  id: "task-mvp-test-release-prep-reco-quality-test-plan-min"
  title: "mvp-test-release-prep:レコメンド品質評価最小計画"
  summary: "docs/12 に固定評価ケース方針・開始条件・重大破綻の定義を持つ最小計画を置く。本実施は out of scope。"
  phase: "12_レコメンド品質評価テスト"

work_mode: "ai-agent"

parent:
  epic_id: "epic-mvp-test-release-prep"
  epic_issue: "[Epic]mvp-test-release-prep:テスト・リリース移行準備"
  epic_issue_number: 1646
  epic_branch: "docs/epic-1646-mvp-test-release-prep"
  related_issues:
    - 1661
    - 1658
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  §12.2「品質: 固定評価ケースで重大な推薦破綻がない」を判定するには docs/12 の計画が必要。現状 README のみ。
  受入環境方針は固定＝Layer2、多様人手＝簡易 stg。システムテスト最小計画を開始条件参照とする。

objective: |
  レコメンド品質評価の最小計画を正本化し、リリース判定の品質行を埋められる状態にする。

scope:
  - "固定評価ケースの方針（件数・観点は Human 確認欄付き）"
  - "重大な推薦破綻の定義草案"
  - "開始/終了条件"
  - "Layer2（固定・自動）と簡易 stg（多様人手）の役割"
  - "証跡パス（docs/12）"

out_of_scope:
  - "評価ケースの全量作成・実行"
  - "Offline evaluation Batch の本実装変更"
  - "λ_ctx 等のアルゴリズム変更"
  - "apps/reco 実装"
  - "stg インフラ実構築"

input:
  docs:
    - path: "docs/05_アプリケーション設計/テスト/全体テスト計画書.md"
      required: true
      purpose: "品質評価・§12.2"
    - path: "docs/13_受入テスト/テスト計画/受入環境方針.md"
      required: true
      purpose: "固定／多様の環境分担"
    - path: "docs/10_システムテスト/テスト計画/システムテスト計画書.md"
      required: true
      purpose: "開始条件参照"
    - path: "docs/12_レコメンド品質評価テスト/README.md"
      required: true
      purpose: "配置ルール"

output:
  docs:
    - path: "docs/12_レコメンド品質評価テスト/テスト計画/レコメンド品質評価テスト計画書.md"
      action: "create"
      required: true
    - path: "docs/12_レコメンド品質評価テスト/README.md"
      action: "update"
      required: true
  files: []
  generated:
    expected: false
    paths: []
    handling: "none"

deliverables:
  - "レコメンド品質評価テスト計画書.md（最小）"
  - "docs/12 README への正本リンク"

acceptance_criteria:
  - "固定評価ケース方針と重大破綻定義草案がある"
  - "Human 未確定項目が明示されている"
  - "Layer2／簡易 stg の役割が受入環境方針と整合"
  - "証跡パスが docs/12 配下"
  - "secret 実値なし"
  - "PR target が親 Epic Branch"

branch:
  no_branch: false
  summary: "reco-quality-test-plan-min"
  base: "docs/epic-1646-mvp-test-release-prep"
  target: "docs/epic-1646-mvp-test-release-prep"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "12_レコメンド品質評価テスト"
    status: "Todo"
    priority: "high"
    planned_start: null
    due_date: null

issue:
  number: 1661
  unit: "task"
  type: "docs"
  area: "reco"

dependencies:
  epics:
    - id: "epic-mvp-test-release-prep"
      purpose: "親 Epic"
  blocking: false

parallel_control:
  exclusive_files:
    - "docs/12_レコメンド品質評価テスト/テスト計画/レコメンド品質評価テスト計画書.md"
  conflict_risk: "low"
  contract_impact: false
  generated_impact: false
  db_impact: false

test_policy:
  required:
    - "secret check"
  not_required:
    - "unit test"
  skip_reason:
    "unit test": "計画 docs のみ"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "ドメイン用語（Gift Meaning 等）の揺れがないか"
    - "重大破綻を AI が独断確定していないか"
    - "受入環境方針の固定／多様分担と矛盾していないか"
  specialist_reviews:
    docs: true
    test: true

human_decision_points:
  - "固定評価ケース数・合格ライン"
  - "重大な推薦破綻の最終定義"
  - "多様人手レビューを MVP リリース判定の必須にするか"

notes:
  - "Must #5（後半）。Issue #1661 / Branch docs/task-1661-reco-quality-test-plan-min"
