  全体テスト計画書の受入は staging 前提の記述がある一方、MVP では stg 任意・Layer3 defer の記載もある。
  未確定のまま受入開始すると環境・証跡・合否がぶれる。

objective: |
  受入環境方針を1文書に固定し、後続の受入計画・リリース判定の前提にする。
  2026-07-26 Human 確定（簡易 stg 必須）を docs 正本へ反映する。

scope:
