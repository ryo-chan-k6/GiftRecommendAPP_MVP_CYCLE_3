  - "区分（public / secret / local-only / ci）"
  - "GHA Secrets 名との対応（値なし）"
  - "プレースホルダ（未作成）環境変数定義書.md の置換または削除方針の実施"
  - "#127 との Related to 紐付け"

out_of_scope:
  - ".env.example の大規模更新（必要最小の変数名追記のみ可。実値禁止）"
  - "GitHub Secrets 実値の登録"
  - "infra 本番構築"
  - "apps/** の挙動変更"

