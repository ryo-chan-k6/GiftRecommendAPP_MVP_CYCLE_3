  Issue #127 は OPEN のまま。Epic #436 environment-setup は CLOSED だが、
  docs 上は「（未作成）環境変数定義書.md」プレースホルダが残る。
  E3・受入・リリースで Secrets 名の正本が無いと詰まる。

objective: |
  環境変数定義書を正本として作成し、.env.example / GHA Secrets 名と突合可能な一覧にする。
  実値・token・key は一切書かない。

scope:
