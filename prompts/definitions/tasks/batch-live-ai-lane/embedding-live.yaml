background: |
  親Epic #1768（batch-live-ai-lane）。#1750（DB liveレーン）は BATCH-015 AI live を out of scope とし、
  本レーンへ分離した。#1772 の CurrentVersionResolver と BATCH-015 配線は #1750 Branch へ merge 済みだが
  develop 未反映。本 Task Branch は #1768 Epic Branch 起点（develop起点のEpicを維持）。
  既存完了: #1610 Embedding HTTP client、#1710 api_call_log、#1566 TV-005疎通。
  Human確定（2026-07-31）: Issue化・Branch作成は #1750 未mergeでも可。実装（/work-issue）は
  #1750 develop merge後、develop→Epic→Task 取り込み完了まで禁止。

objective: |
  BATCH-015 の GHA を stg live 経路へ切り替え、明示 `--live-embedding` 時のみ実 Embedding API を呼ぶ。
  既定 off / scaffold 安全性を維持し、unit test・YAML検証・secret check・stg 1件手動検証と結果docsを残す。

scope:
  - "`.github/workflows/batch-item-embedding.yml` の stg live化（environment: stg、STG_DATABASE_URL、OPENAI_API_KEY secret参照、UUID job_run_id）"
  - "明示live時だけ `--live-embedding` / 既定off・scaffold安全性維持"
  - "current embedding model_version_id resolver（#1772依存・#1750 develop merge後に利用）"
  - "api_call_log DB記録（既存 #1710 経路）"
  - "unit test / workflow YAML検証 / secret check"
  - "stg 1件 manual live検証（workflow_dispatch、max_items=1、queue_batch_size=1、目安コスト上限 $0.01/run）と結果docs"
  - "必要なら meaning/retry 複合側へ明示live入力を安全に伝播（既定false維持）"
  - "Task / Review Definition の維持"

out_of_scope:
  - "BATCH-010 実LLM live"
  - "production、schedule、Secret値の作成・変更・表示"
  - "DDL / migration、OpenAPI / generated、apps/web|api|reco"
  - "大量実行、rate-limit試験"
  - "#1750 merge操作"
  - "親Epic→develop PR / merge判断"
  - "#1750 未mergeまたは develop 未取り込み状態での /work-issue・実装・stg実API呼出"

staged_execution: |
  単一Task/1PR。#1750 develop merge前は実装フェーズに入らない。
  Phase 0（本セットアップで完了可）: Issue化・Task Branch作成・Definition反映。/work-issue禁止をIssue本文に明記。
  Phase A（#1750 develop merge + develop→Epic→Task取り込み後のみ）: 現状調査（葉workflow・CLI live flag・resolver・api_call_log）
  Phase B: GHA live配線・安全ガード（明示live / 既定off）
  Phase C: resolver / api_call_log 整合・unit test / YAML検証 / secret check
  Phase D: 複合 meaning/retry への明示live伝播（必要時・既定false）
  Phase E: stg 1件 manual live検証 + 結果docs
  途中でPR分割が必要に見えた場合は Human 確認へ回し、勝手に別Task Issueは作成しない。

