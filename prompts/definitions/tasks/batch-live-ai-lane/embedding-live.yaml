  summary: "BATCH-015 GHA stg live化（明示liveのみ）、安全ガード、CurrentVersionResolver配線、api_call_log、unit test、stg 1件手動検証・結果docsを単一Task/1PRで実施。#1750 develop merge前は/work-issue禁止。"

