background: |
  親Epic batch-live-rakuten-fetch。先行Task（§10 Decision Log）完了が着手条件。
  HttpRakuten / Rate Limiter / CLI --live-rakuten は既存。不足はRun予算概念の実装、
  paused再開運用、深さ打ち切り誤用の防止、local検証記録。GHA楽天HTTPは既定禁止。

objective: |
  採択済みRun予算・再開方式・QPS=1適用範囲に沿い、BATCH-001〜004をlocal liveで
  安全に実行・再開できる。検証結果をsecretなしdocsへ残す。

scope:
  - "BATCH-003 Run予算（pages_per_run / cursors_per_run / wall-clock等。CLI/workflow名は実装時確定）と深さ打ち切りの分離"
  - "rate_limited → paused（page非進行）と Run予算到達後のcursor継続"
  - "BATCH-001〜004 local live の段階実行（smoke → 初期live → 通常継続の範囲でHuman採択値に従う）"
  - "BATCH-002 max_pages=1維持、BATCH-004件数は採択値"
  - "安全側QPS=1の採択範囲適用（常用QPS=2維持）"
  - "unit test（Run予算・paused/cursor）と local手動検証（低値）"
  - "検証結果docs・ギャップ一覧の必要最小更新"
  - "GHA葉は楽天scaffold維持が原則。workflow変更はCI楽天liveを入れない範囲の整合のみ"

out_of_scope:
  - "§10 Decision Log未整備での着手"
  - "GHA楽天HTTP live化（§10 No.7が条件付きGHA採択でも、#1607未充足なら停止してHuman確認）"
  - "#1607 本番egress設計・構築"
  - "schedule有効化"
  - "DB系 / AI系 live"
  - "常用QPS再改訂"
  - "secret実値の表示・commit"
  - "親Epic→develop PR / merge判断"
  - "OpenAPI / Orval / generated / apps/web|api|reco"

staged_execution: |
  Phase A: 先行Decision Logの採択値を読み、実装ノブ名を確定（docsの運用概念名とCLI差を明記）
  Phase B: 共通（Run予算到達・paused/page非進行・QPS=1条件）の実装とunit test
  Phase C: BATCH-001 / 002 local smoke（002は max_pages=1）
  Phase D: BATCH-003 Run予算付き継続（深さ打ち切りにしないこと）
  Phase E: BATCH-004 採択件数でのlocal smoke
  Phase F: 検証結果docs・ギャップ一覧更新
  途中でGHA楽天liveや#1607が必要に見えたら停止しHuman確認。勝手に別Issueは作らない。

