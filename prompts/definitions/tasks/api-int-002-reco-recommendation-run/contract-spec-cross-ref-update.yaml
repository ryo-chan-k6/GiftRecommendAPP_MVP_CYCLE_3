  - "同ファイル §15 関連資料の `上流 Public API` 行から「契約仕様書は未作成」を削除し、正本パスを記載"
  - "（推奨）§5.5 / §15 に API-PUB-002 実装仕様書（参照のみ）パスを追加"
  - "Task Definition / Review Definition の整備（本 Task）"

out_of_scope:
