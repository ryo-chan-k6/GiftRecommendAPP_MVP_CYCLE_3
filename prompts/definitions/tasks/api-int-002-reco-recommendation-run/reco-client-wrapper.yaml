task:
  id: "task-api-int-002-reco-recommendation-run-reco-client-wrapper"
  title: "API-INT-002:reco-client wrapper実装"
  summary: "Phase4a `ScaffoldRecoClient` を Orval 生成 reco-client（`apps/api/src/generated/reco-client/**`）経由の本実装に置換し、API-INT-002（POST /internal/reco/v1/recommendations/run）および API-INT-001 ヘルスチェックを apps/api から呼び出せる infrastructure 境界を提供する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]API-INT-002:Reco推薦実行"
  epic_issue_number: 366
  epic_branch: "feature/epic-366-api-int-002-reco-recommendation-run"
  related_issues:
    - 1103
    - 1107
    - 1097
  related_prs:
    - 1106
    - 1109
    - 1099

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
