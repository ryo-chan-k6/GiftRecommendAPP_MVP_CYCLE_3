    - "test-ai"
  review:
    - "reviewer-ai"
    - "contract-ai"

background: |
  Phase4b 縦串（実装仕様書 → OpenAPI Contract → reco エンドポイント実装 → 単体テスト）は完了し、Epic PR → develop 統合が進行中または完了する。
  OpenAPI Contract Task（#1097 / PR #1099）で `internal-reco-api.yaml` 更新と `apps/api/src/generated/reco-client/**` 再生成が完了している。
  現状 `apps/api/src/infrastructure/reco-client/` は Phase4a の `ScaffoldRecoClient`（HTTP 非呼び出しプレースホルダ）のみ。
  本 Task では generated client を利用した本番向け wrapper を実装し、API-PUB-002 実装 Task の api→reco 接続前提を整える。

objective: |
  `ScaffoldRecoClient` を維持しつつ、Orval 生成関数を内部利用する本番向け `RecoClient` 実装（またはファクトリ）を `apps/api/src/infrastructure/reco-client/**`（必要なら `apps/api/src/lib/reco-client/**`）に追加する。
  Internal API Key・trace Header・エラーマップ・タイムアウト方針を実装仕様書・契約仕様書に沿って提供する。

scope:
  - "`apps/api/src/infrastructure/reco-client/**` の本実装追加（generated 呼び出し・Header 付与・エラー変換）"
  - "必要最小の `apps/api/src/lib/reco-client/**` 追加（DI / ファクトリ・設定読み込み）"
  - "`ScaffoldRecoClient` のテスト互換維持または移行（既存 unit test の更新）"
  - "API-INT-001 health / API-INT-002 recommendations/run の wrapper 呼び出し"
  - "wrapper 単体テスト（`apps/api/tests/unit/infrastructure/reco-client/**`）"
  - "Task / Review Definition 整備"

out_of_scope:
  - "OpenAPI / packages/contracts 変更"
  - "generated（`apps/api/src/generated/reco-client/**`）の手動編集"
  - "apps/api Public API（API-PUB-002）エンドポイント実装"
  - "apps/reco エンドポイント層・推薦ロジック本体の変更"
  - "apps/web / apps/batch 変更"
  - "DB schema 変更"
  - "e2e / integration test（api→reco 実 HTTP は別 Task または API-PUB-002 結合時）"

