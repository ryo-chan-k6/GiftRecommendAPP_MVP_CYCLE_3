    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API契約仕様書.md"
      required: true
      purpose: "Request/Response・Header・Error"
    - path: "docs/05_アプリケーション設計/アプリ/api/API設計方針書.md"
