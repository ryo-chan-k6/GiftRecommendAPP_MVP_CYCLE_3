background: |
  06_実装設計において、apps/reco エンドポイント層実装・単体テストの前提となる **API実装仕様書（実装面）** を作成する。
  本Taskは API-INT-002（Reco推薦実行 / Internal API）を対象とし、確定済み契約仕様書（#368 / PR #372）を前提に、処理フロー・内部DTOマッピング・`build_production_ports` / `RecommendationOrchestrator` 接続・エラーマップ・trace 伝播・provider/consumer 実装影響・実装結合テスト観点を整理する。
  Provider は apps/reco のエンドポイント層（`apps/reco/src/reco/api/**`）、Consumer は apps/api（MOD-API-005 Reco Client 等）とする。
  MOD-RECO-001 Composition（#1076 / PR #1088 develop merge 済み）により `build_composition_ports` / `build_production_ports` / `CompositionMode.PRODUCTION` が利用可能である。
  契約面（Request / Response / Error / Validation の再掲）は `api-contract-spec.md` 準拠の別成果物（API-INT-002_Reco推薦実行API契約仕様書.md）を正とし、本Taskでは実装面のみを記載する。
  親 Epic Branch（feature/epic-366-api-int-002-reco-recommendation-run）には §14 spike（#374〜#376）の契約差分が先行している可能性がある。作業開始前に Epic Branch と develop の差分を確認し、契約仕様書参照先を整合させる。

objective: |
  API-INT-002（Reco推薦実行 / Internal API）について、reco エンドポイント実装 Task / 単体テスト Task が参照可能な粒度の **API実装仕様書（実装面のみ）** を作成する。
  成果物は prompts/templates/docs/api-implementation-spec.md に準拠し、契約面（`api-contract-spec.md`）の章は再掲しない。
  `build_production_ports()` 経由の Orchestrator 呼び出し、エラーマップ、trace_id 伝播、ログ・メトリクス書き込み境界を明記する。
  OpenAPI 正本パスおよび generated client 利用方針は実装影響として記載するが、本Taskでは当該ファイルを変更しない。

scope:
  - "API-INT-002（Reco推薦実行 / Internal API）のAPI実装仕様書を新規作成する（成果物ファイル名: API-INT-002_Reco推薦実行API実装仕様書.md）"
  - "前提契約（契約仕様書パス / Contract Gate 状態）を整理する"
  - "実装方針（FastAPI ハンドラ / DI / composition 接続）を整理する"
  - "処理フロー（Mermaid）と処理詳細を整理する（Request 受付 → Validation → Orchestrator 呼び出し → Response 組立）"
  - "Request / Response の内部DTOマッピングを整理する"
  - "generated client 利用方針（apps/api 側）を整理する（記載のみ）"
  - "provider（apps/reco エンドポイント層）/ consumer（apps/api）の実装影響を整理する"
  - "`build_composition_ports` / `build_production_ports` / `CompositionMode.PRODUCTION` との接続方針を整理する"
  - "エラーマップ（ドメイン例外 → HTTP / GRS コード）と trace 伝播を整理する"
  - "ログ・メトリクス・phase_log 書き込み境界（実装面）を整理する"
