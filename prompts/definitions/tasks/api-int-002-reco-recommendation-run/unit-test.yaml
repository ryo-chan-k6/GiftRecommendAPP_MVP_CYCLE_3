schema_version: "1.0"
definition_type: "task"

task:
  id: "task-api-int-002-reco-recommendation-run-unit-test"
  title: "API-INT-002:Reco推薦実行単体テスト"
  summary: "API-INT-002（Reco推薦実行 / Internal API）エンドポイント層（`apps/reco/src/reco/api/**`）に対し、契約仕様書 §12・実装仕様書 §10 の unit 観点を満たす pytest 単体テストを `apps/reco/tests/unit/api/**` に追加・拡充する（Phase4b 3/3）。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]API-INT-002:Reco推薦実行"
  epic_issue_number: 366
  epic_branch: "feature/epic-366-api-int-002-reco-recommendation-run"
  related_issues:
    - 1091
    - 1097
    - 1103
  related_prs:
    - 1094
    - 1099
    - 1106

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "test-ai"
  support:
    - "worker-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Phase4b 縦串（実装仕様書 → OpenAPI Contract → reco エンドポイント実装 → 単体テスト）の 3/3 である。
  実装 Task（#1103 / PR #1106）により `apps/reco/src/reco/api/**` と最小スモークテスト（`test_recommendations_run_smoke.py` 4 ケース）が親 Epic Branch に merge 済みである。
  実装 Task の `out_of_scope` として網羅的単体テストは本 Task に委譲されていた。
  本 Task では Orchestrator をスタブ差し替え（`dependency_overrides`）し、認証・Validation・Response マッピング・Error Mapper・debug 返却・`WarningItem[]` / trace meta を unit 範囲で検証する。

objective: |
  API-INT-002 エンドポイント層の単体テストを契約仕様書 §12（contract / unit 相当）および実装仕様書 §10 の unit 範囲に沿って整備し、pytest で再現可能な検証を提供する。
  既存 4 スモークテストを活かしつつ、不足観点（Validation・trace・warnings・resultItems マッピング・debug 返却・Error Mapper 網羅）を追加する。

scope:
  - "エンドポイント層単体テストの追加・拡充（`apps/reco/tests/unit/api/**`）"
  - "契約仕様書 §12 の unit 相当観点（auth / validation / trace / 0 件 / warnings / debug / Response 外形）のカバレッジ整理とテストケース追加"
  - "実装仕様書 §10 のうちスタブ Orchestrator で検証可能な観点の unit テスト追加"
  - "既存スモークテスト（`test_recommendations_run_smoke.py`）の維持・整理（fixture 共通化は過剰にしない）"
  - "テスト用 fixture / helper の整理（API 層テスト専用）"
  - "Task / Review Definition 整備（本ファイルおよび `prompts/definitions/reviews/api-int-002-reco-recommendation-run/unit-test/pr-review.yaml`）"
  - "親 Epic `epic_scope.allowed_paths` への `apps/reco/tests/unit/api/**` 追記（#1106 でのスモークテスト追加と整合）"

out_of_scope:
  - "integration test（Orchestrator PRODUCTION 実パイプライン・DB / LLM 障害シミュレーション）"
  - "e2e test / contract test（OpenAPI generated client typecheck）"
  - "OpenAPI / generated / packages/contracts 変更"
  - "apps/api reco-client wrapper 実装・変更"
  - "apps/reco/src/reco/application/** / domain 本体の機能追加（テスト成立に必要な最小修正のみ可。要 PR 説明）"
  - "エンドポイント層の機能追加（バグ修正のみ可）"
  - "本番 DB / 外部 API 依存テスト"

input:
  docs:
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API契約仕様書.md"
      required: true
      purpose: "§12 契約面テスト観点・Validation・Response schema の正本"
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API実装仕様書.md"
      required: true
      purpose: "§10 実装テスト観点・マッピング・認証・debug の正本"
    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: true
      purpose: "Internal API Key 方針"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
      purpose: "GRS-* 期待値"
    - path: "docs/04_ドメインモデル設計/RecommendationRequest定義書.md"
      required: false
      purpose: "テスト入力 fixture 設計"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: false
      purpose: "テスト期待値設計"
  templates: []
  files:
    - path: "apps/reco/src/reco/api/**"
      required: true
      purpose: "テスト対象"
    - path: "apps/reco/tests/unit/api/test_recommendations_run_smoke.py"
      required: true
      purpose: "既存スモークテスト（拡充起点）"
    - path: "apps/reco/tests/unit/api/conftest.py"
      required: false
      purpose: "既存 fixture"
  issues:
    - number: 1103
      purpose: "前提 Task（実装）"
    - number: 1091
      purpose: "前提 Task（API実装仕様書）"
    - number: 1097
      purpose: "前提 Contract Task（OpenAPI）"
  prs:
    - number: 1106
      purpose: "前提 PR（実装）"
    - number: 1099
      purpose: "前提 PR（OpenAPI Contract）"
    - number: 1094
      purpose: "前提 PR（実装仕様書）"

output:
  docs: []
  files:
