  - "テスト観点とテストケースの対応表（PR 本文またはコメント）"
  - "pytest 実行結果（成功ログ）"
  - "Task Definition（本ファイル）"
  - "Review Definition（`prompts/definitions/reviews/api-int-002-reco-recommendation-run/unit-test/pr-review.yaml`）"

acceptance_criteria:
  - "契約仕様書 §12 の unit 相当観点（auth / validation / trace / 0 件 / warnings / debug / Response 外形）がテストケースとしてカバーされている（対応表を PR に記載）"
  - "既存 4 スモークテストが引き続き成功する"
  - "`cd apps/reco && python -m pytest tests/unit/api/ -v --tb=short` が成功する"
  - "`cd apps/reco && python -m pytest tests/unit/ -q --tb=short` が成功する（他テストへの悪影響なし）"
  - "integration 観点（実装仕様書 §10 No.1, 3, 4, 11 等）は本 Task で未実施であることを PR に明記している"
  - "テストが本番 DB / 外部 API / secret に依存していない"
  - "エンドポイント層の不要な機能変更を含まない（テスト成立に必要な最小修正のみ）"
  - "OpenAPI / generated / apps/api wrapper の変更を含まない"
  - "epic_scope 内に差分が収まっている"
  - "secret、APIキー、.env 実値が含まれていない"

