schema_version: "1.0"
definition_type: "task"

task:
  id: "task-api-int-002-reco-recommendation-run-implementation"
  title: "API-INT-002:Reco推薦実行エンドポイント実装"
  summary: "API-INT-002（Reco推薦実行 / Internal API、`POST /internal/reco/v1/recommendations/run`）の apps/reco エンドポイント層（`apps/reco/src/reco/api/**`）を新規実装する。MOD-RECO-001 Orchestrator を CompositionMode.PRODUCTION で呼び出し、契約仕様書・実装仕様書に沿った Request/Response マッピングとエラーハンドリングを提供する（Phase4b 2/3）。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]API-INT-002:Reco推薦実行"
  epic_issue_number: 366
  epic_branch: "feature/epic-366-api-int-002-reco-recommendation-run"
  related_issues:
    - 1091
    - 1097
  related_prs:
    - 1094
    - 1099

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
    - "test-ai"
    - "contract-ai"
  review:
    - "reviewer-ai"

background: |
  Phase4b 縦串（実装仕様書 → OpenAPI Contract → reco エンドポイント実装 → 単体テスト）の 2/3 である。
  前提として API実装仕様書（#1091 / PR #1094）および OpenAPI Contract Task（#1097 / PR #1099）が親 Epic Branch に merge 済みであること。
  現状 `apps/reco/src/reco/api/**` は未実装。MOD-RECO-001 Composition（#1076 / PR #1088）により `build_production_ports()` / `RecommendationOrchestrator.run()` は利用可能。
  本 Task では FastAPI エンドポイント層を新規作成し、Internal API Key 認証・Request/Response マッピング・Orchestrator 委譲・エラーマップを実装する。

objective: |
  `POST /internal/reco/v1/recommendations/run` を apps/reco 上で提供し、契約仕様書および実装仕様書に沿った HTTP I/F を実装する。
  CompositionMode.PRODUCTION で Orchestrator を呼び出し、正常系（0 件含む）・異常系・debug 返却条件を満たす Response を返却できる状態にする。

scope:
  - "FastAPI アプリケーション新規実装（`apps/reco/src/reco/api/**`）"
  - "`POST /internal/reco/v1/recommendations/run` ルート実装"
  - "Internal API Key 認証（`X-Internal-Api-Key` / `RECO_INTERNAL_API_KEY`）"
  - "Request Mapper（API DTO camelCase → domain RecommendationRequest）"
  - "Response Mapper（domain RecommendationResult → `data` + `meta`、契約上 `data.resultItems`）"
  - "Error Mapper（RecoError / Validation → HTTP + GRS-*）"
  - "trace / request_id の Header ↔ meta 一致"
  - "debug 返却条件（§7.3.8）に基づく scoreBreakdown / debugPayload / reasonData 組立"
  - "CompositionMode.PRODUCTION 固定での Orchestrator DI"
  - "Task / Review Definition 整備（本ファイルおよび pr-review.yaml）"

out_of_scope:
  - "packages/contracts/openapi/** の変更"
  - "apps/api/src/generated/reco-client/** の再生成"
  - "apps/api reco-client wrapper 実装（ScaffoldRecoClient 置換）"
  - "apps/reco/src/reco/application/** の推薦ロジック変更"
  - "契約仕様書・実装仕様書 docs の変更"
  - "DB schema 変更・migration"
  - "網羅的単体テスト Task（Phase4b 3/3 で実施）"
  - "apps/web / apps/batch の変更"

input:
  docs:
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API実装仕様書.md"
      required: true
      purpose: "実装正本（処理フロー・マッピング・DI・認証・debug 方針）"
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API契約仕様書.md"
      required: true
      purpose: "Response 外形・Validation・Error 一覧の参照"
    - path: "docs/05_アプリケーション設計/アプリ/api/API設計方針書.md"
      required: true
      purpose: "Internal API の URL / Method / Error 形式"
    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: true
      purpose: "Internal API Key 方針"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
      purpose: "GRS-* エラーマップ"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: true
      purpose: "trace / phase_log / access log 方針"
    - path: "docs/04_ドメインモデル設計/RecommendationRequest定義書.md"
      required: true
      purpose: "Request マッピング正本"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: true
      purpose: "Response マッピング正本"
    - path: "docs/05_アプリケーション設計/アプリ/reco/Recoモジュール一覧.md"
      required: false
      purpose: "エンドポイント層と MOD-RECO-001 の境界確認"
  templates: []
  files:
    - path: "packages/contracts/openapi/internal-reco-api.yaml"
      required: true
      purpose: "OpenAPI 正本（Contract Task 反映済み。実装の schema 参照用）"
    - path: "apps/reco/src/reco/composition/builder.py"
      required: true
      purpose: "build_production_ports / build_composition_ports"
    - path: "apps/reco/src/reco/application/recommendation-orchestrator/"
      required: true
      purpose: "RecommendationOrchestrator.run 呼び出し先"
    - path: "apps/reco/src/reco/domain/recommendation/request.py"
      required: false
      purpose: "既存 domain 型の再利用"
    - path: "apps/reco/src/reco/domain/recommendation/result.py"
      required: false
      purpose: "既存 domain 型の再利用"
  issues:
    - number: 1091
      purpose: "前提 Task（API実装仕様書）"
    - number: 1097
      purpose: "前提 Contract Task（OpenAPI 契約反映）"
  prs:
