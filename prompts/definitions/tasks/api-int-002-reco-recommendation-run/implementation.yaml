deliverables:
  - "FastAPI エンドポイント層（`apps/reco/src/reco/api/**`）"
  - "POST /internal/reco/v1/recommendations/run 実装"
  - "認証・マッピング・エラーハンドリング・Orchestrator 接続"
  - "Task / Review Definition（本ファイル・pr-review.yaml）"

