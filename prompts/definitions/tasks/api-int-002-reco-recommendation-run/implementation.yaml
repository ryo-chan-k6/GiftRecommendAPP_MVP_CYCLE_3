  - "契約仕様書の Response 外形（`data.resultItems` / `WarningItem[]` / 0 件 `completed`）を満たす"
  - "CompositionMode.PRODUCTION で Orchestrator を呼び出している"
  - "OpenAPI / generated / apps/api wrapper の変更を含まない"
  - "apps/reco/src/reco/application/** の推薦ロジック本体変更を含まない"
  - "epic_scope.allowed_paths 内に差分が収まっている"
  - "reco unit test またはスモークテストが最低限通る（結果を PR に記載）"
  - "secret、APIキー、.env 実値が含まれていない"

