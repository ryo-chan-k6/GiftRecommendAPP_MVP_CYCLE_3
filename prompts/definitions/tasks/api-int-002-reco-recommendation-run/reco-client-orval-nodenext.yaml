background: |
  Phase 0（#1112 / PR #1117）で `GeneratedRecoClient` 本実装を develop へマージ済み。
  現状は `apps/api` の `NodeNext`（`tsconfig.base.json`）と Orval 既定出力（拡張子なし相対 import）の不整合により、generated endpoint モジュールを直接 import できない。
  暫定として schema import + `paths.ts` 手書き定数 + 独自 `transport.ts` で API-INT-001 / API-INT-002 を呼び出している。
  本 Task は段階導入プラン Phase 1 として、Orval 設定と generated 出力を api consumer 向けに整合させ、wrapper の重複 transport を削減する。

objective: |
  `orval.config.ts` の `internalRecoApi` を apps/api（NodeNext）向けに最適化し、Orval 再生成後に generated endpoint を wrapper から import 可能にする。
  custom mutator（`recoFetch`）で base URL / Internal API Key / trace Header / timeout を共通化し、認証・trace・エラー変換の wrapper 責務は維持する。

scope:
  - "`orval.config.ts` の `internalRecoApi` を api（NodeNext）向けに分離・最適化（tsconfig 連動・mutator 導入）"
  - "`apps/api/src/infrastructure/reco-client/orval-mutator.ts` 等の mutator 追加"
  - "`npm run orval` による `apps/api/src/generated/reco-client/**` 再生成（OpenAPI 変更なし）"
  - "`apps/api/src/infrastructure/reco-client/**` の `paths.ts` / `transport.ts` を generated 関数呼び出しへ寄せる"
  - "reco-client wrapper 単体テストの更新"
  - "CI 強化（api build で generated endpoint import が通ることの担保）"
  - "Task / Review Definition 整備"

out_of_scope:
  - "`packages/contracts/openapi/*.yaml` の変更"
  - "`publicApi`（web / bundler）側の Orval 設定変更"
  - "generated ファイルの手動編集"
  - "apps/reco 変更"
  - "apps/api Public API（API-PUB-002）ルート実装"
  - "apps/web / apps/batch 変更"
  - "integration / e2e（実 HTTP 結合）"

