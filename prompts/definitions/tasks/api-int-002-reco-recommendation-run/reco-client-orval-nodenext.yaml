  summary: "Phase 0（#1112 / PR #1117）の暫定回避（paths.ts 手書き + 独自 transport）を解消する。`internalRecoApi` の Orval 設定を apps/api（NodeNext）向けに最適化し、generated reco-client を再生成して wrapper を generated 関数呼び出しへ寄せる。"

