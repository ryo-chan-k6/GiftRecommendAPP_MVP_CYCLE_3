  - "レコメンド実行APIのResponseにreason、score、items等をどこまで含めるか判断が必要になる可能性がある"
  - "API仕様作成中にOpenAPI変更・generated差分が必要と判明する可能性がある"
  - "providerであるapps/apiと内部reco APIの責務境界が曖昧になる可能性がある"
  - "認証・認可仕様が未確定の場合、API仕様の確定が止まる可能性がある"

human_decision_points:
  - "API-INT-002 の正式 Endpoint（`POST /internal/reco/v1/recommendations/run`）と api→reco の責務境界を確認する"
  - "本Taskが Internal API（API-INT-002）のみを対象とし、API-PUB-002 は別Taskとする方針を確認する"
  - "Request Bodyに含める入力条件の最終範囲を確認する"
  - "Response Bodyに含めるscore、reason、debug情報、trace情報の範囲を確認する"
  - "MVPでreasonを必須項目にするか任意項目にするかを確認する"
  - "OpenAPI / Orval / generated更新を後続Contract Taskとして分離するか確認する"
  - "出力ファイル名（API-INT-002_Reco推薦実行API仕様書.md）が他API仕様書の命名規則（{API-ID}_{機能名}API仕様書.md）と整合するか確認する"

