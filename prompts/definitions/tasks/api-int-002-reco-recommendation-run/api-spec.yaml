  manual_checks:
    - "api-spec.md の章構成に準拠していることを確認する"
    - "API設計方針書と矛盾がないことを確認する"
    - "API一覧の API-INT-002 と endpoint / method / API種別（Internal API）/ MVP対象 が一致していることを確認する"
    - "Recommendation Request定義書とRequest Bodyが整合していることを確認する"
    - "Recommendation Result定義書とResponse Bodyが整合していることを確認する"
    - "エラーコード定義書とError Responseが整合していることを確認する"
    - "provider / consumer 影響が記載されていることを確認する"
    - "OpenAPI / Orval / generated の変更を本Taskに含めていないことを確認する"
