    "integration test": "docs作成Taskであり、実装変更を含まないため対象外"
    "e2e test": "docs作成Taskであり、画面実装・API実装を含まないため対象外"
    "contract test": "OpenAPI定義、provider実装、consumer実装、generated変更を含まないため対象外。ただしcontract impact checkは必須確認とする"
    "typecheck": "source code変更を含まないため対象外"
    "build": "source code変更を含まないため対象外"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "個別API仕様書として粒度が過不足ないか"
    - "API一覧の API-INT-002 と内容が整合しているか"
    - "API設計方針書とURL、Method、認証、Error形式が整合しているか"
    - "Request / Response項目がRecommendation Request / Result定義書と整合しているか"
    - "provider / consumer 影響が明確か"
    - "OpenAPI / Orval / generated変更がContract Taskとして分離されているか"
    - "未決事項が隠れずに明記されているか"
    - "secretや.env実値が含まれていないか"
  specialist_reviews:
    docs: true
    test: false
    contract: true
    security: true

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: true
    experiments: false
