schema_version: "1.0"
definition_type: "task"

task:
  id: "task-api-int-002-reco-recommendation-run-api-spec"
  title: "API-INT-002:Reco推薦実行API仕様書作成"
  summary: "API-INT-002（Reco推薦実行 / Internal API）の個別API仕様書（API-INT-002_Reco推薦実行API仕様書.md）を、API設計方針書・API一覧・Recommendation Request/Result定義書・エラーコード定義書・ログ・Observability設計書に基づいて作成する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]API-INT-002:Reco推薦実行"
  epic_issue_number: null  # 実Issue起票後に追記。/start-task §5.1 で GitHub 実在確認。
  epic_branch: "feature/epic-<issue-number>-api-int-002-reco-recommendation-run"
  related_issues: []
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
    - "contract-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "contract-ai"

background: |
  06_実装設計において、API実装・OpenAPI定義・Orval生成・画面設計・テスト設計の前提となる個別API仕様書を作成する。
  本Taskでは、API一覧の API-INT-002（Reco推薦実行 / Internal API）を対象に、api→reco 間の Request / Response / Error / Validation / 処理概要 / provider-consumer 影響を整理する。
  API-PUB-002（Public API / レコメンド実行）は本Taskの対象外とし、別Taskで仕様化する。

objective: |
  API-INT-002（Reco推薦実行 / Internal API、`POST /internal/reco/v1/recommendations/run`）について、実装・OpenAPI化・Contract Task化・レビューが可能な粒度の個別API仕様書を作成する。
  作成する仕様書は prompts/templates/docs/api-spec.md に準拠する。

scope:
  - "API-INT-002（Reco推薦実行 / Internal API）の個別API仕様書を新規作成する（成果物ファイル名: API-INT-002_Reco推薦実行API仕様書.md）"
  - "API基本情報を定義する"
  - "Request Header / Path Parameters / Query Parameters / Request Bodyを整理する"
  - "Response Header / Status Code / Response Bodyを整理する"
  - "Error Response仕様を整理する"
  - "バリデーション仕様を整理する"
  - "処理概要をMermaidまたは文章で整理する"
  - "Request / Response と内部DTO・ドメイン定義とのマッピングを整理する"
  - "provider / consumer 影響を整理する"
  - "OpenAPI / Orval / generated 方針を整理する"
  - "セキュリティ仕様・非機能仕様・ログ監視・テスト観点を整理する"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
  - "API-PUB-002（Public API / レコメンド実行 / `POST /api/v1/recommendations`）の個別API仕様書作成"
  - "web 向け Public API の Request / Response / Error 定義（Public 側は別Task）"
  - "OpenAPI定義ファイルの作成・更新"
  - "Orval設定ファイルの作成・更新"
  - "generated API clientの再生成"
  - "apps/api の実装"
  - "apps/web の実装"
  - "apps/reco の実装"
  - "DB schema変更"
  - "DDL作成・変更"
  - "認証・認可方式そのものの変更"
  - "API一覧全体の再設計"
  - "レコメンドアルゴリズムの変更"
  - "Recommendation Request / Result定義書そのものの変更"
  - "画面仕様書の作成"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/api/API設計方針書.md"
      required: true
      purpose: "URL設計、HTTPメソッド、認証、エラー、バージョニング等のAPI設計方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "API-INT-002 の endpoint、API種別（Internal API）、MVP対象、api→reco 連携を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
      purpose: "Error Response、HTTP Status、ユーザー向け表示方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: true
      purpose: "API-INT-002 の phase_log / error_log / metric / trace_id 対象を仕様書へ反映するため"
    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: true
      purpose: "認証・認可設計書（文書名）に基づき、認証要否、認可条件、APIアクセス制御方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能一覧.md"
      required: true
      purpose: "レコメンド実行APIが対応する機能とMVP対象範囲を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/モジュール一覧.md"
      required: true
      purpose: "API provider / reco provider / consumer の責務境界を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能×モジュール対応表.md"
      required: false
      purpose: "レコメンド実行APIと関連モジュールの対応を確認するため"
    - path: "docs/04_ドメインモデル設計/RecommendationRequest定義書.md"
      required: true
      purpose: "レコメンド実行APIのRequest構造を定義するため"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: true
      purpose: "レコメンド実行APIのResponse構造を定義するため"
    - path: "docs/04_ドメインモデル設計/Retrieval定義書.md"
      required: false
      purpose: "候補抽出・Hard Filter・予算条件・NG条件の処理概要を確認するため"
    - path: "docs/04_ドメインモデル設計/Matching定義書.md"
      required: false
      purpose: "意味一致度・context_score算出の処理概要を確認するため"
    - path: "docs/04_ドメインモデル設計/Ranking定義書.md"
      required: false
      purpose: "最終順位決定・top_k・diversity等の処理概要を確認するため"
    - path: "docs/04_ドメインモデル設計/Reason生成定義書.md"
      required: false
      purpose: "推薦理由をResponseに含める場合の項目・禁止表現・根拠を確認するため"
    - path: "docs/03_ドメイン要件定義/非機能要件定義書/非機能要件定義書（目次）.md"
      required: false
      purpose: "レスポンスタイム、可用性、セキュリティ等の非機能要件を確認するため（詳細は同ディレクトリ配下の各要件文書を参照）"
  templates:
    - path: "prompts/templates/docs/api-spec.md"
      required: true
      purpose: "個別API仕様書を標準フォーマットで作成するため"
      applies_to:
        - "docs/06_実装設計/api/API-INT-002_Reco推薦実行API仕様書.md"
  files: []
  issues: []
  prs: []

output:
  docs:
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API仕様書.md"
      action: "create"
      required: true
      template: "prompts/templates/docs/api-spec.md"
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "API-INT-002（Reco推薦実行）個別API仕様書（ファイル名: API-INT-002_Reco推薦実行API仕様書.md）"
  - "Request / Response / Error Response定義"
  - "Validation仕様"
  - "trace_id / log / metric 方針"
  - "provider / consumer 影響整理"
  - "OpenAPI / Orval / generated 方針整理"
  - "未決事項・人間判断事項の整理"

acceptance_criteria:
  - "docs/06_実装設計/api/API-INT-002_Reco推薦実行API仕様書.md が作成されている"
  - "prompts/templates/docs/api-spec.md の章構成に準拠している"
  - "API設計方針書と矛盾するURL、HTTP Method、認証、Error形式を定義していない"
  - "API一覧の API-INT-002 と矛盾する endpoint、HTTP Method、API種別（Internal API）、MVP対象範囲を定義していない"
  - "Recommendation Request定義書に基づいてRequest Bodyが整理されている"
  - "Recommendation Result定義書に基づいてResponse Bodyが整理されている"
  - "Error Responseとエラーコードがエラーコード定義書と整合している"
  - "trace_id / phase_log / error_log / metric 方針がログ・Observability設計書と整合している"
  - "provider / consumer の影響が記載されている"
  - "OpenAPI / Orval / generated の扱いが記載されている"
  - "本Task内でOpenAPI、Orval、generated、実装ファイルを変更していない"
  - "未決事項がある場合、未決事項として明記されている"
  - "secret、APIキー、.env実値、接続文字列の実値を含んでいない"
  - "Human Reviewで確認してほしい事項が明記されている"

