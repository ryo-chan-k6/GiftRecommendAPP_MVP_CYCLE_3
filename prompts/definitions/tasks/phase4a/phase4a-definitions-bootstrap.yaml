    - path: "prompts/definitions/reviews/reco-foundation/**"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-foundation/**"
      action: "create"
      required: true
    - path: "prompts/definitions/tasks/phase4a/phase4a-definitions-bootstrap.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/phase4a/phase4a-definitions-bootstrap/pr-review.yaml"
      action: "create"
      required: true

deliverables:
  - "Phase4a foundation Epic Definition 5件"
  - "子 Task Definition 20件 + Review Definition 25件（Task×20 + Epic×5）"
  - "bootstrap Task / Review Definition"
  - "merge 後 各 foundation `/start-epic` 実行可能"
  - "Issue #686"

acceptance_criteria:
  - "5 foundation Epic Definition が存在し §6.5 と整合"
  - "子 Task 20件が存在し epic_scope.child_task_areas と対応"
  - "各 Task + Epic + bootstrap の Review Definition が存在"
  - "epic_scope.forbidden_paths に packages/contracts/** が含まれる"
  - "Phase4b 本格実装を bootstrap scope 外としている"
  - "secret 実値が含まれていない"
  - "Task PR target が develop（親 Epic なし chore）"

branch:
  no_branch: false
  name: "chore/task-686-phase4a-definitions-bootstrap"
  summary: "phase4a-definitions-bootstrap"
  base: "develop"
  target: "develop"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"

issue:
  number: 686
  unit: "task"
  type: "chore"
  area: "infra"

dependencies:
  epics: []
  issues:
    - number: 651
      purpose: "Epic A 完了"
    - number: 671
      purpose: "Epic C 完了"
  blocking: false

parallel_control:
  exclusive_files:
    - "prompts/definitions/epics/packages-foundation/**"
    - "prompts/definitions/epics/web-foundation/**"
    - "prompts/definitions/epics/api-foundation/**"
    - "prompts/definitions/epics/reco-foundation/**"
    - "prompts/definitions/epics/batch-foundation/**"
    - "prompts/definitions/tasks/packages-foundation/**"
    - "prompts/definitions/tasks/web-foundation/**"
    - "prompts/definitions/tasks/api-foundation/**"
    - "prompts/definitions/tasks/reco-foundation/**"
    - "prompts/definitions/tasks/batch-foundation/**"
    - "prompts/definitions/reviews/**/packages-foundation/**"
    - "prompts/definitions/reviews/**/web-foundation/**"
    - "prompts/definitions/reviews/**/api-foundation/**"
    - "prompts/definitions/reviews/**/reco-foundation/**"
    - "prompts/definitions/reviews/**/batch-foundation/**"
    - "prompts/definitions/tasks/phase4a/phase4a-definitions-bootstrap.yaml"
    - "prompts/definitions/reviews/phase4a/phase4a-definitions-bootstrap/**"
  conflict_risk: "low"
  contract_impact: false
  generated_impact: false
  db_impact: false

test_policy:
  manual_checks:
    - "YAML 必須項目目視"
    - "Epic×5 / Task×20 / Review×26 のファイル数"
    - "child_task_areas と Task ファイル名対応"
  not_required:
    - "unit test"
  skip_reason:
    "unit test": "Definition のみ chore"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "§6.5 Phase4a Task 表との整合"
    - "5 Epic 並列方針・依存（Phase3b 完了）"
    - "forbidden_paths（contracts / generated）"
    - "Review Definition 3点セット"
    - "Phase4b 識別子 Epic 実装を scope 外としているか"
  specialist_reviews:
    docs: true
    security: false

contract_gate:
  required: false

operation_logging:
  level: "minimal"

notes:
  - "親 Epic なし・develop 直 Task（§7.6 bootstrap）"
  - "merge 後: `/start-epic` を workstream 単位で並列実行可"
  - "推奨着手順: packages-foundation → reco-foundation / api-foundation 並列 → web / batch 並列"
