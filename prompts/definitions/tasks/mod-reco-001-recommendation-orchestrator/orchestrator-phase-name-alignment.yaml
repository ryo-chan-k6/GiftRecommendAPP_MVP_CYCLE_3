background: |
  MOD-RECO-028 §8.5 / §16.1 No.8 / No.9 により、DB 永続化対象の `phase_name` 正本は Observability §10.3 の 14 集約名である。
  028 内での名称マッピングは行わず、**Orchestrator が 028 へ渡す名称を enum 14 値に統一する**（028 §16.3 順序5）。
  Epic #1043 merge 後、`build_default_stub_ports()` は 028 本実装を配線済みだが、Orchestrator / 下位モジュール定数には enum 外名称が残存している。
  例: `run_recorded`, `pipeline_failed`, `pipeline_control`, `feature_matched`, `ranked`, `result_built`, `snapshot_built` 等。
  現状 028 は enum 外を in-memory イベント + warn のみとし DB INSERT をスキップするため、段階3 Composition 前に Orchestrator 側で整合が必要。

objective: |
  Orchestrator の Phase Log 記録契機を 14 集約名へ揃え、主要フェーズ境界で `PhaseLogWriterPort.record_phase()` に enum 妥当な `phase_name` のみ渡す。
  下位モジュール内部の `PHASE_NAME` 定数は、Orchestrator 集約層で正規化するか、必要最小限の定数更新で 14 値へ寄せる（実装判断は PR 本文で説明）。
  関連 pytest を更新し、InMemory Repository 経由で enum 妥当名称が永続化されることを確認する。

scope:
  - "`orchestrator.py` の `record_phase()` 呼び出し site の phase_name 集約・正規化（14 値準拠）"
  - "enum 外固定名称（`run_recorded`, `pipeline_failed`, `pipeline_control` 等）の扱い整理"
  - "下位モジュール `module.phase_name` と 14 集約名の対応表を PR 本文に記載"
  - "必要最小限: 下位モジュール `constants.py` の `PHASE_NAME` 更新（Orchestrator 正規化のみで足りる場合は変更しない）"
  - "024 経由 error_detail_json の `phase_name` が Orchestrator 集約名と矛盾しないよう整合（読み取り・最小修正）"
  - "`test_recommendation_orchestrator.py` および phase-log / wiring integration 関連テスト更新"
  - "Review Definition 配置"

out_of_scope:
  - "`phase-log-writer/validation.py` への名称マッピング追加（028 scope 外）"
  - "`packages/code-definitions` / enum 定義書の値追加・変更"
  - "`PhaseStatus.skipped` 追加と Orchestrator 呼び出し site（028 §16.1 No.11）"
  - "段階3 Composition（本番 DB Repository DI）"
  - "MOD-RECO-025 Metric Logger 配線"
  - "OpenAPI / Orval / generated / DB schema 変更"
  - "docs 大規模更新（必要なら MOD-RECO-001 §15 変更履歴 1 行のみ可）"

