test_policy:
  required:
    - "apps/reco/tests/unit/"
  commands:
    - "cd apps/reco && uv sync --extra dev && uv run pytest tests/unit/ -q"
    - "cd apps/reco && uv run pytest tests/unit/application/test_recommendation_orchestrator.py -q"
  manual_checks:
    - "stubs.py の 002〜023 が build_default_* を参照していること"
    - "024/025/028/029 が Stub のままであること"
    - "§8.4.2 更新が他 docs と矛盾しないこと"
  not_required:
    - "integration test（E2E）"
    - "contract test"
  skip_reason:
    "integration test（E2E）": "段階3 Composition / 024〜029 実装後に別 Task"
    "contract test": "OpenAPI 変更なし"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "配線状態一覧が develop 実装と一致しているか"
    - "§14 ギャップ表の unit / integration 区分が妥当か"
    - "docs 更新が最小限で正本整合しているか"
    - "本 Task scope 外（integration / 024〜029 実装）に着手していないか"
    - "後続 Task 推奨順序が Human 判断材料として十分か"
    - "develop 直 PR 例外理由が PR 本文で説明されているか"
  specialist_reviews:
    docs: true
    test: true
    contract: false
    security: false

operation_logging:
