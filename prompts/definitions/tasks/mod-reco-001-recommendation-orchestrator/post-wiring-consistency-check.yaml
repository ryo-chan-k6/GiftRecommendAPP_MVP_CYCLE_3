    incidents: false
    cross_cutting: true
    experiments: false
  reason: "Wiring 完了後の横断整合チェック。ギャップは PR / 後続 Issue 化"

risk_points:
  - "§14 unit / integration 境界の解釈揺れ"
  - "ギャップ表作成中に scope が integration 実装へ拡大しやすい"
  - "docs 更新が MOD-RECO-001 以外へ波及しやすい"

human_decision_points:
  - "§14 unit ギャップを本 Task で pytest 追加するか、後続 unit-test Task に委譲するか"
  - "後続 Epic 起票順序（024/028/029 vs Composition）の確定"
  - "025（MVP △）を MVP 必須に含めるか"
  - "026/027（BT）を Batch トラックで並行起票するか"

stop_conditions:
