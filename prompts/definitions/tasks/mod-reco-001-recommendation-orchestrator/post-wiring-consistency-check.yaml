  - "配線状態と docs の矛盾解消に execution_context.py / stubs.py 変更が必要になった（別 Task へ）"
  - "integration テスト実装が必要と判断され scope を超える場合"

notes:
  - "推奨ロードマップ ①（整合チェック）。正本: 前回 Human 合意（024/028/029 → Composition → 025 / 026・027）"
  - "workstream: mod-reco-001-post-wiring"
  - "Related to #260 / #788〜#792 / playbook follow-up 各 Task"
  - "PR 本文テンプレ: 配線表・§14 ギャップ表・後続推奨・docs 差分"

