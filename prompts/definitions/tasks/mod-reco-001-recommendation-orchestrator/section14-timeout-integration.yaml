background: |
  段階2（フェーズ Wiring）および docs 追随（#1067 / #1068）完了後、MOD-RECO-001 §268 が段階3着手前残課題として
  §14 integration 観点 No.10 / 11 / 14 を明示している。
  本 Task はその第一項目 No.11（全体 hard 4,000ms 超過 → GRS-REC-101）に限定する。
  `PIPELINE_HARD_TIMEOUT_MS = 4_000` は constants.py に定義済みだが、Orchestrator 本体にウォッチドッグ未実装。
  `GRS-REC-101` は reco-error-handler/constants.py に定義済み。

objective: |
  Recommendation Orchestrator にパイプライン全体 hard timeout ウォッチドッグを実装し、
  超過時に `GRS-REC-101` を返す §14 No.11 integration テストを green にする。

scope:
  - "`orchestrator.py` パイプライン全体 hard timeout（4,000ms）ウォッチドッグ実装"
  - "超過時 `ModuleExecutionError` / `error_handler` 経由で `GRS-REC-101` を返却"
  - "`test_recommendation_orchestrator.py` §14 No.11 integration ケース追加"
  - "`recommendation_orchestrator_helpers.py` 等の slow stub / injectable clock helper"
  - "必要最小限の constants / errors 調整（既存定数の利用を優先）"
  - "Task / Review Definition 配置"

out_of_scope:
  - "soft timeout（2,000ms SLO）の Metric / warn 実装（§13.2 soft 行）"
  - "フェーズ別 hard timeout（§13.2 個別上限）"
  - "§14 No.10（観測系横断 DB/ログ）/ No.14（Reason partial）"
  - "PoC 性能検証（Epic #759）および §13.2 数値の変更"
  - "段階3 Composition / API-INT-002"
  - "stubs.py 配線変更"
  - "024 / 028 / 029 / 025 モジュール本体の仕様変更（テスト成立に必要な最小修正のみ可）"
  - "docs 正本更新（実装と矛盾する場合のみ最小追記）"
  - "OpenAPI / Orval / generated / DB schema 変更"

