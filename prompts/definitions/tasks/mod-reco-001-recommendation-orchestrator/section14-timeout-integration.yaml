  - "超過時 GRS-REC-101 の OrchestratorOutcome / error_handler 連携"
  - "§14 No.11 integration pytest"
  - "PR 本文: 観点↔テスト対応表・実装方針（injectable clock）"

acceptance_criteria:
  - "4,000ms 超過シナリオで reco_error.error_code == GRS-REC-101"
  - "正常系・既存 §14 テストが regression なし"
  - "テストが実 sleep / 本番 DB / 外部 API に依存しない"
  - "§13.2 の 4,000ms 暫定値を変更していない（PoC 委譲維持）"
  - "scope 外（No.10 / No.14 / soft timeout / フェーズ別 timeout）に着手していない"

