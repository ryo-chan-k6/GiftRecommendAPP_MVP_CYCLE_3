  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  §14 No.11（#1070）および No.10（#1071 / #1072）完了後、段階3着手前残課題の §14 integration 最終項目 No.14 が残る。
  `reason_fallback.py` は一部 Item fallback 時に `ResultStatus.PARTIAL` を設定するが、
  Orchestrator デフォルト composition で複数 Item の部分 fallback を integration 検証するテストが未整備。

objective: |
  複数 result item のうち一部のみ Reason fallback となるシナリオで、
  HTTP 200 / success outcome かつ `recommendation_result.result_status == partial` を integration テストで green にする。

scope:
  - "`test_recommendation_orchestrator.py` §14 No.14 integration ケース追加"
  - "複数 Item 向け Reason generator stub / helper"
  - "Orchestrator / reason_generator 連携の最小修正（テスト成立に必要な範囲）"
  - "Task / Review Definition 配置"

out_of_scope:
  - "Run recorder の run_status partial 永続化（002 仕様変更）— 本 Task では result_status を正とする"
  - "§14 No.10 docs 追随 / §268 更新"
  - "段階3 Composition / API-INT-002"
  - "OpenAPI / DB schema 変更"

input:
  docs:
    - path: "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md"
      required: true
      purpose: "§10.3 / §14 No.14"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: false
      purpose: "resultStatus partial"
  files:
    - path: "apps/reco/src/reco/application/recommendation-orchestrator/reason_fallback.py"
      required: true
    - path: "apps/reco/src/reco/application/recommendation-orchestrator/orchestrator.py"
      required: true
    - path: "apps/reco/tests/unit/application/test_recommendation_orchestrator.py"
      required: true

output:
