      action: "update"
      required: true
  files:
    - path: "apps/reco/src/reco/application/recommendation-orchestrator/orchestrator.py"
      action: "update"
      required: false
      purpose: "必要時のみ最小修正"

deliverables:
  - "§14 No.14 integration pytest"
  - "PR 本文: 観点↔テスト対応表"

acceptance_criteria:
  - "複数 Item で一部のみ fallback のとき outcome.success かつ result_status == partial"
  - "全 Item fallback（No.13）と区別されている"
  - "pytest green"
  - "scope 外（002 run_status partial 永続化）に着手していない"

