  title: "MOD-RECO-001:§14 No.14 Reason partial integration"
  summary: "MOD-RECO-001 §14 No.14（複数 Item で一部のみ Reason fallback 時に resultStatus partial）を integration テストで検証し、必要最小限の Orchestrator / 023 連携を整える。"

