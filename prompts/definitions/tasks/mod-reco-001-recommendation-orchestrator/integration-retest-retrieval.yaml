  summary: "Issue #887 で ExecutionContext に型付きフィールド追加後、`test_recommendation_orchestrator.py` の Retrieval 向け `getattr` アサーションを型付き直接参照へ置換し、デフォルト composition 経路の検証を型安全化する。"

