background: |
  Issue #886（Retrieval integration-test）では配線後のデフォルト composition を green 化したが、
  ExecutionContext の Retrieval フィールド（pre_filtered_item_pool / retrieval_candidate 等）は
  `#887` 型付き化完了前のため `getattr` で存在確認していた。
  Issue #887 merge 後、本 Task で当該テストを型付き直接参照へ更新する。
  Epic #260 はクローズ済みのため、**develop ベース・develop 向け PR** の横断 follow-up として実施する。

objective: |
  `test_default_composition_populates_retrieval_execution_context` 等の Retrieval 向けアサーションを
  ExecutionContext 型付きフィールドの直接参照へ置換し、pytest green を維持する。

scope:
  - "`apps/reco/tests/unit/application/test_recommendation_orchestrator.py` の Retrieval 向け `getattr` アサーション置換"
  - "Retrieval フェーズ向け ExecutionContext 型付きフィールド直接参照への整理（観測系 count / latency 含む）"
  - "テスト用 helper の最小限整理（Retrieval context assert 専用）"
  - "Review Definition（`prompts/definitions/reviews/mod-reco-001-recommendation-orchestrator/integration-retest-retrieval/pr-review.yaml`）"

out_of_scope:
  - "`execution_context.py` のフィールド追加（#887 Task）"
  - "User Meaning 向け `getattr` アサーション置換（integration-retest-user-meaning Task）"
  - "stubs.py / モジュール本体の変更（テスト成立に必要な最小修正のみ可。要 PR 説明）"
  - "integration test（E2E）/ contract test"
  - "OpenAPI / DB schema 変更"

