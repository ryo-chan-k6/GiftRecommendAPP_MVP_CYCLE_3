      purpose: "履歴参照（Epic クローズ済み）。PR 本文は Related to #260"
    - number: 789
      purpose: "Retrieval Wiring Epic（履歴参照）"
    - number: 886
      purpose: "初回 Retrieval integration-test Task（配線後 green 化）"
    - number: 887
      purpose: "ExecutionContext 型付きフィールド拡張 Task（作業開始前提）"
