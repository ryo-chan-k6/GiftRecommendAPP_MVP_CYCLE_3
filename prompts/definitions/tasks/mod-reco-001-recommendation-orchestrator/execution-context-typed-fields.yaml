schema_version: "1.0"
definition_type: "task"

task:
  id: "task-mod-reco-001-execution-context-typed-fields"
  title: "MOD-RECO-001:ExecutionContext型付きフィールド拡張（User Meaning / Retrieval）"
  summary: "`ExecutionContext` に User Meaning（006〜010）および Retrieval（012 / 013）の中間成果物フィールドを型付きで追加し、各モジュールの動的付与（`# type: ignore[attr-defined]`）と `getattr` 依存を解消する。PR target は Human 判断により `develop` 直（Epic #260 クローズ済みの横断 follow-up）。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]MOD-RECO-001:Recommendation Orchestrator"
  epic_issue_number: 260
  epic_branch: "develop"
  related_issues:
    - number: 260
      purpose: "履歴参照（Epic クローズ済み）。PR 本文は Related to #260"
    - number: 789
      purpose: "Retrieval Wiring Epic（develop merge 完了が作業開始前提）"
  related_prs: []

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "test-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  User Meaning / Retrieval 各モジュール実装では `_attach_*` 時に `execution_context` へ動的付与（`# type: ignore[attr-defined]`）している。
  コメント上は「Wiring Task で型付きフィールド追加」とあるが、Wiring Task scope 外のため未実施のまま残っている。
  Epic #260（MOD-RECO-001:Recommendation Orchestrator）はクローズ済みのため、本 Task は **develop ベース・develop 向け PR** の横断 follow-up として実施する（Human 判断）。
  **作業開始前提**: Epic #789（Orchestrator Wiring Retrieval）が `develop` に merge 済みであること（Retrieval 配線・integration-test 反映後）。

objective: |
  `apps/reco/src/reco/application/recommendation-orchestrator/execution_context.py` に User Meaning / Retrieval フェーズの型付きフィールドを追加し、
  006〜010 / 012 / 013 の `_attach_*` およびモジュール内 `getattr(context, ...)` を直接参照へ置換する。
  Orchestrator 統合テストの `getattr` アサーション更新は **後続横断 integration 再テスト Task** に委譲する。

scope:
  - "`execution_context.py` への型付きフィールド追加（User Meaning: internal_feature_estimate, user_feature, user_meaning, user_context, query_embedding）"
  - "`execution_context.py` への型付きフィールド追加（Retrieval: pre_filtered_item_pool, retrieval_candidate, 観測系 count/latency, validated_retrieval_candidate, excluded_candidate_log 等）"
  - "006 / 007 / 008 / 009 / 010 / 012 / 013 の `_attach_*` から `# type: ignore[attr-defined]` 除去"
  - "上記モジュール内の `getattr(context, ...)` を直接参照へ置換（None チェックは維持）"
  - "誤解を招く「Wiring Task で型付きフィールド追加」コメントの削除または修正"
  - "Review Definition（`prompts/definitions/reviews/mod-reco-001-recommendation-orchestrator/execution-context-typed-fields/pr-review.yaml`）"

out_of_scope:
  - "`stubs.py` の Port 配線変更"
  - "`test_recommendation_orchestrator.py` の assert 更新（後続 integration 再テスト Task）"
  - "Matching 以降フェーズの ExecutionContext フィールド"
  - "段階3 Composition 完成（本番 DI）"
  - "OpenAPI / DB schema 変更"
  - "MOD-RECO-014 Feature Matcher 実装"
  - "Epic #260 の Reopen / Epic Branch 再利用"

