    - path: "apps/reco/src/reco/application/internal-condition-feature-estimator/estimator.py"
      required: true
      purpose: "internal_feature_estimate attach"
    - path: "apps/reco/src/reco/application/query-embedding-generator/generator.py"
      required: true
