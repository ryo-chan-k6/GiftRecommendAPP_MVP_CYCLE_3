task:
  id: "task-mod-reco-001-recommendation-orchestrator-unit-test"
  title: "MOD-RECO-001:Recommendation Orchestrator単体テスト"
  summary: "MOD-RECO-001（Recommendation Orchestrator）実装（#766 / PR #770）に対し、モジュール仕様書 §14 の unit 観点を満たす単体テストを apps/reco/tests/unit/application/** に追加・拡充する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]MOD-RECO-001:Recommendation Orchestrator"
  epic_issue_number: 260
  epic_branch: "feature/epic-260-mod-reco-001-recommendation-orchestrator"
  related_issues:
    - 758
    - 764
    - 766
  related_prs:
    - 760
    - 765
    - 770

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "test-ai"
  support:
    - "worker-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Epic #260 配下で MOD-RECO-001 実装 Task（#766 / PR #770）が完了し、`apps/reco/src/reco/application/recommendation-orchestrator/**` と最小スモークテスト（`test_recommendation_orchestrator.py` 4 ケース）が Epic Branch に取り込まれた。
  実装 Task の `out_of_scope` として網羅的単体テストは本 Task に委譲されていた。
  本 Task ではモジュール仕様書 §14 の **unit** 観点を対象とし、スタブポートを用いた Orchestrator 単体テストを整備する。

objective: |
  Recommendation Orchestrator の単体テストをモジュール仕様書 §14（unit 行）に沿って整備し、pytest で再現可能な検証を提供する。
  既存 4 テストを活かしつつ、不足観点（実行モード、0 件結果、各フェーズ失敗伝播、Phase Log 契機、trace 伝播など）を追加する。

scope:
  - "Orchestrator 単体テストの追加・拡充（`apps/reco/tests/unit/application/test_recommendation_orchestrator.py` および同ディレクトリ配下の関連テスト）"
  - "モジュール仕様書 §14 の unit 観点（No.1〜9, 12, 13）のカバレッジ整理とテストケース追加"
  - "Reason fallback（§10.3）の単体テスト拡充（既存テストの補強・境界ケース）"
  - "スタブポート（`stubs.py`）を利用した下位モジュール失敗・処理順序の検証"
  - "実行モード（ui / evaluation / batch）ごとの config 解決呼び出し検証"
  - "trace_id の実行コンテキスト・Phase Log 委譲への伝播検証（unit 範囲）"
  - "テスト用 fixture / helper の整理（Orchestrator テスト専用、過剰共通化は避ける）"
  - "Task / Review Definition 整備（本ファイルおよび `prompts/definitions/reviews/mod-reco-001-recommendation-orchestrator/unit-test-pr-review.yaml`）"

out_of_scope:
  - "integration test（§14 No.10 DB/ログ、No.11 タイムアウト hard、No.14 Reason 部分失敗の Run partial）"
  - "e2e test / contract test"
  - "Orchestrator 本体の機能追加・リファクタ（テスト成立に必要な最小修正のみ可。要 PR 説明）"
  - "他 Recoモジュール（MOD-RECO-002〜029）本体の本格実装"
  - "API-INT-002 エンドポイント層（`apps/reco/src/reco/api/**`）"
  - "OpenAPI / generated / DB schema 変更"
  - "本番 DB / 外部 API 依存テスト"
  - "タイムアウト hard 4,000ms の実時間計測テスト（integration 扱い）"

input:
  docs:
    - path: "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md"
      required: true
      purpose: "§14 テスト観点・§10 状態・例外・Reason fallback の正本"
    - path: "docs/05_アプリケーション設計/アプリ/reco/Recoモジュール一覧.md"
      required: true
      purpose: "§5.2 処理順序の正本"
    - path: "docs/04_ドメインモデル設計/RecommendationRequest定義書.md"
