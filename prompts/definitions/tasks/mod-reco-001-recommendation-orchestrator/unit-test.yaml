    - "secret check"
  commands:
    - "cd apps/reco && python -m pytest tests/unit/application/test_recommendation_orchestrator.py -v --tb=short"
    - "cd apps/reco && python -m pytest tests/unit/ -q --tb=short"
  manual_checks:
    - "§14 unit 観点ごとに対応テストケース名または PR 表でトレースできることを確認する"
    - "失敗注入テストが他モジュール本体実装に依存していないことを確認する"
    - "テスト fixture に実データ・secret が含まれていないことを確認する"
    - "apps/reco/src/reco/api/** への変更が含まれていないことを確認する"
  not_required:
