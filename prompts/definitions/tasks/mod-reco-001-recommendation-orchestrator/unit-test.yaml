acceptance_criteria:
  - "モジュール仕様書 §14 の unit 観点（No.1〜9, 12, 13）がテストケースとしてカバーされている（対応表を PR に記載）"
  - "既存 4 テストが引き続き成功する"
  - "`cd apps/reco && python -m pytest tests/unit/application/test_recommendation_orchestrator.py -q` が成功する"
  - "`cd apps/reco && python -m pytest tests/unit/ -q` が成功する（他テストへの悪影響なし）"
  - "integration 観点（§14 No.10, 11, 14）は本 Task で未実施であることを PR に明記している"
  - "テストが本番 DB / 外部 API / secret に依存していない"
  - "Orchestrator 本体の不要な機能変更を含まない（テスト成立に必要な最小修正のみ）"
  - "epic_scope 外（api 層・他 MOD 本体・OpenAPI / DB）の変更を含まない"
  - "secret、APIキー、.env 実値が含まれていない"

