      purpose: "テスト対象"
    - path: "apps/reco/src/reco/application/recommendation-orchestrator/ports.py"
      required: true
      purpose: "ポートモック設計"
    - path: "apps/reco/src/reco/application/recommendation-orchestrator/stubs.py"
      required: true
      purpose: "スタブ利用・失敗注入"
    - path: "apps/reco/tests/unit/application/test_recommendation_orchestrator.py"
      required: true
      purpose: "既存スモークテスト（拡充起点）"
  issues:
    - number: 766
      purpose: "前提 Task（実装）"
    - number: 758
      purpose: "前提 Task（モジュール仕様書）"
  prs:
    - number: 770
      purpose: "前提 PR（実装）"

output:
