  title: "MOD-RECO-001:Recommendation Orchestrator実装"
  summary: "MOD-RECO-001（Recommendation Orchestrator / 推薦実行制御）のモジュール仕様書に基づき、apps/reco/src/reco/application/recommendation-orchestrator/** に実行制御本体（処理順序・実行コンテキスト・下位モジュール委譲ポート）を実装する。"

