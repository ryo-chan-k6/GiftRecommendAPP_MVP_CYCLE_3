background: |
  Epic #260 配下で MOD-RECO-001 モジュール仕様書（#758 / PR #760）および Reason fallback 後続 docs 整合（#764 / PR #765）が完了した。
  本 Task では、モジュール仕様書 §4〜§13 に基づき Recommendation Orchestrator 本体を `apps/reco/src/reco/application/recommendation-orchestrator/**` に実装する。
  下位 MOD-RECO-002〜029 は別 Epic のため、本 Task では **ポート（interface）定義＋スタブ実装**（または既存 `pipeline/**` スキャフォールドへの暫定委譲）で呼び出し順序・失敗時中断を満たす。
  API-INT-002 エンドポイント層（`apps/reco/src/reco/api/**`）からの接続は [Epic]API-INT-002 配下 Task とする。

objective: |
  MOD-RECO-001 Recommendation Orchestrator の実行制御ロジックを実装し、Recoモジュール一覧 §5.2 の処理順序どおりに下位モジュールを呼び出し、正常時は Recommendation Result を、異常時は MOD-RECO-024 経由の標準化エラーを返却できる状態にする。
  Reason 回復不能時は §10.3 に従い汎用 Reason を注入する。

scope:
  - "Recommendation Orchestrator 本体の新規実装（`apps/reco/src/reco/application/recommendation-orchestrator/**`）"
  - "実行コンテキスト（execution_context）の初期化と下位モジュールへの受け渡し"
  - "Recoモジュール一覧 §5.2 に準拠した処理順序制御（MOD-RECO-002〜023 の同期呼び出し）"
  - "実行モード（ui / evaluation / batch）の判定と MOD-RECO-003 への mode 受け渡し"
  - "フェーズ境界での MOD-RECO-028 Phase Log Writer への記録依頼（委譲）"
  - "失敗時の MOD-RECO-024 Reco Error Handler 経由のエラー伝播"
  - "Reason fallback 注入ロジック（§10.3 / Reason生成定義書 §17.2 汎用 Reason 文）"
  - "下位モジュール用ポート（Protocol / interface）定義とスタブ実装（MVP）"
  - "既存 `apps/reco/src/reco/pipeline/**` との接続方針の実装（暫定委譲可。epic_scope 内）"
  - "必要最小限の domain 型・コンテキスト補助（`apps/reco/src/reco/domain/**`、Orchestrator 利用に限定）"
  - "Task / Review Definition 整備（本ファイルおよび必要に応じて pr-review 更新）"

out_of_scope:
  - "他 Recoモジュール（MOD-RECO-002〜029）本体の本格実装"
  - "API-INT-002（Reco推薦実行）エンドポイント層の設計・実装（`apps/reco/src/reco/api/**`）"
  - "API-PUB-002（Public API）の設計・実装"
  - "apps/api / apps/web / apps/batch の実装"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema 変更・migration / DDL"
  - "単体テスト Task 相当の網羅的テスト追加（後続 unit-test Task で実施）"
  - "性能要件（バックエンド）§5 の確定値反映（PoC #759 後）"
  - "Orchestrator 内のパイプライン自動リトライ（MVP では行わない）"

