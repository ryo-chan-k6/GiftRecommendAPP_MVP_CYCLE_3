risk_points:
  - "Orchestrator の責務として Phase Log / Error Handling / Retry をどこまで含めるかで他モジュール（MOD-RECO-024 Reco Error Handler / MOD-RECO-028 Phase Log Writer）との責務境界が曖昧になる可能性"
  - "Orchestrator の物理配置パスが未確定（apps/reco/src/modules/recommendation-orchestrator/** を想定）"
  - "推薦パイプライン全体の処理順序が他定義書（処理構成定義書 / 処理フロー概要図 / Retrieval/Matching/Ranking 定義書）と微妙に乖離する可能性"
  - "MOD-RECO-001 だけでなく MOD-RECO-002（Run Recorder）/ MOD-RECO-003（Config Version Resolver）等の呼び出し順序を仕様化する範囲が広がる可能性"

human_decision_points:
