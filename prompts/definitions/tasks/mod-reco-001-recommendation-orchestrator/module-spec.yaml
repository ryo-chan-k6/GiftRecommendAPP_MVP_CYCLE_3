  - "必須 `input.templates` が存在しない場合"
  - "必須 `input.docs` 間に矛盾があり、AI Agent だけで判断できない場合"
  - "Recoモジュール一覧に MOD-RECO-001 が存在しない場合、または MVP対象が ○ ではない場合"
  - "Orchestrator の責務境界（API エンドポイント層 / 他 Recoモジュール本体との切り分け）が確定できない場合"
