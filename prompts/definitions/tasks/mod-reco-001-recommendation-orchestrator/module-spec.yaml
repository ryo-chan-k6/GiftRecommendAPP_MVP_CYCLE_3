schema_version: "1.0"
definition_type: "task"

task:
  id: "task-mod-reco-001-recommendation-orchestrator-module-spec"
  title: "MOD-RECO-001:Recommendation Orchestratorモジュール仕様書作成"
  summary: "MOD-RECO-001（Recommendation Orchestrator / 推薦実行制御）のモジュール仕様書（MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md）を、Recoモジュール一覧・モジュール一覧・処理構成定義書・Retrieval/Matching/Ranking/Reason生成定義書に基づいて作成する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]MOD-RECO-001:Recommendation Orchestrator"
  epic_issue_number: null  # 実Issue起票後に追記。/start-task §5.1 で GitHub 実在確認。
  epic_branch: "feature/epic-<issue-number>-mod-reco-001-recommendation-orchestrator"
  related_issues: []
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  06_実装設計において、apps/reco 実装・単体テスト設計の前提となる Recoモジュール仕様書を作成する。
  本Taskでは、Recoモジュール一覧の MOD-RECO-001（Recommendation Orchestrator / 推薦実行制御、分類: 実行制御、処理種別: OL、MVP対象: ○）を対象に、責務・入出力・処理フロー・依存モジュール（MOD-RECO-002〜029）・例外処理・ログ・テスト観点を整理する。
  本Taskは Orchestrator モジュール本体に責務を限定し、API-INT-002 エンドポイント層（apps/reco/src/app/**）や、他 Recoモジュール（MOD-RECO-002〜029）本体の設計は別Task / 別 Epic として扱う。

objective: |
  MOD-RECO-001（Recommendation Orchestrator）について、apps/reco 実装・単体テスト・レビューが可能な粒度のモジュール仕様書を作成する。
  作成する仕様書は prompts/templates/docs/module-spec.md に準拠する。

scope:
  - "MOD-RECO-001 のモジュール仕様書を新規作成する（成果物ファイル名: MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md）"
  - "モジュール基本情報（モジュールID / モジュール名 / 物理名 Recommendation Orchestrator / 分類: 実行制御 / 処理種別: OL / 配置予定パス / 所属 Epic / MVP対象 / 主な呼び出し元 / 主な呼び出し先）を定義する"
  - "主責務・対象外責務を整理する"
  - "入力（Recommendation Request / Config Version 等）と出力（Recommendation Result / Phase Log / Error Log）を整理する"
  - "依存モジュール（MOD-RECO-002〜029）の呼び出し方向・用途・失敗時の扱いを整理する"
  - "処理仕様（Mermaid 全体フロー、処理ステップ表）を整理する"
  - "状態（実行中 / 成功 / 失敗 / リトライ）と例外（Error Code / 発生条件 / 呼び出し元への返却 / ログ方針）を整理する"
  - "ログ・メトリクス（recommendation_latency_ms / phase_duration_ms / candidate_count 等）を整理する"
  - "性能・非機能（レイテンシ / タイムアウト / リトライ / 並列実行）方針を整理する"
  - "テスト観点（正常系 / 境界値 / 例外系 / 依存モジュール失敗 / DBログ）を整理する"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
  - "他 Recoモジュール（MOD-RECO-002〜029）本体のモジュール仕様書作成"
  - "Batch 側 Recoモジュール（MOD-RECO-026 Item Semantic Generator / MOD-RECO-027 Item Feature Generator 等、処理種別 BT）の仕様化"
  - "API-INT-002（Reco推薦実行 / Internal API）エンドポイント層の設計・実装"
  - "API-PUB-002（Public API）の設計・実装"
  - "apps/reco の実装"
  - "apps/api の実装"
  - "apps/web の実装"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema 変更"
  - "DDL 作成・変更"
  - "推薦アルゴリズムそのもの（Retrieval / Matching / Ranking ロジック）の変更"
  - "Recoモジュール一覧そのものの変更"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/reco/Recoモジュール一覧.md"
      required: true
      purpose: "MOD-RECO-001 のモジュール名（推薦実行制御）/ 物理名（Recommendation Orchestrator）/ 分類（実行制御）/ 処理種別（OL）/ MVP対象（○）と、呼び出す MOD-RECO-002〜029 の責務境界・処理順序を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/モジュール一覧.md"
      required: true
      purpose: "MOD-RECO-001 がモジュール一覧全体の中で占める位置・呼び出し元（MOD-API-005 Reco Client）を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能×モジュール対応表.md"
      required: false
      purpose: "MOD-RECO-001 の API-INT-002 からの呼び出し関係と、推薦パイプライン内の MOD-RECO-019 / MOD-RECO-020 責務分離を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/処理構成定義書.md"
      required: false
      purpose: "Online / Batch 分離方針と推薦パイプライン処理順序の前提を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/処理フロー概要図.md"
      required: false
      purpose: "推薦実行の全体処理フローと Orchestrator の起動位置を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
      purpose: "Orchestrator 内例外の Error Code（GRS-REC-* / GRS-LLM-* / GRS-DB-* 等）参照と、呼び出し元への返却方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: false
      purpose: "Phase Log / Error Log / Metric の出力方針・保存先を確認するため"
    - path: "docs/04_ドメインモデル設計/RecommendationRequest定義書.md"
      required: true
      purpose: "Orchestrator が受け取る Recommendation Request の構造を確認するため"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: true
      purpose: "Orchestrator が返却する Recommendation Result の構造を確認するため"
    - path: "docs/04_ドメインモデル設計/Retrieval定義書.md"
      required: false
      purpose: "Pre Hard Filter / Retrieval / Post Hard Filter の処理順序前提を確認するため"
    - path: "docs/04_ドメインモデル設計/Matching定義書.md"
      required: false
      purpose: "意味一致度・context_score 算出の処理順序前提を確認するため"
    - path: "docs/04_ドメインモデル設計/Ranking定義書.md"
      required: false
      purpose: "final_score・順位決定の処理順序前提を確認するため"
    - path: "docs/04_ドメインモデル設計/Reason生成定義書.md"
      required: false
      purpose: "Reason 生成の呼び出し順序と Response への含め方を確認するため"
  templates:
    - path: "prompts/templates/docs/module-spec.md"
      required: true
      purpose: "モジュール仕様書を標準フォーマットで作成するため"
      applies_to:
        - "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md"
  files: []
  issues: []
  prs: []

output:
  docs:
    - path: "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md"
      action: "create"
      required: true
      template: "prompts/templates/docs/module-spec.md"
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "MOD-RECO-001（Recommendation Orchestrator）モジュール仕様書（ファイル名: MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md）"
  - "責務（主責務 / 対象外責務）"
  - "入出力定義"
