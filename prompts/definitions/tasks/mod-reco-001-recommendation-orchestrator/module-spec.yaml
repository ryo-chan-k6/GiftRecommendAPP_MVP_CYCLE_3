  - "状態・例外整理"
  - "ログ・メトリクス整理"
  - "性能・非機能方針"
  - "テスト観点"
  - "未決事項・人間判断事項の整理"

acceptance_criteria:
  - "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md が作成されている"
  - "prompts/templates/docs/module-spec.md の章構成（§1〜§19）に準拠している"
  - "Recoモジュール一覧の MOD-RECO-001 と矛盾するモジュール名・物理名・分類・処理種別・MVP対象を定義していない"
  - "モジュール一覧の MOD-RECO-001 行と整合している"
  - "API-INT-002 エンドポイント層（apps/reco/src/app/**）の変更を本仕様書の責務範囲に含めていない（module-spec.md §4 注記準拠）"
  - "他 Recoモジュール（MOD-RECO-002〜029）の本体仕様を本仕様書に内包していない"
  - "依存モジュール（MOD-RECO-002〜029）の呼び出し方向・用途・失敗時の扱いが整理されている"
  - "Ranking の責務分離（MOD-RECO-019 Final Score Calculator / MOD-RECO-020 Final Ranker）が Recoモジュール一覧・機能×モジュール対応表と整合している"
  - "Phase Log / Error Log の出力タイミングが整理されている"
  - "Task タイトル・成果物ファイル名が Task Definition設計書 §15.1（共通命名）に従っている"
