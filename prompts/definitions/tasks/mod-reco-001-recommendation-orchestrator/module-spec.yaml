  - "Orchestrator の物理配置パス（apps/reco/src/modules/recommendation-orchestrator/**）の最終確認"
  - "MOD-RECO-002（Run Recorder）/ MOD-RECO-003（Config Version Resolver）等の呼び出しを本仕様書で詳述するか、別 MOD-RECO-* Task に委ねるかの線引き"
  - "推薦パイプライン全体の処理順序が複数の定義書（処理構成定義書 / 処理フロー概要図 / Recoモジュール一覧 §5）の間で矛盾している場合の優先順位"

