background: |
  06_実装設計において、batch 実装・運用の前提となるバッチ仕様書を作成する。
  本Taskでは、バッチ処理一覧の BATCH-001（楽天ジャンル同期Batch）を対象に、処理概要・入出力・依存・冪等性・ログを整理する。
  Batch ID の正本はバッチ処理一覧の `BATCH-*` とする（`BT-*` は Task タイトルに使用しない）。
  Phase4b レーン B1 Fetch の起点仕様書であり、BATCH-002 / BATCH-003 の先行前提となる。

objective: |
  BATCH-001（楽天ジャンル同期Batch）について、実装・レビューが可能な粒度のバッチ仕様書を作成する。

scope:
  - "BATCH-001 のバッチ仕様書を新規作成する（成果物: BATCH-001_楽天ジャンル同期バッチ仕様書.md）"
  - "処理概要・実行トリガー・入出力リソースを整理する"
  - "先行・後続 Batch・冪等キー・ログ・エラーコード参照を整理する"
  - "楽天ジャンル検索API連携・Raw / Staging / external_genre 反映方針を整理する"

out_of_scope:
  - "他 Batch のバッチ仕様書作成"
  - "Python 実装・GitHub Actions workflow YAML の作成"
  - "DB schema 変更"
  - "楽天 API 契約変更"
  - "OpenAPI / Orval / generated 変更"

