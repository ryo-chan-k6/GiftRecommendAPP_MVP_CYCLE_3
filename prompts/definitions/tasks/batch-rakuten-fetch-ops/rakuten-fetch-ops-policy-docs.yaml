  title: "batch-rakuten-fetch-ops:楽天Fetch運用方針docs正本化"
  summary: "決定済みQPS=2等と未確定事項を区別し、取得量・Run分割・paused再開・GHA live条件・QPS=1採否のHuman判断材料を運用手順docsへ正本化する。"
  phase: "15_運用・改善"

work_mode: "ai-agent"

parent:
  epic_id: "epic-batch-rakuten-fetch-ops"
  epic_issue: "[Epic]batch-rakuten-fetch-ops:楽天Fetch運用方針確定"
  epic_issue_number: 1749
  epic_branch: "docs/epic-1749-batch-rakuten-fetch-ops"
