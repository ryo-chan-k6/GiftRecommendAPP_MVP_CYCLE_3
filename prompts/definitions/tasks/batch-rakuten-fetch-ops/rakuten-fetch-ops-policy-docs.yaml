background: |
  楽天APIは常用QPS=2・ハードキャップ10・live時egress IP照合必須・CI live禁止が決定済み。
  Rate Limiter本実装・正式契約反映は完了済み。未確定なのは運用側（取得量上限、Run分割、
  rate_limited→paused後の再開、GHA葉をscaffoldからliveにする条件、安全側QPS=1の採否）である。
  親Epic #1749 は方針正本化が本体。本Taskはその最初の子Taskとして運用方針docsを正本化する。
  統括ロードマップは #1745（formal parentではない。Relationships追跡）。

objective: |
  docs/15_運用・改善/運用手順/ に楽天Fetch運用方針の正本を作成し、
  決定済み前提とHuman判断待ちを区別して後続 batch-live-rakuten-fetch / schedule 判断のゲートを満たす。
  必要最小限の関連ギャップdocs更新を含めてよい。secret実値は一切書かない。

scope:
  - "決定済み前提（QPS=2 / キャップ10 / IP照合 / CI live禁止）の運用docsへの収束"
  - "取得量上限（max_items / max_pages / 対象ジャンル / 004再確認件数）の推奨値と検証用低値の整理"
  - "QPS=2前提の長時間Run分割・同時多発回避の方針"
  - "rate_limited → fetch_cursor.paused と paused/failed 再開の運用手順"
  - "GHA葉ジョブを --scaffold-demo から live にする条件（固定egress設計自体は含めない）"
  - "安全側常用QPS=1の採否をHuman判断材料として明文化"
  - "必要最小限の関連ギャップdocs（例: バッチ外部API本実装ギャップ一覧）更新"
  - "本 Task / Review Definition の維持"

out_of_scope:
  - "BATCH-001〜004のlive切替実装本体（後続 batch-live-rakuten-fetch）"
  - "#1607 本番egress IP / NAT / self-hosted設計・構築"
  - "daily/weekly on.schedule有効化"
  - "GitHub Secrets / Variablesの値の表示・変更"
  - "常用QPSの再改訂（新実験＋新Human決定なし）"
  - "Rate Limiter / HttpRakuten clientの再実装"
  - "OpenAPI / Orval / generated変更"
  - "apps/** / .github/workflows/** の実装変更"

