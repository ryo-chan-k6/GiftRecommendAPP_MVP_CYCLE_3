      purpose: "§13 workflow 分割・Layer1 PR CI"
    - path: "docs/05_アプリケーション設計/テスト/テスト環境設計書.md"
      required: true
      purpose: "Layer1 / Epic D 拡張・agent_test_operations 整合"
    - path: "docs/05_アプリケーション設計/テスト/テスト定義書.md"
      required: true
      purpose: "§4.1 テストレベル・Layer1 単体/mock 結合"
  files:
