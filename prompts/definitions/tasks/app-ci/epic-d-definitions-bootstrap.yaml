    - path: ".github/workflows/ci.yml"
      required: true
      purpose: "現行 CI エントリ・reco-check 配線"
    - path: ".github/workflows/ci-reco.yml"
      required: true
      purpose: "#707 先行成果・Epic D reco 子 Task 前提"

