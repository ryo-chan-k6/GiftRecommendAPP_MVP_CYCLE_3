    - "docs-reviewer-ai"

background: |
  Phase4a（5 foundation Epic #688 / #698 / #710 / #724 / #734、最終 batch #734: 2026-06-24）完了後、
  Epic D（app-ci / Layer1 PR CI）を `/start-epic` する前に Definition 一式を prompts/definitions に整備する。
  実装フェーズ実行プロセス設計書 §6.4（Epic D 後続）、CI・CD方針書 §13（ci-web/api/reco/batch.yml）、
  テスト環境設計書（Layer1 / Epic D 拡張予定）に整合させる。
  `ci-reco.yml` は local-dev-environment Task #707 で先行作成済み。Epic D 子 Task で統合・拡張する。

objective: |
  `prompts/definitions/epics/app-ci/epic.yaml` および子 Task 5件（ci-web / ci-api / ci-reco / ci-batch workflow + app-ci-docs）の
  Task Definition、`prompts/definitions/reviews/app-ci/**` の Review Definition を作成する。
  Epic Definition には Layer1 PR CI 方針・Epic C（Layer2）との分離・`agent_test_operations`（単体/mock 結合）を反映する。
  merge 後、`/start-epic @prompts/definitions/epics/app-ci/epic.yaml` へ進める状態にする。

scope:
  - "Epic Definition 1件（app-ci）"
  - "子 Task Definition 5件（ci-web-workflow / ci-api-workflow / ci-reco-workflow / ci-batch-workflow / app-ci-docs）"
  - "Review Definition: 各 Task pr-review.yaml + Epic epic/pr-review.yaml"
  - "本 bootstrap Task / Review Definition"

out_of_scope:
  - "Epic D 実装（ci-*.yml 本体・ci.yml 配線）— 子 Task `/work-issue` で実施"
  - "Layer2 workflow（test-system.yml / test-reco-quality.yml 等）— Epic C 管轄"
  - "Phase4b 識別子 Epic 実装"
  - "packages/contracts/** 変更・generated 手編集"
  - "Epic B（hosted-dev-environment）— defer"
  - "secret 実値の commit"

