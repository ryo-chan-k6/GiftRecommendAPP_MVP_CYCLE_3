    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Epic D §6.4 / Phase4a 完了前提"
    - path: "docs/05_アプリケーション設計/共通/CI・CD方針書.md"
