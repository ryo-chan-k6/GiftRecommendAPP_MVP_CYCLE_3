  blocking: false

parallel_control:
  exclusive_files:
    - "docs/05_アプリケーション設計/テスト/テスト環境設計書.md"
  conflict_risk: "low"
  blocks: []

review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: true

contract_gate:
  required: false

notes:
  - "D1〜D4 の workflow merge 後が理想だが、骨格先行の docs 更新も可"
