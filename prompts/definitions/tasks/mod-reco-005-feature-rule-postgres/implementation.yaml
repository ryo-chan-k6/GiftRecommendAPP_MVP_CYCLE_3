human_decision_points:
  - "（完了 2026-07-31）feature_integration_rule seed をEpic #1756 / Task #1757で先行し、stgへ48行投入済み"
  - "（確定 2026-07-30）Port の 2 スカラー写像は input_source=relationship_feature / occasion_feature の weight（軸共通）を採用する"

stop_conditions:
