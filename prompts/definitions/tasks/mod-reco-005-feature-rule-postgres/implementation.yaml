    - path: "apps/reco/src/reco/application/external-condition-feature-estimator/ports.py"
      required: true
      purpose: "FeatureRuleRepositoryPort 定義"
    - path: "apps/reco/src/reco/application/external-condition-feature-estimator/in_memory_repository.py"
      required: true
      purpose: "DEFAULT 実装（維持対象）と戻り値形状の参照"
    - path: "apps/reco/src/reco/application/external-condition-feature-estimator/constants.py"
