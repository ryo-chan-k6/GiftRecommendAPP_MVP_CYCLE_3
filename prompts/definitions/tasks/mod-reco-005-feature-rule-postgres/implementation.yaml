    path: null

deliverables:
  - "PostgresFeatureRuleRepository"
  - "production composition への注入"
  - "unit test（repository / composition）"

acceptance_criteria:
  - "production の external_feature_estimator.feature_rules が Postgres 実装である"
  - "DEFAULT composition は InMemoryFeatureRuleRepository のままである"
  - "get_relationship_features / get_occasion_features が semantic_config_version_id + code + is_active で絞り込み、8 Feature を FeatureVector として返す"
  - "該当行が無い場合は None を返し、既存の ExternalFeatureEstimateError 経路を維持する"
  - "get_pair_delta は未定義時に None を返し、呼び出し側の全ゼロ delta 仕様を壊さない"
  - "get_integration_weights は feature_integration_rule から relationship_feature / occasion_feature の weight を読み取り FeatureIntegrationWeights に写像する。行欠損時は DEFAULT_RELATIONSHIP_WEIGHT / DEFAULT_OCCASION_WEIGHT へフォールバックする"
  - "apps/reco unit test（対象 repository / composition）が通る"
  - "migration / seed / OpenAPI 変更がない"
  - "secret / .env 実値を含まない"
  - "Related to #<Task Issue番号>、PR target が親 Epic Branch"

