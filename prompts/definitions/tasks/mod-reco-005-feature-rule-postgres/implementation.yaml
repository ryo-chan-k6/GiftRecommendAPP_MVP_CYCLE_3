schema_version: "1.0"
definition_type: "task"

task:
  id: "task-mod-reco-005-feature-rule-postgres-implementation"
  title: "MOD-RECO-005:Feature Rule Postgres読み取り実装"
  summary: "PostgresFeatureRuleRepository を実装し production composition に注入する。DEFAULT InMemory は維持する。"
  phase: "07_開発・単体テスト"

work_mode: "ai-agent"

parent:
  epic_id: "epic-mod-reco-005-feature-rule-postgres"
  epic_issue: "[Epic]MOD-RECO-005:Feature Rule Postgres読み取り"
  epic_issue_number: 1753
  epic_branch: "feature/epic-1753-mod-reco-005-feature-rule-postgres"
  related_issues:
