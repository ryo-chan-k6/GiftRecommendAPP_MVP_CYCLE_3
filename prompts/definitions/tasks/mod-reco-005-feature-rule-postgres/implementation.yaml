agent:
  primary: "worker-ai"
  support:
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  stg 実測（2026-07-30）で推薦実行が GRS-REC-005 で失敗した。
  error_log の実レコードは以下である。

    error_code        : GRS-REC-005
    error_message     : relationship_rule not found: spouse
    error_detail_json : {"phase_name": "user_feature_generated",
                         "source_module_id": "MOD-RECO-005"}

  build_production_ports は build_default_stub_ports() を起点に一部ポートのみ
  Postgres へ置換しており、MOD-RECO-005 の FeatureRuleRepositoryPort は
  InMemoryFeatureRuleRepository のまま残っている。

  scaffold が保持する code は relationship 4 種（lover / boss / friend_casual / other）
  と occasion 3 種（birthday / thanks / other）に限られる。stg DB には
  relationship_rule 96 / occasion_rule 120 / pair_rule 112 が正しく seed 済みで、
  semantic_config_version_id も一致している。scaffold 未収録 code（例: spouse）を
  選ぶと get_relationship_features() が None を返し ExternalFeatureEstimateError となる。

  feature_integration_rule 48 行の stg 投入後（2026-07-31）も、
  ケースA（spouse）は GRS-REC-005、ケースB（lover）は成功した。
  成否が scaffold の収録有無と一致し、seed 不足ではなく production composition の
  InMemoryFeatureRuleRepository が原因であることを stg 実測で確認済みである。

  RunValidation は既に PostgresRunValidation へ置換済み。本 Task は
  feature_rules（FeatureRuleRepositoryPort）の置換のみを対象とする。

objective: |
  IF-DB-RECO-001 相当の Feature Rule 読み取りを Postgres 実装し、
  production composition の external_feature_estimator.feature_rules へ注入する。
  DEFAULT composition の InMemory 実装は維持する。

scope:
  - "PostgresFeatureRuleRepository の新規作成（relationship_rule / occasion_rule / pair_rule / feature_integration_rule 読み取り）"
  - "build_production_ports で external_feature_estimator.feature_rules を Postgres 実装へ置換"
  - "unit test（repository / composition）"
  - "Task / Review Definition の起票後番号同期"

out_of_scope:
  - "OpenAPI / Orval / generated 変更"
  - "supabase/migrations / supabase/seeds の変更"
  - "feature_integration_rule の seed 追加（別 Issue で先行。本 Task の前提）"
  - "DEFAULT composition の InMemory 実装廃止"
  - "MOD-RECO-006 / 008 / 009 の Postgres 化"
  - "apps/api / apps/web / apps/batch の変更"
  - "Featureルール定義書の値そのものの見直し"
  - "estimator.py / rule_engine.py の計算ロジック変更（Port 契約を満たす読み取りのみ）"

