  - "防御的フォールバック: seed 後も行欠損時は DEFAULT_RELATIONSHIP_WEIGHT / DEFAULT_OCCASION_WEIGHT（0.50）へフォールバックしてよい（実装詳細）"
  - "物理テーブルは 8 feature × 6 input_source = 48 行 / version（テーブル定義書 §11.1 Human Review 決定）"
