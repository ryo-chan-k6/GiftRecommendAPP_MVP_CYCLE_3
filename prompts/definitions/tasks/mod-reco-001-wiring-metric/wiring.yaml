    - "reviewer-ai"
    - "test-ai"

background: |
  Epic 配下の Metric Wiring Task。MOD-RECO-025 §16.3 順序4 に従い、Orchestrator デフォルト composition の metric_logger を本実装へ差し替える。
  `build_default_metric_logger()`（InMemory MetricLoggerRepository）を stubs.py から DI する。
  MetricLogger は Stub 互換の `.recorded` 観察バッファを持つ（025 仕様書 §9.4）。
  Orchestrator 本体（ports.py / orchestrator.py）は MetricLoggerPort 契約が既存のため変更しない。
  integration テスト期待値更新は integration-test Task へ委譲する。
  `stubs.py` は exclusive_files のため Epic 配下で直列実行する。

objective: |
  metric_logger Port を build_default_stub_ports() で MetricLogger 本実装へ差し替える。
  デフォルト経路 integration テストの green 化は integration-test Task に委譲する。

scope:
  - "`apps/reco/src/reco/application/recommendation-orchestrator/stubs.py` の metric_logger Port 差し替え"
  - "`_ensure_metric_logger_package()` / `_build_default_orchestrator_metric_logger()` 等の factory 接続（028/024 パターン準拠）"
  - "metric-logger の `build_default_metric_logger` import と package 読み込み"

out_of_scope:
  - "MOD-RECO-025 モジュール本体の変更"
  - "`ports.py` / `orchestrator.py` の変更（Port 契約は既存）"
  - "`execution_context.py` の型付きフィールド追加"
  - "`test_recommendation_orchestrator.py` の期待値更新（integration-test Task）"
  - "024 / 028 / 029 / phase_log 経路の再配線"
  - "他フェーズ Port の再配線"
  - "`StubMetricLogger` クラスの削除"
  - "段階3 Composition（Postgres Metric Repository）"
  - "MOD-RECO-001 モジュール仕様書 §8.4.2 更新（Epic PR / 別 docs Task）"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / DB schema 変更"

