  - "docs/06_実装設計/reco/MOD-RECO-015_Meaning Match Aggregatorモジュール仕様書.md 更新（用語整合: 重み解決キー / 出力エコー列を matching_config_id に統一、§16.1 No.9 を matching_config と明記）"
