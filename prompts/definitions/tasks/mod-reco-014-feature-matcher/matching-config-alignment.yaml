  現行 MOD-RECO-014 実装は feature_match_result.entries[].model_version_id を出力する（semantic_config_version_id のエコー）。
  Human 判断（2026-07-02）: Matching ロジック version の正本は matching_config_id（案 B）。下流 MOD-RECO-015 の重み解決キーと一致させる必要がある。
  MOD-RECO-015 モジュール仕様書は develop 未反映（Epic #904 / Issue #905 / PR #909）。本 Task は用語整合更新のため当該 docs を develop へ追加・更新する。

objective: |
