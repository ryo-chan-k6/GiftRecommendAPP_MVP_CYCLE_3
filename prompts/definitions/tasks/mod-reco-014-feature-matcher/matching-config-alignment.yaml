  2. apps/reco/src/reco/application/feature-matcher/** を更新し、execution_context.config_versions.matching_config_id を全 entries へエコーする。
  3. MOD-RECO-015 モジュール仕様書の §6 / §8.3.2 用語を matching_config_id に追随更新する（必要最小限）。
  4. pipeline 型定義・関連 stub / test fixture を更新し、MOD-RECO-015 実装 Task の blocking を解消する。

