  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-17"
    due_date: "2026-07-18"

issue:
  unit: "task"
  type: "feature"
  area: "web"

dependencies:
  epics:
    - issue: 1389
      title: "[Epic]SCR-005:推薦理由詳細表示"
      purpose: "親 Epic"
    - issue: 1397
      title: "[Epic]API-PUB-002:Public Reason詳細フィールド追加"
      purpose: "Public フィールド前提（develop merge 済み）"
  issues:
    - number: 1390
      purpose: "画面仕様 Task"
  prs:
    - number: 1392
      purpose: "画面仕様 PR"
    - number: 1400
      purpose: "Contract PR"
  tasks:
    - "画面仕様・Contract が merge 済みであること"
  blocking: true

parallel_control:
  depends_on:
    - "screen-spec"
  blocks:
    - "unit-test"
  exclusive_files:
    - "apps/web/src/features/recommendation-result/**"
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
