  commands:
    - "pnpm --filter @gift-recommendation/web test:component"
  manual_checks: []
  not_required:
    - "e2e"
  skip_reason:
    "e2e": "本 Task は component 単体テスト範囲"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "§8.3.1 優先順位が実装されているか"
    - "専用 route を新設していないか"
    - "OpenAPI / api を変更していないか"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: false

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の実装 Task。作業計画は Issue、レビューは PR を正本とする。"

stop_conditions:
  - "Contract が未完了で reasonPoints / reasonDetail 型が無い場合"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "Issueタイトル: [Task]SCR-005:推薦理由詳細表示実装"
