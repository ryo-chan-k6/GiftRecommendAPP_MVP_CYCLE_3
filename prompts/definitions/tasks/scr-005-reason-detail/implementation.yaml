schema_version: "1.0"
definition_type: "task"

task:
  id: "task-scr-005-reason-detail-implementation"
  title: "SCR-005:推薦理由詳細表示実装"
  summary: "SCR-005（推薦理由詳細表示）を apps/web に実装する。画面仕様書に基づき reasonPoints / reasonDetail を含む展開パネルを recommendation-result 内で提供し、回帰テストを追加する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]SCR-005:推薦理由詳細表示"
  epic_issue_number: 1389
  epic_branch: "feature/epic-1389-scr-005-reason-detail"
  related_issues:
    - number: 1402
      purpose: "本 Task Issue"
    - number: 1389
      purpose: "親 Epic"
    - number: 1390
      purpose: "前提 Task（画面仕様書）"
    - number: 1397
      purpose: "前提 Contract Epic（Public reasonPoints/reasonDetail）"
  related_prs:
    - number: 1392
      purpose: "画面仕様書 Task PR（親 Epic Branch merge 済み）"
    - number: 1400
      purpose: "Contract Epic PR（develop merge 済み）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  SCR-005 Epic（#1389）の実装 Task。画面仕様書（#1390 / PR #1392）および Contract（#1397 / PR #1400）が merge 済みであることを前提に着手する。
  既存アコーディオンを ReasonDetailPanel へ切り出し、§8.3.1 優先順位で描画する。

objective: |
  SCR-005 の推薦理由詳細 UI を仕様書どおり apps/web 上で提供し、points / detail / caution / 薄いとき再掲を回帰テスト可能な形で固定する。

scope:
  - "ReasonDetailPanel の追加と RecommendationResultItem 配線"
  - "reasonPoints / reasonDetail / cautionNote の優先順位表示"
  - "薄い詳細時の要約・バッジ再掲と案内文"
  - "component test の追加・更新"
  - "Task / Review Definition 整備"

out_of_scope:
  - "専用 route / モーダルページの新設"
  - "OpenAPI / generated / apps/api / apps/reco / apps/batch の変更"
  - "SCR-006 理由詳細導線の本実装"
  - "apps/web/src/features/recommendation-input/** の変更"
  - "網羅的 E2E（D2）"
  - "画面仕様書の大幅改訂"

input:
  docs:
    - path: "docs/06_実装設計/web/SCR-005_推薦理由詳細表示画面仕様書.md"
      required: true
      purpose: "実装正本"
    - path: "docs/06_実装設計/web/SCR-004_レコメンド結果一覧画面画面仕様書.md"
      required: true
      purpose: "ホスト画面・§7.4 との整合"
  templates: []
  files:
    - path: "apps/web/src/features/recommendation-result/**"
      required: true
      purpose: "実装対象"
  issues:
    - number: 1390
      purpose: "画面仕様 Task"
    - number: 1397
      purpose: "Contract Epic"
  prs:
    - number: 1392
      purpose: "画面仕様 PR"
    - number: 1400
      purpose: "Contract PR"

output:
  docs: []
  files:
    - path: "apps/web/src/features/recommendation-result/**"
      action: "create_or_update"
      required: true
  tests:
    - path: "apps/web/tests/component/recommendation-result/**/*.{test,spec}.{ts,tsx}"
      action: "create_or_update"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "SCR-005 展開パネル実装"
  - "component test"

acceptance_criteria:
  - "reasonPoints / reasonDetail が表示される"
  - "詳細が薄いとき要約再掲＋案内文が表示される"
  - "pnpm --filter @gift-recommendation/web test:component が通る"
  - "epic_scope.allowed_paths 外へ変更していない"
  - "secret / .env 実値を含んでいない"

branch:
  no_branch: false
  name: "feature/task-1402-scr-005-reason-detail-implementation"
  base: "feature/epic-1389-scr-005-reason-detail"
  target: "feature/epic-1389-scr-005-reason-detail"
  worktree_required: true

