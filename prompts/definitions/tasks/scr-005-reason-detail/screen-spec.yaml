  title: "SCR-005:推薦理由詳細表示画面仕様書作成"
  summary: "SCR-005（推薦理由詳細表示）の画面仕様書を、画面一覧・画面遷移図・SCR-004画面仕様書・API-PUB-002契約・Reason生成定義書に基づいて作成する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]SCR-005:推薦理由詳細表示"
  epic_issue_number: 1389
  epic_branch: "feature/epic-1389-scr-005-reason-detail"
  related_issues:
    - number: null
      purpose: "本 Task Issue（起票後に同期）"
    - number: 1389
      purpose: "親 Epic"
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
