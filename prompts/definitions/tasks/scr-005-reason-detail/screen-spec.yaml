agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  06_実装設計において、web 実装の前提となる画面仕様書を作成する。
  SCR-005 は独立 URL 画面ではなく、SCR-004 内 Item 単位アコーディオンとして扱う（SCR-004 §7.4）。
  D1 S5（理由詳細）は pass 済み。本 Task で正本仕様を固定し、Public フィールド欠落時の MVP 方針を明示する。

objective: |
  SCR-005（推薦理由詳細表示）について、実装・レビューが可能な粒度の画面仕様書を作成する。
  作成する仕様書は prompts/templates/docs/screen-spec.md に準拠する。

scope:
  - "SCR-005 の画面仕様書を新規作成する（成果物: SCR-005_推薦理由詳細表示画面仕様書.md）"
  - "画面目的・対象ユーザー・表示項目を整理する"
  - "アコーディオン部品であること（独立 URL / モーダル専用ページではないこと）を整理する"
  - "SCR-004 ホスト画面との分担（カード上要約 vs 展開詳細）を整理する"
  - "Public に存在する reasonSummary / reasonBadges / cautionNote / isFallback の表示方針を整理する"
  - "Public に無い reason_points / reason_detail の MVP 扱いを明示する（Human Review 観点）"
  - "既存実装ギャップ（詳細文なし案内のみ等）を実装 Task 向けに整理する"

out_of_scope:
  - "他画面（SCR-005 以外）の画面仕様書作成（SCR-004 は参照のみ。必要最小限の相互参照追記は可）"
  - "専用 route / モーダル専用ページの新設・実装"
  - "OpenAPI / generated / ソースコード実装"
  - "Reason 永続（reco/DB）・API-PUB-002 契約変更"
  - "SCR-006 / SCR-007 / SCR-009 の本仕様変更"
  - "apps/web/src/features/recommendation-input/** の変更"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
      purpose: "SCR-005 の画面ID・表示項目・操作・MVP対象を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
      purpose: "部品／モーダル扱いと遷移を確認するため"
    - path: "docs/06_実装設計/web/SCR-004_レコメンド結果一覧画面画面仕様書.md"
      required: true
      purpose: "アコーディオン方針 §7.4 とホスト分担を確認するため"
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
      required: true
      purpose: "Public Item 理由フィールドを確認するため"
    - path: "docs/04_ドメインモデル設計/Reason生成定義書.md"
      required: true
      purpose: "理由項目の意味を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/デザインルール.md"
      required: true
      purpose: "展開・注意表示のデザイン方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/UIコンポーネント一覧.md"
      required: true
      purpose: "Alert / ReasonSummary 等の部品を確認するため"
    - path: "docs/06_実装設計/cross_cutting/レーン1e_手動E2Eチェックリスト.md"
      required: false
      purpose: "D1 S5 合格条件との整合を確認するため"
  templates:
    - path: "prompts/templates/docs/screen-spec.md"
      required: true
      purpose: "画面仕様書の章構成テンプレート"
  files:
    - path: "apps/web/src/features/recommendation-result/**"
      required: false
      purpose: "既存アコーディオン実装とのギャップ把握"
  issues:
    - number: 1389
      purpose: "親 Epic"
  prs: []

output:
  docs:
    - path: "docs/06_実装設計/web/SCR-005_推薦理由詳細表示画面仕様書.md"
