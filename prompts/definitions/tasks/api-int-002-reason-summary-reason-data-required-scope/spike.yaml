background: |
  API-INT-002 契約仕様書 §14 の未決事項 No.4（`reasonSummary` / `reasonData` の必須/任意）を個別 Issue #376 で管理する。
  Internal API（reco→api）では、Item 単位の `reasonSummary` / `reasonBadges` / `reasonStatus` と、Run または Item に紐づく内部 `reasonData` の契約上の必須度・スキーマが未確定である。
  Reason 生成のみ失敗した場合に Item を残し `reasonSummary` を省略するか、代替表示を返すかは Human Review が必要（Recommendation Result 定義書 §11.2、Reason生成定義書 §5 参照）。
  Public API（API-PUB-002）への露出項目は本 Task では参照整理のみとし、Public 契約仕様書の新規作成は対象外とする。

objective: |
  Internal API における `reasonSummary` / `reasonData` の必須・任意、Reason 生成のみ失敗時の省略ルール、`reasonData` スキーマ（Reason生成定義書 §5 との対応）を Human 判断で確定し、正本 docs へ反映する。
  確定内容は API-INT-002 契約仕様書 §7.3.2（resultItems）および必要に応じ §7.3.x（reasonData スキーマ節）・§14.1 へ記載する。
  OpenAPI（`internal-reco-api.yaml`）への機械可読反映は **別 Contract Task** とする（#373 と同方針）。

scope:
  - "§14 No.4 の論点整理（現行 §7.3.2 の reason 関連項目、Run レベル reasonData、Reason生成定義書 §5 との差分）"
  - "Human 判断待ちの選択肢・推奨案を整理し、確定後に契約仕様書へ反映する"
  - "確定方針を API-INT-002 契約仕様書 §7.3.2 および reasonData スキーマ節（§7.3.x 新設または既存節追記）に記載する"
  - "§14 No.4 を確定済み（§14.1）へ移し、未決一覧から除外する"
  - "ai-logs/human-decisions/ に判断記録を作成する"
  - "Issue #376 完了条件（人間判断・docs 反映）を満たす"

out_of_scope:
  - "OpenAPI（packages/contracts/openapi/internal-reco-api.yaml）の変更"
  - "Orval 再生成・generated API client の変更"
  - "apps/reco / apps/api / apps/web の実装変更"
  - "Reason 生成ロジック（MOD-RECO 等）の実装・設計変更"
  - "API-PUB-002 契約仕様書の新規作成（参照・整合確認の追記のみ可）"
  - "Recommendation Result / Reason生成定義書の大規模改訂（契約仕様書からの参照追記・最小整合のみ可）"
  - "DB schema 変更"

