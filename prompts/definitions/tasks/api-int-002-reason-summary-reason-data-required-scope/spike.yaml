  summary: "API-INT-002 契約仕様書 §14 No.4（Internal の reasonSummary / reasonData 必須・任意、Reason 生成のみ失敗時の省略可否、reasonData スキーマ）を Human 判断で確定し、契約仕様書 §7.3 および §14 へ反映する（docs のみ。実装・OpenAPI 変更は対象外）。"

work_mode: "human-led"

