background: |
  Epic #788 配下のフェーズ Wiring Task である。MOD-RECO-001 モジュール仕様書 §8.4 に従い、各モジュール implementation Task 完了後に `recommendation-orchestrator/stubs.py` の `build_default_stub_ports()` で User Meaning フェーズ Port を本実装へ差し替える。
  `StubXxx` クラスは削除せず、失敗注入・明示 DI テスト用に残す（§8.4.1）。
  起動フェーズ（002 / 003）は配線済みのため変更しない。
  `stubs.py` は `exclusive_files` のため、本 Task は Epic 配下で直列実行する。

objective: |
  User Meaning フェーズ 7 Port（004〜010）を `build_default_stub_ports()` で本実装 factory に差し替え、Orchestrator デフォルト経路が実モジュールを参照する状態にする。
  デフォルト経路テストの期待値更新は後続 integration-test Task に委譲する。

scope:
  - "`apps/reco/src/reco/application/recommendation-orchestrator/stubs.py` の User Meaning フェーズ Port 差し替え"
  - "対象 Port: user_semantic_extractor, external_feature_estimator, internal_feature_estimator, user_feature_generator, user_meaning_projector, user_context_builder, query_embedding_generator"
  - "各モジュールの `build_default_*` factory（in-memory MVP composition）の import と `_ensure_*` パッケージ読み込み（002 / 003 と同パターン）"
  - "必要に応じた `recommendation-orchestrator/__init__.py` の export 整理（epic_scope 内）"

out_of_scope:
  - "MOD-RECO-004〜010 モジュール本体の変更"
  - "起動フェーズ（002 / 003）の再配線"
  - "Retrieval 以降フェーズの Port 差し替え"
  - "`StubXxx` クラスの削除"
  - "Orchestrator デフォルト経路テストの期待値更新（integration-test Task）"
  - "段階3 Composition 完成（本番 DI / DB Repository）"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema 変更"

