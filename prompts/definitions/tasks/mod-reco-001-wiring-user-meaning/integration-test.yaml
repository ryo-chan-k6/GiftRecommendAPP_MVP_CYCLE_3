background: |
  Epic #788 配下で wiring Task により `build_default_stub_ports()` の User Meaning フェーズ Port が本実装へ差し替えられた後、Orchestrator デフォルト経路テストの期待値を更新する。
  モジュール仕様書 §8.4.3 では、各モジュール implementation Task に明示 DI による Orchestrator 統合テストを必須成果物としている。本 Task は **デフォルト composition 経路**（build_default_stub_ports）の検証を担当する。

objective: |
  配線後の Orchestrator デフォルト経路テストを green にし、User Meaning フェーズ 7 モジュールがデフォルト composition で正しく呼び出されることを pytest で検証する。

scope:
  - "`apps/reco/tests/unit/application/test_recommendation_orchestrator.py` の期待値更新・ケース追加"
  - "User Meaning フェーズ配線後のデフォルト経路（build_default_stub_ports）の検証"
  - "completed_modules / ExecutionContext キー等、本実装 Port に合わせたアサーション整理"
  - "テスト用 fixture / helper の最小限整理（Orchestrator デフォルト経路専用）"

out_of_scope:
  - "stubs.py の Port 差し替え（wiring Task）"
  - "MOD-RECO-004〜010 モジュール本体の変更（テスト成立に必要な最小修正のみ可。要 PR 説明）"
  - "integration test（E2E）/ contract test"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / DB schema 変更"
  - "本番 DB / 外部 API 依存テスト"
  - "段階3 Composition 完成（本番 DI）"

