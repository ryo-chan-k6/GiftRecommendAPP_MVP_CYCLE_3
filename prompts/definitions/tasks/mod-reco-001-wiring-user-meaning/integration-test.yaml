  - "デフォルト経路テストが User Meaning フェーズ 7 モジュールの本実装呼び出しを反映している"
  - "stubs.py に変更がない（またはテスト成立に必要な最小修正のみで PR に説明がある）"
  - "MOD-RECO-004〜010 モジュール本体への不要な変更がない"
  - "テストが本番 DB / 外部 API / secret に依存していない"
