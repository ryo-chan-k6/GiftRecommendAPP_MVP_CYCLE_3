  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-15"
    due_date: "2026-07-18"

issue:
  number: 1333
  unit: "task"
  type: "feature"
  area: "batch"

dependencies:
  epics:
    - issue: 1307
      title: "[Epic]BATCH-005:Raw取込・Staging変換Batch"
      purpose: "親 Epic"
  issues:
    - number: 1317
      purpose: "仕様書（CLOSED）"
  prs:
    - number: 1319
      purpose: "仕様書 MERGED"
  blocking: false

contract_gate:
  required: false

parallel_control:
  depends_on:
    - "task-batch-005-raw-staging-batch-spec"
  blocks:
    - "task-batch-005-raw-staging-unit-test"
  exclusive_files:
    - "apps/batch/src/batch/application/raw_staging/**"
    - ".github/workflows/batch-rakuten-raw-staging.yml"
  conflict_risk: "medium"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
    - "batch unit test（BATCH-005 最小）"
    - "secret check"
  commands:
    - "cd apps/batch && uv sync --extra dev"
    - "cd apps/batch && uv run python -m pytest tests/unit/application/test_raw_staging.py -q --tb=short"
  not_required:
    - "integration test（実 Object Storage / 本番 DB）"
    - "contract test"
  skip_reason:
    "integration test（実 Object Storage / 本番 DB）": "fixture/mock / scaffold を正とする"
    "contract test": "Batch は HTTP API 化しないため対象外"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "仕様書 Phase・Staging 境界と実装が整合するか"
    - "Item / product_diff_result / active_status / external_genre を更新していないか"
    - "他 Batch application（genre_sync 等）を編集していないか"
    - "親 workflow チェーンを改修していないか"
    - "secret 非含有 / PR target が親 Epic Branch か"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: true
  reason: "識別子単位 Batch 実装の縦串"

human_decision_points:
  - "独立 YAML（batch-rakuten-raw-staging.yml）方針で実装する（仕様§18.1 No.1・merge 採用）"
  - "Raw 選定既定（raw_saved / item_search 優先）で実装する（仕様§18.1 No.2・merge 採用）"
  - "包括的 UT は後続 unit-test Task に分離する"

stop_conditions:
  - "必須 input.docs（バッチ仕様書）が存在しない場合"
  - "親 Epic Issue / Branch が未確定の場合"
  - "OpenAPI / generated / migration 変更が必要になった場合"
  - "epic_scope.allowed_paths 外の編集が必要になった場合"
  - "他 Batch application / 親チェーン YAML 編集が必要に見える場合"
  - "external_genre Upsert を本 Task に含める必要が出た場合"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "Issueタイトル: [Task]BATCH-005:Raw取込・Staging変換Batch実装"
  - "Issue: #1333 / Branch: feature/task-1333-batch-005-raw-staging-implementation / base: feature/epic-1307-batch-005-raw-staging"
