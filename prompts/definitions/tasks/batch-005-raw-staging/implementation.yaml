schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-005-raw-staging-implementation"
  title: "BATCH-005:Raw取込・Staging変換Batch実装"
  summary: "BATCH-005（Raw取込・Staging変換Batch）を仕様書に基づき apps/batch へ実装する。Raw読取・Staging変換・検証・upsert・import_status=staged、独立 workflow を対象とする。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]BATCH-005:Raw取込・Staging変換Batch"
  epic_issue_number: 1307
  epic_branch: "feature/epic-1307-batch-005-raw-staging"
  related_issues:
    - number: 1317
      purpose: "バッチ仕様書（CLOSED / Epic Branch merge 済み）"
  related_prs:
    - number: 1319
      purpose: "バッチ仕様書 PR（MERGED）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Phase4b Raw/Staging 段。仕様書 #1317 / PR #1319 は Epic Branch merge 済み。
  BATCH-004 同型の単一 Job（raw_staging）で plan→read→transform→validate→persist→status→finalize を実装する。
  Contract Gate 不要。unit は fixture / mock 正。包括的 UT は後続 unit-test Task。
  Human merge に伴い、§18.1 No.1（独立 YAML）/ No.2（Raw 選定既定）を実装の作業仮定として採用する。

objective: |
  BATCH-005 について、仕様書の処理ステップを apps/batch 上で実行可能な実装と、
  起動用独立 workflow（batch-rakuten-raw-staging.yml）を整備する。
  Item / product_diff_result / item.active_status / external_genre は更新しない。

scope:
  - "BATCH-005 ジョブ application 実装（raw_staging: plan / read / transform / validate / persist / status / finalize）"
  - "Raw Product Reader（Object Storage GET・content_hash 照合）"
  - "Staging Transformer / Validator / Repository（staging_item / staging_item_image 必須。ranking/genre は最小対応可）"
  - "Normalized Payload Builder / Normalized Hash Calculator（staging_item.normalized_hash）"
  - "raw_product_metadata.import_status=staged 更新"
  - "batch_run_log / phase_log / error_log 連携"
  - "config: BATCH_RAW_STAGING_MAX_RAW / BATCH_RAW_STAGING_SOURCE_API 等"
  - ".github/workflows/batch-rakuten-raw-staging.yml（workflow_call / workflow_dispatch）"
  - "最小 unit test（正常系 item_search・hash・冪等 upsert・Item非更新・import_status）"
  - "Task / Review Definition"

out_of_scope:
  - "バッチ仕様書の全面書き換え（軽微な実装追随注記以外）"
  - "他 Batch 実装の破壊変更（genre_sync / ranking_snapshot / item_pseudo_diff / item_recheck / item_active_status）"
  - "親 item-import / existing-item-recheck チェーン workflow 全体改修・配線"
  - "OpenAPI / Orval / generated / DB migration"
  - "楽天 API 呼出・課金影響のある実呼出検証"
  - "Item / product_diff_result / item.active_status 本更新"
  - "external_genre Upsert（BATCH-001。§18.2 No.D）"
  - "attribute_search / staging_attribute（MVP 主線外）"
  - "包括的 UT Task（後続 unit-test Task）"
  - "BATCH-006 Diff / BATCH-007 Item 反映 / BATCH-008 active_status"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-005_Raw取込・Staging変換バッチ仕様書.md"
      required: true
      purpose: "実装の正本"
    - path: "docs/06_実装設計/database/staging_item_テーブル定義書.md"
      required: true
      purpose: "UNIQUE / normalized_hash / diff_status=NULL"
    - path: "docs/06_実装設計/database/staging_item_image_テーブル定義書.md"
      required: true
      purpose: "画像 upsert + §5.8 同期 DELETE"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "Normalized Payload / hash §6.4"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-005 入出力境界"
    - path: "docs/06_実装設計/database/raw_product_metadata_テーブル定義書.md"
      required: false
      purpose: "import_status 遷移"
  templates: []
  files:
    - path: "apps/batch/src/batch/application/item_recheck/**"
      required: true
      purpose: "同型 Job 参照のみ（編集禁止）"
    - path: "apps/batch/src/batch/infrastructure/object_storage/**"
      required: true
      purpose: "Raw GET"
    - path: "apps/batch/src/batch/infrastructure/db/**"
      required: false
      purpose: "DbWriter / upsert 補助"
  issues:
    - number: 1317
      purpose: "仕様書"
  prs:
    - number: 1319
      purpose: "仕様書 MERGED"

output:
  docs: []
  files:
    - path: "apps/batch/src/batch/application/raw_staging/**"
      action: "create"
      required: true
    - path: "apps/batch/src/batch/config/**"
      action: "update"
      required: true
    - path: "apps/batch/src/batch/infrastructure/object_storage/**"
      action: "update"
      required: false
    - path: "apps/batch/src/batch/infrastructure/db/**"
      action: "update"
      required: false
    - path: ".github/workflows/batch-rakuten-raw-staging.yml"
      action: "create"
      required: true
    - path: "prompts/definitions/tasks/batch-005-raw-staging/implementation.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-005-raw-staging/implementation/pr-review.yaml"
      action: "create"
      required: true
  tests:
    - path: "apps/batch/tests/unit/application/test_raw_staging.py"
      action: "create"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "BATCH-005 Raw取込・Staging変換ジョブ実装"
  - "batch-rakuten-raw-staging.yml"
  - "最小 unit test（fixture / mock）"

acceptance_criteria:
  - "仕様書主要 Phase（plan/read/transform/validate/persist/status/finalize）がコード上で追跡できる"
  - "item_search 主経路で staging_item（+ image）upsert と normalized_hash 保存ができる"
  - "diff_status を確定せず NULL（または未設定）のままにできる"
  - "成功時 raw_product_metadata.import_status を staged 相当に更新できる（scaffold 上で検証）"
  - "Item / product_diff_result / item.active_status / external_genre を本 Batch で更新しない"
  - "Raw Object Storage は read-only（put/delete しない）"
  - "楽天 API を呼ばない"
  - ".github/workflows/batch-rakuten-raw-staging.yml が存在し workflow_dispatch / workflow_call を持つ"
  - "secret / .env 実値を含まない"
  - "OpenAPI / generated / migration / 他 Batch application を変更していない"
  - "親 Epic allowed_paths 外を編集していない"
  - "最小 unit test がローカルで実行可能である"

branch:
  no_branch: false
  name: "feature/task-1333-batch-005-raw-staging-implementation"
  summary: "batch-005-raw-staging-implementation"
  base: "feature/epic-1307-batch-005-raw-staging"
  target: "feature/epic-1307-batch-005-raw-staging"
  worktree_required: true

