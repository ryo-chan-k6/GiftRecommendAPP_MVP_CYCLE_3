background: |
  レーン 0a（#1133）で smoke-check / docs 整合、0b（#1135）で api/reco 最小 health は完了済み。
  API-PUB-002（#357）は develop merge 済みだが、ローカルで Recommendation Run 縦串を再現・確認する作業は未 Task 化だった。
  実装フェーズ並列計画（2026-07-10 Human 判断）により、レーン 0c として明示 Task 化する。
  Epic #651 Reopen は行わず、develop ベース・develop 向け PR の横断 follow-up とする。

objective: |
  master seed + test-data seed 適用後、api / reco 起動上で API-PUB-002 Recommendation Run をローカル実行する。
  成功条件・失敗時の既知ギャップを PR 本文と手順書に記録し、縦串に必要な最小 test-data / 手順ギャップを埋める。

scope:
