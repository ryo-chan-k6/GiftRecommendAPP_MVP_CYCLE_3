  - "成功条件・失敗時の既知ギャップを PR 本文と手順書に記録"
  - "縦串に必要な最小 test-data ギャップ埋め（`supabase/seeds/test-data/**` / 手順書。広げすぎない）"
  - "`docs/06_実装設計/cross_cutting/ローカル開発手順書.md` / `scripts/dev/README.md` / `scripts/db/README.md` の必要更新"
  - "Task / Review Definition 整備"

out_of_scope:
