      action: "update"
      required: true
    - path: "prompts/definitions/tasks/local-dev-environment/ci-contract-node-align.yaml"
      action: "create_or_update"
      required: true
    - path: "prompts/definitions/reviews/local-dev-environment/ci-contract-node-align/pr-review.yaml"
      action: "create_or_update"
      required: true

acceptance_criteria:
  - "`ci-contract.yml` の `node-version` が Node 24 LTS（開発正本と major 一致）である"
  - "利用技術スタック整理表 §15 に ci-contract との一時差分注記が残っていない"
  - "OpenAPI 検証・Orval generate・generated diff 検証の workflow ステップ構成が維持されている"
  - "secret 実値が含まれていない"
  - "Task PR target が親 Epic Branch"

