    - "Postgres compose が混入していないか"
    - "Phase3a 2026-06-07 判断との supersede 関係が明確か"
    - "Neon 記載が残っていないか（Redis/DB 節）"
    - "secret / .env 実値の記載がないか"
  specialist_reviews:
