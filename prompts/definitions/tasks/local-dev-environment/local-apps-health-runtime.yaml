  epic_issue: "[Epic]local-dev-environment:ローカルdev実行環境"
  epic_issue_number: 651
  epic_branch: "develop"
  related_issues:
    - number: 651
      purpose: "履歴参照（Epic クローズ済み）。PR 本文は Related to #651"
    - number: 1133
      purpose: "先行 follow-up（検証・docs）。本 Task はその残課題"
    - number: 384
      purpose: "API-PUB-001 Epic（本格実装は別途。本 Task は最小 health）"
    - number: 391
      purpose: "API-INT-001 Epic（本格実装は別途。本 Task は最小 health）"
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

