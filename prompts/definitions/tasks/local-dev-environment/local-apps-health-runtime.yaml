  primary: "worker-ai"
  support:
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  Task #1133 で smoke-check / docs 整合は完了。api / reco の `dev` は placeholder のまま health 200 未達。
  Human 判断により、PUB-001 / INT-001 本格 Epic を待たず local-dev follow-up として最小 HTTP サーバ + OpenAPI 準拠 health を整備する。
  Epic #651 Reopen は行わず、develop ベース・develop 向け PR とする。

objective: |
  `start-api.sh` / `start-reco.sh` で api（3001）/ reco（8000）が待受し、
  `GET /api/v1/health` と `GET /internal/reco/v1/health`（Internal API Key）が HTTP 200 を返す。
  `smoke-check.sh`（apps 含む）で ok を確認し、手順書を更新する。

scope:
  - "`apps/api`: Express エントリ + GET /api/v1/health（public-api.yaml / API-PUB-001）+ package.json `dev` 差し替え"
  - "`apps/reco`: GET /internal/reco/v1/health（internal-reco-api.yaml / API-INT-001・X-Internal-Api-Key）+ uvicorn 起動の `dev` 差し替え"
  - "`scripts/dev/start-api.sh` / `start-reco.sh` の必要最小限整備（.env 読込等）"
  - "`docs/06_実装設計/cross_cutting/ローカル開発手順書.md` / `scripts/dev/README.md` 更新"
  - "Task / Review Definition 整備"
  - "smoke-check で api / reco health 200 を確認し PR 本文に記録"

out_of_scope:
  - "API-PUB-001 / API-INT-001 実装仕様書の新規作成"
  - "レコメンド縦串 E2E / test-data 拡充"
  - "OpenAPI / Orval / generated 変更"
  - "CI workflow 追加・変更"
  - "Epic #651 Reopen"
  - "`supabase/migrations/**` 変更"
  - "batch 本格起動"
  - "recommendations 以外の Public API 本格実装"

input:
  docs:
    - path: "docs/06_実装設計/cross_cutting/ローカル開発手順書.md"
      required: true
    - path: "docs/06_実装設計/api/API-PUB-001_APIヘルスチェックAPI契約仕様書.md"
      required: true
    - path: "docs/06_実装設計/api/API-INT-001_RecoヘルスチェックAPI契約仕様書.md"
      required: true
    - path: "packages/contracts/openapi/public-api.yaml"
      required: true
    - path: "packages/contracts/openapi/internal-reco-api.yaml"
      required: true
  files:
    - path: "apps/api/package.json"
      required: true
    - path: "apps/reco/package.json"
      required: true
    - path: "apps/reco/src/reco/api/main.py"
      required: true
    - path: "scripts/dev/smoke-check.sh"
      required: true
    - path: "scripts/dev/start-api.sh"
      required: true
    - path: "scripts/dev/start-reco.sh"
      required: true

output:
  docs:
    - path: "docs/06_実装設計/cross_cutting/ローカル開発手順書.md"
      action: "update"
      required: true
  files:
    - path: "apps/api/package.json"
      action: "update"
      required: true
    - path: "apps/api/src/index.ts"
      action: "create"
      required: true
    - path: "apps/api/src/app.ts"
      action: "create"
      required: true
    - path: "apps/api/src/app/health/routes.ts"
      action: "create"
      required: true
    - path: "apps/reco/package.json"
      action: "update"
      required: true
    - path: "apps/reco/src/reco/api/main.py"
      action: "update"
      required: true
    - path: "apps/reco/src/reco/api/routes/health.py"
      action: "create"
      required: true
    - path: "scripts/dev/README.md"
      action: "update"
      required: true
    - path: "scripts/dev/start-api.sh"
      action: "update"
      required: false
    - path: "scripts/dev/start-reco.sh"
      action: "update"
      required: false

acceptance_criteria:
  - "`./scripts/dev/start-api.sh` で api が port 3001 待受する"
  - "`./scripts/dev/start-reco.sh` で reco が port 8000 待受する"
  - "`GET /api/v1/health` が HTTP 200（SuccessEnvelope）"
  - "`GET /internal/reco/v1/health` が HTTP 200（X-Internal-Api-Key 付き）"
  - "`./scripts/dev/smoke-check.sh` で api / reco health が ok"
  - "手順書・README が現状と一致"
  - "Epic #651 Reopen なし・PR target が develop"
  - "Task / Review Definition が Task Branch 上に存在する"

