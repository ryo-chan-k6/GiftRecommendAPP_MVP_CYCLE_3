schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-db-write-009-010-semantic-write"
  title: "batch-db-write-009-010:semantic書込本配線"
  summary: "Wave 2 として BATCH-010 claim/status UPDATE と item_semantic UPSERT を本番 SQL で本配線する。Rule-first 維持。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-db-write-009-010:BATCH-009/010 queue・semantic書込本格化"
  epic_issue_number: 1634
  epic_branch: "feature/epic-1634-batch-db-write-009-010"
  related_issues:
    - 1677
  related_prs:
    - 1678

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Wave 1（#1677 / #1678）で BATCH-009 queue INSERT / queued_at UPDATE を本配線済み。
  BATCH-010 は claim / status / item_semantic が write_rows probe のまま。

objective: |
  claim_queue / update_queue_status / upsert_item_semantic を DbWriter 本番 SQL で本配線する。
  Rule-first adapter を維持し LLM 本接続は禁止。

scope:
  - "claim: update_rows（queued+semantic → processing / started_at）。条件付き equals"
  - "終端 status: update_rows（skipped / failed 等）。成功時 keep_processing は DB no-op"
  - "item_semantic: upsert_rows conflict (item_id, semantic_config_version_id)"
  - "semantic_input_hash は DDL 非存在のため DB payload に含めない"
  - "偽 op マーカー（claim / update_status / keep_processing）廃止"
  - "Rule-first 維持（LLM 本接続禁止）"
  - "scaffold-demo / 既存 UT 回帰"
  - "実 DB 疎通（secret なし。CI 既定 live 禁止）"
  - "IF-DB ギャップ一覧 IF-011 進捗"
  - "Task / Review Definition"

out_of_scope:
  - "Semantic LLM 本接続"
  - "BATCH-009 再実装（Wave 1）"
  - "011+ feature/embedding 書込"
  - "CI 既定 live / production 無承認"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-010_Item Semantic生成バッチ仕様書.md"
      required: true
    - path: "docs/06_実装設計/database/item_semantic_テーブル定義書.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチIF-DB・DDL本実装ギャップ一覧.md"
      required: true
  files:
    - path: "apps/batch/src/batch/application/item_semantic/**"
      required: true
    - path: "apps/batch/src/batch/infrastructure/db/writer.py"
      required: true

output:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチIF-DB・DDL本実装ギャップ一覧.md"
      action: "update"
      required: true
  files:
    - path: "apps/batch/src/batch/application/item_semantic/repositories.py"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/application/test_item_semantic.py"
      action: "update"
      required: true
    - path: "prompts/definitions/tasks/batch-db-write-009-010/semantic-write.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-db-write-009-010/semantic-write/pr-review.yaml"
      action: "create"
      required: true

deliverables:
  - "010 claim / status / semantic UPSERT 本配線"
  - "UT"
  - "実 DB 疎通結果"
  - "ギャップ一覧更新"

acceptance_criteria:
  - "claim / terminal status が update_rows"
  - "item_semantic が upsert_rows（conflict item_id + semantic_config_version_id）"
  - "偽 op マーカーが残っていない"
  - "LLM 本接続を混入していない"
  - "実 DB 疎通結果が PR に記録（secret なし）"
  - "scaffold-demo / 既存 UT 回帰"
  - "PR target が親 Epic Branch"
  - "Related to #<Task Issue>（Closes 禁止）"

branch:
  no_branch: false
  summary: "batch-db-write-009-010-semantic-write"
  base: "feature/epic-1634-batch-db-write-009-010"
  target: "feature/epic-1634-batch-db-write-009-010"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-27"
    due_date: "2026-08-06"

issue:
  unit: "task"
  type: "feature"
  area: "batch"

dependencies:
  epics:
    - issue: 1634
      purpose: "親 Epic"
  issues:
    - number: 1677
      purpose: "Wave 1 queue 書込"
  blocking: false

contract_gate:
  required: false

parallel_control:
  exclusive_files:
    - "apps/batch/src/batch/application/item_semantic/**"
    - "apps/batch/tests/unit/application/test_item_semantic.py"
  conflict_risk: "high"
  db_impact: true

test_policy:
  required:
    - "unit test"
    - "secret check"
    - "real DB connectivity verify"
  not_required:
    - "CI default live"
    - "production unapproved live"
  skip_reason:
    "CI default live": "明示 / 手動の実 DB 疎通のみ"
    "production unapproved live": "疎通対象は local/dev/staging のみ"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "update_rows / upsert_rows が本番 SQL か"
    - "claim 条件（queued + semantic）が正しいか"
    - "成功時 processing 維持（DB no-op）か"
    - "semantic_input_hash を DDL 外列として書いていないか"
    - "LLM 本接続が混入していないか"
    - "実 DB 疎通が記録されているか"
    - "Related to / PR target が親 Epic"
  specialist_reviews:
    test: true
    security: true

notes:
  - "Epic Wave 2。Wave 1 queue は触らない（回帰のみ）"
  - "ギャップ一覧 IF-DB-BATCH-011 = item_semantic（BATCH-010）"
