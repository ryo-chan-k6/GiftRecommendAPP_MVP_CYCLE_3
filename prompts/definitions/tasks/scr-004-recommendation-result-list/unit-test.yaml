  - "pnpm --filter @gift-recommendation/web test:component が通る"
  - "epic_scope.allowed_paths 外へ変更していない"
  - "secret / .env 実値を含んでいない"
  - "本番 network に依存していない"

branch:
  no_branch: false
  name: "test/task-1246-scr-004-recommendation-result-list-unit-test"
  base: "feature/epic-1236-scr-004-recommendation-result-list"
  target: "feature/epic-1236-scr-004-recommendation-result-list"
