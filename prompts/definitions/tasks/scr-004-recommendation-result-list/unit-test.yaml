      required: true
      purpose: "テスト対象実装"
  issues: []
  prs: []

output:
  docs: []
  files: []
  tests:
    - path: "apps/web/tests/component/recommendation-result/**/*.{test,spec}.{ts,tsx}"
      action: "create_or_update"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "SCR-004 単体テスト"
  - "主要画面状態の再現可能な検証"

