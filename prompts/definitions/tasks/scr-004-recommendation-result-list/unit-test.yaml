    due_date: "2026-07-17"

issue:
  unit: "task"
  type: "test"
  area: "web"

dependencies:
  epics:
    - issue: 1236
      title: "[Epic]SCR-004:レコメンド結果一覧画面"
      purpose: "親 Epic"
  issues:
    - number: 1241
      purpose: "実装 Task"
  prs:
    - number: 1242
      purpose: "実装 PR"
  tasks:
