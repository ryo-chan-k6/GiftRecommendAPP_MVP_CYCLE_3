  SCR-004 Epic（#1236）の単体テスト Task。implementation Task（#1241 / PR #1242）が親 Epic Branch に merge 済みであることを前提に着手する。

objective: |
  SCR-004 画面実装の単体テストを整備し、主要画面状態・導線・安全判定を再現可能に検証する。

scope:
  - "SCR-004 関連の component / feature 単体テスト追加（apps/web/tests/component/recommendation-result/**）"
  - "結果欠落 / 一覧表示 / 外部URL安全判定 / 理由詳細アコーディオン等の主要観点"
  - "Task / Review Definition 整備"

out_of_scope:
  - "画面仕様書・実装本体の機能追加（軽微なテスト容易性修正は最小限可）"
  - "E2E / Playwright 全面整備"
  - "OpenAPI / generated 変更"
  - "apps/api / apps/reco / apps/batch の変更"
  - "API-PUB-004 Feedback 本実装"

input:
  docs:
    - path: "docs/06_実装設計/web/SCR-004_レコメンド結果一覧画面画面仕様書.md"
      required: true
      purpose: "テスト観点の正本"
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
      purpose: "SCR-004 行との整合確認"
