background: |
  06_実装設計において、web 実装・E2E（レーン1e）の前提となる画面仕様書を作成する。
  本Taskでは、画面一覧の SCR-004（レコメンド結果一覧画面）を対象に、表示項目・画面状態・遷移・データ取得方針（API-PUB-002 Response / sessionStorage）を整理する。

objective: |
  SCR-004（レコメンド結果一覧画面）について、実装・レビューが可能な粒度の画面仕様書を作成する。
  作成する仕様書は prompts/templates/docs/screen-spec.md に準拠する。

scope:
  - "SCR-004 の画面仕様書を新規作成する（成果物: SCR-004_レコメンド結果一覧画面画面仕様書.md）"
  - "画面目的・対象ユーザー・表示項目を整理する"
  - "画面状態（結果あり / 結果なし受け取り失敗 / ローディング等）と遷移を整理する"
  - "データ取得方針（API-PUB-002 Response の sessionStorage 受け取り）と導線 API（PUB-003 / PUB-004）の扱いを整理する"
  - "SCR-005（推薦理由詳細）をモーダル／展開として本画面内で扱う方針を明記する"
  - "SCR-006 / SCR-007 / Feedback を導線レベルに留める範囲を明記する"

out_of_scope:
  - "他画面（SCR-004 以外）の画面仕様書作成"
  - "個別API仕様書の作成・更新（API-PUB-002 / API-PUB-003 / API-PUB-004 等は別Task）"
  - "OpenAPI / generated / ソースコード実装"
  - "認証・認可方式そのものの変更"
  - "API-PUB-004 Feedback 本実装の詳細仕様確定（別レーン）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
      purpose: "SCR-004 の画面ID・画面名・MVP対象・概要を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
      purpose: "遷移元・遷移先・表示項目・モーダルを確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "結果一覧が API-PUB-002 Response 由来であること、導線 API を確認するため"
    - path: "docs/06_実装設計/web/SCR-002_レコメンド条件入力画面画面仕様書.md"
      required: true
      purpose: "SCR-002 からの結果受け渡し・再検索時の入力復元分担を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能×モジュール対応表.md"
      required: false
      purpose: "SCR-004 と関連モジュールの対応を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: false
      purpose: "結果欠落・導線エラーの表示方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: false
      purpose: "trace_id 表示候補や画面から見えるエラー追跡情報の扱いを確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能一覧.md"
      required: false
      purpose: "画面が対応する機能範囲を確認するため"
  templates:
    - path: "prompts/templates/docs/screen-spec.md"
      required: true
      purpose: "画面仕様書を標準フォーマットで作成するため"
      applies_to:
        - "docs/06_実装設計/web/SCR-004_レコメンド結果一覧画面画面仕様書.md"
  files: []
  issues: []
  prs: []

