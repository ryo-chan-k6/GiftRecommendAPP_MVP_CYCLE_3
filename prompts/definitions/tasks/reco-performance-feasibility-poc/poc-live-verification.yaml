background: |
  Phase1（#759 / #1502）完了後の Phase2 live 実測 Task。
  Human 判断（2026-07-21）: 新 Epic（B1）、OpenAI secrets 実疎通を含む、TV-005/006 分離、
  soft 2,000ms / hard 4,000ms で Go/Adjust/Block。
  設計反映メモ §3 が計測チェックリストの正。

objective: |
  live 実性能計測を実行し、Phase2 結果 doc を作成する。
  §13.2 暫定値に対する Go / Adjust / Block 判定を実測根拠付きで整理する。
  設計反映メモへ Phase2 追記し、正式 docs 更新 Task への入力とする。

scope:
  - "reco_pipeline_bench.py live モードの実装・有効化"
  - "ephemeral DB + OpenAI secrets 実疎通を含む計測経路（実値は secrets / env のみ。成果物へ非記載）"
  - "GHA perf-feasibility-reco.yml の live 入力対応（必要時・secrets.* 参照）"
  - "Reco性能フィジビリティ検証結果_Phase2_live.md の作成"
  - "設計反映メモ.md への Phase2 追記（§3 チェックリスト消化）"
  - "live 計測境界の計画・TV-007 方針への必要最小追記"

out_of_scope:
  - "性能要件（バックエンド）§5 / MOD-RECO-001 への正式 docs 更新（別 Task）"
  - "apps/reco/src/** の本格 Orchestrator 改修（最小フックは Human 確認）"
  - "TV-005 / TV-006"
  - "apps/batch/** / TV-008〜010"
  - "production 負荷試験"
  - "secret 実値の commit・成果物への記載"
  - "PR merge"

input:
  docs:
    - path: "docs/90_PoC/性能フィジビリティ/Reco性能フィジビリティ検証計画書.md"
      required: true
    - path: "docs/90_PoC/性能フィジビリティ/Reco性能フィジビリティ検証結果_Phase1.md"
      required: true
    - path: "docs/90_PoC/性能フィジビリティ/設計反映メモ.md"
      required: true
      purpose: "Phase2 チェックリスト正本"
    - path: "docs/90_PoC/管理/759_Phase2以降_引継ぎメモ_2026-07-21.md"
      required: true
  files:
    - path: "scripts/perf/reco_pipeline_bench.py"
      required: true
    - path: ".github/workflows/test-reco-quality.yml"
      required: false
      purpose: "ephemeral DB 環境参考"
    - path: ".github/workflows/perf-feasibility-reco.yml"
      required: true

output:
  docs:
    - path: "docs/90_PoC/性能フィジビリティ/Reco性能フィジビリティ検証結果_Phase2_live.md"
      action: "create"
      required: true
    - path: "docs/90_PoC/性能フィジビリティ/設計反映メモ.md"
      action: "update"
      required: true
