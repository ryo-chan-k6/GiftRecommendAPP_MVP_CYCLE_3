      required: false

acceptance_criteria:
  - "入力解析〜Ranking のフェーズ別 p50/p95 が live 環境で計測されている"
  - "OpenAI secrets 実疎通を含む計測経路が実行され、かつ secret 実値が成果物に含まれていない"
  - "§13.2 暫定値（soft 2,000ms / hard 4,000ms）に対する Go / Adjust / Block 判定が実測根拠付きで整理されている"
  - "設計反映メモ §3 の必須項目が消化または未実施理由付きで明示されている"
  - "Task PR target が親 Epic Branch"

