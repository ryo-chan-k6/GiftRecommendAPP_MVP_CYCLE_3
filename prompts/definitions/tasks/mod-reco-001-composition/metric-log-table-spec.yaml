background: |
  Composition Epic #1076 直列工程 ①。
  Human 判断（2026-07-08）により、025 Postgres 永続化は Tier 1（レイテンシ・件数・fallback 等）と Tier 2（§12 分布 Metric）の両方を段階3 Composition で実施する。
  Tier 1 は本テーブル `metric_log`、Tier 2 は既存 `reco_score_distribution_metric` を正本とする。
  MOD-RECO-025 §9.1 / §9.2 および現行 `MetricRecord`（InMemory）を物理 DDL へ写像する。
  metric_log 物理テーブル定義書は未整備（MOD-RECO-025 §19）。DDL / migration は Task ②（db/**）へ委譲する。

objective: |
  `metric_log` の物理カラム・制約・Index・更新仕様を table-spec 形式で定義する。
  後続 DDL Task（工程 ②）および Postgres MetricLoggerRepository Task（工程 ③）が migration / 実装できる粒度まで確定する。

scope:
  - "table-spec 形式の metric_log テーブル定義書作成"
  - "MOD-RECO-025 §9.1 Tier 1 / §9.2 Tier 1b と MetricRecord 列の対応明記"
  - "reco_score_distribution_metric（Tier 2）との責務境界明記"
  - "phase_log / error_log / recommendation_run との trace 連携方針"
  - "Task / Review Definition の整備"

out_of_scope:
  - "DDL・migration（工程 ② db/** Task）"
  - "Postgres MetricLoggerRepository 実装（工程 ③）"
  - "reco_score_distribution_metric 定義書の変更（Tier 2 正本は既存）"
  - "テーブル一覧・物理ER・論理ER の更新（別 docs 追随 Task）"
  - "apps/** 実装"
  - "OpenAPI / generated 変更"
  - "Batch / Evaluation 向け metric_log 拡張（MVP は reco Online Run Tier 1）"

