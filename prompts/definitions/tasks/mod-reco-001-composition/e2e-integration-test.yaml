      action: "create"
      required: true
    - path: "prompts/definitions/tasks/mod-reco-001-composition/e2e-integration-test.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/mod-reco-001-composition/e2e-integration-test/pr-review.yaml"
