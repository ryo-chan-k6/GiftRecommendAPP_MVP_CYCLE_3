    - "Tier 1 / Tier 2 Metric 責務分離"
    - "stubs.py / orchestrator.py / ports.py 非変更"
    - "InMemory 既存 unit integration との重複が許容範囲か"
    - "Epic allowed_paths 内のみ"
    - "secret / DATABASE_URL 非 commit"
  specialist_reviews:
