    - path: "apps/reco/tests/unit/infrastructure/db/conftest.py"
      required: true
      purpose: "Postgres fixture 参考"
    - path: "apps/reco/tests/unit/application/test_recommendation_orchestrator.py"
      required: true
      purpose: "§14 No.10 InMemory ケース参考"
    - path: "apps/reco/tests/unit/application/recommendation_orchestrator_helpers.py"
      required: true
      purpose: "Orchestrator テスト helper 参考"
    - path: "prompts/definitions/epics/mod-reco-001-composition/epic.yaml"
      required: true
      purpose: "Epic scope / test_policy"

output:
  docs: []
  files:
