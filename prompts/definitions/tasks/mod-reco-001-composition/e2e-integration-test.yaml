      required: true

acceptance_criteria:
  - "apps/reco/tests/integration/** に §14 No.10 Postgres 永続化 integration テストが存在する"
  - "本番 composition 経由で成功 Run の Run / Phase / Metric（Tier 1+2）が DB に記録される"
  - "本番 composition 経由で失敗 Run の Error / Phase が DB に記録される"
  - "Tier 1 metric_log と Tier 2 reco_score_distribution_metric が混在しない"
