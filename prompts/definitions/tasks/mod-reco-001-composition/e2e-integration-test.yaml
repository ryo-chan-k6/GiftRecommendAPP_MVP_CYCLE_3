  title: "MOD-RECO-001:§14 No.10 DB永続化 E2E integration"
  summary: "Composition Epic #1076 直列工程 ⑤。本番 composition（build_production_ports）経由で §14 No.10 相当の Run / Phase / Error / Metric（Tier 1+2）Postgres 永続化を apps/reco/tests/integration で検証する。"
  phase: "07_開発・単体テスト"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]MOD-RECO-001:Orchestrator Composition（段階3）"
  epic_issue_number: 1076
  epic_branch: "feature/epic-1076-mod-reco-001-composition"
  related_issues:
    - number: 260
      purpose: "親 Epic（MOD-RECO-001:Recommendation Orchestrator）"
    - number: 1071
      purpose: "§14 No.10 InMemory 横断 integration（develop merge 済み参考）"
    - number: 1084
      purpose: "工程 ④ composition root 完了"

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "test-ai"
  support:
    - "worker-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Composition Epic #1076 直列工程 ⑤（最終子 Task）。
  工程 ①〜④ により metric_log DDL / Postgres Repository / composition root が Epic Branch に揃った。
  develop merge 済みの §14 No.10 unit integration（#1071）は InMemory 永続化を検証している。
  本 Task では本番 composition + 実 Postgres を用い、Orchestrator 実行後に recommendation_run / phase_log / error_log / metric_log / reco_score_distribution_metric への永続化を integration テストで確認する。

objective: |
  `apps/reco/tests/integration/**` に §14 No.10 相当の DB / ログ永続化 E2E integration テストを追加し、Epic Branch で green にする。
  - `build_composition_ports(CompositionMode.PRODUCTION)` または `build_production_ports()` 経由の Orchestrator 実行
  - 成功 Run / 失敗 Run で観測系テーブル行を検証
  - 025 Tier 1（metric_log）と Tier 2（reco_score_distribution_metric）の責務分離を DB 行で確認
  - DATABASE_URL 未設定・DB 未到達時は skip 理由を PR に明記

scope:
  - "apps/reco/tests/integration/** 新設（conftest / helpers / §14 No.10 Postgres 永続化ケース）"
  - "本番 composition + Postgres 向け integration fixture（DATABASE_URL / DDL 前提）"
  - "成功 Run: Run + Phase + Metric（Tier 1+2）永続化検証"
  - "失敗 Run: Run + Phase + Error 永続化検証（Metric 非記録または空を確認）"
  - "Task / Review Definition の整備"

out_of_scope:
  - "stubs.py / orchestrator.py / ports.py 変更"
  - "composition root / infrastructure/db Repository 本体の機能追加（工程 ④ / ③ 完了済み）"
  - "InMemory Repository 削除"
  - "DDL / migration 追加"
  - "§14 No.11 / No.14 の新規実装（develop merge 済み）"
  - "OpenAPI / generated / apps/api / apps/web 変更"
  - "API-INT-002 エンドポイント E2E"

