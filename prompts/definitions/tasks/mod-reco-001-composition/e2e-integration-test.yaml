      purpose: "§14 No.10 DB / ログ"
    - path: "docs/06_実装設計/database/metric_log_テーブル定義書.md"
      required: true
      purpose: "Tier 1 永続化検証"
    - path: "docs/06_実装設計/database/reco_score_distribution_metric_テーブル定義書.md"
      required: true
      purpose: "Tier 2 永続化検証"
    - path: "docs/06_実装設計/database/recommendation_run_テーブル定義書.md"
      required: false
      purpose: "Run 永続化検証"
    - path: "docs/06_実装設計/database/phase_log_テーブル定義書.md"
