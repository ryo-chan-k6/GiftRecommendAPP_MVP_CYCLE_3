  epic_issue: "[Epic]MOD-RECO-001:Orchestrator Composition（段階3）"
  epic_issue_number: 1076
  epic_branch: "feature/epic-1076-mod-reco-001-composition"
  related_issues:
    - number: 260
      purpose: "親 Epic（MOD-RECO-001:Recommendation Orchestrator）"
    - number: 1078
      purpose: "工程 ① metric_log テーブル定義書"
    - number: 1080
      purpose: "工程 ② metric_log DDL / migration（develop merge 済み前提）"
    - number: 1053
