background: |
  Composition Epic #1076 直列工程 ③。
  段階2 Wiring 完了後、観測系モジュール（002 / 028 / 029 / 025）は InMemory Repository を MVP 正本としている。
  Human 判断（2026-07-08）により Postgres 永続化は Tier 1（metric_log）と Tier 2（reco_score_distribution_metric）の両方を段階3 Composition で実施する。
  工程 ①（#1078 / #1079）テーブル定義書、工程 ②（#1080 / #1081 develop merge）DDL / migration は完了済み。
  Epic Branch は develop（#1081 含む）を取り込み済み。既存 `recommendation_run_repository.py` は InMemory + Protocol のみで、Postgres 実装は未整備。

objective: |
  観測系 4 モジュール向け Postgres Repository を `apps/reco/src/reco/infrastructure/db/` に実装し、各 Application 層 Protocol / モデルと整合させる。
  - MOD-RECO-002 → recommendation_run
  - MOD-RECO-028 → phase_log
  - MOD-RECO-029 → error_log
  - MOD-RECO-025 Tier 1 → metric_log
  - MOD-RECO-025 Tier 2 → reco_score_distribution_metric（MVP partial: context_score / final_score）
  DatabaseSession を実 DB 接続可能な境界に拡張し、Repository 単体テスト（InMemory 相当の振る舞い検証 + DB  integration 可能範囲）を追加する。

scope:
  - "Postgres RecommendationRunRepository（MOD-RECO-002 / IF-DB-RECO-002）"
  - "Postgres PhaseLogRepository（MOD-RECO-028）"
  - "Postgres ErrorLogRepository（MOD-RECO-029）"
  - "Postgres MetricLoggerRepository Tier 1（MOD-RECO-025 → metric_log）"
  - "Postgres ScoreDistributionMetricRepository Tier 2（MOD-RECO-025 → reco_score_distribution_metric）"
  - "DatabaseSession / 接続境界の実装拡張（環境変数ベース。secret 非 commit）"
  - "infrastructure/db/repositories/__init__.py 等の export 整理"
  - "Repository 単体 / integration テスト追加（apps/reco/tests/）"
  - "Task / Review Definition の整備"

out_of_scope:
  - "composition root / build_production_* DI（工程 ④）"
  - "stubs.py / orchestrator.py / ports.py 変更"
  - "DDL / migration 追加（工程 ② 完了済み）"
  - "InMemory Repository 削除"
  - "§14 E2E integration 強化（工程 ⑤）"
  - "OpenAPI / generated / apps/api / apps/web 変更"
  - "Batch / Evaluation 向け metric_log 拡張"

