  title: "MOD-RECO-001:観測系Postgres Repository実装"
  summary: "Composition Epic #1076 直列工程 ③。002 Run / 028 Phase Log / 029 Error Log / 025 Metric Logger の Postgres Repository を apps/reco/infrastructure/db に実装する。Tier 1 は metric_log、Tier 2 は reco_score_distribution_metric。InMemory 正本は維持し composition root DI は工程 ④ へ委譲。"
  phase: "07_開発・単体テスト"

work_mode: "ai-agent"

