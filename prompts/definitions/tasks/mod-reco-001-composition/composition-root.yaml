  db_impact: false

test_policy:
  required:
    - "apps/reco/tests/unit/composition/**"
  commands:
    - "cd apps/reco && uv run pytest tests/unit/composition -q --tb=short"
    - "cd apps/reco && uv run pytest tests/unit/application/test_recommendation_orchestrator.py -q --tb=short"
  manual_checks:
    - "MVP デフォルト composition 維持"
    - "Postgres observability DI が builder から選択可能"
