    - "002/028/029/025 Postgres DI 配線の整合"
    - "stubs.py / orchestrator.py / ports.py 非変更"
    - "Tier 1 / Tier 2 Metric 永続化境界の維持"
    - "Epic allowed_paths 内のみ"
    - "secret / DATABASE_URL 非 commit"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true

operation_logging:
  level: "standard"
  ai_logs:
    cross_cutting: true
  reason: "composition root は infrastructure / Orchestrator DI 横断 Task"

human_decision_points:
  - "【確定 2026-07-08】MVP デフォルト composition は維持し、本番 composition は別 builder として追加（Epic #1076）"
  - "【確定 2026-07-08】観測系 Postgres DI は composition root で接続（工程 ④）"

stop_conditions:
