    - number: 1053
      purpose: "MOD-RECO-025 Metric Logger Epic 完了"

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
