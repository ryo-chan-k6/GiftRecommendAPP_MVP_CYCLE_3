  summary: "Composition Epic #1076 直列工程 ②。`metric_log` テーブル定義書に基づき参照用 DDL（`db/ddl/`）と適用正本 migration（`supabase/migrations/`）を作成する。Epic #1076 外（`db/**`）の前提 Task。"
  phase: "06_実装設計"

work_mode: "ai-agent"

