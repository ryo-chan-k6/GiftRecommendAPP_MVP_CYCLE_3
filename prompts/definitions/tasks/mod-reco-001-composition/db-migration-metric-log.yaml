  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  Composition Epic #1076 直列工程 ②。
  工程 ①（Issue #1078 / PR #1079）で `metric_log_テーブル定義書.md` を作成済み（Epic Branch merge 済み。develop には未反映）。
  Human 判断（2026-07-08）により Tier 1 Run 集約 Metric は `metric_log` へ Postgres 永続化する。
  Tier 2 分布 Metric の `reco_score_distribution_metric` は D11（`db/ddl/d11_metric.sql`）に既存。本 Task は **metric_log のみ**。
  Epic #1076 の `forbidden_paths` に `db/**` があるため、本 Task は **develop 向け増分** とする。

objective: |
  `metric_log_テーブル定義書.md` §6〜§10 に整合する PostgreSQL DDL を `db/ddl/d15_metric_log.sql` に作成する。
  同一内容を `supabase/migrations/` の適用正本 migration として追加し、ローカル Supabase CLI で適用可能にする。
  `DDLバッチ分割表.md` に D15 増分を追記する。

scope:
  - "`db/ddl/d15_metric_log.sql` 新規作成（CREATE TABLE / Index / CHECK / UNIQUE）"
  - "`supabase/migrations/{timestamp}_metric_log.sql` 新規作成（適用正本）"
  - "`docs/06_実装設計/database/DDLバッチ分割表.md` に D15 追記"
  - "develop 上に `metric_log_テーブル定義書.md` が未存在の場合、Epic Branch（#1079）内容を同期"
  - "Task / Review Definition の整備"

out_of_scope:
  - "reco_score_distribution_metric DDL 変更（D11 既存正本）"
  - "Postgres MetricLoggerRepository 実装（Composition 工程 ③）"
  - "apps/** 実装"
  - "テーブル一覧・物理ER・論理ER の追随（別 docs Task）"
  - "retention Batch 実装"
  - "OpenAPI / generated 変更"

input:
  docs:
    - path: "docs/06_実装設計/database/metric_log_テーブル定義書.md"
      required: true
      purpose: "DDL 正本（Epic Branch #1079。develop 未反映時は origin/feature/epic-1076-mod-reco-001-composition を参照）"
    - path: "docs/06_実装設計/database/phase_log_テーブル定義書.md"
      required: true
      purpose: "Log 系 DDL スタイル・LOGICAL FK 方針参考"
    - path: "docs/06_実装設計/database/マイグレーション方針書.md"
      required: true
      purpose: "増分 migration 命名・適用方針"
    - path: "docs/06_実装設計/database/DDLバッチ分割表.md"
      required: true
      purpose: "D15 追記先"
    - path: "db/ddl/d10_log_observability.sql"
      required: true
      purpose: "Log 系 DDL スタイル参考"
    - path: "db/ddl/d07_online_recommendation.sql"
      required: true
      purpose: "recommendation_run LOGICAL 参照前提"
  templates: []
  files:
    - path: "supabase/migrations/20260702120000_matching_config.sql"
      required: true
      purpose: "直近増分 migration フォーマット参考"

output:
  docs:
    - path: "docs/06_実装設計/database/metric_log_テーブル定義書.md"
      action: "create"
      required: false
      purpose: "develop 未反映時のみ Epic Branch から同期"
    - path: "docs/06_実装設計/database/DDLバッチ分割表.md"
      action: "update"
      required: true
  files:
    - path: "db/ddl/d15_metric_log.sql"
      action: "create"
      required: true
    - path: "supabase/migrations/20260708120000_metric_log.sql"
      action: "create"
      required: true
    - path: "prompts/definitions/tasks/mod-reco-001-composition/db-migration-metric-log.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/mod-reco-001-composition/db-migration-metric-log/pr-review.yaml"
      action: "create"
      required: true

acceptance_criteria:
  - "`db/ddl/d15_metric_log.sql` が存在し、テーブル定義書 §6〜§10 と矛盾しない"
  - "`supabase/migrations/*_metric_log.sql` が存在し、DDL 参照用 SQL と同等である"
  - "`recommendation_run_id` UNIQUE（1 Run 1 行）および CHECK 制約が定義書どおりである"
  - "recommendation_run への物理 FK を付与していない（LOGICAL 参照）"
  - "reco_score_distribution_metric への変更がない"
  - "`apps/**` 変更がない"
  - "Task PR target が `develop`"

