  - "build_production_ports 配線"
  - "UT・手順書 §10.4.6 追記・再スモーク"
  - "Task / Review Definition"

out_of_scope:
  - "user_feature / user_meaning 全列の本番永続（本 Task は has_user_semantic と user_semantic INSERT まで）"
  - "retrieval stub 全面化"
  - "OpenAPI / migration / SCR / PUB-004"

