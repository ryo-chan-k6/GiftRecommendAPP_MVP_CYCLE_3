background: |
  Phase3 環境再計画（2026-06-18）§2.8 に基づき、Phase3b Epic C（`gha-test-environment` / Layer2）を `/start-epic` する前に、
  Epic Definition・子 Task 6件（C1〜C6）・Review Definition（Task PR + Epic PR）を prompts/definitions に整備する必要がある。
  Epic A（Issue #651 / PR #668 merge 済み）を前提とし、Epic B（hosted-dev-environment）は defer のまま Definition を作成しない。

objective: |
  `prompts/definitions/epics/gha-test-environment/epic.yaml` および子 Task C1〜C6 の Task Definition、
  `prompts/definitions/reviews/gha-test-environment/**` の Review Definition を作成する。
  Epic Definition には Phase3 環境再計画 §2.6（全テストレベルの AI Agent 運用）・§2.7（Layer2 先行）・§2.8（Epic C スコープ）を反映する。
  merge 後、`/start-epic @prompts/definitions/epics/gha-test-environment/epic.yaml` へ進める状態にする。

scope:
  - "Epic Definition: `prompts/definitions/epics/gha-test-environment/epic.yaml`（§2.6 / §2.7 / §2.8 反映含む）"
  - "子 Task Definition 6件（ci-db-ephemeral / test-fixtures-seed / test-system-workflow / test-reco-quality-workflow / agent-test-dispatch / test-env-docs）"
  - "Review Definition: 各 Task 用 `pr-review.yaml` + Epic PR 用 `reviews/gha-test-environment/epic/pr-review.yaml`"
  - "本 bootstrap Task / Review Definition の整備"

out_of_scope:
  - "Epic C の実装（ci-db.yml / test-system.yml / fixture 実体）— 子 Task `/work-issue` で実施"
  - "Epic B（hosted-dev-environment）Definition — defer"
  - "Epic D（app CI: ci-web.yml 等）— Phase4a 後続"
  - "Issue #132 の Close — 別 Todo（issue-132-disposition）"
  - "apps/** 本格実装・packages/contracts 変更"
  - "secret 実値の commit"

