schema_version: "1.0"
definition_type: "task"

task:
  id: "task-phase3b-epic-a-definitions-bootstrap"
  title: "Phase3b Epic A（local-dev-environment）Definition bootstrap"
  summary: "Phase3b Epic A + 子Task 7件の Epic/Task/Review Definition を整備し、§2.6 AI Agent テスト運用を Epic Definition に反映する。`/start-epic` 前提の鶏卵解消用 chore Task。"
  phase: "06_実装設計"

work_mode: "ai-agent"

parent:
  epic_id: null
  epic_issue: null
  epic_issue_number: null
  epic_branch: null
  related_issues:
    - number: 436
      purpose: "Phase3a Epic（environment-setup）完了前提"
  related_prs:
    - number: 584
      purpose: "Phase3a Epic PR（merge 済み）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  Phase3 環境再計画（2026-06-18）に基づき、Phase3b の Epic A（`local-dev-environment`）を `/start-epic` する前に、
  Epic Definition・子 Task 7件（A1〜A7）・Review Definition（Task PR + Epic PR）を prompts/definitions に整備する必要がある。
  Definition なしでは `/start-epic` / `/start-task` が実行できないため、本 chore Task で bootstrap する（実装フェーズ実行プロセス設計書 §7.6）。
  Phase3a（Epic #436 / PR #584 merge 済み）を前提とし、Epic B（hosted-dev-environment）は defer のまま Definition を作成しない。

objective: |
  `prompts/definitions/epics/local-dev-environment/epic.yaml` および子 Task A1〜A7 の Task Definition、
  `prompts/definitions/reviews/local-dev-environment/**` の Review Definition を作成する。
  Epic Definition には Phase3 環境再計画 §2.5（Agentic Process 制約）・§2.6（全テストレベルの AI Agent 運用）を反映する。
  merge 後、`/start-epic @prompts/definitions/epics/local-dev-environment/epic.yaml` へ進める状態にする。

scope:
  - "Epic Definition: `prompts/definitions/epics/local-dev-environment/epic.yaml`（§2.5 / §2.6 反映含む）"
  - "子 Task Definition 7件（toolchain-pin / monorepo-bootstrap / db-build-guide / seed-strategy / redis-local-guide / local-dev-runtime / local-smoke-check）"
  - "Review Definition: 各 Task 用 `pr-review.yaml` + Epic PR 用 `reviews/local-dev-environment/epic/pr-review.yaml`"
  - "本 bootstrap Task / Review Definition の整備"
  - "既存 `redis-local-guide.yaml`（worktree 上で epic 整合に更新）"

out_of_scope:
  - "Epic A の実装（monorepo / DB 手順 / scripts 実体・apps 起動）— 子 Task `/work-issue` で実施"
  - "Epic C（gha-test-environment）Definition — A3 完了後の別 Todo"
  - "Epic B（hosted-dev-environment）Definition — defer"
  - "Issue #132 の Close — 別 Todo（issue-132-disposition）"
  - "apps/** 実装・`packages/contracts/**` 変更"
  - "`.github/workflows/**` の本格変更（Epic C / Epic D scope）"
  - "secret 実値の commit"

