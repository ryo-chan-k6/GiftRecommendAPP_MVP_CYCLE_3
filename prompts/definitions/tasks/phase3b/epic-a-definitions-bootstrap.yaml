review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "Epic scope / allowed_paths が Phase3b Epic A と一致するか"
    - "§2.5 / §2.6 が Epic Definition に反映されているか"
    - "A1〜A7 の依存・並列が計画と一致するか"
    - "Review Definition 3点セットが揃っているか"
