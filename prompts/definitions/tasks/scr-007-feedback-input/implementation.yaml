schema_version: "1.0"
definition_type: "task"

task:
  id: "task-scr-007-feedback-input-implementation"
  title: "SCR-007:Feedback入力表示実装"
  summary: "SCR-007 Feedback入力モーダルを実装し、API-PUB-004 呼び出しと SCR-004 / SCR-006 の Feedback 導線有効化を行う。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]SCR-007:Feedback入力表示"
  epic_issue_number: 1325
  epic_branch: "feature/epic-1325-scr-007-feedback-input"
  related_issues:
    - number: 1325
      purpose: "親 Epic"
    - number: 1327
      purpose: "前提 Task（画面仕様書）"
  related_prs:
    - number: 1328
      purpose: "画面仕様書 Task PR（親 Epic Branch merge 済み）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  画面仕様書（#1327 / PR #1328）が親 Epic Branch に merge 済み。
  SCR-004 / SCR-006 の Feedback は disabled。API-PUB-004 generated client は利用可能。

objective: |
  Feedback入力モーダルを実装し、API-PUB-004 で送信できるようにする。
  SCR-004 / SCR-006 からモーダルを開けるようにする。

scope:
  - "apps/web/src/features/feedback-input/** の新規実装"
  - "apps/web/src/lib/api/** への submitFeedback ラップ"
  - "SCR-004 / SCR-006 の Feedback 導線有効化（最小差分）"
  - "apps/web/tests/component/feedback-input/** および導線テスト更新"
  - "Task / Review Definition"

out_of_scope:
  - "画面仕様書の大幅改訂"
  - "OpenAPI / Orval / generated 手編集"
  - "apps/api / apps/reco / apps/batch"
  - "SCR-005 / reason 粒度 Feedback UI"
  - "E2E"

input:
  docs:
    - path: "docs/06_実装設計/web/SCR-007_Feedback入力表示画面仕様書.md"
      required: true
      purpose: "実装正本"
    - path: "docs/06_実装設計/api/API-PUB-004_Feedback送信API契約仕様書.md"
      required: true
      purpose: "Request / Error"
  files:
    - path: "apps/web/src/generated/api/feedback/feedback.ts"
      required: true
      purpose: "submitRecommendationFeedback"
  issues:
    - number: 1327
      purpose: "画面仕様書"
  prs:
    - number: 1328
      purpose: "仕様書 PR"

output:
  docs: []
  files:
    - path: "apps/web/src/features/feedback-input/**"
      action: "create_or_update"
      required: true
    - path: "apps/web/src/lib/api/**"
      action: "create_or_update"
      required: false
    - path: "apps/web/src/features/recommendation-result/**"
      action: "update"
      required: true
    - path: "apps/web/src/features/item-detail/**"
      action: "update"
      required: true
  tests:
    - path: "apps/web/tests/component/feedback-input/**/*.{test,spec}.{ts,tsx}"
      action: "create_or_update"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"

deliverables:
  - "Feedback モーダル本実装（PUB-004）"
  - "SCR-004 / SCR-006 導線有効化"
  - "最小 component テスト"

acceptance_criteria:
  - "item 粒度 Feedback をモーダルから送信できる"
  - "SCR-004 から Feedback モーダルが開く"
  - "SCR-006 は result 文脈があるとき Feedback が開く"
  - "400 / 404 / 通信失敗の UX がある"
  - "pnpm --filter @gift-recommendation/web test:component が通る"
  - "pnpm --filter @gift-recommendation/web typecheck が通る"
  - "generated 手動編集なし / secret なし"

