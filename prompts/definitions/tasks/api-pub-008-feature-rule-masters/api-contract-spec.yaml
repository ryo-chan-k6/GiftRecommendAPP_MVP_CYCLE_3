background: |
  Phase1 ① API契約仕様書（1a）として、API-PUB-008（Featureルール取得 / Public API）の契約面を確定する。
  本 API は Relationship Rule / Occasion Rule / Concept Feature Rule を Public 表面化する。Pair Rule は Public 応答に含めない（API一覧 §API-PUB-005 備考と同方針）。

objective: |
  API-PUB-008（`GET /api/v1/masters/feature-rules`）の API 契約仕様書を作成する。
  OpenAPI / generated の実変更は後続 Contract Task へ分離する。

scope:
  - "API-PUB-008 API 契約仕様書を新規作成"
  - "Request / Response / Error / Validation を定義"
  - "relationshipRules / occasionRules / conceptFeatureRules の表面フィールドを定義"
  - "Pair Rule 非公開方針を明示"
  - "API-PUB-005/006/007 とのコード・Version 整合を整理"
  - "OpenAPI 反映方針（方針のみ）"
  - "未決事項を明記"

out_of_scope:
  - "api-implementation-spec.yaml の作成"
  - "OpenAPI / Orval / generated の実変更"
  - "apps 実装"
  - "pair_rule の Public 返却"
  - "API-PUB-007 の仕様書作成（別 Task #403）"

