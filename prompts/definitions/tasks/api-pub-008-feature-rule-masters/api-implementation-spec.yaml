background: |
  Phase4b 縦串の 1/3（実装面仕様書）。契約面は `API-PUB-008_Featureルール取得API契約仕様書.md`（#404 / PR #408）を正とする。
  OpenAPI 断片（#428 / PR #429）および Rule / Version テーブル定義は develop 反映済み。
  本 Task は契約・OpenAPI・DB schema を変更せず、apps/api masters 実装 Task が参照可能な **実装面のみ** を整理する。
  Response は `baseValueRules` + `conceptFeatureRules` の 2 グループ。Pair Rule は Public 非公開。
  レーン4第2波（並列計画。PUB-007 と並列可）。Epic Branch は develop 同期済みを前提とする。
  PUB-005/006 は同一 masters Router へ既に mount 済みのため、本仕様書では `/feature-rules` 追加方針を明示する。

objective: |
  API-PUB-008 について、実装 Task / 単体テスト Task が参照可能な粒度の API実装仕様書（実装面のみ）を新規作成する。
  Express Router、MOD-API-011/012、current Semantic Config Version 解決、Rule テーブル読取（active のみ）、
  2 グループ Response 組立、GRS-CFG-001 / GRS-CFG-005 / GRS-DB-* 境界、masters_feature_rules_* metric を明記する。

scope:
  - "API-PUB-008 の API実装仕様書を新規作成する（`API-PUB-008_Featureルール取得API実装仕様書.md`）"
  - "前提契約・OpenAPI / Contract Gate / Rule・Version テーブル定義を整理する"
  - "実装方針（Express Router / MOD-API-011 / MOD-API-012 / current Version 解決 / DI）を整理する"
  - "処理フロー（Mermaid）と処理詳細を整理する"
  - "DB 列 → Public Response（baseValueRules / conceptFeatureRules）の内部DTOマッピングを整理する（isActive / Pair 非公開）"
  - "各配列 0 件は 200、current Version 未設定は GRS-CFG-001、参照不能は GRS-CFG-005 の境界を整理する"
  - "generated client 利用方針（SCR-002）を記載のみ整理する"
  - "provider（apps/api）/ consumer（apps/web SCR-002）の実装影響を整理する"
  - "エラーマップ・trace 伝播・masters_feature_rules_* metric を整理する"
  - "実装結合テスト観点・未決事項を明記する"

out_of_scope:
  - "API-PUB-005 / 006 / 007 の実装仕様書作成・変更"
  - "契約面再掲（契約仕様書を正とする）"
  - "OpenAPI / Orval / generated ファイル変更"
  - "apps/api / apps/web / apps/reco の実装"
  - "DB schema / migration / seed 変更"
  - "Pair Rule / normalization の Public 公開"
  - "画面仕様書の作成"

