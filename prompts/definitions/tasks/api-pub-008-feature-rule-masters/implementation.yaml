    expected: false
    paths: []
    handling: "none"

deliverables:
  - "契約準拠の GET /api/v1/masters/feature-rules"
  - "MOD-API-011 / MOD-API-012 と Version Resolver 再利用"
  - "最小スモーク単体テスト"
  - "Task / Review Definition"

acceptance_criteria:
  - "`GET /api/v1/masters/feature-rules` が 200 で configName / versionLabel / 2 配列 + meta を返す"
  - "`isActive` / Pair を Response に含めていない"
  - "各配列 0 件で 200 空配列になる（Version 解決成功時）"
  - "current Version 未設定で `GRS-CFG-001`、DB 失敗で `GRS-DB-002`、設定解決不能で `GRS-CFG-005` の経路がある"
  - "未知 Query で `GRS-REQ-001`"
  - "実装仕様書・契約・OpenAPI と矛盾しない"
  - "OpenAPI / generated / apps/web / apps/reco の変更を含まない"
  - "epic_scope.allowed_paths 内に差分が収まっている"
  - "`pnpm --filter @gift-recommendation/api test` または同等が SUCCESS"
  - "secret / `.env` 実値が含まれていない"

