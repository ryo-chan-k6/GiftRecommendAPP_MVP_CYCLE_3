    - path: "docs/06_実装設計/database/occasion_rule_テーブル定義書.md"
      required: true
    - path: "docs/06_実装設計/database/concept_feature_rule_テーブル定義書.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
  files:
