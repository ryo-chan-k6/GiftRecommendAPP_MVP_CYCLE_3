background: |
  Phase4b 縦串の 2/3（apps/api 実装）。前提: 実装仕様書 #1190 / PR #1191 が親 Epic Branch に merge 済み。
  PUB-005/006/007 で `createMastersRouter` と `SemanticConfigVersionResolver` が存在する。
  本 Task は `GET /feature-rules` を追加する。網羅 UT は後続 unit-test Task。

objective: |
  `GET /api/v1/masters/feature-rules` を契約・OpenAPI・実装仕様書に沿って提供する。
  MOD-API-011/012、current Version 解決（共通 Resolver 再利用）、3 Rule テーブル読取、
  baseValueRules / conceptFeatureRules 組立、エラー境界、metric を実装する。

scope:
  - "`apps/api/src/app/masters/**` に Feature Rule 用 Controller / Repository を追加"
  - "`createMastersRouter` に `GET /feature-rules` を追加"
  - "`SemanticConfigVersionResolver` を再利用（PUB-007 共通）"
  - "relationship_rule / occasion_rule / concept_feature_rule の active のみ読取"
  - "空配列 200 / current なし GRS-CFG-001 / 参照不能 GRS-CFG-005"
  - "未知 Query で 400 GRS-REQ-001"
  - "masters_feature_rules_* metric"
  - "最小スモーク単体テスト"
  - "epic_scope.allowed_paths に tests パスを追加（必要時）"
  - "Task / Review Definition"

out_of_scope:
  - "OpenAPI / Orval / generated 変更"
  - "apps/web / apps/reco 変更"
  - "契約・実装仕様書 docs の変更（許容: epic.yaml allowed_paths のみ）"
  - "DB schema / migration / seed 変更"
  - "API-PUB-005 / 006 / 007 の機能追加（既存破壊は禁止）"
  - "網羅 UT（Phase4b 3/3）"
  - "Pair Rule / isActive の Public 公開"

