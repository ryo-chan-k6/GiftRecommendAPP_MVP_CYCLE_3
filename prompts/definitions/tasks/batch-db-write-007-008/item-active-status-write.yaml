schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-db-write-007-008-item-active-status-write"
  title: "batch-db-write-007-008:active_status書込本配線"
  summary: "Wave 2 として BATCH-008 item.active_status UPDATE と candidate 状態更新 / Retention DELETE を本番 SQL で本配線する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-db-write-007-008:BATCH-007/008 item系書込本格化"
  epic_issue_number: 1633
  epic_branch: "feature/epic-1633-batch-db-write-007-008"
  related_issues:
    - 1669
  related_prs:
    - 1670

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Wave 1（#1669）で BATCH-007 item UPSERT 本配線済み。
  BATCH-008 は write_rows probe のまま。active_status 本更新と candidate 遷移が未本格化。
  IF-020（BATCH-004 candidate INSERT UPSERT）は T4a 済みのため再実装しない。

objective: |
  update_item_active_status / mark_candidate_* / delete_candidate を
  DbWriter の update_rows / delete_rows で本配線する。

scope:
  - "item: update_rows で active_status / is_active（equals source + external_item_code）"
  - "item_active_status_candidate: update_rows で applied / superseded / discarded"
  - "Retention: delete_rows（detected は削除禁止の現行ガード維持）"
  - "isoformat 文字列ではなく datetime を writer に渡す（Postgres 互換）"
  - "偽 write（op=delete マーカー等）の廃止"
  - "IF-020 candidate INSERT UPSERT は触らない"
  - "scaffold-demo / 既存 UT 回帰"
  - "実 DB 疎通（secret なし）"
  - "IF-DB ギャップ一覧進捗（BATCH-008 / IF-009・021）"
  - "Task / Review Definition"

out_of_scope:
  - "BATCH-007 再実装（Wave 1）"
  - "IF-020 candidate INSERT UPSERT 再実装"
  - "SELECT 再実装 / 005 / 009+"
  - "CI 既定 live / production 無承認"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-008_商品有効状態更新バッチ仕様書.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチIF-DB・DDL本実装ギャップ一覧.md"
      required: true
  files:
    - path: "apps/batch/src/batch/application/item_active_status/**"
      required: true

output:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチIF-DB・DDL本実装ギャップ一覧.md"
      action: "update"
      required: true
  files:
    - path: "apps/batch/src/batch/application/item_active_status/repositories.py"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/application/test_item_active_status.py"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/application/test_item_active_status_retention.py"
      action: "update"
      required: false
    - path: "prompts/definitions/tasks/batch-db-write-007-008/item-active-status-write.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-db-write-007-008/item-active-status-write/pr-review.yaml"
      action: "create"
      required: true

deliverables:
  - "008 active_status / candidate 書込本配線"
  - "UT"
  - "実 DB 疎通結果"
  - "ギャップ一覧更新"

acceptance_criteria:
  - "item active_status が update_rows を使う"
  - "candidate 状態更新が update_rows を使う"
  - "Retention DELETE が delete_rows を使う（偽 op=delete 廃止）"
  - "IF-020 INSERT 経路を変更していない"
  - "実 DB 疎通結果が PR に記録（secret なし）"
  - "PR target が親 Epic Branch"
  - "Related to #<Task Issue>（Closes 禁止）"

branch:
  no_branch: false
  summary: "batch-db-write-007-008-active-status-write"
  base: "feature/epic-1633-batch-db-write-007-008"
  target: "feature/epic-1633-batch-db-write-007-008"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-27"
    due_date: "2026-08-02"

issue:
  unit: "task"
  type: "feature"
  area: "batch"

dependencies:
  epics:
    - issue: 1633
      purpose: "親 Epic"
  issues:
    - number: 1669
      purpose: "Wave 1"
  blocking: false

contract_gate:
  required: false

parallel_control:
  exclusive_files:
    - "apps/batch/src/batch/application/item_active_status/**"
    - "apps/batch/tests/unit/application/test_item_active_status.py"
    - "apps/batch/tests/unit/application/test_item_active_status_retention.py"
  conflict_risk: "high"
  db_impact: true

test_policy:
  required:
    - "unit test"
    - "secret check"
    - "real DB connectivity verify"
  not_required:
    - "CI default live"
    - "production unapproved live"
  skip_reason:
    "CI default live": "明示 / 手動の実 DB 疎通のみ"
    "production unapproved live": "疎通対象は local/dev/staging のみ"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "update_rows / delete_rows が本番 SQL か"
    - "IF-020 INSERT を触っていないか"
    - "detected 候補を DELETE していないか"
    - "実 DB 疎通が記録されているか"
    - "Related to / PR target が親 Epic"
  specialist_reviews:
    test: true
    security: true

notes:
  - "Epic Wave 2。Wave 1 は #1669"
  - "Issue 番号は起票後に Review Def / branch 名へ反映"
