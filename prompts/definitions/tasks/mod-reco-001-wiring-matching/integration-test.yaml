background: |
  §19 引き継ぎ（Issue #897 / MOD-RECO-014 モジュール仕様書 §8.3.4 / §8.3.6 / §16.1 No.8）:
  MOD-RECO-014 Feature Matcher が成功返却したうえで Matching 対象候補が 0 件の場合、Orchestrator は MOD-RECO-015 以降（Matching / Ranking: 015〜020）を呼び出さず、MOD-RECO-001 §8.2 の 0 件結果方針に従い空 RecommendationResult で正常終了する。
  検知信号（主信号 + 防御的チェック推奨）: feature_matcher_candidate_count == 0 / feature_match_result.total_matched == 0 / feature_match_result.entries が空。
  MOD-RECO-014 失敗時（GRS-REC-011）は short-circuit しない（従来どおり中断）。
  execution_context.py は変更しない（型付きフィールドは playbook 順序 3）。検知は暫定 getattr 可。
  Epic #790 配下で wiring Task により `build_default_stub_ports()` の Matching フェーズ Port が本実装へ差し替えられた後、Orchestrator デフォルト経路テストの期待値を更新する。
  本 Task は **orchestrator.py の §19 short-circuit 実装** と **test_recommendation_orchestrator.py 更新** を担当する。stubs.py 配線は wiring Task の責務。
  型付き直接参照への置換は playbook 順序 4 に委譲する。
  正本: `prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/wiring-phase-follow-up-playbook.yaml`

objective: |
  配線後の Orchestrator デフォルト経路テストを green にし、Matching フェーズ（MOD-RECO-014 / 015 / 016）がデフォルト composition で正しく呼び出されることを pytest で検証する。
  あわせて §19 に従い、Matching 対象 0 件時の Orchestrator 早期 0 件終了を orchestrator.py に実装し、テストで検証する。

scope:
  - "`apps/reco/src/reco/application/recommendation-orchestrator/orchestrator.py` に MOD-RECO-014 実行直後の short-circuit を追加する"
  - "short-circuit 時: MOD-RECO-015 / 016 / 017 / 018 / 019 / 020 を呼び出さない（completed_modules に含めない）"
  - "short-circuit 時: 空 Result パスへ遷移（既存 test_zero_candidates_completes_with_empty_result と整合）"
  - "`apps/reco/tests/unit/application/test_recommendation_orchestrator.py` の期待値更新・ケース追加"
  - "Matching フェーズ配線後のデフォルト経路（build_default_stub_ports）の検証"
  - "completed_modules / ExecutionContext キー等、本実装 Port に合わせたアサーション整理（getattr 暫定可）"
  - "テスト用 fixture / helper の最小限整理（Orchestrator デフォルト経路専用）"

out_of_scope:
  - "stubs.py の Port 差し替え（wiring Task）"
  - "`execution_context.py` の型付きフィールド追加（playbook 順序 3）"
  - "getattr から型付き直接参照への置換（playbook 順序 4）"
  - "MOD-RECO-014 / 015 / 016 モジュール本体の変更（テスト成立に必要な最小修正のみ可。要 PR 説明）"
  - "MOD-RECO-014 本体の Matching 算出ロジック変更"
  - "integration test（E2E）/ contract test"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / DB schema 変更"
  - "本番 DB / 外部 API 依存テスト"
  - "段階3 Composition 完成（本番 DI）"

