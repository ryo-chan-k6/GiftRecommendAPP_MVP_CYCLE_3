deliverables:
  - "§19 早期 0 件終了の orchestrator.py 実装"
  - "配線後デフォルト経路の green な pytest スイート"
  - "更新したテスト観点とケースの対応（PR 本文）"
  - "pytest 実行結果（成功ログ）"
  - "Review Definition（`prompts/definitions/reviews/mod-reco-001-wiring-matching/integration-test/pr-review.yaml`、PR 作成前に整備）"

acceptance_criteria:
  - "wiring Task が Epic Branch にマージ済みである"
  - "`cd apps/reco && uv run pytest tests/unit/application/test_recommendation_orchestrator.py -q` が成功する"
  - "デフォルト経路テストが Matching フェーズ（014 / 015 / 016）の本実装呼び出しを反映している"
  - "§19 No.1: 全候補 Matching 対象外シナリオで 014 成功後、015 が呼ばれない"
  - "§19 No.2: Matching 対象 ≥ 1 のとき従来どおり 015 以降が呼ばれる"
  - "§19 No.3: 014 失敗時は GRS-REC-011 で中断（015 未到達）"
  - "§19 No.4: 早期終了時 outcome.success is True、result_status == EMPTY"
  - "§19 No.5: 必要に応じ feature_matcher_candidate_count == 0 が記録される（getattr 暫定可）"
  - "stubs.py に変更がない（またはテスト成立に必要な最小修正のみで PR に説明がある）"
  - "execution_context.py に変更がない"
  - "MOD-RECO-014 / 015 / 016 モジュール本体への不要な変更がない"
  - "テストが本番 DB / 外部 API / secret に依存していない"

