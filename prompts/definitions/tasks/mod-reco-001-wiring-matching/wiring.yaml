test_policy:
  required:
    - "compileall（stubs.py）"
    - "既存 Orchestrator 単体テスト（配線のみ PR では失敗許容を PR に明記。integration-test Task で green 化）"
  commands:
    - "cd apps/reco && python -m compileall src/reco/application/recommendation-orchestrator/stubs.py"
    - "cd apps/reco && uv run pytest tests/unit/application/test_recommendation_orchestrator.py -q"
  manual_checks:
    - "各モジュール implementation PR が develop / Epic 前提 branch に取り込まれていること"
    - "Port I/F（ExecutionContext キー等）が各モジュール unit test / test_orchestrator_integration.py と一致していること"
    - "stubs.py の変更が Matching フェーズ Port に限定されていること"
  not_required:
    - "integration test（E2E）"
  skip_reason:
    "integration test（E2E）": "段階3 Composition 完成 Task の範囲"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "stubs.py の変更が Matching フェーズ Port に限定されているか"
    - "モジュール本体（MOD-RECO-014 / 015 / 016）への変更が混入していないか"
    - "orchestrator.py への変更が混入していないか（§19 は integration-test Task）"
    - "StubXxx クラスが削除されていないか"
    - "起動・User Meaning・Retrieval フェーズの配線が維持されているか"
    - "factory 選択（build_default_*）が各モジュール __init__.py の公開 I/F と一致しているか"
    - "exclusive_files（stubs.py）の直列化方針に反していないか"
    - "integration-test / execution-context-typed-fields 委譲が PR 本文に明記されているか"
    - "execution_context.py への変更が混入していないか"
    - "Task PR target が Epic Branch であるか"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: false

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: false
  reason: "Wiring は Issue / PR で管理"

