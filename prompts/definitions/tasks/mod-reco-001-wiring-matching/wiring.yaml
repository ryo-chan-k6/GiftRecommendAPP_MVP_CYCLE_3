background: |
  Epic #790 配下のフェーズ Wiring Task である。MOD-RECO-001 モジュール仕様書 §8.4 に従い、各モジュール implementation Task 完了後に `recommendation-orchestrator/stubs.py` の `build_default_stub_ports()` で Matching フェーズ Port を本実装へ差し替える。
  対象 Port: feature_matcher, meaning_match_aggregator, context_scorer。
  `StubXxx` クラスは削除せず、失敗注入・明示 DI テスト用に残す（§8.4.1）。
  起動フェーズ（002 / 003）および User Meaning / Retrieval フェーズは変更しない。
  `stubs.py` は `exclusive_files` のため、本 Task は Epic 配下で直列実行する。
  **ExecutionContext 型付きフィールド追加は本 Task scope 外**であり、Epic develop merge 後の follow-up Task（playbook 順序 3）で実施する。
  **§19 Task 分担**: 本 wiring Task は stubs.py の Port 差し替えのみ。Matching 対象 0 件時の Orchestrator 早期 0 件終了（orchestrator.py 変更）は **integration-test Task** の責務。
  正本: `prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/wiring-phase-follow-up-playbook.yaml`

objective: |
  Matching フェーズ Port（feature_matcher / meaning_match_aggregator / context_scorer）を `build_default_stub_ports()` で本実装 factory に差し替え、Orchestrator デフォルト経路が MOD-RECO-014 / 015 / 016 を参照する状態にする。
  デフォルト経路テストの期待値更新および §19 早期 0 件終了は後続 integration-test Task に委譲する。
  ExecutionContext 型付き化および integration 再テストは playbook 順序 3〜4 へ委譲する。

scope:
  - "`apps/reco/src/reco/application/recommendation-orchestrator/stubs.py` の Matching フェーズ Port 差し替え"
  - "対象 Port: feature_matcher, meaning_match_aggregator, context_scorer"
  - "各モジュールの `build_default_*` factory（in-memory MVP composition）の import と `_ensure_*` パッケージ読み込み"
  - "必要に応じた `recommendation-orchestrator/__init__.py` の export 整理（epic_scope 内）"

out_of_scope:
  - "MOD-RECO-014 / 015 / 016 モジュール本体の変更"
  - "`orchestrator.py` の変更（§19 早期 0 件終了ロジック）"
  - "Matching 対象 0 件時の Orchestrator short-circuit 実装"
  - "`execution_context.py` の型付きフィールド追加（playbook 順序 3）"
  - "`test_recommendation_orchestrator.py` の型付き直接参照化（playbook 順序 4）"
  - "起動フェーズ（002 / 003）の再配線"
  - "User Meaning / Retrieval フェーズの再配線"
  - "Ranking / 出力フェーズの Port 差し替え"
  - "`StubXxx` クラスの削除"
  - "Orchestrator デフォルト経路テストの期待値更新（integration-test Task）"
  - "段階3 Composition 完成（本番 DI / DB Repository）"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema 変更"

