background: |
  Matching 各モジュール（014 / 015 / 016）実装では `_attach_*` 時に `execution_context` へ動的付与（`# type: ignore[attr-defined]`）している。
  wiring / integration-test Task scope 外のため、Epic #790 develop merge 後の follow-up Task（playbook 順序 3）として実施する。
  Issue #887（User Meaning / Retrieval 型付き化）には Matching フィールドは含まれない（out_of_scope 明記）。
  正本: `prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/wiring-phase-follow-up-playbook.yaml`

objective: |
  `execution_context.py` に Matching フェーズの型付きフィールドを追加し、
  MOD-RECO-014 / 015 / 016 の `_attach_*` およびモジュール内 `getattr(context, ...)` を直接参照へ置換する。
  `test_recommendation_orchestrator.py` の `getattr` アサーション更新は **integration-retest Task** に委譲する。

scope:
  - "`execution_context.py` への Matching 型付きフィールド追加（feature_match_result / meaning_match_result / context_score_result および観測系 count / latency 等）"
  - "MOD-RECO-014 / 015 / 016 executor の `_attach_*` から `# type: ignore[attr-defined]` 除去"
  - "015 / 016 executor 内の `getattr(context, ...)` を直接参照へ置換（None チェックは維持）"
  - "誤解を招く「Wiring Task で型付きフィールド追加」コメントの削除または修正"
  - "Review Definition（`prompts/definitions/reviews/mod-reco-001-wiring-matching/execution-context-typed-fields/pr-review.yaml`）"

out_of_scope:
  - "`stubs.py` の Port 配線変更"
  - "`test_recommendation_orchestrator.py` の assert 更新（integration-retest Task へ委譲）"
  - "User Meaning / Retrieval フェーズの ExecutionContext フィールド（#887 成果物）"
  - "Ranking / 出力フェーズの ExecutionContext フィールド"
  - "段階3 Composition 完成（本番 DI）"
  - "OpenAPI / DB schema 変更"

