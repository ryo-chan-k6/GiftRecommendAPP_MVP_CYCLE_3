background: |
  Phase3 結果 doc §3.3.1: bench の phase_output / reason は response_built 累積合算を含み、
  reason_generated（≈50ms 帯のデバッグ例）と乖離する。
  正本 §13.2 の soft 3s / hard 7s は合算値根拠のため、計測修正後に見直し要否を整理する。

objective: |
  phase_output が Reason 寄与（主に reason_generated / result_generated 等）を表すよう bench を修正する。
  response_built は別メトリクスまたは除外として明示する。
  再計測で修正効果を示し、正本数値見直しは提案のみとする。

scope:
  - "scripts/perf/reco_pipeline_bench.py（LIVE_PHASE_TO_STEP / phase_output 集計・報告）"
  - "scripts/perf/README.md"
  - "Phase3 結果 doc の計測定義注意更新（または追記結果 doc）"
  - "設計反映メモ / MOD-RECO-001 §13.2.5 の注意文更新（最小）"
  - "mock 再計測（必要なら secrets。実値非 commit）"
  - "本 Task / Review Definition"

out_of_scope:
