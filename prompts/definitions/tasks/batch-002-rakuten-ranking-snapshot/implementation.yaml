schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-002-rakuten-ranking-snapshot-implementation"
  title: "BATCH-002:楽天ランキングスナップショット取得Batch実装"
  summary: "BATCH-002（楽天ランキングスナップショット取得Batch）をバッチ仕様書に基づき apps/batch へ実装する。楽天ランキングAPI連携（fixture/mock可）、Raw保存、Staging、ranking_snapshot / item_popularity_signal、未登録itemCode補完候補、および workflow YAML を対象とする。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]BATCH-002:楽天ランキングスナップショット取得Batch"
  epic_issue_number: "#1192"
  epic_branch: "feature/epic-1192-batch-002-rakuten-ranking-snapshot"
  related_issues:
    - number: 1193
      purpose: "前提（バッチ仕様書 Task・CLOSED）"
  related_prs:
    - number: 1194
      purpose: "バッチ仕様書 Epic Branch merge 済み"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Phase4b レーン B1 Fetch 第2段。バッチ仕様書 #1193 / PR #1194 は Epic Branch merge 済み。
  Phase4a batch-foundation（#734）および BATCH-001（#1161）develop merge 済みを前提に、
  BATCH-002 のランキング Snapshot ジョブを実装する。
  Batch は HTTP API 化しないため Contract Gate は不要。
  実楽天APIへの課金・大量呼出は禁止し、unit は fixture / mock を正とする。

objective: |
  BATCH-002 について、仕様書の処理ステップ（plan → fetch → adapt → raw_save → stage → snapshot → upsert → unknown → finalize）を
  apps/batch 上で実行可能な実装と、起動用 workflow（batch-rakuten-ranking-snapshot.yml）を整備する。

scope:
  - "BATCH-002 ジョブの application 層実装（fetch_plan 解決・Phase 実行・部分失敗方針）"
  - "Rakuten Ranking API Client / Adapter の実装または scaffold 拡張（実API呼出は設定時のみ。unitはmock）"
  - "Raw Object Writer / Raw Metadata / Staging / ranking_snapshot / item_popularity_signal / 未登録itemCode補完候補の配線"
  - "batch_run_log / phase_log / api_call_log / error_log 連携（既存 logger / job_run 骨格の利用）"
  - ".github/workflows/batch-rakuten-ranking-snapshot.yml の新規作成（workflow_call / workflow_dispatch）"
  - "実装に必要な最小 unit test（fixture / mock。主要正常系・冪等・API失敗・未登録itemCode）"
  - "Task / Review Definition の実Issue・Branch反映"

out_of_scope:
  - "バッチ仕様書の全面書き換え（軽微な実装追随注記以外）"
  - "他 Batch（BATCH-001 / BATCH-003〜019）の実装（genre_sync 破壊変更禁止）"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema / migration 変更"
  - "本番楽天APIへの大量・課金影響のある実呼出検証"
  - "専用の包括的 UT Task（後続 unit-test Task で扱う網羅マトリクス）"
  - "日次/週次オーケストレータ本体の新規作成・改修（子workflow起動契約の記載に留める）"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-002_楽天ランキングスナップショット取得バッチ仕様書.md"
      required: true
      purpose: "実装の正本（処理ステップ・入出力・冪等・エラー）"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-002 行との整合確認"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "Raw/Staging・モジュール・object_key 方針"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "楽天ランキングAPIパラメータ・Item正本境界"
    - path: "docs/06_実装設計/database/ranking_snapshot_テーブル定義書.md"
      required: false
      purpose: "Snapshot 冪等キー参照"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ実行スケジュール設計書.md"
      required: false
      purpose: "workflow 名・起動方式の参照"
  templates: []
  files:
    - path: "apps/batch/src/batch/application/genre_sync/**"
      required: false
      purpose: "同型実装の参照（破壊変更しない）"
    - path: "apps/batch/src/batch/infrastructure/rakuten/**"
      required: true
      purpose: "Rakuten client scaffold"
    - path: "apps/batch/src/batch/infrastructure/object_storage/**"
      required: true
      purpose: "Raw Object Writer 骨格"
    - path: "apps/batch/src/batch/infrastructure/db/**"
      required: true
      purpose: "DB writer 骨格"
    - path: "apps/batch/src/batch/config/**"
      required: true
      purpose: "設定・環境変数名"
  issues:
    - number: 1193
      purpose: "バッチ仕様書 Task"
  prs:
    - number: 1194
      purpose: "バッチ仕様書 merge"

output:
  docs: []
  files:
    - path: "apps/batch/src/batch/application/ranking_snapshot/**"
      action: "create"
      required: true
    - path: "apps/batch/src/batch/application/__init__.py"
      action: "update"
      required: false
    - path: "apps/batch/src/batch/infrastructure/rakuten/**"
      action: "update"
      required: true
    - path: ".github/workflows/batch-rakuten-ranking-snapshot.yml"
      action: "create"
      required: true
    - path: "prompts/definitions/tasks/batch-002-rakuten-ranking-snapshot/implementation.yaml"
      action: "update"
      required: true
    - path: "prompts/definitions/reviews/batch-002-rakuten-ranking-snapshot/implementation/pr-review.yaml"
      action: "create"
      required: true
  tests:
    - path: "apps/batch/tests/unit/**"
      action: "create_or_update"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "BATCH-002 ランキング Snapshot ジョブ実装"
  - "batch-rakuten-ranking-snapshot.yml"
  - "最小 unit test（fixture / mock）"

acceptance_criteria:
  - "バッチ仕様書の主要 Phase（plan/fetch/adapt/raw_save/stage/snapshot/upsert/unknown/finalize）がコード上で追跡できる"
  - "Rakuten Ranking 取得が Protocol / mock 経由で単体テスト可能である"
  - "ranking_snapshot / item_popularity_signal の冪等キー方針が実装または明示コメントで担保されている"
  - "未登録 itemCode で Item 正本を作らず補完候補を残す"
  - ".github/workflows/batch-rakuten-ranking-snapshot.yml が存在し、workflow_dispatch（および workflow_call）を持つ"
  - "secret / .env 実値 / 楽天APIキー実値をコード・fixture・workflow・ログに含まない"
  - "OpenAPI / generated / DB migration を変更していない"
  - "親 Epic の epic_scope.allowed_paths 外を編集していない"
  - "最小 unit test がローカルで実行可能である"

branch:
  no_branch: false
  name: "feature/task-<issue-number>-batch-002-rakuten-ranking-snapshot-implementation"
  summary: "batch-002-rakuten-ranking-snapshot-implementation"
  base: "feature/epic-1192-batch-002-rakuten-ranking-snapshot"
  target: "feature/epic-1192-batch-002-rakuten-ranking-snapshot"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-13"
    due_date: "2026-07-15"

issue:
  unit: "task"
  type: "feature"
  area: "batch"

dependencies:
  epics:
    - issue: 734
      title: "[Epic]batch-foundation:Batch共通基盤"
      purpose: "Phase4a Batch 共通基盤（CLOSED）"
    - issue: 1161
      title: "[Epic]BATCH-001:楽天ジャンル同期Batch"
      purpose: "先行 Fetch（CLOSED / develop merge）"
  issues:
    - number: 1193
      purpose: "バッチ仕様書（CLOSED）"
  prs:
    - number: 1194
      purpose: "バッチ仕様書 Epic Branch merge 済み"
  tasks:
    - "バッチ仕様書が親 Epic Branch に取り込まれていること"
  blocking: false

contract_gate:
  required: false

parallel_control:
  depends_on:
    - "task-batch-002-rakuten-ranking-snapshot-batch-spec"
  blocks:
    - "task-batch-002-rakuten-ranking-snapshot-unit-test"
  exclusive_files:
    - "apps/batch/src/batch/application/ranking_snapshot/**"
    - "apps/batch/src/batch/infrastructure/rakuten/**"
    - ".github/workflows/batch-rakuten-ranking-snapshot.yml"
  conflict_risk: "medium"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
    - "batch unit test（BATCH-002 最小）"
    - "secret check"
  commands:
    - "cd apps/batch && uv sync --extra dev"
    - "cd apps/batch && uv run python -m pytest tests/unit -q --tb=short"
  not_required:
    - "integration test（実楽天API）"
    - "contract test"
  skip_reason:
    "integration test（実楽天API）": "課金・Rate Limit 影響のため fixture/mock を正とする"
    "contract test": "Batch は HTTP API 化しないため対象外"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "バッチ仕様書の処理ステップ・冪等・エラー方針と実装が整合しているか"
    - "epic_scope.allowed_paths 内に閉じているか"
    - "Item 正本をランキングAPIから作っていないか"
    - "secret / .env 実値が含まれていないか"
    - "PR target が親 Epic Branch であるか"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: true
  reason: "識別子単位 Batch 実装の初期縦串"

human_decision_points:
  - "仕様書 §18 No.2: Staging→Snapshot 本 Batch 内完結の基本案で実装する"
  - "仕様書 §18 No.1: MVP初期ジャンルID / period は placeholder。本番値は Human 設定"
  - "包括的 UT マトリクスは後続 unit-test Task に分離する"

stop_conditions:
  - "必須 input.docs（バッチ仕様書）が存在しない場合"
  - "親 Epic Issue / Branch が未確定の場合"
  - "OpenAPI / generated / migration 変更が必要になった場合"
  - "epic_scope.allowed_paths 外の編集が必要になった場合"
  - "実楽天APIへの大量・課金影響のある検証が必須に見える場合"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "Issueタイトル: [Task]BATCH-002:楽天ランキングスナップショット取得Batch実装"
  - "Contract Gate 不要"
  - "後続: unit-test Task Definition を別途作成し縦串を完了する"
  - "parent / branch の issue 番号は /start-task 後に実値へ更新する"
