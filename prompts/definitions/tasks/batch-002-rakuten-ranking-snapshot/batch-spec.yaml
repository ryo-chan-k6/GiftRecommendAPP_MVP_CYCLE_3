  - "先行・後続 Batch・冪等キー・ログ・エラーコード参照を整理する"
  - "楽天ランキングAPI連携・Raw / Staging / ranking_snapshot / item_popularity_signal 反映方針を整理する"
  - "未登録 itemCode 補完候補（BATCH-003 向け）の扱いを整理する"

