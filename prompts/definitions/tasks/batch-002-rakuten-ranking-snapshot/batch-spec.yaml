  Batch ID の正本はバッチ処理一覧の `BATCH-*` とする（`BT-*` は Task タイトルに使用しない）。
  Phase4b レーン B1 Fetch 第2段。先行 BATCH-001 のジャンル同期を前提とする。

objective: |
  BATCH-002（楽天ランキングスナップショット取得Batch）について、実装・レビューが可能な粒度のバッチ仕様書を作成する。

