background: |
  Phase4b 縦串の 1/3（実装面仕様書）。契約面は `API-PUB-004_Feedback送信API契約仕様書.md`（#400 / PR #406）を正とする。
  OpenAPI 断片（#420 / PR #421）および recommendation_feedback テーブル定義書は develop 反映済み。
  本 Task は契約・OpenAPI・DB schema を変更せず、apps/api の MOD-API-007〜010（Feedback Controller / Validator / Service / Repository）実装 Task が参照可能な **実装面のみ** を整理する。
  Provider は apps/api（`apps/api/src/app/feedback/**`）、Consumer は apps/web（SCR-007 Feedback 入力等）。
  Reco 呼び出しは行わない（Feedback は api レイヤで完結）。
  レーン 5（並列計画）。Epic Branch は develop 同期済みを前提とする。
  構造の参考は api-pub-005 / api-pub-007 の api-implementation-spec.yaml。

objective: |
  API-PUB-004（Feedback送信 / Public API）について、apps/api feedback 実装 Task / 単体テスト Task が参照可能な粒度の **API実装仕様書（実装面のみ）** を新規作成する。
  成果物は prompts/templates/docs/api-implementation-spec.md に準拠し、契約面の章は再掲しない。
  Express Router、MOD-API-007〜010 責務、Validation、Result/ResultItem 存在確認、recommendation_feedback 保存、冪等（sessionId + 対象 + feedbackType）、エラー境界、metric を明記する。

scope:
  - "API-PUB-004 の API実装仕様書を新規作成する（API-PUB-004_Feedback送信API実装仕様書.md）"
  - "前提契約・OpenAPI / Contract Gate / recommendation_feedback 等テーブル定義を整理する"
  - "実装方針（feedback Router / MOD-API-007〜010 / request-meta / DI）を整理する"
  - "処理フロー（Mermaid）と処理詳細を整理する（Path/Body 検証 → Result 存在確認 → 冪等判定 → INSERT/UPDATE → Response）"
  - "Request / DB 列 → 内部 DTO → Public Response のマッピングを整理する"
  - "匿名 Feedback（MVP）・sessionId 扱い・重複時 409 GRS-FDB-003 の実装面を整理する"
  - "GRS-FDB-* / GRS-REQ-* / GRS-DB-* エラー境界を整理する"
  - "feedback_count / feedback_error_count 等 metric を整理する"
  - "generated client 利用方針（記載のみ）"
  - "provider / consumer 実装影響を整理する"
  - "実装結合テスト観点・未決事項・Human Review 観点を明記する"

out_of_scope:
  - "API-PUB-003 / 005〜008 の実装仕様書作成・変更"
  - "契約面章の再掲・契約仕様書の変更"
  - "OpenAPI / Orval / generated 変更"
  - "apps/api / apps/web / apps/reco の実装"
  - "DB schema / migration / seed 変更"
  - "認証・認可方式そのものの変更"
  - "画面仕様書（SCR-007 等）の作成"

