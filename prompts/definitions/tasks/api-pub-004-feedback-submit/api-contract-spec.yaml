background: |
  Phase1 ① API契約仕様書（1a）として、API-PUB-004（Feedback送信 / Public API）の契約面（Request / Response / Error / Validation / 互換性 / OpenAPI 反映方針）を確定する。
  実装フェーズ実行プロセス設計書 §4.1（分離後モデル）に従い、処理フロー・MOD-API-007〜010 連携・内部 DTO マッピング・結合テスト観点などの実装面は本 Task の対象外とし、`api-implementation-spec.yaml` で Phase4 実装設計時に作成する。
  apps/reco の変更は本 Epic 対象外。Feedback 保存は api レイヤ（MOD-API-007 Feedback Controller / MOD-API-008 Feedback Validator / MOD-API-009 Feedback Service）で完結する前提とする。

objective: |
  API-PUB-004（Feedback送信 / Public API、`POST /api/v1/recommendation-results/{resultId}/feedback`）について、Contract Gate および後続 OpenAPI Contract Task の入力となる API 契約仕様書を作成する。
  成果物は prompts/templates/docs/api-contract-spec.md に準拠し、契約面のみを記載する（api-implementation-spec.md の章は含めない）。
  OpenAPI / Orval / generated の実ファイル変更は後続 Contract Task へ分離する。

scope:
  - "API-PUB-004 の API 契約仕様書を新規作成する（成果物: API-PUB-004_Feedback送信API契約仕様書.md）"
  - "API基本情報（API ID / API種別 Public / Method POST / Endpoint /api/v1/recommendation-results/{resultId}/feedback / Base URL / Version / Provider apps/api / Consumer apps/web / 認証要否 / 冪等性 / MVP対象）を定義する"
  - "Request Header / Path Parameters / Query Parameters / Request Body（feedbackTargetType / resultItemId / feedbackType / rating / comment 等）を整理する"
  - "Response Header / Status Code / Response Body（Feedback受付結果・traceId 等）を整理する"
  - "Error Response仕様（GRS-FDB-* / GRS-REQ-* / GRS-DB-* 等）を整理する"
  - "MVP では匿名 Feedback として扱う方針を明示する（API一覧 §API-PUB-004 メモ）"
  - "重複 Feedback の HTTP 409（GRS-FDB-003）方針を整理する"
  - "バリデーション仕様を整理する"
  - "OpenAPI / Orval / generated 反映方針（packages/contracts/openapi/public-api.yaml、apps/web/src/generated/api/ 再生成）を整理する（方針のみ。ファイル変更は out_of_scope）"
  - "互換性・破壊的変更・契約面テスト観点を整理する"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
  - "API実装仕様書（api-implementation-spec.md 準拠）の作成（prompts/definitions/tasks/api-pub-004-feedback-submit/api-implementation-spec.yaml）"
  - "処理概要（MOD-API-007〜010 の詳細フロー）・内部 DTO マッピング・provider/consumer 実装影響の詳細・結合テスト観点の確定"
  - "apps/reco の仕様・実装変更"
  - "OpenAPI定義ファイル（packages/contracts/openapi/public-api.yaml 等）の作成・更新"
  - "Orval設定ファイル（orval.config.ts）の作成・更新"
  - "generated API client（apps/web/src/generated/api/）の再生成"
  - "apps/api の実装"
  - "apps/web の実装（画面側 SCR-007 等）"
  - "DB schema 変更"
  - "DDL 作成・変更"
  - "認証・認可方式そのものの変更"
  - "API一覧全体の再設計"
  - "Recommendation Feedback 定義書そのものの変更"
  - "画面仕様書（SCR-007 等）の作成"
  - "他 API（API-PUB-001〜003 / 005〜008 / API-INT-*）の仕様書作成"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/api/API設計方針書.md"
      required: true
      purpose: "URL 設計、HTTP Method、認証、エラー形式、Feedback API 方針、バージョニング等の API 設計方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "API-PUB-004 の endpoint、API種別、Provider、Consumer、MVP対象、関連画面、関連エラーコードを確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
      purpose: "Error Response、HTTP Status、GRS-FDB-* / GRS-REQ-* / GRS-DB-* エラーコード参照、ユーザー向け表示方針を確認するため"
    - path: "docs/04_ドメインモデル設計/RecommendationFeedback定義書.md"
      required: true
      purpose: "Recommendation Feedback のドメイン定義を Request Body へ反映するため"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: true
      purpose: "Feedback 対象となる Recommendation Result / Result Item の存在確認前提を確認するため"
    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: false
      purpose: "Public API の認証要否・Feedback 不正対策を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: false
      purpose: "trace_id / access_log / metric 方針を確認するため"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase1 1a（契約面のみ）と Phase4 実装仕様書分離の正本を確認するため"
  templates:
