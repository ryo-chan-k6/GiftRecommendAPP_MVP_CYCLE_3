acceptance_criteria:
  - "`POST .../feedback` が注入 Repository/Service で 201 accepted または 200 updated と契約外形を返す"
  - "Validation 失敗は 400（GRS-FDB-001 / GRS-FDB-004 / GRS-REQ-001）、対象なしは 404 GRS-FDB-002"
  - "冪等一致時は 200 updated。MVP で GRS-FDB-003（409）を返さない"
  - "Response に sessionId / user_agent / anonymous_user_id / stack を含めない"
  - "feedback_count / feedback_error_count（および正負 count）が記録境界どおり動く（logger 注入検証）"
