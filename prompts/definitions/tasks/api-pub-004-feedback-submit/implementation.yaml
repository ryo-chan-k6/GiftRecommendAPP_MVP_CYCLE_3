background: |
  Phase4b 縦串の 2/3（apps/api 実装）。前提: 実装仕様書 #1226 / PR #1245 が親 Epic Branch に merge 済み。
  契約・OpenAPI・recommendation_feedback テーブル定義は develop 反映済み。
  Provider は apps/api（`apps/api/src/app/feedback/**`）、Consumer は apps/web（SCR-007 等・本 Task 対象外）。
  Reco 呼び出しは不要。MVP は非認証・冪等更新（200）/ 新規（201）。網羅 UT は後続 unit-test Task に委譲し、本 Task では最小スモークを含める。
  レーン 5。

objective: |
  `POST /api/v1/recommendation-results/{resultId}/feedback` を契約・OpenAPI・実装仕様書に沿って apps/api 上で提供する。
  MOD-API-007〜010、Validation、存在確認、冪等 INSERT/UPDATE、Response 組立、エラーマップ、metric 境界を実装する。

scope:
  - "`apps/api/src/app/feedback/**` の新規実装（Router / Controller / Validator / Service / Repository）"
  - "`POST /api/v1/recommendation-results/{resultId}/feedback` の成功 Response（201 accepted / 200 updated）"
  - "Path/Body Validation（GRS-FDB-001 / GRS-FDB-004 / GRS-REQ-001）"
  - "Result / Item / Reason 存在確認（404 GRS-FDB-002）"
  - "冪等（sessionId + 同一対象 + feedbackType → UPDATE 200。GRS-FDB-003 は返却しない）"
  - "feedback_count / feedback_error_count / positive_feedback_count / negative_feedback_count"
  - "`createApp` への Router mount"
  - "最小スモーク単体テスト（DI 注入）"
  - "Task / Review Definition 整備"
  - "親 Epic epic_scope.allowed_paths に app.ts / tests を不足分として整合（必要な場合）"

out_of_scope:
  - "packages/contracts/openapi/** の変更"
  - "Orval / generated の再生成・手動編集"
  - "apps/web/** の変更"
  - "apps/reco/** の変更"
  - "API-PUB-004 契約仕様書・実装仕様書 docs の変更"
  - "DB schema 変更・migration・seed 変更"
  - "API-PUB-003 / 005〜008 の実装変更"
  - "sessionId 採番方式の確定（web 側・Human 判断）"
  - "網羅的単体テスト Task（Phase4b 3/3）"
  - "結合テスト・E2E"

