    - "デフォルト composition Ranking テストが型付き参照後も green であるか"
    - "execution_context.py / stubs.py への不要な変更がないか"
    - "develop 直 PR 例外が PR 本文で説明されているか"
    - "pytest 実行結果が PR 本文に記載されているか"
