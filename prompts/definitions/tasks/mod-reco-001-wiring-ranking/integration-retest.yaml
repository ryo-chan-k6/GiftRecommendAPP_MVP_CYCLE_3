background: |
  Issue #969（Ranking integration-test）では配線後のデフォルト composition を green 化したが、
  ExecutionContext の Ranking フィールドは型付き化前のため `getattr` で存在確認していた。
  Ranking execution-context-typed-fields Task（#972 / PR #973）merge 後、本 Task で当該テストを型付き直接参照へ更新する。
  正本: `prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/wiring-phase-follow-up-playbook.yaml`

objective: |
  `test_default_composition_populates_ranking_execution_context` 等の Ranking 向けアサーションを
  ExecutionContext 型付きフィールドの直接参照へ置換し、pytest green を維持する。

scope:
  - "`apps/reco/tests/unit/application/test_recommendation_orchestrator.py` の Ranking 向け `getattr` アサーション置換"
  - "`recommendation_orchestrator_helpers.py` の `assert_ranking_execution_context_populated` を型付き直接参照へ整理"
  - "テスト用 helper の最小限整理（Ranking context assert 専用）"
  - "Review Definition（`prompts/definitions/reviews/mod-reco-001-wiring-ranking/integration-retest/pr-review.yaml`）"

out_of_scope:
  - "`execution_context.py` のフィールド追加（execution-context-typed-fields Task）"
  - "User Meaning / Retrieval / Matching 向け `getattr` アサーション置換（別 Task）"
  - "stubs.py / モジュール本体の変更（テスト成立に必要な最小修正のみ可。要 PR 説明）"
  - "integration test（E2E）/ contract test"
  - "OpenAPI / DB schema 変更"

