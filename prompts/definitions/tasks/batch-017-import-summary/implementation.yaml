  commands:
    - "cd apps/batch && uv run python -m pytest tests/unit/application/test_import_summary.py -q --tb=short"
  not_required:
    - "integration test"
  skip_reason:
    "integration test": "scaffold-first。実 DB 配線は後続"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "IF-DB-BATCH-017 が物理書込（item_import_summary INSERT）。016 / OBS-006 と混同しない"
    - "ON CONFLICT DO NOTHING。UPDATE しない"
    - "source_api 0 固定・Feature/Embedding 未完了 0"
    - "phase_log summary_created"
    - "workflow C 併用（独立子 + distribution-metrics 末尾 017 step）"
    - "016 本体 / 親 workflow 全体は非変更"
    - "secret 非含有"
  specialist_reviews:
    test: true
    security: true

human_decision_points: []

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false

notes:
