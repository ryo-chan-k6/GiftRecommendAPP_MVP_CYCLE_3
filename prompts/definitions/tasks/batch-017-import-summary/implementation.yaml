    - "apps/batch/src/batch/application/import_summary/**"
    - ".github/workflows/batch-import-summary.yml"
    - ".github/workflows/batch-distribution-metrics.yml"
  conflict_risk: "medium"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
