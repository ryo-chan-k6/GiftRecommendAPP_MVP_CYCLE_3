  title: "BATCH-017:Import Summary作成Batch実装"
  summary: "BATCH-017 を scaffold-first 実装する。IF-DB-BATCH-017 で item_import_summary INSERT（ON CONFLICT DO NOTHING）、独立子 workflow + distribution-metrics 末尾 017 step、MOD-BATCH-047、最小 UT を対象とする。"

work_mode: "ai-agent"

parent:
