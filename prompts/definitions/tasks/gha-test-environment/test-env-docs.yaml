  Epic C = システム/品質 focus である旨、全テストレベル対応表（§2.6）、Layer1/Layer2/Layer3 の境界を明記する。

objective: |
  テスト環境 docs（Layer2 GHA ephemeral、workflow 一覧、Agent 運用パターン）を正本化し、
  テスト定義書・CI・CD方針書・Epic C Epic Definition の agent_test_operations と整合させる。

scope:
