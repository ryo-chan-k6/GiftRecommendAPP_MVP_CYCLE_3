schema_version: "1.0"
definition_type: "task"

task:
  id: "task-gha-test-environment-test-env-docs"
  title: "テスト環境docs正本化"
  summary: "テスト環境・Agent テスト運用（全レベル対応表 §2.6）の docs を正本化する。Epic C Task C6・Epic 完了前。"
  phase: "06_実装設計"

work_mode: "ai-agent"

