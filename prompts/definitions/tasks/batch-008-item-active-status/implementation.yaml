background: |
  Phase4b active_status 本更新段。仕様書 #1380 / PR #1381 は Epic Branch merge 済み。
  Epic #1227 由来の item_active_status/** 骨格・競合 UT・Retention scaffold は再利用し、同ロジックの二重実装をしない。
  §20.2 ギャップ（独立 YAML / BATCH_ITEM_ACTIVE_STATUS_* config / CLI 運用引数）を本 Task で埋める。
  Contract Gate 不要。unit は fixture / mock 正。包括的 UT は後続 unit-test Task。
  §18.1 No.8（独立 YAML）・No.11（Retention T7 本 Epic 外）を作業仮定として採用する。
  本番 Postgres 接続は BATCH-007 同型 scaffold-first（非 demo は exit 3）。

objective: |
  BATCH-008 について、仕様書 §20.2 の実装ギャップを埋め、
  起動用独立 workflow（batch-rakuten-item-active-status.yml）と config / CLI 配線を整備する。
  Retention T7 本番化・親チェーン改修・楽天 API 呼出は行わない。

scope:
  - "既存 item_active_status ジョブの必要最小拡張（二重実装禁止）"
  - "config: BATCH_ITEM_ACTIVE_STATUS_MAX_ITEMS / SOURCE / BATCH_RUN_ID"
  - "CLI: --max-items / --source / --batch-run-id / --external-item-codes（007 同型）"
  - ".github/workflows/batch-rakuten-item-active-status.yml（workflow_call / workflow_dispatch）"
  - "最小 unit test（config load / CLI 引数 / Applier が Retention DELETE を呼ばない）"
  - "Task / Review Definition"

out_of_scope:
  - "バッチ仕様書の全面書き換え（軽微な実装追随注記以外）"
  - "他 Batch 実装の破壊変更（product_diff / item_apply / raw_staging / item_recheck 等）"
  - "親 item-import / existing-item-recheck チェーン workflow 全体改修・配線"
  - "OpenAPI / Orval / generated / DB migration"
  - "楽天 API 呼出"
  - "Retention T7 本番化・専用 schedule（#1235）"
  - "BATCH-004 候補 INSERT Writer"
  - "本番 Postgres SQL アダプタ本実装（scaffold-first）"
  - "Staging Validator 本配線"
  - "包括的 UT Task（後続 unit-test Task）"
  - "BATCH-009"

