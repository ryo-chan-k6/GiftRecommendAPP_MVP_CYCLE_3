  仕様書 #1490 / PR #1491 Epic Branch merge 済み。§18.1/§18.2 で IF 区別・任意入力 OFF・038 内包・
  aggregation_scope 既定・独立子 workflow を確定済み。

objective: |
  scaffold-first 実装と batch-distribution-metrics.yml を整備する。

scope:
  - "IF-DB-BATCH-016 で feature/meaning/normalization_distribution_metric UPSERT"
