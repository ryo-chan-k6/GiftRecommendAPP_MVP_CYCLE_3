  - "MOD-BATCH-038 内包（Aggregator 追加採番なし）"
  - "config BATCH_DISTRIBUTION_METRICS_*"
  - "batch-distribution-metrics.yml"
  - "最小 UT"
  - "Task / Review Definition"

