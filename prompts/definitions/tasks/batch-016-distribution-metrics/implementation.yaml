  - "IF-DB-BATCH-014 / 015 / VEC-001 を書かない"
  - "item_embedding / user_meaning はフラグ OFF 時スキップ"
  - "phase_log が feature_distribution_metric_recorded のみ"
  - "非 scaffold-demo は exit 3"
  - "secret 非含有"
  - "PR target が親 Epic Branch"

