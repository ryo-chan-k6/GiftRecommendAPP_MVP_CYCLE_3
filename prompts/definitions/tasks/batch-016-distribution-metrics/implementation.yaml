  - "実 DB 配線"
  - "BATCH-013/015 再実装 / BATCH-017 以降"
  - "apps/reco / OpenAPI / migration / generated"
  - "親 meaning-generation / daily 親 workflow 全体改修"
  - "バッチ処理一覧の古い表記修正（別 docs Task）"
  - "包括的 UT Task"
  - "Aggregator モジュール追加採番"

