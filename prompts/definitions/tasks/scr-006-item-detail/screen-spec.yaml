    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  06_実装設計において、web 実装の前提となる画面仕様書を作成する。
  develop の `/items/[itemId]` はプレースホルダのみ。API-PUB-003（develop 済み）を前提に、表示項目・画面状態・遷移・エラー UX を整理する。

objective: |
  SCR-006（商品詳細画面）について、実装・レビューが可能な粒度の画面仕様書を作成する。
  作成する仕様書は prompts/templates/docs/screen-spec.md に準拠する。

scope:
  - "SCR-006 の画面仕様書を新規作成する（成果物: SCR-006_商品詳細画面画面仕様書.md）"
  - "画面目的・対象ユーザー・表示項目を整理する"
  - "画面状態（読込中 / 成功 / 404 / 422 inactive / DB・通信失敗）と遷移を整理する"
  - "データ取得方針（API-PUB-003 GET /api/v1/items/{itemId}）を整理する"
  - "SCR-004 への戻り導線・外部EC遷移・理由詳細/Feedback 導線の MVP 範囲を明記する"
  - "既存プレースホルダ差し替え方針を明記する"

out_of_scope:
  - "他画面（SCR-006 以外）の画面仕様書作成"
  - "OpenAPI / generated / ソースコード実装"
  - "API-PUB-003 契約・実装の変更"
  - "SCR-005 / SCR-007 の本実装仕様確定（導線レベルに留める）"
  - "認証・認可方式そのものの変更"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
      purpose: "SCR-006 の画面ID・表示項目・操作を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
      purpose: "遷移元 SCR-004・外部EC・理由/Feedback を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "API-PUB-003 の位置づけを確認するため"
    - path: "docs/06_実装設計/api/API-PUB-003_商品詳細取得API契約仕様書.md"
      required: true
      purpose: "Response / Error の正本確認"
    - path: "docs/06_実装設計/web/SCR-004_レコメンド結果一覧画面画面仕様書.md"
      required: true
      purpose: "結果一覧からの導線・fromResultId 等の分担確認"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: false
      purpose: "GRS-ITM-* 等の画面表示方針確認"
  templates:
    - path: "prompts/templates/docs/screen-spec.md"
      required: true
      purpose: "画面仕様書を標準フォーマットで作成するため"
      applies_to:
        - "docs/06_実装設計/web/SCR-006_商品詳細画面画面仕様書.md"
  files: []
  issues: []
  prs: []

output:
  docs:
    - path: "docs/06_実装設計/web/SCR-006_商品詳細画面画面仕様書.md"
      action: "create"
      required: true
      template: "prompts/templates/docs/screen-spec.md"
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "SCR-006 画面仕様書"
  - "表示項目定義"
  - "画面状態・遷移・API-PUB-003 取得方針の整理"
  - "SCR-004 / 外部EC / SCR-005・007 導線の MVP 範囲整理"

acceptance_criteria:
  - "docs/06_実装設計/web/SCR-006_商品詳細画面画面仕様書.md が作成されている"
  - "prompts/templates/docs/screen-spec.md の章構成に準拠している"
  - "画面一覧の SCR-006 と矛盾する画面ID・画面名・MVP対象を定義していない"
  - "データ取得が API-PUB-003 である方針と整合している"
  - "表示しない項目（feature / embedding / shopName MVP 省略等）が契約・画面一覧と矛盾していない"
  - "secret、APIキー、.env実値を含んでいない"

