background: |
  出力各モジュール（021 / 022 / 023）実装では `recommendation_result` ドメインオブジェクト経由の受け渡しが主であるが、
  観測系メトリクスは `version_info` とログにのみ記録され、ExecutionContext トップレベルには未設定である。
  Ranking フェーズ（#972）と同様、Epic #792 develop merge 後の follow-up Task（playbook 順序 3）として
  出力フェーズの観測系フィールドを `execution_context.py` に型付き追加し、各 `_attach_outputs` から設定する。
  正本: `prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/wiring-phase-follow-up-playbook.yaml`

objective: |
  `execution_context.py` に出力フェーズの型付き観測フィールドを追加し、
  MOD-RECO-021 / 022 / 023 executor の `_attach_outputs` から context へ直接設定する。
  `test_recommendation_orchestrator.py` の assert 更新は **integration-retest Task** に委譲する。

scope:
  - "`execution_context.py` への出力フェーズ型付きフィールド追加（result_builder / snapshot_builder / reason_generator 観測系）"
  - "MOD-RECO-021 / 022 / 023 executor の `_attach_outputs` から context フィールド設定"
  - "Review Definition（`prompts/definitions/reviews/mod-reco-001-wiring-output/execution-context-typed-fields/pr-review.yaml`）"

out_of_scope:
  - "`stubs.py` の Port 配線変更"
  - "`test_recommendation_orchestrator.py` の assert 更新（integration-retest Task へ委譲）"
  - "Ranking / Matching 等他フェーズの ExecutionContext フィールド"
  - "`recommendation_result` ドメイン型自体の変更"
  - "段階3 Composition 完成（本番 DI）"
  - "OpenAPI / DB schema 変更"

