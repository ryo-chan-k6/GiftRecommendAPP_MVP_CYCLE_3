    - "既存 Orchestrator 単体テスト（配線のみ PR では失敗許容を PR に明記。integration-test Task で green 化）"
  commands:
    - "cd apps/reco && python -m compileall src/reco/application/recommendation-orchestrator/stubs.py"
    - "cd apps/reco && uv run pytest tests/unit/application/test_recommendation_orchestrator.py -q"
  manual_checks:
    - "各モジュール implementation PR が develop に取り込まれていること"
    - "Port I/F（ExecutionContext キー等）が各モジュール unit test と一致していること"
    - "stubs.py の変更が出力フェーズ Port に限定されていること"
  not_required:
