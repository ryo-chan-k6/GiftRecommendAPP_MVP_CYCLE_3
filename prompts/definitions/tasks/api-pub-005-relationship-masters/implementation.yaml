background: |
  Phase4b 縦串の 2/3（apps/api 実装）。前提: 実装仕様書 #1166 / PR #1168 が親 Epic Branch に merge 済み。
  契約・OpenAPI・relationship_master テーブル定義は develop 反映済み。
  Provider は apps/api（`apps/api/src/app/masters/**`）、Consumer は apps/web（SCR-002・本 Task 対象外）。
  MVP は都度 SELECT・非認証・Pair 非公開。網羅 UT は後続 unit-test Task に委譲し、本 Task では最小スモークを含める。

objective: |
  `GET /api/v1/masters/relationships` を契約・OpenAPI・実装仕様書に沿って apps/api 上で提供する。
  MOD-API-011 / MOD-API-012、`relationship_master` 読取、Response 組立、エラーマップ、metric 境界を実装する。

scope:
  - "`apps/api/src/app/masters/**` の新規実装（Router / Repository）"
  - "`GET /api/v1/masters/relationships` の成功 Response（relationships + meta）"
  - "`is_active=true` フィルタと `ORDER BY display_order, relationship_code`"
  - "0 件時 200 空配列と GRS-CFG-005 / GRS-DB-002 の境界"
  - "trace / requestId の Header ↔ meta 一貫（`resolveRequestMeta`）"
  - "masters_relationships_request_count / masters_relationships_error_count の最小記録"
  - "`createApp` への Router mount"
  - "最小スモーク単体テスト"
  - "Task / Review Definition 整備"

out_of_scope:
  - "packages/contracts/openapi/** の変更"
  - "Orval / generated の再生成・手動編集"
  - "apps/web/** の変更"
  - "apps/reco/** の変更"
  - "API-PUB-005 契約仕様書・実装仕様書 docs の変更"
  - "DB schema 変更・migration・seed 変更"
  - "API-PUB-006〜008 の実装"
  - "プロセス内キャッシュ導入"
  - "網羅的単体テスト Task（Phase4b 3/3）"
  - "結合テスト・E2E"

