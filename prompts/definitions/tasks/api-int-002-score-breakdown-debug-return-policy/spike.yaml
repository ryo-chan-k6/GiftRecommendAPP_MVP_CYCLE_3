background: |
  API-INT-002 契約仕様書 §14 の未決事項 No.3（scoreBreakdown / debug_payload の返却条件）を個別 Issue #375 で管理する。
  Internal API では Item 単位の scoreBreakdown と Run 単位の debug 情報を返せるが、evaluation / includeDebugInfo 時の必須度と API フィールドマッピングが未確定である。
  Recommendation Result 定義書 §9.2 では debug 時のみ score_breakdown / debug_payload を返却する方針があるが、Request フラグ（mode / includeDebugInfo）との対応が契約仕様書に明文化されていない。

objective: |
  scoreBreakdown / debugPayload の返却条件を Human 判断で確定し、正本 docs へ反映する。

  確定方針（Human Review 承認済みたたき台）:
  - 「debug返却条件」= execution.mode = evaluation OR execution.includeDebugInfo = true（batch は含めない）
  - debug返却条件を満たすとき: resultItems[].scoreBreakdown 推奨、data.metadata.debugPayload 推奨（契約上必須ではない）
  - ui かつ includeDebugInfo=false、または batch かつ includeDebugInfo=false: 両方省略
  - 欠落時: SCORE_BREAKDOWN_MISSING 相当をログ（phase_log / error_log）に記録し HTTP 200 継続。warnings[] には載せない
  - metadata.debugPayload: open object（追加キー許容）。推奨キーは evalCaseId / configName / versionLabel / modelVersionId / rankingConfigVersionId / phaseSummary
  - Public API 非表面化: api が scoreBreakdown / metadata.debugPayload を Public へ渡さない（現行維持）

scope:
  - "「debug返却条件」の用語定義を API-INT-002 契約仕様書 §7 に追記する"
  - "返却条件マトリクス（mode × includeDebugInfo）を §7.3.1 / §7.3.2 に追記する"
  - "data.metadata.debugPayload の定義（Run 単位・推奨キー列挙・open object）を §7.3.1 に追記する"
  - "scoreBreakdown 欠落時の tolerant 処理（ログのみ・200 継続）を §7.3.2 または §9 に追記する"
  - "§14 No.3 を確定済み（§14.1）へ移し、未決一覧から除外する"
  - "ai-logs/human-decisions/ に判断記録を作成する"
  - "Recommendation Result 定義書 §9.2 に API-INT-002 への相互参照 footnote を追記する（表現矛盾がある場合のみ最小修正）"
  - "Issue #375 完了条件（人間判断・docs 反映）を満たす"

out_of_scope:
  - "OpenAPI（internal-reco-api.yaml / Public）の変更"
  - "apps/reco / apps/api / apps/web の実装変更"
  - "scoreBreakdown JSON 内部キーの詳細確定（Ranking 定義書レベル。実装 Task で確定）"
  - "metadata.debugPayload の詳細スキーマ固定（OpenAPI Task で確定）"
  - "warnings[] への SCORE_BREAKDOWN_MISSING 追加"
  - "API-PUB-002 契約仕様書の新規作成（参照追記のみ可）"

