schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-db-write-005-staging-upsert"
  title: "batch-db-write-005:staging UPSERT本配線"
  summary: "Wave 1 として staging_item / staging_item_image UPSERT と import_status UPDATE を本番 SQL で本配線する。ranking/genre は Wave 2。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-db-write-005:BATCH-005 staging書込本格化"
  epic_issue_number: 1632
  epic_branch: "feature/epic-1632-batch-db-write-005"
  related_issues:
    - 1629
  related_prs:
    - 1630
    - 1657

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  SELECT #1623 MERGED 後、BATCH-005 は読取可能だが書込は write_rows probe のまま。
  実環境で Staging / mark_failed が失敗するため、本番 UPSERT / UPDATE を本配線する。

objective: |
  upsert_staging_item / upsert_staging_item_images / mark_staged / mark_failed を
  DbWriter の本番 SQL（upsert_rows / update_rows / delete_rows）で本配線する。

scope:
  - "staging_item: upsert_rows conflict (raw_metadata_id, external_item_code)"
  - "staging_item_image: upsert_rows conflict (raw_metadata_id, external_item_code, image_url) + 集合外 DELETE"
  - "raw_product_metadata: mark_staged / mark_failed を UPDATE（failed 時 error_message 必須）"
  - "DbWriter に update_rows / delete_rows が無ければ最小追加（Protocol + Scaffold + Postgres + UT）"
  - "scaffold-demo / 既存 UT 回帰"
  - "実 DB 疎通（書込検証。secret なし。CI 既定 live 禁止）"
  - "IF-DB ギャップ一覧 IF-005 進捗"
  - "Task / Review Definition"

out_of_scope:
  - "staging_ranking_signal / staging_genre（Wave 2）"
  - "SELECT 再実装 / DbReader 拡張"
  - "007 以降書込 / E4 / DDL 破壊的変更"
  - "CI 既定 live / production 無承認"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-005_Raw取込・Staging変換バッチ仕様書.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチIF-DB・DDL本実装ギャップ一覧.md"
      required: true
  files:
    - path: "apps/batch/src/batch/application/raw_staging/**"
      required: true
    - path: "apps/batch/src/batch/infrastructure/db/writer.py"
      required: true

output:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチIF-DB・DDL本実装ギャップ一覧.md"
      action: "update"
      required: true
  files:
    - path: "apps/batch/src/batch/infrastructure/db/writer.py"
      action: "update"
      required: true
    - path: "apps/batch/src/batch/application/raw_staging/repositories.py"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/application/test_raw_staging.py"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/infrastructure/test_db_writer.py"
      action: "update"
      required: false
    - path: "prompts/definitions/tasks/batch-db-write-005/staging-upsert.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-db-write-005/staging-upsert/pr-review.yaml"
      action: "create"
      required: true

deliverables:
  - "staging UPSERT + import_status UPDATE 本配線"
  - "UT"
  - "実 DB 疎通結果"
  - "ギャップ一覧更新"

acceptance_criteria:
  - "upsert_staging_item / images が upsert_rows を使う"
  - "画像集合外 DELETE が実テーブルに対して行われる（偽テーブル staging_item_image_delete 廃止）"
  - "mark_staged / mark_failed が UPDATE（failed は error_message 付き）"
  - "実 DB 疎通結果が PR に記録（secret なし）"
  - "scaffold-demo / 既存 UT 回帰"
  - "PR target が親 Epic Branch"
  - "Related to #<Task Issue>（Closes 禁止）"

branch:
  no_branch: false
  summary: "batch-db-write-005-staging-upsert"
  base: "feature/epic-1632-batch-db-write-005"
  target: "feature/epic-1632-batch-db-write-005"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-27"
    due_date: "2026-07-31"

issue:
  unit: "task"
  type: "feature"
  area: "batch"

dependencies:
  epics:
    - issue: 1632
      purpose: "親 Epic"
  issues:
    - number: 1629
      purpose: "005 SELECT"
  blocking: false

contract_gate:
  required: false

parallel_control:
  exclusive_files:
    - "apps/batch/src/batch/application/raw_staging/**"
    - "apps/batch/src/batch/infrastructure/db/writer.py"
    - "apps/batch/tests/unit/application/test_raw_staging.py"
  conflict_risk: "high"
  db_impact: true

test_policy:
  required:
    - "unit test"
    - "secret check"
    - "real DB connectivity verify"
  not_required:
    - "CI default live"
    - "production unapproved live"
  skip_reason:
    "CI default live": "明示 / 手動の実 DB 疎通のみ"
    "production unapproved live": "疎通対象は local/dev/staging のみ"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "upsert_rows / UPDATE / DELETE が本番 SQL か"
    - "偽テーブル write が残っていないか"
    - "failed 時 error_message CHECK を満たすか"
    - "実 DB 疎通結果が PR に記録されているか"
    - "Related to / PR target が親 Epic"
  specialist_reviews:
    test: true
    security: true

notes:
  - "Epic Wave 1。ranking/genre は Wave 2"
