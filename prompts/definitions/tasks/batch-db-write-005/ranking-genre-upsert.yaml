  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-27"
    due_date: "2026-07-31"

issue:
  unit: "task"
  type: "feature"
  area: "batch"

dependencies:
  epics:
    - issue: 1632
      purpose: "親 Epic"
  issues:
    - number: 1660
      purpose: "Wave 1 staging UPSERT"
  blocking: false

contract_gate:
