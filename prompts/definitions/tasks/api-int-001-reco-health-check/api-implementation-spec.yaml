background: |
  Phase4b 縦串の 1/3（実装面仕様書）。契約面は `API-INT-001_RecoヘルスチェックAPI契約仕様書.md`（#392 / PR #396）を正とする。
  OpenAPI 断片（#414 / PR #415）は develop 反映済み。本 Task は契約・OpenAPI を変更せず、apps/reco エンドポイント層実装 Task が参照可能な **実装面のみ** を整理する。
  本 API は推薦パイプラインを実行しない軽量ヘルスチェックである。DB probe・Internal API Key・trace meta・エラーマップ・metric（reco_health_check_count）の実装境界を明記する。
  ローカル最小 health（#1135）は疎通用の先行実装であり、本実装仕様書を正として後続実装 Task で契約準拠へ揃える。
  Provider は apps/reco のエンドポイント層（`apps/reco/src/reco/api/**`）、Consumer は apps/api（MOD-API-005 Reco Client 等）とする。

objective: |
  API-INT-001（Recoヘルスチェック / Internal API）について、reco エンドポイント実装 Task / 単体テスト Task が参照可能な粒度の **API実装仕様書（実装面のみ）** を新規作成する。
  成果物は prompts/templates/docs/api-implementation-spec.md に準拠し、契約面（`api-contract-spec.md`）の章は再掲しない。
  FastAPI ハンドラ、Internal API Key 検証、DB health probe、Response 組立、エラーマップ、trace 伝播、ログ・メトリクス書き込み境界を明記する。
  OpenAPI 正本パスおよび generated client 利用方針は実装影響として記載するが、本 Task では当該ファイルを変更しない。

scope:
  - "API-INT-001（Recoヘルスチェック / Internal API）のAPI実装仕様書を新規作成する（成果物ファイル名: API-INT-001_RecoヘルスチェックAPI実装仕様書.md）"
  - "前提契約（契約仕様書パス / OpenAPI / Contract Gate 状態）を整理する"
  - "実装方針（FastAPI ハンドラ / Internal API Key / DB probe / DI）を整理する"
  - "処理フロー（Mermaid）と処理詳細を整理する（Request 受付 → Auth → Probe → Response 組立）"
  - "Request Header / Response Body の内部DTOマッピングを整理する（GET・Body なし）"
  - "generated client 利用方針（apps/api 側・MOD-API-005）を整理する（記載のみ）"
  - "provider（apps/reco エンドポイント層）/ consumer（apps/api）の実装影響を整理する"
  - "エラーマップ（probe 失敗・認証失敗 → HTTP / GRS コード）と trace 伝播を整理する"
  - "ログ・メトリクス（reco_health_check_count）書き込み境界（実装面）を整理する"
  - "実装結合テスト観点を整理する"
  - "非機能（タイムアウト・軽量性・副作用なし）の実装面を整理する"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
  - "API-PUB-001（Public API / APIヘルスチェック）の仕様・実装仕様書作成"
  - "API-INT-002（Reco推薦実行）の仕様・実装仕様書変更"
  - "prompts/templates/docs/api-contract-spec.md に準拠する契約面章（Request/Response/Error の契約再掲・OpenAPI schema 詳細）"
  - "API-INT-001_RecoヘルスチェックAPI契約仕様書.md の変更（契約確定済みを前提）"
  - "OpenAPI定義ファイル（packages/contracts/openapi/internal-reco-api.yaml）の作成・更新"
  - "Orval設定ファイル（orval.config.ts）の作成・更新"
  - "generated API client（apps/api/src/generated/reco-client/ 等）の再生成"
  - "apps/api の実装"
  - "apps/web の実装"
  - "apps/reco の実装（エンドポイント層・application 層を含む）"
  - "Recoモジュール本体（MOD-RECO-001〜029）の設計・実装変更"
  - "DB schema変更"
  - "認証・認可方式そのものの変更"
  - "画面仕様書の作成"

