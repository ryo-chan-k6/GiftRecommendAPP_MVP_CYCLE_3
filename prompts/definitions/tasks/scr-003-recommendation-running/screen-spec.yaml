background: |
  06_実装設計において、web 実装の前提となる画面仕様書を作成する。
  SCR-003 は独立 URL 画面ではなく、SCR-002 推薦実行中の UI 状態として扱う（画面遷移図正本）。
  画面一覧の URL案 `/recommendations/loading` は参考であり、MVP 実装は既存どおり recommendation-input 内 LoadingPanel を正とする。
  専用 route 新設は原則 out of scope として仕様書で明示する。

objective: |
  SCR-003（レコメンド実行中表示）について、実装・レビューが可能な粒度の画面仕様書を作成する。
  作成する仕様書は prompts/templates/docs/screen-spec.md に準拠する。

scope:
  - "SCR-003 の画面仕様書を新規作成する（成果物: SCR-003_レコメンド実行中表示画面仕様書.md）"
  - "画面目的・対象ユーザー・表示項目を整理する"
  - "画面状態であること（独立 URL ではないこと）と遷移先（SCR-004 / SCR-008 / SCR-009）を整理する"
  - "ST-LOAD / LoadingPanel（UI-032）との対応を整理する"
  - "API-PUB-002 呼び出し中の待機 UX・操作不可方針を整理する"
  - "専用 `/recommendations/loading` route 新設が MVP out of scope であることを明示する"
  - "キャンセル導線（画面一覧 △）の扱いを明記する"

out_of_scope:
  - "他画面（SCR-003 以外）の画面仕様書作成"
  - "専用 `/recommendations/loading` route の新設・実装"
  - "SCR-008 / SCR-009 の包括仕様（遷移先としての言及に留める）"
  - "SCR-005 / SCR-007 の変更"
  - "OpenAPI / generated / ソースコード実装"
  - "API-PUB-002 契約・実装の変更"
  - "認証・認可方式そのものの変更"

