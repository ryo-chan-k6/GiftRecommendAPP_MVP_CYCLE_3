    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
      purpose: "画面状態としての位置づけと成功/失敗/0件への遷移を確認するため"
    - path: "docs/06_実装設計/web/SCR-002_レコメンド条件入力画面画面仕様書.md"
      required: true
      purpose: "SCR-002 内実行中状態・LoadingPanel 利用との分担を確認するため"
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
      required: true
      purpose: "推薦実行 API 呼び出し中の待機 UX 前提を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/デザインルール.md"
      required: true
      purpose: "ST-LOAD パターンを確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/UIコンポーネント一覧.md"
      required: true
      purpose: "LoadingPanel（UI-032）等の部品責務を確認するため"
  templates:
    - path: "prompts/templates/docs/screen-spec.md"
      required: true
      purpose: "画面仕様書を標準フォーマットで作成するため"
      applies_to:
        - "docs/06_実装設計/web/SCR-003_レコメンド実行中表示画面仕様書.md"
  files: []
  issues: []
  prs: []

output:
