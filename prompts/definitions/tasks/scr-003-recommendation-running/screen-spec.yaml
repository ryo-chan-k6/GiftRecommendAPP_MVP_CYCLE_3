  summary: "SCR-003（レコメンド実行中表示）の画面仕様書（SCR-003_レコメンド実行中表示画面仕様書.md）を、画面一覧・画面遷移図・SCR-002画面仕様書・API-PUB-002契約・デザインルール（ST-LOAD）・UIコンポーネント一覧に基づいて作成する。"

