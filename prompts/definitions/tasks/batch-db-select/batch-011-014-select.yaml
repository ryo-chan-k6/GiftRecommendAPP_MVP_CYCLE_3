  - "queue OR 条件は equals 二重 fetch + in-process（DbReader 拡張なし）"
  - "--scaffold-demo 回帰"
  - "UT"
  - "実 DB 疎通確認（必須。0 件可）"
  - "SELECT ギャップ一覧 Wave E 進捗"
  - "Task / Review Definition"

