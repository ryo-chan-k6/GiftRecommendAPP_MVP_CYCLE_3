  楽天 / Storage live は E3 済み。seed 未配線が残っていた。

objective: |
  list_seedable_items を DbReader 経由の item SELECT に接続し、非 demo で実 DB から再確認対象を読む。

scope:
  - "ItemRecheckRepositories.list_seedable_items の DbReader 本読取"
  - "CLI 非 demo で resolve_job_db_reader（DATABASE_URL 必須、楽天 live ゲートは維持）"
  - "既定: active_status=active + source=rakuten + max_items（equals。popularity JOIN なし）"
  - "明示 external_item_codes"
  - "--scaffold-demo 回帰"
  - "UT"
  - "実 DB 疎通確認（必須。0 件可）"
  - "SELECT ギャップ一覧 Wave A' 進捗"
  - "Task / Review Definition"

out_of_scope:
  - "004 書込本格化の拡大"
  - "DbReader IN / JOIN / 任意 SQL（item_popularity_signal JOIN 含む）"
  - "BATCH-006 以降 SELECT"
  - "E4 / LLM / #1607 / DDL"
  - "production 無承認 live / CI 既定 live"

