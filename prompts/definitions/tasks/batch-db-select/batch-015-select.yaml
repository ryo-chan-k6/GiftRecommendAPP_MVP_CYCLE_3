schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-db-select-015-select"
  title: "batch-db-select:BATCH-015 SELECT本配線"
  summary: "Wave F として BATCH-015 の queue/item/handoff SELECT を DbReader 経由で本配線し、本番 CLI に --live-embedding を配線する。書込本格化は out of scope。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-db-select:DB読取本配線"
  epic_issue_number: 1623
  epic_branch: "feature/epic-1623-batch-db-select"
  related_issues:
    - 1647
  related_prs:
    - 1650

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Wave E（#1647 / #1650）完了後、Wave F として BATCH-015 の SELECT と本番 CLI live-embedding を本配線する。
  demo 経路の --live-embedding HTTP 煙は既に可能。非 demo は exit 3 で止まっている。

objective: |
  list_target_queues / load_item / load_hash_handoff / skip 用 item_embedding を DbReader 経由で本配線し、
  非 demo で exit 3 を解除する。--live-embedding を本番 CLI Job 経路に配線する（既定 off）。

scope:
  - "list_target_queues / load_item / load_hash_handoff / should_skip 用 item_embedding の DbReader 本読取"
  - "CLI 非 demo で resolve_job_db_reader（DATABASE_URL 必須、無しは exit 2）"
  - "非 demo で --live-embedding / BATCH_EMBEDDING_LIVE を Job adapter に配線（既定 off）"
  - "queue OR 条件は equals 多重 fetch + in-process"
  - "--scaffold-demo 回帰"
  - "UT"
  - "実 DB 疎通確認（必須。0 件可）"
  - "SELECT ギャップ一覧 Wave F 進捗"
  - "Task / Review Definition"

out_of_scope:
  - "item_embedding / queue 書込本格化"
  - "Semantic LLM"
  - "DbReader IN / IS NULL / JOIN / 任意 SQL / OR 拡張"
  - "016 / 017 SELECT / E4 / DDL / CI 既定 live / production 無承認"
  - "item_embedding_input への書込・hash 再算出（BATCH-014 責務）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチDB読取・SELECT本実装ギャップ一覧.md"
      required: true
  files:
    - path: "apps/batch/src/batch/application/item_embedding/**"
      required: true
    - path: "apps/batch/src/batch/infrastructure/db/reader.py"
      required: true
    - path: "apps/batch/src/batch/infrastructure/external_ai/**"
      required: true

output:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチDB読取・SELECT本実装ギャップ一覧.md"
      action: "update"
      required: true
  files:
    - path: "apps/batch/src/batch/application/item_embedding/repositories.py"
      action: "update"
      required: true
    - path: "apps/batch/src/batch/application/item_embedding/__main__.py"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/application/test_item_embedding.py"
      action: "update"
      required: true
    - path: "prompts/definitions/tasks/batch-db-select/batch-015-select.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-db-select/batch-015-select/pr-review.yaml"
      action: "create"
      required: true

deliverables:
  - "015 SELECT 本配線"
  - "本番 CLI --live-embedding 配線"
  - "UT"
  - "実 DB 疎通結果"
  - "ギャップ一覧更新"

acceptance_criteria:
  - "list_target_queues / load_item / load_hash_handoff が DbReader を使う"
  - "非 demo で DATABASE_URL ありなら SELECT 経由で Job 起動可能（exit 3 解除）"
  - "非 demo で --live-embedding が Job 経路に解決される（鍵なしは既存どおり exit 2 可）"
  - "実 DB 疎通確認が完了し PR に結果要約がある（secret なし）"
  - "scaffold-demo / 既存 UT 回帰"
  - "PR target が親 Epic Branch"
  - "Related to #<Task Issue>（Closes 禁止）"

branch:
  no_branch: false
  summary: "batch-db-select-015-select"
  base: "feature/epic-1623-batch-db-select"
  target: "feature/epic-1623-batch-db-select"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-27"
    due_date: "2026-07-30"

issue:
  unit: "task"
  type: "feature"
  area: "batch"

dependencies:
  epics:
    - issue: 1623
      purpose: "親 Epic"
  issues:
    - number: 1647
      purpose: "Wave E"
  blocking: false

contract_gate:
  required: false

parallel_control:
  exclusive_files:
    - "apps/batch/src/batch/application/item_embedding/**"
    - "apps/batch/tests/unit/application/test_item_embedding.py"
  conflict_risk: "medium"
  db_impact: true

test_policy:
  required:
    - "unit test"
    - "secret check"
    - "real DB connectivity verify"
  not_required:
    - "CI default live"
    - "production unapproved live"
    - "OpenAI live call"
  skip_reason:
    "CI default live": "明示 / 手動の実 DB 疎通のみ"
    "production unapproved live": "疎通対象は local/dev/staging のみ"
    "OpenAI live call": "鍵なし exit 2 / scaffold で十分。実 HTTP は任意"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "list_target_queues / load_item / load_hash_handoff が DbReader を使うか"
    - "書込本格化を混入していないか"
    - "非 demo で --live-embedding が Job に配線されているか（既定 off）"
    - "実 DB 疎通結果が PR に記録されているか"
    - "Related to / PR target が親 Epic"
  specialist_reviews:
    test: true
    security: true

notes:
  - "Epic Wave F"
