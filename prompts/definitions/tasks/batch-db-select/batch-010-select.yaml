schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-db-select-010-select"
  title: "batch-db-select:BATCH-010 SELECT本配線"
  summary: "Wave D として BATCH-010 の queue/item SELECT を DbReader 経由で本配線する。Rule-first 維持。LLM / 書込本格化は out of scope。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-db-select:DB読取本配線"
  epic_issue_number: 1623
  epic_branch: "feature/epic-1623-batch-db-select"
  related_issues:
    - 1642
  related_prs:
    - 1643

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Wave C（#1642 / #1643）完了後、Wave D として BATCH-010 の queue/item SELECT を本配線する。
  Rule-first adapter は維持。LLM は E3 で含めない。

objective: |
  list_claimable_queues / load_item（+ find_item_semantic）を DbReader 経由で本配線し、非 demo で exit 3 を解除する。

scope:
  - "list_claimable_queues / load_item / find_item_semantic の DbReader 本読取"
  - "CLI 非 demo で resolve_job_db_reader（DATABASE_URL 必須、無しは exit 2）"
  - "generation_type=semantic + queue_status=queued equals、source は item 経由 in-process"
  - "Rule-first adapter 維持"
  - "--scaffold-demo 回帰"
  - "UT"
  - "実 DB 疎通確認（必須。0 件可）"
  - "SELECT ギャップ一覧 Wave D 進捗"
  - "Task / Review Definition"

out_of_scope:
  - "Semantic LLM 本接続"
  - "item_semantic / queue 書込本格化（claim / UPSERT SQL）"
  - "Config Version Resolver 実 DB"
  - "genre / attribute / tag / semantic_rule JOIN 解決"
  - "DbReader IN / IS NULL / JOIN / 任意 SQL 拡張"
  - "011 以降 SELECT / E4 / DDL / CI 既定 live / production 無承認"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチDB読取・SELECT本実装ギャップ一覧.md"
      required: true
  files:
    - path: "apps/batch/src/batch/application/item_semantic/**"
      required: true
    - path: "apps/batch/src/batch/infrastructure/db/reader.py"
      required: true

output:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチDB読取・SELECT本実装ギャップ一覧.md"
      action: "update"
      required: true
  files:
    - path: "apps/batch/src/batch/application/item_semantic/repositories.py"
      action: "update"
      required: true
    - path: "apps/batch/src/batch/application/item_semantic/__main__.py"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/application/test_item_semantic.py"
      action: "update"
      required: true
    - path: "prompts/definitions/tasks/batch-db-select/batch-010-select.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-db-select/batch-010-select/pr-review.yaml"
      action: "create"
      required: true

deliverables:
  - "010 SELECT 本配線"
  - "UT"
  - "実 DB 疎通結果"
  - "ギャップ一覧更新"

acceptance_criteria:
  - "list_claimable_queues / load_item が DbReader を使う"
  - "非 demo で DATABASE_URL ありなら SELECT 経由で Job 起動可能（exit 3 解除）"
  - "実 DB 疎通確認が完了し PR に結果要約がある（secret なし）"
  - "scaffold-demo / 既存 UT 回帰"
  - "PR target が親 Epic Branch"
  - "Related to #<Task Issue>（Closes 禁止）"

branch:
  no_branch: false
  summary: "batch-db-select-010-select"
  base: "feature/epic-1623-batch-db-select"
  target: "feature/epic-1623-batch-db-select"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-26"
    due_date: "2026-07-29"

issue:
  unit: "task"
  type: "feature"
  area: "batch"

dependencies:
  epics:
    - issue: 1623
      purpose: "親 Epic"
  issues:
    - number: 1642
      purpose: "Wave C"
  blocking: false

contract_gate:
  required: false

