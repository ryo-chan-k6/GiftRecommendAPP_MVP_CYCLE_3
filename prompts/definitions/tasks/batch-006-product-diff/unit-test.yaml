schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-006-product-diff-unit-test"
  title: "BATCH-006:商品差分判定Batch単体テスト"
  summary: "BATCH-006 実装に対し、バッチ仕様書 §16 の unit 観点カバレッジを整理・拡充する。実装 Task の最小 UT を維持しつつ、不足ケースを fixture / mock で追加する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]BATCH-006:商品差分判定Batch"
  epic_issue_number: 1341
  epic_branch: "feature/epic-1341-batch-006-product-diff"
  related_issues:
    - number: 1350
      purpose: "前提（実装 Task・CLOSED）"
    - number: 1342
      purpose: "仕様書（CLOSED）"
  related_prs:
    - number: 1351
      purpose: "実装 Task PR（Epic Branch merge 済み）"
    - number: 1343
      purpose: "仕様書 PR（MERGED）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "test-ai"
  support:
    - "worker-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Phase4b 差分判定縦串の UT。実装 Task #1350 / PR #1351 は Epic Branch merge 済み。
  本 Task はバッチ仕様書 §16 の unit 観点対応表を PR に明示し、不足ケースを
  `apps/batch/tests/unit/**` へ拡充する。実 DB は禁止（fixture / mock 正）。

objective: |
  BATCH-006 の単体テストを仕様書 §16 に沿って充足し、Epic 縦串（仕様書→実装→UT）を完了可能にする。

scope:
  - "バッチ仕様書 §16 unit 観点のカバレッジ表を PR 本文に記載する"
  - "`apps/batch/tests/unit/**` へのテスト追加・拡充（product_diff 中心）"
  - "テスト成立に必要な最小の実装修正"
  - "Task / Review Definition の実Issue・Branch反映"

out_of_scope:
  - "integration test（実 DB）"
  - "OpenAPI / Orval / generated / migration 変更"
  - "他 Batch の機能追加・破壊変更"
  - "機能追加を主目的とする実装変更（テスト成立に必要な最小修正以外）"
  - "Epic PR の develop merge（Human 判断）"
  - "親 item-import チェーン配線"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-006_商品差分判定バッチ仕様書.md"
      required: true
      purpose: "§16 テスト観点の正本"
  templates: []
  files:
    - path: "apps/batch/src/batch/application/product_diff/**"
      required: true
      purpose: "テスト対象"
    - path: "apps/batch/tests/unit/application/test_product_diff.py"
      required: true
      purpose: "実装 Task で追加済みの最小 UT"
  issues:
    - number: 1350
      purpose: "前提実装"
  prs:
    - number: 1351
      purpose: "実装 PR（merge 済み）"

output:
  docs: []
  files:
    - path: "prompts/definitions/tasks/batch-006-product-diff/unit-test.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-006-product-diff/unit-test/pr-review.yaml"
      action: "create"
      required: true
  tests:
    - path: "apps/batch/tests/unit/**"
      action: "create_or_update"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "§16 unit 観点カバレッジ表（PR 本文）"
  - "不足ケースの pytest 追加"
  - "Task / Review Definition"

acceptance_criteria:
  - "バッチ仕様書 §16 の unit 観点がテストまたは明示スキップ理由でカバーされている"
  - "`cd apps/batch && uv run python -m pytest tests/unit/application/test_product_diff.py -q` が SUCCESS"
  - "可能なら `cd apps/batch && uv run python -m pytest tests/unit -q` も SUCCESS"
  - "実 DB に依存しない"
  - "OpenAPI / generated / migration 変更を含まない"
  - "親 Epic の epic_scope.allowed_paths 内"
  - "secret / .env 実値を含まない"

branch:
  no_branch: false
  name: "test/task-1353-batch-006-product-diff-unit-test"
  summary: "batch-006-product-diff-unit-test"
  base: "feature/epic-1341-batch-006-product-diff"
  target: "feature/epic-1341-batch-006-product-diff"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-16"
    due_date: "2026-07-19"

issue:
  number: 1353
  unit: "task"
  type: "test"
  area: "batch"

dependencies:
  epics:
    - issue: 1341
      title: "[Epic]BATCH-006:商品差分判定Batch"
      purpose: "親 Epic"
  issues:
    - number: 1350
      purpose: "実装 Task（CLOSED）"
  prs:
    - number: 1351
      purpose: "実装 PR Epic merge 済み"
  blocking: false

contract_gate:
  required: false

parallel_control:
  depends_on:
    - "task-batch-006-product-diff-implementation"
  blocks: []
  exclusive_files:
    - "apps/batch/tests/unit/application/test_product_diff.py"
    - "apps/batch/tests/unit/application/test_product_diff_*.py"
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
    - "batch unit test"
    - "secret check"
  commands:
    - "cd apps/batch && uv sync --extra dev"
    - "cd apps/batch && uv run python -m pytest tests/unit/application/test_product_diff.py -q --tb=short"
    - "cd apps/batch && uv run python -m pytest tests/unit -q --tb=line"
  not_required:
    - "integration test（実 DB）"
    - "contract test"
  skip_reason:
    "integration test（実 DB）": "fixture/mock を正とする"
    "contract test": "Batch は HTTP API 化しないため対象外"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "§16 カバレッジ表が PR 本文にあり、不足が明示されているか"
    - "fixture / mock のみで実外部依存がないか"
    - "実装への変更がテスト成立に必要な最小か"
    - "secret 非含有 / PR target が親 Epic Branch か"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: true
  reason: "識別子単位 Batch UT 縦串"

human_decision_points:
  - "§16 integration 表記を mock unit 代替で充足してよいか"

stop_conditions:
  - "必須 input.docs（バッチ仕様書）が存在しない場合"
  - "親 Epic Issue / Branch が未確定の場合"
  - "OpenAPI / generated / migration 変更が必要になった場合"
  - "epic_scope.allowed_paths 外の編集が必要になった場合"
  - "実 DB 依存が必須に見える場合"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "Issueタイトル: [Task]BATCH-006:商品差分判定Batch単体テスト"
  - "実装最小 UT は #1351 で No.1〜6/8/9/12 等をカバー済み。不足は No.7/10/11/13 など"
  - "後続: Epic PR を develop 向けに作成（Human merge）"
