  epic_branch: "feature/epic-1554-batch-parent-orchestrators"
  related_issues:
    - 1546
  related_prs:
    - 1551

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
