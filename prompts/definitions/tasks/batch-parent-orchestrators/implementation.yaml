  MVP Phase1 は親 schedule 無効。018/019 は本線に載せない。

objective: |
  複合子・親 YAML を追加し、スケジュール設計書へ実装差分を追記する。

scope:
  - "複合子4本（item-import / meaning-generation / retry-failed / existing-item-pipeline）"
  - "親3本（daily / weekly / manual）"
  - "バッチ実行スケジュール設計書の実装差分追記"
  - "必要なら処理一覧・ギャップ一覧への最小追記"
  - "Task / Review Definition 整備"

out_of_scope:
  - "独立子業務ロジック改修・リネーム"
  - "DDL / mock 解除 / 018・019 本格化"
  - "Python UT 追加（必須としない）"

