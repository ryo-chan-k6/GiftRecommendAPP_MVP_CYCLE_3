schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-parent-orchestrators-implementation"
  title: "batch-parent-orchestrators:親・複合子workflow実装"
  summary: "案Aで複合子（item-import / meaning-generation / retry-failed / existing-item-pipeline）と親 daily/weekly/manual orchestrator を実装し、スケジュール設計書に実装差分を追記する。"

work_mode: "ai-agent"

parent:
