      required: true
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ横串整合・本実装ギャップ一覧.md"
      required: true
    - path: "prompts/definitions/epics/batch-parent-orchestrators/epic.yaml"
      required: true
  files:
