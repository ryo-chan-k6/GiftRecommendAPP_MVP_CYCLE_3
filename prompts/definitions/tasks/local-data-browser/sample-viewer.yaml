background: |
  親Epic #1889。カタログ検証 PR（#1888）の確認より先に、SQL なしでデータを見たいという Human 依頼。
  セキュリティ上 apps/web には載せない。127.0.0.1 bind・local DB・SELECT のみ。

objective: |
  ブラウザで商品リスト、レコメンド用商品、マスタ連関、Pair マトリクス、推薦入力を確認できるサンプルを動かす。

scope:
  - "scripts/dev/local_data_browser に読み取り専用 HTTP ビューアを追加する"
  - "127.0.0.1 のみ bind する"
  - "DATABASE_URL host が loopback 以外なら起動拒否する"
  - "SELECT のみ。書き込み SQL を持たない"
  - "商品 / レコメンド用商品 / マスタ / Pair / 推薦入力の画面"
  - "起動スクリプトと scripts/dev/README の案内"
  - "接続ガードの DB 不要単体テスト"

out_of_scope:
  - "apps/web への管理者画面追加"
  - "認証・認可の本実装"
  - "本番 / stg DB 接続"
  - "DB 書き込み / DDL / migration"
  - "embedding ベクトル本体の表示"
  - "#1882 成果物の変更"
  - "OpenAPI / generated 変更"

