    docs: true
    test: true
    security: true

contract_gate:
  required: false

operation_logging:
  level: "standard"
  ai_logs:
    experiments: true

human_decision_points:
  - "件数スケール最終水準"
  - "index 比較の深さ"
  - "top_k"

stop_conditions:
  - "親 Epic 未作成"
  - "production DB が必要"
  - "seed 生成が過大"

notes:
  - "Task Issue #1572 / Branch spike/task-1572-tv-006-pgvector-benchmark"
  - "親 Epic #1571 / Branch spike/epic-1571-tv-006-pgvector-search-performance"
  - "推奨: 件数 100/500/1000、次元 1536、top_k 5 と 20、HNSW あり/なし"
