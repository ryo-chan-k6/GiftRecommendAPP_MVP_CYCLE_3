schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-007-item-apply-implementation"
  title: "BATCH-007:Item反映Batch実装"
  summary: "BATCH-007（Item反映Batch）を仕様書に基づき apps/batch へ実装する。product_diff_result 消費、item / item_image / item_review_summary Upsert、独立 workflow を対象とする。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]BATCH-007:Item反映Batch"
  epic_issue_number: 1356
  epic_branch: "feature/epic-1356-batch-007-item-apply"
  related_issues:
    - number: 1357
      purpose: "バッチ仕様書（CLOSED / Epic Branch merge 済み）"
  related_prs:
    - number: 1358
      purpose: "バッチ仕様書 PR（MERGED）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Phase4b Item 反映段。仕様書 #1357 / PR #1358 は Epic Branch merge 済み。
  BATCH-006 同型の単一 Job（item_apply）で plan→load_diff→load_staging→apply_item→apply_images→apply_review→finalize を実装する。
  Contract Gate 不要。unit は fixture / mock 正。包括的 UT は後続 unit-test Task。
  §18.1 Human 確定（独立 YAML / Diff 選定 / unchanged・unavailable・画像空集合・初期 active_status）を実装の作業仮定として採用する。

objective: |
  BATCH-007 について、仕様書の処理ステップを apps/batch 上で実行可能な実装と、
  起動用独立 workflow（batch-rakuten-item-apply.yml）を整備する。
  active_status 本更新・hash 再算出・popularity / generation_queue 更新は行わない。

scope:
  - "BATCH-007 ジョブ application 実装（item_apply: plan / load_diff / load_staging / apply_item / apply_images / apply_review / finalize）"
  - "Item Updater（new/updated Upsert、unchanged last_checked_at、unavailable skip）"
  - "Item Image Updater（同期置換。空集合 DELETE 可）"
  - "Item Review Summary Updater（欠損スキップ）"
  - "Product Diff Result Reader（読取のみ）"
  - "batch_run_log / phase_log / error_log 連携"
  - "config: BATCH_ITEM_APPLY_MAX_ITEMS 等"
  - ".github/workflows/batch-rakuten-item-apply.yml（workflow_call / workflow_dispatch）"
  - "最小 unit test（new/updated/unchanged/unavailable・画像同期・レビュー欠損・active_status非更新・hash再算出なし）"
  - "Task / Review Definition"

out_of_scope:
  - "バッチ仕様書の全面書き換え（軽微な実装追随注記以外）"
  - "他 Batch 実装の破壊変更（product_diff / raw_staging / genre_sync / ranking_snapshot / item_pseudo_diff / item_recheck / item_active_status）"
  - "親 item-import / existing-item-recheck チェーン workflow 全体改修・配線"
  - "OpenAPI / Orval / generated / DB migration"
  - "楽天 API 呼出"
  - "item.active_status / is_active 本更新"
  - "normalized_hash 再算出"
  - "item_popularity_signal / item_generation_queue 更新"
  - "包括的 UT Task（後続 unit-test Task）"
  - "BATCH-008 / BATCH-009"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-007_Item反映バッチ仕様書.md"
      required: true
      purpose: "実装の正本"
    - path: "docs/06_実装設計/database/item_テーブル定義書.md"
      required: true
      purpose: "Upsert / last_checked_at"
    - path: "docs/06_実装設計/database/item_image_テーブル定義書.md"
      required: true
      purpose: "同期置換"
    - path: "docs/06_実装設計/database/item_review_summary_テーブル定義書.md"
      required: true
      purpose: "レビュー Upsert"
    - path: "docs/06_実装設計/database/product_diff_result_テーブル定義書.md"
      required: true
      purpose: "判定入力読取"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-007 入出力境界"
  templates: []
  files:
    - path: "apps/batch/src/batch/application/product_diff/**"
      required: true
      purpose: "同型 Job 参照のみ（編集禁止）"
    - path: "apps/batch/src/batch/infrastructure/db/**"
      required: false
      purpose: "DbWriter / upsert 補助"
  issues:
    - number: 1357
      purpose: "仕様書"
  prs:
    - number: 1358
      purpose: "仕様書 MERGED"

output:
  docs: []
  files:
    - path: "apps/batch/src/batch/application/item_apply/**"
      action: "create"
      required: true
    - path: "apps/batch/src/batch/config/**"
      action: "update"
      required: true
    - path: "apps/batch/src/batch/infrastructure/db/**"
      action: "update"
      required: false
    - path: ".github/workflows/batch-rakuten-item-apply.yml"
      action: "create"
      required: true
    - path: "prompts/definitions/tasks/batch-007-item-apply/implementation.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-007-item-apply/implementation/pr-review.yaml"
      action: "create"
      required: true
  tests:
    - path: "apps/batch/tests/unit/application/test_item_apply.py"
      action: "create"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "BATCH-007 Item反映ジョブ実装"
  - "batch-rakuten-item-apply.yml"
  - "最小 unit test（fixture / mock）"

acceptance_criteria:
  - "仕様書主要 Phase（plan/load_diff/load_staging/apply_item/apply_images/apply_review/finalize）がコード上で追跡できる"
  - "new / updated / unchanged / unavailable の反映方針を実装できる"
  - "item / item_image / item_review_summary へ Upsert / 同期置換できる（scaffold 上で検証）"
  - "normalized_hash を再算出せず Staging 値をコピーする"
  - "item.active_status / is_active を本 Batch で更新しない"
  - "unavailable で Item/画像/レビュー/last_checked_at を更新しない"
  - "unchanged で業務列・画像・レビューを更新せず last_checked_at のみ更新する"
  - "楽天 API を呼ばない"
  - ".github/workflows/batch-rakuten-item-apply.yml が存在し workflow_dispatch / workflow_call を持つ"
  - "secret / .env 実値を含まない"
  - "OpenAPI / generated / migration / 他 Batch application を変更していない"
  - "親 Epic allowed_paths 外を編集していない"
  - "最小 unit test がローカルで実行可能である"

branch:
  no_branch: false
  name: "feature/task-1359-batch-007-item-apply-implementation"
  summary: "batch-007-item-apply-implementation"
  base: "feature/epic-1356-batch-007-item-apply"
  target: "feature/epic-1356-batch-007-item-apply"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-16"
    due_date: "2026-07-19"

issue:
  number: 1359
  unit: "task"
  type: "feature"
  area: "batch"

dependencies:
  epics:
    - issue: 1356
      title: "[Epic]BATCH-007:Item反映Batch"
      purpose: "親 Epic"
  issues:
    - number: 1357
      purpose: "仕様書（CLOSED）"
  prs:
    - number: 1358
      purpose: "仕様書 MERGED"
  blocking: false

contract_gate:
  required: false

parallel_control:
  depends_on:
    - "task-batch-007-item-apply-batch-spec"
  blocks:
    - "task-batch-007-item-apply-unit-test"
  exclusive_files:
    - "apps/batch/src/batch/application/item_apply/**"
    - ".github/workflows/batch-rakuten-item-apply.yml"
  conflict_risk: "medium"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
    - "batch unit test（BATCH-007 最小）"
    - "secret check"
  commands:
    - "cd apps/batch && uv sync --extra dev"
    - "cd apps/batch && uv run python -m pytest tests/unit/application/test_item_apply.py -q --tb=short"
  not_required:
    - "integration test（実 DB）"
    - "contract test"
  skip_reason:
    "integration test（実 DB）": "fixture/mock / scaffold を正とする"
    "contract test": "Batch は HTTP API 化しないため対象外"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "仕様書 Phase・diff_status 別方針と実装が整合するか"
    - "active_status 本更新・hash 再算出をしていないか"
    - "他 Batch application（product_diff 等）を編集していないか"
    - "親 workflow チェーンを改修していないか"
    - "secret 非含有 / PR target が親 Epic Branch か"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: true
  reason: "識別子単位 Batch 実装の縦串"

human_decision_points:
  - "独立 YAML（batch-rakuten-item-apply.yml）方針で実装する（仕様§18.1 No.11 確定）"
  - "Diff 選定・unchanged/unavailable/画像空集合既定で実装する（§18.1 No.12〜16 確定）"
  - "包括的 UT は後続 unit-test Task に分離する"

stop_conditions:
  - "必須 input.docs（バッチ仕様書）が存在しない場合"
  - "親 Epic Issue / Branch が未確定の場合"
  - "OpenAPI / generated / migration 変更が必要になった場合"
  - "epic_scope.allowed_paths 外の編集が必要になった場合"
  - "他 Batch application / 親チェーン YAML 編集が必要に見える場合"
  - "active_status 本更新や hash 再算出が必要に見える場合"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "Issueタイトル: [Task]BATCH-007:Item反映Batch実装"
  - "Contract Gate 不要"
  - "後続: unit-test Task"
