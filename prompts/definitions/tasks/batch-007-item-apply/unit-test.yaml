schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-007-item-apply-unit-test"
  title: "BATCH-007:Item反映Batch単体テスト"
  summary: "BATCH-007 実装に対し、バッチ仕様書 §16 の unit 観点カバレッジを整理・拡充する。実装 Task の最小 UT を維持しつつ、不足ケースを fixture / mock で追加する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]BATCH-007:Item反映Batch"
  epic_issue_number: 1356
  epic_branch: "feature/epic-1356-batch-007-item-apply"
  related_issues:
    - number: 1359
      purpose: "前提（実装 Task・CLOSED）"
    - number: 1357
      purpose: "仕様書（CLOSED）"
  related_prs:
    - number: 1363
      purpose: "実装 Task PR（Epic Branch merge 済み）"
    - number: 1358
      purpose: "仕様書 PR（MERGED）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "test-ai"
  support:
    - "worker-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Phase4b Item 反映縦串の UT。実装 Task #1359 / PR #1363 は Epic Branch merge 済み。
  本 Task はバッチ仕様書 §16 の unit 観点対応表を PR に明示し、不足ケースを
  `apps/batch/tests/unit/**` へ拡充する。実 DB は禁止（fixture / mock 正）。

objective: |
  BATCH-007 の単体テストを仕様書 §16 に沿って充足し、Epic 縦串（仕様書→実装→UT）を完了可能にする。

scope:
  - "バッチ仕様書 §16 unit 観点のカバレッジ表を PR 本文に記載する"
  - "`apps/batch/tests/unit/**` へのテスト追加・拡充（item_apply 中心）"
  - "テスト成立に必要な最小の実装修正"
  - "Task / Review Definition の実Issue・Branch反映"

out_of_scope:
  - "integration test（実 DB）"
  - "OpenAPI / Orval / generated / migration 変更"
  - "他 Batch の機能追加・破壊変更"
  - "機能追加を主目的とする実装変更（テスト成立に必要な最小修正以外）"
  - "Epic PR の develop merge（Human 判断）"
  - "親 item-import チェーン配線"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-007_Item反映バッチ仕様書.md"
      required: true
      purpose: "§16 テスト観点の正本"
  templates: []
  files:
    - path: "apps/batch/src/batch/application/item_apply/**"
      required: true
      purpose: "テスト対象"
    - path: "apps/batch/tests/unit/application/test_item_apply.py"
      required: true
      purpose: "既存最小 UT"
  issues:
    - number: 1359
      purpose: "実装"
  prs:
    - number: 1363
      purpose: "実装 MERGED"

output:
  docs: []
  files:
    - path: "prompts/definitions/tasks/batch-007-item-apply/unit-test.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-007-item-apply/unit-test/pr-review.yaml"
      action: "create"
      required: true
  tests:
    - path: "apps/batch/tests/unit/application/test_item_apply.py"
      action: "update"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "§16 unit 観点カバレッジ表（PR 本文）"
  - "拡充済み unit test"
  - "Task / Review Definition"

acceptance_criteria:
  - "§16 の unit 観点について、対応済み / 未対応（理由付き）が PR 本文に明示されている"
  - "実装 Task 時点で不足していた unit 観点が fixture/mock で追加されている"
  - "test_item_apply.py（または同等）がローカルで成功する"
  - "実 DB / production secret に依存しない"
  - "secret / .env 実値を含まない"
  - "PR target が親 Epic Branch"
  - "他 Batch application を破壊変更していない"

branch:
  no_branch: false
  name: "test/task-1365-batch-007-item-apply-unit-test"
  summary: "batch-007-item-apply-unit-test"
  base: "feature/epic-1356-batch-007-item-apply"
  target: "feature/epic-1356-batch-007-item-apply"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-16"
    due_date: "2026-07-19"

issue:
  number: 1365
  unit: "task"
  type: "test"
  area: "batch"

dependencies:
  epics:
    - issue: 1356
      title: "[Epic]BATCH-007:Item反映Batch"
      purpose: "親 Epic"
  issues:
    - number: 1359
      purpose: "実装（CLOSED）"
  prs:
    - number: 1363
      purpose: "実装 MERGED"
  blocking: false

contract_gate:
  required: false

parallel_control:
  depends_on:
    - "task-batch-007-item-apply-implementation"
  blocks: []
  exclusive_files:
    - "apps/batch/tests/unit/application/test_item_apply.py"
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
    - "batch unit test（BATCH-007 §16）"
    - "secret check"
  commands:
    - "cd apps/batch && uv sync --extra dev"
    - "cd apps/batch && uv run python -m pytest tests/unit/application/test_item_apply.py -q --tb=short"
  not_required:
    - "integration test（実 DB）"
    - "contract test"
  skip_reason:
    "integration test（実 DB）": "fixture/mock を正とする"
    "contract test": "Batch は HTTP API 化しないため対象外"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "§16 unit 観点の対応表が明示されているか"
    - "不足ケースが fixture/mock で追加されているか"
    - "実 DB / secret に依存していないか"
    - "PR target が親 Epic Branch か"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: true
  reason: "識別子単位 Batch UT 縦串"

human_decision_points:
  - "integration 種別（§16 No.12 等）は unit で代替確認し、実 DB integration は別 Task とする"

stop_conditions:
  - "必須 input.docs（バッチ仕様書）が存在しない場合"
  - "親 Epic Issue / Branch が未確定の場合"
  - "実装が Epic Branch に未マージの場合"
  - "OpenAPI / generated / migration 変更が必要になった場合"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "Issueタイトル: [Task]BATCH-007:Item反映Batch単体テスト"
  - "後続: Epic PR → develop"
  - "実装時点の最小 UT で §16 No.1〜7,13 相当は一部カバー済み。本 Task で No.8〜12 等を拡充する"
