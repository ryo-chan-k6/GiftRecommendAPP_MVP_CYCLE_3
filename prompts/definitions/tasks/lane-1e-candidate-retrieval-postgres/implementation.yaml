      action: "update"
      required: true
    - path: "apps/reco/src/reco/infrastructure/db/repositories/**"
      action: "update"
      required: true
    - path: "apps/reco/tests/unit/composition/**"
      action: "update"
      required: true
    - path: "apps/reco/tests/unit/infrastructure/**"
      action: "update"
      required: true
    - path: "supabase/seeds/test-data/**"
      action: "update"
      required: true
    - path: "ai-logs/experiments/**"
      action: "create"
      required: false
  tests: []
  generated:
