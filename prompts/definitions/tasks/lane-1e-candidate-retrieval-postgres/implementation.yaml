  title: "レーン1e:候補Retrieval Postgres配線実装"
  summary: "MOD-RECO-012/013/014 の Item 系 Port を Postgres 実装し production composition に注入する。item_semantic seed を補完し、PUB-002 再スモーク結果を記録する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]レーン1e:候補Retrieval Postgres配線"
  epic_issue_number: null
  epic_branch: null
  related_issues:
    - number: 1268
      purpose: "先行 Feature DI Epic（stack base）"
    - number: 1274
      purpose: "先行 UserFeature 配線"
  related_prs:
    - number: 1275
      purpose: "UserFeature MERGED"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  GRS-REC-012 は Final Ranker まで到達できず ranked_items 未設定のため発生。
  InMemory 候補（item-001）と seed UUID / embedding model_version が不一致。

objective: |
  Postgres Item / Embedding 検索、Post Hard Filter 用 item/semantic、
  Feature Matcher 用 item_feature を配線し縦串を前進させる。

scope:
  - "PostgresItemRepository（012 search / count）"
  - "PostgresPostFilterItemRepository（013 validation / semantic）"
  - "PostgresItemFeatureRepository + FeatureNormalization（014）"
  - "build_production_ports 注入"
  - "test-data item_semantic seed 補完"
  - "UT・手順書・再スモーク"

out_of_scope:
  - "Reason / Snapshot 本番永続"
  - "OpenAPI / migration / SCR / PUB-004"
  - "Ranking 式の変更"

input:
  docs:
    - path: "docs/06_実装設計/cross_cutting/ローカル開発手順書.md"
      required: true
  files:
    - path: "apps/reco/src/reco/composition/builder.py"
