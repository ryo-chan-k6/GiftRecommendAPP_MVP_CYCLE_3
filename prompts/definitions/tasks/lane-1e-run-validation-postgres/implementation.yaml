  summary: "PostgresRunValidation を実装し build_production_ports で early pipeline（少なくとも MOD-RECO-004 ほか RunValidation 利用モジュール）へ注入する。ローカル PUB-002 再スモーク結果を手順書に記録する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]レーン1e:Reco RunValidation Postgres配線"
  epic_issue_number: 1268
