      purpose: "Blocker 特定"
    - number: 1267
      purpose: "未達記録 PR"
  related_prs:
    - number: 1267
      purpose: "結果あり未達の記録"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  production composition は Run Recorder を Postgres 化する一方、User Semantic Extractor 等の
  RunValidation は InMemory（空）のまま。run が DB にあっても not found になる。

objective: |
  PostgresRunValidation を実装し、build_production_ports で共有注入する。
  DEFAULT/scaffold の InMemory は維持。ローカル再スモークを記録する。

scope:
  - "PostgresRunValidation（recommendation_run.semantic_config_version_id 読取）"
  - "build_production_ports で RunValidation 利用モジュールへ注入"
  - "composition unit test 更新"
  - "ローカル開発手順書 §10.4.5 追記（再スモーク）"
  - "必要なら experiments メモ"
  - "Task / Review Definition 整備"

out_of_scope:
  - "UserSemantic / Feature 等の永続化リポジトリ全面 Postgres 化（本 Task で必須化しすぎない）"
  - "candidate retrieval 以降 stub 全面化"
  - "OpenAPI / migration / SCR / PUB-004"

