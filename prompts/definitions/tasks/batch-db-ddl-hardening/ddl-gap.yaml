      action: "update"
      required: true
    - path: "docs/06_実装設計/database/item_feature_input_テーブル定義書.md"
      action: "create"
      required: true
    - path: "docs/06_実装設計/database/item_embedding_input_テーブル定義書.md"
      action: "create"
      required: true
  files:
    - path: "supabase/migrations/*_item_feature_embedding_input.sql"
      action: "create"
      required: true

deliverables:
  - "列差分棚卸し（ギャップ一覧追記）"
  - "012/015 永続 migration"
  - "テーブル定義書 2 本"
  - "BATCH-011/014 §2.2 追記"

acceptance_criteria:
  - "列差分棚卸しが docs にある"
  - "012/015 永続テーブルの migration（加算のみ）がある"
  - "テーブル定義書がある"
  - "019 / DROP を含まない"
  - "secret 実値なし"
  - "PR target が親 Epic Branch"

