  related_prs:
    - 1570

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  T1/T2 完了（#1562/#1568）。Human 確定の次は T3: DbWriter 実接続基盤。
  現状 ScaffoldDbWriter のみ。reco の create_database_session と同型で Scaffold 切替を残す。
  repositories の stub 解除は T4a/T4b。production DB 適用・外部 API は除外。

objective: |
  batch に実 DB 書込境界（PostgresDbWriter）と factory 切替を導入し、UT で Protocol / 切替を担保する。

scope:
  - "PostgresDbWriter（psycopg）+ create_db_writer factory"
  - "DATABASE_URL 未設定 / scaffold:// → ScaffoldDbWriter"
  - "mask_database_url（ログ用・実値非露出）"
  - "apps/batch pyproject に psycopg 依存追加"
  - "UT（factory 切替・scaffold 回帰・Postgres は mock または skip）"
  - "ギャップ一覧の T3 進捗反映"
  - "Task / Review Definition"

out_of_scope:
  - "各 repositories.py の in-memory 置換（T4a/T4b）"
  - "IF 単位 stub 解除・本番 Upsert SQL 詳細"
  - "DDL / migration 変更"
  - "親 workflow / 外部 API"
  - "production DB 適用・接続実値の commit"
  - "apps/reco / apps/api 変更"

input:
