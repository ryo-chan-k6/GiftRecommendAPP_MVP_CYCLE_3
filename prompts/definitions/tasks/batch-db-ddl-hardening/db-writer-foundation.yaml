  id: "task-batch-db-ddl-hardening-db-writer-foundation"
  title: "batch-db-ddl-hardening:DbWriter接続基盤"
  summary: "apps/batch に PostgresDbWriter と create_db_writer（DATABASE_URL / scaffold:// 切替）を追加する。repositories の in-memory stub 解除は T4 に残す。"

work_mode: "ai-agent"

parent:
