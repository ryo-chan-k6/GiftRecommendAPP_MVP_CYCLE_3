background: |
  T4a（#1579）で Wave A CLI 配線と IF-006/020 UPSERT 完了。次は T4b Wave B。
  T2 で item_feature_input / item_embedding_input を CREATE 済み。アプリはまだ *_handoff 仮想表名。
  沸騰回避: Wave B CLI 配線 + 代表 IF-012 / IF-015 UPSERT。他 IF フル UPSERT・SELECT は後続。

objective: |
  Wave B job が DATABASE_URL で実 Writer に切替でき、012/015 が永続テーブルへ ON CONFLICT UPSERT できる状態にする。

scope:
  - "Wave B __main__ への create_db_writer 配線（--scaffold-demo は Scaffold 固定）"
  - "IF-012: feature_input_hash → item_feature_input UPSERT"
  - "IF-015: embedding_input_hash → item_embedding_input UPSERT"
  - "UT（upsert / wiring / scaffold 回帰）"
  - "ギャップ一覧 T4b 進捗反映"
  - "Task / Review Definition"

out_of_scope:
  - "Wave A 追加変更（001〜008+020/021）"
  - "IF-009/010/011/013/014/016/017/VEC のフル UPSERT SQL"
  - "読取 SELECT 本実装"
  - "DDL / migration 変更"
  - "production DB 適用・外部 API 本接続"
  - "親 workflow"
  - "BATCH-018/019"

