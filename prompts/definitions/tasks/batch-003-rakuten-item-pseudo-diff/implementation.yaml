    path: null

deliverables:
  - "BATCH-003 商品疑似差分取得ジョブ実装"
  - "batch-rakuten-item-pseudo-diff.yml"
  - "最小 unit test（fixture / mock）"

acceptance_criteria:
  - "バッチ仕様書の主要 Phase（plan/priority/fetch/adapt/extract/dedupe/raw_save/cursor/finalize）がコード上で追跡できる"
  - "Rakuten Item Search 取得が Protocol / mock 経由で単体テスト可能である"
  - "Raw 冪等（object_key / content_hash）と fetch_cursor 進捗更新が実装されている"
  - "Item / Staging / ranking_snapshot を本 Batch で作らない"
  - "ranking_supplement を消費でき、recheck を消費しない"
  - ".github/workflows/batch-rakuten-item-pseudo-diff.yml が存在し、workflow_dispatch（および workflow_call）を持つ"
  - "secret / .env 実値 / 楽天APIキー実値をコード・fixture・workflow・ログに含まない"
  - "OpenAPI / generated / DB migration を変更していない"
  - "親 Epic の epic_scope.allowed_paths 外を編集していない"
  - "最小 unit test がローカルで実行可能である"

