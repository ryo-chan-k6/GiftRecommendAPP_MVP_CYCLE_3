schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-003-rakuten-item-pseudo-diff-implementation"
  title: "BATCH-003:楽天商品疑似差分取得Batch実装"
  summary: "BATCH-003（楽天商品疑似差分取得Batch）をバッチ仕様書に基づき apps/batch へ実装する。楽天商品検索API連携（fixture/mock可）、Raw保存、fetch_cursor 進捗、および独立 workflow YAML を対象とする。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]BATCH-003:楽天商品疑似差分取得Batch"
  epic_issue_number: 1207
  epic_branch: "feature/epic-1207-batch-003-rakuten-item-pseudo-diff"
  related_issues:
    - number: 1213
      purpose: "本 Task Issue"
    - number: 1208
      purpose: "前提（バッチ仕様書 Task・CLOSED）"
  related_prs:
    - number: 1209
      purpose: "バッチ仕様書 Epic Branch merge 済み"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Phase4b レーン B1 Fetch 第3段。バッチ仕様書 #1208 / PR #1209 は Epic Branch merge 済み。
  Phase4a batch-foundation（#734）および BATCH-001 / BATCH-002 develop merge 済みを前提に、
  BATCH-003 の商品疑似差分取得ジョブを実装する。
  Batch は HTTP API 化しないため Contract Gate は不要。
  実楽天APIへの課金・大量呼出は禁止し、unit は fixture / mock を正とする。

objective: |
  BATCH-003 について、仕様書の処理ステップ（plan → priority → fetch → adapt → extract → dedupe → raw_save → cursor → finalize）を
  apps/batch 上で実行可能な実装と、起動用独立 workflow（batch-rakuten-item-pseudo-diff.yml）を整備する。

scope:
  - "BATCH-003 ジョブの application 層実装（fetch_plan / fetch_cursor 解決・Phase 実行・部分失敗方針）"
  - "Rakuten Item Search API Client / Adapter の実装または scaffold 拡張（実API呼出は設定時のみ。unitはmock）"
  - "Raw Object Writer / Raw Metadata / fetch_cursor 進捗更新の配線（Item / Staging は作らない）"
  - "batch_run_log / phase_log / api_call_log / error_log 連携（既存 logger / job_run 骨格の利用）"
  - ".github/workflows/batch-rakuten-item-pseudo-diff.yml の新規作成（workflow_call / workflow_dispatch）"
  - "実装に必要な最小 unit test（fixture / mock。主要正常系・冪等・API失敗・ranking_supplement・境界）"
  - "Task / Review Definition の実Issue・Branch反映"

out_of_scope:
  - "バッチ仕様書の全面書き換え（軽微な実装追随注記以外）"
  - "他 Batch（BATCH-001 / 002 / 004〜019）の実装（genre_sync / ranking_snapshot 破壊変更禁止）"
  - "親 batch-rakuten-item-import.yml 全体改修"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema / migration 変更"
  - "本番楽天APIへの大量・課金影響のある実呼出検証"
  - "専用の包括的 UT Task（後続 unit-test Task で扱う網羅マトリクス）"
  - "Staging / Item / ranking_snapshot への反映"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-003_楽天商品疑似差分取得バッチ仕様書.md"
      required: true
      purpose: "実装の正本（処理ステップ・入出力・冪等・エラー）"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-003 行との整合確認"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "Raw・モジュール・object_key 方針"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "楽天商品検索API・疑似差分ルート"
    - path: "docs/06_実装設計/database/fetch_cursor_テーブル定義書.md"
      required: false
      purpose: "cursor_type / ranking_supplement 参照"
