      required: false
      purpose: "同型実装の参照（破壊変更しない）"
    - path: "apps/batch/src/batch/infrastructure/rakuten/**"
      required: true
      purpose: "Rakuten client scaffold"
    - path: "apps/batch/src/batch/infrastructure/object_storage/**"
      required: true
      purpose: "Raw Object Writer 骨格"
    - path: "apps/batch/src/batch/infrastructure/db/**"
      required: true
      purpose: "DB writer 骨格"
    - path: "apps/batch/src/batch/config/**"
      required: true
      purpose: "設定・環境変数名"
  issues:
    - number: 1208
      purpose: "バッチ仕様書 Task"
  prs:
    - number: 1209
      purpose: "バッチ仕様書 merge"

output:
  docs: []
  files:
    - path: "apps/batch/src/batch/application/item_pseudo_diff/**"
      action: "create"
      required: true
    - path: "apps/batch/src/batch/application/__init__.py"
      action: "update"
      required: false
    - path: "apps/batch/src/batch/infrastructure/rakuten/**"
      action: "update"
      required: true
    - path: ".github/workflows/batch-rakuten-item-pseudo-diff.yml"
      action: "create"
      required: true
    - path: "prompts/definitions/tasks/batch-003-rakuten-item-pseudo-diff/implementation.yaml"
      action: "update"
      required: true
    - path: "prompts/definitions/reviews/batch-003-rakuten-item-pseudo-diff/implementation/pr-review.yaml"
      action: "create"
      required: true
  tests:
