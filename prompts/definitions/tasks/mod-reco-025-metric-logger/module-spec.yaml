background: |
  Human 判断により MOD-RECO-025 を MVP 必須として実装する。
  06_実装設計において MOD-RECO-025 の Recoモジュール仕様書を作成する。
  Orchestrator パイプライン成功終端から `MetricLoggerPort.record_metrics(context)` で呼び出される。
  記録失敗は推薦結果をブロックしない（028 / 029 と同型の non-blocking 方針）。
  MVP 実装は InMemory Repository を正とし、Postgres 永続化は段階3 Composition Task へ委譲する。

objective: |
  MOD-RECO-025 について、apps/reco 実装・単体テスト・レビューが可能な粒度のモジュール仕様書を作成する。
  作成する仕様書は prompts/templates/docs/module-spec.md に準拠する。

scope:
  - "MOD-RECO-025 のモジュール仕様書を新規作成する"
  - "モジュール基本情報・主責務・対象外責務・入出力・処理フロー・例外・ログ・テスト観点を整理する"
  - "Orchestrator（MOD-RECO-001）MetricLoggerPort 契約との整合"
  - "Observability §11.2 / §11.3 の MVP Metric 範囲を Human 判断とともに確定記載"
  - "InMemory 永続化方針と Composition（DB）委譲境界の明記"

out_of_scope:
  - "apps/reco の実装"
  - "Orchestrator stubs.py Wiring"
  - "OpenAPI / DB schema / migration 変更"
  - "Postgres Metric Repository 実装詳細（Composition Task）"
  - "他 Recoモジュール本体のモジュール仕様書作成"

