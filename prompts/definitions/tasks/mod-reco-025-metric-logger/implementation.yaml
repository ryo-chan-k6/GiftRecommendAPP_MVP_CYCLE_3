  - "`build_default_metric_logger()` 等の composition エントリ（InMemory）"
  - "MetricLoggerPort 適合の公開 I/F"
  - "必要最小限のスモークテスト"

out_of_scope:
  - "Orchestrator stubs.py Wiring（別 Epic）"
  - "Postgres Metric Repository（Composition Task）"
  - "API-INT-002 エンドポイント層"
  - "他 Recoモジュール本体"
  - "OpenAPI / DB schema 変更"
  - "網羅的単体テスト（unit-test Task）"

input:
