  Epic 配下で MOD-RECO-025 モジュール仕様書 Task 完了後、モジュール本体を `apps/reco/src/reco/application/metric-logger/**` に実装する。
  `MetricLoggerPort.record_metrics(context)` に適合する実装とする。
  Orchestrator `stubs.py` 差し替えは別 Wiring Epic scope。

objective: |
  MOD-RECO-025 モジュール本体を実装し、モジュール仕様書の責務・入出力・例外方針を満たす。
  単体テストの網羅的追加は後続 unit-test Task に委譲する。

scope:
