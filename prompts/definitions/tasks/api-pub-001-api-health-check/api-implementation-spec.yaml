task:
  id: "task-api-pub-001-api-health-check-api-implementation-spec"
  title: "API-PUB-001:APIヘルスチェックAPI実装仕様書作成"
  summary: "API-PUB-001（APIヘルスチェック / Public API、`GET /api/v1/health`）のAPI実装仕様書（API-PUB-001_APIヘルスチェックAPI実装仕様書.md）を、確定済み契約仕様書（#395）・OpenAPI断片（#412）・ログ・Observability設計書に基づき、prompts/templates/docs/api-implementation-spec.md に準拠して作成する（実装面のみ。契約面再掲・OpenAPIファイル変更・apps/api実装は対象外）。"

work_mode: "ai-agent"

