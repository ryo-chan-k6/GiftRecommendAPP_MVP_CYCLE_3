background: |
  Phase4b 縦串の 1/3（実装面仕様書）。契約面は `API-PUB-001_APIヘルスチェックAPI契約仕様書.md`（#395 / PR #398）を正とする。
  OpenAPI 断片（#412 / PR #413）は develop 反映済み。本 Task は契約・OpenAPI を変更せず、apps/api の health エンドポイント実装 Task が参照可能な **実装面のみ** を整理する。
  本 API は推薦パイプラインを実行しない軽量ヘルスチェックである。依存（DB / reco）の個別結果は契約上表面化せず、集約 `status`（`ok` / `degraded` / `unavailable`）のみを返す。
  ローカル最小 health（#1135 / PR #1136）は疎通用の先行実装であり、本実装仕様書を正として後続実装 Task で契約準拠へ揃える。
  Provider は apps/api（`apps/api/src/app/health/**`）、Consumer は apps/web / 運用確認（監視・疎通確認）とする。
  develop merge は INT-001 Epic PR の後（並列計画 Human 判断）。

objective: |
  API-PUB-001（APIヘルスチェック / Public API）について、apps/api health 実装 Task / 単体テスト Task が参照可能な粒度の **API実装仕様書（実装面のみ）** を新規作成する。
  成果物は prompts/templates/docs/api-implementation-spec.md に準拠し、契約面（`api-contract-spec.md`）の章は再掲しない。
  Express ルーター、Request meta（trace / requestId）、Response 組立、集約 status 判定（依存チェックの内部方針）、エラーマップ、ログ・メトリクス書き込み境界を明記する。
  OpenAPI 正本パスおよび generated client 利用方針は実装影響として記載するが、本 Task では当該ファイルを変更しない。

scope:
  - "API-PUB-001（APIヘルスチェック / Public API）のAPI実装仕様書を新規作成する（成果物ファイル名: API-PUB-001_APIヘルスチェックAPI実装仕様書.md）"
  - "前提契約（契約仕様書パス / OpenAPI / Contract Gate 状態）を整理する"
  - "実装方針（Express Router / request-meta / 集約 status 判定 / DI）を整理する"
  - "処理フロー（Mermaid）と処理詳細を整理する（Request 受付 → meta 解決 → 稼働判定 → Response 組立）"
  - "Request Header / Response Body の内部DTOマッピングを整理する（GET・Body なし）"
  - "generated client 利用方針（apps/web 側・任意疎通）を整理する（記載のみ）"
  - "provider（apps/api health）/ consumer（apps/web・運用確認）の実装影響を整理する"
  - "エラーマップ（unavailable / 内部例外 → HTTP / GRS コード）と trace 伝播を整理する"
  - "ログ・メトリクス（api_request_count / api_error_count）書き込み境界（実装面）を整理する"
  - "依存チェック（DB / reco）を契約上表面化しない前提での内部判定方針を整理する"
  - "実装結合テスト観点を整理する"
  - "非機能（タイムアウト・軽量性・副作用なし・認証不要）の実装面を整理する"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
  - "API-INT-001（Recoヘルスチェック / Internal API）の仕様・実装仕様書作成・変更"
  - "API-PUB-002（レコメンド実行）の仕様・実装仕様書変更"
  - "prompts/templates/docs/api-contract-spec.md に準拠する契約面章（Request/Response/Error の契約再掲・OpenAPI schema 詳細）"
  - "API-PUB-001_APIヘルスチェックAPI契約仕様書.md の変更（契約確定済みを前提）"
  - "OpenAPI定義ファイル（packages/contracts/openapi/public-api.yaml）の作成・更新"
  - "Orval設定ファイル（orval.config.ts）の作成・更新"
  - "generated API client（apps/web/src/generated/api/ 等）の再生成"
  - "apps/api の実装（health Router を含む）"
  - "apps/web の実装"
  - "apps/reco の実装"
  - "DB schema変更"
  - "認証・認可方式そのものの変更"
  - "画面仕様書の作成"

