background: |
  Phase4b 縦串の 2/3（apps/api 実装）。前提: 実装仕様書 #1155 / PR #1156 が親 Epic Branch に merge 済みであること。
  契約・OpenAPI は #395 / #412 で確定済み。#1135 / PR #1136 の最小 health が develop にあり、Epic Branch への develop 取込が実装前に必要（Human Review 論点）。
  MVP 推奨は実装仕様書 §3.5 方針 A（プロセス稼働確認のみ・常に ok）。方針 B（内部依存 probe）は Human 承認後のみ。
  網羅的単体テストは後続 unit-test Task に委譲する。

objective: |
  `GET /api/v1/health` を契約・OpenAPI・実装仕様書に沿って apps/api 上で提供する。
  Express Router（`apps/api/src/app/health/**`）、request-meta、集約 status、エラーマップ、access / metric 境界を整える。

scope:
  - "`apps/api/src/app/health/**` の契約準拠整備（#1135 先行実装の追随）"
  - "`GET /api/v1/health` の Response（`data.status` / `service=okuri` / `apiVersion=v1` / `checkedAt` + `meta`）"
  - "trace / requestId の Header ↔ meta 一貫（`resolveRequestMeta`）"
  - "unavailable / 想定外時の ErrorResponse（方針 A では経路は最小でよいが、組立方針は実装仕様書に合わせる）"
  - "access_log / api_request_count / api_error_count の最小記録（既存 logger 方針に整合）"
  - "親アプリへの Router mount 確認（`/api/v1`）"
  - "実装スモーク単体テスト（最小限。網羅は後続 Task）"
  - "Task / Review Definition 整備"

out_of_scope:
  - "packages/contracts/openapi/** の変更"
  - "Orval / generated の再生成・手動編集"
  - "apps/web/** の変更"
  - "apps/reco/** の変更"
  - "API-PUB-001 契約仕様書・実装仕様書 docs の変更"
  - "DB schema 変更・migration"
  - "方針 B（DB / reco 内部 probe）の実装（Human が方針 B を採択した場合のみ別途 scope 拡張）"
  - "網羅的単体テスト Task（Phase4b 3/3）"
  - "結合テスト・E2E"

