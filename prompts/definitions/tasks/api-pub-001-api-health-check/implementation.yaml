  - "request-meta / ErrorResponse 方針との整合"
  - "最小スモーク単体テスト（任意・実装 PR 内）"
  - "Task / Review Definition"

acceptance_criteria:
  - "`GET /api/v1/health` が 200 で `data.status=ok` / `service=okuri` / `apiVersion=v1` を返す"
  - "実装仕様書・契約仕様書・OpenAPI と矛盾しない"
  - "依存個別結果を Response に載せていない"
  - "OpenAPI / generated / apps/web / apps/reco の変更を含まない"
  - "epic_scope.allowed_paths 内に差分が収まっている"
  - "`pnpm --filter @gift-recommendation/api build` が SUCCESS（または同等 typecheck）"
  - "最小スモークまたは手動確認結果を PR に記載"
  - "secret、APIキー、.env 実値が含まれていない"

