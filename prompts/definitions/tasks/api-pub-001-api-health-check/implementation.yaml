  summary: "API-PUB-001（APIヘルスチェック / Public API、`GET /api/v1/health`）の apps/api health エンドポイントを、契約仕様書・OpenAPI・実装仕様書（#1155 / PR #1156）に沿って整備する（#1135 先行実装の契約準拠追随・metric 含む。Phase4b 2/3）。"

