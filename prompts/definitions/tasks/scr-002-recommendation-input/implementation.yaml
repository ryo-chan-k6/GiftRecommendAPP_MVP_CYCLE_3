background: |
  SCR-002 Epic（#1147）の実装 Task。画面仕様書 Task 完了後、かつ PUB-005〜008 マスタ API 実装完了後に着手する（実装フェーズ並列計画・Human 判断）。
  本 Definition はレーン1時点で先行作成し、/start-task は着手条件充足後に実行する。

objective: |
  SCR-002 の条件入力画面を apps/web 上で実装し、マスタ取得・バリデーション・API-PUB-002 呼び出し・画面状態遷移を画面仕様書どおりに提供する。

scope:
  - "apps/web/src/app/recommendations/** および apps/web/src/features/recommendation-input/** への画面実装"
  - "API-PUB-005〜008 マスタ取得と選択肢表示"
  - "API-PUB-002 レコメンド実行呼び出し（generated api-client 利用）"
  - "入力バリデーション・エラー表示・ローディング等の画面状態"
  - "Task / Review Definition 整備"

out_of_scope:
  - "画面仕様書の新規作成（screen-spec Task）"
  - "OpenAPI / Orval / generated の手編集"
  - "apps/api / apps/reco / apps/batch の変更"
  - "共通 UI（apps/web/src/components/**）の新規横断追加（web-foundation / 共通UI Epic の範囲）"
  - "E2E 全面整備"
  - "網羅的単体テスト（unit-test Task に委譲）"

