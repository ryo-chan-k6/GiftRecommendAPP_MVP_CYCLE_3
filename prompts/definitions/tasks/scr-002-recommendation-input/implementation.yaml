      required: true
      purpose: "SCR-002 行との整合確認"
    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
      purpose: "遷移元・遷移先の確認"
    - path: "docs/04_ドメインモデル設計/RecommendationRequest定義書.md"
      required: true
      purpose: "入力項目・バリデーションのドメイン正本"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "API-PUB-002 / API-PUB-005〜008 の確認"
