  title: "SCR-002:レコメンド条件入力画面仕様書作成"
  summary: "SCR-002（レコメンド条件入力画面）の画面仕様書（SCR-002_レコメンド条件入力画面画面仕様書.md）を、画面一覧・画面遷移図・Recommendation Request定義書・API一覧に基づいて作成する。"

parent:
  epic_issue: "[Epic]Web画面実装設計"
  epic_issue_number: "#301" # 参照配置値。GitHub 実在は /start-task §5.1 で確認
  epic_branch: "feature/epic-301-web-screens"
  related_issues: []
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "orchestrator-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  06_実装設計において、web 実装・E2E テスト設計の前提となる画面仕様書を作成する。
  本Taskでは、画面一覧の SCR-002（レコメンド条件入力画面）を対象に、表示項目・入力項目・画面状態・遷移・利用 API を整理する。

objective: |
  SCR-002（レコメンド条件入力画面）について、実装・レビューが可能な粒度の画面仕様書を作成する。
  作成する仕様書は prompts/templates/docs/screen-spec.md に準拠する。

scope:
  - "SCR-002 の画面仕様書を新規作成する（成果物: SCR-002_レコメンド条件入力画面画面仕様書.md）"
  - "画面目的・対象ユーザー・表示・入力項目を整理する"
  - "画面状態（ローディング・エラー等）と遷移を整理する"
  - "利用 API・マスタ取得・バリデーション方針を整理する"

out_of_scope:
  - "他画面（SCR-001 以外の全画面）の画面仕様書作成"
  - "個別API仕様書の作成・更新"
  - "OpenAPI / generated / ソースコード実装"
  - "認証・認可方式そのものの変更"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
      purpose: "SCR-002 の画面ID・画面名・MVP対象・概要を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
      purpose: "遷移元・遷移先・画面状態を確認するため"
    - path: "docs/04_ドメインモデル設計/RecommendationRequest定義書.md"
      required: true
      purpose: "入力項目・バリデーションのドメイン正本を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "画面から呼び出す API（マスタ取得・レコメンド実行等）を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能一覧.md"
      required: false
      purpose: "画面が対応する機能範囲を確認するため"
  templates:
    - path: "prompts/templates/docs/screen-spec.md"
      required: true
      purpose: "画面仕様書を標準フォーマットで作成するため"
      applies_to:
        - "docs/06_実装設計/web/SCR-002_レコメンド条件入力画面画面仕様書.md"
  files: []
  issues: []
  prs: []

output:
  docs:
    - path: "docs/06_実装設計/web/SCR-002_レコメンド条件入力画面画面仕様書.md"
      action: "create"
      required: true
      template: "prompts/templates/docs/screen-spec.md"
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "SCR-002 画面仕様書"
  - "表示・入力項目定義"
  - "画面遷移・利用 API 整理"

acceptance_criteria:
  - "docs/06_実装設計/web/SCR-002_レコメンド条件入力画面画面仕様書.md が作成されている"
  - "prompts/templates/docs/screen-spec.md の章構成に準拠している"
  - "画面一覧の SCR-002 と矛盾する画面ID・画面名・MVP対象を定義していない"
  - "Recommendation Request定義書と入力項目が整合している"
  - "secret、APIキー、.env実値を含んでいない"

branch:
