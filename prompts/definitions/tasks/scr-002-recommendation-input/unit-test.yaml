  epic_branch: "feature/epic-1147-scr-002-recommendation-input"
  related_issues:
    - number: 1220
      purpose: "本 Task Issue"
    - number: 1147
      purpose: "親 Epic"
    - number: 1214
      purpose: "前提 Task（実装）"
  related_prs:
    - number: 1221
      purpose: "本 Task PR（単体テスト）"
    - number: 1218
      purpose: "実装 Task PR（親 Epic Branch merge 済み）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "test-ai"
  support:
    - "worker-ai"
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  SCR-002 Epic（#1147）の単体テスト Task。implementation Task 完了後に着手する。
  本 Definition はレーン1時点で先行作成し、/start-task は実装完了後に実行する。

objective: |
  SCR-002 画面実装の単体テストを整備し、主要入力・状態・API 呼び出し境界を再現可能に検証する。

scope:
  - "SCR-002 関連の component / feature 単体テスト追加"
  - "バリデーション・エラー表示・ローディング等の主要状態のテスト"
  - "API client 呼び出し境界のスタブ検証"
  - "Task / Review Definition 整備"

out_of_scope:
  - "画面仕様書・実装本体の機能追加"
  - "E2E / Playwright 全面整備"
  - "OpenAPI / generated 変更"
  - "apps/api / apps/reco / apps/batch の変更"

input:
  docs:
    - path: "docs/06_実装設計/web/SCR-002_レコメンド条件入力画面画面仕様書.md"
      required: true
      purpose: "テスト観点の正本"
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
      purpose: "SCR-002 行との整合確認"
  templates: []
  files:
    - path: "apps/web/src/features/recommendation-input/**"
      required: true
      purpose: "テスト対象実装"
  issues: []
  prs: []

output:
  docs: []
  files: []
  tests:
    - path: "apps/web/**/recommendation-input/**/*.{test,spec}.{ts,tsx}"
      action: "create_or_update"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "SCR-002 単体テスト"
  - "主要画面状態の再現可能な検証"

acceptance_criteria:
  - "主要バリデーション・画面状態のテストが追加されている"
  - "テストがローカルで再現可能である"
  - "epic_scope.allowed_paths 外へ変更していない"
  - "secret / .env 実値を含んでいない"

branch:
  no_branch: false
  name: "test/task-1220-scr-002-recommendation-input-unit-test"
  base: "feature/epic-1147-scr-002-recommendation-input"
  target: "feature/epic-1147-scr-002-recommendation-input"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "medium"
    planned_start: "2026-07-13"
    due_date: "2026-07-16"

issue:
  unit: "task"
  type: "test"
  area: "web"

dependencies:
  epics:
    - issue: 357
      title: "[Epic]API-PUB-002:レコメンド実行"
      purpose: "レコメンド実行 API"
  issues:
    - number: 1214
      purpose: "実装 Task"
  prs:
    - number: 1218
      purpose: "実装 PR"
  tasks:
    - "implementation Task が親 Epic Branch に merge 済みであること"
  blocking: true

parallel_control:
  depends_on:
    - "implementation"
  blocks: []
  exclusive_files:
    - "apps/web/tests/component/recommendation-input/**"
    - "prompts/definitions/epics/scr-002-recommendation-input/epic.yaml"
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
    - "unit test"
  commands:
    - "pnpm --filter @gift-recommendation/web test:component"
  manual_checks:
    - "画面仕様書の主要状態がテストでカバーされていること"
  not_required:
    - "e2e"
  skip_reason:
    "e2e": "本 Task は単体テスト範囲"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "画面仕様書の主要観点がテストされているか"
    - "不安定な network / 本番依存がないか"
    - "Epic allowed_paths に apps/web/tests/** が追加されているか"
    - "secret 非含有か"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: false

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常のテスト Task。作業計画は Issue、レビューは PR を正本とする。"

stop_conditions:
  - "implementation が未完了の場合"
  - "テストが本番 API / 本番 secret に依存する場合"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "Issueタイトル: [Task]SCR-002:レコメンド条件入力画面単体テスト"
  - "本 Task Issue: #1220 / Branch: test/task-1220-scr-002-recommendation-input-unit-test"
  - "親Epic: #1147 / Branch: feature/epic-1147-scr-002-recommendation-input"
  - "PR 本文は Related to #1220（Closes 禁止）"
  - "Epic allowed_paths に apps/web/tests/** と epics Definition を追加する"
  - "Review Definition: prompts/definitions/reviews/scr-002-recommendation-input/unit-test/pr-review.yaml"
