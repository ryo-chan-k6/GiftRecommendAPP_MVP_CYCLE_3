schema_version: "1.0"
definition_type: "task"

task:
  id: "task-scr-002-recommendation-input-unit-test"
  title: "SCR-002:レコメンド条件入力画面単体テスト"
  summary: "SCR-002（レコメンド条件入力画面）実装に対し、入力バリデーション・画面状態・API client 呼び出し境界の単体テストを追加する。"

work_mode: "ai-agent"

parent:
