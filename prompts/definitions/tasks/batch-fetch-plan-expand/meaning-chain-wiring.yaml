schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-fetch-plan-expand-meaning-chain-wiring"
  title: "batch-fetch-plan-expand:意味連鎖BATCH-010/012/016配線"
  summary: "concept_feature_rule seed（#1859）を活かすため、BATCH-012のDBルール読込、BATCH-010のMVP concept出力、BATCH-016のcurrent version解決を配線する。"
  workstream_key: "batch-fetch-plan-expand"
  phase: "07_開発・単体テスト"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-fetch-plan-expand:ジャンル地図からのfetch_plan拡大"
  epic_issue_number: 1843
  epic_branch: "chore/epic-1843-batch-fetch-plan-expand"
  related_issues:
    - 1843
    - 1858
    - 1859
  related_prs:
    - 1859

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  意味連鎖 live（009〜015）で item_feature / item_meaning が全軸 0.5 になった。
  ① concept_feature_rule 稀疏 seed（#1858 / PR #1859）は完了済み。
  それでも 012 live が空ルールのままだと全軸 0.5 のまま。加えて 010 が scaffold_named_item、
  016 が非 UUID 既定文字列を使うと後続が破綻する。
  本 Task は ② 実装配線（010/012/016）のみ。親シェル実行時設定は後続 ③。

objective: |
  BATCH-012 が DB の concept_feature_rule を signed delta として読み込み、
  BATCH-010 が MVP 18 Concept を keyword/hash で出力し、
  BATCH-016 live が CurrentVersionResolver で current UUID を解決するようにする。

scope:
  - "BATCH-012: concept_feature_rule DB 読込 + polarity→signed delta + scaffold adapter 注入"
  - "BATCH-010: scaffold_named_item 廃止、keyword 優先 / hash fallback の MVP concept 出力"
  - "BATCH-016: live で version 未指定時 CurrentVersionResolver.resolve_semantic()"
  - "関連 unit tests 追加・更新"

out_of_scope:
  - "concept_feature_rule seed 追加（#1859 済み）"
  - "親シェルへの --semantic-config-version-id 伝播（③）"
  - "--live-embedding / OpenAI 実呼出"
  - "意味連鎖 live 再実行（Human / merge 後）"
  - "Featureルール定義書 §10.3 の数値改訂"
  - "apps/web|api|reco / OpenAPI / generated"
  - "production DB 変更"

input:
  docs:
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: false
    - path: "docs/06_実装設計/database/初期データ定義書.md"
      required: false
  files:
    - path: "apps/batch/src/batch/application/item_feature/**"
    - path: "apps/batch/src/batch/application/item_semantic/**"
    - path: "apps/batch/src/batch/application/distribution_metrics/**"
    - path: "apps/batch/src/batch/application/current_versions.py"

output:
  docs: []
  files:
    - path: "apps/batch/src/batch/application/item_feature/rules_loader.py"
      action: "create"
      required: true
    - path: "apps/batch/src/batch/application/item_feature/**"
      action: "update"
      required: true
    - path: "apps/batch/src/batch/application/item_semantic/adapter.py"
      action: "update"
      required: true
    - path: "apps/batch/src/batch/application/distribution_metrics/**"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/application/test_item_feature.py"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/application/test_item_semantic.py"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/application/test_distribution_metrics.py"
      action: "update"
      required: true
    - path: "prompts/definitions/tasks/batch-fetch-plan-expand/**"
      action: "update"
      required: false

deliverables:
  - "012 DB ルール読込配線"
  - "010 MVP concept 出力"
  - "016 current version 解決"
  - "unit test 通過結果（PR本文）"

acceptance_criteria:
  - "live 012 が concept_feature_rule を polarity 付きで読み込み scaffold adapter に渡す"
  - "010 が scaffold_named_item を出さない"
  - "016 live が scaffold-semantic-config-v1 にフォールバックしない"
  - "関連 unit tests が green"
  - "secret 実値なし"

branch:
  no_branch: false
  summary: "meaning-chain-wiring"
  name: "chore/task-1860-meaning-chain-wiring"
  base: "chore/epic-1843-batch-fetch-plan-expand"
  target: "chore/epic-1843-batch-fetch-plan-expand"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    status: "Todo"
    phase: "07_開発・単体テスト"
    priority: "high"
    planned_start: "2026-08-06"
    due_date: "2026-08-08"

issue:
  unit: "task"
  type: "chore"
  area: "batch"

dependencies:
  epics: []
  issues:
    - 1843
    - 1858
    - 1859
  prs:
    - 1859
  tasks: []
  blocking: false

parallel_control:
  depends_on:
    - "concept-feature-rule-seed"
  blocks:
    - "meaning-chain runtime settings (parent shell / env)"
  exclusive_files:
    - "apps/batch/src/batch/application/item_feature/**"
    - "apps/batch/src/batch/application/item_semantic/adapter.py"
    - "apps/batch/src/batch/application/distribution_metrics/**"
  conflict_risk: "medium"
  contract_impact: false
  generated_impact: false
  db_impact: false

test_policy:
  required:
    - "unit: item_feature / item_semantic / distribution_metrics"
  commands:
    - "cd apps/batch && uv sync --extra dev && uv run pytest tests/unit/application/test_item_feature.py tests/unit/application/test_item_semantic.py tests/unit/application/test_distribution_metrics.py -q"
  manual_checks:
    - "merge後 Human が意味連鎖を 010 から再queuedして非0.5を確認（本PR外）"
  not_required:
    - "意味連鎖 live 再実行"
  skip_reason:
    "意味連鎖 live 再実行": "既存 item_semantic は input hash 不変だと skip。再検証は merge 後 Human が再queued"

review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true
  review_points:
    - "012 polarity→signed delta が seed 物理と一致するか"
    - "010 が scaffold_named_item を廃止しているか"
    - "016 live が非UUID scaffold 文字列へフォールバックしないか"
    - "out of scope（親シェル③・live再実行）を含まないか"

human_decision_points:
  - "merge後の意味連鎖再実行タイミング（再queued方針）"
  - "③ 親シェル実行時設定を別Taskにするか（推奨: 別）"

stop_conditions:
  - "seed #1859 が target base に未取り込みの場合"
  - "CurrentVersionResolver が current UUID を解決できない設計変更が必要な場合"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "実装差分と検証はPR。通常作業ログはPR"

notes:
  - "前提: #1859 MERGED（concept_feature_rule seed）"
  - "後続 ③: 親シェル --semantic-config-version-id 伝播 / --live-embedding"
  - "親Epic: #1843 / Branch chore/epic-1843-batch-fetch-plan-expand"
  - "Task Issue #1860 / Branch chore/task-1860-meaning-chain-wiring"
  - "再検証: 既存 semantic_input_hash 不変だと 010 skip → 再queuedが必要"
