review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true
  review_points:
    - "item 単位の最新冪等キー組選定が §12.4 / BATCH-016 §6.2.1 と一致するか"
    - "現行 feature_normalization_version（is_current）で絞り込んでいるか"
    - "aggregator の混在失敗仕様を壊していないか"
    - "unit が version/hash 同居ケースをカバーしているか"

human_decision_points:
  - "merge後の 016 再開タイミング"

stop_conditions:
