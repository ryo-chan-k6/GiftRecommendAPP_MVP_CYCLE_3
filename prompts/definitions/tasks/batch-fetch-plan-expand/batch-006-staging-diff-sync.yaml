schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-fetch-plan-expand-batch-006-staging-diff-sync"
  title: "batch-fetch-plan-expand:BATCH-006 staging_item.diff_statusのpostgres同期修正"
  summary: "BATCH-006 の staging_item.diff_status 同期が scaffold のみだったため、live postgres でも update_rows する。staging→item 反映の選定が進まない運用ブロッカーを解消する。live再実行・crontab変更は含まない。"
  workstream_key: "batch-fetch-plan-expand"
  phase: "fix"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-fetch-plan-expand:ジャンル地図からのfetch_plan拡大"
  epic_issue_number: 1843
  epic_branch: "chore/epic-1843-batch-fetch-plan-expand"
  related_issues:
    - 1846
    - 1844
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  第1波 Item 収集後、staging distinct 約17k に対し item 約1k、product_diff 未判定約14k。
  BATCH-006 仕様 §9.4 / §18.1 No.10 は persist 後に staging_item.diff_status を同一値 UPDATE（MVP 既定 ON）。
  実装は db_writer.backend == "scaffold" のときだけ write_rows しており、postgres live では未同期。
  選定条件（diff_status IS NULL）が同じ先頭行を繰り返し、未判定 staging へ進まない。

objective: |
  BATCH-006 が live postgres でも staging_item.diff_status を同期し、
  未判定 staging の選定が進むようにする。

scope:
  - "ProductDiffRepositories.sync_staging_diff_status を update_rows（scaffold/postgres 共通）へ修正"
  - "関連 unit test の更新・追加"
  - "BATCH-006 仕様書 §9.4 / 変更履歴の最小追記"
  - "親Epic allowed_paths への product_diff 関連 path 最小追加"
  - "Task / Review Definition 整備"

out_of_scope:
  - "BATCH-007 max_items / diff-batch-run-id 運用ノブ変更"
  - "既存 DB の staging_item.diff_status バックフィル SQL 実行（Human 運用）"
  - "live 再実行・fetch_plan 変更・crontab 変更"
  - "AIによる --live-rakuten 実行"
  - "apps/web|api|reco / OpenAPI / generated"
  - "secret実値の表示・変更"
  - "親オーケストレータ脚本の変更"

