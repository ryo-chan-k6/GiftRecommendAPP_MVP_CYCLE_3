  - "推奨案の整理（選定観点・段階・Run予算影響の定性）と Human 採択欄"
  - "楽天Fetch運用方針・必要最小の運用手順docs同期"
  - "後続 fetch_plan反映 / 段階収集 Task の着手ゲートを採択結果へ反映"

out_of_scope:
  - "拡大候補の大規模 live 収集実行本体"
  - "定常crontab変更（#1811 / #1818）"
  - "AIによる --live-rakuten 実行"
  - "#1792 / #1607 / GHA楽天live"
  - "MVP 4IDの置き換え"
  - "keyword route 本格常用化"
  - "secret実値の表示・変更"
  - "apps/web|api|reco / OpenAPI / generated"
  - "#1811 / #1818 の Status・本文の完了操作"
  - "ジャンル地図 BFS runner 再実行"

