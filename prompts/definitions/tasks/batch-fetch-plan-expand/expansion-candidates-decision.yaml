  ジャンル地図キャンペーン（#1827）完了により external_genre は 16,537 件。地図は拡大情報源であり MVP 4ID は置き換えない。
  BATCH-003 genre ルートは明示指定 ID のみ（子・孫自動展開なし）。商品データ拡充のため追加候補の Human 採択が必要。
  本Taskは着手ゲート。拡大live収集・#1811 crontab反映は採択後の別Task。

objective: |
  BATCH-002/003 拡大候補（追加ジャンルID・第1波・route優先）を Human Decision Log で明示し、
  楽天Fetch運用方針等の正本docsと矛盾なく同期する。AIは候補と推奨を提示し、採択はHuman。

scope:
