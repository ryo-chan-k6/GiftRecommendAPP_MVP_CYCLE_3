background: |
  Decision 2026-08-04（#1844 / PR #1845）が decided。第1波承認スコープは案B 6ID。
  実行は承認スコープと分離し --genre-ids 常に1本。MVP 4ID維持。BATCH-003優先。
  本Taskは設定/CLI/運用手順への伝播と手動1ジャンル実行手順の正本化。
  定常crontab（#1811/#1818）は変更しない。AIは --live-rakuten しない。

objective: |
  案Bの追加IDと1ジャンル単位実行方針を、local薄いオーケストレータ手順・楽天Fetch運用方針・
  必要最小の実行手順docsへ矛盾なく反映し、Humanが第1波の最初の1IDを安全に起動できる状態にする。

scope:
  - "第1波承認スコープ（案B 6ID）と実行単位（1ジャンル）の運用手順正本化"
  - "BATCH-003優先・BATCH-002はsmoke後必要最小（max_pages=1）の手順記載"
  - "手動実行例（--genre-ids 1本・初回低値smoke推奨・切替ゲート）のdocs化"
  - "楽天Fetch運用方針 §11.6 / local薄いオーケストレータ手順への接続更新"
  - "後続 staged-collect Task の着手条件を明記"

out_of_scope:
  - "拡大 live 収集の実行本体（後続 staged-collect Task・Human）"
  - "定常crontab変更（#1811 / #1818。別Task・Human承認）"
  - "scripts/batch/local_daily_orchestrator.sh / local_weekly_orchestrator.sh の無断変更"
  - "AIによる --live-rakuten 実行"
  - "#1792 / #1607 / GHA楽天live"
  - "MVP 4IDの置き換え"
  - "子・孫ジャンル自動展開の仕様変更"
  - "keyword route 本格常用化"
  - "secret実値の表示・変更"
  - "apps/web|api|reco / OpenAPI / generated"
  - "#1811 / #1818 の Status・本文の完了操作"

