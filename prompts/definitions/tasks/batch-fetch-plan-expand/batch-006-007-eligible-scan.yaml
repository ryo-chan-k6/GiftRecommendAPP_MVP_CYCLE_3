schema_version: "1.0"
definition_type: "task"

task:
  id: "task-batch-fetch-plan-expand-batch-006-007-eligible-scan"
  title: "batch-fetch-plan-expand:BATCH-006/007選定の先頭スキャン上限解消"
  summary: "BATCH-006/007 の DB 選定が先頭最大5000行で止まっていたため、必要件数まで limit を拡張して再読取する。007は歴史的newでitem済みの行を選定スキップする。"
  workstream_key: "batch-fetch-plan-expand"
  phase: "fix"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-fetch-plan-expand:ジャンル地図からのfetch_plan拡大"
  epic_issue_number: 1843
  epic_branch: "chore/epic-1843-batch-fetch-plan-expand"
  related_issues:
    - 1853
    - 1846
  related_prs:
    - 1854

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  第1波 staging→item 反映中に、BATCH-006 が先頭5000の判定済み行だけを見て succeeded=0 になった。
  BATCH-007 も product_diff_result 先頭窓で既反映の歴史的 new を再処理し、未反映コードに届かない。
  DbReader は equals/limit のみのため、OFFSET 追加ではなく limit 拡張再読取で解消する。

objective: |
  自動運用でも未判定・未反映が後ろにあれば次 Run で拾えるように、006/007 の選定スキャンを拡張する。

scope:
  - "product_diff list_eligible_staging のスキャン拡張"
  - "item_apply list_eligible_diffs のスキャン拡張と歴史的 new（item済み）スキップ"
  - "unit test"
  - "親Epic allowed_paths に item_apply / BATCH-007 docs を最小追加"
  - "仕様書の選定スキャン注記（最小）"
  - "Task / Review Definition"

out_of_scope:
  - "DbReader への OFFSET / 範囲演算子追加"
  - "live 再実行・crontab・親シェル変更"
  - "AI --live-rakuten"
  - "apps/web|api|reco / OpenAPI / generated"

input:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-006_商品差分判定バッチ仕様書.md"
      required: true
    - path: "docs/06_実装設計/batch/BATCH-007_Item反映バッチ仕様書.md"
      required: true
  files:
    - path: "apps/batch/src/batch/application/product_diff/repositories.py"
      required: true
    - path: "apps/batch/src/batch/application/item_apply/repositories.py"
      required: true

output:
  docs:
    - path: "docs/06_実装設計/batch/BATCH-006_商品差分判定バッチ仕様書.md"
      action: "update"
      required: true
    - path: "docs/06_実装設計/batch/BATCH-007_Item反映バッチ仕様書.md"
      action: "update"
      required: true
  files:
    - path: "apps/batch/src/batch/application/product_diff/repositories.py"
      action: "update"
      required: true
    - path: "apps/batch/src/batch/application/item_apply/repositories.py"
      action: "update"
