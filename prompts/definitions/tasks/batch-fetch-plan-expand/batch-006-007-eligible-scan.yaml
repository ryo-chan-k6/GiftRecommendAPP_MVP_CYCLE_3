    - path: "apps/batch/tests/unit/application/test_item_apply.py"
      action: "update"
      required: true
    - path: "prompts/definitions/epics/batch-fetch-plan-expand/epic.yaml"
      action: "update"
      required: true
    - path: "prompts/definitions/tasks/batch-fetch-plan-expand/batch-006-007-eligible-scan.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-fetch-plan-expand/batch-006-007-eligible-scan/pr-review.yaml"
      action: "create"
      required: true

deliverables:
  - "006/007 選定スキャン拡張"
  - "unit test"
  - "仕様注記・Epic allowed_paths・Task/Review Definition"

acceptance_criteria:
  - "先頭 PAGE が判定済みでも後ろの未判定を拾う unit が通る"
  - "歴史的 new（item済み）を飛ばして未反映 new を拾う unit が通る"
  - "test_product_diff.py / test_item_apply.py が通過する"
  - "AI live / crontab / 親シェル変更がない"
