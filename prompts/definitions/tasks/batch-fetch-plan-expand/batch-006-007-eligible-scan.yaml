    - "歴史的 new スキップが updated/unchanged を誤って落とさないか"
    - "親Epic allowed_paths が最小か"
    - "secret実値がないか"

human_decision_points:
  - "親Epic allowed_paths への item_apply 追加承認"
  - "将来 DbReader に keyset/OFFSET を入れるか（別Task）"

stop_conditions:
