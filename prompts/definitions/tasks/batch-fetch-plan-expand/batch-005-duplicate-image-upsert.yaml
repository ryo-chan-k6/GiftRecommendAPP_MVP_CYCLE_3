  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  第1波1ジャンル手動 Item Run で BATCH-005 が partially_succeeded（55 ok / 5 failed）。
  失敗は `ON CONFLICT DO UPDATE command cannot affect row a second time`（GRS-BAT-001）。
  staging_item_image UNIQUE は (raw_metadata_id, external_item_code, image_url) で size_type を含まない。
  transform が medium/small を別行展開し同一 URL が両方にあると、同一 INSERT 文内で conflict key が重複する。
  テーブル定義書は「同一 Raw 内の同一商品・同一 URL は 1 行」。運用ブロッカー解消のため raw_staging 関連 path を親Epicへ最小追加する。

objective: |
  BATCH-005 が楽天 Raw の同一 image_url 重複でも Staging upsert を完走できるようにする。

scope:
  - "raw_staging transform: 同一商品・同一 image_url を 1 行に正規化（medium 優先）"
  - "upsert_staging_item_images の防御的 dedupe"
  - "validate: duplicate image_url を GRS-VAL-006 として検知（transform 後の不変条件）"
  - "関連 unit test の追加"
  - "親Epic allowed_paths への raw_staging 関連 path 最小追加"
  - "Task / Review Definition 整備"

out_of_scope:
  - "UNIQUE キーへ image_size_type を追加する DDL 変更（Human判断・別Task）"
  - "BATCH-005 仕様書本文の全面改訂"
  - "live 再実行・fetch_plan 変更・crontab 変更"
  - "Ranking Run"
  - "AIによる --live-rakuten 実行"
  - "apps/web|api|reco / OpenAPI / generated"
  - "secret実値の表示・変更"

