      required: true
    - path: "apps/batch/src/batch/application/raw_staging/validate.py"
      required: true
    - path: "apps/batch/tests/unit/application/test_raw_staging.py"
      required: true

output:
  docs: []
  files:
    - path: "apps/batch/src/batch/application/raw_staging/transform.py"
      action: "update"
      required: true
    - path: "apps/batch/src/batch/application/raw_staging/repositories.py"
      action: "update"
      required: true
    - path: "apps/batch/src/batch/application/raw_staging/validate.py"
      action: "update"
      required: true
    - path: "apps/batch/tests/unit/application/test_raw_staging.py"
      action: "update"
      required: true
    - path: "prompts/definitions/epics/batch-fetch-plan-expand/epic.yaml"
      action: "update"
      required: true
    - path: "prompts/definitions/tasks/batch-fetch-plan-expand/batch-005-duplicate-image-upsert.yaml"
      action: "create"
      required: true
    - path: "prompts/definitions/reviews/batch-fetch-plan-expand/batch-005-duplicate-image-upsert/pr-review.yaml"
      action: "create"
      required: true

deliverables:
  - "BATCH-005 image_url 重複の正規化と防御的 dedupe"
  - "unit test 追加"
  - "親Epic allowed_paths 最小拡張"
  - "Task / Review Definition"

acceptance_criteria:
  - "同一 URL が medium/small 両方にある Raw でも staging 成功"
  - "同一配列内の重複 URL でも staging 成功（先勝ち・medium優先）"
  - "upsert rows の conflict key が同一文内で一意"
  - "test_raw_staging.py が通過する"
  - "親Epic allowed_paths 拡張が raw_staging 関連に限定されている"
  - "AI live / crontab / 親シェル変更がない"
  - "secret実値がない"
  - "PR target が親Epic Branch"

