task:
  id: "task-batch-fetch-plan-expand-batch-005-duplicate-image-upsert"
  title: "batch-fetch-plan-expand:BATCH-005同一image_url重複upsert修正"
  summary: "第1波手動Item RunでBATCH-005が同一image_urlの多重ON CONFLICTによりpartially_succeededしたため、medium優先の1URL=1行正規化で止血する。live再実行・DDL変更は含まない。"
  workstream_key: "batch-fetch-plan-expand"
  phase: "fix"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-fetch-plan-expand:ジャンル地図からのfetch_plan拡大"
  epic_issue_number: 1843
  epic_branch: "chore/epic-1843-batch-fetch-plan-expand"
  related_issues:
    - 1846
    - 1844
    - 1849
  related_prs: []

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
    blocked: null

agent:
  primary: "worker-ai"
  support:
