    - "support-ai"
    - "test-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  Epic #789 配下のフェーズ Wiring Task である。MOD-RECO-001 モジュール仕様書 §8.4 に従い、各モジュール implementation Task 完了後に `recommendation-orchestrator/stubs.py` の `build_default_stub_ports()` で Retrieval フェーズ Port を本実装へ差し替える。
  MOD-RECO-011 は廃止され Pre Hard Filter は MOD-RECO-012 内部に統合済み。Orchestrator Port コンテナは pre_hard_filter / candidate_retriever / post_hard_filter の 3 スロットを維持するため、pre_hard_filter Port の配線方針は Human Review で確定する（§8.4.2 は 012〜013 を Retrieval 対象とする）。
  `StubXxx` クラスは削除せず、失敗注入・明示 DI テスト用に残す（§8.4.1）。
  起動フェーズ（002 / 003）および User Meaning フェーズ（004〜010）は変更しない。
  `stubs.py` は `exclusive_files` のため、本 Task は Epic 配下で直列実行する。

objective: |
  Retrieval フェーズ Port（pre_hard_filter / candidate_retriever / post_hard_filter）を `build_default_stub_ports()` で本実装 factory に差し替え、Orchestrator デフォルト経路が MOD-RECO-012 / MOD-RECO-013 を参照する状態にする。
  デフォルト経路テストの期待値更新は後続 integration-test Task に委譲する。

scope:
  - "`apps/reco/src/reco/application/recommendation-orchestrator/stubs.py` の Retrieval フェーズ Port 差し替え"
  - "対象 Port: pre_hard_filter, candidate_retriever, post_hard_filter"
  - "各モジュールの `build_default_*` factory（in-memory MVP composition）の import と `_ensure_*` パッケージ読み込み（002 / 003 / User Meaning と同パターン）"
  - "必要に応じた `recommendation-orchestrator/__init__.py` の export 整理（epic_scope 内）"

out_of_scope:
  - "MOD-RECO-012 / MOD-RECO-013 モジュール本体の変更"
  - "起動フェーズ（002 / 003）の再配線"
  - "User Meaning フェーズ（004〜010）の再配線"
  - "Matching 以降フェーズの Port 差し替え"
  - "`StubXxx` クラスの削除"
  - "Orchestrator デフォルト経路テストの期待値更新（integration-test Task）"
  - "Orchestrator 本体の Port 数・呼び出し順変更"
  - "段階3 Composition 完成（本番 DI / DB Repository）"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema 変更"

