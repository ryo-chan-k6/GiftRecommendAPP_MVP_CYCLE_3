  - "StubPipelineModule（012 / 013 相当）の参照が build_default_stub_ports() から除去されている"
  - "StubXxx クラス定義は残存している"
  - "起動フェーズ（002 / 003）および User Meaning フェーズ（004〜010）の配線に変更がない"
  - "MOD-RECO-012 / MOD-RECO-013 モジュール本体ディレクトリに変更がない"
  - "Matching 以降フェーズの StubPipelineModule 参照に変更がない"
