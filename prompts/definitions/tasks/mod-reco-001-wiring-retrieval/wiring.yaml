  not_required:
    - "integration test（E2E）"
  skip_reason:
    "integration test（E2E）": "段階3 Composition 完成 Task の範囲"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "stubs.py の変更が Retrieval フェーズ Port に限定されているか"
    - "モジュール本体（MOD-RECO-012 / MOD-RECO-013）への変更が混入していないか"
    - "StubXxx クラスが削除されていないか"
    - "起動・User Meaning フェーズの配線が維持されているか"
    - "011 廃止後 pre_hard_filter Port 配線が §8.4 と矛盾しないか"
    - "factory 選択（build_default_*）が各モジュール __init__.py の公開 I/F と一致しているか"
    - "exclusive_files（stubs.py）の直列化方針に反していないか"
    - "Task PR target が Epic Branch であるか"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: false

