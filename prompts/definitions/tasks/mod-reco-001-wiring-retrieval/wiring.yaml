    - path: "apps/reco/src/reco/application/recommendation-orchestrator/ports.py"
      required: true
      purpose: "Port 名・PipelineModulePort 契約"
    - path: "apps/reco/src/reco/application/candidate-retriever/__init__.py"
      required: true
      purpose: "MOD-RECO-012 factory 参照"
    - path: "apps/reco/src/reco/application/post-hard-filter-executor/__init__.py"
      required: true
      purpose: "MOD-RECO-013 factory 参照"
  issues:
    - number: 789
      purpose: "親 Epic"
    - number: 260
      purpose: "親 Epic（MOD-RECO-001:Recommendation Orchestrator）"
  prs: []

output:
