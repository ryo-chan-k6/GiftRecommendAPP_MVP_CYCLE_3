  title: "MOD-RECO-001:Orchestrator Wiring（Retrieval）配線"
  summary: "Retrieval フェーズ（MOD-RECO-012 / MOD-RECO-013）について、`build_default_stub_ports()` の該当 Port を本実装へ差し替え、MVP デフォルト composition の参照先を更新する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]MOD-RECO-001:Orchestrator Wiring（Retrieval）"
  epic_issue_number: 789
  epic_branch: "feature/epic-789-mod-reco-001-wiring-retrieval"
  related_issues:
    - number: 260
      purpose: "親 Epic（MOD-RECO-001:Recommendation Orchestrator）"
    - number: 871
      purpose: "MOD-RECO-012 implementation Task 完了"
    - number: 879
      purpose: "MOD-RECO-013 implementation Task 完了"
  related_prs: []

commands:
  primary: "/work-issue"
  allowed:
    - "/work-issue"
    - "/create-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: "/fix-review-comments"
