background: |
  Phase1 ① API契約仕様書（1a）として、API-PUB-007（Semantic設定取得 / Public API）の契約面（Request / Response / Error / Validation / 互換性 / OpenAPI 反映方針）を確定する。
  本 API は web（レコメンド条件入力画面）向けに現行 Semantic Config Version のスナップショット（Semantic Concept / Feature Definition）を返す。
  Master Repository・MOD-API-011/012 連携・内部 DTO マッピングは本 Task の対象外とし、`api-implementation-spec.yaml` で Phase4 実装設計時に作成する。

objective: |
  API-PUB-007（Semantic設定取得 / Public API、`GET /api/v1/masters/semantic-configs`）について、Contract Gate および後続 OpenAPI Contract Task の入力となる API 契約仕様書を作成する。
  成果物は prompts/templates/docs/api-contract-spec.md に準拠し、契約面のみを記載する。
  OpenAPI / Orval / generated の実ファイル変更は後続 Contract Task へ分離する。

scope:
  - "API-PUB-007 の API 契約仕様書を新規作成する（成果物: API-PUB-007_Semantic設定取得API契約仕様書.md）"
  - "API基本情報（API ID / Public / GET / Endpoint / Provider / Consumer / 認証 / 冪等性 / MVP対象）を定義する"
  - "Request Header / Path / Query / Body（なし）を整理する"
  - "Response Body（Semantic Config スナップショット: semanticConfigVersionId / semanticConcepts / featureDefinitions）を整理する"
  - "Error Response仕様（GRS-CFG-* / GRS-DB-* / GRS-REQ-*）を整理する"
  - "空配列・current Version 未設定の HTTP Status 方針を明示する"
  - "OpenAPI / Orval / generated 反映方針を整理する（方針のみ）"
  - "API-PUB-008 との semanticConfigVersionId 整合方針を整理する"
  - "互換性・契約面テスト観点を整理する"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
  - "API実装仕様書（api-implementation-spec.yaml）の作成"
  - "OpenAPI定義ファイルの作成・更新"
  - "Orval設定・generated の再生成"
  - "apps/api / apps/web / apps/reco の実装"
  - "API-PUB-008 の仕様書作成（別 Task #404）"
  - "pair_rule / semantic_rule / feature_normalization_version の Public 返却"
  - "DB schema 変更"

