background: |
  Phase4b 縦串の 2/3（apps/api 実装）。前提: 実装仕様書 #1188 / PR #1189 が親 Epic Branch に merge 済み。
  PUB-005/006 で `createMastersRouter` が存在する。本 Task は `GET /semantic-configs` を追加する。
  current Version 解決 + Concept / Feature Definition スナップショット組立。網羅 UT は後続 Task。

objective: |
  `GET /api/v1/masters/semantic-configs` を契約・OpenAPI・実装仕様書に沿って提供する。
  MOD-API-011/012、Version 解決、Concept/Feature 読取、エラー境界、metric を実装する。

scope:
  - "`apps/api/src/app/masters/**` に Semantic Config 用 Controller / Repository を追加"
  - "`createMastersRouter` に `GET /semantic-configs` を追加"
  - "current Version 解決（is_active → is_current → JOIN config_name）"
  - "Concept 0 件 200 / current なし GRS-CFG-001 / Feature 0 件 GRS-CFG-006"
  - "未知 Query で 400 GRS-REQ-001"
  - "masters_semantic_configs_* metric"
  - "最小スモーク単体テスト"
  - "Task / Review Definition"

out_of_scope:
  - "OpenAPI / Orval / generated 変更"
  - "apps/web / apps/reco 変更"
  - "契約・実装仕様書 docs の変更"
  - "DB schema / migration / seed 変更"
  - "API-PUB-005 / 006 / 008 の機能追加（既存破壊は禁止）"
  - "網羅 UT（Phase4b 3/3）"
  - "PUB-008 との Repository 共通化（推奨のみ）"

