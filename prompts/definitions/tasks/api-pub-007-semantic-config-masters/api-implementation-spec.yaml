background: |
  Phase4b 縦串の 1/3（実装面仕様書）。契約面は `API-PUB-007_Semantic設定取得API契約仕様書.md`（#403 / PR #407）を正とする。
  OpenAPI 断片（#426 / PR #427）および Semantic / Feature 定義系テーブル定義書は develop 反映済み。
  本 Task は契約・OpenAPI・DB schema を変更せず、apps/api の MOD-API-011 / MOD-API-012 実装 Task が参照可能な **実装面のみ** を整理する。
  Provider は apps/api（既存 `apps/api/src/app/masters/**` を拡張）、Consumer は apps/web（SCR-002）。
  PUB-005 / PUB-006 で masters Router が存在する。本 API は current Version 解決 + Concept / Feature Definition スナップショット組立であり、単純一覧マスタより処理が重い。
  レーン4第2波（並列計画）。Epic Branch は develop 同期済みを前提とする。構造の参考は api-pub-006-occasion-masters/api-implementation-spec.yaml。

objective: |
  API-PUB-007（Semantic設定取得 / Public API）について、apps/api masters 実装 Task / 単体テスト Task が参照可能な粒度の **API実装仕様書（実装面のみ）** を新規作成する。
  成果物は prompts/templates/docs/api-implementation-spec.md に準拠し、契約面の章は再掲しない。
  Express Router 拡張、MOD-API-011/012 責務、current Version 解決（親 is_active → 子 is_current）、Concept / Feature Definition 読取、Response 組立、エラー境界、metric を明記する。

scope:
  - "API-PUB-007 の API実装仕様書を新規作成する（API-PUB-007_Semantic設定取得API実装仕様書.md）"
  - "前提契約・OpenAPI / Contract Gate / 関連テーブル定義を整理する"
  - "実装方針（masters Router 拡張 / MOD-API-011 / MOD-API-012 / request-meta / DI）を整理する"
  - "処理フロー（Mermaid）と処理詳細を整理する（meta → current Version 解決 → Concept/Feature 読取 → Response）"
  - "DB 列 → Public Response（configName / versionLabel / semanticConcepts / featureDefinitions）のマッピングを整理する"
  - "内部 UUID（semantic_config_version_id 等）および semantic_rule / pair_rule を Public に含めない方針を明記する"
  - "Concept 0 件は 200、current なしは GRS-CFG-001、Feature 0 件は GRS-CFG-006 の境界を整理する"
  - "未知 Query は 400 GRS-REQ-001（契約）の実装面を整理する"
  - "generated client 利用方針（記載のみ）"
  - "provider / consumer 実装影響を整理する"
  - "エラーマップ・trace・masters_semantic_configs_* metric を整理する"
  - "実装結合テスト観点・未決事項を明記する"

out_of_scope:
  - "API-PUB-005 / 006 / 008 の実装仕様書作成・変更"
  - "契約面章の再掲・契約仕様書の変更"
  - "OpenAPI / Orval / generated 変更"
  - "apps/api / apps/web / apps/reco の実装"
  - "DB schema / migration / seed 変更"
  - "認証・認可方式そのものの変更"
  - "画面仕様書の作成"

