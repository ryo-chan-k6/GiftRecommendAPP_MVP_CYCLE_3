    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: false
      purpose: "Item 表面フィールド（itemName / catchcopy / itemCaption 等）の由来を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: false
      purpose: "IF-PUB-003 の入出力概要を確認するため"
    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: false
      purpose: "Public API の認証要否・権限条件を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: false
