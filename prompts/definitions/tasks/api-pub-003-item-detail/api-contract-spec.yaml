background: |
  Phase1 ① API契約仕様書（1a）として、API-PUB-003（商品詳細取得 / Public API）の契約面（Request / Response / Error / Validation / 互換性 / OpenAPI 反映方針）を確定する。
  実装フェーズ実行プロセス設計書 §4.1（分離後モデル）に従い、Item 参照 Repository・MOD-API 連携・内部 DTO マッピング・結合テスト観点などの実装面は本 Task の対象外とし、`api-implementation-spec.yaml` で Phase4 実装設計時に作成する。
  本 API は Item / Item Image / External Item Reference / Popularity Signal を Public 向け表面化する。Feature / Embedding 等の内部推薦データは返却しない（API設計方針書 §18.4 準拠）。

objective: |
  API-PUB-003（商品詳細取得 / Public API、`GET /api/v1/items/{itemId}`）について、Contract Gate および後続 OpenAPI Contract Task の入力となる API 契約仕様書を作成する。
  成果物は prompts/templates/docs/api-contract-spec.md に準拠し、契約面のみを記載する（api-implementation-spec.md の章は含めない）。
  OpenAPI / Orval / generated の実ファイル変更は後続 Contract Task へ分離する。

scope:
  - "API-PUB-003 の API 契約仕様書を新規作成する（成果物: API-PUB-003_商品詳細取得API契約仕様書.md）"
  - "API基本情報（API ID / API種別 Public / Method GET / Endpoint /api/v1/items/{itemId} / Base URL / Version / Provider apps/api / Consumer apps/web / 認証要否 / 冪等性 / MVP対象）を定義する"
  - "Request Header / Path Parameters（itemId）/ Query Parameters / Request Body（なし）を整理する"
  - "Response Header / Status Code / Response Body（Item 表面・画像・外部 EC URL・レビュー情報等）を整理する"
  - "Error Response仕様（GRS-ITM-* / GRS-DB-* / GRS-REQ-* 等）を整理する"
  - "商品不存在時 404（GRS-ITM-001）方針を明示する（API一覧 §API-PUB-003）"
  - "バリデーション仕様を整理する"
  - "OpenAPI / Orval / generated 反映方針（packages/contracts/openapi/public-api.yaml、apps/web/src/generated/api/ 再生成）を整理する（方針のみ。ファイル変更は out_of_scope）"
  - "API-PUB-002 Response `items[]` とのフィールド整合方針を整理する"
  - "互換性・破壊的変更・契約面テスト観点を整理する"
  - "未決事項・人間判断が必要な事項を明記する"

out_of_scope:
  - "API実装仕様書（api-implementation-spec.md 準拠）の作成（prompts/definitions/tasks/api-pub-003-item-detail/api-implementation-spec.yaml）"
  - "処理概要（MOD-API-* / Item 参照 Repository の詳細フロー）・内部 DTO マッピング・provider/consumer 実装影響の詳細・結合テスト観点の確定"
  - "apps/reco（MOD-RECO-022 Result Snapshot Builder 等）の設計・実装"
  - "OpenAPI定義ファイル（packages/contracts/openapi/public-api.yaml 等）の作成・更新"
  - "Orval設定ファイル（orval.config.ts）の作成・更新"
  - "generated API client（apps/web/src/generated/api/）の再生成"
  - "apps/api の実装"
  - "apps/web の実装（画面側 SCR-006 等）"
  - "apps/batch の実装"
  - "DB schema 変更"
  - "DDL 作成・変更"
  - "認証・認可方式そのものの変更"
  - "API一覧全体の再設計"
  - "Item Feature / Item Embedding の Public 返却"
  - "画面仕様書（SCR-006 等）の作成"
  - "他 API（API-PUB-001 / 002 / 004〜008 / API-INT-*）の仕様書作成"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/api/API設計方針書.md"
      required: true
      purpose: "URL 設計、HTTP Method、認証、エラー形式、Response 構造（data/meta）、Public 返却禁止項目等を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "API-PUB-003 の endpoint、API種別、Provider、Consumer、MVP対象、関連画面、関連リソース、関連エラーコードを確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
      purpose: "Error Response、HTTP Status、GRS-ITM-* / GRS-DB-* エラーコード参照、ユーザー向け表示方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/database/正本定義表.md"
      required: true
      purpose: "Item / Item Image / Item Review Summary / Item Popularity Signal / External Item Reference の正本関係を確認するため"
