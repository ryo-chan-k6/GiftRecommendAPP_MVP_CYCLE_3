  summary: "API-PUB-003（商品詳細取得 / Public API、GET /api/v1/items/{itemId}）の API 契約仕様書（API-PUB-003_商品詳細取得API契約仕様書.md）を、api-contract-spec.md 準拠で作成する。実装面は別 Task（api-implementation-spec.yaml）へ分離する。"

