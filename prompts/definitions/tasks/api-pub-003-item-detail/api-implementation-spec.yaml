background: |
  Phase4b 縦串の 1/3（実装面仕様書）。PUB-004 は develop merge 済み（#1260）。
  契約面は `API-PUB-003_商品詳細取得API契約仕様書.md`（#399 / PR #405）を正とする。
  OpenAPI（#416 / PR #417）および item / item_image / item_review_summary / item_popularity_signal 等のテーブル定義は develop 反映済み。
  本 Task は契約・OpenAPI・DB schema を変更せず、apps/api の `apps/api/src/app/items/**` 実装 Task が参照可能な **実装面のみ** を整理する。
  Provider は apps/api、Consumer は apps/web（SCR-006 / 結果一覧）。
  モジュール一覧に Item Detail 専用 MOD-ID が未記載のため、実装仕様書では論理モジュール名を定義し、MOD-ID 正式割当は Human 判断（§未決）とする。
  レーン 5。Epic Branch は develop 同期済みを前提とする。

objective: |
  API-PUB-003 の API実装仕様書（実装面のみ）を新規作成し、後続 apps/api 実装 / UT Task の入力とする。
  Express Router、Item Detail Controller / Repository、item 系 JOIN 読取、active 判定（422）、エラー境界、metric を明記する。

scope:
  - "API-PUB-003_商品詳細取得API実装仕様書.md を新規作成する"
  - "前提契約・OpenAPI / Contract Gate / item 系テーブル定義を整理する"
  - "実装方針（items Router / Controller / Repository / request-meta / DI）を整理する"
  - "処理フロー（Mermaid）と処理詳細（Path 検証 → Item 読取 → active 判定 → 画像/レビュー/人気バッジ組立 → Response）"
  - "DB 列 → Public Response マッピング（Feature/Embedding 非公開）を整理する"
  - "404 GRS-ITM-001 / 422 GRS-ITM-002 / 画像なし 200 / 未知 Query 400 GRS-REQ-001 を整理する"
  - "item_detail_request_count / item_not_found_count 等 metric を整理する"
  - "generated client 利用方針（記載のみ）"
  - "provider / consumer 実装影響・結合テスト観点・未決事項を明記する"
  - "Task / Review Definition"

out_of_scope:
  - "契約面再掲・契約仕様書変更"
  - "OpenAPI / Orval / generated 変更"
  - "apps/api / apps/web / apps/reco の実装"
  - "DB schema / migration / seed 変更"
  - "モジュール一覧への MOD-ID 追加の確定（Human 判断。案を未決に記載可）"
  - "画面仕様書（SCR-006）の作成"
  - "API-PUB-004 等の変更"

