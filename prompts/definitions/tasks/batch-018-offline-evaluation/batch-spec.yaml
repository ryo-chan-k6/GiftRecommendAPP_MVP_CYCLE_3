background: |
  Phase4b 評価・改善系。Epic #1514 bootstrap 済み。MVP △ だが Human により scaffold-first 縦串着手承認済み。
  物理書込 IF = IF-DB-BATCH-018（evaluation_run / evaluation_result / evaluation_metric INSERT）。
  推薦実行 IF = IF-SHARED-004（MVP scaffold は mock。実 HTTP は後続）。
  API-INT-002 は契約変更なしで消費可能な場合のみ。Contract Gate 不要。
  一覧の evaluation_run_log は物理なし → evaluation_run + batch_run_log / phase_log に読み替え。
  Run は毎回新規 INSERT（非冪等）。Result UNIQUE (run, case)、Metric UNIQUE (result, metric_name)。INSERT のみ・UPDATE なし。
  モジュール: MOD-BATCH-039 / 040 / 041。042〜044 は out of scope。
  workflow: 独立子 batch-offline-evaluation.yml。週次親接続は後続。
  Dataset/Case 本番 seed は別 Task。UT fixture 可。
  §18.2 残未決なし（Human: 推奨案採用 → §18.1 No.16〜20）。
objective: |
  BATCH-018 バッチ仕様書を作成し、後続実装・UT の入力正本とする。

