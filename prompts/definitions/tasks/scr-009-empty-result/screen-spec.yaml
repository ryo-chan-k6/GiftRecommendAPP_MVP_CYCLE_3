  summary: "SCR-009（0件結果表示）の画面仕様書（SCR-009_0件結果表示画面仕様書.md）を、画面一覧・画面遷移図・SCR-002/003画面仕様書・API-PUB-002契約・デザインルール（ST-EMPTY）・UIコンポーネント一覧に基づいて作成する。"

