      required: true
      purpose: "ST-EMPTY パターンを確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/UIコンポーネント一覧.md"
      required: true
      purpose: "EmptyState（UI-033）等の部品責務を確認するため"
    - path: "docs/06_実装設計/web/SCR-004_レコメンド結果一覧画面画面仕様書.md"
      required: false
      purpose: "0件時に SCR-004 へ来ない設計逸脱検知方針を確認するため"
  templates:
