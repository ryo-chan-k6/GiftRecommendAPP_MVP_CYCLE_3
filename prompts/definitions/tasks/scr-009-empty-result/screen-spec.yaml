background: |
  06_実装設計において、web 実装の前提となる画面仕様書を作成する。
  SCR-009 は独立 URL 画面ではなく、SCR-002 推薦実行成功・0件時の UI 状態として扱う（Human 確定: MVP 宿主は recommendation-input の phase=empty）。
  既存実装: RecommendationInputPage + EmptyState + EMPTY_RESULT_MESSAGE + 「条件を変更する」ボタン。
  #1344 / #1345 で resultStatus=empty の API 経路は修正 merge 済み。本 Task で正本仕様を固定する。

objective: |
  SCR-009（0件結果表示）について、実装・レビューが可能な粒度の画面仕様書を作成する。
  作成する仕様書は prompts/templates/docs/screen-spec.md に準拠する。

scope:
  - "SCR-009 の画面仕様書を新規作成する（成果物: SCR-009_0件結果表示画面仕様書.md）"
  - "画面目的・対象ユーザー・表示項目（0件メッセージ・条件緩和提案・復帰ボタン）を整理する"
  - "画面状態であること（独立 URL ではないこと）と遷移元（SCR-003）・遷移先（SCR-002）を整理する"
  - "MVP 宿主（recommendation-input phase=empty）と ST-EMPTY / EmptyState（UI-033）との対応を整理する"
  - "API-PUB-002 0件正常系（resultStatus=empty / GRS-REC-001）との対応を整理する"
  - "専用 `/recommendations/{result_id}` route 新設が MVP out of scope であることを明示する"
  - "再検索ボタン（画面一覧 △）の MVP 扱いを明記する（Human Review 観点）"
  - "画面遷移図（結果一覧の状態）と MVP 宿主（recommendation-input）の解釈差を整理する"

out_of_scope:
  - "他画面（SCR-009 以外）の画面仕様書作成"
  - "専用 0件用 URL route の新設・実装"
  - "SCR-008 の包括仕様（遷移先言及のみ）"
  - "SCR-004 の本仕様変更（0件時に SCR-004 へ来ないことの言及に留める）"
  - "SCR-005 / SCR-007 の変更"
  - "OpenAPI / generated / ソースコード実装"
  - "API-PUB-002 契約・実装の変更"
  - "認証・認可方式そのものの変更"

