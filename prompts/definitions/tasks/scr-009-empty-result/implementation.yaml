  title: "SCR-009:0件結果表示実装"
  summary: "SCR-009 0件結果表示を実装し、RecommendationEmptyPanel 抽出・トップへ戻る導線・component テストで検証する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]SCR-009:0件結果表示"
  epic_issue_number: 1382
  epic_branch: "feature/epic-1382-scr-009-empty-result"
  related_issues:
    - number: 1382
      purpose: "親 Epic"
    - number: 1384
      purpose: "前提 Task（画面仕様書）"
    - number: 1386
      purpose: "本 Task Issue"
  related_prs:
    - number: 1385
      purpose: "画面仕様書 Task PR（親 Epic Branch merge 済み）"

commands:
  primary: "/start-task"
  allowed:
    - "/start-task"
    - "/work-issue"
    - "/create-pr"
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    success: "/work-issue"
    review_fix: "/fix-review-comments"
    blocked: null

