background: |
  Humanゲート 2026-08-01-local-batch-orchestrator-gate で、local薄いオーケストレータ導入が decided。
  楽天HTTP liveは登録egress IPのlocalのみ（GHA禁止）。実行制御の正本はGHA親だが、楽天本線はlocalで回す必要がある。
  本Taskは設計・運用手順の正本化のみ。シェル実装は後続 local-orchestrator-impl。

objective: |
  GHA daily/weekly/manual の needs・排他・Run ID伝播・失敗停止をlocal親シェルで再現するための
  要件・対応表・運用手順をdocsに残し、後続実装Taskの入力を確定する。

scope:
  - "Phase1再現範囲の明文化（BATCH-001〜004中心。必要なら005〜008。009〜015は含めない）"
  - "GHA親/複合子（needs・concurrency・pipeline_batch_run_id）とlocal親シェルの対応表"
  - "排他（本線flock＋楽天live横断1本）、失敗時後続停止、再開単位、観測（ログ/DB）の要件"
  - "egress照合・明示live・QPS=2・secret非記載の安全要件を運用手順へ反映"
  - "crontab例と「実登録はHuman」境界の明記"
  - "後続 local-orchestrator-impl / #1801 への引き渡し条件の明記"
  - "必要最小の楽天Fetch運用方針・ギャップdocs同期（設計範囲に限る）"

out_of_scope:
  - "親シェル実装本体（後続 local-orchestrator-impl）"
  - "local継続収集の実行本体（#1801）"
  - "実crontab登録・PC常時起動設定（Human）"
  - "Airflow / Prefect 等の本格ジョブ基盤導入"
  - "#1792 schedule有効化"
  - "#1607 / GHA楽天live"
  - "常用QPS=2の再改訂"
  - "secret実値の表示・変更"
  - "OpenAPI / generated / apps/web|api|reco"
  - "親orchestrator workflowのscheduleコメント解除"

