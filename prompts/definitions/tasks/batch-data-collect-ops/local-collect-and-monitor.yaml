  追加ゲート: 2026-08-01-local-batch-orchestrator-gate。
  local薄いオーケストレータは design #1803 / PR #1805 および impl #1804 / PR #1806 が
  親Epic Branchへ MERGED 済みのため、本Taskの収集実行は着手可。
