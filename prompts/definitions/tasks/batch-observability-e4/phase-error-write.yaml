  epics:
    - issue: 1636
      purpose: "親 Epic"
  issues:
    - issue: 1699
      purpose: "Wave 1 run-log-write"
    - issue: 1697
      purpose: "Wave 0 inventory"
  blocking: false

contract_gate:
  required: false

parallel_control:
  exclusive_files:
    - "apps/batch/src/batch/application/observability/**"
    - "apps/batch/src/batch/application/genre_sync/repositories.py"
    - "apps/batch/src/batch/application/genre_sync/__main__.py"
    - "apps/batch/tests/unit/application/test_phase_error_writers.py"
    - "docs/05_アプリケーション設計/アプリ/batch/バッチ観測横断・本実装ギャップ一覧.md"
  conflict_risk: "medium"
  db_impact: true

test_policy:
  required:
    - "unit test"
    - "secret check"
    - "real DB connectivity verify"
  not_required:
