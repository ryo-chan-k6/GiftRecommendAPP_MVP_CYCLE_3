    - "production unapproved live"
  skip_reason:
    "CI default live": "security 方針により禁止"
    "production unapproved live": "禁止"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "DDL phase_name CHECK と app phase マッピングが正しいか（Human Review 対象）"
    - "UUID 必須・error_code 形式・secret strip"
    - "factory 切替が create_job_run_tracker 同型か"
    - "代表 CLI 1 本のみで Wave 4 全配線が混入していないか"
    - "MOD-RECO-028/029 を使っていないか"
    - "DDL 変更が混入していないか"
    - "secret / URL 実値がログ・UT・docs に出ないか"
    - "ギャップ一覧の Wave 2 進捗が事実か"
  specialist_reviews:
    docs: true
    test: true

notes:
  - "Issue #1701 / Branch feature/task-1701-batch-observability-e4-phase-error-write"
  - "MVP マッピング: plan→batch_started / finalize→batch_completed（Human Review 観点）"
  - "DDL error_code regex は ^GRS-[A-Z]{3}-[0-9]{3}$（{2,4} ではない）"
  - "commit / push / PR は親指示に従う"
