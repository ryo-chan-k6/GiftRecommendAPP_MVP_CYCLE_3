    - "apps/batch/src/batch/application/genre_sync/__main__.py"
    - "apps/batch/tests/unit/application/test_job_run_tracker.py"
    - "docs/05_アプリケーション設計/アプリ/batch/バッチ観測横断・本実装ギャップ一覧.md"
  conflict_risk: "medium"
  db_impact: true

test_policy:
  required:
    - "unit test"
    - "secret check"
    - "real DB connectivity verify"
  not_required:
