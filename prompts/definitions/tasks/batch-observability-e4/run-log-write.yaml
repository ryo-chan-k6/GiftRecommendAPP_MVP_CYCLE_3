    - "UUID 必須・terminal complete 制約"
    - "factory 切替が resolve_job_db_writer 同型か"
    - "代表 CLI 1 本のみで Wave 4 全配線が混入していないか"
    - "secret / URL 実値がログ・UT・docs に出ないか"
    - "ギャップ一覧の Wave 1 進捗が事実か"
  specialist_reviews:
    docs: true
    test: true

notes:
