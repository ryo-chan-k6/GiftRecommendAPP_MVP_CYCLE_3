  - "genre_sync 代表配線（UUID + genre_search）"
  - "UT"
  - "実 DB 疎通結果（または skip 理由）"
  - "ギャップ一覧 Wave 3 進捗"

acceptance_criteria:
  - "api_call_log へ source=rakuten / source_api=genre_search で INSERT できる"
  - "非 UUID api_call_log_id / batch_run_id を明確な例外で拒否する"
  - "不正 source_api / call_status を拒否する"
  - "request_params から Authorization / api_key 等を除去する"
  - "create_api_call_log_writer が scaffold / postgres を切り替える"
  - "genre_sync の api_call_log_id が UUID である"
  - "writers 無 or bind 前は in-memory のみ"
  - "001〜017 全配線を含まない"
  - "Embedding / source CHECK 拡張を含まない"
  - "DDL 変更を含まない"
  - "実 DB 疎通結果が報告される（secret なし）または skip 理由明示"
  - "ギャップ一覧に Wave 3 / §8.2 Must 実施中が記載されている"
  - "Related to（Closes 禁止）/ PR target が親 Epic Branch"

