  title: "batch-observability-e4:api_call_log本配線"
  summary: "Wave 3。IF-DB-BATCH-002 / MOD-BATCH-046 として api_call_log を DbWriter 経由で Postgres 本配線し、代表 CLI genre_sync に配線する。"

work_mode: "ai-agent"

parent:
  epic_issue: "[Epic]batch-observability-e4:観測横断本実装"
  epic_issue_number: 1636
  epic_branch: "feature/epic-1636-batch-observability-e4"
