    - "test-ai"
    - "docs-reviewer-ai"

background: |
  Wave 1（#1699）で batch_run_log、Wave 2（#1701）で phase_log / error_log 本配線済み。
  api_call_log は genre_sync の in-memory のみ。PK は uuid だが現行 id は api_{hex} 形式で
  Postgres 非互換。DDL source CHECK は rakuten のみ（Embedding は対象外）。
  §8.2 Human 確定: Must。

objective: |
  PostgresApiCallLogWriter + factory により api_call_log を本配線し、代表 Batch CLI
  （genre_sync）1 本で genre_search 呼び出しを DB 書込する。api_call_log_id は常時 UUID。
  001〜017 全配線は Wave 4。Embedding（015）は source=rakuten CHECK 外のため触らない。
  DDL 変更は禁止。

scope:
  - "PostgresApiCallLogWriter / ScaffoldApiCallLogWriter（DbWriter.write_rows）"
  - "create_api_call_log_writer / create_batch_observability_writers 拡張"
  - "genre_sync: UUID api_call_log_id / record_api_call → writer / __main__ 注入"
  - "UT（UUID / source_api / call_status / secret strip / factory / genre_sync）"
  - "実 DB 疎通（INSERT→SELECT→DELETE cleanup。secret 非出力）"
  - "バッチ観測横断・本実装ギャップ一覧.md に Wave 3 進捗（#1703）"
  - "Task / Review Definition"

out_of_scope:
  - "DDL / migration 変更"
  - "BATCH-001〜017 全 CLI 一括配線（Wave 4）"
  - "Embedding source 拡張（DDL source=rakuten CHECK）"
  - "MOD-BATCH-043 / 044"
  - "親 schedule（#1637）"
  - "CI 既定 live / production 無承認"
  - "commit / push / PR（親 Orchestrator が行う）"

