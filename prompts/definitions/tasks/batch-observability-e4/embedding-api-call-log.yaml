background: |
  Wave 4（#1705）で BATCH-001〜017 に Run/Phase/Error を適用。api_call DB は 001〜004 のみ。
  BATCH-015 は in-memory api_call のみ（現行 DDL: source=rakuten CHECK / source_api 楽天系 4 値）。
  Human 確定 §8.4 案 B（2026-07-28）: DDL 拡張 + 015 api_call DB を Wave 5 必須とする。
  判断ログ: ai-logs/human-decisions/2026-07-28-batch-015-api-call-log-ddl-extension-must.md

objective: |
  api_call_log の source / source_api を Embedding 呼出に対応させ、BATCH-015 の
  record_api_call を PostgresApiCallLogWriter へ本配線する。
  secret・ベクトル全文・入力全文は禁止。UT + local Postgres 疎通（secret 非出力）。
  raw_product_metadata / item_import_summary / fetch_cursor の CHECK は楽天系のまま維持。

scope:
  - "DDL migration: chk_api_call_log_source_mvp を rakuten|openai へ拡張"
  - "DDL migration: chk_api_call_log_source_api に item_embedding を追加"
  - "Postgres ENUM source_api に item_embedding を ADD VALUE（整合）"
  - "packages/code-definitions/batch/source_api.yaml / enum定義書 / api_call_log 定義書更新"
  - "Observability 設計書 §14・ギャップ一覧（Wave 5 完了）更新"
  - "ALLOWED_SOURCE_APIS / writer が source=openai を受けられること（既定は楽天呼び出しで rakuten）"
  - "BATCH-015 record_api_call → PostgresApiCallLogWriter（UUID・status/latency/model メタのみ）"
  - "UT（CHECK 許可値 / 015 wiring / secret strip）+ 実 DB 疎通"
  - "Task / Review Definition"

out_of_scope:
  - "BATCH-018 / 019"
  - "MOD-BATCH-043 / 044"
  - "raw_product_metadata / item_import_summary / fetch_cursor の source_api CHECK 拡張"
  - "本番 OpenAI 実呼出の強制（scaffold-first 維持。live は既存フラグ任意）"
  - "親 schedule（#1637）"
  - "Epic→develop PR"
