  Wave 1〜3 で batch_run_log / phase_log / error_log / api_call_log writers と代表 genre_sync 配線済み。
  §8.1 Human 確定は案 C（BATCH-001〜017 全適用）。018/019・043/044 は禁止。
  015 Embedding の api_call DB は DDL source=rakuten CHECK 外。017 は既存 Run 集計と自 Run tracker の PK 衝突回避が必要。

objective: |
  genre_sync 同型で BATCH-001〜017 に tracker + phase/error（必要時 api_call）を配線する。
  共通 mapping を DEFAULT に統合。017 は tracker=job_run_id / 集計=batch_run_id 分離。
  UT（mapping / 002・005・017 wiring）と既存回帰。DDL 変更・018/019 適用は禁止。

scope:
  - "observability/mapping.py 共通 map 拡張 + binding helpers"
  - "BATCH-001〜017 repositories / __main__ / job（必要最小）配線"
  - "002/003/004 api_call UUID + source_api DB 書込"
  - "015 Run/Phase/Error のみ（api_call DB しない）"
  - "017 tracker/集計 run_id 分離 + UT"
  - "UT（mapping / wiring samples / 既存回帰）"
  - "ギャップ一覧 Wave 4 進捗・適用マトリクス"
  - "Task / Review Definition"

out_of_scope:
