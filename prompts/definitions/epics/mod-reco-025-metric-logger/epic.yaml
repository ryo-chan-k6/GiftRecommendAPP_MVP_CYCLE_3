schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-mod-reco-025-metric-logger"
  title: "MOD-RECO-025:Metric Logger"
  summary: "MOD-RECO-025（Metric Logger / Metric記録）に関するモジュール仕様書・実装・単体テストを管理するEpic。MOD-RECO-001 Orchestrator からパイプライン終端で呼び出され、推薦 Run の件数・処理時間・分布メトリクス記録を担う（処理種別: 共通、MVP 必須）。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  06_実装設計および 07_開発・単体テストにおいて、MOD-RECO-025（Metric Logger）に関する設計・実装・テストを、Epic Issue と Epic Branch で一元管理する。
  Human 判断により MVP 必須（○）として実装する（従来 Recoモジュール一覧 §6.23.5 は △ 表記）。
  MOD-RECO-001 Recommendation Orchestrator から `MetricLoggerPort.record_metrics()` 経由で呼び出される（パイプライン成功終端）。
  本 Epic は **Recoモジュール本体**（`apps/reco/src/reco/application/metric-logger/**`）に限定し、Orchestrator Wiring（`stubs.py`）は別 Epic とする。
  並列着手: #1051 phase_name 整合完了後。段階3 Composition（DB Metric Repository）より先に InMemory 実装を完了する。

objective: |
  MOD-RECO-025 に関する Epic Issue と Epic Branch を作成し、配下 Task（モジュール仕様書 / 実装 / 単体テスト）の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う。

scope:
  - "MOD-RECO-025 に関する子 Task の作業単位を整理する（モジュール仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/mod-reco-025-metric-logger/**）を整理する"

out_of_scope:
  - "API-INT-002 エンドポイント層（`apps/reco/src/reco/api/**`）"
  - "API-PUB-002 Public API 実装"
  - "MOD-RECO-001 Orchestrator 本体の変更（別 Wiring Epic）"
  - "`stubs.py` への StubMetricLogger 差し替え（別 Wiring Epic）"
  - "段階3 Composition（Postgres Metric Repository / 本番 DI）"
  - "他 Recoモジュール（当該 MOD-RECO-025 以外）本体の設計・実装"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema / migration 変更（Composition Task へ）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/reco/Recoモジュール一覧.md"
      required: true
      purpose: "§6.23.5 Metric記録モジュール正本"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: true
      purpose: "§11.2 推薦Runメトリクス・§12 分布メトリクス"
    - path: "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md"
      required: true
      purpose: "MetricLoggerPort 契約・§8.4.2"
    - path: "docs/06_実装設計/database/reco_score_distribution_metric_テーブル定義書.md"
      required: false
      purpose: "将来 DB 永続化参考（MVP 実装は InMemory）"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: false
      purpose: "識別子単位 Epic 方針 §3.5"
  templates: []
  files:
    - path: "apps/reco/src/reco/application/recommendation-orchestrator/ports.py"
      required: true
      purpose: "MetricLoggerPort 契約"
    - path: "apps/reco/src/reco/application/recommendation-orchestrator/stubs.py"
      required: true
      purpose: "StubMetricLogger 参照（読み取り・Wiring は別 Epic）"
  issues:
    - number: 260
      purpose: "前提 Epic（MOD-RECO-001 Recommendation Orchestrator）"
    - number: 1051
      purpose: "phase_name 整合完了（ログ・観測前提）"
  prs:
    - number: 1052
      purpose: "Task #1051 develop merge"

output:
  docs: []
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue（タイトル: [Epic]MOD-RECO-025:Metric Logger）"
  - "Epic Branch（develop 起点 / feature/epic-1053-mod-reco-025-metric-logger）"
  - "子 Task 候補一覧（モジュール仕様書 / 実装 / 単体テスト）"

acceptance_criteria:
