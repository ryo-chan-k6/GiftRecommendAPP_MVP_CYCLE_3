  TV進捗は TV-009 = 方針のみ・Issue 未起票。方針書は #1496 由来。
  TV-007 の user_feature 計測は User Meaning（外部 AI 含む）合算が支配的で、Feature merge/normalize 単体は分離されていない。
  UserFeatureGenerator / ItemFeatureGenerator は apps/reco に実装済み。Batch Item Feature は BATCH-012（apps/batch）だが exclusive 奪取禁止。
  Human（2026-07-23）: TV-006 develop 着後、進捗完了更新と TV-009 着手。

objective: |
  Feature 生成（User / Item）の応答時間を計測し、結果 doc と Go/Adjust/Block を残す。
  TV進捗で TV-006 を完了、TV-009 を進行中→完了へ更新する。
  正式 shared_logic / Online・Batch 責務 docs 更新は別 Task（S4 後）。

