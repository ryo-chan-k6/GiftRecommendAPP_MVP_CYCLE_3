schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-003-rakuten-item-pseudo-diff"
  title: "BATCH-003:楽天商品疑似差分取得Batch"
  summary: "BATCH-003（楽天商品疑似差分取得Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。楽天商品検索APIから商品候補を取得し Raw JSON を保存する Fetch チェーン第3段。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b Batch 並列レーン B1（Fetch）の第3段。実装フェーズ並列計画に従い、識別子単位 Epic（1 Batch ID = 1 Epic）として bootstrap する。
  先行 BATCH-001（#1161）/ BATCH-002（#1192）は develop merge 済み。
  ジャンル別・更新順・キーワード・ランキング補完候補を入力に商品検索APIから Raw を保存する。
  Batch は HTTP API 化しないため Contract Gate は不要。
  前提: Phase4a batch-foundation（#734）CLOSED、BATCH-001 / BATCH-002 CLOSED。

objective: |
  BATCH-003 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: バッチ仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-003 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-003-rakuten-item-pseudo-diff/**）を整理する"
  - "Contract Gate 不要方針を明示する"

out_of_scope:
  - "他 Batch（BATCH-001 / 002 / 004〜019）の仕様書・実装・テスト（先行は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・Reco・DB schema / migration"
  - "本番リリース作業"
  - "楽天 API 契約変更そのもの"
  - "BATCH-005 以降の Staging / Item 反映実装"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-003 の Batch ID・処理概要・入出力・依存・MVP対象を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "実行方式・Raw/Staging・ログ方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ実行スケジュール設計書.md"
      required: true
      purpose: "item-import 系 workflow との関係を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "楽天商品検索API・疑似差分取得方針を確認するため"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase4b Batch 縦串・並列方針を確認するため"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic 方針を確認するため"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic / バッチ Task 命名規約を確認するため"
  templates: []
  files: []
  issues: []
  prs: []

output:
  docs: []
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue（タイトル: [Epic]BATCH-003:楽天商品疑似差分取得Batch）"
  - "Epic Branch（develop 起点）"
  - "子 Task 候補一覧（バッチ仕様書 / 実装 / 単体テスト）"
  - "epic_scope.allowed_paths による配下 Task のファイル境界宣言"

acceptance_criteria:
  - "Epic Issue が作成されている"
  - "Issue タイトルが [Epic]BATCH-003:楽天商品疑似差分取得Batch 形式である"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "配下 Task の作業単位が整理されている"
  - "子 Task の PR target が親 Epic Branch である方針が明記されている"
  - "epic_scope.allowed_paths が BATCH-003 の責務範囲と整合している"
  - "epic_scope.artifact_id が BATCH-003 である"

branch:
  no_branch: false
  summary: "batch-003-rakuten-item-pseudo-diff"
  name: "feature/epic-1207-batch-003-rakuten-item-pseudo-diff"
  base: "develop"
  target: "develop"
  worktree_required: true

project:
