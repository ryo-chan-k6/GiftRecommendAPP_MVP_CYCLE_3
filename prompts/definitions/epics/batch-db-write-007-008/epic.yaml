schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-db-write-007-008"
  title: "batch-db-write-007-008:BATCH-007/008 item系書込本格化"
  summary: "BATCH-007 item_apply と BATCH-008 item_active_status の本番書込（UPSERT/UPDATE/DELETE）を本配線する。SELECT は #1623、005 書込は #1632 済み。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  E2 は代表 IF の UPSERT のみ。007/008 の item 系フル UPSERT は後続と明記。
  #1623 で SELECT 開放、#1632 で 005 staging 書込完了後、diff → item 反映 → active_status 本線の書込が次ブロッカー。
  機能・領域単位 Epic（例外）。007 と 008 は同一 Epic（Issue §11 継続）。

objective: |
  BATCH-007 / 008 の本番 DB 書込を upsert_rows / update_rows / delete_rows で本配線し、
  実 DB で item 反映と active_status 適用を通す。develop 統合は本 Epic PR のみ。

scope:
  - "Wave 1: BATCH-007 item / item_image / item_review_summary 本番 UPSERT（conflict は DDL UNIQUE）"
  - "Wave 1: item_image 集合外 URL の同期 DELETE（delete_rows）"
  - "Wave 1: unchanged の last_checked_at は update_rows"
  - "Wave 2: BATCH-008 item.active_status / is_active UPDATE"
  - "Wave 2: item_active_status_candidate 状態更新（applied/superseded/discarded）と Retention DELETE"
  - "IF-020（BATCH-004 candidate INSERT UPSERT）済み範囲は重複実装しない"
  - "UT + 実装 Task ごとの実 DB 疎通（local/dev/staging）"
  - "IF-DB ギャップ一覧の進捗反映"
  - "secret / .env 実値禁止"

out_of_scope:
  - "DB SELECT 本配線（#1623）"
  - "005 staging 書込（#1632）"
  - "009 以降 queue / semantic 書込（#1634〜）"
  - "IF-020 candidate INSERT UPSERT の再実装（T4a 済み）"
  - "E4 観測横断 / 親 workflow schedule"
  - "DDL 破壊的変更（必要時は Human 判断）"
  - "CI 既定 live / production 無承認"
  - "OpenAPI / web / api / reco 破壊変更"

