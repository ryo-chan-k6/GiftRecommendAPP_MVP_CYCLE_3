  - "Epic Branch（develop 起点）"
  - "子 Task 候補一覧（仕様書 / 実装 / UT）"
  - "epic_scope.allowed_paths による配下 Task のファイル境界宣言"

acceptance_criteria:
  - "Epic Issue が作成されている"
  - "Issue タイトルが [Epic]BATCH-011:Feature入力hash算出Batch 形式である"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "配下 Task の作業単位が整理されている"
  - "IF-DB-BATCH-012 と IF-DB-BATCH-011（BATCH-010）の混同防止が明記されている"
  - "epic_scope.artifact_id が BATCH-011 である"

branch:
