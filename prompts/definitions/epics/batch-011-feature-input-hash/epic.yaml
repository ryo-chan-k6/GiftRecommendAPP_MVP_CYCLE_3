schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-011-feature-input-hash"
  title: "BATCH-011:Feature入力hash算出Batch"
  summary: "BATCH-011（Feature入力hash算出Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。item_semantic 等から feature_input_payload を正規化し feature_input_hash を算出する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b 意味生成パイプラインの Feature 入力 hash 段。識別子単位 Epic（1 Batch ID = 1 Epic）。
  先行 BATCH-010 は develop merge 済み（#1422 / PR #1433）。
  item_feature テーブル定義（#514）・item_semantic / item_generation_queue は整備済み。専用バッチ仕様書・apps/batch 実装・workflow は未着手。
  IF は IF-DB-BATCH-012（Feature入力hash）。IF-DB-BATCH-011 は Item Semantic（BATCH-010）であり混同禁止。
  IF-SHARED-002 / MOD-RECO-027 は BATCH-012 側（本 Epic 外）。
  Batch は HTTP API 化しないため Contract Gate は不要。後続は BATCH-012。

objective: |
  BATCH-011 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-011 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-011-feature-input-hash/**）を整理する"
  - "Contract Gate 不要方針を明示する"
  - "IF-DB-BATCH-012 / feature_input_hash / BATCH-010・012 境界を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜010 / 012〜019）の仕様書・実装・テスト（先行・後続は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・DB schema / migration（既存定義の参照は可）"
  - "本番リリース作業"
  - "apps/reco / MOD-RECO-027 / IF-SHARED-002（BATCH-012）"
  - "BATCH-012〜015 の詳細実装"
  - "親 batch-item-meaning-generation.yml / retry-failed チェーン全体改修（独立子 workflow 追加は可）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-011 の Batch ID・処理概要・入出力・依存・MVP対象"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "§13.3 feature_input_hash 方針"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ実行スケジュール設計書.md"
      required: true
      purpose: "meaning-generation チェーン内の位置"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ依存関係図.md"
      required: true
      purpose: "010 → 011 → 012 の依存"
    - path: "docs/06_実装設計/database/item_feature_テーブル定義書.md"
      required: true
      purpose: "feature_input_hash 列・冪等キー・IF-DB-BATCH-012"
    - path: "docs/06_実装設計/database/item_semantic_テーブル定義書.md"
      required: true
      purpose: "SELECT 入力（DML 禁止）"
    - path: "docs/06_実装設計/database/item_generation_queue_テーブル定義書.md"
      required: true
      purpose: "Queue 消化・status"
    - path: "docs/06_実装設計/batch/BATCH-010_Item Semantic生成バッチ仕様書.md"
      required: true
      purpose: "先行 Semantic 境界"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase4b 縦串方針"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic / Task 命名"
  templates: []
  files: []
  issues: []
  prs: []

output:
