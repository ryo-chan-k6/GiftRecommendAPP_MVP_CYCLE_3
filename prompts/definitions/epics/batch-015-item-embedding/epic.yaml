schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-015-item-embedding"
  title: "BATCH-015:Item Embedding生成Batch"
  summary: "BATCH-015（Item Embedding生成Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。BATCH-014 handoff（item_text_context / embedding_input_hash）を受け取り、IF-EXT-005 で Embedding を生成し、IF-VEC-BATCH-001 で item_embedding へ Upsert する。意味生成パイプラインの Embedding 終端として Queue を succeeded へ遷移させる。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b 意味生成パイプラインの Item Embedding 生成段。識別子単位 Epic（1 Batch ID = 1 Epic）。
  先行 BATCH-014（Embedding入力hash算出Batch）は develop merge 済み（#1467 / PR #1477）。
  item_embedding / item_generation_queue / model_version テーブル定義は整備済み。
  物理書込 IF は IF-VEC-BATCH-001（Item Embedding保存: item_embedding Upsert）。
  IF-DB-BATCH-015 は Embedding入力hash保存（BATCH-014 handoff）であり混同禁止。
  IF-DB-BATCH-016 は分布メトリクス保存（BATCH-016）であり本 Epic 対象外。
  外部呼出 IF は IF-EXT-005（Embedding API）。MVP 初版は scaffold-first（実 OpenAI 呼出は Human 判断）。
  主要モジュールは MOD-BATCH-036（Item Embedding Generator）/ MOD-BATCH-037（Item Embedding Repository）。
  Config 解決は MOD-RECO-003（model_type=embedding / is_current）。
  冪等キーは item_id + model_version_id + embedding_input_hash（物理 UNIQUE 3 列）。
  Queue 終端 succeeded は本 Batch が担う（semantic 一連 / embedding 経路の完了）。
  Batch は HTTP API 化しないため Contract Gate は不要。後続は BATCH-016 / BATCH-017。

objective: |
  BATCH-015 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-015 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-015-item-embedding/**）を整理する"
  - "Contract Gate 不要方針を明示する"
  - "IF-VEC-BATCH-001 / IF-EXT-005 / IF-DB-BATCH-015（BATCH-014）境界と Queue 終端責務を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜014 / 016〜019）の仕様書・実装・テスト（先行・後続は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・DB schema / migration（既存定義の参照は可）"
  - "本番リリース作業"
  - "apps/reco 本体の破壊変更（MOD-RECO-003 / MOD-RECO-010 は参照のみ。必要なら in-process アダプタを batch 側に置く）"
  - "BATCH-014 本体の再実装（handoff 契約の参照のみ）"
  - "BATCH-016 分布メトリクス集計 / IF-DB-BATCH-016"
  - "親 batch-item-meaning-generation.yml / retry-failed チェーン全体改修（独立子 workflow 追加は可）"
  - "本番 OpenAI 実呼出の強制（MVP 初版は scaffold-first。実 API 接続は Human 判断）"

