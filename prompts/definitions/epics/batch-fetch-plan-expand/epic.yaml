    - path: "ai-logs/human-decisions/2026-07-30-rakuten-fetch-ops-policy.md"
      required: true
    - path: "ai-logs/human-decisions/2026-08-03-batch-genre-map-campaign-ops-plan.md"
      required: true
  files: []
  issues:
    - number: 1827
      purpose: "ジャンル地図キャンペーン完了。拡大情報源の前提Epic"
    - number: 1811
      purpose: "Phase1 local cron。本Epicでは変更しない（Relationships追跡のみ）"
    - number: 1818
      purpose: "Phase2 local cron。本Epicでは変更しない（Relationships追跡のみ）"
    - number: 1798
      purpose: "本格収集ops。関連追跡"
    - number: 1745
      purpose: "統括ロードマップ（関連追跡）"

