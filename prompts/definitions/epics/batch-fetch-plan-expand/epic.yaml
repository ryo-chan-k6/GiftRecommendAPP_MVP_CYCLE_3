schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-fetch-plan-expand"
  title: "batch-fetch-plan-expand:ジャンル地図からのfetch_plan拡大"
  summary: "ジャンル地図（#1827完了・external_genre 16,537）を拡大情報源とし、BATCH-002/003 の承認済み fetch_plan へジャンル追加候補を Human Decision で決める。MVP 4IDは置き換えず追加のみ。商品Item経路（BATCH-003）を優先。機能・領域単位Epic（例外）。"
  workstream_key: "batch-fetch-plan-expand"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  ジャンル地図キャンペーン（#1827）が完了し、external_genre は 16,537 件（level 0–5）まで揃った。
  地図は MVP fetch_plan 4ID（100000/100003/100004/100005）の置き換えではなく、後続 BATCH-002/003 計画の拡大情報源である（Decision 2026-08-03 No.9）。
  BATCH-003 の genre ルートは明示指定ジャンルIDのみで検索し、子・孫を自動展開しない。
  現状の定常取得は MVP 4ID 中心。商品データ拡充のため、地図から追加候補を選び fetch_plan を段階拡大する必要がある。
  拡大実行本体・定常crontab変更は本Epicの Decision 採択後の後続Task。本Epic着手時は Decision をゲートとする。
  AI は --live-rakuten を実行しない。GHA楽天live / #1607 / schedule 有効化は対象外維持。
  Phase1（#1811）/ Phase2（#1818）の観測・cutover を壊さない（Relationships追跡のみ）。

objective: |
  ジャンル地図を根拠に BATCH-002/003 の fetch_plan 拡大候補（追加ジャンルID・段階・route優先）を
  Human Decision Log で決め、楽天Fetch運用方針等の正本docsへ同期する。
  MVP 4IDは維持（追加のみ）。商品Item経路（BATCH-003）を Ranking-only より優先する方針を明示する。

scope:
  - "BATCH-002/003 拡大候補の Human Decision Log 化（追加ジャンルID候補・第1波件数・002/003優先・明示指定のみの再確認）"
  - "推奨案の整理（地図からの選定観点・段階拡大・Run予算影響）と Human 採択欄"
  - "楽天Fetch運用方針・必要最小の運用手順docs同期（§10 / fetch_plan 節への接続）"
  - "後続（fetch_plan反映・段階収集実行）Task の着手ゲートを採択結果へ反映"
  - "MVP 4ID 非置き換え・子ジャンル自動展開なしの境界の正本化"

out_of_scope:
  - "ジャンル地図キャンペーンの再実行・BFS runner 改修本体"
  - "拡大候補の大規模 live 収集実行本体（Decision 採択後の別Task）"
  - "定常crontabの無断変更（#1811 / #1818。採択後も別Task・Human承認）"
  - "AIによる --live-rakuten 実行"
  - "GHA / GitHub-hosted からの楽天HTTP live化"
  - "daily / weekly / manual 親 on.schedule のコメント解除・有効化（#1792 / B-1）"
  - "本番egress IP / NAT / self-hosted（#1607）"
  - "BATCH-018 / BATCH-019"
  - "MVP fetch_plan 4ID（100000/100003/100004/100005）の置き換え"
  - "keyword route の本格常用化（必要なら別Decision）"
  - "secret実値・GitHub Secrets / Variables の表示・変更"
  - "OpenAPI / Orval / generated / apps/web|api|reco 変更"
  - "production定期開始・破壊的全件取得"

epic_scope:
  artifact_id: ""
  allowed_paths:
    - "prompts/definitions/epics/batch-fetch-plan-expand/**"
    - "prompts/definitions/tasks/batch-fetch-plan-expand/**"
    - "prompts/definitions/reviews/batch-fetch-plan-expand/**"
    - "ai-logs/human-decisions/**"
    - "ai-logs/experiments/**"
    - "docs/15_運用・改善/運用手順/**"
    - "docs/05_アプリケーション設計/アプリ/batch/**"
    - "docs/06_実装設計/batch/BATCH-002_*"
    - "docs/06_実装設計/batch/BATCH-003_*"
    # 第1波運用ブロッカー解消（#1849 / BATCH-008）。#1835 と同型の最小追加
    - "apps/batch/src/batch/application/item_active_status/**"
    - "apps/batch/tests/unit/application/test_item_active_status.py"
    - "apps/batch/tests/unit/application/test_item_active_status_retention.py"
    # 第1波運用ブロッカー解消（#1851 / BATCH-005 image_url 重複 upsert）
    - "apps/batch/src/batch/application/raw_staging/**"
    - "apps/batch/tests/unit/application/test_raw_staging.py"
    # 第1波 staging→item 反映ブロッカー（#1853 / BATCH-006）。diff_status live 同期
    - "apps/batch/src/batch/application/product_diff/**"
    - "apps/batch/tests/unit/application/test_product_diff.py"
    - "docs/06_実装設計/batch/BATCH-006_*"
    # 第1波選定スキャン上限解消（#1855 / BATCH-006・007）
    - "apps/batch/src/batch/application/item_apply/**"
    - "apps/batch/tests/unit/application/test_item_apply.py"
    - "docs/06_実装設計/batch/BATCH-007_*"
  forbidden_paths:
    - "packages/contracts/**"
    - "apps/web/**"
    - "apps/api/**"
    - "apps/reco/**"
    - ".github/workflows/batch-daily-orchestrator.yml"
    - ".github/workflows/batch-weekly-orchestrator.yml"
    - ".github/workflows/batch-manual-orchestrator.yml"
    - ".github/workflows/batch-rakuten-*.yml"
    - "scripts/batch/local_daily_orchestrator.sh"
    - "scripts/batch/local_weekly_orchestrator.sh"
  child_task_areas:
    - "docs"
    - "ops-policy"
    - "batch"

