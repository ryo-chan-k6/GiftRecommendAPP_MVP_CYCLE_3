schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-lane-1e-alcohol-ng-exclusion"
  title: "レーン1e:alcohol NG除外"
  summary: "ngText（例: アルコールはNG）が Pre Hard Filter で実効キーワード化され、item_003（ワイン）が候補から除外されるようにする。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  レーン1e 縦串で ngText「アルコールはNG」でも item_003（ワイン）が返る。
  PostFilter は配線済みだが、アルコールは Hard Filter 経路。
  PreFilter が ngText 全文を ng_keywords に載せ、ILIKE `%アルコールはNG%` が caption「アルコールを含む」に不一致。
  OpenAPI NgCondition は現状 ngText のみ（ngKeywords 未契約）。

objective: |
  Pre Hard Filter で ngText から実効キーワードを抽出し、PUB-002 で alcohol NG 時に item_003 を除外する。
  OpenAPI / api / web / migration は変更しない（暫定は reco）。

scope:
  - "子 Task（implementation）"
  - "Epic Issue / Branch"
  - "pre-hard-filter の ngText 実効キーワード化"
  - "必要なら InMemory の name/caption 照合を Postgres と揃える"
  - "UT・手順書再スモーク"

out_of_scope:
  - "OpenAPI への ngKeywords 追加（api 正本化は後続）"
  - "api / web 変更"
  - "PostFilter への alcohol_ng / ng_candidate 新設"
  - "Reason 永続 / Ranking 変更"
  - "migration / master concept seed 追加"

