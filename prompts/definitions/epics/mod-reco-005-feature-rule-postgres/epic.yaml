epic:
  id: "epic-mod-reco-005-feature-rule-postgres"
  title: "MOD-RECO-005:Feature Rule Postgres読み取り"
  summary: "MOD-RECO-005 の FeatureRuleRepositoryPort を InMemory scaffold から Postgres へ配線し、relationship_rule / occasion_rule / pair_rule の全 master を production composition で参照できるようにする。"
  phase: "07_開発・単体テスト"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  stg 実測（2026-07-30）で推薦実行が GRS-REC-005 で失敗した。
  error_log の実レコードは以下である。

    error_code        : GRS-REC-005
    error_message     : relationship_rule not found: spouse
    error_detail_json : {"phase_name": "user_feature_generated",
                         "source_module_id": "MOD-RECO-005"}

  apps/reco/src/reco/composition/builder.py の build_production_ports は
  build_default_stub_ports() を起点に一部のポートのみ Postgres 実装へ置換しており、
  MOD-RECO-005 の FeatureRuleRepositoryPort は InMemoryFeatureRuleRepository のまま残っている。

  scaffold が保持する code は以下に限られる（Featureルール定義書の代表値のみ）。

    relationship : lover / boss / friend_casual / other（4 種）
    occasion     : birthday / thanks / other（3 種）

  一方 stg DB には master が正しく seed 済みである（初期データ定義書 §7 の期待値と一致）。

    relationship_master 12 / occasion_master 15 / pair_master 180
    relationship_rule 96 / occasion_rule 120 / pair_rule 112
    semantic_config_version_id = a1111111-1111-4111-8111-111111111102

  semantic_config_version_id は DB 値と scaffold 既定値が一致しており、version 不整合ではない。
  scaffold に存在しない code（例: spouse）が選択されると
  get_relationship_features() が None を返し ExternalFeatureEstimateError となる。

  本件は Epic #1747（Supabase stg 東京リージョン移行）で config_resolved が
  2,786ms から 203ms へ改善し、パイプラインが MOD-RECO-005 まで到達したことで露出した。
  リージョン移行の副作用ではなく、Postgres repository 未実装が原因である。

objective: |
  FeatureRuleRepositoryPort の Postgres 実装を追加し、build_production_ports へ注入する。
  DEFAULT composition の InMemory 実装は維持し、production では DB の全 master を参照できる状態にする。

scope:
  - "Epic Issue / Branch（develop 起点）"
  - "子 Task（implementation）"
  - "PostgresFeatureRuleRepository（relationship_rule / occasion_rule / pair_rule / feature_integration_rule 読み取り）"
  - "build_production_ports への注入"
  - "unit test 追加・更新"

out_of_scope:
  - "OpenAPI / Orval / generated 変更"
  - "supabase/migrations / supabase/seeds の変更"
  - "MOD-RECO-006 / 008 / 009 の Postgres 化（scaffold 残存の是正は別途判断）"
  - "DEFAULT composition の InMemory 実装廃止"
  - "apps/api / apps/web / apps/batch の変更"
  - "Featureルール定義書の値そのものの見直し"

