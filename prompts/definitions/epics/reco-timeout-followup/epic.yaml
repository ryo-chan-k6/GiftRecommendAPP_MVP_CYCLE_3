background: |
  Epic #1781 / PR #1784 で PIPELINE_* を soft 6s / hard 8s、DEFAULT_RECO_REQUEST_TIMEOUT_MS を 9_000 へ整合した。
  AI Review nit として session.py に旧 hard 4,000ms コメントが残存。
  また RECO_REQUEST_TIMEOUT_MS が環境変数定義書・infra/render README に未記載。

objective: |
  旧 4,000ms コメントを現行 hard 8,000ms 前提へ更新し、
  RECO_REQUEST_TIMEOUT_MS を docs / infra README に文書化する。
  stg Render の実値設定手順は Human 実施とする。

scope:
  - "session.py の PIPELINE_HARD_TIMEOUT_MS（4,000ms）コメントを 8,000ms 前提へ更新"
  - "環境変数定義書 §7 へ RECO_REQUEST_TIMEOUT_MS を追記"
  - "infra/render/README の Environment Variables 表へ RECO_REQUEST_TIMEOUT_MS を追記"
  - "子 Task 1 本"

out_of_scope:
  - "PIPELINE_* / DEFAULT_RECO_REQUEST_TIMEOUT_MS の再変更"
  - "Render / Fly Dashboard での Environment 実値操作（Human）"
  - "OpenAPI / generated / 推薦ロジック変更"
  - "secret 実値の記載"

