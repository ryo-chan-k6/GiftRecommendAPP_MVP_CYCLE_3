  title: "reco-timeout-followup:hard8s追随コメントとRECO_REQUEST_TIMEOUT文書化"
  summary: "Epic #1781 後続。session.py の旧 hard 4,000ms コメントを 8,000ms 前提へ更新し、API の RECO_REQUEST_TIMEOUT_MS（既定 9,000・hard 以上）を環境変数定義書と infra/render README へ追記する。stg Render Environment の実値設定は Human。"
