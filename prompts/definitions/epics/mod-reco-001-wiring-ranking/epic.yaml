  skip_reason:
    "integration test（E2E）": "段階3 Composition 完成 Task の範囲"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "stubs.py の変更が Ranking フェーズ Port に限定されているか"
    - "モジュール本体（MOD-RECO-017〜020）への変更が混入していないか"
    - "Port I/F（ExecutionContext キー等）が各モジュール unit test と一致しているか"
