dependencies:
  epics:
    - number: 935
      purpose: "MOD-RECO-017 Popularity Scorer Epic 完了"
    - number: 943
      purpose: "MOD-RECO-018 Risk Scorer Epic 完了"
    - number: 951
      purpose: "MOD-RECO-019 Final Score Calculator Epic 完了"
    - number: 959
      purpose: "MOD-RECO-020 Final Ranker Epic 完了"
  issues:
    - number: 260
      purpose: "親 Epic（MOD-RECO-001:Recommendation Orchestrator）"
