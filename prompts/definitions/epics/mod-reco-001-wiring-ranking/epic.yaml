schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-mod-reco-001-wiring-ranking"
  title: "MOD-RECO-001:Orchestrator Wiring（Ranking）"
  summary: "MOD-RECO-001 Recommendation Orchestrator の Ranking フェーズ（MOD-RECO-017〜020）について、各モジュール implementation 完了後に build_default_stub_ports() の該当 Port を本実装へ差し替える Wiring milestone Epic。stubs.py の競合をフェーズ単位で直列化する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  MOD-RECO-001 Recommendation Orchestrator の下位モジュール配線方針（モジュール仕様書 §8.4）において、段階2: フェーズ Wiring Task を Epic Issue として管理する。
  起動フェーズ（MOD-RECO-002 / 003）および User Meaning / Retrieval / Matching フェーズは別 Epic で配線済み。本 Epic は Ranking フェーズ（MOD-RECO-017〜020）について、各モジュール implementation Task 完了後に build_default_stub_ports() の該当 Port を本実装へ差し替える milestone である。
  StubXxx クラスは削除せず、MVP デフォルト composition の参照先のみ本実装に変更する（§8.4.1）。
  親 Epic #260（MOD-RECO-001:Recommendation Orchestrator）配下の milestone だが、develop への統合は本 Epic PR のみで行う（Epic Branch は develop 起点）。

objective: |
  Ranking フェーズの Orchestrator Wiring を Epic Issue / 配下 Task で管理し、recommendation-orchestrator/stubs.py の競合をフェーズ単位で直列化する。
  配下 Task の PR target は本 Epic Branch とし、develop への統合は本 Epic PR のみで行う。
  Epic develop merge 後の ExecutionContext 型付き化 / integration 再テスト follow-up Task 起票（playbook 順序 3〜4）までを Epic 完了条件に含める。

scope:
  - "Ranking フェーズ（MOD-RECO-017〜020）の build_default_stub_ports() 配線 Task を Issue 化する"
  - "対象 Port: popularity_scorer, risk_scorer, final_score_calculator, final_ranker"
  - "配線後の Orchestrator デフォルト経路テスト（test_recommendation_orchestrator.py 等）を Epic Branch で更新する"
  - "各モジュールの unit / executor テスト（明示 DI）が green であることを Wiring 前提条件とする"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/mod-reco-001-wiring-ranking/**）を整理する"

out_of_scope:
  - "対象モジュール（MOD-RECO-017〜020）本体の新規実装（各 MOD-RECO-* Epic 配下 Task）"
  - "起動フェーズ（002 / 003）の再配線"
  - "User Meaning / Retrieval / Matching フェーズの再配線"
  - "他フェーズの Wiring（別 Epic）"
  - "段階3 Composition 完成（本番 DI / DB Repository / E2E 強化）"
  - "StubXxx クラスの削除"
  - "execution_context.py の型付きフィールド追加（develop 直 follow-up Task。playbook 順序 3）"
  - "integration 再テストの getattr 置換（develop 直 follow-up Task。playbook 順序 4）"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema 変更"

input:
  docs:
    - path: "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md"
      required: true
      purpose: "配線方針・フェーズ単位・stubs.py 配置の正本（§8.4）"
    - path: "docs/05_アプリケーション設計/アプリ/reco/Recoモジュール一覧.md"
      required: true
      purpose: "対象モジュール（MOD-RECO-017〜020）の責務確認"
    - path: "docs/06_実装設計/reco/MOD-RECO-017_Popularity Scorerモジュール仕様書.md"
      required: true
      purpose: "017 factory・Port I/F"
    - path: "docs/06_実装設計/reco/MOD-RECO-018_Risk Scorerモジュール仕様書.md"
      required: true
      purpose: "018 factory・ExecutionContext キー"
    - path: "docs/06_実装設計/reco/MOD-RECO-019_Final Score Calculatorモジュール仕様書.md"
      required: true
      purpose: "019 factory・ExecutionContext キー"
    - path: "docs/06_実装設計/reco/MOD-RECO-020_Final Rankerモジュール仕様書.md"
      required: true
      purpose: "020 factory・ExecutionContext キー"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic 方針（§3.5）を確認するため"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic タイトル規約（§15.0）を確認するため"
  templates: []
  files:
    - path: "apps/reco/src/reco/application/recommendation-orchestrator/stubs.py"
      required: true
      purpose: "配線対象の build_default_stub_ports()"
  issues:
    - number: 260
      purpose: "親 Epic（MOD-RECO-001:Recommendation Orchestrator）"
    - number: 791
      purpose: "本 Epic Issue"
  prs: []

output:
  docs: []
  files:
    - "apps/reco/src/reco/application/recommendation-orchestrator/stubs.py"
    - "apps/reco/src/reco/application/recommendation-orchestrator/__init__.py"
  tests:
    - "apps/reco/tests/unit/application/test_recommendation_orchestrator.py"
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue（タイトル: [Epic]MOD-RECO-001:Orchestrator Wiring（Ranking））"
  - "Epic Branch（develop 起点 / feature/epic-791-mod-reco-001-wiring-ranking）"
  - "子 Task 候補: prompts/definitions/tasks/mod-reco-001-wiring-ranking/wiring.yaml"
  - "子 Task 候補: prompts/definitions/tasks/mod-reco-001-wiring-ranking/integration-test.yaml"
  - "epic_scope.allowed_paths による配下 Task のファイル境界宣言"

acceptance_criteria:
  - "Epic Issue #791 が存在する"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "対象フェーズ（MOD-RECO-017〜020）の Port が build_default_stub_ports() で本実装を参照している"
  - "StubXxx は失敗注入・明示 DI テスト用に残存している"
  - "Orchestrator デフォルト経路の関連テストが green"
  - "配下 Wiring Task PR が merge され、Epic PR が develop へ統合可能"
  - "playbook 順序 3（execution-context-typed-fields）Task が起票されている（Epic develop merge 後）"
  - "playbook 順序 4（integration-retest）Task が起票されている"

follow_up_tasks_outside_epic:
  - task_area: "execution-context-typed-fields"
    branch_scope: "develop"
    template: "prompts/definitions/_examples/mod-reco-001-wiring-phase-template/execution-context-typed-fields.yaml"
    start_gate: "本 Epic が develop に merge 済み"
  - task_area: "integration-retest"
    branch_scope: "develop"
    template: "prompts/definitions/_examples/mod-reco-001-wiring-phase-template/integration-retest.yaml"
    start_gate: "execution-context-typed-fields Task が develop に merge 済み"

branch:
  no_branch: false
  name: "feature/epic-791-mod-reco-001-wiring-ranking"
  base: "develop"
  target: "develop"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "medium"
    planned_start: "2026-06-26"
    due_date: "2026-06-28"

issue:
