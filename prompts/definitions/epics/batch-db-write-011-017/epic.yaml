schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-db-write-011-017"
  title: "batch-db-write-011-017:BATCH-011〜017書込本格化残"
  summary: "BATCH-011〜017 のうち未本格化の書込を本配線する。012/015 input UPSERT（E2）と 009/010（#1634）は除外。VEC（item_embedding）は本 Epic に含める（推奨案）。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  E2 T4b で IF-012 / IF-015 の中間 input UPSERT は完了。
  #1634 で queue / semantic 書込完了後、feature → embedding → metrics → summary の書込残がブロッカー。
  機能・領域単位 Epic（例外）。Issue §11 の粒度・VEC は推奨案で起動し、Human Review で最終確認。

objective: |
  BATCH-011〜017 の未配線書込を本番 SQL（upsert/update）で本配線し、
  feature / embedding / 集計系の本線書込を実 DB で通す。develop 統合は本 Epic PR のみ。

scope:
  - "Wave 1: BATCH-011 claim/status + BATCH-012 item_feature UPSERT（IF-013）"
  - "Wave 2: BATCH-013 normalize + item_meaning（IF-014）"
  - "Wave 3: BATCH-014 claim/status + BATCH-015 item_embedding（IF-VEC-001）"
  - "Wave 4: BATCH-016 distribution metrics + BATCH-017 import_summary"
  - "偽 write マーカー（op=claim 等）の廃止"
  - "UT + 実装 Task ごとの実 DB 疎通（local/dev/staging）"
  - "IF-DB ギャップ一覧の進捗反映"
  - "secret / .env 実値禁止"

out_of_scope:
  - "012/015 input UPSERT の再実装（E2 済み）"
  - "DB SELECT 本配線（#1623）"
  - "005/007/008/009/010 書込再実装"
  - "Semantic LLM / Embedding API 本接続（E3）"
  - "E4 / 親 workflow schedule（#1636 / #1637）"
  - "018 / 019 本格化"
  - "CI 既定 live / production 無承認"

