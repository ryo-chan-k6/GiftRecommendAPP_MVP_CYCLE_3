  レーン1e（#1293）で recommendation_result / recommendation_result_item の Postgres 配線は完了したが、
  Reason（MOD-RECO-023）は InMemoryRecommendationReasonRepository のまま明示的に out of scope だった。
  DDL・テーブル定義書・Reason 生成ロジックは済み。残は Postgres repository と production 注入。

objective: |
  production composition に recommendation_reason Postgres INSERT を配線し、
  DEFAULT InMemory を維持したまま、ローカル手順書に確認手順を追記する。

scope:
