  - "reason_template Postgres reader 本実装（現行 InMemory テンプレート解決を維持可）"
  - "item_semantic Postgres reader 本実装"
  - "SCR / API-PUB / BATCH 変更"
  - "Feedback と reason_id の結合 UI"

