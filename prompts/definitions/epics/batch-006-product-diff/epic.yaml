schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-006-product-diff"
  title: "BATCH-006:商品差分判定Batch"
  summary: "BATCH-006（商品差分判定Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。staging_item と既存 item の normalized_hash を比較し、product_diff_result に new/updated/unchanged/unavailable を記録する差分判定段。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b Batch レーンの差分判定段。実装フェーズ並列計画に従い、識別子単位 Epic（1 Batch ID = 1 Epic）として bootstrap する。
  先行 BATCH-005（Raw取込・Staging変換）は develop merge 済み（#1307 / PR #1339）。
  BATCH-005 が確定した staging_item.normalized_hash と既存 item.normalized_hash を比較し、product_diff_result に判定を記録する。
  Batch は HTTP API 化しないため Contract Gate は不要。
  前提: Phase4a batch-foundation（#734）CLOSED。後続は BATCH-007（Item反映）/ BATCH-008 / BATCH-009。

objective: |
  BATCH-006 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: バッチ仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-006 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-006-product-diff/**）を整理する"
  - "Contract Gate 不要方針を明示する"

out_of_scope:
  - "他 Batch（BATCH-001〜005 / 007〜019）の仕様書・実装・テスト（先行 Staging・後続 Item 反映は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・Reco・DB schema / migration（既存 product_diff_result / staging_item / item 定義の参照は可。新規 migration が必要なら別途 Human 判断）"
  - "本番リリース作業"
  - "楽天 API 契約変更そのもの"
  - "BATCH-007 Item反映・BATCH-008 active_status 本更新・BATCH-009 キュー登録の詳細実装"
  - "normalized_hash の再算出（BATCH-005 責務。本 Batch は比較のみ）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-006 の Batch ID・処理概要・入出力・依存・MVP対象を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "実行方式・差分判定・ログ方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ実行スケジュール設計書.md"
      required: true
      purpose: "item-import チェーン内の差分判定段との関係を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ依存関係図.md"
      required: true
      purpose: "BATCH-005 → 006 → 007 の必須依存を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "差分判定・hash 比較方針を確認するため"
    - path: "docs/06_実装設計/database/product_diff_result_テーブル定義書.md"
      required: true
      purpose: "判定正本・UNIQUE・diff_status の参照"
    - path: "docs/06_実装設計/database/staging_item_テーブル定義書.md"
      required: true
      purpose: "比較入力・normalized_hash / diff_status=NULL"
    - path: "docs/06_実装設計/batch/BATCH-005_Raw取込・Staging変換バッチ仕様書.md"
      required: true
      purpose: "先行 Batch 境界（hash 算出・Item 非更新）の参照"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase4b Batch 縦串・並列方針を確認するため"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic 方針を確認するため"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic / バッチ Task 命名規約を確認するため"
  templates: []
  files: []
  issues: []
  prs: []

output:
