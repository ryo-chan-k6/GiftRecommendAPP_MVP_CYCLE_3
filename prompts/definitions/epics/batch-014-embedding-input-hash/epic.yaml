schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-014-embedding-input-hash"
  title: "BATCH-014:Embedding入力hash算出Batch"
  summary: "BATCH-014（Embedding入力hash算出Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。商品メタデータから item_text_context を構築し、決定論的に embedding_input_hash（SHA-256）を算出して handoff / Queue 更新する。物理書込 IF は IF-DB-BATCH-015（Embedding入力hash保存）だが、item_embedding への DML は後続 BATCH-015 が実施し、本 Batch 自身は DML しない。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b 意味生成パイプラインの Embedding 入力 hash 算出段。識別子単位 Epic（1 Batch ID = 1 Epic）。
  先行 BATCH-013（Feature正規化Batch）は develop merge 済み（#1455 / PR #1466）。
  item_embedding / item_generation_queue / model_version テーブル定義は整備済み。
  物理書込 IF は IF-DB-BATCH-015（Embedding入力hash保存: embedding_input_hash / item_text_context）。
  IF-DB-BATCH-014 は Feature正規化結果保存（BATCH-013）であり混同禁止（Batch ID と IF 番号は +1 ズレ）。
  embedding_input_hash の永続化列は item_embedding.embedding_input_hash であり、
  物理 DML（INSERT/UPSERT）は後続 BATCH-015 が実施する。BATCH-014 自身は item_embedding へ DML せず、
  hash 算出結果を handoff し item_generation_queue を更新する（BATCH-011 ↔ BATCH-012 と同型）。
  hash 方式は canonicalize（キーソート・trim・配列ソート・null 正規化）+ SHA-256 UTF-8 小文字 64hex。
  MVP は embedding_source_type = item_text_context 固定で Semantic Concept を文脈に含めない。
  embedding_source_version は batch 層概念で物理列なし。config/version 解決は MOD-RECO-003。
  Batch は HTTP API 化しないため Contract Gate は不要。後続は BATCH-015。

objective: |
  BATCH-014 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-014 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-014-embedding-input-hash/**）を整理する"
  - "Contract Gate 不要方針を明示する"
  - "IF-DB-BATCH-015 / IF-DB-BATCH-014（BATCH-013）境界と、BATCH-014 が item_embedding へ DML しない責務境界を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜013 / 015〜019）の仕様書・実装・テスト（先行・後続は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・DB schema / migration（既存定義の参照は可）"
  - "本番リリース作業"
  - "apps/reco 本体の破壊変更（MOD-RECO-003 は呼び出しのみ。必要なら in-process アダプタを batch 側に置く）"
  - "item_embedding への物理 DML（BATCH-015）"
  - "Item Embedding 生成本体・OpenAI Embedding 呼び出し（BATCH-015）"
  - "親 batch-item-meaning-generation.yml / retry-failed チェーン全体改修（独立子 workflow 追加は可）"

