background: |
  統括ロードマップ #1745 の本線候補#5。依存の最低ライン（#1+#2+#4）は CLOSED
  （#1749 / #1750 / #1763）。#3 AIレーン（#1768）も完了済みだが必須依存ではない。
  #1732（batch-parent-schedule-phase2）は Human確認済み方針Aにより本Epic起票時に吸収して close する。
  Phase2成果（案B再判断材料・Slack失敗通知E2E・通知先SYSTEM_ALERTS分離・daily D1再検証PASS）は
  本Epic Branchへ取り込み済み前提。親 on.schedule はコメントアウト維持が現状。
  案B材料の推奨は「high技術検証完了後の Humanゲート」。AIは B-0/B-1 を確定しない。

objective: |
  #1732 成果を develop 反映可能な本線として引き継ぎ、B-0（無効継続）または B-1（dailyのみ有効化）を
  Human Decision Log で確定する。B-1 の場合のみ、Human明示承認後の別PRで daily on.schedule を有効化し、
  ギャップ一覧・スケジュール設計書・統括#1745追跡を更新する。

scope:
  - "#1732 Phase2成果（案B材料・Slack E2E・通知先分離・daily D1再検証）の本Epicへの吸収と develop 反映"
  - "案B採否（B-0 / B-1。B-2は非推奨）の Human Decision Log 化と正本docs同期"
  - "B-1採択かつHuman明示承認後のみ batch-daily-orchestrator.yml の on.schedule コメント解除"
  - "ギャップ一覧・バッチ実行スケジュール設計書・運用結果docsの必要最小更新"
  - "統括#1745の本線候補#5追跡更新と #1732 close（吸収完了）"

out_of_scope:
  - "Human明示承認前の on.schedule コメント解除・production無承認の定期開始"
  - "weekly schedule 有効化（案C / B-2）"
  - "BATCH-018/019 を本線 schedule に載せる変更"
  - "子 workflow への schedule 付与"
  - "GHA楽天HTTP live化・#1607 本番egress実装"
  - "DB系 / AI系 live の再実施・meaning葉の追加live実装"
  - "GitHub Secrets / Variables の値の表示・変更"
  - "OpenAPI / Orval / generated / apps/web|api|reco 変更"
  - "成功通知の新設・破壊的全件取得"

