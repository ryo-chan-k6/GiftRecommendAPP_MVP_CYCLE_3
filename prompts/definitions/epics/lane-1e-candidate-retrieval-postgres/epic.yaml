schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-lane-1e-candidate-retrieval-postgres"
  title: "レーン1e:候補Retrieval Postgres配線"
  summary: "production の Candidate Retriever / Post Hard Filter / Feature Matcher の Item 系 Port を Postgres へ配線し、GRS-REC-012（ranked_items）を解消して items≥1 または次 Blocker を明示する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  #1274 / #1275 後の再スモークで UserFeature 永続までは到達。
  現 Blocker は GRS-REC-012（ranked_items is required）。
  production の retrieval / post-filter / feature matching が InMemory scaffold
  （item-001 等）のままで、seed の UUID item / embedding が参照されない。

objective: |
  MOD-RECO-012/013/014 の Item 系 Port を Postgres 配線し、
  ローカル PUB-002 で items≥1 または次 Blocker を明示する。

scope:
  - "子 Task（implementation）"
  - "Epic Issue / Branch"
  - "Postgres Item / Embedding / ItemFeature / ItemSemantic 参照と composition 配線"
  - "必要なら test-data の item_semantic seed 補完"
  - "手順書再スモーク記録"

out_of_scope:
  - "Reason / Snapshot の全面本番永続"
  - "OpenAPI / migration / SCR / PUB-004 / Batch フルラン"
  - "Ranking アルゴリズム変更"

input:
