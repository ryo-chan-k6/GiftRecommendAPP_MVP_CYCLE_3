    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue / Branch"
  - "子 Task（implementation）"
  - "epic_scope.allowed_paths"

acceptance_criteria:
  - "Epic Issue / Branch が作成されている"
  - "子 Task PR target が親 Epic Branch"
  - "allowed_paths が reco composition / item repos / seed に整合"

