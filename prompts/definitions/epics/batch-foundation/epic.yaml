schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-foundation"
  title: "batch-foundation:Batch共通基盤"
  summary: "Phase4a。Batch infrastructure / application / config 共通基盤 Epic。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4a 共通基盤 Epic（実装フェーズ実行プロセス設計書 §6.5）。
  Phase3b（Epic A #651 / Epic C #671 merge 済み）完了後、Phase4b 縦串の前提となる batch-foundation を整備する。
  他 foundation Epic と workstream 単位で並列 `/start-epic` 可。

objective: |
  Epic Branch 上で子 Task を実行し Phase4a 共通基盤骨格を整備。Epic PR で develop へ統合する。

scope:
  - "infrastructure 共通骨格。B1。"
  - "application 層骨格。B2。"
  - "config 基盤。B3。"
  - "Epic / Task / Review Definition 整備"

out_of_scope:
  - "Phase4b 識別子 Epic 本格実装"
  - "packages/contracts/** 変更"
  - "generated 手編集"
  - "Epic D app CI"
  - "secret 実値の commit"

input:
  docs:
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
  issues:
    - number: 651
      purpose: "Epic A Python 骨格"

output:
  generated:
    expected: false
    paths: []
    handling: "none"

deliverables:
  - "Epic Issue（[Epic]batch-foundation:Batch共通基盤）"
  - "Phase4a batch-foundation 共通基盤骨格"
  - "Epic PR → develop"

acceptance_criteria:
  - "子 Task Definition が存在する"
  - "Phase4a scope 骨格が整備されている"
  - "Task PR target は親 Epic Branch、Epic PR target は develop"
  - "secret 非含有"

branch:
  no_branch: false
  summary: "batch-foundation"
  base: "develop"
  target: "develop"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "medium"

issue:
  unit: "epic"
  type: "feature"
  area: "batch"

epic_scope:
  allowed_paths:
    - "apps/batch/**"
    - "docs/05_アプリケーション設計/Batch/**"
    - "prompts/definitions/epics/batch-foundation/**"
    - "prompts/definitions/tasks/batch-foundation/**"
    - "prompts/definitions/reviews/batch-foundation/**"
  forbidden_paths:
    - "packages/contracts/**"
  child_task_areas:
    - "infrastructure-common"
    - "application-scaffold"
    - "config-foundation"

dependencies:
  issues:
    - number: 651
      purpose: "Epic A Python 骨格"
  blocking: true

review:
  human_review_required: true
  ai_review_required: true

contract_gate:
  required: false

notes:
  - "workstream_key: batch-foundation"
  - "Phase4a — 他 foundation Epic と並列可"
