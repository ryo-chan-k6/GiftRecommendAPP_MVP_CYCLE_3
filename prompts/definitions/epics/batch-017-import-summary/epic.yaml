schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-017-import-summary"
  title: "BATCH-017:Import Summary作成Batch"
  summary: "BATCH-017（Import Summary作成Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。Batch Run × source_api 単位で取込・反映・Feature/Embedding 生成件数を集計し、IF-DB-BATCH-017 で item_import_summary へ保存する。運用集計であり、商品明細・分布メトリクス本体は担当しない。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b の運用集計段。識別子単位 Epic（1 Batch ID = 1 Epic）。
  先行 BATCH-016 は develop merge 済み（#1489 / PR #1498）。
  item_import_summary テーブル定義・DDL は整備済み。
  物理書込 IF は IF-DB-BATCH-017（Import Summary保存）。Batch ID と IF 番号は一致。
  IF-DB-BATCH-016（分布メトリクス）/ IF-OBS-006（Observability）と混同禁止。
  主モジュールは MOD-BATCH-047（Item Import Summary Writer）。一覧の Import Summary Builder は同義論理名。
  冪等キーは batch_run_id + source_api。MVP は INSERT + ON CONFLICT DO NOTHING（UPDATE しない）。
  起動は各 Batch 後続 / workflow_dispatch。独立 cron なし。設計上は
  batch-distribution-metrics.yml（016+017）および import / meaning-generation 末尾への配置想定。
  現行 batch-distribution-metrics.yml は BATCH-016 のみのため、本 Epic で 017 step 追加を許容。
  親 workflow 全体改修は out_of_scope（Human 判断で独立子 workflow を MVP 正としても可）。
  Batch は HTTP API 化しないため Contract Gate は不要。後続 Batch なし。

objective: |
  BATCH-017 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-017 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-017-import-summary/**）を整理する"
  - "Contract Gate 不要方針を明示する"
  - "IF-DB-BATCH-017 / MOD-BATCH-047 / item_import_summary 冪等境界を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜016 / 018〜019）の仕様書・実装・テスト（先行は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・DB schema / migration（既存定義の参照は可）"
  - "本番リリース作業"
  - "apps/reco / apps/web / apps/api 破壊変更"
  - "BATCH-016 distribution_metrics 本体の再実装"
  - "親 daily / meaning-generation / rakuten-item-import チェーン全体改修（末尾 017 step の限定追加は Human 判断）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-017 の Batch ID・処理概要・入出力・依存・MVP・workflow 想定"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "集計・冪等・Observability 方針"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ実行スケジュール設計書.md"
      required: true
      purpose: "各子 workflow 末尾の BATCH-017 配置・独立 cron なし"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ依存関係図.md"
      required: true
      purpose: "各 Batch → 017 の集計依存"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
