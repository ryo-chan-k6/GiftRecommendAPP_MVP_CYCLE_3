background: |
  Human Decision 正本: ai-logs/human-decisions/2026-08-01-batch-local-cron-ops-next.md（#1798 / PR #1810 で develop 反映済み）。
  本線#6（#1798）は案A一旦終了。次の自動運用目標は GHA ではなく local cron。
  自動運用対象の最終形は BATCH-001〜016（017任意）だが、本Epicは Phase1 = 001〜008（+017任意）の crontab 無人運用定着のみ。
  Phase2（009〜016の親シェル配線）は別Epic。018/019・GHA schedule（#1792）・#1607・GHA楽天liveは先送り。
  起動は local 親シナリオ（daily / weekly）のみ。子 Batch の個別 cron は禁止。
  実 crontab 登録・PC/WSL 常時起動は Human。AI は手順正本化・Decision同期・観測結果docs同期を担当し、--live-rakuten 実行はしない。

objective: |
  local cron Phase1（BATCH-001〜008、+017任意）について、crontab運用手順を正本化し、
  Humanによるcron登録後の数日無人観測結果をdocsへ残し、親シェル経由のみの無人運用を定着させる。

