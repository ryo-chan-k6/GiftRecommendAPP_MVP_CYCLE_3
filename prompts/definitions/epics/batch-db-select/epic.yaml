schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-db-select"
  title: "batch-db-select:DB読取本配線"
  summary: "E2 読取残 / E3 後続。DbWriter はあるが実 DB SELECT 未配線のため、優先 Batch（005/004/010/015 等）の読取本配線と CLI exit 3 解除を行う。E4 観測・LLM・#1607 は除外。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  E0〜E3 完了。DbWriter / 代表 UPSERT（E2）と楽天・Embedding・Object Storage client（E3）は揃った。
  一方、ビジネスデータの実 DB SELECT は未配線。多くの Batch は非 scaffold-demo で
  「real DB read path is not enabled yet」→ exit 3。
  005 は Storage live まで到達できるが metadata SELECT がなく本実行できない。
  004 は live 時でも seed 空で 0 件成功になり得る。
  機能・領域単位 Epic（例外）。E4（観測横断）とは分離する。

objective: |
  読取ギャップを docs 正し、DbReader（または同等）と優先 Batch の SELECT 本配線により、
  CLI 非 demo で DB から読んで後続工程へ進める状態にする。develop 統合は本 Epic PR のみ。

scope:
  - "DB SELECT / 読取ギャップ棚卸し（docs 正本）"
  - "読取共通方針（DbReader または repos 本番読取）"
  - "Wave: 005 → 006 → 007/009 → 010〜015（004 seed は Wave A 並行可）"
  - "関連 CLI の読取経路有効化と UT"
  - "secret / .env 実値禁止"

out_of_scope:
  - "E4 観測横断の本実装"
  - "#1607 本番 egress IP 設計"
  - "Semantic LLM 本接続（010 は Rule-first 維持）"
  - "BATCH-018 Reco IF / 019 本格化"
  - "親 / 複合 workflow・schedule 有効化"
  - "production 無承認 live / CI 既定 live"
  - "OpenAPI / web / api / reco 破壊変更"
  - "DDL 新規（必要時は Human 判断・別扱い）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチIF-DB・DDL本実装ギャップ一覧.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ外部API本実装ギャップ一覧.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ横串整合・本実装ギャップ一覧.md"
      required: true
  files:
    - path: "apps/batch/src/batch/infrastructure/db/**"
      required: true
    - path: "apps/batch/src/batch/application/**"
      required: true

output:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/**"
      action: "update"
      required: true
  files:
    - path: "apps/batch/src/batch/infrastructure/db/**"
      action: "update"
      required: false
    - path: "apps/batch/src/batch/application/**"
      action: "update"
      required: false
    - path: "prompts/definitions/epics/batch-db-select/**"
      action: "create"
      required: true
    - path: "prompts/definitions/tasks/batch-db-select/**"
      action: "create"
      required: false
    - path: "prompts/definitions/reviews/batch-db-select/**"
      action: "create"
      required: true
  generated:
    expected: false
    paths: []
    handling: "none"

deliverables:
  - "Epic Issue / Branch"
  - "SELECT ギャップ正本 docs（第1 Task）"
  - "後続 Task（reader / 005 / 004 / 010 / 015 等）の分割"

acceptance_criteria:
  - "Epic Issue / Branch が作成されている"
  - "ギャップ一覧 docs が存在する（第1 Task）"
  - "E4 / LLM / #1607 / 018・019 を out of scope と明記"
  - "secret 実値なし"
  - "Epic PR target が develop"

