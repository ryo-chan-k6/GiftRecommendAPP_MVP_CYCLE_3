schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-reco-stg-latency"
  title: "reco-stg-latency:Reco stgレイテンシ改善"
  summary: "接続プール導入後も推薦実行が GRS-REC-101 / HTTP 504 になる。主因は Supabase stg（ap-southeast-1）と Fly（NRT）のリージョン差によるクエリ往復レイテンシ。リージョン移行とコード側のDB往復削減で恒久対応する。"
  phase: "07_開発・単体テスト"

work_mode: "ai-agent"

parent:
  epic_id: null
  epic_issue_number: null
  epic_branch: null
  related_issues:
    - 144
    - 1686
    - 1737
  related_prs:
    - 1744

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  接続プール導入 Epic #1737 / PR #1744 は develop に merge 済み。
  プール化により Reco health は 0.76〜0.82s → 約 0.27s に短縮し、
  接続確立コストは排除された。

  しかし stg 実測で推薦実行は依然 GRS-REC-101 / HTTP 504 になる。

  切り分け結果（事実）:
  - phase_log（owner_type = recommendation_run）に request_received/started と
    config_resolved/succeeded の 2 行のみ記録される
  - MOD-RECO-003（config resolver）と MOD-RECO-002（run recorder）完了後、
    MOD-RECO-004 開始時の hard timeout チェックで GRS-REC-101 を送出している
  - config_resolved の duration_ms は 2,786ms。MOD-RECO-003 の 13 SELECT で
    1 クエリあたり約 214ms
  - Supabase stg は ap-southeast-1（シンガポール）、Fly は NRT（東京）
  - health（SELECT 1 相当）が約 0.27s であることと整合し、
    1 クエリ約 214ms はリージョン差によるネットワーク往復が主因（推論）

  推薦 1 回のパイプライン全体では 50〜80 回の DB 往復が必要なため、
  1 往復 200ms 級では 4,000ms 内完走は不可能。
  リージョンを揃えれば 1 往復が数十 ms 級となり、4,000ms 内完走が見込める。

objective: |
  Supabase stg を Fly と同一リージョン（東京 / ap-northeast-1）へ移行し、
  あわせてコード側の DB 往復を削減することで、
  stg で推薦実行が hard timeout 内に完走し 504 にならない状態にする。

scope:
  - "Supabase stg を東京リージョンへ再作成し migration / master seed を再投入する（Human-Led Task）"
  - "移行手順を簡易stg構築手順へ反映する"
  - "PostgresDatabaseSession の読み取りクエリにおける COMMIT 往復削減（AI Task）"
  - "MOD-RECO-003 config resolver のマスタ参照キャッシュ化（AI Task）"
  - "子 Task の起票・完了追跡"

out_of_scope:
  - "PIPELINE_SOFT_TIMEOUT_MS / PIPELINE_HARD_TIMEOUT_MS の値変更（別 Issue）"
  - "apps/api 側の同種問題（masters で 1 クエリ約 1 秒）"
  - "推薦ロジック・スコアリングの変更"
  - "DB スキーマ・migration 内容の変更（seed 再投入は移行手順の一部として実施）"
  - "本番（prod）環境のリージョン設計"
  - "secret 実値の取り扱い"

