schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-mod-reco-019-final-score-calculator"
  title: "MOD-RECO-019:Final Score Calculator"
  summary: "MOD-RECO-019（Final Score Calculator / 最終スコア算出）に関するモジュール仕様書・実装・単体テストを管理するEpic。MOD-RECO-001 Orchestrator から呼び出され、推薦パイプラインの Ranking 責務を担う（処理種別: OL）。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  06_実装設計および 07_開発・単体テストにおいて、MOD-RECO-019（Final Score Calculator）に関する設計・実装・テストを、Epic Issue と Epic Branch で一元管理する。
  本モジュールは Recoモジュール一覧 §4 / §6 の Ranking 分類モジュール（処理種別: OL、MVP対象 ○）である。
  MOD-RECO-001 Recommendation Orchestrator から `ExecutionContext` 経由で呼び出される。
  本 Epic は **Recoモジュール本体**（`apps/reco/src/reco/application/final-score-calculator/**`）に限定し、エンドポイント層（`apps/reco/src/reco/api/**`）は [Epic]API-INT-002 配下とする。
  並列着手ウェーブ目安: 4（bootstrap Issue 参照）。

objective: |
  MOD-RECO-019 に関する Epic Issue と Epic Branch を作成し、配下 Task（モジュール仕様書 / 実装 / 単体テスト）の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う。

scope:
  - "MOD-RECO-019 に関する子 Task の作業単位を整理する（モジュール仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/mod-reco-019-final-score-calculator/**）を整理する"

out_of_scope:
  - "API-INT-002 エンドポイント層（`apps/reco/src/reco/api/**`）"
  - "API-PUB-002 Public API 実装"
  - "MOD-RECO-001 Orchestrator 本体の変更（別 Epic #260）"
  - "他 Recoモジュール（当該 MOD-RECO-019 以外）本体の設計・実装"
  - "画面（SCR-*）の設計・実装"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema 変更（専用 Task へ切り出し）"

