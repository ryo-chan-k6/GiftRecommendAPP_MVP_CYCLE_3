background: |
  #1277 / #1288 後、PUB-002 は items≥1 まで到達したが、
  recommendation_result / recommendation_result_item は InMemory INSERT のまま。
  SCR-004 / 結果再取得・E2E の DB 正本化のため永続が必要。
  item FK があるため、親ヘッダ（021）も同一 Epic で最小配線する。

objective: |
  production composition に 021 header / 022 item の Postgres INSERT を配線し、
  ローカル PUB-002 再スモークで DB 行存在を確認する。

