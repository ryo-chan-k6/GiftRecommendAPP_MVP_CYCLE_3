  - "専用 loading route を本 Epic で新設してしまう運用ミス"
  - "SCR-008 / SCR-009 包括仕様や recommendation-result 大規模改修を混入する運用ミス"
  - "OpenAPI / apps/api / packages/contracts を本 Epic で変更する運用ミス"

human_decision_points:
  - "SCR-003 は画面状態として仕様化する（独立 URL 画面ではない）— Human 確定済み"
  - "URL案 `/recommendations/loading` は参考。MVP は recommendation-input 内 LoadingPanel を正とし、専用 route 新設は原則 out of scope — Human 確定済み"
  - "#1344（D1 residual）は CLOSED / MERGED のため競合なし — Human 確定済み"
  - "キャンセル導線（入力画面へ戻る）の MVP 対象（画面一覧では △）の採否は screen-spec で整理し Human Review で確認"

stop_conditions:
