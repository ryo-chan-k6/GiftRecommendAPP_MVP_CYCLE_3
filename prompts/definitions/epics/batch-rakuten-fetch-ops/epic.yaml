epic:
  id: "epic-batch-rakuten-fetch-ops"
  title: "batch-rakuten-fetch-ops:楽天Fetch運用方針確定"
  summary: "常用QPS=2等の決定済み前提を固定し、取得量・Run分割・paused再開・GHA live条件の運用方針を正本化する。001〜004のlive実装は次Epic。機能・領域単位Epic（例外）。統括は#1745。"
  workstream_key: "batch-rakuten-fetch-ops"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  楽天APIは常用QPS=2・ハードキャップ10・live時egress IP照合必須・CI live禁止が決定済み。
  Rate Limiter本実装・正式契約反映は完了済み。未確定なのは運用側（1日あたりの量、分割、
  rate_limited→paused後の再開、GHA葉をscaffoldからliveにする条件）である。
  本Epicは方針正本化が本体。001〜004のlive切替実装は batch-live-rakuten-fetch に分離する。
  統括ロードマップは #1745（formal parentなし。Relationships追跡）。

objective: |
  楽天Fetch（BATCH-001〜004）を安全にlive/手動運用するための運用方針を docs 正本化し、
  後続の batch-live-rakuten-fetch / daily schedule 判断のゲートを満たす。

scope:
  - "決定済み前提（QPS=2 / キャップ10 / IP照合 / CI live禁止）の運用docsへの収束"
  - "取得量上限（max_items / max_pages / 対象ジャンル / 004再確認件数）の推奨値と検証用低値の整理"
  - "QPS=2前提の長時間Run分割・同時多発回避の方針"
  - "rate_limited → fetch_cursor.paused と paused/failed 再開の運用手順"
  - "GHA葉ジョブを --scaffold-demo から live にする条件（固定egress設計自体は含めない）"
  - "安全側常用QPS=1の採否をHuman判断材料として明文化"
  - "統括#1745からの本線追跡更新"

out_of_scope:
  - "BATCH-001〜004のlive切替実装本体（後続 batch-live-rakuten-fetch）"
  - "Rate Limiter / HttpRakuten clientの再実装"
  - "本番egress IP / NAT / self-hosted設計・構築（#1607。吸収しない）"
  - "daily/weekly on.schedule有効化"
  - "DB系 / AI系 live切替"
  - "OpenAPI / Orval / generated変更"
  - "GitHub Secrets / Variablesの値の表示・変更"
  - "常用QPSの再改訂（新実験＋新Human決定なし）"

