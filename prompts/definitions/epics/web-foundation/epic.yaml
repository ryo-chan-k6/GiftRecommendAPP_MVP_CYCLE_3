schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-web-foundation"
  title: "web-foundation:Web共通基盤"
  summary: "Phase4a。Web デザインルール・共通 UI・styles・component test 基盤を整備する Epic。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4a 共通基盤 Epic（実装フェーズ実行プロセス設計書 §6.5）。
  Phase3b（Epic A #651 / Epic C #671 merge 済み）完了後、Phase4b 縦串の前提となる web-foundation を整備する。
  他 foundation Epic と workstream 単位で並列 `/start-epic` 可。

objective: |
  Epic Branch 上で子 Task を実行し Phase4a 共通基盤骨格を整備。Epic PR で develop へ統合する。

scope:
  - "デザインルール・UIコンポーネント一覧 docs。W1。"
  - "apps/web/src/components 共通 UI 骨格。W2。"
  - "apps/web/src/styles 基盤。W3。"
  - "apps/web/tests/component + Vitest 骨格。W4。"
  - "Epic / Task / Review Definition 整備"

out_of_scope:
  - "Phase4b 識別子 Epic 本格実装"
  - "packages/contracts/** 変更"
  - "generated 手編集"
  - "Epic D app CI"
  - "secret 実値の commit"

input:
  docs:
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
  issues:
    - number: 651
      purpose: "Epic A monorepo 骨格"

output:
  generated:
    expected: false
    paths: []
    handling: "none"

deliverables:
  - "Epic Issue（[Epic]web-foundation:Web共通基盤）"
  - "Phase4a web-foundation 共通基盤骨格"
  - "Epic PR → develop"

acceptance_criteria:
  - "子 Task Definition が存在する"
  - "Phase4a scope 骨格が整備されている"
  - "Task PR target は親 Epic Branch、Epic PR target は develop"
  - "secret 非含有"

branch:
  no_branch: false
  summary: "web-foundation"
  base: "develop"
  target: "develop"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"

issue:
  unit: "epic"
  type: "feature"
  area: "web"

epic_scope:
  allowed_paths:
    - "apps/web/src/components/**"
    - "apps/web/src/styles/**"
    - "apps/web/tests/**"
    - "apps/web/package.json"
    - "apps/web/vitest.config.ts"
    - "docs/05_アプリケーション設計/アプリ/web/**"
    - "prompts/definitions/epics/web-foundation/**"
    - "prompts/definitions/tasks/web-foundation/**"
    - "prompts/definitions/reviews/web-foundation/**"
  forbidden_paths:
    - "apps/web/src/generated/**"
    - "apps/web/src/app/**"
    - "packages/contracts/**"
  child_task_areas:
    - "design-system-rules"
    - "common-ui-components"
    - "styles-foundation"
    - "component-test-scaffold"

dependencies:
  issues:
    - number: 651
      purpose: "Epic A monorepo 骨格"
  blocking: true

review:
  human_review_required: true
  ai_review_required: true

contract_gate:
  required: false

notes:
  - "workstream_key: web-foundation"
  - "Phase4a — 他 foundation Epic と並列可"
