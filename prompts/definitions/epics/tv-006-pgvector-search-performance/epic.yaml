schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-tv-006-pgvector-search-performance"
  title: "PoC:TV-006pgvector検索性能"
  summary: "TV-006。pgvector 類似検索の件数別応答時間・index（HNSW）効果を ephemeral DB 上で計測し、DB / Retrieval 設計への入力を残す。TV-007 で未実施だった件数スケールを本 TV で消化する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"
    - "docs-reviewer-ai"

background: |
  TV進捗は TV-006 = 方針のみ・Issue 未起票。方針書は #1496 由来で存在する。
  TV-007 Phase2 で Retrieval は seed 3 件のみ計測し、件数別（100/500/1,000）と index 件数スケールは未実施。
  物理索引は item_embedding に HNSW（vector_cosine_ops）が定義済み。
  Human（2026-07-22）: TV-005 完了後に TV-006 へ進む。

objective: |
  件数別・index 有無（または HNSW 効果）の検索時間を計測し、結果 doc と Go/Adjust/Block を残す。
  正式 DB/Retrieval docs 更新は別 Task（S4 後）。

scope:
  - "TV-006 方針・TV進捗・全体計画フォーカスの更新"
  - "検証計画 / 結果 doc（docs/90_PoC/技術検証結果/）"
  - "計測スクリプト（scripts/perf または同等。ephemeral DB）"
  - "件数スケール（推奨: 100 / 500 / 1,000）と index 効果の比較"
  - "Epic / Task / Review Definition"

