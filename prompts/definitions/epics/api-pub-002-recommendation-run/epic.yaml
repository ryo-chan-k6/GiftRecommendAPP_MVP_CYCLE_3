schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-api-pub-002-recommendation-run"
  title: "API-PUB-002:レコメンド実行"
  summary: "API-PUB-002（レコメンド実行 / Public API、POST /api/v1/recommendations）に関するAPI仕様書・OpenAPI連携・API実装・単体テストを管理するEpic。web からの推薦実行を受け付け、内部で API-INT-002 を呼び出して結果を返す MVP の中核 Public API。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/create-contract-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
    - "contract-ai"
  review:
    - "reviewer-ai"

background: |
  06_実装設計および 07_開発・単体テストにおいて、API-PUB-002（レコメンド実行 / Public API）に関する設計・実装・テストを、Epic Issue と Epic Branch で一元管理する。Epic の Projects Phase は完了ゲート（07）、子 Task で成果物工程（06 / 07）を管理する。
  本 API は web 向けに `POST /api/v1/recommendations` を提供し、Recommendation Request を受け取り、apps/api → apps/reco（API-INT-002）への内部呼び出しを経て Recommendation Result を返す MVP の中核 API である。
  子 Task は Public API 仕様書・OpenAPI 連携（Contract Task として分離想定）・apps/api 実装・apps/web の API client 利用・単体テスト単位に分割し、Task PR は親 Epic Branch に向ける。

objective: |
  API-PUB-002 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  apps/reco の実装変更が必要になった場合は、本 Epic ではなく依存 Epic（[Epic]API-INT-002 / [Epic]MOD-RECO-001）配下の Task として切る運用を明示する。
  develop への統合は本 Epic PR のみで行う。

scope:
  - "API-PUB-002 に関する子 Task の作業単位を整理する（API仕様書 / OpenAPI連携 / api実装 / api-client / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/api-pub-002-recommendation-run/**）を整理する"
  - "依存 Epic（API-INT-002 / MOD-RECO-001）の Status を子 Task 開始前に確認する運用を明示する"
  - "OpenAPI / Orval / generated 変更を含む子 Task は Contract Task として分離する方針を明示する"

out_of_scope:
  - "API-INT-002（Reco推薦実行 / Internal API）の仕様・実装変更（[Epic]API-INT-002 で扱う）"
  - "Recoモジュールの設計・実装（[Epic]MOD-RECO-001 等で扱う）"
  - "画面（SCR-002 等）の設計・実装"
  - "Batch 実装"
  - "DB schema 変更"
  - "認証・認可方式そのものの変更"
  - "本番リリース作業"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "API-PUB-002 の endpoint / API種別（Public API）/ Method / MVP対象 / api→reco 連携を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API設計方針書.md"
      required: true
      purpose: "URL 設計・HTTP Method・認証・Error 形式・バージョニングの方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/モジュール一覧.md"
      required: true
      purpose: "MOD-API-001〜MOD-API-006（Recommendation Controller / Validator / Application Service / Repository / Reco Client / Response Mapper）の責務境界を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能×モジュール対応表.md"
      required: false
      purpose: "API-PUB-002 / API-INT-002 / MOD-API-* / MOD-RECO-001 の対応関係を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: true
      purpose: "Error Response / HTTP Status / ユーザー向け表示方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: true
      purpose: "API-PUB-002 の trace_id / access_log / phase_log / error_log / metric 方針を確認するため"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic 方針（§3.5）・API-PUB-002 縦串例（§3.5.4）・依存 Epic 図（§3.5.3）を確認するため"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic タイトル規約（§15.0）・個別API Task 命名（§15.2）を確認するため"
  templates: []
  files: []
  issues: []
  prs: []

output:
  docs: []
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue（タイトル: [Epic]API-PUB-002:レコメンド実行）"
  - "Epic Branch（develop 起点 / feature/epic-<issue-number>-api-pub-002-recommendation-run）"
  - "子 Task 候補一覧（API仕様書 / OpenAPI / api 実装 / api-client / 単体テスト）"
  - "epic_scope.allowed_paths による配下 Task のファイル境界宣言"
  - "依存 Epic（API-INT-002 / MOD-RECO-001）の参照"

acceptance_criteria:
  - "Epic Issue が作成されている"
  - "Issue タイトルが [Epic]API-PUB-002:レコメンド実行 形式である（Task Definition設計書 §15.0）"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "配下 Task の作業単位（API仕様書 / OpenAPI / api 実装 / api-client / 単体テスト）が整理されている"
  - "子 Task の PR target が親 Epic Branch である方針が明記されている"
  - "epic_scope.allowed_paths が成果物化方針書 §3.5.4 の例（apps/api/src/app/recommendations/** など）と整合している"
  - "依存 Epic に API-INT-002 / MOD-RECO-001 が dependencies.epics として記載されている（Issue 番号確定後に追記）"

branch:
  no_branch: false
  name: "feature/epic-<issue-number>-api-pub-002-recommendation-run"
  base: "develop"
  target: "develop"
  worktree_required: false

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: null
    due_date: null

issue:
  unit: "epic"
  type: "feature"
  area: "api"

epic_scope:
  artifact_id: "API-PUB-002"
  allowed_paths:
    - "docs/06_実装設計/api/API-PUB-002_*"
    - "apps/api/src/app/recommendations/**"
    - "apps/web/src/lib/api-client/recommendations/**"
    - "openapi/paths/recommendations/**"
    - "openapi/components/schemas/recommendation/**"
    - "prompts/definitions/tasks/api-pub-002-recommendation-run/**"
    - "prompts/definitions/reviews/api-pub-002-recommendation-run/**"
  forbidden_paths:
    - "apps/reco/**"
    - "apps/batch/**"
    - "apps/web/src/app/**"
    - "apps/web/src/features/**"
    - "openapi/internal/**"
    - "db/**"
  child_task_areas:
    - "api-spec"
    - "openapi"
    - "implementation"
    - "api-client"
    - "unit-test"

dependencies:
  epics: []  # 依存Epic: [Epic]API-INT-002:Reco推薦実行 / [Epic]MOD-RECO-001:Recommendation Orchestrator（実Issue番号確定後に追加）。成果物化方針書 §3.5.3 / §3.5.4。
  issues: []
  prs: []
  tasks: []
  blocking: false

parallel_control:
  depends_on: []
  blocks: []
  exclusive_files: []
  conflict_risk: "medium"
  contract_impact: true
  generated_impact: true
  db_impact: false

test_policy:
  required: []
  commands: []
  manual_checks:
    - "Epic scope が API-PUB-002（Public API レイヤ）に閉じているか確認する"
    - "apps/reco 変更が混入していないか確認する"
    - "子 Task に分割可能な粒度か確認する"
    - "依存 Epic [Epic]API-INT-002 / [Epic]MOD-RECO-001 の有無を確認する"
  not_required:
    - "unit test"
    - "integration test"
    - "contract test"
  skip_reason:
    "unit test": "Epic は作業管理単位のため対象外"
    "integration test": "Epic は作業管理単位のため対象外"
    "contract test": "OpenAPI 変更を伴う子 Task でのみ実施するため、Epic 直下では対象外"

review:
  human_review_required: true
  ai_review_required: false
  review_points:
    - "Epic の作業範囲が Public API レイヤに閉じているか（apps/reco 変更を含めていないか）"
    - "epic_scope.allowed_paths / forbidden_paths が成果物化方針書 §3.5.4 と整合しているか"
    - "依存 Epic [Epic]API-INT-002 / [Epic]MOD-RECO-001 が dependencies.epics に追記される運用が明示されているか"
    - "OpenAPI / generated 変更を Contract Task として分離する方針が明示されているか"
    - "Epic PR target が develop であるか"
  specialist_reviews:
    docs: false
    test: false
    contract: true
    security: false

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: true
    experiments: true
  reason: "本 Epic は OpenAPI / Orval / generated への影響を持つため、横断影響が判明した時点で ai-logs/cross-cutting への記録余地を残す。Epic の作業計画は Issue、統合は Epic PR を正本とする。"

risk_points:
  - "apps/reco 変更が誤って配下 Task に混入し scope 越境する可能性"
  - "OpenAPI / generated 変更を通常 Task に混入させ Contract Task 分離を逃す可能性"
  - "依存 Epic [Epic]API-INT-002 が未起票のまま子 Task を開始する運用ミス"
  - "Task PR を誤って develop へ直接向けてしまう運用ミス"

human_decision_points:
  - "依存 Epic [Epic]API-INT-002 / [Epic]MOD-RECO-001 の Issue 番号確定タイミング"
  - "OpenAPI 変更を Contract Task として分離するタイミング"
  - "子 Task の分割粒度（API仕様書 / OpenAPI / 実装 / api-client / 単体テストの切り方）"
  - "Recommendation Response の reason / score / debug 情報の表面化範囲（API-INT-002 / MOD-RECO 側との整合）"

stop_conditions:
  - "必須 input.docs が存在しない場合"
  - "API一覧に API-PUB-002 が存在しない場合、または MVP対象が ○ ではない場合"
  - "epic_scope.allowed_paths が空または未記載の場合"
  - "Task PR の target が develop に向く設計が必要になった場合"
  - "apps/reco 配下への変更を本 Epic 配下 Task で実施する必要が出た場合（[Epic]API-INT-002 / [Epic]MOD-RECO-001 配下 Task へ切り出す）"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "Epic は作業管理単位であり、API仕様書本体・実装・テストの正本は子 Task で作成する"
  - "命名の正本は Task Definition設計書 §15.0（Epic タイトル規約）・§15.2（個別API Task）"
  - "本 Epic 配下の最初の子 Task は prompts/definitions/tasks/api-pub-002-recommendation-run/api-spec.yaml"
  - "依存 Epic Issue 番号は実 Issue 起票後に dependencies.epics へ追記する（成果物化方針書 §3.5.3 / §3.5.4）"
  - "OpenAPI / generated 変更を伴う子 Task は Contract Definition として分離する（成果物化方針書 §3）"
