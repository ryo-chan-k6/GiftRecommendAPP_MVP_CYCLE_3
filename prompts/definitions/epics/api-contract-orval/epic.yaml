schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-api-contract-orval"
  title: "API-CONTRACT-ORVAL:API契約基盤"
  summary: "packages/contracts・orval.config.ts・generated の横断 Contract 基盤 Epic。識別子 Epic の 1b/1c は本 Epic Branch を PR target とする。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/create-contract-task"
  next:
    success: "/create-contract-task"

agent:
  primary: "orchestrator-ai"
  support:
    - "contract-ai"
  review:
    - "reviewer-ai"
    - "contract-ai"

background: |
  Phase1 パターン A: OpenAPI 1b/1c を識別子 Epic ではなく本 Epic Branch に集約する。

objective: |
  packages/contracts 初回作成、INT/PUB OpenAPI 反映、Orval 再生成を Contract Task で本 Epic Branch にマージする。

scope:
  - "packages/contracts/**"
  - "orval.config.ts"
  - "generated 再生成（Contract Task）"

out_of_scope:
  - "識別子契約仕様書 docs（各識別子 Epic）"
  - "apps 実装"

branch:
  no_branch: false
  name: "feature/epic-<issue-number>-api-contract-orval"
  base: "develop"
  target: "develop"

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"

issue:
  unit: "epic"
  type: "feature"
  area: "api"

epic_scope:
  artifact_id: "API-CONTRACT-ORVAL"
  allowed_paths:
    - "packages/contracts/**"
    - "orval.config.ts"
    - "apps/web/src/generated/api/**"
    - "apps/api/src/generated/reco-client/**"
  forbidden_paths:
    - "docs/06_実装設計/api/**"
    - "apps/api/src/app/**"
    - "apps/reco/**"
  child_task_areas:
    - "openapi"
    - "orval"

dependencies:
  epics: []

parallel_control:
  exclusive_files:
    - "packages/contracts/openapi/public-api.yaml"
    - "packages/contracts/openapi/internal-reco-api.yaml"
    - "orval.config.ts"
  conflict_risk: "high"
  contract_impact: true
  generated_impact: true

review:
  human_review_required: true
  specialist_reviews:
    contract: true

notes:
  - "Phase1 第1波 B5-B7 および第2波 C3 の PR target"
