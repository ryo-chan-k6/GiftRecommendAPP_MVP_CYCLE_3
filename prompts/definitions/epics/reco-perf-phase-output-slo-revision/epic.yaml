  title: "docs:phase_output soft/hard見直し"
  summary: "計測定義修正（#1544 / #1550）後の再計測根拠に基づき、MOD-RECO-001 §13.2 および性能要件 §5 の phase_output soft/hard を見直す。最終数値は Human Review で確定する。User Meaning 性能改善・ボリュームテストは out of scope。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"

background: |
  #1539 / #1541 で phase_output 案 A（soft 3s / hard 7s）を正本へ転記した。
  #1544 / #1550 で bench から response_built 累積を除外した結果、mock の phase_output p95 は約 105ms となり、
  案 A は旧合算根拠のまま残っている。Human 判断（2026-07-22）: User Meaning 性能改善（後続 D）は
  ボリュームテスト等の後の統合タスクとし未着手。本 Epic は正本数値見直し（後続 1）を先に行う。

objective: |
  新計測定義に整合する phase_output soft/hard を正本へ反映する（Human 確定値）。
  必要なら secrets 再計測を行い根拠を補強する。
  設計反映メモ・未決事項を閉じる。

scope:
  - "MOD-RECO-001 §13.2（phase_output / §13.2.5 / 関連 §16）"
  - "性能要件（バックエンド）§4.1 / §5 の phase_output 関連"
  - "設計反映メモ・Phase3 結果 doc のステータス／数値整合（最小）"
  - "必要なら scripts/perf による再計測（mock 必須、secrets は Human 判断）"
  - "Epic / Task / Review Definition"

out_of_scope:
  - "User Meaning 性能改善（後続 D・統合タスク）"
  - "ボリュームテスト / 件数スケール本実施"
  - "TV-005 / TV-006（後続 3）"
  - "apps/** 実装変更（timeout 定数追従は別実装 Task）"
