schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-lane-1f-ng-normalize-api"
  title: "レーン1f:NG正規化api正本化"
  summary: "INT-002 NgCondition に ngKeywords/ngCategories を契約反映し、api で ngText から実効キーワードを派生して reco へ渡す（MOD-RECO-012 正本化）。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed: ["/start-epic", "/start-task", "/create-contract-task", "/summarize-work"]
  next:
    success: "/create-contract-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support: ["support-ai", "contract-ai"]
  review: ["reviewer-ai", "contract-ai"]

background: |
  レーン1e で reco PreFilter に ngText 実効キーワード暫定を入れた。
  MOD-RECO-012 は NG 正規化を api 正本とする。INT-002 契約は ngKeywords/ngCategories があるが OpenAPI/実装未反映。
  request_mapper も ng_text のみ map している。

objective: |
  Internal OpenAPI + Orval 反映後、api が ngText→ngKeywords を派生し、reco が受け取り PreFilter に使う。
  reco 側の request.ng_text 再抽出は削除して正本整合させる。

scope:
  - "Contract Task（OpenAPI + Orval）"
  - "api normalize + reco mapper / prefilter 正本化"
  - "UT・手順書"

out_of_scope:
  - "public-api.yaml / web / SCR-002"
  - "DB migration"
  - "preferredKeywords / nonPreferredKeywords"
  - "PostFilter alcohol_ng"
  - "ngCategories SQL 除外の本実装"

