schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-phase1-wave2-api-contract-foundation"
  title: "Phase1第2波 API Contract基盤"
  summary: "Phase1 第2波（8 API）の契約仕様書・OpenAPI・Orval/generated を識別子/横断 Epic Branch から統合し、Contract Gate 通過後に 1 本の Epic PR で develop に反映するマイルストーン Epic。識別子 Epic（#384〜#391）および横断 Epic #367 は Open 維持。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/create-pr"
    - "/summarize-work"
  next:
    success: "/create-pr"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
    - "contract-ai"
  review:
    - "reviewer-ai"
    - "contract-ai"

background: |
  識別子単位 Epic（第2波 8 API）は Phase1 + Phase4b の縦串管理のため、Phase1 単体では develop に merge できない。
  第2波の契約 docs（1a）・OpenAPI（1b）・Orval/generated（1c）は、識別子 Epic Branch（#384〜#391）および横断 Epic Branch（#367）上で完了している。
  本 Epic は機能・領域単位の Phase1 マイルストーン（例外）として、上記成果を staging 統合し Contract Gate §4 を満たしたうえで develop へ 1 本の Epic PR で反映する。
  識別子 Epic #384〜#391 / 横断 Epic #367 は CLOSE せず、Phase4b 作業の PR target として継続利用する。
  第1波（PUB-002 / INT-002）は #382 merge 済み。本 Epic は第2波追加分の develop 反映を担う。

objective: |
  Phase1 第2波の API Contract 基盤（8 API の契約仕様書、packages/contracts/openapi 追加分、generated 追加分）をマイルストーン Epic Branch に統合する。
  Contract Gate §4 を満たしたうえで Epic PR を develop に向け、Human merge により Phase1 第2波の develop 反映を完了する。
  Phase1 全体（第1波 + 第2波）の MVP 10 API Contract 基盤を develop 上で揃える。

scope:
  - "feature/epic-367-api-contract-orval から第2波 OpenAPI / generated / Contract Definition を統合"
  - "識別子 Epic Branch（#384〜#391）から 1a 契約仕様書・Task Definition・pr-review を統合"
  - "マイルストーン Epic Branch 上で Contract Gate §4 を確認"
  - "Epic PR（okuri-ai-bot author）を develop に向けて作成"
  - "epic/pr-review.yaml の整備"

out_of_scope:
  - "apps/** の実装変更（Phase4b）"
  - "識別子 Epic #384〜#391 の Issue CLOSE"
  - "横断 Epic #367 の廃止"
  - "第1波（PUB-002 / INT-002）の再統合（#382 済み）"
  - "Phase4b 縦串（実装仕様書→実装→単体テスト）"

input:
  docs:
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase1 マイルストーン Epic の位置づけ（§6.2）を確認するため"
    - path: "docs/00_共通/AIエージェント運用/Contract Gate運用設計書.md"
      required: true
      purpose: "Gate §4 / §6 の通過条件を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "第2波対象 API（8 本）の確認"
  issues:
    - number: 367
      purpose: "横断 Epic（1b/1c 成果供給）"
    - number: 384
      purpose: "識別子 Epic API-PUB-001"
    - number: 385
      purpose: "識別子 Epic API-PUB-003"
    - number: 386
      purpose: "識別子 Epic API-PUB-004"
    - number: 387
      purpose: "識別子 Epic API-PUB-005"
    - number: 388
      purpose: "識別子 Epic API-PUB-006"
    - number: 389
      purpose: "識別子 Epic API-PUB-007"
    - number: 390
      purpose: "識別子 Epic API-PUB-008"
    - number: 391
      purpose: "識別子 Epic API-INT-001"

output:
  generated:
    expected: true
    paths:
      - "apps/web/src/generated/api/"
      - "apps/api/src/generated/reco-client/"
    handling: "orval_regenerate_only"

deliverables:
  - "Epic Issue（タイトル: [Epic]Phase1第2波 API Contract基盤）"
  - "Epic Branch（develop 起点）"
  - "統合済み packages/contracts/openapi（第2波 8 API 追加分）"
  - "統合済み generated（Orval 1c 成果）"
  - "統合済み第2波 8 API 契約仕様書"
  - "Epic PR → develop（Human merge 待ち）"

acceptance_criteria:
  - "Epic Issue が作成されている"
  - "Issue タイトルが [Epic]Phase1第2波 API Contract基盤 形式である"
  - "Epic Branch が develop から作成されている"
  - "packages/contracts/openapi に第2波 8 API が反映されている"
  - "generated が Orval 再生成済みで手動編集なし"
  - "第2波 8 API の契約仕様書が docs/06_実装設計/api/ に存在する"
  - "Contract Gate §4 が充足している"
  - "epic/pr-review.yaml が Branch 上に存在する"
  - "Epic PR author が okuri-ai-bot である"
  - "#367 / #384〜#391 は CLOSE されていない"

branch:
  no_branch: false
  name: "feature/epic-432-phase1-wave2-api-contract-foundation"
  base: "develop"
  target: "develop"

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"

issue:
  unit: "epic"
  type: "feature"
  area: "api"

epic_scope:
  artifact_id: ""
  allowed_paths:
    - "docs/06_実装設計/api/API-PUB-001_*"
    - "docs/06_実装設計/api/API-PUB-003_*"
    - "docs/06_実装設計/api/API-PUB-004_*"
    - "docs/06_実装設計/api/API-PUB-005_*"
    - "docs/06_実装設計/api/API-PUB-006_*"
    - "docs/06_実装設計/api/API-PUB-007_*"
    - "docs/06_実装設計/api/API-PUB-008_*"
    - "docs/06_実装設計/api/API-INT-001_*"
    - "packages/contracts/**"
    - "orval.config.ts"
    - "apps/web/src/generated/api/**"
    - "apps/api/src/generated/reco-client/**"
    - "prompts/definitions/epics/phase1-wave2-api-contract-foundation/**"
    - "prompts/definitions/reviews/phase1-wave2-api-contract-foundation/**"
    - "prompts/definitions/contracts/**"
    - "prompts/definitions/reviews/pub-*-openapi/**"
    - "prompts/definitions/reviews/phase1-wave2-orval-regenerate/**"
    - "prompts/definitions/reviews/api-pub-00*"
    - "prompts/definitions/reviews/api-int-001*"
    - "prompts/definitions/tasks/api-pub-00*"
    - "prompts/definitions/tasks/api-int-001*"
    - "prompts/definitions/reviews/sync-develop/**"
  forbidden_paths:
    - "apps/api/src/app/**"
    - "apps/reco/**"
    - "apps/web/src/app/**"
    - "apps/web/src/features/**"
    - "apps/batch/**"
    - "db/**"
    - "openapi/**"

dependencies:
  epics:
    - issue: 367
      title: "[Epic]API-CONTRACT-ORVAL"
      purpose: "1b/1c 成果供給元"
    - issue: 384
      title: "[Epic]API-PUB-001:APIヘルスチェック"
      purpose: "1a 契約仕様書供給元"
    - issue: 385
      title: "[Epic]API-PUB-003:商品詳細取得"
      purpose: "1a 契約仕様書供給元"
    - issue: 386
      title: "[Epic]API-PUB-004:Feedback送信"
      purpose: "1a 契約仕様書供給元"
    - issue: 387
      title: "[Epic]API-PUB-005:Relationshipマスタ取得"
      purpose: "1a 契約仕様書供給元"
    - issue: 388
      title: "[Epic]API-PUB-006:Occasionマスタ取得"
      purpose: "1a 契約仕様書供給元"
    - issue: 389
      title: "[Epic]API-PUB-007:Semantic設定取得"
      purpose: "1a 契約仕様書供給元"
    - issue: 390
      title: "[Epic]API-PUB-008:Featureルール取得"
      purpose: "1a 契約仕様書供給元"
    - issue: 391
      title: "[Epic]API-INT-001:Recoヘルスチェック"
      purpose: "1a 契約仕様書供給元"
  blocking: true

parallel_control:
  exclusive_files:
    - "packages/contracts/openapi/public-api.yaml"
    - "packages/contracts/openapi/internal-reco-api.yaml"
  conflict_risk: "high"
  contract_impact: true
  generated_impact: true

test_policy:
  manual_checks:
    - "統合後の OpenAPI が第2波 8 API 契約仕様書と整合しているか"
    - "generated 差分が Orval 生成由来のみか"
    - "Contract Gate §4 全項目を確認する"
    - "Epic PR author が okuri-ai-bot か確認する"

review:
  human_review_required: true
  ai_review_required: true
  specialist_reviews:
    docs: true
    contract: true

notes:
  - "workstream_key: phase1-wave2-api-contract-foundation"
  - "Review Definition: prompts/definitions/reviews/phase1-wave2-api-contract-foundation/epic/pr-review.yaml"
