schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-live-rakuten-fetch"
  title: "batch-live-rakuten-fetch:楽天Fetch live切替"
  summary: "運用方針§10のHuman採択をゲートに、BATCH-001〜004をQPS=2前提でlocal live運用できる状態にする。Run予算と深さ打ち切りを混同しない。GHA楽天live・#1607・scheduleは本Epic外。機能・領域単位Epic（例外）。統括は#1745。"
  workstream_key: "batch-live-rakuten-fetch"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  統括ロードマップ #1745 の本線候補#4。本線候補#1（#1749 楽天Fetch運用方針）は MERGED/CLOSED。
  運用方針正本（docs/15_運用・改善/運用手順/楽天Fetch運用方針.md）は決定済み制約（QPS=2等）と
  §10 Human判断待ち（推奨案）を分離済み。§11.1 の着手ゲートは「§10 Human判断完了」を含む。
  GHA葉の楽天経路は現状 --scaffold-demo 固定。楽天liveは登録IPのlocalが前提（CI禁止）。
  DB系live（#1750）/ AI系live / schedule有効化は別本線Epic。#1607（本番egress）は吸収しない。

objective: |
  §10 を Human Decision Log で採択し、BATCH-001〜004 が Run予算・paused再開・QPS制約を守って
  local live 実行できる状態にする。後続 schedule / GHA楽天live 判断の材料を残す。

scope:
  - "運用方針§10（深さ方針・Run予算・監視閾値・004件数・Run分割・paused/failed再開・GHA楽天live可否・QPS=1・クールダウン）のHuman Decision Log化と正本docs同期"
  - "BATCH-003 Run予算（pages_per_run等の運用概念）とカタログ深さ打ち切りの分離実装"
  - "rate_limited → fetch_cursor.paused（page非進行）と Run予算到達後のcursor継続"
  - "BATCH-001〜004 の local live 経路（明示 --live-rakuten / 環境変数）と低値smoke〜通常継続の段階検証"
  - "安全側QPS=1の適用範囲を採択値どおり実装（常用QPS=2は変更しない）"
  - "max_items（親orchestrator入力）と楽天Fetch Run予算が別物であることの維持"
  - "ギャップdocs / 運用結果docsの必要最小更新と統括#1745本線追跡更新"

out_of_scope:
  - "本番egress IP / NAT / self-hosted 設計・構築（#1607。吸収しない）"
  - "Human採択前のGHA楽天HTTP live化（§10 No.7がlocalのみの場合は本Epic全程で禁止）"
  - "条件付きGHA楽天liveを採択した場合でも、#1607未充足のまま本番相当egressなしで進めること"
  - "親 on.schedule 有効化（batch-daily-schedule-enable / #1732）"
  - "DB系live（#1750）/ AI系live（batch-live-ai-lane）の実装"
  - "常用QPSの再改訂（新実験＋新Human決定なし）"
  - "OpenAPI / Orval / generated / apps/web|api|reco 変更"
  - "GitHub Secrets / Variables の値の表示・変更"
  - "production定期・prod Secrets・破壊的全件取得"

