  - "子 Task（implementation）"
  - "epic_scope.allowed_paths"

acceptance_criteria:
  - "Epic Issue / Branch が作成されている"
  - "子 Task PR target が親 Epic Branch"
  - "allowed_paths が reco composition 配線に整合"

branch:
  no_branch: false
  name: "feature/epic-1268-lane-1e-run-validation-postgres"
  base: "develop"
  target: "develop"
