schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-lane-1e-run-validation-postgres"
  title: "レーン1e:Reco RunValidation Postgres配線"
  summary: "production composition の InMemory RunValidation を Postgres 参照へ置換し、レーン1e の PUB-002 結果あり縦串 Blocker（§10.4.5）を解消する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  #1264 / #1267 で PUB-002 が GRS-REC-004（run not found）になる原因を特定。
  build_production_ports は observability/config を Postgres 化するが、user-meaning 系の RunValidation は InMemory のまま。
  案A（Human 承認）により本 Epic で配線する。

objective: |
  PostgresRunValidation を実装し production composition に配線する。
  ローカル再スモークで次の状態まで確認する（items≥1 または次 Blocker 明示）。

scope:
  - "子 Task（implementation / 必要なら docs）"
  - "Epic Issue / Branch（develop 起点）"
  - "RunValidation Postgres 配線と再スモーク記録"

out_of_scope:
  - "retrieval 以降 stub の全面本番化"
  - "OpenAPI / migration / SCR / PUB-004 / Batch フルラン"

input:
  docs:
    - path: "docs/06_実装設計/cross_cutting/ローカル開発手順書.md"
      required: true
  templates: []
  files: []
  issues: []
  prs: []

output:
