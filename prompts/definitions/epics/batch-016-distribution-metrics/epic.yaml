schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-016-distribution-metrics"
  title: "BATCH-016:分布メトリクス集計Batch"
  summary: "BATCH-016（分布メトリクス集計Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。item_feature / item_meaning（必要に応じ item_embedding）から分布を集計し、IF-DB-BATCH-016 で feature_distribution_metric / meaning_distribution_metric / normalization_distribution_metric へ保存する。Reco 品質監視用の派生集計であり、正規化・Embedding 生成本体は担当しない。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b 意味生成パイプラインの分布監視段。識別子単位 Epic（1 Batch ID = 1 Epic）。
  先行 BATCH-013 / BATCH-015 は develop merge 済み（#1455 / #1479）。
  3 Metric テーブル定義は整備済み。BATCH-013 は normalization_distribution_metric 非書込が確定。
  物理書込 IF は IF-DB-BATCH-016（分布メトリクス保存）。BATCH-015 の IF-VEC-BATCH-001 や
  BATCH-014 の IF-DB-BATCH-015 と混同禁止。ここは Batch ID と IF 番号が一致する。
  モジュールは MOD-BATCH-038（Normalization Statistics Manager）を主参照。
  Aggregator 論理名（Feature / Meaning / Normalization Distribution）の追加採番は Human 判断。
  起動は BATCH-013/015 後続 / schedule / workflow_dispatch。想定 workflow は
  batch-distribution-metrics.yml（独立子。親チェーン全体改修は外）。
  Batch は HTTP API 化しないため Contract Gate は不要。後続は BATCH-017。

objective: |
  BATCH-016 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-016 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-016-distribution-metrics/**）を整理する"
  - "Contract Gate 不要方針を明示する"
  - "IF-DB-BATCH-016 境界と BATCH-013 非書込（normalization_distribution_metric）整合を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜015 / 017〜019）の仕様書・実装・テスト（先行・後続は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・DB schema / migration（既存定義の参照は可）"
  - "本番リリース作業"
  - "apps/reco 破壊変更・reco_score_distribution_metric（Online / 評価系）"
  - "BATCH-013 の item_feature / item_meaning 再書込"
  - "BATCH-015 Embedding 生成本体 / OpenAI 実呼出"
  - "親 meaning-generation / daily 親 workflow 全体改修（独立子 workflow 追加は可）"
  - "バッチ処理一覧の古い表記（BATCH-013 が normalization_distribution_metric 更新）の一括 docs 修正（必要なら別 Task）"

