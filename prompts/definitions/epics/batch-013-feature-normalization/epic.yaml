      purpose: "semantic_config_version → feature_normalization_version_id binding"
    - path: "docs/06_実装設計/batch/BATCH-012_Item Feature生成バッチ仕様書.md"
      required: true
      purpose: "先行 raw Upsert / IF-DB-BATCH-013 境界"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase4b 縦串方針"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic / Task 命名"
  templates: []
  files: []
  issues: []
  prs: []

output:
