    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ実行スケジュール設計書.md"
      required: true
      purpose: "meaning-generation チェーン内の位置"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ依存関係図.md"
      required: true
      purpose: "012 → 013 → 014/016 の依存"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-BATCH-014 / IF-SHARED-003"
    - path: "docs/05_アプリケーション設計/アプリ/モジュール一覧.md"
      required: true
      purpose: "MOD-BATCH-034 Feature Normalizer / MOD-BATCH-038"
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: true
      purpose: "§14 正規化方式（sigmoid, center/k）正本"
    - path: "docs/06_実装設計/database/item_feature_テーブル定義書.md"
      required: true
      purpose: "normalized_feature_value 更新・冪等キー"
    - path: "docs/06_実装設計/database/item_meaning_テーブル定義書.md"
      required: true
      purpose: "Social / Symbolic 射影 UPSERT"
    - path: "docs/06_実装設計/database/feature_normalization_version_テーブル定義書.md"
      required: true
