schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-013-feature-normalization"
  title: "BATCH-013:Feature正規化Batch"
  summary: "BATCH-013（Feature正規化Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。IF-SHARED-003 経由で MOD-BATCH-034（Feature Normalizer）を呼び出し、item_feature.normalized_feature_value を更新し item_meaning を UPSERT する（IF-DB-BATCH-014）。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b 意味生成パイプラインの Feature 正規化段。識別子単位 Epic（1 Batch ID = 1 Epic）。
  先行 BATCH-012（Item Feature生成）は develop merge 済み（#1446 / PR #1453）。
  item_feature / item_meaning / normalization_rule / feature_normalization_version テーブル定義は整備済み。
  IF は IF-DB-BATCH-014（Feature正規化結果保存: item_feature.normalized_value UPDATE + item_meaning UPSERT）
  + IF-SHARED-003（Feature正規化ロジック呼出 / MOD-BATCH-034 Feature Normalizer）。
  IF-DB-BATCH-013 は Item Feature保存（BATCH-012）であり混同禁止（Batch ID と IF 番号は +1 ズレ）。
  normalization_distribution_metric 書込は BATCH-016 担当で本 Epic 対象外。
  MVP 正規化は固定 sigmoid（center=0.5 / k=4.0）で LLM 不使用。z-score+sigmoid は将来拡張。
  Batch は HTTP API 化しないため Contract Gate は不要。後続は BATCH-014 / BATCH-016 / BATCH-017。

objective: |
  BATCH-013 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-013 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-013-feature-normalization/**）を整理する"
  - "Contract Gate 不要方針を明示する"
  - "IF-DB-BATCH-014 / IF-SHARED-003 / IF-DB-BATCH-013（BATCH-012）境界を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜012 / 014〜019）の仕様書・実装・テスト（先行・後続は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・DB schema / migration（既存定義の参照は可）"
  - "本番リリース作業"
  - "apps/reco 本体の破壊変更（MOD-BATCH-034 は呼び出しのみ。必要なら in-process アダプタを batch 側に置く）"
  - "normalization_distribution_metric 書込（BATCH-016）"
  - "BATCH-014〜016 の詳細実装（Embedding・分布集計等）"
  - "親 batch-item-meaning-generation.yml / retry-failed チェーン全体改修（独立子 workflow 追加は可）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-013 の Batch ID・処理概要・入出力・依存・MVP対象"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
