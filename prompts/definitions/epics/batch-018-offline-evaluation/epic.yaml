  - "Issue タイトルが [Epic]BATCH-018:Offline Evaluation Batch 形式である"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "配下 Task の作業単位が整理されている"
  - "IF-DB-BATCH-018 / IF-SHARED-004 / MVP △ scaffold-first が明記されている"
  - "epic_scope.artifact_id が BATCH-018 である"

