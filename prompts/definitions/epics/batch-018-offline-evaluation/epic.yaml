schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-018-offline-evaluation"
  title: "BATCH-018:Offline Evaluation Batch"
  summary: "BATCH-018（Offline Evaluation Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。evaluation_dataset / evaluation_case を読み、IF-SHARED-004 で evaluation mode 推薦を実行し、メトリクスを算出して IF-DB-BATCH-018 で evaluation_run / evaluation_result / evaluation_metric へ保存する。MVP は △（評価データ整備後に本格化）だが、Human 承認により scaffold-first 縦串を進める。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"
    - "contract-ai"

background: |
  Phase4b の評価・改善系 Batch。識別子単位 Epic（1 Batch ID = 1 Epic）。
  MVP 一覧は △（評価データ整備後に本格化）。Human により本 Epic 縦串の着手を明示承認済み。
  Evaluation 系テーブル定義・DDL は整備済み（partial）。BATCH-018 専用仕様書・workflow・apps/batch 実装は未着手。
  物理書込 IF は IF-DB-BATCH-018（evaluation_run / evaluation_result / evaluation_metric INSERT）。
  推薦実行 IF は IF-SHARED-004（Python package / internal execution / internal API）。
  API-INT-002（mode=evaluation）を契約変更せず消費する場合、Contract Gate は不要。
  主モジュールは MOD-BATCH-039 / 040 / 041。apps/reco 破壊変更は禁止（呼び出し・mock のみ）。
  一覧の evaluation_run_log は物理テーブルなし。正本は evaluation_run + batch_run_log / phase_log。
  Run は毎回新規 INSERT（非冪等）。Result/Metric は Run 内 UNIQUE。
  workflow 想定は独立子 batch-offline-evaluation.yml（cron 本線必須ではない）。
  Failure Analyzer / Improvement Backlog（MOD-BATCH-043/044）は本 Epic 外。

objective: |
  BATCH-018 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-018 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-018-offline-evaluation/**）を整理する"
  - "Contract Gate 不要方針を明示する（API-INT-002 契約変更をしない前提）"
  - "IF-DB-BATCH-018 / IF-SHARED-004 / MVP △ scaffold-first 境界を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜017 / 019）の仕様書・実装・テスト（先行は参照のみ）"
  - "Public / Admin API 仕様書および OpenAPI / Orval / generated 変更（契約変更時は別 Epic）"
  - "画面（SCR-* / 評価画面）・DB schema / migration（既存定義の参照は可）"
  - "本番リリース作業・production 負荷評価"
  - "apps/reco 本体の破壊変更（evaluation mode 呼び出し・mock は可）"
  - "MOD-BATCH-042〜044（Feedback / Failure / Backlog）本格実装"
  - "evaluation_dataset / evaluation_case の本番 seed 整備（最小 fixture は UT 可）"
  - "週次親 workflow 全体改修（独立子追加は可）"

input:
