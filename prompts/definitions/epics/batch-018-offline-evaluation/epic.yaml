    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-BATCH-018 / IF-SHARED-004 / IF-INT-002"
    - path: "docs/05_アプリケーション設計/アプリ/モジュール一覧.md"
      required: true
      purpose: "MOD-BATCH-039 / 040 / 041"
    - path: "docs/06_実装設計/database/evaluation_dataset_テーブル定義書.md"
      required: true
