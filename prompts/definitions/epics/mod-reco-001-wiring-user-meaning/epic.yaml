schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-mod-reco-001-wiring-user-meaning"
  title: "MOD-RECO-001:Orchestrator Wiring（User Meaning）"
  summary: "MOD-RECO-001 Recommendation Orchestrator の User Meaning フェーズ（MOD-RECO-004〜010）について、各モジュール implementation 完了後に build_default_stub_ports() の該当 Port を本実装へ差し替える Wiring milestone Epic。stubs.py の競合をフェーズ単位で直列化する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  MOD-RECO-001 Recommendation Orchestrator の下位モジュール配線方針（モジュール仕様書 §8.4）において、段階2: フェーズ Wiring Task を Epic Issue として管理する。
  起動フェーズ（MOD-RECO-002 / 003）は配線済み。本 Epic は User Meaning フェーズ（MOD-RECO-004〜010）について、各モジュール implementation Task 完了後に build_default_stub_ports() の該当 Port を本実装へ差し替える milestone である。
  StubXxx クラスは削除せず、MVP デフォルト composition の参照先のみ本実装に変更する（§8.4.1）。
  親 Epic #260（MOD-RECO-001:Recommendation Orchestrator）配下の milestone だが、develop への統合は本 Epic PR のみで行う（Epic Branch は develop 起点）。

objective: |
  User Meaning フェーズの Orchestrator Wiring を Epic Issue / 配下 Task で管理し、recommendation-orchestrator/stubs.py の競合をフェーズ単位で直列化する。
  配下 Task の PR target は本 Epic Branch とし、develop への統合は本 Epic PR のみで行う。

scope:
  - "User Meaning フェーズ（MOD-RECO-004〜010）の build_default_stub_ports() 配線 Task を Issue 化する"
  - "対象 Port: user_semantic_extractor, external_feature_estimator, internal_feature_estimator, user_feature_generator, user_meaning_projector, user_context_builder, query_embedding_generator"
  - "配線後の Orchestrator デフォルト経路テスト（test_recommendation_orchestrator.py 等）を Epic Branch で更新する"
  - "Epic develop merge 後の ExecutionContext 型付き化 / integration 再テスト follow-up Task 起票（playbook 順序 3〜4）"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/mod-reco-001-wiring-user-meaning/**）を整理する"

out_of_scope:
  - "対象モジュール（MOD-RECO-004〜010）本体の新規実装（各 MOD-RECO-* Epic 配下 Task）"
  - "起動フェーズ（002 / 003）の再配線"
  - "他フェーズの Wiring（別 Epic）"
  - "段階3 Composition 完成（本番 DI / DB Repository / E2E 強化）"
  - "execution_context.py の型付きフィールド追加（develop 直 follow-up Task #887。playbook 順序 3）"
  - "integration 再テストの getattr 置換（develop 直 follow-up Task #891。playbook 順序 4）"
  - "StubXxx クラスの削除"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema 変更"

