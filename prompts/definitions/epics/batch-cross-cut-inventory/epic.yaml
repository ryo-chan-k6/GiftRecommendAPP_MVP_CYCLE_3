schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-cross-cut-inventory"
  title: "batch-cross-cut-inventory:横串棚卸し・整合性"
  summary: "BATCH-001〜019 縦串完了後の横串棚卸し。設計書・一覧・依存・スケジュール・独立子 workflow・§18 後続・OPEN Issue を突合し、docs 正本（ギャップ一覧）を残す。親 workflow 実装・DDL・mock 解除・018/019 本格化は行わない。"

work_mode: "ai-agent"

commands:
