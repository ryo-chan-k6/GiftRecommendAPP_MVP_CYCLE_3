background: |
  BATCH-001〜019 の識別子単位縦串（仕様→実装→UT→Epic PR→develop）が一通り完了した。
  次フェーズは横串・本実装向け改修だが、Human 確定により Epic はテーマ分割（E0〜E4）。
  本 Epic は E0（横串棚卸し・整合性）。成果物は docs 正本とし、ai-logs のみで終わらせない。
  引継ぎ: ai-logs/cross-cutting/2026-07-22-batch-cross-cut-production-hardening-handover.md（Issue #1542 / PR #1543）。
  機能・領域単位 Epic（例外）。識別子単位ではないため epic_scope.artifact_id は空。
  E1（親 workflow）は本 Epic 完了後に別 Epic で着手する（本 Epic では実装しない）。

objective: |
  Epic Issue と Epic Branch を作成し、横串ギャップ・整合表を docs 正本として残す。
  OPEN Issue 突合案と E2 以降への取込案を docs に書き、Human が確定できるようにする。
  develop への統合は本 Epic PR のみで行う。

scope:
  - "BATCH-001〜019 と application/*・batch-*.yml・仕様書パスの 1:1 確認"
  - "依存関係図 vs スケジュール設計書 vs 実装（独立子のみ）の差分表"
  - "各 §18 Human 確定の「後続」「Epic 外」「stub」一覧化（018/019 は後回しと明記）"
  - "env / secrets 名の一覧（実値は出さない）"
  - "UT カバレッジの Batch 別サマリ"
  - "OPEN #102/#109/#133/#136/#149〜#154 と E2 以降の関係案を docs に記載"
  - "docs 正本（推奨: バッチ横串整合・本実装ギャップ一覧.md）の作成"
  - "必要なら一覧／スケジュール／依存関係図への最小追記（重複しすぎない）"
  - "Epic Issue / Epic Branch / 子 Task Definition 整備"

out_of_scope:
  - "親 workflow（daily/weekly/manual orchestrator）の実装"
  - "中間複合子 workflow（item-import / meaning-generation / retry-failed）の実装"
  - "DDL / migration / IF-DB stub 解除"
  - "外部 API mock 解除・本接続"
  - "BATCH-018 / 019 本格化・本線組込"
  - "MOD-BATCH-043 / 044 本格実装"
  - "業務ロジックの大規模リファクタ"
  - "OpenAPI / Orval / generated 変更"
  - "apps/web / apps/api / apps/reco の本線変更"
  - "PoC 系 Issue（#1532 / #1535 / #1536 等）"

