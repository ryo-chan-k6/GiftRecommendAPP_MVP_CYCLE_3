schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-mod-reco-001-recommendation-orchestrator"
  title: "MOD-RECO-001:Recommendation Orchestrator"
  summary: "MOD-RECO-001（Recommendation Orchestrator / 推薦実行制御）に関するモジュール仕様書・実装・単体テストを管理するEpic。API-INT-002 から呼ばれ、推薦パイプライン全体（Config解決 / User Meaning / Retrieval / Matching / Ranking / Result生成 / Reason生成）の実行順序を制御する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  06_実装設計において、MOD-RECO-001（Recommendation Orchestrator）に関する設計・実装・テストを、Epic Issue と Epic Branch で一元管理する。
  本モジュールは Recoモジュール一覧 §4 の起点モジュール（分類: 実行制御、処理種別: OL、MVP対象 ○）であり、API-INT-002 から呼ばれて推薦パイプライン全体（MOD-RECO-002〜MOD-RECO-029）の実行順序・エラー伝播・Phase Log を制御する。
  本 Epic は **Recoモジュール本体**（`apps/reco/src/modules/recommendation-orchestrator/**` 想定）の責務に限定し、Internal API のエンドポイント層（`apps/reco/src/app/**`）の変更は依存 Epic（[Epic]API-INT-002）配下の Task として扱う。
  子 Task は Orchestrator モジュール仕様書・実装・単体テスト単位に分割し、Task PR は親 Epic Branch に向ける。

objective: |
  MOD-RECO-001 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths（apps/reco 配下から API エンドポイント層を除いた範囲）から外れないことをガードする。
  他 Recoモジュール（MOD-RECO-002〜029）の本体変更は本 Epic では扱わず、それぞれ別 Epic 配下の Task として切る運用を明示する。
  develop への統合は本 Epic PR のみで行う。

scope:
  - "MOD-RECO-001（Recommendation Orchestrator）に関する子 Task の作業単位を整理する（モジュール仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/**）を整理する"
  - "他 Recoモジュール（MOD-RECO-002〜029）との呼び出し関係を整理する（本 Epic は呼び出し制御のみを担当し、各モジュール本体は別 Epic）"

out_of_scope:
  - "API-INT-002 のエンドポイント層実装（[Epic]API-INT-002 で扱う）"
  - "API-PUB-002 の Public API 実装（[Epic]API-PUB-002 で扱う）"
  - "他 Recoモジュール（MOD-RECO-002〜029）本体の設計・実装"
  - "Batch 側 Recoモジュール（MOD-RECO-026 / 027 など処理種別 BT）の実装"
  - "画面（SCR-*）の設計・実装"
  - "DB schema 変更"
  - "認証・認可方式そのものの変更"
  - "本番リリース作業"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/reco/Recoモジュール一覧.md"
      required: true
      purpose: "MOD-RECO-001 のモジュール名（推薦実行制御）/ 物理名（Recommendation Orchestrator）/ 分類（実行制御）/ 処理種別（OL）/ MVP対象（○）と、配下で呼び出す MOD-RECO-002〜029 の責務境界を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/モジュール一覧.md"
      required: true
      purpose: "MOD-RECO-001 がモジュール一覧全体（MOD-API-* / MOD-RECO-* / MOD-BATCH-*）の中で占める位置・呼び出し元（MOD-API-005 Reco Client）を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能×モジュール対応表.md"
      required: false
      purpose: "MOD-RECO-001 が API-INT-002 から呼び出される関係と、Ranking 内の MOD-RECO-019 / MOD-RECO-020 責務分離を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/処理構成定義書.md"
      required: false
      purpose: "Online / Batch 分離方針と推薦パイプラインの処理順序前提を確認するため"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic 方針（§3.5）・MOD-RECO Epic の典型 allowed_paths / forbidden_paths（§3.5.2）を確認するため"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic タイトル規約（§15.0）・識別子付き共通命名（§15.1）を確認するため"
  templates: []
  files: []
  issues: []
  prs: []

output:
  docs: []
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue（タイトル: [Epic]MOD-RECO-001:Recommendation Orchestrator）"
  - "Epic Branch（develop 起点 / feature/epic-<issue-number>-mod-reco-001-recommendation-orchestrator）"
  - "子 Task 候補一覧（モジュール仕様書 / 実装 / 単体テスト）"
  - "epic_scope.allowed_paths / forbidden_paths による配下 Task のファイル境界宣言（API エンドポイント層を forbidden 化）"

acceptance_criteria:
  - "Epic Issue が作成されている"
  - "Issue タイトルが [Epic]MOD-RECO-001:Recommendation Orchestrator 形式である（Task Definition設計書 §15.0）"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "配下 Task の作業単位（モジュール仕様書 / 実装 / 単体テスト）が整理されている"
  - "子 Task の PR target が親 Epic Branch である方針が明記されている"
  - "epic_scope.allowed_paths が apps/reco/** から `apps/reco/src/app/**`（エンドポイント層）を除いた範囲と整合している（成果物化方針書 §3.5.2）"
  - "epic_scope.forbidden_paths に apps/reco/src/app/** が明示されている"

branch:
  no_branch: false
  name: "feature/epic-<issue-number>-mod-reco-001-recommendation-orchestrator"
  base: "develop"
  target: "develop"
  worktree_required: false

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"
    planned_start: null
    due_date: null

issue:
  unit: "epic"
  type: "feature"
  area: "reco"

epic_scope:
  artifact_id: "MOD-RECO-001"
  allowed_paths:
    - "docs/06_実装設計/reco/MOD-RECO-001_*"
    - "apps/reco/src/modules/recommendation-orchestrator/**"
    - "apps/reco/src/domain/recommendation/**"
    - "prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/**"
    - "prompts/definitions/reviews/mod-reco-001-recommendation-orchestrator/**"
  forbidden_paths:
    - "apps/reco/src/app/**"
    - "apps/reco/src/modules/user-meaning/**"
    - "apps/reco/src/modules/retrieval/**"
    - "apps/reco/src/modules/matching/**"
    - "apps/reco/src/modules/ranking/**"
    - "apps/reco/src/modules/reason/**"
    - "apps/api/**"
    - "apps/web/**"
    - "apps/batch/**"
    - "openapi/**"
    - "db/**"
  child_task_areas:
    - "module-spec"
    - "implementation"
    - "unit-test"

dependencies:
  epics: []  # MOD-* Epic は原則 dependencies.epics なし（成果物化方針書 §3.5.3）。
  issues: []
  prs: []
  tasks: []
  blocking: false

parallel_control:
  depends_on: []
  blocks: []
  exclusive_files: []
  conflict_risk: "medium"
  contract_impact: false
  generated_impact: false
  db_impact: false

test_policy:
  required: []
  commands: []
  manual_checks:
    - "Epic scope が Orchestrator モジュール本体に閉じているか確認する"
    - "apps/reco/src/app（API エンドポイント層）への変更が混入していないか確認する"
    - "他 Recoモジュール（MOD-RECO-002〜029）本体への変更が混入していないか確認する"
    - "子 Task に分割可能な粒度か確認する"
  not_required:
    - "unit test"
    - "integration test"
  skip_reason:
    "unit test": "Epic は作業管理単位のため対象外"
    "integration test": "Epic は作業管理単位のため対象外"

review:
  human_review_required: true
  ai_review_required: false
  review_points:
    - "Epic の作業範囲が MOD-RECO-001 本体に閉じているか（エンドポイント層・他モジュール本体を含めていないか）"
    - "epic_scope.allowed_paths / forbidden_paths が成果物化方針書 §3.5.2 の MOD-RECO 例（API-INTエンドポイント層を除く）と整合しているか"
    - "Epic PR target が develop であるか"
    - "依存 Epic を設定しない方針（MOD-* Epic は原則独立）が明示されているか"
  specialist_reviews:
    docs: false
    test: false
    contract: false
    security: false

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: true
  reason: "識別子単位 Epic Definition の初期試作のため experiments を有効化。MOD-* Epic は API contract / generated 影響を持たないため cross_cutting は無効。"

risk_points:
  - "apps/reco/src/app（エンドポイント層）への変更が誤って配下 Task に混入し scope 越境する可能性"
  - "他 Recoモジュール（MOD-RECO-002〜029）本体への変更が誤って配下 Task に混入する可能性"
  - "Task PR を誤って develop へ直接向けてしまう運用ミス"

human_decision_points:
  - "Orchestrator の責務として Phase Log / Error Handling / Retry をどこまで含めるか（MOD-RECO-024 Reco Error Handler / MOD-RECO-028 Phase Log Writer との責務境界）"
  - "Orchestrator の物理配置パス（apps/reco/src/modules/recommendation-orchestrator/**）を採用するか他案を採用するか"
  - "子 Task の分割粒度（モジュール仕様書 / 実装 / 単体テストの切り方）"

stop_conditions:
  - "必須 input.docs が存在しない場合"
  - "Recoモジュール一覧に MOD-RECO-001 が存在しない場合、または MVP対象が ○ ではない場合"
  - "epic_scope.allowed_paths が空または未記載の場合"
  - "Task PR の target が develop に向く設計が必要になった場合"
  - "apps/reco/src/app 配下への変更を本 Epic 配下 Task で実施する必要が出た場合（[Epic]API-INT-002 配下 Task へ切り出す）"
  - "他 Recoモジュール（MOD-RECO-002〜029）本体への変更を本 Epic 配下 Task で実施する必要が出た場合（該当 MOD-* Epic 配下 Task へ切り出す）"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "Epic は作業管理単位であり、モジュール仕様書本体・実装・テストの正本は子 Task で作成する"
  - "命名の正本は Task Definition設計書 §15.0（Epic タイトル規約）・§15.1（共通命名）"
  - "本 Epic 配下の最初の子 Task は prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/module-spec.yaml"
  - "MOD-* Epic は原則 dependencies.epics なし（成果物化方針書 §3.5.3）"
  - "本 Epic は API contract / generated 影響を持たない。OpenAPI / generated に影響する場合は [Epic]API-INT-002 配下 Task として扱う"
