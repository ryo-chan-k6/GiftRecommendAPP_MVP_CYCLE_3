epic:
  id: "epic-reco-db-pooling"
  title: "reco-db-pooling:Reco DB接続プール導入"
  summary: "Reco の DB アクセスがクエリ単位で新規接続を張っており推薦パイプラインが hard timeout を超過するため、コネクションプール導入で恒久対応する。"
  phase: "07_開発・単体テスト"

work_mode: "ai-agent"

parent:
  epic_id: null
  epic_issue_number: 1737
  epic_branch: "refactor/epic-1737-reco-db-pooling"
  related_issues:
    - 144
    - 1686
  related_prs: []

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  簡易 stg 構築で Web（Vercel）→ API（Render）→ Reco（Fly.io）の疎通に到達し、
  master seed 投入後に /recommendations 画面は表示できるようになった。
  しかしレコメンド実行が GRS-REC-101 / HTTP 504 で失敗する。

  切り分け結果（事実）:
  - API → Reco 接続は正常（Fly アクセスログに POST /internal/reco/v1/recommendations/run）
  - Reco → DB 到達性は正常（/internal/reco/v1/health が 200・DB probe 成功）
  - 504 の発生源は Reco 自身（GRS-REC-101 は PIPELINE_HARD_TIMEOUT_MS = 4_000 超過時のみ）
  - phase_log（owner_type = recommendation_run）は 0 件

  PostgresDatabaseSession は query() / execute() の内部で毎回 psycopg.connect() しており、
  コネクションプールが存在しない。stg 実測で DB アクセス 1 回あたり約 0.7〜1.1 秒。
  Orchestrator は 21 モジュールを順に実行するため、4,000ms を DB アクセス 5〜6 回で使い切る。

objective: |
  apps/reco の DB アクセスをコネクションプール経由にし、
  推薦パイプラインが PIPELINE_HARD_TIMEOUT_MS（4,000ms）内に完走できる状態にする。

scope:
  - "apps/reco の DB 接続方式（プール導入）"
  - "プールのライフサイクル管理"
  - "DatabaseSession Protocol 互換の維持"
  - "関連 unit test"
  - "子 Task の起票・完了追跡"

out_of_scope:
  - "PIPELINE_SOFT_TIMEOUT_MS / PIPELINE_HARD_TIMEOUT_MS の値変更"
  - "apps/api 側の同種問題（masters で 1 クエリ約 1 秒）"
  - "Fly コールドスタート対策（min_machines_running / RECO_REQUEST_TIMEOUT_MS）"
  - "Supabase / Render / Fly のリージョン再配置"
  - "推薦ロジック・スコアリングの変更"
  - "DB スキーマ・migration の変更"
  - "secret 実値の取り扱い"

