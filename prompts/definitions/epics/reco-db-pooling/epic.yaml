  - |
    Human 決定（2026-07-30）:
    - ライブラリ: psycopg_pool.ConnectionPool
    - ライフサイクル: PostgresDatabaseSession がプール所有。open()/close()。lifespan で open/close
    - health: app.state.database_session 共有
    - プールサイズ: min_size=1, max_size=2（コード定数）
    - PIPELINE_*_TIMEOUT_MS は変更しない
