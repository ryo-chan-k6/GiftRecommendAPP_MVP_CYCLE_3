schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-scr-002-recommendation-input"
  title: "SCR-002:レコメンド条件入力画面"
  summary: "SCR-002（レコメンド条件入力画面）に関する画面仕様書・実装・単体テストを管理するEpic。Recommendation Request入力UIを担当し、API-PUB-002（レコメンド実行）を呼び出す。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  06_実装設計において、SCR-002（レコメンド条件入力画面）に関する設計・実装・テストを、Epic Issue と Epic Branch で一元管理する。
  本画面は贈答相手・用途・予算・好み・避けたい条件・NG条件を入力し、API-PUB-002（レコメンド実行）を呼び出す MVP の中核入力画面である。
  子 Task は画面仕様書・実装・単体テスト単位に分割し、Task PR は親 Epic Branch に向ける。

objective: |
  SCR-002 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う。

scope:
  - "SCR-002 に関する子 Task の作業単位を整理する（画面仕様書 / 画面実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/scr-002-recommendation-input/**）を整理する"
  - "依存 Epic（API-PUB-002）の Status を子 Task 開始前に確認する運用を明示する"

out_of_scope:
  - "他画面（SCR-001 / SCR-003〜SCR-014）に関する設計・実装・テスト"
  - "Public / Internal API 仕様書および OpenAPI / generated 変更"
  - "Reco モジュールの設計・実装"
  - "Batch 実装"
  - "DB schema 変更"
  - "本番リリース作業"
  - "認証・認可方式そのものの変更"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
      purpose: "対象画面 SCR-002 の画面ID・画面名・MVP対象・概要を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
      purpose: "前後画面（SCR-001 / SCR-003 / SCR-004 / SCR-008 / SCR-009）との遷移関係を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/api/API一覧.md"
      required: true
      purpose: "本画面から呼び出す API-PUB-002（レコメンド実行）および API-PUB-005〜008（マスタ取得）の存在を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/機能×モジュール対応表.md"
      required: false
      purpose: "SCR-002 と API-PUB-002 / API-PUB-005〜008 / 関連画面状態の対応を確認するため"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic 方針（§3.5）と epic_scope.allowed_paths の境界例を確認するため"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic タイトル規約（§15.0）・命名規則を確認するため"
  templates: []
  files: []
  issues: []
  prs: []

output:
  docs: []
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue（タイトル: [Epic]SCR-002:レコメンド条件入力画面）"
  - "Epic Branch（develop 起点 / feature/epic-<issue-number>-scr-002-recommendation-input）"
  - "子 Task 候補一覧（画面仕様書 / 画面実装 / 単体テスト）"
  - "epic_scope.allowed_paths による配下 Task のファイル境界宣言"

acceptance_criteria:
  - "Epic Issue が作成されている"
  - "Issue タイトルが [Epic]SCR-002:レコメンド条件入力画面 形式である（Task Definition設計書 §15.0）"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "配下 Task の作業単位（画面仕様書 / 画面実装 / 単体テスト）が整理されている"
  - "子 Task の PR target が親 Epic Branch である方針が明記されている"
  - "epic_scope.allowed_paths が画面一覧 SCR-002 の責務範囲（apps/web 配下、docs/06_実装設計/web 配下）と整合している"

branch:
  no_branch: false
  name: "feature/epic-<issue-number>-scr-002-recommendation-input"
  base: "develop"
  target: "develop"
  worktree_required: false

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "Todo"
    priority: "high"
    planned_start: null
    due_date: null

issue:
  unit: "epic"
  type: "feature"
  area: "web"

epic_scope:
  artifact_id: "SCR-002"
  allowed_paths:
    - "docs/06_実装設計/web/SCR-002_*"
    - "apps/web/src/app/recommendations/**"
    - "apps/web/src/features/recommendation-input/**"
    - "apps/web/src/lib/api-client/recommendations/**"
    - "apps/web/src/lib/api-client/masters/**"
    - "prompts/definitions/tasks/scr-002-recommendation-input/**"
    - "prompts/definitions/reviews/scr-002-recommendation-input/**"
  forbidden_paths:
    - "apps/api/**"
    - "apps/reco/**"
    - "apps/batch/**"
    - "openapi/**"
    - "db/**"
  child_task_areas:
    - "screen-spec"
    - "implementation"
    - "unit-test"

dependencies:
  epics: []  # 依存Epic: [Epic]API-PUB-002:レコメンド実行（実Issue番号確定後に追加）。成果物化方針書 §3.5.3。
  issues: []
  prs: []
  tasks: []
  blocking: false

parallel_control:
  depends_on: []
  blocks: []
  exclusive_files: []
  conflict_risk: "low"
  contract_impact: false
  generated_impact: false
  db_impact: false

test_policy:
  required: []
  commands: []
  manual_checks:
    - "Epic scope（画面 1 つ分）が広すぎないか確認する"
    - "子 Task に分割可能な粒度か確認する"
    - "依存 Epic [Epic]API-PUB-002 の有無を確認する"
  not_required:
    - "unit test"
    - "integration test"
  skip_reason:
    "unit test": "Epic は作業管理単位のため対象外"
    "integration test": "Epic は作業管理単位のため対象外"

review:
  human_review_required: true
  ai_review_required: false
  review_points:
    - "Epic の作業範囲が SCR-002 に閉じているか"
    - "epic_scope.allowed_paths が画面一覧 SCR-002 の責務範囲と整合しているか"
    - "依存 Epic [Epic]API-PUB-002 が dependencies.epics に追記される運用が明示されているか"
    - "Epic PR target が develop であるか"
  specialist_reviews:
    docs: false
    test: false
    contract: false
    security: false

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: true
  reason: "識別子単位 Epic Definition の初期試作のため experiments を有効化。通常の作業計画は Issue、統合は Epic PR を正本とする。"

risk_points:
  - "依存 Epic [Epic]API-PUB-002 が未起票のまま子 Task を開始する運用ミス"
  - "Task PR を誤って develop へ直接向けてしまう運用ミス"
  - "epic_scope.allowed_paths を超えた変更（例: apps/api 配下）を配下 Task に混入させる運用ミス"

human_decision_points:
  - "依存 Epic [Epic]API-PUB-002 の Issue 番号確定タイミング"
  - "子 Task の分割粒度（画面仕様書 / 画面実装 / 単体テストの切り方）"
  - "Recommendation Request 入力項目が変動した場合の Recommendation Request 定義書との整合方針"

stop_conditions:
  - "必須 input.docs が存在しない場合"
  - "画面一覧に SCR-002 が存在しない場合、または MVP対象が ○ ではない場合"
  - "epic_scope.allowed_paths が空または未記載の場合"
  - "Task PR の target が develop に向く設計が必要になった場合"
  - "secret / .env 実値の記載が必要に見える場合"

notes:
  - "Epic は作業管理単位であり、画面仕様書本体・実装・テストの正本は子 Task で作成する"
  - "命名の正本は Task Definition設計書 §15.0（Epic タイトル規約）・§15.3（画面 Task）"
  - "本 Epic 配下の最初の子 Task は prompts/definitions/tasks/scr-002-recommendation-input/screen-spec.yaml"
  - "依存 Epic Issue 番号は実 Issue 起票後に dependencies.epics へ追記する（成果物化方針書 §3.5.3）"
