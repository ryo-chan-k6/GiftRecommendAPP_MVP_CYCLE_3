    - "BATCH-004 独立子 YAML を破壊していないか"
    - "018/019 本線非搭載"
    - "cron は親のみ・Phase1 無効"
    - "Epic PR target が develop"
  specialist_reviews:
    docs: true
    test: false
    contract: false
    security: true

human_decision_points:
  - "週次の existing-item 連鎖複合子のファイル名（推奨: batch-rakuten-existing-item-pipeline.yml）"

stop_conditions:
  - "独立子の業務ロジック改修が必要になった場合"
  - "BATCH-004 YAML のリネームが必須に見える場合（Human 確認）"

notes:
  - "機能・領域単位 Epic。workstream_key: batch-parent-orchestrators"
