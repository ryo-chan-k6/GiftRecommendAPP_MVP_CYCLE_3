    - "supabase/migrations/**"
    - "packages/contracts/**"
    - "apps/web/**"
    - "apps/api/**"
    - "apps/reco/**"
  child_task_areas:
    - "orchestrator-implementation"
    - "schedule-docs"

dependencies:
  epics:
    - issue: 1546
      title: "[Epic]batch-cross-cut-inventory:横串棚卸し・整合性"
      purpose: "E0 完了・案 A 確定"
  issues: []
  prs:
    - number: 1551
      purpose: "E0 Epic MERGED"
  tasks: []
  blocking: false

parallel_control:
  depends_on:
    - "epic-batch-cross-cut-inventory"
  blocks: []
  exclusive_files:
    - ".github/workflows/batch-*-orchestrator.yml"
    - ".github/workflows/batch-rakuten-item-import.yml"
    - ".github/workflows/batch-item-meaning-generation.yml"
    - ".github/workflows/batch-retry-failed-items.yml"
  conflict_risk: "medium"
  contract_impact: false
  generated_impact: false
  db_impact: false

