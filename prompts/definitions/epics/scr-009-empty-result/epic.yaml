schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-scr-009-empty-result"
  title: "SCR-009:0件結果表示"
  summary: "SCR-009（0件結果表示）に関する画面仕様書・実装・単体テストを管理するEpic。独立URL画面ではなく、SCR-002 推薦実行成功・0件時の UI 状態（phase=empty / ST-EMPTY）として仕様化し、条件変更への復帰 UX を担当する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  06_実装設計および 07_開発・単体テストにおいて、SCR-009（0件結果表示）に関する設計・実装・テストを、Epic Issue と Epic Branch で一元管理する。
  画面遷移図の正本どおり、SCR-009 は独立した業務画面ではなく画面状態である。
  Human 確定方針: MVP の宿主は `recommendation-input` の `phase === "empty"`（既存 EmptyState + EMPTY_RESULT_MESSAGE + 「条件を変更する」ボタン）。画面一覧 URL案 `/recommendations/{result_id}` は参考であり、専用 route 新設は原則 out of scope。
  依存 Epic（SCR-002 #1147 / SCR-003 #1361 / API-PUB-002 #357）は develop merge 済み。#1344 / #1345（D1 residual・0件 API 経路）は修正 merge 済み。
  子 Task は画面仕様書・実装・単体テスト単位に分割し、Task PR は親 Epic Branch に向ける。

objective: |
  SCR-009 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う。

scope:
  - "SCR-009 に関する子 Task の作業単位を整理する（画面仕様書 / 画面実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/scr-009-empty-result/**）を整理する"
  - "依存 Epic（SCR-002 / SCR-003 / API-PUB-002）の Status を子 Task 開始前に確認する運用を明示する"
  - "SCR-009 を画面状態として仕様化し、既存 EmptyState 実装との整合を取る"

out_of_scope:
  - "専用 `/recommendations/{result_id}` route の新設（0件専用 URL）"
  - "SCR-008 の包括仕様（エラー表示は別 Epic。遷移先言及のみ）"
  - "SCR-005 / SCR-007 の変更"
  - "Public / Internal API 仕様書および OpenAPI / generated / packages/contracts の変更"
  - "apps/api / apps/reco / apps/batch の実装変更"
  - "DB schema 変更"
  - "features/home の変更"
  - "features/recommendation-result の大規模改修（004 への最小ガードは implementation Task で検討可だが Epic では原則 forbidden）"
  - "認証・認可方式そのものの変更"
  - "本番リリース作業"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
      purpose: "対象画面 SCR-009 の画面ID・画面名・画面種別・URL案・MVP対象・表示項目を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
      purpose: "SCR-009 が画面状態であること、および条件入力への復帰遷移を確認するため"
    - path: "docs/06_実装設計/web/SCR-002_レコメンド条件入力画面画面仕様書.md"
      required: true
      purpose: "SCR-002 内 0件状態（phase=empty）・EmptyState 利用との分担を確認するため"
    - path: "docs/06_実装設計/web/SCR-003_レコメンド実行中表示画面仕様書.md"
      required: true
      purpose: "SCR-003 から SCR-009 への 0件遷移・resultStatus=empty 分岐を確認するため"
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
      required: true
      purpose: "0件正常系（resultStatus=empty / GRS-REC-001）の API 前提を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/デザインルール.md"
      required: true
      purpose: "ST-EMPTY（0件結果）パターンを確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/web/UIコンポーネント一覧.md"
      required: true
      purpose: "EmptyState（UI-033）等の部品責務を確認するため"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic 方針（§3.5）と epic_scope.allowed_paths の境界例を確認するため"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic タイトル規約（§15.0）・命名規則を確認するため"
  templates: []
  files: []
  issues:
