schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-data-collect-ops"
  title: "batch-data-collect-ops:本格収集と運用監視改善"
  summary: "統括#1745本線#6。B-0下でlocal楽天liveによる本格・継続収集と、運用方針§5.3系の監視改善（閾値実測見直し・再開運用定着）を行う。#1792（schedule有効化）・#1607・GHA楽天HTTP liveは本Epic外。機能・領域単位Epic（例外）。"
  workstream_key: "batch-data-collect-ops"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  統括ロードマップ #1745 の本線候補#6。依存の本線#5（#1789）は B-0（daily schedule無効継続）で CLOSED。
  本線#1〜#4（運用方針・DB live・AI live・楽天Fetch local live）は完了済み。
  #1791 で schedule 用の監視・rollback最小手順は整備済みだが、それは B-1 前提の最低ラインであり、
  本Epicの「本格収集」と「監視改善（閾値実測見直し）」とは別物として扱う。
  Human確認（2026-07-31）: #6本旨は B-0下の local 本格収集＋監視改善。#1792 / #1607 は out_of_scope。
  Definition先作成 → `/start-epic` の順（即起票しない）。

objective: |
  承認済み fetch_plan / Run予算に沿い、local 楽天 live で本格・継続収集を回し、
  運用方針§5.3.3〜§5.3.5 の監視指標を実測して見直す。統括#1745 本線#6を追跡更新する。
  daily on.schedule 有効化（#1792 / B-1）や GHA 楽天 live（#1607）は含めない。

scope:
  - "本格収集の運用枠（対象ジャンル段階・Run回数/期間・予算ノブ・停止条件）の Human Decision Log 化と正本docs同期"
  - "GHA親オーケストレータ相当をlocalで薄く再現する設計・親シェル実装（scripts/batch。実crontab登録はHuman）"
  - "BATCH-001〜004 local live による継続収集の実施と運用結果docs（secretなし）。収集はlocalオーケストレータ経由を本線とする"
  - "fetch_cursor 進捗（active/paused/exhausted/failed）と paused/failed 再開運用の定着・記録"
  - "運用方針§5.3.5 監視閾値の実測に基づく見直し（警告/ハード）と docs 反映"
  - "DB / Object Storage / 楽天API呼出 / Actionsコスト観点の観測結果整理（金額推定はHuman）"
  - "統括#1745 本線候補#6 の追跡更新"
  - "必要最小のギャップ一覧・運用方針・収集結果docs更新"

out_of_scope:
  - "daily / weekly / manual 親 on.schedule のコメント解除・有効化（#1792 / B-1。吸収しない）"
  - "B-1 Scaffold定期試行そのもの（別Decision・#1792）"
  - "本番egress IP / NAT / self-hosted 設計・構築（#1607。吸収しない）"
  - "GHA / GitHub-hosted からの楽天HTTP live化"
  - "常用QPS=2の再改訂（新実験＋新Human決定なし）"
  - "DB系 / AI系 live の再実装（本線#2/#3で完了済みの再実施）"
  - "stgレコメンド品質評価本体（本線#7）"
  - "本番リリース準備本体（本線#8）"
  - "OpenAPI / Orval / generated / apps/web|api|reco 変更"
  - "GitHub Secrets / Variables の値の表示・変更"
  - "production定期開始・prod Secrets・破壊的全件取得"

