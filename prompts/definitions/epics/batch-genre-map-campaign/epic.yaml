  - "1 Runあたりの genre 上限（推奨案: 20件。QPS=2維持前提。調整可）"
  - "キャンペーン停止条件（例: 429連続、paused増、予定Run消化、Human中断）"
  - "定常cron非干渉の確認タイミング（weekly 001 実行とキャンペーンRunの時間分離）"
  - "機能・領域単位Epic（例外）として識別子Epicに分割しない方針の維持"

stop_conditions:
