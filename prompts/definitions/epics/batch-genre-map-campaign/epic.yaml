    - "docs/06_実装設計/database/external_genre_テーブル定義書.md"
    - "scripts/batch/**"
    - "apps/batch/src/batch/application/genre_sync/**"
  forbidden_paths:
    - "packages/contracts/**"
    - "apps/web/**"
    - "apps/api/**"
    - "apps/reco/**"
    - ".github/workflows/batch-daily-orchestrator.yml"
    - ".github/workflows/batch-weekly-orchestrator.yml"
    - ".github/workflows/batch-manual-orchestrator.yml"
    - ".github/workflows/batch-rakuten-*.yml"
    - ".github/workflows/batch-item-semantic.yml"
    - ".github/workflows/batch-item-embedding.yml"
