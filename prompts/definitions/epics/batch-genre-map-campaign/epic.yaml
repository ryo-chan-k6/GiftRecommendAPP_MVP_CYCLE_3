schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-genre-map-campaign"
  title: "batch-genre-map-campaign:楽天ジャンル地図キャンペーン"
  summary: "Phase1 daily/weekly 定常cronとは分離した別枠キャンペーン。楽天ジャンルID・階層・件数を把握し、後続 BATCH-002/003 取得計画の土台にする。MVP fetch_plan 4IDは置き換えない。機能・領域単位Epic（例外）。"
  workstream_key: "batch-genre-map-campaign"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  現状 external_genre は約15件で極小。ジャンル全体像が未知。
  BATCH-001 genre_sync は --genre-ids 起点＋直下 children までのみで、全階層自動総なめではない。
  全地図化には root 0 からの BFS（未同期 children を次 Run の --genre-ids に載せる）等の段階実行が必要。
  MVP fetch_plan 承認済み ID（100000/100003/100004/100005、Decision 2026-07-31）は本キャンペーンで置き換えない（拡大情報源）。
  weekly 親シェルの 001 は --genre-ids（いま cron は 100005）と共有するため、キャンペーンは葉 CLI 直接または専用ラッパを推奨（weekly 全体を回さない）。
  AI は --live-rakuten を実行しない。live は Human。
  GHA楽天live / #1607 / schedule 有効化は対象外維持。
  Phase1 観測中の定常 crontab（#1811 001〜008）および Phase2（#1818）を壊さない・混在させない（Relationshipsで追跡言及のみ。勝手に完了・変更しない）。

objective: |
  楽天ジャンルの全体地図（ID・階層・件数）を別枠キャンペーンで段階把握し、
  後続 BATCH-002/003 の取得計画の土台となる docs / Decision / 実行手順を整備する。
  定常 cron・MVP 4ID・GHA live / schedule は変更しない。

scope:
  - "キャンペーン枠（起点・1 Run上限・停止条件・定常cron非干渉・QPS・Human live境界）の Human Decision / 運用手順への正本化"
  - "現状 external_genre 棚卸し手順と結果docs（件数・level分布。secretなし）"
  - "BFS/段階同期の手順または最小ラッパ（--dry-run可）。weekly親全体は使わない"
  - "Human live 実行結果の docs 同期（AIはliveしない）"
  - "後続 BATCH-002/003 取得計画への参照可能な地図成果物の整備"
  - "必要最小のギャップ一覧・運用方針・BATCH-001関連docs更新"

out_of_scope:
  - "定常crontab変更（Phase1 #1811 / Phase2 #1818 の crontab・親シェル定常ノブ変更）"
  - "商品収集の大規模拡大（BATCH-002/003 の本格拡大実行そのもの）"
  - "AIによる --live-rakuten 実行"
  - "GHA / GitHub-hosted からの楽天HTTP live化"
  - "daily / weekly / manual 親 on.schedule のコメント解除・有効化（#1792 / B-1）"
  - "本番egress IP / NAT / self-hosted（#1607）"
  - "BATCH-018 / BATCH-019"
  - "MVP fetch_plan 4ID（100000/100003/100004/100005）の置き換え"
  - "weekly親オーケストレータ全体実行による地図化"
  - "secret実値・GitHub Secrets / Variables の表示・変更"
  - "OpenAPI / Orval / generated / apps/web|api|reco 変更"
  - "production定期開始・破壊的全件取得"

