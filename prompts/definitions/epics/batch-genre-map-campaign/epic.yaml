      required: true
    - path: "docs/06_実装設計/database/external_genre_テーブル定義書.md"
      required: true
    - path: "docs/15_運用・改善/運用手順/楽天Fetch運用方針.md"
      required: true
    - path: "docs/15_運用・改善/運用手順/local薄いオーケストレータ設計・運用手順.md"
      required: true
