  - "キャンペーン枠 Human Decision Log（起点・1 Run上限・停止条件・定常非干渉・QPS・Human live境界）"
  - "external_genre 棚卸し結果docs（件数・level分布。secretなし）"
  - "BFS/段階同期の手順または最小ラッパ（週次親全体は使わない）"
  - "Human live 実行結果の docs 同期"
  - "後続 BATCH-002/003 取得計画の参照土台"

acceptance_criteria:
