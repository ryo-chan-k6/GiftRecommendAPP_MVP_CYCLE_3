  - "GHA schedule有効化や#1607実装が本Epic差分に必要に見えた場合"
  - "GHA楽天HTTP liveが必要に見えた場合"
  - "AIによる --live-rakuten 実行が必須に見える場合（Human実行へ戻す）"
