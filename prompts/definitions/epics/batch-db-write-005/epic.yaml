schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-db-write-005"
  title: "batch-db-write-005:BATCH-005 staging書込本格化"
  summary: "IF-DB-BATCH-005 の staging_* UPSERT と raw_product_metadata.import_status 更新を本番 SQL で本配線する。SELECT は #1623 済み。ranking/genre は Wave 2。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  E2 は代表 IF の UPSERT のみ。IF-DB-BATCH-005 は in-memory + write_rows のまま。
  #1623 で SELECT/GET が開放された結果、実環境では Staging 書込・mark_failed で本線が止まる。
  機能・領域単位 Epic（例外）。#1623 は読取専用のため本 Epic で書込を扱う。

objective: |
  BATCH-005 の Staging 永続化と import_status 更新を upsert_rows / update / delete で本配線し、
  SELECT → GET → persist → status まで実 DB で通す。develop 統合は本 Epic PR のみ。

scope:
  - "staging_item / staging_item_image の本番 UPSERT（conflict キーは DDL UNIQUE）"
  - "staging_item_image 集合外 URL の同期 DELETE"
  - "raw_product_metadata.import_status（staged / failed）UPDATE 本配線"
  - "必要なら DbWriter に update_rows / delete_rows 最小追加"
  - "Wave 2: staging_ranking_signal / staging_genre（同一 Epic 内・後続 Task）"
  - "UT + 実装 Task ごとの実 DB 疎通（local/dev/staging）"
  - "IF-DB ギャップ一覧の進捗反映"
  - "secret / .env 実値禁止"

out_of_scope:
  - "DB SELECT 本配線（#1623）"
  - "007 以降の item / queue 等フル UPSERT（#1633〜）"
  - "E4 観測横断 / 親 workflow schedule"
  - "DDL 破壊的変更（必要時は Human 判断）"
  - "CI 既定 live / production 無承認"
  - "OpenAPI / web / api / reco 破壊変更"

