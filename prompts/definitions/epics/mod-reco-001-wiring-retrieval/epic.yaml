schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-mod-reco-001-wiring-retrieval"
  title: "MOD-RECO-001:Orchestrator Wiring（Retrieval）"
  summary: "MOD-RECO-001 Recommendation Orchestrator の Retrieval フェーズ（MOD-RECO-012 / MOD-RECO-013）について、各モジュール implementation 完了後に build_default_stub_ports() の該当 Port を本実装へ差し替える Wiring milestone Epic。stubs.py の競合をフェーズ単位で直列化する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"

background: |
  MOD-RECO-001 Recommendation Orchestrator の下位モジュール配線方針（モジュール仕様書 §8.4）において、段階2: フェーズ Wiring Task を Epic Issue として管理する。
  起動フェーズ（MOD-RECO-002 / 003）および User Meaning フェーズ（004〜010）は別 Epic で管理。本 Epic は Retrieval フェーズについて、各モジュール implementation Task 完了後に build_default_stub_ports() の該当 Port を本実装へ差し替える milestone である。
  MOD-RECO-011 は独立モジュールとして廃止され、Pre Hard Filter は MOD-RECO-012 内部サブモジュールに統合済み（Issue #867 / Epic #864）。Orchestrator の Port コンテナは pre_hard_filter / candidate_retriever / post_hard_filter の 3 スロットを維持するため、配線 Task では §8.4.2（012〜013）と Port I/F の整合を Human Review で確認する。
  StubXxx クラスは削除せず、MVP デフォルト composition の参照先のみ本実装に変更する（§8.4.1）。
  親 Epic #260（MOD-RECO-001:Recommendation Orchestrator）配下の milestone だが、develop への統合は本 Epic PR のみで行う（Epic Branch は develop 起点）。

objective: |
  Retrieval フェーズの Orchestrator Wiring を Epic Issue / 配下 Task で管理し、recommendation-orchestrator/stubs.py の競合をフェーズ単位で直列化する。
  配下 Task の PR target は本 Epic Branch とし、develop への統合は本 Epic PR のみで行う。

scope:
  - "Retrieval フェーズ（MOD-RECO-012 / MOD-RECO-013）の build_default_stub_ports() 配線 Task を Issue 化する"
  - "対象 Port: pre_hard_filter, candidate_retriever, post_hard_filter（011 廃止後の Port スロット整合を含む）"
  - "配線後の Orchestrator デフォルト経路テスト（test_recommendation_orchestrator.py 等）を Epic Branch で更新する"
  - "Epic develop merge 後の ExecutionContext 型付き化 / integration 再テスト follow-up Task 起票（playbook 順序 3〜4）"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/mod-reco-001-wiring-retrieval/**）を整理する"

out_of_scope:
  - "対象モジュール（MOD-RECO-012 / MOD-RECO-013）本体の新規実装（各 MOD-RECO-* Epic 配下 Task）"
  - "起動フェーズ（002 / 003）の再配線"
  - "User Meaning フェーズ（004〜010）の再配線"
  - "他フェーズの Wiring（別 Epic）"
  - "段階3 Composition 完成（本番 DI / DB Repository / E2E 強化）"
  - "StubXxx クラスの削除"
  - "Orchestrator 本体の Port 数・呼び出し順の設計変更（別 Epic / docs Task）"
  - "execution_context.py の型付きフィールド追加（develop 直 follow-up Task #887。playbook 順序 3）"
  - "integration 再テストの getattr 置換（develop 直 follow-up Task #892。playbook 順序 4）"
  - "API-INT-002 エンドポイント層"
  - "OpenAPI / Orval / generated 変更"
  - "DB schema 変更"

input:
  docs:
    - path: "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md"
      required: true
      purpose: "配線方針・フェーズ単位・stubs.py 配置の正本（§8.4）"
    - path: "docs/05_アプリケーション設計/アプリ/reco/Recoモジュール一覧.md"
      required: true
      purpose: "対象モジュール（MOD-RECO-012 / MOD-RECO-013）の責務確認"
    - path: "docs/06_実装設計/reco/MOD-RECO-012_Candidate Retrieverモジュール仕様書.md"
      required: true
      purpose: "012 内部 pre_hard_filter / retrieval と Orchestrator 1 呼び出しの正本"
    - path: "docs/06_実装設計/reco/MOD-RECO-013_Post Hard Filter Executorモジュール仕様書.md"
      required: true
      purpose: "013 Port I/F・ExecutionContext キーの正本"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic 方針（§3.5）を確認するため"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic タイトル規約（§15.0）を確認するため"
  templates: []
  files:
    - path: "apps/reco/src/reco/application/recommendation-orchestrator/stubs.py"
      required: true
      purpose: "配線対象の build_default_stub_ports()"
  issues:
    - number: 260
      purpose: "親 Epic（MOD-RECO-001:Recommendation Orchestrator）"
    - number: 789
      purpose: "本 Epic Issue"
  prs: []

output:
  docs: []
  files:
    - "apps/reco/src/reco/application/recommendation-orchestrator/stubs.py"
    - "apps/reco/src/reco/application/recommendation-orchestrator/__init__.py"
  tests:
    - "apps/reco/tests/unit/application/test_recommendation_orchestrator.py"
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue（タイトル: [Epic]MOD-RECO-001:Orchestrator Wiring（Retrieval））"
  - "Epic Branch（develop 起点 / feature/epic-789-mod-reco-001-wiring-retrieval）"
  - "子 Task 候補: prompts/definitions/tasks/mod-reco-001-wiring-retrieval/wiring.yaml"
  - "epic_scope.allowed_paths による配下 Task のファイル境界宣言"

acceptance_criteria:
  - "Epic Issue #789 が存在する"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "対象フェーズ（MOD-RECO-012 / MOD-RECO-013）の Port が build_default_stub_ports() で本実装を参照している"
  - "StubXxx は失敗注入・明示 DI テスト用に残存している"
  - "Orchestrator デフォルト経路の関連テストが green"
  - "配下 Wiring Task PR が merge され、Epic PR が develop へ統合可能"
  - "playbook 順序 3〜4 follow-up Task（#887 / #892）が起票されている"

follow_up_tasks_outside_epic:
  - task_area: "execution-context-typed-fields"
    issue_number: 887
    branch_scope: "develop"
  - task_area: "integration-retest"
    issue_number: 892
    branch_scope: "develop"
    depends_on:
      - 887
      - 891

branch:
  no_branch: false
  name: "feature/epic-789-mod-reco-001-wiring-retrieval"
  base: "develop"
  target: "develop"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "medium"
    planned_start: "2026-06-26"
    due_date: "2026-06-28"

issue:
  unit: "epic"
  type: "feature"
  area: "reco"

epic_scope:
  artifact_id: "MOD-RECO-001"
  allowed_paths:
    - "apps/reco/src/reco/application/recommendation-orchestrator/stubs.py"
    - "apps/reco/src/reco/application/recommendation-orchestrator/__init__.py"
    - "apps/reco/tests/unit/application/test_recommendation_orchestrator.py"
    - "prompts/definitions/tasks/mod-reco-001-wiring-retrieval/**"
    - "prompts/definitions/reviews/mod-reco-001-wiring-retrieval/**"
    - "prompts/definitions/epics/mod-reco-001-wiring-retrieval/**"
  forbidden_paths:
    - "apps/reco/src/reco/application/**/"
    - "apps/reco/src/reco/api/**"
    - "apps/api/**"
    - "apps/web/**"
    - "apps/batch/**"
    - "openapi/**"
    - "db/**"
  child_task_areas:
    - "wiring"
    - "integration-test"

dependencies:
  epics:
    - number: 864
      purpose: "MOD-RECO-012 Candidate Retriever Epic 完了（011 統合含む）"
    - number: 876
      purpose: "MOD-RECO-013 Post Hard Filter Executor Epic 完了"
  issues:
    - number: 260
      purpose: "親 Epic（MOD-RECO-001:Recommendation Orchestrator）"
    - number: 871
      purpose: "MOD-RECO-012 implementation Task 完了"
    - number: 879
      purpose: "MOD-RECO-013 implementation Task 完了"
  prs: []
  tasks: []
  blocking: true

parallel_control:
  depends_on: []
  blocks: []
  exclusive_files:
    - "apps/reco/src/reco/application/recommendation-orchestrator/stubs.py"
  conflict_risk: "high"
  contract_impact: false
  generated_impact: false
  db_impact: false

test_policy:
  required:
    - "apps/reco/tests/unit/application/test_recommendation_orchestrator.py"
  commands:
    - "cd apps/reco && uv run pytest tests/unit/application/test_recommendation_orchestrator.py -q"
  manual_checks:
    - "MOD-RECO-012 / MOD-RECO-013 の unit test が green であること"
    - "stubs.py の変更が Retrieval フェーズ Port に限定されているか"
    - "モジュール本体（MOD-RECO-012 / MOD-RECO-013）への変更が混入していないか"
  not_required:
    - "integration test（E2E）"
  skip_reason:
    "integration test（E2E）": "段階3 Composition 完成 Task の範囲"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "stubs.py の変更が Retrieval フェーズ Port に限定されているか"
    - "モジュール本体（MOD-RECO-012 / MOD-RECO-013）への変更が混入していないか"
    - "Port I/F（ExecutionContext キー等）が各モジュール unit test と一致しているか"
    - "011 廃止後の pre_hard_filter Port 配線が MOD-RECO-001 §8.4 と矛盾しないか"
    - "exclusive_files（stubs.py）の直列化方針に反していないか"
    - "Epic PR target が develop であるか"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: false

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: false
  reason: "Wiring milestone は Issue / PR で管理"

risk_points:
  - "stubs.py の exclusive_files により配下 Task は直列化が必要"
  - "011 廃止後も Port 3 スロットが残るため pre_hard_filter 配線方針の Human 判断が必要"
  - "デフォルト経路テストの期待値更新が複数モジュール配線で累積する"

human_decision_points:
  - "011 廃止後の pre_hard_filter Port をどう配線するか（012 内部統合との整合）"
  - "対象モジュール implementation Task がすべて完了しているか（Wiring 着手タイミング）"
  - "デフォルト経路テストの期待値更新が妥当か"

stop_conditions:
  - "前提モジュール Epic の implementation Task が未完了"
  - "stubs.py 以外のモジュール本体変更が必要になった"
  - "正本 docs（§8.4）と Task Definition の配線方針が矛盾した"
  - "epic_scope.allowed_paths が空または未記載の場合"

notes:
  - "Epic Issue: #789"
  - "親 Issue: #260（[Epic]MOD-RECO-001:Recommendation Orchestrator）"
  - "Epic Branch: `feature/epic-789-mod-reco-001-wiring-retrieval`（Issue #789）"
  - "配線方針正本は MOD-RECO-001 モジュール仕様書 §8.4"
  - "follow-up playbook: prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/wiring-phase-follow-up-playbook.yaml"
  - "子 Task 候補: prompts/definitions/tasks/mod-reco-001-wiring-retrieval/wiring.yaml（後続 /start-task で起票）"
  - "PR 作成前に prompts/definitions/reviews/mod-reco-001-wiring-retrieval/epic/pr-review.yaml を Epic Branch に含める（ai_review_required: true）"
