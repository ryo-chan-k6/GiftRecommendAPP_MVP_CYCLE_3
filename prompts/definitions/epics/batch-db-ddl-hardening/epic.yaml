  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  E0/E1 完了。次は E2（DB/DDL/IF-DB）。ギャップ一覧 §9 で #102/#109/#133/#136 は E2 取込確定。
  現状 apps/batch は ScaffoldDbWriter / in-memory repositories のみ。migrations は 4 本で主要テーブルは概ね存在。
  019 出力物理・018 本格・外部 API 本接続は除外。破壊的 DDL は Human 承認必須。
  機能・領域単位 Epic（例外）。

objective: |
  IF-DB × テーブル × migration × stub の正本ギャップを docs 化し、不足 DDL・接続基盤・stub 解除を段階 Task で進める。
  develop 統合は本 Epic PR のみ。

scope:
  - "IF-DB-BATCH-001〜017(+020/021,+VEC-001) の棚卸しマトリクス（docs 正本）"
  - "不足 DDL/migration（001〜017 範囲。列差分含む）。019 出力物理は除外"
  - "DbWriter 実接続基盤（Scaffold 切替残す）"
  - "IF stub 解除（Wave A 取込系 → Wave B 意味生成系）。012/015 handoff 方針は Human 確認後"
  - "関連 UT / 境界テスト"
  - "#102/#109/#133/#136 の関係整理（クローズ実行は Human）"

out_of_scope:
  - "親 / 複合 workflow 新規・改修"
  - "外部 API（楽天・OpenAI）本接続（E3）"
  - "BATCH-018 / 019 出力物理 DDL 本格整備・本格化"
  - "MOD-BATCH-043 / 044"
  - "production DB への直接適用"
  - "OpenAPI / web / api / reco 破壊変更"

