schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-db-ddl-hardening"
  title: "batch-db-ddl-hardening:IF・DB・DDL本実装"
  summary: "E2。BATCH-001〜017 中心に IF-DB stub 解除計画・不足 DDL/migration・実 DB 接続を進める。019 出力物理 DDL・外部 API 本接続・親 workflow は out of scope。OPEN #102/#109/#133/#136 を取込整理する。"

work_mode: "ai-agent"

commands:
