    - "integration test"
  skip_reason:
    "unit test": "Epic は作業管理単位"
    "integration test": "Epic は作業管理単位"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "Epic scope が BATCH-010 に閉じているか"
    - "IF-DB-BATCH-011 と IF-DB-BATCH-010（BATCH-009）の混同がないか"
    - "MOD-RECO-026 / apps/reco を破壊変更していないか"
    - "Contract Gate 不要方針"
    - "Epic PR target が develop か"
  specialist_reviews:
    docs: false
    test: false
    contract: false
    security: true

human_decision_points:
  - "独立 YAML（batch-item-semantic.yml）を MVP 初期の正とするか（親 meaning-generation 全体改修は本 Epic 外）"
  - "MVP 初版の LLM は Scaffold のみか実呼出か"
  - "Queue 更新は generation_type=semantic 行のみか"
  - "IF-SHARED-001 の実装形態（in-process import アダプタ vs 別プロセス）"

notes:
  - "Issue #1422"
  - "後続 Task: batch-spec → implementation → unit-test → Epic PR"
