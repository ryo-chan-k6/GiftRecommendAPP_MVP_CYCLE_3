  allowed_paths:
    - "docs/06_実装設計/batch/BATCH-010_*"
    - "apps/batch/src/batch/application/item_semantic/**"
    - "apps/batch/src/batch/application/__init__.py"
    - "apps/batch/src/batch/infrastructure/db/**"
    - "apps/batch/src/batch/infrastructure/logger/**"
    - "apps/batch/src/batch/infrastructure/external_ai/**"
    - "apps/batch/src/batch/config/**"
    - "apps/batch/tests/**"
