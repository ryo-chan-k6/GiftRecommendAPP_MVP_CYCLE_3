schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-010-item-semantic"
  title: "BATCH-010:Item Semantic生成Batch"
  summary: "BATCH-010（Item Semantic生成Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。item_generation_queue（semantic）を消化し item_semantic を保存する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b 意味生成パイプラインの Semantic 生成段。識別子単位 Epic（1 Batch ID = 1 Epic）として bootstrap する。
  先行 BATCH-009 は develop merge 済み（#1406 / PR #1421）。
  MOD-RECO-026（#1092）と item_semantic テーブル定義（#513）は整備済み。専用バッチ仕様書・apps/batch 実装・workflow は未着手。
  IF は IF-DB-BATCH-011（item_semantic 保存）と IF-SHARED-001（batch→reco Semantic 生成）。IF-DB-BATCH-010 はキュー登録（BATCH-009）であり混同禁止。
  Batch は HTTP API 化しないため Contract Gate は不要。後続は BATCH-011。

objective: |
  BATCH-010 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-010 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-010-item-semantic/**）を整理する"
  - "Contract Gate 不要方針を明示する"
  - "MOD-RECO-026 / IF-SHARED-001 / IF-DB-BATCH-011 / Queue 消化境界を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜009 / 011〜019）の仕様書・実装・テスト（先行・後続は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・DB schema / migration（既存定義の参照は可）"
  - "本番リリース作業"
  - "MOD-RECO-026 本体の破壊変更（呼出・アダプタのみ可。apps/reco は原則 forbidden）"
  - "BATCH-011〜015 の詳細実装"
  - "親 batch-item-meaning-generation.yml / retry-failed チェーン全体改修（独立子 workflow 追加は可）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-010 の Batch ID・処理概要・入出力・依存・MVP対象"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "Semantic 生成方針・Config Version Resolver"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ実行スケジュール設計書.md"
      required: true
      purpose: "meaning-generation チェーン内の位置"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ依存関係図.md"
      required: true
      purpose: "009 → 010 → 011 の依存"
    - path: "docs/06_実装設計/database/item_semantic_テーブル定義書.md"
      required: true
      purpose: "保存仕様・キー・skip"
    - path: "docs/06_実装設計/database/item_generation_queue_テーブル定義書.md"
      required: true
      purpose: "Queue 消化・status 遷移"
    - path: "docs/06_実装設計/batch/BATCH-009_商品意味生成キュー登録バッチ仕様書.md"
      required: true
      purpose: "先行 Queue 登録境界"
    - path: "docs/06_実装設計/reco/MOD-RECO-026_Item Semantic Generatorモジュール仕様書.md"
      required: true
      purpose: "生成ロジック正本・IF-SHARED-001"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase4b 縦串方針"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic / Task 命名"
  templates: []
  files: []
  issues: []
  prs: []

output:
  docs: []
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue（タイトル: [Epic]BATCH-010:Item Semantic生成Batch）"
  - "Epic Branch（develop 起点）"
  - "子 Task 候補一覧（仕様書 / 実装 / UT）"
  - "epic_scope.allowed_paths による配下 Task のファイル境界宣言"

acceptance_criteria:
  - "Epic Issue が作成されている"
  - "Issue タイトルが [Epic]BATCH-010:Item Semantic生成Batch 形式である"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "配下 Task の作業単位が整理されている"
  - "IF-DB-BATCH-011 / IF-SHARED-001 / MOD-RECO-026 との関係が明記されている"
  - "epic_scope.artifact_id が BATCH-010 である"

branch:
  no_branch: false
  summary: "batch-010-item-semantic"
  name: "feature/epic-1422-batch-010-item-semantic"
  base: "develop"
  target: "develop"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-17"
    due_date: "2026-07-21"

issue:
  number: 1422
  unit: "epic"
  type: "feature"
  area: "batch"

epic_scope:
