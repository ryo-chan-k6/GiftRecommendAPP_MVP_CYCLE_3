    - "prompts/definitions/tasks/batch-010-item-semantic/**"
    - "prompts/definitions/reviews/batch-010-item-semantic/**"
  forbidden_paths:
    - "apps/api/**"
    - "apps/reco/**"
    - "apps/web/**"
    - "packages/contracts/**"
    - "openapi/**"
    - "supabase/migrations/**"
    - "apps/batch/src/batch/application/item_generation_queue/**"
    - "apps/batch/src/batch/application/item_apply/**"
    - "apps/batch/src/batch/application/item_active_status/**"
    - "apps/batch/src/batch/application/product_diff/**"
  child_task_areas:
    - "batch-spec"
    - "implementation"
    - "unit-test"

dependencies:
  epics:
    - issue: 734
      title: "[Epic]batch-foundation:Batch共通基盤"
      purpose: "Phase4a（CLOSED）"
    - issue: 1406
      title: "[Epic]BATCH-009:商品意味生成キュー登録Batch"
      purpose: "Queue 登録。develop merge 済み"
    - issue: 1092
      title: "[Epic]MOD-RECO-026:Item Semantic Generator"
      purpose: "生成ロジック正本（CLOSED）"
    - issue: 513
      title: "item_semantic テーブル定義"
      purpose: "保存正本（CLOSED）"
  issues: []
  prs:
    - number: 1421
      purpose: "BATCH-009 Epic MERGED"
    - number: 1102
      purpose: "MOD-RECO-026 Epic MERGED"
  tasks: []
  blocking: false

parallel_control:
  depends_on:
    - "epic-batch-009-item-generation-queue"
  blocks:
    - "epic-batch-011-feature-input-hash"
  exclusive_files:
    - "apps/batch/src/batch/application/item_semantic/**"
  conflict_risk: "medium"
  contract_impact: false
  generated_impact: false
  db_impact: false

test_policy:
  required: []
  commands: []
  manual_checks:
    - "依存 Epic BATCH-009 / MOD-RECO-026 が CLOSED であること"
    - "item_semantic / item_generation_queue DDL が develop に存在すること"
  not_required:
