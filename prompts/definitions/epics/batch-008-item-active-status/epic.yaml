background: |
  Phase4b Batch レーンの active_status 本更新段。識別子単位 Epic（1 Batch ID = 1 Epic）として bootstrap する。
  先行 BATCH-006 / BATCH-007 は develop merge 済み（#1341 / PR #1355、#1356 / PR #1370）。
  BATCH-004 候補経路（item_active_status_candidate）と BATCH-006 Diff 経路（product_diff_result）の両方を読み、item.active_status を本更新する。
  Epic #1227（候補テーブル整備）で BATCH-008 仕様書初版と item_active_status パッケージの部分実装・UT が先行している。本 Epic は識別子 BATCH-008 縦串の親として、仕様整備 → ギャップ実装 → UT 拡充 → develop 統合を行う。
  Batch は HTTP API 化しないため Contract Gate は不要。
  前提: Phase4a batch-foundation（#734）CLOSED。後続は BATCH-009 / BATCH-017。

objective: |
  BATCH-008 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様整備 → 実装ギャップ → UT 完了後）。

scope:
  - "BATCH-008 に関する子 Task の作業単位を整理する（バッチ仕様書整備 / 実装ギャップ / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-008-item-active-status/**）を整理する"
  - "Contract Gate 不要方針を明示する"
  - "Epic #1227 由来の既存成果（仕様書・item_active_status/**）との境界を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜007 / 009〜019）の仕様書・実装・テスト（先行 Item 反映・後続キューは参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・Reco・DB schema / migration（既存 item / item_active_status_candidate 定義の参照は可。新規 migration が必要なら別途 Human 判断）"
  - "本番リリース作業"
  - "BATCH-004 Writer（候補 INSERT）の本実装（Reader/Applier は本 Epic）"
  - "BATCH-007 Item 反映・BATCH-009 キュー登録の詳細実装"
  - "親 item-import チェーン workflow 全体改修（独立子 workflow 追加は可）"

