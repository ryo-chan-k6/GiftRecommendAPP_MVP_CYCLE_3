schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-008-item-active-status"
  title: "BATCH-008:商品有効状態更新Batch"
  summary: "BATCH-008（商品有効状態更新Batch）に関するバッチ仕様書整備・実装・単体テストを管理するEpic。product_diff_result と item_active_status_candidate を入力に item.active_status を本更新する。"

work_mode: "ai-agent"

