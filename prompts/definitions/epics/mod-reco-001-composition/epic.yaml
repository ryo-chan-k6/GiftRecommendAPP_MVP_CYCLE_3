dependencies:
  epics: []
  issues:
    - number: 260
      purpose: "親 Epic（MOD-RECO-001:Recommendation Orchestrator）"
    - number: 1075
      purpose: "§14 integration 完了後 docs 追随（並行可）"
  prs:
    - number: 1072
      purpose: "§14 No.10 merge"
    - number: 1070
      purpose: "§14 No.11 merge"
    - number: 1074
      purpose: "§14 No.14 merge"
  tasks: []
  blocking: false

parallel_control:
  depends_on:
    - "task-mod-reco-001-post-section14-integration-docs-alignment"
  blocks: []
  exclusive_files:
    - "apps/reco/src/reco/composition/**"
    - "apps/reco/src/reco/infrastructure/db/repositories/**"
  conflict_risk: "high"
  contract_impact: false
  generated_impact: false
  db_impact: true

test_policy:
  required:
    - "apps/reco/tests/integration/**"
  commands:
    - "cd apps/reco && uv run pytest tests/integration -q"
  manual_checks:
    - "MVP デフォルト composition（build_default_stub_ports）が維持されているか"
    - "Postgres Repository DI が composition root から選択可能か"
    - "§14 No.10 E2E が Epic Branch で green か"
  not_required:
    - "API-INT-002 endpoint E2E"
  skip_reason:
    "API-INT-002 endpoint E2E": "API-INT-002 Epic 配下 Task"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "epic_scope / allowed_paths が段階3 Composition に閉じているか"
    - "stubs.py / orchestrator.py への変更が混入していないか"
    - "MVP デフォルト composition と本番 composition の責務分離が明確か"
    - "Postgres Repository が既存 DB 定義書と整合しているか"
    - "§14 E2E 強化が No.10 観点を満たしているか"
    - "Epic PR target が develop であるか"
  specialist_reviews:
    docs: false
    test: true
    contract: false
    security: true

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: true
    experiments: false
  reason: "段階3 Composition は DB / infrastructure 横断影響あり"

risk_points:
  - "Postgres Repository 実装と既存 InMemory テストの二重保守"
  - "composition root 配置と API-INT-002 エンドポイント層の境界混同"
  - "DB migration / schema 変更の別 Task 化漏れ"

human_decision_points:
  - "Postgres Repository の MVP 対象範囲（002/028/029/025 のどこまでを Epic 内で完結させるか）は子 Task 起票時に分割判断する"

stop_conditions:
  - "DB schema 変更が Epic scope を超える"
  - "OpenAPI / generated 変更が必要"
  - "stubs.py の MVP デフォルト composition 削除が必要と判断された場合（Human 確認）"

notes:
  - "Epic Issue: #1076"
  - "親 Issue: #260（[Epic]MOD-RECO-001:Recommendation Orchestrator）"
  - "Epic Branch: feature/epic-1076-mod-reco-001-composition"
  - "workstream_key: mod-reco-001-composition"
  - "子 Task 起票候補（bootstrap 後）:"
