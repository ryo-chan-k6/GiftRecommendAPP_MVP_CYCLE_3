      required: true
      purpose: "PIPELINE_* 定数の更新対象"
    - path: "apps/api/src/infrastructure/reco-client/config.ts"
      required: true
      purpose: "DEFAULT_RECO_REQUEST_TIMEOUT_MS の更新対象"
  docs:
    - path: "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md"
      required: true
      purpose: "§13.2 本番主経路 soft/hard の正本（変更しない）"
    - path: "docs/03_ドメイン要件定義/非機能要件定義書/性能要件（バックエンド）.md"
      required: true
      purpose: "性能要件の正本（変更しない）"
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API実装仕様書.md"
