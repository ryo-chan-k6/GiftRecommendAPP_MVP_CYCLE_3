    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API実装仕様書.md"
      required: true
      purpose: "4,000ms 記載の更新対象"

acceptance_criteria:
  - "PIPELINE_SOFT_TIMEOUT_MS = 6_000 / PIPELINE_HARD_TIMEOUT_MS = 8_000"
  - "API-PUB-002 / API-INT-002 実装仕様書の reco hard timeout 記載が 8,000ms"
  - "DEFAULT_RECO_REQUEST_TIMEOUT_MS が 8_000 以上（本 Epic では 9_000）"
  - "hard timeout 境界値 unit test が新定数で通る"
  - "OpenAPI / generated / DB migration を変更していない"
  - "性能要件 / MOD-RECO-001 §13.2 の数値を変更していない"

branch:
