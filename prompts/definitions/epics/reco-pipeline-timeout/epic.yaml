schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-reco-pipeline-timeout"
  title: "reco-pipeline-timeout:本番主経路 soft6s/hard8s 整合"
  summary: "PIPELINE_SOFT/HARD が旧暫定 2,000/4,000ms のまま残っており、#1533 / MOD-RECO-001 §13.2 / 性能要件の本番主経路 soft 6,000 / hard 8,000 と不整合。#1748 で確定した A1 にコード・API 実装仕様・api→reco timeout 既定を揃える。"
  phase: "07_開発・単体テスト"

work_mode: "ai-agent"

parent:
  epic_id: null
  epic_issue_number: 1781
  epic_branch: "fix/epic-1781-reco-pipeline-timeout"
  related_issues:
    - 1748
    - 1747
    - 1533
    - 1781
  related_prs: []

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"
    - "docs-reviewer-ai"

background: |
  #1748 で Human が次を確定した（2026-07-31）。

  | 定数 | 確定値 | 意味 |
  | --- | --- | --- |
  | PIPELINE_SOFT_TIMEOUT_MS | 6,000ms | 同期外部 AI 込み・本番主経路 soft |
  | PIPELINE_HARD_TIMEOUT_MS | 8,000ms | 同期外部 AI 込み・本番主経路 hard（GRS-REC-101） |

  Reco 内部監視用 soft 1,500 / hard 2,000 は docs 上の監視用 SLO として維持し、
  PIPELINE_* 定数とは役割を分ける（案 A1）。

  現状（事実）:
  - constants.py は 2_000 / 4_000（コメント「暫定値（PoC 後更新）」）
  - API-PUB-002 / API-INT-002 実装仕様書は reco hard 4,000ms 記載
  - apps/api DEFAULT_RECO_REQUEST_TIMEOUT_MS = 5_000（旧 hard 4,000 前提）
  - MOD-RECO-001 §13.2 / 性能要件は既に 6s/8s（変更不要）

objective: |
  #1748 確定値（soft 6,000 / hard 8,000）へコード・API 実装仕様・
  api→reco HTTP timeout 既定を整合させ、ウォッチドッグとクライアント timeout の
  関係を docs / 実装で一致させる。

scope:
  - "PIPELINE_SOFT_TIMEOUT_MS / PIPELINE_HARD_TIMEOUT_MS を 6_000 / 8_000 へ更新"
  - "constants コメントを #1533 / #1748 確定値へ更新"
  - "hard timeout 境界値 unit test の更新"
  - "API-PUB-002 / API-INT-002 実装仕様書の 4,000ms 記載を 8,000ms へ更新"
  - "DEFAULT_RECO_REQUEST_TIMEOUT_MS を hard 以上（9_000ms）へ更新"
  - "子 Task 1 本の起票・完了追跡"

out_of_scope:
  - "性能要件（バックエンド）/ MOD-RECO-001 §13.2 の soft/hard 値変更（既に 6s/8s）"
  - "Reco 内部監視用 soft 1,500 / hard 2,000 のコード定数新設（必要なら別 Task）"
  - "OpenAPI / packages/contracts / generated の変更"
  - "推薦ロジック・スコアリング・DB schema の変更"
  - "stg / prod の Environment 実値変更（Human。既定値と docs のみ本 Epic）"
  - "secret 実値の取り扱い"

epic_scope:
  artifact_id: ""
  allowed_paths:
    - "apps/reco/src/reco/application/recommendation-orchestrator/**"
    - "apps/reco/tests/unit/application/**"
    - "apps/api/src/infrastructure/reco-client/**"
    - "apps/api/tests/unit/infrastructure/**"
    - "docs/06_実装設計/api/API-PUB-002_レコメンド実行API実装仕様書.md"
    - "docs/06_実装設計/api/API-INT-002_Reco推薦実行API実装仕様書.md"
    - "prompts/definitions/epics/reco-pipeline-timeout/**"
    - "prompts/definitions/tasks/reco-pipeline-timeout/**"
    - "prompts/definitions/reviews/reco-pipeline-timeout/**"
