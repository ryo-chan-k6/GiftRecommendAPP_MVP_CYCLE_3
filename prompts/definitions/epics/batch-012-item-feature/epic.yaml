schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-012-item-feature"
  title: "BATCH-012:Item Feature生成Batch"
  summary: "BATCH-012（Item Feature生成Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。IF-SHARED-002 経由で MOD-RECO-027 を呼び出し、item_feature.raw_value 等を Upsert する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b 意味生成パイプラインの Item Feature 生成段。識別子単位 Epic（1 Batch ID = 1 Epic）。
  先行 BATCH-011 は develop merge 済み（#1434 / PR #1445）。
  item_feature / item_semantic / item_generation_queue テーブル定義、MOD-RECO-027（#1104）は整備済み。
  専用バッチ仕様書・apps/batch 実装・workflow は未着手。
  IF は IF-DB-BATCH-013（Item Feature保存）+ IF-SHARED-002（Feature 生成ロジック呼出）。
  IF-DB-BATCH-012 は Feature入力hash（BATCH-011）であり混同禁止。
  Batch は HTTP API 化しないため Contract Gate は不要。後続は BATCH-013。

objective: |
  BATCH-012 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-012 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-012-item-feature/**）を整理する"
  - "Contract Gate 不要方針を明示する"
  - "IF-DB-BATCH-013 / IF-SHARED-002 / BATCH-011・013 境界を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜011 / 013〜019）の仕様書・実装・テスト（先行・後続は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・DB schema / migration（既存定義の参照は可）"
  - "本番リリース作業"
  - "apps/reco 本体の破壊変更（MOD-RECO-027 は呼び出しのみ。必要なら in-process アダプタを batch 側に置く）"
  - "BATCH-013〜015 の詳細実装（正規化・Embedding 等）"
  - "親 batch-item-meaning-generation.yml / retry-failed チェーン全体改修（独立子 workflow 追加は可）"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-012 の Batch ID・処理概要・入出力・依存・MVP対象"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "Feature 生成・冪等・skip 方針"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ実行スケジュール設計書.md"
      required: true
      purpose: "meaning-generation チェーン内の位置"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ依存関係図.md"
      required: true
      purpose: "011 → 012 → 013 の依存"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-BATCH-013 / IF-SHARED-002"
    - path: "docs/06_実装設計/database/item_feature_テーブル定義書.md"
      required: true
      purpose: "raw Upsert・冪等キー・feature_input_hash 列"
    - path: "docs/06_実装設計/database/item_semantic_テーブル定義書.md"
      required: true
      purpose: "SELECT 入力（DML 禁止）"
    - path: "docs/06_実装設計/database/item_generation_queue_テーブル定義書.md"
      required: true
      purpose: "Queue 消化・status"
    - path: "docs/06_実装設計/batch/BATCH-011_Feature入力hash算出バッチ仕様書.md"
      required: true
      purpose: "先行 hash handoff / IF-DB-BATCH-012 境界"
    - path: "docs/06_実装設計/reco/MOD-RECO-027_Item Feature Generatorモジュール仕様書.md"
      required: true
      purpose: "IF-SHARED-002 呼び出し先"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase4b 縦串方針"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic / Task 命名"
  templates: []
  files: []
  issues: []
  prs: []

output:
  docs: []
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue（タイトル: [Epic]BATCH-012:Item Feature生成Batch）"
  - "Epic Branch（develop 起点）"
  - "子 Task 候補一覧（仕様書 / 実装 / UT）"
  - "epic_scope.allowed_paths による配下 Task のファイル境界宣言"

acceptance_criteria:
  - "Epic Issue が作成されている"
  - "Issue タイトルが [Epic]BATCH-012:Item Feature生成Batch 形式である"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "配下 Task の作業単位が整理されている"
  - "IF-DB-BATCH-013 / IF-SHARED-002 と IF-DB-BATCH-012（BATCH-011）の混同防止が明記されている"
  - "epic_scope.artifact_id が BATCH-012 である"

branch:
  no_branch: false
  summary: "batch-012-item-feature"
  name: "feature/epic-1446-batch-012-item-feature"
  base: "develop"
  target: "develop"
  worktree_required: true

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "Todo"
    priority: "high"
    planned_start: "2026-07-18"
    due_date: "2026-07-20"

issue:
  number: 1446
  unit: "epic"
  type: "feature"
  area: "batch"

epic_scope:
  artifact_id: "BATCH-012"
  allowed_paths:
    - "docs/06_実装設計/batch/BATCH-012_*"
    - "apps/batch/src/batch/application/item_feature/**"
    - "apps/batch/src/batch/application/__init__.py"
    - "apps/batch/src/batch/infrastructure/db/**"
    - "apps/batch/src/batch/infrastructure/logger/**"
    - "apps/batch/src/batch/config/**"
    - "apps/batch/tests/**"
    - ".github/workflows/batch-item-feature*.yml"
    - "prompts/definitions/epics/batch-012-item-feature/**"
    - "prompts/definitions/tasks/batch-012-item-feature/**"
    - "prompts/definitions/reviews/batch-012-item-feature/**"
  forbidden_paths:
    - "apps/api/**"
    - "apps/reco/**"
    - "apps/web/**"
    - "packages/contracts/**"
    - "openapi/**"
    - "supabase/migrations/**"
    - "apps/batch/src/batch/application/item_semantic/**"
    - "apps/batch/src/batch/application/feature_input_hash/**"
    - "apps/batch/src/batch/application/item_generation_queue/**"
    - "apps/batch/src/batch/application/item_apply/**"
    - "apps/batch/src/batch/application/item_active_status/**"
  child_task_areas:
    - "batch-spec"
    - "implementation"
    - "unit-test"

dependencies:
  epics:
    - issue: 1434
      title: "[Epic]BATCH-011:Feature入力hash算出Batch"
      purpose: "先行 Feature入力hash。develop merge 済み"
    - issue: 1104
      title: "[Epic]MOD-RECO-027:Item Feature Generator"
      purpose: "IF-SHARED-002 呼び出し先（CLOSED）"
    - issue: 514
      title: "item_feature テーブル定義"
      purpose: "item_feature 列正本（CLOSED）"
  issues: []
  prs:
    - number: 1445
      purpose: "BATCH-011 Epic MERGED"
  tasks: []
  blocking: false

parallel_control:
  depends_on:
    - "epic-batch-011-feature-input-hash"
  blocks:
    - "epic-batch-013-feature-normalization"
  exclusive_files:
    - "apps/batch/src/batch/application/item_feature/**"
  conflict_risk: "medium"
  contract_impact: false
  generated_impact: false
  db_impact: false

test_policy:
  required: []
  commands: []
  manual_checks:
    - "依存 Epic BATCH-011 が CLOSED であること"
    - "item_feature / item_semantic / item_generation_queue DDL が develop に存在すること"
    - "MOD-RECO-027 が develop に存在すること"
  not_required:
    - "unit test"
    - "integration test"
  skip_reason:
    "unit test": "Epic は作業管理単位"
    "integration test": "Epic は作業管理単位"

review:
  human_review_required: true
  ai_review_required: true
  review_points:
    - "Epic scope が BATCH-012 に閉じているか"
    - "IF-DB-BATCH-013 / IF-SHARED-002 と IF-DB-BATCH-012（BATCH-011）の混同がないか"
    - "BATCH-013 / apps/reco 破壊変更を含めていないか"
    - "Contract Gate 不要方針"
    - "Epic PR target が develop か"
  specialist_reviews:
    docs: false
    test: false
    contract: false
    security: true

human_decision_points:
  - "独立 YAML（batch-item-feature.yml）を MVP 初期の正とするか"
  - "IF-SHARED-002 を in-process import アダプタとするか（BATCH-010 IF-SHARED-001 同型）"
  - "消化対象 Queue（feature queued / semantic processing 継続）と BATCH-011 handoff 参照形態"
  - "MVP 初版で Feature Engine の LLM 補助を Scaffold とするか"

notes:
  - "後続 Task: batch-spec → implementation → unit-test → Epic PR"
  - "Issue #1446"
