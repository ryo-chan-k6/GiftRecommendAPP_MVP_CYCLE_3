epic:
  id: "epic-batch-db-write-009-010"
  title: "batch-db-write-009-010:BATCH-009/010 queue・semantic書込本格化"
  summary: "BATCH-009 item_generation_queue と BATCH-010 item_semantic の本番書込を本配線する。SELECT は #1623、007/008 は #1633 済み。010 は Rule-first 維持（LLM 非混入）。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "test-ai"

background: |
  E2 T4b で 009/010 フル UPSERT は後続。SELECT #1623 は読取のみ。
  #1633 で item 側書込完了後、queue 投入と semantic 永続が次ブロッカー。
  機能・領域単位 Epic（例外）。009 と 010 は同一 Epic（Issue §11 継続）。

objective: |
  BATCH-009 / 010 の本番 DB 書込を write/upsert/update で本配線し、
  generation queue → semantic（Rule-first）本線を実 DB で通す。develop 統合は本 Epic PR のみ。

scope:
  - "Wave 1: BATCH-009 item_generation_queue INSERT + active queued の queued_at UPDATE"
  - "Wave 2: BATCH-010 claim/status UPDATE + item_semantic UPSERT（conflict item_id + semantic_config_version_id）"
  - "010 Rule-first adapter 維持（LLM 本接続禁止）"
  - "偽 write マーカー（op=touch / claim 等）の廃止"
  - "UT + 実装 Task ごとの実 DB 疎通（local/dev/staging）"
  - "IF-DB ギャップ一覧の進捗反映"
  - "secret / .env 実値禁止"

out_of_scope:
  - "Semantic LLM 本接続"
  - "DB SELECT 本配線（#1623）"
  - "005/007/008 書込（#1632/#1633）"
  - "011 以降 feature/embedding 書込（#1635）"
  - "E4 / 親 workflow schedule"
  - "DDL 破壊的変更（必要時は Human 判断）"
  - "CI 既定 live / production 無承認"

