    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Human Decision 正本: ai-logs/human-decisions/2026-08-01-batch-local-cron-ops-next.md。
  次Epic分割 (2) local Phase2: 009〜016 を親シェルへ。起動は local_daily / local_weekly のみ。子Batch個別cron禁止。
  Phase1（#1811）は 001〜008(+017任意) の crontab 観測中（verify未了）。本Epicは観測と並行して設計・実装・dry-runを先行する。
  合意境界: Phase1観測中に実crontabへ009〜016を載せない / Phase2の追加liveで観測を濁さない。
  AIは --live-rakuten を実行しない。GHA schedule / #1607 / GHA楽天live / BATCH-018/019 は対象外維持。
  GHA batch-daily-orchestrator は import連鎖後に item_meaning_generation → distribution_metrics（009系〜016相当）だが、本Epicは local 親シェル配線のみ（GHA schedule有効化はしない）。

objective: |
  local親シェル（local_daily / local_weekly）へ BATCH-009〜016 を配線し、
  --dry-run で検証可能な状態にし、Phase1互換モード（009〜016スキップ）を残したうえで、
  crontab載せ替えは Humanゲート（Phase1観測完了またはHuman明示承認）まで着手しない。

scope:
  - "親シェルへ009〜016配線の設計（daily/weekly配置、GHA needs対応、flock、失敗停止、既存連鎖との境界、Phase1観測との非干渉）"
  - "scripts/batch 実装（--dry-run、Phase1互換モード / --skip-meaning 等）"
  - "dry-run検証とdocs同期（AI liveなし）"
  - "crontab載せ替え手順の定義とHumanゲート明示（実行はHuman承認後。観測中は載せない）"
  - "統括#1745 の次本線（local cron Phase2）追跡更新"
  - "Decision §4 Phase2行の状態更新"

out_of_scope:
  - "Phase1観測中の実crontab変更（001〜008行の破壊・009〜016のlive載せ替え）"
  - "Phase2追加の --live-rakuten / 実Batch live実行（AI禁止。観測濁し防止）"
  - "BATCH-018 / BATCH-019（Offline Eval / Feedback）"
  - "daily / weekly / manual 親 on.schedule のコメント解除・有効化（#1792 / B-1）"
  - "本番egress IP / NAT / self-hosted（#1607）"
  - "GHA / GitHub-hosted からの楽天HTTP live化"
  - "AIによる --live-rakuten 実行"
  - "secret実値・GitHub Secrets / Variables の表示・変更"
  - "OpenAPI / Orval / generated / apps/web|api|reco 変更"
  - "production定期開始・破壊的全件取得"
  - "Airflow等の本格ジョブ基盤導入"
  - "Phase1 Epic #1811 の再開・完了扱い・verify完了判断（分離維持）"

