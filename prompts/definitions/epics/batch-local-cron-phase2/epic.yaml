schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-local-cron-phase2"
  title: "batch-local-cron-phase2:local cron Phase2親シェル配線（009〜016）"
  summary: "統括#1745次本線。Phase1(#1811)観測と並行し、local親シェルへBATCH-009〜016を配線・dry-run検証する。Phase1観測中の実crontab載せ替え・AI live・018/019・GHA schedule・#1607は本Epic外。機能・領域単位Epic（例外）。"
  workstream_key: "batch-local-cron-phase2"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
