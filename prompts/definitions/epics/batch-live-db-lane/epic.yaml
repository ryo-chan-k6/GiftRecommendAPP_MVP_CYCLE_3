  - "STG_DATABASE_URL流用で足りるか"
  - "meaning連鎖の一括liveか段階liveか（010/015 scaffold維持）"
  - "stg実データ量・max_items・破壊的書込の許容"
  - "distribution-metrics末尾017をlive 017に揃えるか"

stop_conditions:
