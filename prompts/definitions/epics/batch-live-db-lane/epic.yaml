deliverables:
  - "Epic Issue #1750 / Branch feature/epic-1750-batch-live-db-lane"
  - "DB系GHA葉のstg live化（009/011〜014/016）"
  - "複合meaning経路の整合と手動検証結果"
  - "ギャップdocsの陳腐化更新"

acceptance_criteria:
  - "Epic Issueタイトルが [Epic]batch-live-db-lane:DB系live切替 形式"
  - "機能・領域単位Epic（例外）と artifact_id 空が明記されている"
  - "主対象BATCHが009/011〜014/016であること、001〜004と010/015がout of scopeであること"
  - "GHA葉がstg Environment + STG_DATABASE_URL経路でscaffold解除されている（該当葉）"
  - "job_run_idがUUID方針と整合している"
  - "stg手動検証結果または未実施理由が記録されている"
  - "secret実値を成果物・ログに含めない"
  - "Epic PR targetがdevelop"
  - "schedule有効化を含まない"

