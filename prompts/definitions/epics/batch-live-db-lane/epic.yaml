schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-live-db-lane"
  title: "batch-live-db-lane:DB系live切替"
  summary: "楽天HTTP/AI HTTPを触らず、DB中心BATCHのGHA葉をscaffoldからstg liveへ切り替える。主対象は009/011〜014/016。005〜008/017は維持・回帰。機能・領域単位Epic（例外）。統括は#1745。"
  workstream_key: "batch-live-db-lane"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_form: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  import連鎖（003※楽天scaffold / 005〜008 / 017）は #1717/#1726 系で GHA stg live 済み。
  meaning側の葉（009 / 011〜014 / 016）および関連複合子は --scaffold-demo 固定が残る。
  010 Semantic / 015 Embedding は AI系、001〜004 は楽天Fetch系として本Epic外。
  統括ロードマップは #1745（formal parentなし。#1楽天Fetch運用方針と並列可）。

objective: |
  DB系BATCHのGHA実行経路を stg live で安定させ、意味生成〜メトリクスまでの
  DB書込連鎖を手動検証できる状態にする（010/015はscaffold維持可）。

scope:
  - "GHA葉 009 / 011 / 012 / 013 / 014 / 016 の scaffold解除と stg live化（environment: stg + STG_DATABASE_URL、UUID job_run_id）"
  - "複合 batch-item-meaning-generation.yml（および必要なら retry）のDB葉経路整合（010/015はscaffold維持可）"
  - "既liveの005〜008 / 017の維持・回帰確認・docs更新"
  - "005のObject Storage liveはDBレーンに含めてよい（楽天ではない）"
  - "ギャップdocsのscaffold陳腐化箇所の更新"
  - "stg手動検証（低max_items）とsecretなし結果記録"
  - "統括#1745からの本線追跡更新"

out_of_scope:
  - "BATCH-001〜004の楽天live切替（batch-live-rakuten-fetch / #1607）"
  - "BATCH-010 / 015のAI live切替（batch-live-ai-lane）"
  - "親 on.schedule 有効化（batch-daily-schedule-enable / #1732）"
  - "BATCH-018 / 019"
  - "production定期・prod Secrets・secret実値の表示/変更"
  - "OpenAPI / Orval / generated / apps/web|api|reco 変更"
  - "DDL大規模変更・IF再本格化"

