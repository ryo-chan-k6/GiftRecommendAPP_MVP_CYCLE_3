schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-004-rakuten-existing-item-recheck"
  title: "BATCH-004:楽天既存商品再確認Batch"
  summary: "BATCH-004（楽天既存商品再確認Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。登録済み商品を楽天商品検索APIで再確認し Raw JSON と active_status 候補を残す Fetch チェーン第4段。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

agent:
  primary: "orchestrator-ai"
  support:
    - "support-ai"
  review:
    - "reviewer-ai"
    - "docs-reviewer-ai"
    - "test-ai"

background: |
  Phase4b Batch 並列レーン B1（Fetch）の第4段。実装フェーズ並列計画に従い、識別子単位 Epic（1 Batch ID = 1 Epic）として bootstrap する。
  先行 BATCH-001〜003 は develop merge 済み（#1161 / #1192 / #1207）。
  登録済み Item の external_item_code を fetch_cursor（cursor_type=recheck）で走査し、商品検索APIで現在値を Raw 保存する。
  Batch は HTTP API 化しないため Contract Gate は不要。
  前提: Phase4a batch-foundation（#734）CLOSED。

objective: |
  BATCH-004 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: バッチ仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-004 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-004-rakuten-existing-item-recheck/**）を整理する"
  - "Contract Gate 不要方針を明示する"

out_of_scope:
  - "他 Batch（BATCH-001 / 002 / 003 / 005〜019）の仕様書・実装・テスト（先行・共有 client は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・Reco・DB schema / migration"
  - "本番リリース作業"
  - "楽天 API 契約変更そのもの"
  - "BATCH-005 以降の Staging / Item 反映・active_status 本更新（BATCH-008）の詳細実装"

input:
  docs:
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-004 の Batch ID・処理概要・入出力・依存・MVP対象を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "実行方式・Raw/Staging・ログ方針を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ実行スケジュール設計書.md"
      required: true
      purpose: "existing-item-recheck 系 workflow との関係を確認するため"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "既存商品再確認方針・itemCode 指定取得を確認するため"
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "Phase4b Batch 縦串・並列方針を確認するため"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "識別子単位 Epic 方針を確認するため"
    - path: "docs/00_共通/AIエージェント運用/Task Definition設計書.md"
      required: true
      purpose: "Epic / バッチ Task 命名規約を確認するため"
  templates: []
  files: []
  issues: []
  prs: []

output:
  docs: []
  files: []
  tests: []
  generated:
    expected: false
    paths: []
    handling: "none"
  logs:
    ai_logs_required: false
    path: null

deliverables:
  - "Epic Issue（タイトル: [Epic]BATCH-004:楽天既存商品再確認Batch）"
  - "Epic Branch（develop 起点）"
  - "子 Task 候補一覧（バッチ仕様書 / 実装 / 単体テスト）"
  - "epic_scope.allowed_paths による配下 Task のファイル境界宣言"

acceptance_criteria:
  - "Epic Issue が作成されている"
  - "Issue タイトルが [Epic]BATCH-004:楽天既存商品再確認Batch 形式である"
  - "Epic Branch が develop から作成されている"
  - "Branch base / PR target が develop である"
  - "配下 Task の作業単位が整理されている"
  - "子 Task の PR target が親 Epic Branch である方針が明記されている"
  - "epic_scope.allowed_paths が BATCH-004 の責務範囲と整合している"
  - "epic_scope.artifact_id が BATCH-004 である"

