background: |
  Phase4b 意味生成パイプラインの入口。識別子単位 Epic（1 Batch ID = 1 Epic）として bootstrap する。
  先行 BATCH-007 / BATCH-008 は develop merge 済み（#1356 / PR #1370、#1379 / PR #1396）。
  `item_generation_queue` テーブル定義・DDL・enum は整備済み（#507 / #603）。専用バッチ仕様書・apps/batch 実装・workflow は未着手。
  IF は IF-DB-BATCH-010（Batch ID BATCH-009 と IF 番号が異なる点に注意。IF-DB-BATCH-009 は active_status）。
  Batch は HTTP API 化しないため Contract Gate は不要。後続は BATCH-010。

objective: |
  BATCH-009 に関する Epic Issue と Epic Branch を作成し、配下 Task の作業単位を整理する。
  配下 Task の差分が epic_scope.allowed_paths から外れないことをガードする。
  develop への統合は本 Epic PR のみで行う（縦串: 仕様書 → 実装 → UT 完了後）。

scope:
  - "BATCH-009 に関する子 Task の作業単位を整理する（バッチ仕様書 / 実装 / 単体テスト）"
  - "Epic Issue を作成する"
  - "Epic Branch を develop から作成する"
  - "子 Task Definition の配置方針（prompts/definitions/tasks/batch-009-item-generation-queue/**）を整理する"
  - "Contract Gate 不要方針を明示する"
  - "item_generation_queue 定義・IF-DB-BATCH-010 との境界を整理する"

out_of_scope:
  - "他 Batch（BATCH-001〜008 / 010〜019）の仕様書・実装・テスト（先行・後続は参照のみ）"
  - "Public / Internal API 仕様書および OpenAPI / Orval / generated 変更"
  - "画面（SCR-*）・Reco・DB schema / migration（既存 item / item_generation_queue / product_diff_result 定義の参照は可。新規 migration が必要なら別途 Human 判断）"
  - "本番リリース作業"
  - "BATCH-010〜015 の Queue 消化・Semantic / Feature / Embedding 生成本実装"
  - "親 batch-item-meaning-generation.yml / item-import チェーン全体改修（独立子 workflow 追加は可）"
  - "meaning_input_diff テーブル本体の新規 DDL（概念整理・計算方針の仕様化は可）"

