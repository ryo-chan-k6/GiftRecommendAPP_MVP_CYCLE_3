schema_version: "1.0"
definition_type: "epic"

epic:
  id: "epic-batch-009-item-generation-queue"
  title: "BATCH-009:商品意味生成キュー登録Batch"
  summary: "BATCH-009（商品意味生成キュー登録Batch）に関するバッチ仕様書・実装・単体テストを管理するEpic。意味影響のある Item 変更を item_generation_queue へ登録する。"

work_mode: "ai-agent"

commands:
  primary: "/start-epic"
  allowed:
    - "/start-epic"
    - "/start-task"
    - "/summarize-work"
  next:
    success: "/start-task"
    review_fix: null
    blocked: null

