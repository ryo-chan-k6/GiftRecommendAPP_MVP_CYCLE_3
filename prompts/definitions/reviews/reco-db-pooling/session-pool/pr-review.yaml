  id: "review-reco-db-pooling-session-pr"
  title: "PostgresDatabaseSession接続プール実装 PRレビュー"
  summary: "reco-db-pooling-session Task の PR を AI Review する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  worktree_required: false

target:
  pr:
    number: 1741
  issue:
    number: 1738
  task_definition: "prompts/definitions/tasks/reco-db-pooling/session-pool.yaml"
  source_branch: "refactor/task-1738-reco-db-pooling-session"
  target_branch: "refactor/epic-1737-reco-db-pooling"
