review_points:
  - "ギャップ一覧が docs 正本として十分な粒度か"
  - "BATCH と application / workflow / 仕様書の 1:1 が事実に基づくか"
  - "複合子未作成 vs 独立 19 本の差分が正確か"
  - "§18 後続 / stub / 018・019 後回しが明記されているか"
  - "env / secrets は名のみで実値がないか"
  - "OPEN Issue が案でありクローズを断定していないか"
