schema_version: "1.0"
definition_type: "review"

review:
  id: "review-reco-timeout-followup-implementation-pr"
  title: "reco-timeout-followup-implementation PRレビュー"
  summary: "sessionコメント修正とRECO_REQUEST_TIMEOUT文書化の Task PR を AI Review する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  worktree_required: false

target:
  pr: 1788
  issue: 1787
  task_definition: "prompts/definitions/tasks/reco-timeout-followup/implementation.yaml"
  source_branch: "chore/task-1787-reco-timeout-followup-implementation"
  target_branch: "chore/epic-1786-reco-timeout-followup"
  parent_epic_issue: "[Epic]reco-timeout-followup:hard8s追随コメントとRECO_REQUEST_TIMEOUT文書化"
  parent_epic_branch: "chore/epic-1786-reco-timeout-followup"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: "reviewer-ai"
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: true
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/reco-timeout-followup/implementation.yaml"
    required: true
  issue:
    number: 1787
    required: true
  pr:
    number: 1788
    required: true
  diff:
    required: true
    compare_with: "chore/epic-1786-reco-timeout-followup"
  docs:
    - path: "docs/06_実装設計/cross_cutting/環境変数定義書.md"
      required: true
    - path: "infra/render/README.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  - "session.py に旧 4,000ms hard 表記が残っていないか"
  - "RECO_REQUEST_TIMEOUT_MS が既定 9,000 / hard 以上で文書化されているか"
  - "定数値・OpenAPI を変更していないか"
  - "PR target が親 Epic Branch、Related to か"
  - "secret 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消、または Human 判断待ちとして明示される"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれか"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "Issue / PR / Branch 確定後に target.* を同期する"
