schema_version: "1.0"
definition_type: "review"

review:
  id: "review-batch-observability-e4-run-log-write-pr"
  title: "batch-observability-e4 run-log-write PRレビュー"
  summary: "E4 Wave 1（batch_run_log / JobRunTracker 本配線）Task の PR を AI Review する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  worktree_required: true

target:
  pr:
    number: null
  issue:
    number: 1699
  task_definition: "prompts/definitions/tasks/batch-observability-e4/run-log-write.yaml"
  parent_epic_issue: "[Epic]batch-observability-e4:観測横断本実装"
  parent_epic_branch: "feature/epic-1636-batch-observability-e4"

commands:
  primary: "/review-pr"

agent:
  primary: "reviewer-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"

review_scope:
  docs: true
  source: true
  tests: true
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

review_points:
  - "PostgresJobRunTracker が write_rows（start）/ update_rows（complete）で batch_run_log を扱うか"
  - "job_run_id の UUID 必須と非 UUID 拒否が明確か"
  - "complete が succeeded / partially_succeeded / failed のみ許可するか"
  - "create_job_run_tracker が scaffold_demo / empty / scaffold:// → Scaffold、それ以外 → Postgres か"
  - "ScaffoldJobRunTracker 回帰が維持されているか"
  - "代表 CLI が genre_sync 1 本のみで、001〜017 全配線が混入していないか"
  - "UT が Scaffold / Postgres+ScaffoldDbWriter / factory / UUID 拒否をカバーするか"
  - "実 DB 疎通結果または skip 理由が secret なしで記載されているか"
  - "ギャップ一覧に Wave 1（#1699）進捗と §8.3 解除が事実として記載されているか"
  - "phase_log / error_log / api_call_log / 043/044 が混入していないか"
  - "secret / DATABASE_URL 実値がログ・差分・docs に出ていないか"
  - "Related to / PR target が親 Epic Branch"

notes:
  - "pr.number は PR 作成後に埋める"
  - "Wave 4 全 Batch 配線は禁止（本 Task は代表 1 本）"
