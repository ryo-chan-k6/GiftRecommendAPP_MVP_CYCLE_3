review_points:
  - "Wave 0〜5 が Epic scope 内で完了しているか（ギャップ一覧 §12 と一致）"
  - "batch_run_log / phase_log / error_log / api_call_log 本配線が docs・実装で一致するか"
  - "BATCH-001〜017 Run/Phase/Error 適用、api_call は 001〜004 + 015（openai/item_embedding）か"
  - "017 の job_run_id / batch_run_id 分離が維持されているか"
  - "043/044 / 018/019 / SELECT 再実装 / 親 schedule が混入していないか"
  - "raw_product_metadata / item_import_summary / fetch_cursor の source_api CHECK を壊していないか"
  - "migration（api_call_log source/source_api）が含まれるか・secret 非含有か"
  - "Epic PR target が develop / Closes #1636 があるか"
  - "OpenAPI / web / api / reco 破壊変更が無いこと"
  - "CI 既定 live / production 無承認 live が無いこと"

notes:
  - "子 Task: #1697 / #1699 / #1701 / #1703 / #1705 / #1710（いずれも CLOSED）"
  - "Human 確定: §8.1 案 C / §8.2 Must / §8.3 解除済 / §8.4 案 B（Wave 5）"
  - "pr.number は Epic PR 作成後に埋める"
