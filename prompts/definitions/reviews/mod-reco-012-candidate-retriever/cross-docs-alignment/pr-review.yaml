schema_version: "1.0"
definition_type: "review"

review:
  id: "review-mod-reco-012-cross-docs-alignment-pr"
  title: "MOD-RECO-012 011廃止横断docs整合 PRレビュー"
  summary: "Issue #867 Task の 011→012 統合横断 docs 整合 PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  worktree_required: true

target:
  pr: null
  issue:
    number: 867
  task_definition: "prompts/definitions/tasks/mod-reco-012-candidate-retriever/cross-docs-alignment.yaml"
  source_branch: "docs/task-867-mod-reco-012-cross-docs-alignment"
  target_branch: "feature/epic-864-mod-reco-012-candidate-retriever"
  parent_epic_issue: 864
  parent_epic_branch: "feature/epic-864-mod-reco-012-candidate-retriever"

commands:
  primary: "/review-pr"

agent:
  primary: "reviewer-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"

review_scope:
  docs: true
  source: false
  tests: false
  project_operation: true
  security: true

input:
  task_definition:
    path: "prompts/definitions/tasks/mod-reco-012-candidate-retriever/cross-docs-alignment.yaml"
    required: true
  issue:
    number: 867
    required: true
  pr:
    number: null
    required: true

review_points:
  common:
    - "Task Definition acceptance_criteria 充足"
    - "scope 外変更（apps / OpenAPI / DB）が混在していないか"
    - "PR target が親 Epic Branch であるか"
  docs:
    - "Recoモジュール一覧から独立 MOD-RECO-011 行が除去されているか"
    - "MOD-RECO-001 が 010→012 1 呼び出しと整合しているか"
    - "GRS-REC-008 / 009 の発生元が MOD-RECO-012 と整合しているか"
    - "MOD-RECO-012 / 011 廃止記録の暫定注記が解消されているか"
    - "011 廃止記録（#863）・012 仕様書（#866）との矛盾がないか"

acceptance_check:
  use_task_acceptance_criteria: true

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "修正必須（Blocker/Must）がない"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"

notes:
  - "PR head に本 Review Definition を同梱すること"
