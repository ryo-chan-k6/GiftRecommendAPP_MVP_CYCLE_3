schema_version: "1.0"
definition_type: "review"

review:
  id: "review-mod-reco-012-candidate-retriever-epic-pr"
  title: "MOD-RECO-012 Epic PRレビュー"
  summary: "MOD-RECO-012（Candidate Retriever）Epic の develop 向け統合 PR を AI Review する。011 廃止・012 統合・横断 docs 整合（#867）を含む。"
  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  worktree_required: true

target:
  pr: 875
  issue:
    number: 864
  task_definition: "prompts/definitions/epics/mod-reco-012-candidate-retriever/epic.yaml"
  source_branch: "feature/epic-864-mod-reco-012-candidate-retriever"
  target_branch: "develop"
  related_task_issues:
    - 865
    - 867

commands:
  primary: "/review-pr"

agent:
  primary: "reviewer-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"

review_scope:
  docs: true
  project_operation: true
  security: true

input:
  task_definition:
    path: "prompts/definitions/epics/mod-reco-012-candidate-retriever/epic.yaml"
    required: true
  issue:
    number: 864
    required: true

review_points:
  common:
    - "epic_scope.allowed_paths / forbidden_paths 整合"
    - "子 Task（module-spec #865 / cross-docs #867）完了と Epic Branch 反映"
    - "apps/reco/src/reco/api/** 非含有"
    - "secret 非含有"
  docs:
    - "011 廃止・012 統合が横断 docs と矛盾しないか"
    - "Orchestrator 010→012 1 呼び出しが一貫しているか"
    - "GRS-REC-008 / 009 発生元が MOD-RECO-012 と整合しているか"

notes:
  - "Epic PR 作成時に target.pr を更新する"
  - "横断 docs は Issue #867 / PR #868 で Epic Branch へ merge 済み"
