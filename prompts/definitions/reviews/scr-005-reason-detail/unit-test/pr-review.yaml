schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-005-reason-detail-unit-test-pr"
  title: "SCR-005 推薦理由詳細表示単体テスト PRレビュー"
  summary: "SCR-005 unit-test Task の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: 1405
  issue: 1404
  task_definition: "prompts/definitions/tasks/scr-005-reason-detail/unit-test.yaml"
  source_branch: "test/task-1404-scr-005-reason-detail-unit-test"
  target_branch: "feature/epic-1389-scr-005-reason-detail"
  parent_epic_issue: "[Epic]SCR-005:推薦理由詳細表示"
  parent_epic_branch: "feature/epic-1389-scr-005-reason-detail"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: false
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/scr-005-reason-detail/unit-test.yaml"
    required: true
  issue:
    number: 1404
    required: true
  pr:
    number: 1405
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1389-scr-005-reason-detail"
  docs:
    - path: "docs/06_実装設計/web/SCR-005_推薦理由詳細表示画面仕様書.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Task Definition scope / acceptance_criteria を満たしているか"
    - "PR target が親 Epic Branch か"
    - "PR 本文が Related to（Closes 禁止）か"
  tests:
    - "画面仕様 §18（初期折りたたみ / 同時展開 / 高さ上限）がカバーされているか"
    - "本番 network / secret に依存していないか"
  security:
    - "secret / `.env` 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "PR / Issue 作成後に target.pr / input.pr.number を更新する"
  - "Task PR は Related to（Closes 禁止）"
