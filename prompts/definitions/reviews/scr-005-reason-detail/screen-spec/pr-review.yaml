schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-005-reason-detail-screen-spec-pr"
  title: "SCR-005 推薦理由詳細表示画面仕様書 PRレビュー"
  summary: "SCR-005 screen-spec Task の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: null
  task_definition: "prompts/definitions/tasks/scr-005-reason-detail/screen-spec.yaml"
  source_branch: null
  target_branch: "feature/epic-1389-scr-005-reason-detail"
  parent_epic_issue: "[Epic]SCR-005:推薦理由詳細表示"
  parent_epic_branch: "feature/epic-1389-scr-005-reason-detail"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/scr-005-reason-detail/screen-spec.yaml"
    required: true
  issue:
    number: null
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1389-scr-005-reason-detail"
  docs:
    - path: "docs/06_実装設計/web/SCR-005_推薦理由詳細表示画面仕様書.md"
      required: true
    - path: "docs/06_実装設計/web/SCR-004_レコメンド結果一覧画面画面仕様書.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Task Definition scope を満たしているか"
    - "PR target が親 Epic Branch か"
    - "Related to（Closes 禁止）か"
  docs:
    - "アコーディオン方針が SCR-004 §7.4 と整合しているか"
    - "独立 URL / モーダル専用ページ非採用が明示されているか"
    - "Public に無い reason_points / reason_detail の扱いが Human 判断として明示されているか"
    - "未確定事項を確定事項として書いていないか"
  security:
    - "secret / .env 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "PR / Issue 作成後に target.pr / target.issue / input.*.number / source_branch を更新する"
  - "Task PR は Related to（Closes 禁止）"
