schema_version: "1.0"
definition_type: "review"

review:
  id: "review-local-dev-environment-seed-strategy-pr"
  title: "local-dev-environment seed-strategy PRレビュー"
  summary: "Epic A Task seed-strategy の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  base: null
  target: null
  worktree_required: true

target:
  pr: null
  issue:
    number: 660
  task_definition: "prompts/definitions/tasks/local-dev-environment/seed-strategy.yaml"
  source_branch: "chore/task-660-seed-strategy"
  target_branch: "chore/epic-651-local-dev-environment"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"

agent:
  primary: "reviewer-ai"
  specialist:
    docs: "docs-reviewer-ai"

review_scope:
  docs: true
  project_operation: true
  security: true
  generated: false
  cicd: false

input:
  task_definition:
    path: "prompts/definitions/tasks/local-dev-environment/seed-strategy.yaml"
    required: true
  issue:
    number: 660
    required: true
  pr:
    number: null
    required: true

review_points:
  - "Task Definition scope / out_of_scope との整合"
  - "seed 正本が supabase/seeds/masters + config.toml [db.seed] で docs 一意に決定されているか"
  - "supabase/seed.sql 単体正本を採用していないか"
  - "db/ddl/ が誤って削除されていないか（参照専用維持）"
  - "親 Epic allowed_paths 内に収まっているか"
  - "agentic_process: Agent 必須のフルスタック起動を acceptance に含めていないか"
  - "secret / .env 実値の非含有"
  - "Phase2 migration / packages/contracts への越境がないか"

human_review_points:
  - "seed 正本: supabase/seeds/masters + config.toml（supabase/seed.sql 非採用）"
  - "Human 手元確認（optional manual check）の記載が適切か"

notes:
  - "Issue / PR 番号は /create-pr 後に target.* / input.* へ反映"
