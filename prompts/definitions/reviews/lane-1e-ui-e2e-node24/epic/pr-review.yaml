  project_operation: true
  security: true
  test: true

review_points:
  - "Playwright 更新幅（1.52→1.61.1）が Node 24 互換を満たす根拠があるか（1.60+）"
  - "test-ui-e2e.yml の node-version が 24 に戻り、標準（ci-web / engines）と整合しているか"
