  - "apps/api / reco / batch / OpenAPI / migration に変更がないか"

acceptance_criteria:
  - "結論が approve_for_human_review / request_changes / needs_human_decision のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: true
    experiments: false
  reason: "CI/CD 横断影響（runner Node 復帰・依存更新）"

notes:
  - "Epic PR（#1476 → develop）を対象とする。PR 番号は作成後に確定"
