schema_version: "1.0"
definition_type: "review"

review:
  id: "review-environment-setup-env-var-definition-doc-pr"
  title: "環境変数定義書作成・更新 PRレビュー"
  summary: "Phase3 子 Task ①。環境設計書 §19 への環境変数定義追加と Review Definition 整備の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-437-environment-setup-env-var-definition-doc"
  base: "docs/epic-436-environment-setup"
  target: "docs/epic-436-environment-setup"
  worktree_required: true

target:
  pr: null
  issue:
    number: 437
  task_definition: "prompts/definitions/tasks/environment-setup/env-var-definition-doc.yaml"
  source_branch: "docs/task-437-environment-setup-env-var-definition-doc"
  target_branch: "docs/epic-436-environment-setup"
  parent_epic_issue: "[Epic]environment-setup:環境設計・構築"
  parent_epic_branch: "docs/epic-436-environment-setup"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: "reviewer-ai"
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/environment-setup/env-var-definition-doc.yaml"
    required: true
  issue:
    number: 437
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-436-environment-setup"
  docs:
    - path: "docs/06_実装設計/cross_cutting/環境設計書.md"
      required: true
      purpose: "§19 環境変数定義（正本）の内容確認"
    - path: "docs/06_実装設計/cross_cutting/基盤構成設計書.md"
      required: true
      purpose: "接続関係・コンポーネント責務との整合確認"
    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: true
      purpose: "Secret 一覧・管理ルールとの整合確認"
    - path: "docs/05_アプリケーション設計/基盤/利用技術スタック整理表.md"
      required: false
      purpose: "§16 との物理名差分（§19.7.1）確認"
    - path: "docs/05_アプリケーション設計/共通/CI・CD方針書.md"
      required: false
      purpose: "§5.3.10 基盤チェックとの整合確認"
  files:
    - path: "prompts/definitions/reviews/environment-setup/env-var-definition-doc/pr-review.yaml"
      required: true
      purpose: "Review Definition 作成確認"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition（env-var-definition-doc.yaml）の scope を満たしているか"
    - "out_of_scope（.env.example / infra/scripts / CI workflow / apps/** 実装）の変更が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "PR target が親 Epic Branch（docs/epic-436-environment-setup）であるか"
    - "Task PR で Related to #437 を使用し Closes を使っていないか"
    - "PR author が okuri-ai-bot であるか（Human Review 正式経路）"
  docs:
    - "環境設計書 §19 に web / api / reco / batch 別の環境変数一覧が整理されているか"
    - "秘匿性区分（secret / config / public-config / ci-secret）が定義されているか"
    - "§19.11 で他 docs との正本関係が明示されているか"
    - "§19.7.1 で物理名差分（RAKUTEN / Object Storage）が整理されているか"
    - "基盤構成設計書・§8 設定管理方針と矛盾していないか"
    - "APP_ENV が dev / stg / prod で統一されているか（§14 との整合）"
    - "後続 Task（.env.example / infra/scripts）への引き渡し（§19.10）が十分か"
    - "Markdown 表・相互参照リンクが有効か"
  source: []
  tests:
    - "docs 作成 Task として manual check（整合確認 / secret 非露出 / リンク確認）が PR 本文に記載されているか"
    - "unit test 未実施理由が PR 本文に記載されているか"
  api_contract: []
  db:
    - "db/** 変更が混入していないか"
  generated: []
  cicd:
    - "CI workflow 変更が混入していないか（Task ⑤ scope）"
  security:
    - "secret 実値や .env 実値が含まれていないか"
    - "web 向け public-config に secret が含まれていないか"
    - "ログ出力禁止 secret 名が認証・認可方針書 §10.1 と整合しているか"
  branch:
    - "Task Branch から develop へ直接 PR していないか"
    - "PR target が docs/epic-436-environment-setup であるか"
  project:
    - "レビュー結果に応じた Status 更新意図が明確か"
  epic_scope:
    - "PR 差分が environment-setup Epic の epic_scope.allowed_paths 内に収まっているか"
    - "epic_scope.forbidden_paths（apps / db / packages/contracts）への変更が混入していないか"

acceptance_check:
  use_task_acceptance_criteria: true
  additional_criteria:
    - "PR 本文に実施済み検証と未実施テストの理由が記載されている"
    - "Human Review で確認してほしい事項が明記されている"
    - "Review Definition が prompts/definitions/reviews/environment-setup/env-var-definition-doc/ に存在する"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "secret 非露出"
      - "scope 外変更がない"
      - "Human Review 観点が整理されている"
  request_changes:
    conditions:
      - "環境変数一覧の不足・秘匿性区分の誤りがある"
      - "正本関係または命名整合の記載が不足している"
      - "PR 本文に必要情報が不足している"
  needs_human_decision:
    conditions:
      - "物理名統一方針（§19.7.1）の最終判断が必要"
      - "MVP 必須フラグ（△ 項目）の採否判断が必要"
  split_required:
    conditions:
      - ".env.example または infra/scripts の変更が混在している"
      - "epic_scope.forbidden_paths への変更が混在している"
  blocked:
    conditions:
      - "PR diff を確認できない"
      - "secret や .env 実値の混入が疑われる"
      - "親 Epic Issue / Branch が存在しない"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false
  ai_logs:
    required: false
    path: null

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "AI Review"
    priority: "high"
    planned_start: null
    due_date: null

issue:
  unit: "task"
  type: "docs"
  area: "infra"

dependencies:
  epics:
    - "prompts/definitions/epics/environment-setup/epic.yaml"
  issues:
    - number: 436
      purpose: "親 Epic"
  prs: []
  tasks:
    - "prompts/definitions/tasks/environment-setup/env-var-definition-doc.yaml"
  blocking: false

parallel_control:
  depends_on: []
  blocks:
    - "prompts/definitions/tasks/environment-setup/env-example.yaml"
  exclusive_files:
    - "docs/06_実装設計/cross_cutting/環境設計書.md"
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
    - "AI Review"
    - "PR diff check"
    - "docs review"
    - "secret check"
  commands: []
  manual_checks:
    - "Task Definition の acceptance_criteria を満たしているか確認する"
    - "環境設計書 §19 と認証・認可方針書 §10 の Secret 名を突合する"
    - "apps/**・db/** 変更がないことを確認する"
  not_required:
    - "unit test"
    - "integration test"
  skip_reason:
    "unit test": "docs 作成 Task のため"
    "integration test": "docs 作成 Task のため"

operation_logging:
  level: "minimal"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: false
  reason: "通常 PR レビューのため、レビュー結果は PR コメントを正本とする"

risk_points:
  - "05_アプリケーション設計 docs との物理名差分が .env.example Task で再議論になる可能性"
  - "MVP 匿名利用時の JWT 関連 env の必須/任意判断"

human_decision_points:
  - "§19.7.1 の物理名正本（OBJECT_STORAGE_* / RAKUTEN_APPLICATION_ID）が .env.example で採用してよいか"
  - "web/api/reco/batch 一覧が後続 Task の前提として十分か"
  - "secret 区分が security 方針と整合しているか"

stop_conditions:
  - "PR が存在しない場合"
  - "secret や .env 実値の混入が疑われる場合"
  - "db/** または apps/** 変更が混入している場合"
  - "Human Review を省略する前提になっている場合"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/environment-setup/env-var-definition-doc.yaml"
  - "対応 Epic Definition: prompts/definitions/epics/environment-setup/epic.yaml"
  - "本 Review Definition は PR head に含め、AI Review 自動 dispatch が解決できるようにする"
