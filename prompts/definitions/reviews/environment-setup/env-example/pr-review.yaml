schema_version: "1.0"
definition_type: "review"

review:
  id: "review-environment-setup-env-example-pr"
  title: ".env.example整備 PRレビュー"
  summary: "Phase3 子 Task ②。.env.example 整備と Review Definition 整備の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-446-environment-setup-env-example"
  base: "docs/epic-436-environment-setup"
  target: "docs/epic-436-environment-setup"
  worktree_required: true

target:
  pr: null
  issue:
    number: 446
  task_definition: "prompts/definitions/tasks/environment-setup/env-example.yaml"
  source_branch: "docs/task-446-environment-setup-env-example"
  target_branch: "docs/epic-436-environment-setup"
  parent_epic_issue: "[Epic]environment-setup:環境設計・構築"
  parent_epic_branch: "docs/epic-436-environment-setup"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: "reviewer-ai"
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/environment-setup/env-example.yaml"
    required: true
  issue:
    number: 446
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-436-environment-setup"
  docs:
    - path: "docs/06_実装設計/cross_cutting/環境設計書.md"
      required: true
      purpose: "§19 環境変数定義との整合確認"
  files:
    - path: ".env.example"
      required: true
      purpose: "成果物の変数名・ダミー値・コメント確認"
    - path: "prompts/definitions/reviews/environment-setup/env-example/pr-review.yaml"
      required: true
      purpose: "Review Definition 作成確認"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition（env-example.yaml）の scope を満たしているか"
    - "out_of_scope（infra/scripts / CI workflow / apps/** / 環境設計書 §19 本体変更）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "PR target が親 Epic Branch（docs/epic-436-environment-setup）であるか"
    - "Task PR で Related to #<Task Issue> を使用し Closes を使っていないか"
    - "PR author が okuri-ai-bot であるか"
  docs:
    - ".env.example の変数名が環境設計書 §19.3〜§19.7 と一致しているか"
    - "§19.7.1 の物理名正本（RAKUTEN_APPLICATION_ID / OBJECT_STORAGE_*）が採用されているか"
    - "アプリ別（common / web / api / reco / batch）に整理されているか"
  security:
    - "secret 実値が含まれていないか（ダミー値のみか）"
    - "NEXT_PUBLIC_* に secret が含まれていないか"
    - "web 向けに server-side secret が含まれていないか"
  db:
    - "db/** 変更が混入していないか"
  cicd:
    - "CI workflow 変更が混入していないか"
  epic_scope:
    - "PR 差分が environment-setup Epic の epic_scope.allowed_paths 内か"
    - "forbidden_paths（apps / db）への変更がないか"

acceptance_check:
  use_task_acceptance_criteria: true
  additional_criteria:
    - "PR 本文に検証結果・Human Review 観点が記載されている"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "secret 非露出"
      - "scope 外変更がない"
  request_changes:
    conditions:
      - ".env.example の変数名不足・物理名不一致がある"
      - "ダミー値が実値らしい文字列になっている"
  blocked:
    conditions:
      - "secret や .env 実値の混入が疑われる"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "AI Review"
    priority: "high"

issue:
  unit: "task"
  type: "docs"
  area: "infra"

dependencies:
  epics:
    - "prompts/definitions/epics/environment-setup/epic.yaml"
  issues:
    - number: 436
      purpose: "親 Epic"
    - number: 437
      purpose: "先行 Task ①"
  tasks:
    - "prompts/definitions/tasks/environment-setup/env-var-definition-doc.yaml"
  blocking: true

parallel_control:
  depends_on:
    - "prompts/definitions/tasks/environment-setup/env-var-definition-doc.yaml"
  blocks:
    - "prompts/definitions/tasks/environment-setup/infra-scripts.yaml"
  exclusive_files:
    - ".env.example"
  conflict_risk: "medium"
  db_impact: false

test_policy:
  required:
    - "AI Review"
    - "secret check"
  not_required:
    - "unit test"
  skip_reason:
    "unit test": ".env.example 整備 Task のため"

operation_logging:
  level: "minimal"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: false

human_decision_points:
  - "§19.7.1 物理名正本が .env.example に正しく反映されているか"
  - "MVP 任意（△）変数の記載粒度が後続 Task の前提として十分か"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/environment-setup/env-example.yaml"
  - "入力正本: docs/06_実装設計/cross_cutting/環境設計書.md §19"
