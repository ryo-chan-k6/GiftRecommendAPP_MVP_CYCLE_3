schema_version: "1.0"
definition_type: "review"

review:
  id: "review-mod-reco-001-wiring-output-wiring-pr"
  title: "MOD-RECO-001 出力 Wiring PRレビュー"
  summary: "出力フェーズ（MOD-RECO-021〜023）の Orchestrator 本実装配線 Task の PR を AI Review する"
  type: "task_pr_review"
  status: "draft"

work_mode: "ai-agent"

branch:
  worktree_required: true

target:
  pr: null
  issue:
    number: 1000
  task_definition: "prompts/definitions/tasks/mod-reco-001-wiring-output/wiring.yaml"
  source_branch: "feature/task-1000-mod-reco-001-wiring-output-wiring"
  target_branch: "feature/epic-792-mod-reco-001-wiring-output"
  parent_epic_issue: 792
  parent_epic_branch: "feature/epic-792-mod-reco-001-wiring-output"

commands:
  primary: "/review-pr"

agent:
  primary: "reviewer-ai"
  specialist:
    docs: false
    test: "test-ai"

review_scope:
  docs: false
  source: true
  tests: true
  project_operation: true
  security: true

input:
  task_definition:
    path: "prompts/definitions/tasks/mod-reco-001-wiring-output/wiring.yaml"
    required: true

review_points:
  - "stubs.py の変更が出力フェーズ Port に限定されているか"
  - "モジュール本体（MOD-RECO-021 / 022 / 023）への変更が混入していないか"
  - "orchestrator.py への変更が混入していないか"
  - "StubXxx クラスが削除されていないか"
  - "起動・User Meaning・Retrieval・Matching・Ranking フェーズの配線が維持されているか"
  - "_attach_result_builder_hook の扱いが PR で説明されているか"
  - "factory 選択（build_default_*）が各モジュール __init__.py の公開 I/F と一致しているか"
  - "exclusive_files（stubs.py）の直列化方針に反していないか"
  - "Task PR target が Epic Branch であるか"
  - "test_recommendation_orchestrator.py の red が配線起因であることと integration-test Task 委譲が PR に明記されているか"
  - "execution-context-typed-fields / integration-retest follow-up（playbook 順序 3〜4）委譲が PR に明記されているか"
  - "execution_context.py への変更が混入していないか"

notes:
  - "Issue / PR 確定後に target.pr / target.issue.number を更新する"
  - "配線 PR 単体では Orchestrator デフォルト経路テストが red になることを許容（integration-test Task で green 化）"
  - "playbook: prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/wiring-phase-follow-up-playbook.yaml"
