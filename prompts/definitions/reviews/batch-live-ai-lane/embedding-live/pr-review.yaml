schema_version: "1.0"
definition_type: "review"

review:
  id: "review-batch-live-ai-lane-embedding-live-pr"
  title: "batch-live-ai-lane BATCH-015 Embedding live PRレビュー"
  summary: "Epic #1768 Task #1776（BATCH-015 Embedding live切替実装）の PR を AI Review する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  worktree_required: true

target:
  pr:
    number: null
  issue:
    number: 1776
  task_definition: "prompts/definitions/tasks/batch-live-ai-lane/embedding-live.yaml"
  parent_epic_issue: "[Epic]batch-live-ai-lane:BATCH-015 Embedding live切替"
  parent_epic_branch: "feature/epic-1768-batch-live-ai-lane"
  source_branch: "feature/task-1776-embedding-live"
  target_branch: "feature/epic-1768-batch-live-ai-lane"

commands:
  primary: "/review-pr"

agent:
  primary: "reviewer-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"

review_scope:
  docs: true
  source: true
  tests: true
  api_contract: false
  db: true
  generated: false
  cicd: true
  security: true
  project_operation: true

review_points:
  - "batch-item-embedding.yml が environment: stg + STG_DATABASE_URL + OPENAI_API_KEY secret参照 + UUID job_run_id か"
  - "明示 `--live-embedding` 時のみ実Embedding APIで、既定off/scaffoldが維持されているか"
  - "current embedding model_version_id resolver（#1772依存）が利用されているか"
  - "api_call_log が #1710 経路で記録され、secret/ベクトル全文が無いこと"
  - "unit test / YAML検証 / secret check が通っているか"
  - "stg検証が max_items=1 / queue_batch_size=1 / manual dispatch / 目安 $0.01/run（または未実施理由）か"
  - "meaning/retry へのlive伝播がある場合、既定falseが維持されているか"
  - "production / schedule / Secret変更 / BATCH-010実LLM / DDL / OpenAPI / generated が混入していないか"
  - "#1750 develop merge・Task Branch取り込み後に実装・stg実API呼出を開始した履歴か（依存ゲート）"
  - "Related to / PR target = 親Epic Branch feature/epic-1768-batch-live-ai-lane"
  - "Review Definition が PR head に含まれているか"

notes:
  - "Issue: #1776。pr.number は PR 作成後に埋める"
  - "Branch: feature/task-1776-embedding-live → feature/epic-1768-batch-live-ai-lane"
  - "contract_gate不要（generated想定なし）"
  - "Test + security + CI/CD 観点を必須とする"
  - "Human Review / merge判断は ryo-chan-k6"
  - "/work-issue 依存ゲートは2026-07-31に解除済み"
