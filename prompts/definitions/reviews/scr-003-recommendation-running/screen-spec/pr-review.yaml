schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-003-recommendation-running-screen-spec-pr"
  title: "SCR-003 レコメンド実行中表示画面仕様書 PRレビュー"
  summary: "SCR-003 画面仕様書 Task の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: 1364
  issue: 1362
  task_definition: "prompts/definitions/tasks/scr-003-recommendation-running/screen-spec.yaml"
  source_branch: "docs/task-1362-scr-003-recommendation-running-screen-spec"
  target_branch: "feature/epic-1361-scr-003-recommendation-running"
  parent_epic_issue: "[Epic]SCR-003:レコメンド実行中表示"
  parent_epic_branch: "feature/epic-1361-scr-003-recommendation-running"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/scr-003-recommendation-running/screen-spec.yaml"
    required: true
  issue:
    number: 1362
    required: true
  pr:
    number: 1364
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1361-scr-003-recommendation-running"
  docs:
    - path: "docs/06_実装設計/web/SCR-003_レコメンド実行中表示画面仕様書.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables:
      - path: "prompts/templates/docs/screen-spec.md"
        required: true
        applies_to:
          - "docs/06_実装設計/web/SCR-003_レコメンド実行中表示画面仕様書.md"

review_points:
  common:
    - "Task Definition scope を満たしているか"
    - "PR target が親 Epic Branch か"
    - "Related to（Closes 禁止）か"
  docs:
    - "screen-spec.md テンプレートに準拠しているか"
    - "画面一覧 SCR-003 と整合しているか"
    - "画面状態として記載し、独立 URL 画面と誤記していないか"
    - "専用 `/recommendations/loading` route 新設が MVP out of scope か"
    - "ST-LOAD / UI-031 / UI-032 対応がデザインルール・UIコンポーネント一覧と整合しているか"
    - "処理中メッセージ正本が RUNNING_MESSAGE と矛盾していないか"
    - "キャンセル導線（△）が MVP 非必須 / Human Review 採否として明示されているか"
  security:
    - "secret / .env 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "実装用 Review は後続 Task。本ファイルは画面仕様書専用"
  - "PR 作成後に target.pr / input.pr.number を同期する"
  - "キャンセル導線の採否は Human Review 観点（仕様書 §6.2 / §22）"
