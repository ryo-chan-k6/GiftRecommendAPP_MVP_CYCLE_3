schema_version: "1.0"
definition_type: "review"
review:
  id: "review-lane-1f-ng-normalize-api-epic-pr"
  title: "レーン1f NG正規化api正本化 Epic PRレビュー"
  summary: "Contract + implementation を含む Epic #1320 の develop 向け AI Review"
  type: "epic_pr_review"
  status: "ready"
work_mode: "ai-agent"
branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false
target:
  pr: null
  issue: 1320
  task_definition: "prompts/definitions/epics/lane-1f-ng-normalize-api/epic.yaml"
  source_branch: "feature/epic-1320-lane-1f-ng-normalize-api"
  target_branch: "develop"
  parent_epic_issue: null
  parent_epic_branch: null
commands:
  primary: "/review-pr"
  allowed: ["/review-pr", "/fix-review-comments", "/summarize-work"]
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null
agent:
  primary: "reviewer-ai"
  support: ["support-ai", "contract-ai"]
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    contract: "contract-ai"
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"
review_scope:
  docs: true
  source: true
  tests: true
  api_contract: true
  db: false
  generated: true
  cicd: true
  security: true
  project_operation: true
input:
  task_definition:
    path: "prompts/definitions/epics/lane-1f-ng-normalize-api/epic.yaml"
    required: true
  issue:
    number: 1320
    required: true
  pr:
    number: null
    required: false
  diff:
    required: true
    compare_with: "develop"
  docs:
    - path: "docs/06_実装設計/cross_cutting/ローカル開発手順書.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
review_points:
  common:
    - "Epic → develop / Closes #1320"
    - "Contract (#1322) + Implementation (#1326) が含まれるか"
  source:
    - "api が ngKeywords を渡すか"
    - "reco が request.ng_text 再抽出しないか"
  tests:
    - "alcohol NG UT が維持されるか"
  security:
    - "secret 非含有"
acceptance_check:
  use_task_acceptance_criteria: true
result_policy:
  approve_for_human_review:
    conditions: ["acceptance 充足", "Must なし"]
  request_changes:
    conditions: ["同一 Branch 修正可能"]
  needs_human_decision:
    conditions: ["attribute 経路暫定の扱い"]
  blocked:
    conditions: ["子 Task 未 merge"]
acceptance_criteria:
  - "Blocker/Must 解消または明示"
operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: true
    experiments: false
  reason: "Epic AI Review"
notes:
  - "PR 作成後に番号反映"
