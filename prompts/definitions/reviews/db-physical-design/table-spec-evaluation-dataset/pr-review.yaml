schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-evaluation-dataset-pr"
  title: "evaluation_dataset テーブル定義書 PRレビュー"
  summary: "evaluation_dataset テーブル定義書 Task の PR を AI Review する。物理ER・論理ER §12 Evaluation系・テーブル一覧 §10 No.51・BATCH-018 との整合、evaluation_case / evaluation_run 親子関係と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-565-evaluation-dataset-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 565
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-evaluation-dataset.yaml"
  source_branch: "docs/task-565-evaluation-dataset-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-evaluation-dataset.yaml"
    required: true
  issue:
    number: 565
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/evaluation_dataset_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "Evaluation系分類・contains / executed_by ER・§9 FK との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§12.1 / §12.2 Evaluation系エンティティ属性との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§10 No.51・Evaluation系補足との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/リソース責務定義表.md"
      required: true
      purpose: "§6.12 Evaluation Dataset 責務との整合"
    - path: "docs/05_アプリケーション設計/アプリ/状態遷移設計書.md"
      required: true
      purpose: "§8.1.3 再評価追記方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-BATCH-018 / IF-SHARED-004 との整合"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ処理一覧.md"
      required: true
      purpose: "BATCH-018 入出力との整合"
    - path: "docs/06_実装設計/database/semantic_config_テーブル定義書.md"
      required: false
      purpose: "Evaluation系ルート正本テーブル定義書との章構成一貫性確認"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（evaluation_case / evaluation_run / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §12.2 属性（dataset_name / dataset_description / dataset_version / is_active / created_at）と一致しているか"
    - "テーブル一覧 §10 No.51・Evaluation系補足（MVP partial）と分類・用途が一致しているか"
    - "状態遷移設計書 §8.1.3 同一 Dataset 再評価追記方針が反映されているか"
    - "BATCH-018 / MOD-BATCH-039 の読取正本責務が明確か"
    - "semantic_config 等 Config 系テーブル定義書と章構成・MVP 方針が一貫しているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "evaluation_case との 1:N contains FK（ON）方針が明記されているか"
    - "evaluation_run との 1:N executed_by 関係（evaluation_dataset_id 被参照）が明記されているか"
    - "dataset_name / dataset_version / is_active の制約方針が妥当か"
    - "evaluation_case / evaluation_run 子 Task（#566 / #567）への FK / Index 引き継ぎが整理されているか"
    - "物理ER §9 に evaluation_run executed_by 行が未掲載の場合、差分と確定方針が明示されているか"
    - "Evaluation Dataset の保持・削除方針（MVP partial）が妥当か"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "dataset_name の UNIQUE 制約要否"
  - "dataset_version の形式と version 管理方針"
  - "is_active 列の MVP 物理 DDL 採用"
  - "evaluation_run.executed_by の物理 FK ON 方針"
  - "Evaluation Dataset の Retention / 削除方針"

risk_points:
  - "物理ER §9 FK 表に evaluation_run executed_by 行が未掲載である点"
  - "evaluation_case / evaluation_run 並行 Task（#566 / #567）との FK 方針の一貫性"
  - "dataset_version と dataset_name の組み合わせ一意性の設計判断"
  - "MVP partial（△）テーブルの Retention 未確定"
  - "BATCH-018 バッチ仕様書未作成時の入出力粒度"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-evaluation-dataset.yaml"
  - "Batch R08 No.3: evaluation_dataset"
  - "並行 Task: #566 evaluation_case / #567 evaluation_run"
  - "先行 merge 済み: #440 / PR #441（enum）、#535 / PR #540（phase_log）、#536 / PR #541（error_log）"
