schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-ranking-config-pr"
  title: "ranking_config テーブル定義書 PRレビュー"
  summary: "ranking_config テーブル定義書 Task の PR を AI Review する。物理ER・論理ER §11.1・Ranking定義書との整合と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-451-ranking-config-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 451
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-ranking-config.yaml"
  source_branch: "docs/task-451-ranking-config-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-ranking-config.yaml"
    required: true
  issue:
    number: 451
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/ranking_config_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/relationship_master_テーブル定義書.md"
      required: true
      purpose: "Master / Config 系テーブル定義書との一貫性確認"
    - path: "docs/06_実装設計/database/occasion_master_テーブル定義書.md"
      required: true
      purpose: "Master / Config 系テーブル定義書との一貫性確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "テーブル分類・FK・Index 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§11.1 エンティティ属性との整合"
    - path: "docs/04_ドメインモデル設計/Ranking定義書.md"
      required: true
      purpose: "parameter_json 想定キー・Ranking 責務との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§9 Master / Config系との整合"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §11.1 の属性（ranking_config_id / config_name / config_version / parameter_json / is_current / created_at）と矛盾しないか"
    - "Ranking定義書の MVP パラメータ（重み・lambda_mmr・top_k 等）が parameter_json 参照として明記されているか"
    - "relationship_master / occasion_master テーブル定義書と章構成・MVP 方針が一貫しているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "recommendation_run.ranking_config_id との LOGICAL 参照方針が明記されているか"
    - "Config 系の保持・削除方針（物理 DELETE 禁止・version 追加）が妥当か"
    - "is_current の解決単位が明記されているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "ranking_config と model_version の責務分担（Ranking定義書 §13 との関係）"
  - "is_current の解決単位（config_name 単位 / 全体単位）"
  - "parameter_json の MVP 必須キーと seed 初期値"

risk_points:
  - "Ranking定義書 §13 が model_version 管理を示唆する一方、論理ER は ranking_config を独立エンティティとする点"
  - "evaluation_run.ranking_config_id 参照の DDL Task への引き継ぎ"
  - "seed Task での parameter_json 初期値と Ranking定義書 MVP 初期値の乖離"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-ranking-config.yaml"
  - "先行 Task: #440 / PR #441（enum 定義）、#442 / PR #443（relationship_master）、#445 / PR #448（occasion_master）"
