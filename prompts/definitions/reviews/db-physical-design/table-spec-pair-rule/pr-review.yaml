schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-pair-rule-pr"
  title: "pair_rule テーブル定義書 PRレビュー"
  summary: "pair_rule テーブル定義書 Task の PR を AI Review する。物理ER・論理ER・Featureルール定義書・pair_master との整合と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-475-pair-rule-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 489
  issue: 475
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-pair-rule.yaml"
  source_branch: "docs/task-475-pair-rule-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-pair-rule.yaml"
    required: true
  issue:
    number: 475
    required: true
  pr:
    number: 489
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/pair_rule_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/pair_master_テーブル定義書.md"
      required: true
      purpose: "pair_id 物理 FK 方針との一貫性確認"
    - path: "docs/06_実装設計/database/feature_definition_テーブル定義書.md"
      required: true
      purpose: "feature_code 参照・Rule 系方針の一貫性確認"
    - path: "docs/06_実装設計/database/semantic_config_version_テーブル定義書.md"
      required: true
      purpose: "semantic_config_version_id FK 方針の確認"
    - path: "docs/06_実装設計/database/relationship_rule_テーブル定義書.md"
      required: true
      purpose: "Rule 系テーブル定義書との一貫性確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§8–§11 テーブル分類・FK・Index 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§10.2 エンティティ属性・feature_rule 分解との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§8 テーブル分類・pair_master との関係"
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: true
      purpose: "§9.3 / §17.3 / §20.1 Pair Rule 論理定義"
    - path: "docs/06_実装設計/api/API-PUB-008_Featureルール取得API契約仕様書.md"
      required: true
      purpose: "pair_rule Public 非公開方針"
    - path: "docs/06_実装設計/api/API-PUB-007_Semantic設定取得API契約仕様書.md"
      required: true
      purpose: "内部 Rule 非公開方針"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §10.2 feature_rule 抽象名からの分解差分が明示されているか"
    - "Featureルール定義書 §17.3 論理項目との対応（pair_id 置換）が明記されているか"
    - "API-PUB-007 / API-PUB-008 に基づく Public API 非公開が明記されているか"
    - "pair_master / feature_definition テーブル定義書と Rule 系方針が一貫しているか"
  db:
    - "PK / Index / CHECK / UNIQUE が DDL Task へ展開できる粒度か"
    - "`pair_id` への pair_master 物理 FK が明記されているか（codes 参照ではない）"
    - "`semantic_config_version_id` への物理 FK が明記されているか"
    - "`feature_code` + `feature_delta` 行モデルが明記されているか"
    - "version + pair + feature の UNIQUE 方針が妥当か"
    - "feature_delta の値域 CHECK 方針が妥当か"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "Featureルール定義書 §17.3 の relationship_code / occasion_code を物理 DDL で pair_id に置換する差分の明記（Human Review #465 踏襲）"
  - "`is_active` 列の MVP 物理 DDL 採用要否"
  - "MVP seed 対象 Pair 組み合わせの範囲（§20.1 代表組み合わせのみ）"
  - "feature_delta の値域 CHECK（例: -1.0〜1.0）と Featureルール定義書 §9.3 仮説値との整合"

risk_points:
  - "論理ER §10.2 の抽象 feature_rule と物理 pair_rule の属性差分"
  - "pair_master.is_active=false の Pair を参照する pair_rule 行の扱い"
  - "relationship_rule / occasion_rule テーブル定義書との Rule 系 UNIQUE / FK パターン一貫性"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-pair-rule.yaml"
  - "Wave2 No.6: pair_rule"
  - "先行 Task: #462/#463（Wave1）、#449/PR #465（pair_master）、#470/PR #479（feature_definition）"
  - "参考: #473/PR #486（relationship_rule）— Rule 系章構成の踏襲"
