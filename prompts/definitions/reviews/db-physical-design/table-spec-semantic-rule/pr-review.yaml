schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-semantic-rule-pr"
  title: "semantic_rule テーブル定義書 PRレビュー"
  summary: "semantic_rule テーブル定義書 Task の PR を AI Review する。物理ER・論理ER・Semanticルール定義書・API-PUB-007 との整合と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-472-semantic-rule-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 472
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-semantic-rule.yaml"
  source_branch: "docs/task-472-semantic-rule-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-semantic-rule.yaml"
    required: true
  issue:
    number: 472
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/semantic_rule_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§8–§11 整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§10.2 整合"
    - path: "docs/04_ドメインモデル設計/Semanticルール定義書.md"
      required: true
      purpose: "§17.1 論理項目・抽出フロー"
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: true
      purpose: "Semantic Rule と Feature Rule の責務分離"
    - path: "docs/06_実装設計/api/API-PUB-007_Semantic設定取得API契約仕様書.md"
      required: true
      purpose: "内部 Rule 非公開境界"
    - path: "docs/06_実装設計/database/semantic_config_version_テーブル定義書.md"
      required: true
      purpose: "親 FK・§8.1 被参照"
    - path: "docs/06_実装設計/database/feature_definition_テーブル定義書.md"
      required: true
      purpose: "Wave2 同群テーブル定義書との一貫性"
    - path: "docs/06_実装設計/database/semantic_concept_テーブル定義書.md"
      required: true
      purpose: "semantic_concept_id FK（ON / RESTRICT）・§8.1 被参照元との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§8 Semantic / Feature 定義系との整合"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §10.2 属性と矛盾しないか"
    - "Semanticルール定義書 §17.1 との論理名・物理名対応が整理されているか"
    - "Public API 非公開（source_text_pattern / weight 等）方針が明記されているか"
    - "feature_definition / semantic_concept テーブル定義書と章構成・MVP 方針が一貫しているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "semantic_config_version_id FK（ON）方針が明記されているか"
    - "semantic_concept_id FK（ON / RESTRICT）方針が semantic_concept §8.1 と一致しているか"
    - "rule_type / weight / is_active の制約・更新方針が妥当か"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points: []
resolved_human_decisions:
  - "rule_type: MVP は CHECK 4 値（keyword / phrase / pattern / llm）。hybrid は extraction_method 側 — §17.1 No.1"
  - "input_type / source_type: MVP は非保持（論理ER §10.2 準拠）。適用条件は input_type_rule または Resolver 側 — §17.1 No.2"
  - "source_text_pattern: 論理ER §10.2 の物理名正（match_pattern はドメイン論理名）— §17.1 No.3"
  - "version 内 Concept 整合: seed / reco で担保。複合 FK は MVP 見送り — §17.1 No.4"
  - "Rule 実装形式: YAML/JSON + seed + LLM 補助。DB テーブルは正本の一形式 — §17.1 No.5"
  - "weight 既定: 1.0000。優先度差は seed で調整 — §17.1 No.6"
  - "version 内 UNIQUE: semantic_config_version_id + rule_type + source_text_pattern + semantic_concept_id — §7"

risk_points:
  - "semantic_concept §8.1 前提（semantic_concept_id ON / RESTRICT）との FK 詳細の引き継ぎ"
  - "reco Semantic Rule Resolver が参照するカラム集合との整合"
  - "API-PUB-007 / API-PUB-008 が内部 Rule を表面公開しない契約との整合"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-semantic-rule.yaml"
  - "先行 Task: #462 / #463（Wave1 merge 済み）、#470 / PR #479（feature_definition merge 済み）、#471 / PR #485（semantic_concept merge 済み）"
  - "Wave2 No.3: semantic_rule"
