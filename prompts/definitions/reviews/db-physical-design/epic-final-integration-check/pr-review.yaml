schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-epic-final-integration-check-pr"
  title: "Epic終盤整合チェック PRレビュー"
  summary: "Epic #435 Phase2 終盤ゲート Task（#633）の PR を AI Review する。①〜⑥ 成果物棚卸し・db/ と docs の横断整合・Blocker 対応・Epic PR 進行判断材料・out_of_scope 混入を確認する。"
  type: "docs_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-633-epic-final-integration-check"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 634
  issue: 633
  task_definition: "prompts/definitions/tasks/db-physical-design/epic-final-integration-check.yaml"
  source_branch: "docs/task-633-epic-final-integration-check"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
    - "docs-reviewer-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/epic-final-integration-check.yaml"
    required: true
  issue:
    number: 633
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/00_共通/成果物管理/成果物一覧.md"
      required: true
      purpose: "§4.1 Phase2 成果物ステータス"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
    - path: "docs/06_実装設計/database/初期データ定義書.md"
      required: true
    - path: "docs/06_実装設計/database/データ保持・削除方針書.md"
      required: true
    - path: "docs/06_実装設計/database/マイグレーション方針書.md"
      required: true
  files:
    - path: "db/ddl/"
      required: true
    - path: "supabase/migrations/"
      required: true
    - path: "db/seeds/masters/"
      required: true
    - path: "scripts/epic-435-final-integration-check.py"
      required: true
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（Epic merge / develop 直接 / apps / OpenAPI 再同期）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
    - "PR 本文に棚卸し結果（事実 / 推論 / 未確認）と Blocker / Must / Should / Question 分類があるか"
    - "Related to #633 が使われ、Closes #633 が使われていないか"
  docs:
    - "成果物一覧 §4.1 が ①〜⑥ 完了状態と一致しているか"
    - "（未作成）プレースホルダと作成済み正本の重複が解消されているか"
    - "Epic PR → develop 進行判断材料が PR 本文に記載されているか"
  db:
    - "db/ddl・supabase/migrations・db/seeds/masters の件数・存在が初期データ定義書・DDLバッチ分割表と整合しているか"
    - "scripts/epic-435-final-integration-check.py が Blocker 0 で通過しているか"
    - "DDL/migration の CREATE TABLE 集合が一致しているか（62 件）"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_check:
  use_task_acceptance_criteria: true
  additional_criteria:
    - "PR本文に実施済み検証と未実施テストの理由が記載されている"
    - "Human Review で確認してほしい事項が明記されている"
    - "AI Review 結果を PR コメントに記録できる形式になっている"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "Blocker が未修正のまま残っていない"
      - "scope 外変更がない"
      - "Human Review で確認すべき事項が整理されている"
  request_changes:
    conditions:
      - "成果物一覧 §4.1 の更新が不十分"
      - "棚卸し結果または検証結果が PR 本文に不足"
      - "epic-435-final-integration-check.py が Blocker を報告している"
  needs_human_decision:
    conditions:
      - "物理ER の 60 テーブル表記と DDL 62 含有（MVP△）の方針確認が必要"
      - "Epic PR → develop merge 可否の最終判断が必要"
  split_required:
    conditions:
      - "apps / packages/contracts 変更が混在"
      - "DDL / migration の大規模仕様変更が混在"
  blocked:
    conditions:
      - "PR diff を確認できない"
      - "secret や .env 実値の混入が疑われる"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false
  ai_logs:
    required: false
    path: null

project:
  fields:
    phase: "06_実装設計"
    status: "AI Review"
    priority: "high"

issue:
  unit: "task"
  type: "docs"
  area: "db"

dependencies:
  issues:
    - 633
    - 435
  tasks:
    - "prompts/definitions/tasks/db-physical-design/epic-final-integration-check.yaml"
  blocking: false

parallel_control:
  depends_on: []
  blocks: []
  exclusive_files: []
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: false

contract_gate:
  required: false

test_policy:
  required:
    - "python3 scripts/epic-435-final-integration-check.py"
  not_required:
    - "unit test"
    - "e2e test"

human_decision_points:
  - "Epic PR → develop の merge 可否"
  - "物理ER 60 テーブル表記と DDL 62 含有の整合方針"
  - "MVP△ テーブル 4 件の Epic 含有最終確認"

notes:
  - "Epic PR 直前ゲート。#582・#469・D13 を補完"
  - "merge は Human Review 後に Human（ryo-chan-k6）が実施"
