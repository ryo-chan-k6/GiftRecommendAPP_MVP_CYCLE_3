schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-ddl-d05-pr"
  title: "d05 外部商品データ連携系DDL PRレビュー"
  summary: "D05 外部商品データ連携系 DDL Task の PR を AI Review する。`db/ddl/d05_external_product_integration.sql` が 10 テーブル定義書・物理 ER・マイグレーション方針書と整合しているか、D01〜D04 適用後に実行可能か、D06 以降の前提として妥当かを確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "chore/task-602-d05-ddl"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 618
  issue: 602
  task_definition: "prompts/definitions/tasks/db-physical-design/ddl-d05.yaml"
  source_branch: "chore/task-602-d05-ddl"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: true
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/ddl-d05.yaml"
    required: true
  issue:
    number: 602
    required: true
  pr:
    number: 618
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/DDLバッチ分割表.md"
      required: true
      purpose: "D05 scope・10 テーブル一覧・MVP△ 方針との突合"
    - path: "docs/06_実装設計/database/マイグレーション方針書.md"
      required: true
      purpose: "§8.1 ファイル命名・バッチ順序・MVP△ 含有方針"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§9–§13 FK・Index・§15 適用順序との整合"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "enum 列型参照（型定義は D01 正本）"
    - path: "docs/06_実装設計/database/コード定義書.md"
      required: true
      purpose: "コード列・CHECK 値との突合"
    - path: "db/ddl/d01_extensions_and_enums.sql"
      required: true
      purpose: "先行バッチ・enum 型名の参照"
    - path: "db/ddl/d02_semantic_feature_definitions.sql"
      required: true
      purpose: "先行バッチ DDL の参照"
    - path: "db/ddl/d03_master_config.sql"
      required: true
      purpose: "先行バッチ DDL の参照"
    - path: "db/ddl/d04_item.sql"
      required: true
      purpose: "先行バッチ DDL（`item` / `external_genre` / `external_attribute` 参照）"
    - path: "docs/06_実装設計/database/fetch_cursor_テーブル定義書.md"
      required: true
      purpose: "D05-1 突合（`target_external_genre_id` LOGICAL 参照含む）"
    - path: "docs/06_実装設計/database/api_call_log_テーブル定義書.md"
      required: true
      purpose: "D05-2 突合（`batch_run_id` / `fetch_cursor_id` LOGICAL 参照含む）"
    - path: "docs/06_実装設計/database/raw_product_metadata_テーブル定義書.md"
      required: true
      purpose: "D05-3 突合（`api_call_log_id` LOGICAL 参照含む）"
    - path: "docs/06_実装設計/database/staging_item_テーブル定義書.md"
      required: true
      purpose: "D05-4 突合（冪等 unique・LOGICAL 参照含む）"
    - path: "docs/06_実装設計/database/staging_item_image_テーブル定義書.md"
      required: true
      purpose: "D05-5 突合（partial unique・LOGICAL 参照含む）"
    - path: "docs/06_実装設計/database/staging_ranking_signal_テーブル定義書.md"
      required: true
      purpose: "D05-6 突合（冪等 unique・LOGICAL 参照含む）"
    - path: "docs/06_実装設計/database/staging_genre_テーブル定義書.md"
      required: true
      purpose: "D05-7 突合（冪等 unique・LOGICAL 参照含む）"
    - path: "docs/06_実装設計/database/staging_attribute_テーブル定義書.md"
      required: true
      purpose: "D05-8 突合（MVP△・LOGICAL 参照含む）"
    - path: "docs/06_実装設計/database/product_diff_result_テーブル定義書.md"
      required: true
      purpose: "D05-9 突合（`staging_item_id` LOGICAL 参照含む）"
    - path: "docs/06_実装設計/database/item_import_summary_テーブル定義書.md"
      required: true
      purpose: "D05-10 突合（`batch_run_id` LOGICAL 参照・冪等 unique 含む）"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（D06 以降テーブル / D10 batch_run_log / supabase migrations / packages / apps / docs 変更）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  db:
    - "D05 対象 10 テーブルが DDLバッチ分割表 §9 と一致しているか"
    - "ファイル名が `d05_external_product_integration.sql`（マイグレーション方針書 §8.1）であるか"
    - "CREATE 順序が `fetch_cursor` → `api_call_log` → `raw_product_metadata` → Staging 系 → `product_diff_result` → `item_import_summary` と依存と整合しているか"
    - "各テーブルの列・型・PK / UNIQUE / Index / CHECK がテーブル定義書と一致しているか"
    - "enum 列が D01 で定義された論理 ID 型を参照しているか"
    - "Staging 系テーブルに物理 FK が付与されていないか（LOGICAL + Index 方針）"
    - "`api_call_log.batch_run_id` / `item_import_summary.batch_run_id` が LOGICAL のまま（物理 FK なし）であるか"
    - "`fetch_cursor.target_external_genre_id` / Staging 系の `external_genre_id` / `external_attribute_id` が LOGICAL のままであるか"
    - "`staging_item` の `uq_staging_item_raw_metadata_code` が定義書どおりであるか"
    - "`staging_item_image` の `uq_staging_item_image_raw_code_url` と partial unique（主画像候補 1 件）が定義書どおりであるか"
    - "`staging_ranking_signal` / `staging_genre` / `staging_attribute` の冪等 unique が定義書どおりであるか"
    - "`product_diff_result` の `staging_item_id` が LOGICAL 参照のままであるか"
    - "`item_import_summary` の `(batch_run_id, source_api)` UNIQUE が定義書どおりであるか"
    - "`staging_attribute` が MVP△ として DDL に含まれ、定義書 §7〜§9 と整合しているか"
    - "D06 以降（Item 派生 / Online 推薦）からの後追い物理 FK が誤って本ファイルに含まれていないか"
    - "D01〜D04 適用後に本ファイルが実行可能か"
    - "D06（#603）以降 Task の前提として妥当か"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "`staging_attribute` MVP△ の DDL 含有と Task ⑤ migration 適用の go/no-go"
  - "Staging 系物理 FK なし（LOGICAL + Index）方針の確認"
  - "`batch_run_log`（D10 未作成）への LOGICAL 参照維持の確認"
  - "`item_import_summary` の `(batch_run_id, source_api)` 冪等キーと BATCH-017 整合の確認"
  - "`staging_item_image` 主画像候補 partial unique の確認"

risk_points:
  - "10 テーブル横断での列名・型・制約の取りこぼし"
  - "Staging 系への誤った物理 FK 付与"
  - "`staging_attribute` の MVP△ と物理 ER §17 の解釈差"
  - "`batch_run_log` 未作成状態での `batch_run_id` LOGICAL 参照の解釈"
  - "partial unique / 冪等 unique / CHECK 制約の定義書との不一致"
  - "D06（#603）以降 Task との適用順序依存"

notes:
  - "Batch D05 / change_id: `d05_external_product_integration`"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/ddl-d05.yaml"
  - "Issue #602 / Branch chore/task-602-d05-ddl"
  - "先行 merge 済み前提: D01（#611 / PR #614）、D02（#599 / PR #615）、D03（#600 / PR #616）、D04（#601 / PR #617）、#440（enum）、#587（コード定義）、#589（マイグレーション方針）"
  - "Issue #602 / PR #618 / Branch chore/task-602-d05-ddl"
