schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-external-attribute-pr"
  title: "external_attribute テーブル定義書 PRレビュー"
  summary: "external_attribute テーブル定義書 Task の PR を AI Review する。物理ER Item系・テーブル一覧・外部商品データ連携設計書 §4.5 / §12.3・item / staging_item / external_genre テーブル定義書との整合、MVP 任意方針と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-575-external-attribute-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 579
  issue: 575
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-external-attribute.yaml"
  source_branch: "docs/task-575-external-attribute-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-external-attribute.yaml"
    required: true
  issue:
    number: 575
    required: true
  pr:
    number: 579
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/external_attribute_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "Item系分類・MVP DDL 対象外（§17 No.7）・FK 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "商品系・外部商品データ連携系エンティティ属性との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§5 No.14 External Attribute・§5 補足 No.9（MVP任意）・§6 No.24 staging_attribute との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/正本定義表.md"
      required: true
      purpose: "External Attribute 正本区分（外部参照・MVP任意）の確認"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "§4.5 楽天属性検索API・§12.2–§12.3 属性データ・attributeIds マッピング"
    - path: "docs/05_アプリケーション設計/アプリ/モジュール一覧.md"
      required: true
      purpose: "MOD-BATCH-031 External Attribute Updater の責務確認"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "属性マスタ Upsert / 差分反映方針の確認"
    - path: "docs/06_実装設計/database/item_テーブル定義書.md"
      required: true
      purpose: "§12.3 attributeIds / normalized_hash 方針（#495 merge 済み正本）"
    - path: "docs/06_実装設計/database/staging_item_テーブル定義書.md"
      required: true
      purpose: "Staging 系章構成・Retention 方針参考（#517 merge 済み正本）"
    - path: "docs/06_実装設計/database/external_genre_テーブル定義書.md"
      required: true
      purpose: "外部参照マスタ章構成・Upsert 方針参考（#494 merge 済み正本）"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（staging_attribute 本体 / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "MVP 任意テーブル（△）であることが §4 / §5 等で明記されているか"
    - "物理ER §17 No.7（MVP DDL 作成対象外）との関係が矛盾なく整理されているか"
    - "テーブル一覧 §5 補足 No.9（属性データは MVP 任意）と一致しているか"
    - "外部商品データ連携設計書 §12.3 属性データ・Feature 推定補助の位置づけが整理されているか"
    - "item_テーブル定義書 §12.3 attributeIds との参照関係が明記されているか"
    - "external_genre / staging_item テーブル定義書と章構成・MVP 方針が一貫しているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "staging_attribute → external_attribute Upsert 方針（MOD-BATCH-031 連携）が明記されているか"
    - "item.attributeIds（商品シグナル）と external_attribute（属性マスタ）の LOGICAL 参照方針が明記されているか"
    - "source + external_attribute_id（または相当キー）の Upsert キー方針が妥当か"
    - "外部商品データ連携設計書 §10.3 `item_attribute` と物理名 `external_attribute` の差分が解消されているか"
    - "楽天商品検索API attributeIds / 楽天属性検索API / ジャンルAPI attributes の入力優先順位が整理されているか"
    - "external_genre_id 等ジャンル紐づけ要否が明記されているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "MVP DDL 作成 — **確定: MVP では作成しない**（§17.1 No.1 / external_attribute_テーブル定義書 §14）"
  - "`external_genre_id` 物理 FK — **確定: LOGICAL**（§17.1 No.2 / §8.1）"
  - "楽天属性検索API MVP 採用 — **確定: 不採用**（§17.1 No.3 / §12.2）"
  - "`item_attribute` 中間テーブル — **確定: MVP 不作成**（§17.1 No.4 / §5.5・§5.6）"

risk_points:
  - "item（#495 / PR #500）attributeIds / normalized_hash 方針への引き継ぎ"
  - "staging_attribute テーブル定義 Task への Upsert キー・列マッピング引き継ぎ"
  - "MOD-BATCH-031 External Attribute Updater 実装 Task への I/F 引き継ぎ"
  - "外部商品データ連携設計書 §10.3 `item_attribute` とテーブル一覧 `external_attribute` の名称差分"
  - "論理ER に external_attribute 詳細属性が未掲載の場合の後続論理ER 更新要否"

notes:
  - "Batch R09 No.3: external_attribute（Phase2 子 Task ③ 最終バッチ）"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-external-attribute.yaml"
  - "Issue #575 / Branch docs/task-575-external-attribute-table-spec / PR #579"
  - "先行 merge 済み前提: #495 / PR #500（item）、#517 / PR #522（staging_item）、#494 / PR #499（external_genre）"
  - "staging_attribute 本体定義は out_of_scope"
  - "PR 作成後: target.pr / input.pr.number / review.status を更新すること"
