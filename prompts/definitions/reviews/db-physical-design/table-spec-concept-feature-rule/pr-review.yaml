schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-concept-feature-rule-pr"
  title: "concept_feature_rule テーブル定義書 PRレビュー"
  summary: "concept_feature_rule テーブル定義書 Task の PR を AI Review する。物理ER・論理ER・Featureルール定義書 §17.4・API-PUB-008 との整合と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-476-concept-feature-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 490
  issue: 476
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-concept-feature-rule.yaml"
  source_branch: "docs/task-476-concept-feature-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-concept-feature-rule.yaml"
    required: true
  issue:
    number: 476
    required: true
  pr:
    number: 490
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/concept_feature_rule_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§8–§11 整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§10.2 整合"
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: true
      purpose: "§17.4"
    - path: "docs/06_実装設計/api/API-PUB-008_Featureルール取得API契約仕様書.md"
      required: true
      purpose: "conceptFeatureRules マッピング確認"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §10.2 属性と矛盾しないか"
    - "API-PUB-008 conceptFeatureRules マッピングが明記されているか"
    - "Public API 公開/非公開方針が明記されているか"
  db:
    - "PK / Index / CHECK が DDL Task へ展開できる粒度か"
    - "semantic_config_version_id FK 方針が明記されているか"
    - "concept_code / feature_code 参照方針が明記されているか"
    - "polarity enum 候補が明記されているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "polarity: MVP は CHECK + enum定義書 §6.20。packages 正本化は後続 enum Task（§17.1 No.1 決定済み）"
  - "feature_delta: 0.0〜1.0（大きさ）。polarity で方向（§17.1 No.2 決定済み）"
  - "Concept 参照: semantic_concept_id 物理 FK + API conceptCode JOIN（§17.1 No.3 決定済み）"
  - "version 内 UNIQUE: (semantic_config_version_id, semantic_concept_id, feature_code)（§17.1 No.4 決定済み）"
  - "MVP seed: 18 Concept 稀疏 seed（§17.1 No.5 決定済み）"

notes:
  - "Wave2 No.7: concept_feature_rule"
  - "Issue #476 / Branch docs/task-476-concept-feature-table-spec"
