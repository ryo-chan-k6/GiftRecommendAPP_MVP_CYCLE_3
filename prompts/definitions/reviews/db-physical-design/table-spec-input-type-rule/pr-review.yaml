schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-input-type-rule-pr"
  title: "input_type_rule テーブル定義書 PRレビュー"
  summary: "input_type_rule テーブル定義書 Task の PR を AI Review する。物理ER partial 方針・論理ER・Featureルール定義書 §11 との整合と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-477-input-type-rule-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 492
  issue: 477
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-input-type-rule.yaml"
  source_branch: "docs/task-477-input-type-rule-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-input-type-rule.yaml"
    required: true
  issue:
    number: 477
    required: true
  pr:
    number: 492
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/input_type_rule_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/semantic_config_version_テーブル定義書.md"
      required: true
      purpose: "semantic_config_version_id FK 方針・MVP partial 注記の確認"
    - path: "docs/06_実装設計/database/feature_definition_テーブル定義書.md"
      required: true
      purpose: "feature_code 参照・Rule 系方針の一貫性確認"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "§6.20–§6.21 input_type / application_method 正本化"
    - path: "packages/code-definitions/semantic/input_type.yaml"
      required: true
      purpose: "enum 機械可読正本との一致"
    - path: "packages/code-definitions/semantic/application_method.yaml"
      required: true
      purpose: "enum 機械可読正本との一致"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§8–§11 テーブル分類・partial 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§10.2 エンティティ属性・feature_rule 分解との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§8 テーブル分類・MVP partial（△）"
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: true
      purpose: "§2.1 / §11 Input Type Rule・§17.6 実装形式"
    - path: "docs/06_実装設計/api/API-PUB-008_Featureルール取得API契約仕様書.md"
      required: true
      purpose: "input_type_rule Public 非公開方針"
    - path: "docs/06_実装設計/api/API-PUB-007_Semantic設定取得API契約仕様書.md"
      required: true
      purpose: "内部 Rule 非公開方針"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §10.2 feature_rule 抽象名からの分解差分が明示されているか"
    - "Featureルール定義書 §11.1 入力種別（7 分類）と適用方針が整理されているか"
    - "ng_condition / budget_condition の Hard Filter 分離が明記されているか"
    - "API-PUB-007 / API-PUB-008 に基づく Public API 非公開が明記されているか"
    - "table-spec §17.1 に Human Review #477（MVP 物理 DDL 採用）が決定事項として記録されているか"
  db:
    - "PK / Index / CHECK が DDL Task へ展開できる粒度か"
    - "semantic_config_version_id への物理 FK 方針が明記されているか"
    - "input_type / application_method が enum定義書 §6.20–§6.21 と code-definitions と一致しているか"
    - "default_source_weight が input_type_rule に含まれず feature_integration_rule へ委譲されているか"
    - "§10 厳格 CHECK（chk_invert_delta_application_method / chk_input_type_dispatch_consistency）が DDL 展開可能か"
    - "version + input_type の UNIQUE 方針が妥当か"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "（クローズ）MVP seed 7 行固定 — §17.1 No.4"
  - "（クローズ）seed 漏れ時 §11.1 フォールバック + ログ — §17.1 No.7"
  - "（クローズ）input_type / application_method enum 正本化 — §17.1 No.5"
  - "（クローズ）default_source_weight は feature_integration_rule へ委譲 — §17.1 No.6"
  - "（クローズ）DDL 厳格 CHECK — §17.1 No.8"

risk_points:
  - "Featureルール定義書 §17 に input_type_rule 専用論理項目節がなく、§11 からの導出判断が必要"
  - "feature_integration_rule（#478）との統合重み境界（default_source_weight 委譲）"

notes:
  - "Wave2 No.8: input_type_rule"
  - "Issue #477 / Branch docs/task-477-input-type-rule-table-spec"
  - "先行 Task: #462 / #463（Wave1 merge 済み前提）"
