  summary: "meaning_distribution_metric テーブル定義書 Task の PR を AI Review する。物理ER・テーブル一覧 §11 No.60・ログ・Observability設計書・BATCH-016・batch_run_log / item_meaning / user_meaning / feature_distribution_metric テーブル定義書との整合、Social / Symbolic / λ_ctx 分布統計量・集計粒度・Retention 方針と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-557-meaning-distribution-metric-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 562
  issue: 557
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-meaning-distribution-metric.yaml"
