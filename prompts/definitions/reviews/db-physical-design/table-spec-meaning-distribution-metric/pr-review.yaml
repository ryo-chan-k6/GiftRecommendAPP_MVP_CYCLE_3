  - "feature_distribution_metric / normalization_distribution_metric 本体定義の再作成は out_of_scope"
  - "Human Review #556 先例（feature_distribution_metric §17.1）を Meaning 軸設計の整合基準とする"
  - "PR 番号は /create-pr 後に本 Review Definition の target.pr / input.pr.number を更新する"
