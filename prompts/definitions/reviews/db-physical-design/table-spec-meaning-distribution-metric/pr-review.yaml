    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他 Metric テーブル / DDL / migration / apps / OpenAPI / enum 追加本体）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "テーブル一覧 §11 No.60 の分類・用途（batch / reco・Social / Symbolic 分布）と一致しているか"
    - "ログ・Observability設計書 §12.12 カラム候補との突合（採用列・差分）が §5.4 等で整理されているか"
    - "batch_run_log / item_meaning / user_meaning との関係が §5 / §8 で明記されているか"
    - "feature_distribution_metric_テーブル定義書 §5.5 / §5.8 / §17.1 との対称設計（列構造・aggregation_scope・冪等キー・Retention）が整合しているか"
    - "BATCH-016 / IF-DB-BATCH-016 保存 I/F が一貫しているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "batch_run_log.batch_run_id への LOGICAL FK・集計スコープ（aggregation_scope）方針が明記されているか"
    - "item_meaning / user_meaning 個別 Meaning 値と本テーブル分布統計量の責務分離が明記されているか"
    - "entity_type（user / item）・value_layer（social / symbolic / lambda_ctx）・semantic_config_version_id 保持方針が妥当か"
    - "冪等キー / 再集計時の Upsert vs 追記方針が明記されているか"
    - "Retention 方針（365日以上）が §13 等で明記されているか"
    - "feature_distribution_metric_テーブル定義書 §17.1 先例（aggregation_scope・Retention・schema 分割）との一貫性が保たれているか"
    - "phase_log feature_distribution_metric_recorded フェーズとの trace 境界が整合しているか"
  security:
    - "分布統計量に個人情報・secret を含めない方針が明記されているか"
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "ログ・Observability設計書 §12.12 汎用カラム候補のうち MVP で物理列化する範囲（#556 §17.1 先例との一貫性）"
  - "entity_type（user / item / run）と value_layer（social / symbolic / lambda_ctx）の列設計"
  - "aggregation_scope=run（Recommendation Run 単位 user_meaning 分布）を MVP に含めるか"
  - "enum batch_run_phase_name に meaning 専用 phase を追加するかの要否"
  - "item_meaning / user_meaning の entity_type 別行設計（feature_code 非使用の Meaning 軸）"

risk_points:
  - "ログ・Observability設計書 §12.12 の汎用 metric カラム設計と Meaning 専用テーブルへの落とし込み粒度"
  - "item_meaning §5.5 / user_meaning §5.6 と分布統計量の責務境界の一貫性"
  - "feature_distribution_metric §5.8 / §17.1 との列設計・命名・aggregation_scope の対称性"
  - "batch / reco 双方が更新主体のため、集計トリガーと batch_run_id 必須性の整理"
  - "Run 単位 user_meaning 分布を MVP に含めるか（#556 は Feature 側 run 拡張を MVP 外と決定済み）"

notes:
  - "Batch R07 No.5: meaning_distribution_metric"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-meaning-distribution-metric.yaml"
  - "Issue #557 / Branch docs/task-557-meaning-distribution-metric-table-spec"
