input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-meaning-distribution-metric.yaml"
    required: true
  issue:
    number: 557
    required: true
  pr:
    number: 562
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/meaning_distribution_metric_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
