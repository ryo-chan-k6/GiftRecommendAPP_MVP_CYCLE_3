review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章（19 章）が充足しているか"
    - "論理ER §11.1 の属性（semantic_config_version_id / semantic_config_id / version_label / is_current / valid_from / valid_to / created_at）と矛盾しないか"
    - "ranking_config / model_version / semantic_config テーブル定義書と章構成・MVP 方針が一貫しているか"
    - "configName + versionLabel composite 参照・アプリ層 JOIN・内部 uuid 非公開が §5.3 / §17.1 に明記されているか"
  db:
    - "PK / Unique / Index / CHECK / partial unique が DDL Task へ展開できる粒度か"
    - "semantic_config_id への物理 FK（ON DELETE RESTRICT）が明記されているか"
    - "recommendation_run / evaluation_run への LOGICAL 被参照方針が明記されているか"
    - "子テーブル（semantic_concept / feature_definition / 各種 Rule）への ON FK 被参照が §8.1 に整理されているか"
    - "is_active（親）と is_current（本テーブル）の解決階層が §17 に整理されているか"
    - "model_version との責務分離（CF-01 / CF-02）が明記されているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points: []
resolved_human_decisions:
  - "Public 参照キー: configName + versionLabel composite（semanticConfigVersionId 表面 ID 不採用）— §17.1 No.1"
  - "config_name は親正本・api アプリ層 JOIN（denormalize / DB ビューなし）— §17.1 No.2"
  - "MVP 初期 version_label: semver v1.0.0 — §17.1 No.3"
  - "内部参照は semantic_config_version_id（UUID）維持 — §17.1 No.4"
  - "解決階層: 親 is_active → 子 is_current の 2 段階解決 — §17.1 No.5"
  - "is_current 解決単位: semantic_config_id 単位（全体1現行は不採用）— §17.1 No.6"
  - "valid_from/valid_to: seed 明示設定、valid_to=9999-12-31 23:59:59+00 — §17.1 No.7"
  - "recommendation_run/evaluation_run: MVP は LOGICAL 維持 — §17.1 No.8"

risk_points:
  - "semantic_config 親テーブル Task (#462) との FK / is_active 解決引き継ぎ"
  - "子テーブル（semantic_concept 等）定義 Task への ON FK 引き継ぎ"
  - "API-PUB-007 / API-PUB-008 / API-INT-002 の契約追随（Contract Task。composite 参照への更新）"
  - "reco Config Resolver が is_active / is_current の両方を解釈する必要"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-semantic-config-version.yaml"
  - "先行 Task: #440（enum 定義）、#442 / #445（Master 系）、#462（semantic_config 親テーブル）"
  - "Batch2-2: Semantic / Feature定義系 version 管理テーブル定義 Task"
  - "参考: ranking_config (#451)、model_version (#450) の Config / version 管理構成"
