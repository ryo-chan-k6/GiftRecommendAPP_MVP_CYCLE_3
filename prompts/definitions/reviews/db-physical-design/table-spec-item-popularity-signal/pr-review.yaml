schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-item-popularity-signal-pr"
  title: "item_popularity_signal テーブル定義書 PRレビュー"
  summary: "item_popularity_signal テーブル定義書 Task の PR を AI Review する。物理ER・論理ER §8.4・テーブル一覧 §5/§14・ranking_snapshot / item / external_genre テーブル定義書・バッチ設計方針書との整合、冪等キー・Item 紐づけ・Snapshot 配下全件反映方針と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-504-item-popularity-signal-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 509
  issue: 504
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-item-popularity-signal.yaml"
  source_branch: "docs/task-504-item-popularity-signal-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-item-popularity-signal.yaml"
    required: true
  issue:
    number: 504
    required: true
  pr:
    number: 509
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/item_popularity_signal_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "Item 系・Ranking Snapshot 系分類・FK・Index・冪等キー方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§8.2–§8.4 Item Popularity Signal 属性・§9 Staging 系 ER との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§5 No.16・§14 No.2・Ranking 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "楽天ランキング API・Snapshot 反映方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "§11.5 Snapshot 反映・§12.3 staging 反映・Online 参照方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-BATCH-008 / IF-DB-RECO-006・ranking_snapshot_id + rank 冪等キーとの整合"
    - path: "docs/06_実装設計/database/ranking_snapshot_テーブル定義書.md"
      required: true
      purpose: "親ヘッダ・§5.2 staging 経路・§8.2 子 FK・§12 Upsert 方針（#496 merge 済み正本）"
    - path: "docs/06_実装設計/database/item_テーブル定義書.md"
      required: true
      purpose: "§8.2 item_id LOGICAL FK・§13 popularityBadge JOIN・§5.1 責務境界（#495 merge 済み正本）"
    - path: "docs/06_実装設計/database/external_genre_テーブル定義書.md"
      required: true
      purpose: "external_genre_id（bigint）・§8.2 被参照関係 LOGICAL 参照（#494 merge 済み正本）"
    - path: "docs/06_実装設計/database/item_image_テーブル定義書.md"
      required: true
      purpose: "Item 子テーブル章構成・出所列不採用方針との一貫性参考"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "period 等 enum 参照との整合"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（ranking_snapshot 再定義 / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §8.2 の属性（item_popularity_signal_id / item_id / external_item_code / external_genre_id / rank / period / last_build_date / fetched_at）と矛盾しないか"
    - "論理ER §8.4 の楽天ランキング API 項目マッピング（itemName / itemPrice / imageUrl / itemUrl 非反映）と一致しているか"
    - "テーブル一覧 §5 No.16・§14 No.2 と分類・用途・冪等方針が一致しているか"
    - "ranking_snapshot テーブル定義書 §5.2 の 2 層構造・ヘッダ/明細責務分離と一致しているか"
    - "item_テーブル定義書 §5.1 / §8.2 / §13（popularityBadge）との責務境界が明記されているか"
    - "external_genre / item_image / item_review_summary と同型の source / source_api 不採用方針が明記されているか"
    - "バッチ設計方針書 §11.5 の Snapshot 配下全件反映・fetched_at 非冪等キー方針と一致しているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "ranking_snapshot.ranking_snapshot_id への物理 FK（ON・contains 1:N）方針が明記されているか"
    - "item.item_id への LOGICAL FK（has 1:N・item 未解決時 code 紐づけ）方針が明記されているか"
    - "external_genre.external_genre_id（bigint）への LOGICAL FK 方針が明記されているか"
    - "冪等キー UNIQUE (ranking_snapshot_id, rank)（uq_ips_snapshot_rank）が §7 / §10 に定義されているか"
    - "staging_ranking_signal → ranking_snapshot → item_popularity_signal 経路が §5 / §12 に整理されているか"
    - "ヘッダ冗長列（external_genre_id / period / last_build_date）の明細側保持方針が明記されているか"
    - "DDL 適用順序が ranking_snapshot 作成後（ranking_snapshot 定義書 §15）と整合しているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "rank 履歴追記 vs Snapshot 配下最新のみ Upsert の MVP 方針（論理ER §18.1）"
  - "ヘッダ ranking_snapshot と明細の external_genre_id / period / last_build_date 冗長列を明細に保持するか（ranking_snapshot 定義書 §5.2 注記）"
  - "item_id 未解決時の external_item_code のみ保持・後続 BATCH 補完取得の扱い"
  - "Snapshot 配下に存在しなくなった rank 明細の DELETE / 論理削除方針"
  - "popularityBadge 公開表面（API-PUB-003）に含める属性範囲"

risk_points:
  - "論理ER §8.2 主要属性に ranking_snapshot_id が未列挙（物理設計では必須 FK）"
  - "staging_ranking_signal → item_popularity_signal 直接 upserts（論理ER §9.1）と ranking_snapshot ヘッダ介在の整合"
  - "reco Online 参照が最新 ranking_snapshot 経由である点（バッチ設計方針書 §12.3）と明細保持期間の整合"
  - "item_id LOGICAL FK と external_item_code 併存時の Upsert 更新順序"
  - "MOD-RECO-017 Popularity Scorer への内部 rank 利用と Public API 非公開方針の境界"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-item-popularity-signal.yaml"
  - "Batch R02 No.2: item_popularity_signal"
  - "先行 merge 済み: #494 external_genre / PR #499、#495 item / PR #500、#496 ranking_snapshot / PR #501"
  - "Issue #504 / Branch docs/task-504-item-popularity-signal-table-spec"
  - "PR 作成後: target.pr / input.pr.number / review.status を更新すること"
