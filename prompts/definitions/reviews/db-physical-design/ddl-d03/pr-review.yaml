schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-ddl-d03-pr"
  title: "d03 Master/Config系DDL PRレビュー"
  summary: "D03 Master / Config 系 DDL Task の PR を AI Review する。`db/ddl/d03_master_config.sql` が 7 テーブル定義書・物理 ER・マイグレーション方針書と整合しているか、D01 / D02 適用後に実行可能か、D04 以降の前提として妥当かを確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "chore/task-600-d03-ddl"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 600
  task_definition: "prompts/definitions/tasks/db-physical-design/ddl-d03.yaml"
  source_branch: "chore/task-600-d03-ddl"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: true
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/ddl-d03.yaml"
    required: true
  issue:
    number: 600
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/DDLバッチ分割表.md"
      required: true
      purpose: "D03 scope・7 テーブル一覧との突合"
    - path: "docs/06_実装設計/database/マイグレーション方針書.md"
      required: true
      purpose: "§8.1 ファイル命名・バッチ順序・D12 後追い FK 方針"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§9 制約一覧・§15 適用順序との整合"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "enum 列型参照（型定義は D01 正本）"
    - path: "docs/06_実装設計/database/コード定義書.md"
      required: true
      purpose: "コード列・CHECK 値との突合"
    - path: "db/ddl/d01_extensions_and_enums.sql"
      required: true
      purpose: "先行バッチ・enum 型名の参照"
    - path: "db/ddl/d02_semantic_feature_definitions.sql"
      required: true
      purpose: "先行バッチ・延期 FK 対象（`pair_rule`）の参照"
    - path: "docs/06_実装設計/database/relationship_master_テーブル定義書.md"
      required: true
      purpose: "D03-1 突合"
    - path: "docs/06_実装設計/database/occasion_master_テーブル定義書.md"
      required: true
      purpose: "D03-2 突合"
    - path: "docs/06_実装設計/database/pair_master_テーブル定義書.md"
      required: true
      purpose: "D03-3 突合（`pair_rule` 被参照 FK 含む）"
    - path: "docs/06_実装設計/database/model_version_テーブル定義書.md"
      required: true
      purpose: "D03-4 突合"
    - path: "docs/06_実装設計/database/ranking_config_テーブル定義書.md"
      required: true
      purpose: "D03-5 突合"
    - path: "docs/06_実装設計/database/reason_template_テーブル定義書.md"
      required: true
      purpose: "D03-6 突合（Master LOGICAL 参照方針含む）"
    - path: "docs/06_実装設計/database/feature_normalization_version_テーブル定義書.md"
      required: true
      purpose: "D03-7 突合"
    - path: "docs/06_実装設計/database/pair_rule_テーブル定義書.md"
      required: true
      purpose: "延期 FK（`pair_id` → `pair_master`）突合"
    - path: "docs/06_実装設計/database/normalization_rule_テーブル定義書.md"
      required: true
      purpose: "D12 延期 FK（`feature_normalization_version_id`）が誤って含まれていないことの確認"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（D04 以降テーブル / supabase migrations / packages / apps / docs 変更）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  db:
    - "D03 対象 7 テーブルが DDLバッチ分割表 §7 と一致しているか"
    - "ファイル名が `d03_master_config.sql`（マイグレーション方針書 §8.1）であるか"
    - "Master テーブル（relationship / occasion / pair）→ Config テーブル（model / ranking / feature_normalization / reason_template）の CREATE 順序が依存と整合しているか"
    - "各テーブルの列・型・PK / UNIQUE / Index / CHECK がテーブル定義書と一致しているか"
    - "enum 列が D01 で定義された論理 ID 型を参照しているか"
    - "`pair_rule` → `pair_master` の延期物理 FK（`ON DELETE RESTRICT`）が定義書どおり付与されているか"
    - "`normalization_rule` → `feature_normalization_version` の物理 FK が誤って本ファイルに含まれていないか（D12 委譲）"
    - "`reason_template` の `relationship_code` / `occasion_code` が LOGICAL 参照のまま（物理 FK なし）であるか"
    - "派生テーブルから Master / Config への物理 FK が誤って含まれていないか"
    - "D01 / D02 適用後に本ファイルが実行可能か"
    - "D04（#601）以降 Task の前提として妥当か"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "`reason_template` の Master code 列 CHECK 範囲と seed 担保方針の確認"
  - "Config version 管理パターン（`is_current` / `config_name` / `normalization_method` 解決単位）の確認"
  - "`normalization_rule` → `feature_normalization_version` を D12 後追いとする方針の確認"

risk_points:
  - "7 テーブル横断での列名・型・制約の取りこぼし"
  - "`pair_rule` 延期 FK の制約名・ON DELETE 方針の不一致"
  - "`normalization_rule` の D03 跨ぎ FK を誤って本バッチに含めるリスク"
  - "`reason_template` の LOGICAL 参照列と Master 定義の不整合"
  - "D04（#601）以降 Task との適用順序依存"

notes:
  - "Batch D03 / change_id: `d03_master_config`"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/ddl-d03.yaml"
  - "Issue #600 / Branch chore/task-600-d03-ddl"
  - "先行 merge 済み前提: D01（#611 / PR #614）、D02（#599 / PR #615）、#440（enum）、#587（コード定義）、#589（マイグレーション方針）"
