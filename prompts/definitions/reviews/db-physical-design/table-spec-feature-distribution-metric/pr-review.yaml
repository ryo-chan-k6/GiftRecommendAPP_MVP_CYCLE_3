  summary: "feature_distribution_metric テーブル定義書 Task の PR を AI Review する。物理ER・テーブル一覧 §11 No.59・ログ・Observability設計書・BATCH-016・batch_run_log / feature_definition / item_feature テーブル定義書との整合、分布統計量・集計粒度・Retention 方針と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-556-feature-distribution-metric-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 556
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-feature-distribution-metric.yaml"
  source_branch: "docs/task-556-feature-distribution-metric-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
