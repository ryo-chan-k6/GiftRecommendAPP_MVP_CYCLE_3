schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-ddl-d01-pr"
  title: "d01 拡張/enum型DDL PRレビュー"
  summary: "D01 拡張/enum型 DDL Task の PR を AI Review する。`db/ddl/d01_extensions_and_enums.sql` が enum定義書・物理 ER §12・マイグレーション方針書と整合しているか、D02 以降の前提として妥当かを確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "chore/task-611-d01-extensions-and-enums-ddl"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 611
  task_definition: "prompts/definitions/tasks/db-physical-design/ddl-d01.yaml"
  source_branch: "chore/task-611-d01-extensions-and-enums-ddl"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: true
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/ddl-d01.yaml"
    required: true
  issue:
    number: 611
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/DDLバッチ分割表.md"
      required: true
      purpose: "D01 scope・enum 型 26 件一覧との突合"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "§4.1 論理 ID 分離・§5・§6 値定義との突合"
    - path: "docs/06_実装設計/database/マイグレーション方針書.md"
      required: true
      purpose: "§8.1 ファイル命名・§13 pgvector 方針の確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§12 状態・enum連携との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（テーブル DDL / supabase migrations / packages / apps）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  db:
    - "`CREATE EXTENSION IF NOT EXISTS vector;` が含まれているか"
    - "enum定義書 §5 の論理 ID 26 件がすべて `CREATE TYPE` されているか"
    - "各 enum の値が enum定義書 §6 の enabled 値と一致しているか（欠落・余分な値・順序）"
    - "`recommendation_run_status` と `batch_run_status` が別型として定義されているか"
    - "`recommendation_run_phase_name` と `batch_run_phase_name` が別型として定義されているか"
    - "`evaluation_run_phase_name` が誤って定義されていないか"
    - "ファイル名が `d01_extensions_and_enums.sql`（マイグレーション方針書 §8.1）であるか"
    - "D02 以降のテーブル DDL が本ファイル適用後に参照可能な前提か"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "`owner_type` は enum 全体を DDL 化するが、`phase_log` の MVP CHECK 3 値制限はテーブル DDL Task で実施する方針の確認"

risk_points:
  - "enum 値の追加漏れ（特に `batch_run_phase_name` 15 値、`feedback_type` 複数値）"
  - "`packages/code-definitions` との値不一致（本 Task では packages 変更 out_of_scope）"
  - "D02（#599）以降 Task との適用順序依存"

notes:
  - "Batch D01 / change_id: `d01_extensions_and_enums`"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/ddl-d01.yaml"
  - "Issue #611 / Branch chore/task-611-d01-extensions-and-enums-ddl"
  - "先行 merge 済み前提: #440（enum）、#587（コード定義）、#589（マイグレーション方針）"
