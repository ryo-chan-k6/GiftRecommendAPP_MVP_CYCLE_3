schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-ddl-d09-pr"
  title: "d09 Evaluation系DDL PRレビュー"
  summary: "D09 Evaluation 系 DDL Task の PR を AI Review する。`db/ddl/d09_evaluation.sql` が 5 テーブル定義書・物理 ER・マイグレーション方針書と整合しているか、D01〜D08 適用後に実行可能か、D10 以降の前提として妥当かを確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "chore/task-606-d09-ddl"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 622
  issue: 606
  task_definition: "prompts/definitions/tasks/db-physical-design/ddl-d09.yaml"
  source_branch: "chore/task-606-d09-ddl"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: true
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/ddl-d09.yaml"
    required: true
  issue:
    number: 606
    required: true
  pr:
    number: 622
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/DDLバッチ分割表.md"
      required: true
      purpose: "D09 scope・5 テーブル一覧との突合"
    - path: "docs/06_実装設計/database/マイグレーション方針書.md"
      required: true
      purpose: "§8.1 ファイル命名・バッチ順序"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§10 Index・§11 CHECK・§15 適用順序・§17 MVP 対象との整合"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "enum 列型参照（型定義は D01 正本）"
    - path: "docs/06_実装設計/database/コード定義書.md"
      required: true
      purpose: "コード列・CHECK 値との突合"
    - path: "db/ddl/d01_extensions_and_enums.sql"
      required: true
      purpose: "先行バッチ・enum 型名の参照"
    - path: "db/ddl/d07_online_recommendation.sql"
      required: true
      purpose: "先行バッチ DDL（`recommendation_request` / `recommendation_result` 参照）"
    - path: "docs/06_実装設計/database/evaluation_dataset_テーブル定義書.md"
      required: true
      purpose: "D09-1 突合（name+version unique・CHECK 含む）"
    - path: "docs/06_実装設計/database/evaluation_case_テーブル定義書.md"
      required: true
      purpose: "D09-2 突合（dataset FK・partial index・request LOGICAL 含む）"
    - path: "docs/06_実装設計/database/evaluation_run_テーブル定義書.md"
      required: true
      purpose: "D09-3 突合（status CHECK・version LOGICAL・batch_run LOGICAL 含む）"
    - path: "docs/06_実装設計/database/evaluation_result_テーブル定義書.md"
      required: true
      purpose: "D09-4 突合（run×case unique・dataset 冗長 FK・result LOGICAL 含む）"
    - path: "docs/06_実装設計/database/evaluation_metric_テーブル定義書.md"
      required: true
      purpose: "D09-5 突合（result FK・metric_name unique 含む）"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（D10 以降テーブル / supabase migrations / packages / apps / docs 変更）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  db:
    - "D09 対象 5 テーブルが DDLバッチ分割表 §13 と一致しているか"
    - "ファイル名が `d09_evaluation.sql`（マイグレーション方針書 §8.1 / change_id `d09_evaluation`）であるか"
    - "CREATE 順序が `evaluation_dataset` → `evaluation_case` → `evaluation_run` → `evaluation_result` → `evaluation_metric` と依存と整合しているか"
    - "各テーブルの列・型・PK / UNIQUE / Index / CHECK がテーブル定義書と一致しているか"
    - "`evaluation_dataset.uq_evaluation_dataset_name_version` が定義書どおりであるか"
    - "`evaluation_case` → `evaluation_dataset` 物理 FK ON / `uq_evaluation_case_dataset_label` が定義書どおりであるか"
    - "`evaluation_case.recommendation_request_id` が LOGICAL のまま（物理 FK なし）であるか"
    - "`idx_evaluation_case_dataset_active` partial index（`WHERE is_active = true`）が定義書どおりであるか"
    - "`evaluation_run` → `evaluation_dataset` 物理 FK ON が定義書どおりであるか"
    - "`evaluation_run` の version 3 列 / `batch_run_id` が LOGICAL のまま（物理 FK なし）であるか"
    - "`evaluation_run` の `evaluation_status` CHECK と終端 / 非終端 `completed_at` CHECK が定義書どおりであるか"
    - "`evaluation_result` の Run×Case UNIQUE / 3 親 FK ON が定義書どおりであるか"
    - "`evaluation_result.recommendation_result_id` が LOGICAL のまま（物理 FK なし）であるか"
    - "`evaluation_metric` → `evaluation_result` 物理 FK ON / `(evaluation_result_id, metric_name)` UNIQUE が定義書どおりであるか"
    - "D01〜D08 適用後に本ファイルが実行可能か"
    - "D10（#607）以降 Task の前提として妥当か"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_check:
  use_task_acceptance_criteria: true
  additional_criteria:
    - "PR本文に実施済み検証と未実施テストの理由が記載されている"
    - "Human Review で確認してほしい事項が明記されている"
    - "AI Review 結果を PR コメントに記録できる形式になっている"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "修正必須事項がない"
      - "scope 外変更がない"
      - "Human Review で確認すべき事項が整理されている"
  request_changes:
    conditions:
      - "同一 Branch で修正可能な DDL 不備がある"
      - "PR 本文に必要情報が不足している"
      - "検証結果または未実施理由が不足している"
  needs_human_decision:
    conditions:
      - "MVP△ go/no-go の確認が必要"
      - "evaluation_case JSONB CHECK 省略方針の確認が必要"
      - "evaluation_run 終端 / 非終端 CHECK 表現の確認が必要"
      - "LOGICAL FK 方針（request / result / batch_run / version 3 列）の確認が必要"
  split_required:
    conditions:
      - "D10 Log 系テーブル CREATE が混在している"
      - "supabase migration 変更が混在している"
      - "別 Issue 化すべき設計変更が混在している"
  blocked:
    conditions:
      - "PR diff を確認できない"
      - "Task Definition が存在しない"
      - "Issue と PR の対応が不明"
      - "secret や .env 実値の混入が疑われる"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false
  ai_logs:
    required: false
    path: null

project:
  fields:
    phase: "06_実装設計"
    status: "AI Review"
    priority: "high"

issue:
  unit: "task"
  type: "chore"
  area: "db"

dependencies:
  issues:
    - 606
  tasks:
    - "prompts/definitions/tasks/db-physical-design/ddl-d09.yaml"
  blocking: false

parallel_control:
  depends_on: []
  blocks: []
  exclusive_files: []
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: true

test_policy:
  required:
    - "AI Review"
    - "PR diff check"
    - "db schema review"
    - "secret check"
  commands: []
  manual_checks:
    - "Task Definition の acceptance_criteria を満たしているか確認する"
    - "PR 本文に検証結果・未実施理由・Human Review 観点が記載されているか確認する"
  not_required:
    - "unit test"
  skip_reason:
    "unit test": "Review Definition はレビュー条件であり、実装テストを直接実行する作業定義ではないため"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: false
  reason: "通常 PR レビューのため、レビュー結果は PR コメントを正本とする"

risk_points:
  - "5 テーブル横断での列名・型・制約の取りこぼし"
  - "`uq_evaluation_dataset_name_version` / `uq_evaluation_case_dataset_label` の UNIQUE 定義漏れ"
  - "`uq_evaluation_result_run_case` / `uq_evaluation_metric_result_name` の UNIQUE 定義漏れ"
  - "request / result / batch_run / version 列への誤った物理 FK 付与"
  - "evaluation_run 終端 / 非終端 CHECK の表現漏れ"
  - "D10（#607）以降 Task との適用順序依存"

human_decision_points:
  - "MVP△（Evaluation 系 5 テーブル）の go/no-go"
  - "evaluation_case `input_condition_json` JSONB キー構造を DB CHECK で固定しない方針"
  - "evaluation_run `evaluation_status` 終端 / 非終端 CHECK 表現"
  - "recommendation_request / recommendation_result / batch_run_log / Config version の LOGICAL FK 方針"
  - "evaluation_result `recommendation_result_id` nullable（失敗時 NULL）方針"

stop_conditions:
  - "PR が存在しない場合"
  - "Task Definition が存在しない場合"
  - "Issue と PR の対応が不明な場合"
  - "diff を確認できない場合"
  - "D10 Log 系テーブル CREATE が混在している場合"
  - "supabase migration 変更が混在している場合"
  - "secret や .env 実値の混入が疑われる場合"
  - "Human Review を省略する前提になっている場合"
  - "AI が merge 判断を行う必要がある場合"

notes:
  - "Batch D09 / change_id: `d09_evaluation`"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/ddl-d09.yaml"
  - "Issue #606 / Branch chore/task-606-d09-ddl"
  - "MVP△: 全 5 テーブル"
  - "先行 merge 済み前提: D01（#611 / PR #614）〜 D08（#605 / PR #621）、#440（enum）、#587（コード定義）、#589（マイグレーション方針）"
