schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-staging-item-pr"
  title: "staging_item テーブル定義書 PRレビュー"
  summary: "staging_item テーブル定義書 Task の PR を AI Review する。物理ER・論理ER §9.2 / §9.3・状態遷移設計書 §6.5・enum定義書・外部商品データ連携設計書・raw_product_metadata / item テーブル定義書との整合、transforms_to / Upsert / normalized_hash / diff_status 方針と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-517-staging-item-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 522
  issue: 517
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-staging-item.yaml"
  source_branch: "docs/task-517-staging-item-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-staging-item.yaml"
    required: true
  issue:
    number: 517
    required: true
  pr:
    number: 522
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/staging_item_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "外部商品データ連携系・transforms_to / upserts / judged_as 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§9.2 エンティティ属性・§9.3 疑似差分取得構造・Staging→Item フローとの整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§6 No.20 分類・用途・Staging / Normalized Hash 補足方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/状態遷移設計書.md"
      required: true
      purpose: "§6.5 Product Diff Result 状態・差分判定フロー"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "product_diff_status enum との整合"
    - path: "packages/code-definitions/state/product_diff_status.yaml"
      required: true
      purpose: "diff_status packages 正本との整合"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "§6.3 差分判定・§6.4 hash 対象項目・§7 Staging 変換フローの確認"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-BATCH-005・trace キー（raw_metadata_id / staging_item_id）の確認"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "BATCH-005 / BATCH-006 / BATCH-007 と staging_item 更新タイミングの確認"
    - path: "docs/06_実装設計/database/raw_product_metadata_テーブル定義書.md"
      required: true
      purpose: "transforms_to 親 Metadata・content_hash vs normalized_hash 責務分担（#506 merge 済み正本）"
    - path: "docs/06_実装設計/database/item_テーブル定義書.md"
      required: true
      purpose: "Staging→Item Upsert キー・normalized_hash 経路（#495 merge 済み正本）"
    - path: "docs/06_実装設計/database/fetch_cursor_テーブル定義書.md"
      required: true
      purpose: "外部商品データ連携系 Batch 系テーブル定義書章構成参考（#505 merge 済み正本）"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（staging_item_image / product_diff_result 本体 / api_call_log / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §9.2 の属性と矛盾しないか（論理ER 差分は明示されているか）"
    - "テーブル一覧 §6 No.20 の分類・用途と一致しているか"
    - "状態遷移設計書 §6.5 Product Diff Result 状態が反映されているか"
    - "外部商品データ連携設計書 §6.3 / §6.4 normalized_hash 対象との突合表があるか"
    - "raw_product_metadata / item テーブル定義書と章構成・MVP 方針が一貫しているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "raw_product_metadata → staging_item transforms_to（raw_metadata_id・LOGICAL FK）関係が明記されているか"
    - "staging_item → item Upsert キー（source + external_item_code）が明記されているか"
    - "normalized_hash の算出タイミング・対象項目・item.normalized_hash との経路が整理されているか"
    - "diff_status（product_diff_status）と enum定義書 / packages 正本が一致しているか"
    - "staging_item → product_diff_result judged_as 関係（staging_item_id）が整理されているか"
    - "Staging 系物理 FK なし（LOGICAL + Index）方針が §8 等で明記されているか"
    - "BATCH-005 / BATCH-006 / BATCH-007 における staging_item 作成・更新主体（batch）が妥当か"
    - "idx_staging_item_* Index が §9 / 物理ER §10 に定義されているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "UNIQUE キー `(raw_metadata_id, external_item_code)` — **確定**（§17.1 No.1 / staging_item_テーブル定義書 §7）"
  - "`source` 列の Staging 明示保持 — **採用**（§17.1 No.2）"
  - "`review_average` / `review_count` の Staging 列 — **採用**（§17.1 No.3 / item_review_summary §5.7）"
  - "`diff_status` — **Staging 行 NULL 可**。判定正本は `product_diff_result` 優先（§17.1 No.4）"
  - "`normalized_hash` 算出 — **BATCH-005 内確定**。BATCH-006 は比較のみ（§17.1 No.5）"
  - "Retention / 古い staging 行の削除 — **物理ER §13 方針に従う**（成功 Batch 後即 DELETE）"

risk_points:
  - "raw_product_metadata（#506 / PR #511）との raw_metadata_id 参照・import_status 連動の引き継ぎ"
  - "item（#495 / PR #500）との Upsert キー・normalized_hash 経路の一貫性"
  - "product_diff_result / staging_item_image 後続 Task への staging_item_id / external_item_code 参照引き継ぎ"
  - "外部商品データ連携設計書 hash 対象項目と staging 列の対応漏れ"

notes:
  - "Batch R03 No.5: staging_item"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-staging-item.yaml"
  - "Issue #517 / Branch docs/task-517-staging-item-table-spec"
  - "先行 merge 済み前提: #440 / PR #441（enum）、#505 / PR #510（fetch_cursor）、#506 / PR #511（raw_product_metadata）、#495 / PR #500（item）"
  - "staging_item_image / product_diff_result 本体定義は out_of_scope"
  - "PR 作成後: target.pr / input.pr.number / review.status を更新すること"
