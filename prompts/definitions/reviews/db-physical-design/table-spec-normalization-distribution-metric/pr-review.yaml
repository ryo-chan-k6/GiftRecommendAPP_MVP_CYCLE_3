review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他 Metric テーブル / DDL / migration / apps / OpenAPI / enum 追加本体）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "テーブル一覧 §11 No.61 の分類・用途（batch 更新・正規化前後分布）と一致しているか"
    - "ログ・Observability設計書 §12.6 / §12.12 カラム候補との突合（採用列・差分）が §5.4 等で整理されているか"
    - "batch_run_log / feature_normalization_version / item_feature との関係が §5 / §8 で明記されているか"
    - "feature_distribution_metric_テーブル定義書 / meaning_distribution_metric_テーブル定義書 §5.5 / §5.8 / §17.1 との対称設計（列構造・aggregation_scope・冪等キー・Retention）が整合しているか"
    - "BATCH-013 / BATCH-016 / IF-DB-BATCH-016 保存 I/F が一貫しているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "batch_run_log.batch_run_id への LOGICAL FK・集計スコープ（aggregation_scope）方針が明記されているか"
    - "feature_normalization_version.feature_normalization_version_id への LOGICAL FK・正規化 version 再現性・必須条件が明記されているか"
    - "item_feature 個別 Feature 値と本テーブル正規化前後分布統計量の責務分離が明記されているか"
    - "feature_code・value_layer（raw / z_score / sigmoid）・semantic_config_version_id / feature_normalization_version_id 保持方針が妥当か"
    - "冪等キー / 再集計時の Upsert vs 追記方針が明記されているか"
    - "Retention 方針（365日以上）が §13 等で明記されているか"
    - "feature_distribution_metric / meaning_distribution_metric §17.1 先例（aggregation_scope・Retention・schema 分割）との一貫性が保たれているか"
    - "phase_log feature_distribution_metric_recorded フェーズとの trace 境界が整合しているか"
  security:
    - "分布統計量に個人情報・secret を含めない方針が明記されているか"
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "ログ・Observability設計書 §12.6 / §12.12 汎用カラム候補のうち MVP で物理列化する範囲（#556 / #557 §17.1 先例との一貫性）"
  - "value_layer（raw / z_score / sigmoid）と feature_distribution_metric の raw / normalized 境界"
  - "MVP sigmoid-only 前提で z-score 中間統計列を物理化するか将来拡張とするか"
  - "feature_normalization_version_id 必須条件（value_layer 別）"
  - "BATCH-013 候補生成と BATCH-016 本保存の責務境界"
  - "enum batch_run_phase_name に normalization 専用 phase を追加するかの要否（#557 §17.1 No.5 先例）"

risk_points:
  - "ログ・Observability設計書 §12.6 の正規化段階別 metric 設計と物理列への落とし込み粒度"
  - "feature_normalization_version §5.2 / item_feature §5.3 と正規化 version 再現性・集計スコープの一貫性"
  - "feature_distribution_metric §5.8 / §17.1 との列設計・命名・aggregation_scope の対称性"
  - "BATCH-013 / BATCH-016 双方が本テーブルに触れるため、書き込み主体と trace 境界の整理"
  - "MVP sigmoid-only と Observability §12.6 z-score 監視項目のギャップ"

notes:
