schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-normalization-rule-pr"
  title: "normalization_rule テーブル定義書 PRレビュー"
  summary: "normalization_rule テーブル定義書 Task の PR を AI Review する。テーブル定義書・物理ER・テーブル一覧の3点整合、論理ER・Featureルール定義書 §14・feature_normalization_version との責務分離と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-493-normalization-rule-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 493
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-normalization-rule.yaml"
  source_branch: "docs/task-493-normalization-rule-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-normalization-rule.yaml"
    required: true
  issue:
    number: 493
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/normalization_rule_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§8 追記・§5 分解一覧・FK方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§8 追記・§9 以降 No. 繰り下げ・§13 集計との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§10.2 整合"
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: true
      purpose: "§14 Feature正規化ルール・§16.2 管理先分離"
    - path: "docs/06_実装設計/database/semantic_config_version_テーブル定義書.md"
      required: true
      purpose: "§8.1 contains FK 被参照方針との整合"
    - path: "docs/06_実装設計/database/feature_normalization_version_テーブル定義書.md"
      required: true
      purpose: "責務分離・parameter_json パターンとの一貫性"
    - path: "docs/06_実装設計/database/feature_definition_テーブル定義書.md"
      required: true
      purpose: "feature_code 参照方針との整合"
    - path: "docs/06_実装設計/database/relationship_rule_テーブル定義書.md"
      required: true
      purpose: "Rule 系テーブル章構成・FK 方針との一貫性"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル定義書 / DDL / migration / apps / OpenAPI / 論理ER更新）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "物理ER §8・§5 とテーブル一覧 §8・§13 の追記がテーブル定義書と一致しているか"
    - "テーブル一覧 §9 以降の通し No. 繰り下げ漏れがないか"
    - "論理ER §10.2・Featureルール定義書 §14 と矛盾しないか"
    - "GiftMeaningSpace §7.4（semantic_config_version 配下）と Featureルール定義書 §14.8 / §16.2（feature_normalization_version 正本）の整理が §5.1 / §17 で明示されているか"
    - "Public API 非公開が明記されているか"
  db:
    - "PK / Index / CHECK / partial unique が DDL Task へ展開できる粒度か"
    - "semantic_config_version_id への物理 FK（ON DELETE RESTRICT）方針が明記されているか"
    - "feature_code / normalization_method 参照方針が明記されているか"
    - "feature_normalization_version との責務分離（ルール定義 vs version / パラメータ正本）が明記されているか"
    - "sigmoid 正規化パラメータの保持方式（カラム vs JSONB）が整理されているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "normalization_rule（ルール定義）と feature_normalization_version（version / パラメータ正本）の責務境界"
  - "sigmoid 系正規化パラメータの保持方式（カラム vs JSONB）"
  - "feature_code 単位の行モデル要否（MVP は全 8 軸共通か軸別か）"
  - "feature_normalization_version_id への LOGICAL 参照要否"

risk_points:
  - "テーブル一覧 §9 以降の通し No. 繰り下げ漏れによる正本 docs 不整合"
  - "item_feature 冪等キー・再生成判定への正規化ルール変更影響（batch 設計との整合）"

notes:
  - "Batch R01 No.1: normalization_rule"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-normalization-rule.yaml"
  - "先行 Task: #458 feature_normalization_version / #463 semantic_config_version"
  - "Issue #493 / Branch docs/task-493-normalization-rule-table-spec"
