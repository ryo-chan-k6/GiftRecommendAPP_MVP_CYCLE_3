review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他 Metric テーブル / BATCH-016 再定義 / DDL / migration / apps / OpenAPI / enum 追加本体）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "テーブル一覧 §11 No.62 の分類・用途（reco・Matching / Ranking スコア分布・partial MVP）と一致しているか"
    - "ログ・Observability設計書 §12.12 カラム候補との突合（採用列・差分）が §5.4 等で整理されているか"
    - "batch_run_log / recommendation_result / recommendation_result_item との関係が §5 / §8 で明記されているか"
    - "feature_distribution_metric / meaning_distribution_metric テーブル定義書との対称設計（列構造・aggregation_scope・冪等キー・Retention）が参考整合しているか"
    - "reco Online 記録方針（§22.3）と保存 I/F 整理が一貫しているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "batch_run_log.batch_run_id への LOGICAL FK・任意性・集計スコープ（aggregation_scope）方針が明記されているか"
    - "recommendation_result / recommendation_result_item 個別スコアと本テーブル分布統計量の責務分離が明記されているか"
    - "score_type / value_layer（context_score / final_score / matching 内訳）・recommendation_run_id / recommendation_result_id 保持方針が妥当か"
    - "冪等キー / 再集計時の Upsert vs 追記方針が明記されているか"
    - "Retention 方針（Metric 系列先例・§20.2）が §13 等で明記されているか"
    - "aggregation_scope=run（Recommendation Run 単位）を MVP partial に含めるかの整理が明確か"
    - "phase_log Reco 品質 Metric 記録境界（専用 phase 非追加）が整合しているか"
  security:
    - "分布統計量に個人情報・自由入力・secret を含めない方針が明記されているか"
    - "score_breakdown 全文をログ出力しない方針が明記されているか"
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "Human Review #564 決定済み（§17.1）。AI Review では決定内容と docs 反映の整合を確認する"
  - "将来 Task: daily / batch_run スコープ拡張・chk_rsdm_batch_run_null_mvp 解除タイミング"

risk_points:
  - "ログ・Observability設計書 §12.12 の汎用 metric カラム設計と Reco スコア専用テーブルへの落とし込み粒度"
  - "recommendation_result_item 個別スコア列と分布統計量の責務境界の一貫性"
  - "feature / meaning Metric 系列との列設計・命名・aggregation_scope の対称性と reco 主更新の差分"
  - "MVP partial（△）のため、Run 単位のみ採用か日次集計も含めるかの判断"
  - "batch_run_log 90 日 Retention と Metric 365 日以上 Retention の非連動整理"

notes:
