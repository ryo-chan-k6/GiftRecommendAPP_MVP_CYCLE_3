  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-555-user-meaning-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 555
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-user-meaning.yaml"
  source_branch: "docs/task-555-user-meaning-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-user-meaning.yaml"
    required: true
  issue:
    number: 555
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/user_meaning_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "User意味推定系分類・§9 recommendation_run → user_meaning FK・§10 Index 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§10.2 user_meaning / item_meaning 属性・§10.3 Feature 8 軸・§16 責務境界との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§4 No.9 user_meaning・User意味推定系補足との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/正本定義表.md"
      required: true
      purpose: "User Meaning 正本区分（user_social / user_symbolic）の確認"
    - path: "docs/04_ドメインモデル設計/GiftMeaningSpace定義書.md"
      required: true
      purpose: "§5–§7 Social / Symbolic 射影ルール・正規化後算出方針との整合"
    - path: "docs/04_ドメインモデル設計/Matching定義書.md"
      required: true
      purpose: "User Meaning × Item Meaning 比較・lambda_ctx・Context Score 前提との整合"
    - path: "docs/05_アプリケーション設計/アプリ/処理構成定義書.md"
      required: true
      purpose: "Online 推薦パイプライン・User Meaning 射影フェーズとの整合"
    - path: "docs/05_アプリケーション設計/アプリ/機能×モジュール対応表.md"
      required: true
      purpose: "MOD-RECO-008 / MOD-RECO-009 入出力との整合"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-RECO-003 保存 I/F との整合"
    - path: "docs/05_アプリケーション設計/アプリ/状態遷移設計書.md"
      required: true
      purpose: "user_meaning_projected Phase との整合"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: true
      purpose: "user_social_mean / user_symbolic_mean 等メトリクス列と user_meaning の責務境界"
    - path: "docs/06_実装設計/database/recommendation_run_テーブル定義書.md"
      required: true
      purpose: "§8.2 recommendation_run_id 物理 FK ON 被参照・semantic_config_version_id Run 側保持（#543 merge 済み正本）"
    - path: "docs/06_実装設計/database/semantic_config_version_テーブル定義書.md"
      required: true
      purpose: "射影重み・semantic_config_version_id 参照"
    - path: "docs/06_実装設計/database/feature_definition_テーブル定義書.md"
      required: true
      purpose: "8 軸 feature_code・Social / Symbolic グループ"
    - path: "docs/06_実装設計/database/feature_normalization_version_テーブル定義書.md"
      required: true
      purpose: "user_feature 正規化 version との再現性参照"
    - path: "docs/06_実装設計/database/item_meaning_テーブル定義書.md"
      required: true
      purpose: "#515 merge 済み時の item_meaning 対称性正本との突合"
    - path: "docs/06_実装設計/database/user_feature_テーブル定義書.md"
      required: false
      purpose: "#554 merge 済み時の生成元 Feature 正本との突合"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "feature_code enum・recommendation_run_phase_name との整合"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（user_semantic / user_feature 本体再定義 / item_meaning 再定義 / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "GiftMeaningSpace定義書 §5–§7 の Social / Symbolic 射影ルールと矛盾しないか"
    - "論理ER §10.2 user_meaning（user_social / user_symbolic / lambda_ctx）属性と一致しているか"
    - "item_meaning_テーブル定義書（#515）との対称性・差分（Run 単位 / lambda_ctx / version 参照粒度）が整理されているか"
    - "テーブル一覧 §4 No.9・正本定義表 user_social / user_symbolic と一致しているか"
    - "IF-DB-RECO-003 / MOD-RECO-008 による user_feature → user_meaning 生成・保存関係が明記されているか"
    - "Matching定義書 §4.5 lambda_ctx の保持・利用方針が明記されているか"
    - "recommendation_run_テーブル定義書 §5 / §8 との User 派生データ系責務境界が明記されているか"
    - "状態遷移設計書 user_meaning_projected Phase との整合が取れているか"
    - "ログ・Observability設計書の user_social_mean 等と meaning_distribution_metric の責務境界が明記されているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "recommendation_run.recommendation_run_id への物理 FK（ON・generates 1:0..1）方針が明記されているか"
    - "semantic_config_version 再現性（Run 経由 vs 行 denormalize）方針が明記されているか"
    - "user_social / user_symbolic（または同等列）の型・値域（0.0〜1.0）が定義されているか"
    - "lambda_ctx の型・値域（0.0〜1.0）と欠損時デフォルト方針が定義されているか"
    - "user_feature 正規化済み Feature 集合からの射影入力・再生成判定キーが明記されているか"
    - "Online 生成・reco 更新主体（論理ER §16）が明記されているか"
    - "DDL 適用順序が recommendation_run / semantic_config_version 作成後と整合しているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "user_social / user_symbolic の物理型（item_meaning 対称 scalar vs JSONB ベクトル）と MVP 保持粒度"
  - "lambda_ctx を user_meaning 行に保持するか Matching 時再算出か"
  - "semantic_config_version_id の行 denormalize 要否（recommendation_run 経由のみか）"
  - "feature_normalization_version_id の行保持要否（user_feature 集合との再現性）"
  - "冪等キー（recommendation_run_id のみ vs 複合キー）と user_feature 行集合との 1:1 / 1:N 関係"
  - "mean / std 等分布統計量を user_meaning 行に持つか meaning_distribution_metric のみか"

risk_points:
  - "user_feature テーブル定義書（#554）未 merge 時の生成元 Feature 列名・冪等キー参照ブレ"
  - "item_meaning（#515）との version 参照粒度差（Run 経由 vs 行直接保持）の整理漏れ"
  - "GiftMeaningSpace §5 の加重平均 vs 単純平均の MVP 採用と DB 列設計の整合"
  - "lambda_ctx の算出モジュール（MOD-RECO-009）と保存先（user_meaning）の責務重複"
  - "user_meaning（Run 単位）と item_meaning（商品単位）のカーディナリティ・更新主体差"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-user-meaning.yaml"
  - "Batch R07 No.3: user_meaning"
  - "先行 merge 済み前提: #543 recommendation_run / PR #548、#463 semantic_config_version"
  - "対称参照 merge 推奨: #515 item_meaning / PR #520、#554 user_feature"
  - "Issue #555 / Branch docs/task-555-user-meaning-table-spec"
  - "PR 作成後: target.pr / input.pr.number / review.status を更新すること"
