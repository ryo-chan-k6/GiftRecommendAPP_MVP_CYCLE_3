    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（raw_product_object / api_call_log 本体 / staging_* / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §9.2 の属性と矛盾しないか（論理ER 差分は明示されているか）"
    - "テーブル一覧 §6 No.19 の分類・用途と一致しているか"
    - "状態遷移設計書 §6.3 の状態一覧・遷移図が反映されているか"
    - "外部商品データ連携設計書 §8.3 Object Storage Key 設計・§8.4 Raw Metadata 項目との突合表があるか"
    - "raw_product_object（Object Storage 正本）との 1 対 1 参照方針が明記されているか"
    - "item / external_genre 等 Batch 系テーブル定義書と章構成・MVP 方針が一貫しているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "api_call_log → raw_product_metadata の 1:N produces（LOGICAL FK）関係が明記されているか"
    - "import_status（raw_import_status）と enum定義書 §6.7 が一致しているか"
    - "object_key / content_hash と raw_product_object 1 対 1 参照方針が明記されているか"
    - "raw_product_metadata → staging_* transforms_to（raw_metadata_id 参照）関係が整理されているか"
    - "idx_raw_metadata_status（import_status, fetched_at）が §7 / §10 に定義されているか"
    - "source / source_api / item_count / fetched_at / staged_at / imported_at / error_message の更新主体（batch）・保持方針が妥当か"
    - "BATCH-001〜005 における Raw 保存トリガーと import_status 初期値（raw_saved）が整理されているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "PK 列名: raw_metadata_id（論理ER）— **確定**（外部商品データ連携設計書 §8.4 との差分は §5.4）"
  - "外部商品データ連携設計書 §8.4 の batch_run_id / request_params 等 — **本テーブル列には持たない**（api_call_log 責務。§5.4）"
  - "content_hash 算出対象 — **Object Storage PUT body バイト列 SHA-256**（§5.7 / §17.1 No.5）"
  - "object_key UNIQUE — **MVP 必須**（§17.1 No.1 / §12.4）"
  - "api_call_log_id nullable — **手動再処理・integration test で NULL 可**（§17.1 No.2）"
  - "failed 再実行 — **同一行 import_status リセット**（§17.1 No.3 / §12.3）"
  - "source_api enum — **batch/source_api.yaml + enum定義書 §6.24**（§17.1 No.4）"

risk_points:
  - "api_call_log / fetch_cursor テーブル定義書が未作成のため、produces 関係の粒度が本 Task のみで完結するか"
  - "外部商品データ連携設計書 §8.4 と論理ER §9.2 の項目差（source_system vs source 等）"
  - "staging_* 後続 Task への raw_metadata_id 参照・import_status 連動の引き継ぎ"
  - "Raw JSON 保存省略方針（外部商品データ連携設計書 §8.2）と import_status / object_key nullable の整合"
  - "#505 fetch_cursor merge 前後での api_call_log 関係記述の更新要否"

notes:
  - "Batch R02 No.4: raw_product_metadata"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-raw-product-metadata.yaml"
  - "Issue #506 / Branch docs/task-506-raw-product-metadata-table-spec"
