      purpose: "外部商品データ連携系・api_call_log → raw_product_metadata produces・staging transforms_to 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§9.2 エンティティ属性・§9.3 疑似差分取得構造・raw_product_object 分離との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§6 No.19 分類・用途・Raw Metadata 補足方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/状態遷移設計書.md"
      required: true
      purpose: "§6.3 import_status 遷移・Raw レスポンス単位状態管理方針"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "raw_import_status enum との整合"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "§8 Object Storage Key・§8.4 Raw Metadata 項目・Raw 保存方針の確認"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-BATCH-004・trace キー（api_call_log_id）の確認"
    - path: "docs/05_アプリケーション設計/アプリ/batch/バッチ設計方針書.md"
      required: true
      purpose: "BATCH-001〜005 Raw 保存・raw_product_metadata 作成フローの確認"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: true
      purpose: "raw_product_metadata 追跡・Retention 方針の確認"
    - path: "docs/06_実装設計/database/item_テーブル定義書.md"
      required: true
      purpose: "Batch 系テーブル定義書章構成・Staging→Item 経路参考（#495 merge 済み正本）"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
