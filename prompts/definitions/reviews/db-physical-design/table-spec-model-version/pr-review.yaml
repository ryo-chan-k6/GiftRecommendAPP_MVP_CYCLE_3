schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-model-version-pr"
  title: "model_version テーブル定義書 PRレビュー"
  summary: "model_version テーブル定義書 Task の PR を AI Review する。物理ER・論理ER・テーブル一覧との整合と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-450-model-version-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 450
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-model-version.yaml"
  source_branch: "docs/task-450-model-version-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-model-version.yaml"
    required: true
  issue:
    number: 450
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/model_version_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/relationship_master_テーブル定義書.md"
      required: true
      purpose: "Master / Config 系テーブル定義書との一貫性確認"
    - path: "docs/06_実装設計/database/occasion_master_テーブル定義書.md"
      required: true
      purpose: "Master / Config 系テーブル定義書との一貫性確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "テーブル分類・FK・Index 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "エンティティ属性（§11.1）との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§9 Master / Config系との整合"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §11.1 の属性と矛盾しないか"
    - "semantic_config_version との責務分離が明記されているか"
    - "model_type / is_current の version 管理方針が明記されているか"
    - "relationship_master / occasion_master テーブル定義書と Master / Config 系方針が一貫しているか"
  db:
    - "PK / Index / CHECK / partial unique が DDL Task へ展開できる粒度か"
    - "recommendation_run への LOGICAL FK 方針が明記されているか"
    - "item_embedding への ON FK 方針が明記されているか"
    - "Master / Config 系の保持・削除方針が妥当か"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "model_type 許容値と is_current のスコープ（model_type 単位か全体か）"
  - "recommendation_run への物理 FK 要否（推奨: MVP は LOGICAL のまま）"
  - "item_embedding への物理 FK ON 方針"

risk_points:
  - "model_type enum の YAML 正本化タイミング（enum Task へ引き継ぎ）"
  - "evaluation_run.model_version_id への FK 方針（後続 Evaluation 系 Task との一貫性）"
  - "batch 設計書の embedding_model_version_id 表記と model_version_id の用語整合"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-model-version.yaml"
  - "先行 Task: #440 / PR #441（enum 定義）、#442 / PR #443（relationship_master）、#445 / PR #448（occasion_master）"
