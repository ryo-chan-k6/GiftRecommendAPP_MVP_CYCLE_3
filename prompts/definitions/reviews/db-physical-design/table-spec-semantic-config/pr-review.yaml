schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-semantic-config-pr"
  title: "semantic_config テーブル定義書 PRレビュー"
  summary: "semantic_config テーブル定義書 Task の PR を AI Review する。物理ER §8・§9・論理ER §11.1・テーブル一覧 §8・API-PUB-007 との整合と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-462-semantic-config-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 462
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-semantic-config.yaml"
  source_branch: "docs/task-462-semantic-config-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-semantic-config.yaml"
    required: true
  issue:
    number: 462
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/semantic_config_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/relationship_master_テーブル定義書.md"
      required: true
      purpose: "Master / Config 系テーブル定義書との一貫性確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§8 Semantic/Feature定義系・§9 FK との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§10.2 / §11.1 エンティティ属性との整合"
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: true
      purpose: "Feature 8 軸参照（子テーブル責務との分離）"
    - path: "docs/06_実装設計/api/API-PUB-007_Semantic設定取得API契約仕様書.md"
      required: true
      purpose: "configName 表面公開と内部 Config 非公開の整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§8 Semantic / Feature定義系との整合"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §11.1 の属性（semantic_config_id / config_name / config_description / is_active / created_at）と矛盾しないか"
    - "relationship_master テーブル定義書と章構成・MVP 方針が一貫しているか"
    - "Public API 非公開（内部 Config）と API-PUB-007 configName 表面公開の境界が明記されているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "semantic_config_version.semantic_config_id への物理 FK（ON）被参照方針が明記されているか"
    - "Config 系の保持・削除方針（物理 DELETE 禁止・is_active 無効化）が妥当か"
    - "is_active と semantic_config_version.is_current の解決階層が §17 に整理されているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "is_active（Config 系列）と semantic_config_version.is_current（Version 現行）の解決階層"
  - "MVP で許容する config_name 系列数（単一系列 / 複数系列）"
  - "API-PUB-007 configName 表面公開と内部 Config 非公開方針の整合"
  - "config_description の MVP 必須性と CHECK 上限"
  - "親 DELETE と FK RESTRICT（version 履歴保持）"

risk_points:
  - "semantic_config_version テーブル定義 Task への FK / Index 引き継ぎ"
  - "reco Config Resolver が is_active / is_current の両方を解釈する必要"
  - "API-PUB-007 が configName のみ表面公開する一方、semantic_config_id は非公開という二層構造"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-semantic-config.yaml"
  - "先行 Task: #440 / PR #441（enum 定義）、#442 / PR #443（relationship_master）、#445 / PR #448（occasion_master）"
  - "Batch2-1: Semantic / Feature定義系テーブル定義の先頭 Task"
