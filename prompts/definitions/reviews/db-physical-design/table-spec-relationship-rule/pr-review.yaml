schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-relationship-rule-pr"
  title: "relationship_rule テーブル定義書 PRレビュー"
  summary: "relationship_rule テーブル定義書 Task の PR を AI Review する。物理ER・論理ER・Featureルール定義書・API-PUB-008 との整合と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-473-relationship-rule-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 473
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-relationship-rule.yaml"
  source_branch: "docs/task-473-relationship-rule-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-relationship-rule.yaml"
    required: true
  issue:
    number: 473
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/relationship_rule_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§8–§11 整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§10.2 整合"
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: true
      purpose: "§17.1 / §20.1"
    - path: "docs/06_実装設計/api/API-PUB-008_Featureルール取得API契約仕様書.md"
      required: true
      purpose: "baseValueRules（ruleType: relationship）マッピング確認"
    - path: "docs/06_実装設計/database/relationship_master_テーブル定義書.md"
      required: true
      purpose: "relationship_code 参照整合"
    - path: "docs/06_実装設計/database/feature_definition_テーブル定義書.md"
      required: true
      purpose: "feature_code 参照整合"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "Featureルール定義書 §17.1 の論理項目が物理カラムとして整理されているか"
    - "API-PUB-008 baseValueRules（relationshipCode / featureCode / featureBaseValue）マッピングが明記されているか"
    - "MVP 12 分類 × 8 軸の行数方針（version 単位）が明記されているか"
  db:
    - "PK / Index / CHECK / UNIQUE が DDL Task へ展開できる粒度か"
    - "semantic_config_version_id への ON FK 方針が明記されているか"
    - "relationship_master.relationship_code / feature_definition.feature_code への LOGICAL 参照 + CHECK 方針が明記されているか"
    - "feature_base_value の 0.0〜1.0 範囲 CHECK が明記されているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "（決定済み）MVP 初期 feature_base_value: Featureルール定義書 §6.2 を seed 正本 — テーブル定義書 §17.1 No.1"
  - "（決定済み）relationship_master への物理 FK 非採用（LOGICAL + CHECK）— §17.1 No.2"
  - "（決定済み）version 内 UNIQUE（relationship_code + feature_code）— §17.1 No.3"
  - "（決定済み）occasion_rule への Rule 群一貫性引き継ぎ — §17.1 No.4"
  - "（決定済み）96 行不足時の API 部分返却 — §17.1 No.5"

risk_points:
  - "Featureルール定義書の Relationship 基準値と seed 内容の乖離（seed Task へ引き継ぎ）"
  - "API-PUB-008 OpenAPI 追随は #469 委譲のため、契約 docs と DB 列の一時的非同期"
  - "Wave2 推奨着手順（#471 / #472）未 merge 時の前提差分"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-relationship-rule.yaml"
  - "Wave2 No.4: relationship_rule"
  - "先行 Task: #462 / #463（Wave1）、#442（relationship_master）、#470（feature_definition）"
  - "Human Review（Issue #473）: §17.1 No.1〜No.5 決定済み（2026-06-11）"
