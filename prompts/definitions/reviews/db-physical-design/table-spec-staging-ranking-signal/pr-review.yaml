  summary: "staging_ranking_signal テーブル定義書 Task の PR を AI Review する。物理ER・論理ER §9.2・テーブル一覧 §6 No.22・外部商品データ連携設計書・raw_product_metadata / ranking_snapshot / staging_item / item_popularity_signal テーブル定義書との整合、transforms_to / 昇格経路 / Staging 系 FK 方針と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-524-staging-ranking-signal-table-spec"
