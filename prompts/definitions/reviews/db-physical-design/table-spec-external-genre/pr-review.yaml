schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-external-genre-pr"
  title: "external_genre テーブル定義書 PRレビュー"
  summary: "external_genre テーブル定義書 Task の PR を AI Review する。物理ER Item系・論理ER §8.2・外部商品データ連携設計書 §12・Batch Upsert 方針との整合と table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-494-external-genre-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 494
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-external-genre.yaml"
  source_branch: "docs/task-494-external-genre-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-external-genre.yaml"
    required: true
  issue:
    number: 494
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/external_genre_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "Item系・外部商品データ連携系・FK 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§8.2 商品系エンティティ属性との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§5 No.13 External Genre・§5 補足（ジャンル差分反映）・§6 No.23 staging_genre との整合"
    - path: "docs/05_アプリケーション設計/アプリ/外部商品データ連携設計書.md"
      required: true
      purpose: "§12 ジャンルデータ連携・楽天API マッピング・Upsert 方針"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "source 等 enum 参照との整合"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（他テーブル / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "論理ER §8.2 の属性（external_genre_id / source / genre_name / parent_external_genre_id / genre_level / is_leaf / fetched_at）と矛盾しないか"
    - "テーブル一覧 §5 補足（ジャンルは差分反映対象・内部外部参照マスタ）と更新方針が一致しているか"
    - "外部商品データ連携設計書 §12.1 ジャンル項目（genreId / jaName / level 等）のマッピングが整理されているか"
    - "外部商品データ連携設計書 §12.1 と論理ER の列名差分（parent_genre_id vs parent_external_genre_id 等）が物理 DDL 方針として解消されているか"
  db:
    - "PK / Unique / Index / CHECK が DDL Task へ展開できる粒度か"
    - "parent_external_genre_id の self-reference 物理 FK 方針が明記されているか（物理ER §8 FK 表未掲載分の確定）"
    - "staging_genre → external_genre Upsert 方針（BATCH-001 / BATCH-005 連携）が明記されているか"
    - "item.external_genre_id / item_popularity_signal.external_genre_id との LOGICAL 参照方針が明記されているか"
    - "source + external_genre_id の一意性・Upsert キー方針が妥当か"
    - "genre_level / is_leaf の整合ルール（末端判定・階層上限）が明記されているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "parent_external_genre_id の self-reference 物理 FK 採否（ON / OFF / LOGICAL）"
  - "MVP で保持する genre_level の上限"
  - "外部商品データ連携設計書 §12.1 の is_active / source_system を物理 DDL に採用するか"
  - "root ジャンル（genreId=0）の保持方針"

risk_points:
  - "staging_genre テーブル定義 Task への Upsert キー・列マッピング引き継ぎ"
  - "item / item_popularity_signal テーブル定義 Task への LOGICAL FK 引き継ぎ"
  - "fetch_cursor.target_external_genre_id 参照の DDL Task への引き継ぎ"
  - "外部商品データ連携設計書 §12.1 と論理ER §8.2 の属性差分"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-external-genre.yaml"
  - "Batch R01 No.2: external_genre（#493 normalization_rule / PR #498 merge 済み・並列可）"
  - "Issue #494 / Branch docs/task-494-external-genre-table-spec"
  - "先行 Epic: #435 / docs/epic-435-db-physical-design（262ac10 同期済み）"
