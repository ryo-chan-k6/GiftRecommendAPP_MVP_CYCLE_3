schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-ddl-d11-pr"
  title: "d11 Metric系DDL PRレビュー"
  summary: "D11 Metric 系 DDL Task の PR を AI Review する。`db/ddl/d11_metric.sql` が 4 テーブル定義書・物理 ER・マイグレーション方針書と整合しているか、D01〜D10 適用後に実行可能か、D12 以降の前提として妥当かを確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "chore/task-608-d11-ddl"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: null
  issue: 608
  task_definition: "prompts/definitions/tasks/db-physical-design/ddl-d11.yaml"
  source_branch: "chore/task-608-d11-ddl"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: true
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/ddl-d11.yaml"
    required: true
  issue:
    number: 608
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/DDLバッチ分割表.md"
      required: true
      purpose: "D11 scope・4 テーブル一覧との突合"
    - path: "docs/06_実装設計/database/マイグレーション方針書.md"
      required: true
      purpose: "§8.1 ファイル命名・バッチ順序"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "§10 Index・§11 CHECK・§15 適用順序・§17 MVP 対象との整合"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "enum 列型参照（型定義は D01 正本）"
    - path: "docs/06_実装設計/database/コード定義書.md"
      required: true
      purpose: "コード列・CHECK 値との突合"
    - path: "db/ddl/d01_extensions_and_enums.sql"
      required: true
      purpose: "先行バッチ・enum 型名の参照"
    - path: "db/ddl/d02_semantic_feature_definitions.sql"
      required: true
      purpose: "先行バッチ DDL（`semantic_config_version` / `feature_definition` 参照）"
    - path: "db/ddl/d03_master_config.sql"
      required: true
      purpose: "先行バッチ DDL（`feature_normalization_version` / `ranking_config` 参照）"
    - path: "db/ddl/d06_item_derived.sql"
      required: true
      purpose: "先行バッチ DDL（`item_feature` / `item_meaning` 集計入力参照）"
    - path: "db/ddl/d07_online_recommendation.sql"
      required: true
      purpose: "先行バッチ DDL（`recommendation_run` / `recommendation_result` 参照）"
    - path: "db/ddl/d08_user_meaning.sql"
      required: true
      purpose: "先行バッチ DDL（`user_meaning` 集計入力参照）"
    - path: "db/ddl/d10_log_observability.sql"
      required: true
      purpose: "先行バッチ DDL（`batch_run_log` LOGICAL 参照）"
    - path: "docs/06_実装設計/database/feature_distribution_metric_テーブル定義書.md"
      required: true
      purpose: "D11-1 突合（MVP feature_code CHECK・value_layer / aggregation_scope CHECK・部分 UNIQUE 含む）"
    - path: "docs/06_実装設計/database/meaning_distribution_metric_テーブル定義書.md"
      required: true
      purpose: "D11-2 突合（entity_type / value_layer / lambda_ctx CHECK・normalization version 必須 CHECK 含む）"
    - path: "docs/06_実装設計/database/normalization_distribution_metric_テーブル定義書.md"
      required: true
      purpose: "D11-3 突合（raw / sigmoid value_layer CHECK・z_score MVP 除外含む）"
    - path: "docs/06_実装設計/database/reco_score_distribution_metric_テーブル定義書.md"
      required: true
      purpose: "D11-4 突合（MVP partial・score_type / aggregation_scope CHECK・batch_run_id NULL 固定 CHECK 含む）"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（D12 / supabase migrations / packages / apps / docs 変更）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  db:
    - "D11 対象 4 テーブルが DDLバッチ分割表 §15 と一致しているか"
    - "ファイル名が `d11_metric.sql`（マイグレーション方針書 §8.1 / change_id `d11_metric`）であるか"
    - "CREATE 順序が `feature_distribution_metric` → `meaning_distribution_metric` → `normalization_distribution_metric` → `reco_score_distribution_metric` と整合しているか"
    - "各テーブルの列・型・PK / Index / CHECK / UNIQUE がテーブル定義書と一致しているか"
    - "`feature_distribution_metric` の MVP `feature_code` CHECK・`value_layer` / `aggregation_scope` CHECK・batch_run 必須 CHECK・部分 UNIQUE が定義書どおりであるか"
    - "`feature_distribution_metric` の normalized 層 `feature_normalization_version_id` 必須 CHECK が定義書どおりであるか"
    - "`meaning_distribution_metric` の entity_type / value_layer / lambda_ctx 組み合わせ CHECK が定義書どおりであるか"
    - "`meaning_distribution_metric` の `feature_normalization_version_id` NOT NULL CHECK が定義書どおりであるか"
    - "`normalization_distribution_metric` の MVP `value_layer`（raw / sigmoid のみ）CHECK が定義書どおりであるか"
    - "`normalization_distribution_metric` の `feature_normalization_version_id` NOT NULL CHECK が定義書どおりであるか"
    - "`reco_score_distribution_metric` の MVP partial `score_type` / `aggregation_scope=run` CHECK が定義書どおりであるか"
    - "`reco_score_distribution_metric` の run / result 必須 CHECK・`batch_run_id IS NULL` MVP CHECK・`sample_count >= 1` CHECK が定義書どおりであるか"
    - "Metric 参照先への物理 FK が付与されていないか"
    - "D01〜D10 適用後に本ファイルが実行可能か"
    - "D12（#609）以降 Task の前提として妥当か"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_check:
  use_task_acceptance_criteria: true
  additional_criteria:
    - "PR本文に実施済み検証と未実施テストの理由が記載されている"
    - "Human Review で確認してほしい事項が明記されている"
    - "AI Review 結果を PR コメントに記録できる形式になっている"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "修正必須事項がない"
      - "scope 外変更がない"
      - "Human Review で確認すべき事項が整理されている"
  request_changes:
    conditions:
      - "同一 Branch で修正可能な DDL 不備がある"
      - "PR 本文に必要情報が不足している"
      - "検証結果または未実施理由が不足している"
  needs_human_decision:
    conditions:
      - "Metric LOGICAL FK 方針の確認が必要"
      - "normalized 層 normalization version 必須 CHECK 方針の確認が必要"
      - "meaning lambda_ctx user-only CHECK 方針の確認が必要"
      - "normalization z_score MVP 除外方針の確認が必要"
      - "reco_score MVP partial（batch_run_id NULL 固定・score_type 限定）方針の確認が必要"
  split_required:
    conditions:
      - "D12 遅延 FK / 索引追加が混在している"
      - "D10 Log 系テーブル CREATE が混在している"
      - "supabase migration 変更が混在している"
      - "別 Issue 化すべき設計変更が混在している"
  blocked:
    conditions:
      - "PR diff を確認できない"
      - "Task Definition が存在しない"
      - "Issue と PR の対応が不明"
      - "secret や .env 実値の混入が疑われる"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false
  ai_logs:
    required: false
    path: null

project:
  fields:
    phase: "06_実装設計"
    status: "AI Review"
    priority: "high"

issue:
  unit: "task"
  type: "chore"
  area: "db"

dependencies:
  issues:
    - 608
  tasks:
    - "prompts/definitions/tasks/db-physical-design/ddl-d11.yaml"
  blocking: false

parallel_control:
  depends_on: []
  blocks: []
  exclusive_files: []
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: true

test_policy:
  required:
    - "AI Review"
    - "PR diff check"
    - "db schema review"
    - "secret check"
  commands: []
  manual_checks:
    - "Task Definition の acceptance_criteria を満たしているか確認する"
    - "PR 本文に検証結果・未実施理由・Human Review 観点が記載されているか確認する"
  not_required:
    - "unit test"
  skip_reason:
    "unit test": "Review Definition はレビュー条件であり、実装テストを直接実行する作業定義ではないため"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: false
  reason: "通常 PR レビューのため、レビュー結果は PR コメントを正本とする"

risk_points:
  - "4 テーブル横断での列名・型・制約の取りこぼし"
  - "部分 UNIQUE（NULLS NOT DISTINCT）の表現漏れ"
  - "feature / normalization MVP feature_code CHECK の取りこぼし"
  - "meaning lambda_ctx + item 組み合わせ CHECK の取りこぼし"
  - "normalization z_score MVP 除外 CHECK の取りこぼし"
  - "reco_score MVP partial CHECK（batch_run_id NULL 固定・sample_count >= 1）の取りこぼし"
  - "Metric 参照先への誤った物理 FK 付与"
  - "D12（#609）以降 Task との適用順序依存"

human_decision_points:
  - "Metric 参照先（batch_run_log / semantic_config_version / feature_definition / item_feature / item_meaning / user_meaning / feature_normalization_version / recommendation_run / recommendation_result / ranking_config）の LOGICAL FK 方針"
  - "`feature_distribution_metric` normalized 層 `feature_normalization_version_id` 必須 CHECK"
  - "`meaning_distribution_metric` lambda_ctx user-only CHECK と normalization version 必須"
  - "`normalization_distribution_metric` MVP `value_layer`（raw / sigmoid のみ）方針"
  - "`reco_score_distribution_metric` MVP partial（`batch_run_id` NULL 固定・`score_type` 限定・`sample_count >= 1`）"
  - "retention 詳細は ⑥ Task 委譲（本 DDL は列・索引のみ）"

stop_conditions:
  - "PR が存在しない場合"
  - "Task Definition が存在しない場合"
  - "Issue と PR の対応が不明な場合"
  - "diff を確認できない場合"
  - "D12 遅延 FK / 索引追加が混在している場合"
  - "D10 Log 系テーブル CREATE が混在している場合"
  - "supabase migration 変更が混在している場合"
  - "secret や .env 実値の混入が疑われる場合"
  - "Human Review を省略する前提になっている場合"
  - "AI が merge 判断を行う必要がある場合"

notes:
  - "Batch D11 / change_id: `d11_metric`"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/ddl-d11.yaml"
  - "Issue #608 / Branch chore/task-608-d11-ddl"
  - "MVP○: 3 テーブル。MVP△: `reco_score_distribution_metric`（partial）"
  - "先行 merge 済み前提: D01（#611 / PR #614）〜 D10（#607 / PR #623）、#440（enum）、#587（コード定義）、#589（マイグレーション方針）"
  - "PR 番号は `/create-pr` 後に Review Definition の `target.pr` / `input.pr.number` を更新する"
