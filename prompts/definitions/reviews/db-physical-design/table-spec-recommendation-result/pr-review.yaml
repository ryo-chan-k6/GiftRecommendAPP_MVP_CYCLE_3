schema_version: "1.0"
definition_type: "review"

review:
  id: "review-db-physical-design-table-spec-recommendation-result-pr"
  title: "recommendation_result テーブル定義書 PRレビュー"
  summary: "recommendation_result テーブル定義書 Task の PR を AI Review する。物理ER・論理ER §14.1・RecommendationResult定義書・enum定義書・recommendation_request 定義書・API-PUB-002 / API-INT-002 との整合、Run / Request / Result Item 関係・result_status 方針・table-spec テンプレ準拠を確認する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "docs/task-544-recommendation-result-table-spec"
  base: "docs/epic-435-db-physical-design"
  target: "docs/epic-435-db-physical-design"
  worktree_required: true

target:
  pr: 549
  issue: 544
  task_definition: "prompts/definitions/tasks/db-physical-design/table-spec-recommendation-result.yaml"
  source_branch: "docs/task-544-recommendation-result-table-spec"
  target_branch: "docs/epic-435-db-physical-design"
  parent_epic_issue: "[Epic]db-physical-design:DB物理設計・構築"
  parent_epic_branch: "docs/epic-435-db-physical-design"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/db-physical-design/table-spec-recommendation-result.yaml"
    required: true
  issue:
    number: 544
    required: true
  pr:
    number: 549
    required: true
  diff:
    required: true
    compare_with: "docs/epic-435-db-physical-design"
  docs:
    - path: "docs/06_実装設計/database/recommendation_result_テーブル定義書.md"
      required: true
      purpose: "作成成果物の内容確認"
    - path: "docs/06_実装設計/database/物理ER.md"
      required: true
      purpose: "Online推薦系・produces / has LOGICAL/物理 FK・§10 / §11 uq_result_per_run 方針との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/論理ER.md"
      required: true
      purpose: "§3 属性・§14.1 Request → Run → Result・§14.2 Result → Item との整合"
    - path: "docs/05_アプリケーション設計/アプリ/database/テーブル一覧.md"
      required: true
      purpose: "§3 No.3 分類・用途・0件結果補足方針との整合"
    - path: "docs/04_ドメインモデル設計/RecommendationResult定義書.md"
      required: true
      purpose: "§10.1 DB 項目・§9 API 返却・生成後不変方針との整合"
    - path: "docs/06_実装設計/database/enum定義書.md"
      required: true
      purpose: "recommendation_result_status / result_status との整合"
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
      required: true
      purpose: "recommendationResultId マッピング確認"
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API契約仕様書.md"
      required: true
      purpose: "Internal recommendationResultId マッピング確認"
    - path: "docs/05_アプリケーション設計/アプリ/インターフェース一覧.md"
      required: true
      purpose: "IF-DB-RECO-007 の確認"
    - path: "docs/05_アプリケーション設計/アプリ/状態遷移設計書.md"
      required: true
      purpose: "§5.2 result_status 遷移・生成後不変方針の確認"
    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: true
      purpose: "user_id なし・Request 経由追跡方針の確認"
    - path: "docs/05_アプリケーション設計/アプリ/ログ・Observability設計書.md"
      required: true
      purpose: "recommendation_result_id trace キー・Retention 候補の確認"
    - path: "docs/06_実装設計/database/recommendation_request_テーブル定義書.md"
      required: true
      purpose: "has 関係（recommendation_request_id 物理 FK）との双方向整合"
    - path: "docs/06_実装設計/database/recommendation_run_テーブル定義書.md"
      required: true
      purpose: "produces 関係・uq_result_per_run・version 3 列正本・Run 状態連携との双方向整合（merge 済み前提）"
    - path: "docs/06_実装設計/database/ranking_config_テーブル定義書.md"
      required: true
      purpose: "ranking_config_id LOGICAL 参照との整合"
    - path: "packages/code-definitions/state/recommendation_result_status.yaml"
      required: true
      purpose: "result_status packages 正本との整合"
    - path: "prompts/templates/docs/table-spec.md"
      required: true
      purpose: "テンプレート章構成との整合"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition の scope を満たしているか"
    - "out_of_scope（result_item / reason / feedback / run 再作成 / DDL / migration / apps / OpenAPI）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "Task PR target が親 Epic Branch であるか"
  docs:
    - "table-spec.md テンプレの主要章が充足しているか"
    - "Online推薦フロー（Request → Run → Result → Result Item）の Result ヘッダとして明記されているか"
    - "論理ER §3 の属性と矛盾しないか（論理ER / ドメイン定義書との差分は明示されているか）"
    - "テーブル一覧 §3 No.3 の分類・用途と一致しているか"
    - "RecommendationResult定義書 §10.1 の項目・生成後不変方針が反映されているか"
    - "recommendation_request / recommendation_run 定義書と章構成・MVP 方針が双方向整合しているか"
  db:
    - "PK / Index / unique / CHECK が DDL Task へ展開できる粒度か"
    - "recommendation_run → recommendation_result produces（1:0..1）関係が明記されているか"
    - "recommendation_request → recommendation_result has（1:N）関係が明記されているか"
    - "recommendation_result → recommendation_result_item contains（1:N）関係が明記されているか"
    - "uq_result_per_run（recommendation_run_id unique）が明記されているか"
    - "result_status と enum定義書 §6.2 / packages 正本が一致しているか"
    - "0件結果が result_status=empty の正常扱いであることが明記されているか"
    - "生成後原則 UPDATE しない方針（状態遷移設計書 §5.2.3）が明記されているか"
    - "Run 由来 version 3 列（NOT NULL）と ranking_config_id 物理名が Run / ranking_config 定義書と一致しているか"
    - "PUB / INT / DB の resultStatus 層間マッピングと INT 0 件不一致の推奨修正が §5.6 に整理されているか"
    - "Result INSERT 後の Run run_status=succeeded 連携が明記されているか"
  security:
    - "result_payload / debug_payload に secret・個人情報過剰保持を避ける方針が明記されているか"
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points: []

human_review_decisions:
  - id: 1
    topic: "result_status 物理列"
    decision: "MVP 物理列あり。値は generated / empty / failed。生成後原則 UPDATE しない（終端状態）"
  - id: 2
    topic: "uq_result_per_run"
    decision: "recommendation_run_id に unique 制約（1 Run 1 Result）。物理ER §11 uq_result_per_run に整合"
  - id: 3
    topic: "generated_at 物理列名"
    decision: "論理ER generated_at と同一意味。物理名は generated_at を優先（created_at 併記は DDL Task で最終判断）"
  - id: 4
    topic: "Online推薦コア Retention"
    decision: "MVP DELETE なし。具体保持期間は Phase2 ⑥ データ保持方針 Task で確定（Observability 180〜365日候補を注記）"
  - id: 5
    topic: "version 列の保持先（Result vs Run）"
    decision: "Run 側が実行正本（3 列 NOT NULL）。Result は INSERT 時に同名 3 列をコピー + reason_template_version_id のみ Result 追加"
  - id: 6
    topic: "0件結果の扱い"
    decision: "error ではなく result_status=empty の正常 Result として保存"
  - id: 7
    topic: "API 層 resultStatus マッピング"
    decision: "3 層モデル（DB / INT / PUB）。0 件は DB・PUB・INT すべて empty に統一。INT-002 の 0 件 completed は #469 で empty に修正推奨"

risk_points:
  - "RecommendationResult定義書 §10.1 の項目数と論理ER §3 簡略属性の差分整理"
  - "RecommendationResult定義書の ranking_config_version_id と DB ranking_config_id の命名差分"
  - "trace_id が Request 由来であること（Run 本体列なし）の明記"
  - "API-INT-002 0 件 resultStatus=completed と DB/PUB empty の不一致（#469 で修正推奨。§5.6.4）"

notes:
  - "Batch R06 No.2: recommendation_result"
  - "対応 Task Definition: prompts/definitions/tasks/db-physical-design/table-spec-recommendation-result.yaml"
  - "Issue #544 / Branch docs/task-544-recommendation-result-table-spec"
  - "先行 merge 済み前提: #537 / PR #542（recommendation_request）、#543 / PR #548（recommendation_run）"
  - "Human Review 決定事項: human_review_decisions 参照"
  - "PR 番号は /create-pr 後に本 Review Definition の target.pr / input.pr.number を更新する"
