schema_version: "1.0"
definition_type: "review"

review:
  id: "review-contract-impl-command-update-pr"
  title: "Command修正（Contract Gate反映）PRレビュー"
  summary: "Contract/Implementation 分離と Contract Gate を Command に反映した PR の AI Review"
  type: "task_pr_review"
  status: "ready"

target:
  pr: 0
  issue: 314
  task_definition: "prompts/definitions/tasks/contract-impl-task-separation/command-update.yaml"
  source_branch: "refactor/task-314-command-update"
  target_branch: "refactor/epic-300-contract-impl-task-separation"

review_scope:
  docs: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/contract-impl-task-separation/command-update.yaml"
    required: true
  issue:
    number: 314
    required: true

review_points:
  common:
    - "Task Definition scope を満たしているか"
    - "Contract Gate運用設計書と Command 手順が整合しているか"
    - "Related to #314 が PR 本文にあるか"
    - "prompts/templates/issue/** / prompts/templates/pr/** を変更していないか"
  docs:
    - "work-issue の Gate 停止条件が設計書 §4 と一致しているか"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"

status_policy:
  on_approve: "Human Review"
  on_request_changes: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"

issue:
  unit: "task"
  type: "refactor"
  area: "docs"
