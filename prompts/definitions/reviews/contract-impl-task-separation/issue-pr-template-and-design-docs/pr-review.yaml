schema_version: "1.0"
definition_type: "review"

review:
  id: "review-contract-impl-issue-pr-template-pr"
  title: "Issue/PRテンプレ・設計書反映PRレビュー"
  summary: "Contract/Implementation 分離と Contract Gate を Issue/PR テンプレ・設計書に反映した PR の AI Review"
  type: "task_pr_review"
  status: "ready"

target:
  pr: 319
  issue: 318
  task_definition: "prompts/definitions/tasks/contract-impl-task-separation/issue-pr-template-and-design-docs.yaml"
  source_branch: "refactor/task-318-issue-pr-template-and-design-docs"
  target_branch: "refactor/epic-300-contract-impl-task-separation"

review_scope:
  docs: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/contract-impl-task-separation/issue-pr-template-and-design-docs.yaml"
    required: true
  issue:
    number: 318
    required: true

review_points:
  common:
    - "Task Definition scope を満たしているか"
    - "Command（Task4）とテンプレートの Gate 記載が整合しているか"
    - "Related to #318 が PR 本文にあるか"
    - ".cursor/commands/** を変更していないか"
  docs:
    - "api-contract-spec / api-implementation-spec の使い分けが PR テンプレに反映されているか"
    - "contract-task.yml の OpenAPI 正本パスが packages/contracts/ であるか"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"

status_policy:
  on_approve: "Human Review"
  on_request_changes: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"

issue:
  unit: "task"
  type: "refactor"
  area: "docs"
