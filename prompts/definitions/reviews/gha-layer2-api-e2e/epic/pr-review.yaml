schema_version: "1.0"
definition_type: "review"

review:
  id: "review-gha-layer2-api-e2e-epic-pr"
  title: "Layer2 API E2E本格化 Epic PRレビュー"
  summary: "Epic #1426（gha-test-environment:Layer2 API E2E本格化）の develop 向け統合 PR を AI Review する。"
  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue:
    number: 1426
  task_definition: "prompts/definitions/epics/gha-layer2-api-e2e/epic.yaml"
  source_branch: "test/epic-1426-gha-layer2-api-e2e"
  target_branch: "develop"
  parent_epic_issue: "[Epic]gha-test-environment:Layer2 API E2E本格化"
  parent_epic_branch: "test/epic-1426-gha-layer2-api-e2e"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: true
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/epics/gha-layer2-api-e2e/epic.yaml"
    required: true
  issue:
    number: 1426
    required: true
  pr:
    number: null
    required: false
  diff:
    required: true
    compare_with: "develop"
  docs:
    - path: "docs/05_アプリケーション設計/テスト/テスト定義書.md"
      required: true
      purpose: "§9.5.3 API E2E 条件"
    - path: "docs/05_アプリケーション設計/テスト/Layer2 Agent dispatch手順書.md"
      required: true
      purpose: "skip_api_e2e 既定と dispatch 例"
    - path: "docs/05_アプリケーション設計/テスト/テスト環境設計書.md"
      required: true
      purpose: "Layer2 system 環境の既定"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Epic scope / epic_scope.allowed_paths 内に差分が収まっているか"
    - "子 Task #1427 / PR #1429 が親 Epic Branch 経由で統合されているか"
    - "PR target が develop であるか"
    - "PR 本文が Closes #1426 と整合するか（Epic PR）"
  docs:
    - "skip_api_e2e=false 既定が docs と workflow で一致するか"
    - "secret / .env 実値を含んでいないか"
  test:
    - "GHA test-system skip_api_e2e=false の success 証跡があるか"
  epic_scope:
    - "forbidden_paths（apps/batch / openapi / migrations）への意図しない変更がないか（develop merge 由来は除外）"

acceptance_check:
  use_task_acceptance_criteria: false
  additional_criteria:
    - "実行 Task が Epic Branch に merge 済みである"
    - "Human Review 観点が PR 本文に整理されている"
    - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"

result_policy:
  approve_for_human_review:
    conditions:
      - "証跡が揃っている"
      - "epic_scope 外の意図しない差分がない"
      - "修正必須事項がない"
  request_changes:
    conditions:
      - "同一 Branch で修正可能な不備がある"
      - "PR 本文の不足"
  needs_human_decision:
    conditions:
      - "検証未達を許容して develop merge してよいか判断が必要"
  blocked:
    conditions:
      - "必須 Review Definition / Epic Definition が不足している"
      - "実行 Task が親 Epic に未 merge"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "Epic PR の AI Review は PR コメントを正とする"

notes:
  - "Epic PR 作成後に target.pr / input.pr.number を実番号へ更新する"
  - "/review-pr @prompts/definitions/reviews/gha-layer2-api-e2e/epic/pr-review.yaml"
  - "前提: 子 Task PR #1429 が Epic Branch に MERGED、GHA run 29587042736 success"
