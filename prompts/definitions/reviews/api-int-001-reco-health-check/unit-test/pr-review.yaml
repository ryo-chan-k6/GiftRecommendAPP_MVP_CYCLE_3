schema_version: "1.0"
definition_type: "review"

review:
  id: "review-api-int-001-reco-health-check-unit-test-pr"
  title: "API-INT-001 Recoヘルスチェック単体テスト PRレビュー"
  summary: "API-INT-001 reco health 単体テスト Task（unit-test.yaml）の PR を AI Review する"
  type: "task_pr_review"
  status: "draft"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: 1159
  task_definition: "prompts/definitions/tasks/api-int-001-reco-health-check/unit-test.yaml"
  source_branch: "test/task-1159-api-int-001-reco-health-check-unit-test"
  target_branch: "feature/epic-391-int-001-reco-health-check"
  parent_epic_issue: "[Epic]API-INT-001:Recoヘルスチェック"
  parent_epic_branch: "feature/epic-391-int-001-reco-health-check"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: false
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/api-int-001-reco-health-check/unit-test.yaml"
    required: true
  issue:
    number: 1159
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-391-int-001-reco-health-check"
  docs:
    - path: "docs/06_実装設計/api/API-INT-001_RecoヘルスチェックAPI契約仕様書.md"
      required: true
      purpose: "§12 契約面テスト観点"
    - path: "docs/06_実装設計/api/API-INT-001_RecoヘルスチェックAPI実装仕様書.md"
      required: true
      purpose: "§10 実装テスト観点"
  files:
    - path: "apps/reco/tests/unit/api/test_health.py"
      required: true
  test_results:
    required: true
    source: "pr_body"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Task Definition（unit-test.yaml）の scope を満たしているか"
    - "acceptance_criteria を満たしているか"
    - "Task Branch から develop へ直接 PR していないか"
  tests:
    - "実装仕様書 §10 unit 観点のカバレッジが過不足ないか"
    - "既存 health UT が維持されているか"
    - "本番 DB / secret に依存していないか"
  security:
    - "secret や .env 実値が含まれていないか"
  epic_scope:
    - "PR差分が親Epic epic_scope.allowed_paths 内に収まっているか"
    - "allowed_paths に tests が追記されているか"

acceptance_check:
  use_task_acceptance_criteria: true

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "scope 外変更がない"
  request_changes:
    conditions:
      - "テスト不足または失敗がある"
  needs_human_decision:
    conditions:
      - "Epic PR へ進む完了判定が必要"
  split_required:
    conditions:
      - "OpenAPI / generated / application 変更が混在している"
  blocked:
    conditions:
      - "PR diff を確認できない"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "AI Review"
    priority: "high"

issue:
  unit: "task"
  type: "test"
  area: "api"

notes:
  - "Issue / PR 確定後に target.issue / target.pr / input.issue.number / input.pr.number / source_branch を更新する"
  - "対応 Task Definition: prompts/definitions/tasks/api-int-001-reco-health-check/unit-test.yaml"
