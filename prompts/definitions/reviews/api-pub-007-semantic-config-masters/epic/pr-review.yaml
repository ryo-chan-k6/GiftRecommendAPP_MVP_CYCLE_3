schema_version: "1.0"
definition_type: "review"

review:
  id: "review-api-pub-007-semantic-config-masters-epic-pr"
  title: "API-PUB-007 Semantic設定取得 Epic PRレビュー"
  summary: "Epic #389（API-PUB-007 Semantic設定取得）の develop 向け統合 PR を AI Review する。Phase4b 縦串（実装仕様書 / apps/api 実装 / 単体テスト）の成果を横断確認する。契約仕様書・OpenAPI 断片は Phase1 で develop 反映済み。"
  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: 389
  task_definition: "prompts/definitions/epics/api-pub-007-semantic-config-masters/epic.yaml"
  source_branch: "feature/epic-389-pub-007-semantic-config-masters"
  target_branch: "develop"
  parent_epic_issue: "[Epic]API-PUB-007:Semantic設定取得"
  parent_epic_branch: "feature/epic-389-pub-007-semantic-config-masters"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    contract: "contract-ai"
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: true
  tests: true
  api_contract: true
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/epics/api-pub-007-semantic-config-masters/epic.yaml"
    required: true
  issue:
    number: 389
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "develop"
  docs:
    - path: "docs/06_実装設計/api/API-PUB-007_Semantic設定取得API実装仕様書.md"
      required: true
      purpose: "実装仕様書正本"
    - path: "docs/06_実装設計/api/API-PUB-007_Semantic設定取得API契約仕様書.md"
      required: true
      purpose: "契約外形（Phase1 済み）"

review_points:
  common:
    - "Epic Issue #389 と PR が対応しているか"
    - "PR target が develop か"
    - "Phase4b 縦串（実装仕様書 / 実装 / UT）が揃っているか"
  docs:
    - "実装仕様書が契約・§11 判断と整合しているか"
  source:
    - "GET /semantic-configs が masters Router に追加されているか"
    - "共通 Version Resolver / Concept・Feature 境界が仕様どおりか"
    - "PUB-005/006 既存ルートを壊していないか"
  tests:
    - "smoke / repository / unit が §9 fixture 観点をカバーしているか"
  api_contract:
    - "本差分で OpenAPI / generated 変更が混在していないか"
  security:
    - "secret / .env 実値が含まれていないか"
  epic_scope:
    - "差分が epic_scope.allowed_paths 内か"

acceptance_check:
  use_task_acceptance_criteria: false

result_policy:
  approve_for_human_review:
    conditions:
      - "縦串成果が揃っている"
      - "scope 外変更がない"
  request_changes:
    conditions:
      - "縦串不足または不備がある"
  needs_human_decision:
    conditions:
      - "develop merge 判断・競合解消方針が必要"
  split_required:
    conditions:
      - "OpenAPI / reco / web 画面変更が混在している"
  blocked:
    conditions:
      - "PR diff を確認できない"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "AI Review"
    priority: "high"

issue:
  unit: "epic"
  type: "feature"
  area: "api"

notes:
  - "PR 作成後に target.pr / input.pr.number を更新する"
  - "merge 判断は Human"
