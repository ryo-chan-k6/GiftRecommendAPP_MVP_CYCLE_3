review_points:
  - "Wave 1〜4（#1684 / #1688 / #1690 / #1692）が MERGED 済みで Epic 完了条件を満たすか"
  - "011/012 claim + item_feature UPSERT（IF-013）が本番 SQL か"
  - "013 claim + normalized UPDATE / item_meaning UPSERT（IF-014）が本番 SQL か"
  - "014/015 claim + item_embedding UPSERT（IF-VEC-001）が本番 SQL か"
  - "016 metrics UPSERT / 017 import_summary DO NOTHING が本番 SQL か"
  - "012/015 input UPSERT・LLM/Embedding API 本接続・SELECT（#1623）混入がないか"
  - "偽 op マーカーが残っていないか"
  - "実 DB 疎通が子 PR に記録されているか（secret なし）"
  - "Epic PR target が develop / Closes #1635"
  - "partial UNIQUE（non-batch_run）未対応が残リスクとして明記されているか"

notes:
  - "Epic PR は子 Task 完了後に Human Review / merge"
  - "PR 番号確定後に target.pr.number を更新"
  - "CI 既定 live / production 無承認は禁止"
  - "Wave 4 残リスク: uq_*_non_batch_snapshot の ON CONFLICT WHERE は DbWriter 未対応"
