target:
  pr:
    number: 1691
  issue:
    number: 1690
  task_definition: "prompts/definitions/tasks/batch-db-write-011-017/embedding-write.yaml"
  parent_epic_issue: "[Epic]batch-db-write-011-017:BATCH-011〜017書込本格化残"
