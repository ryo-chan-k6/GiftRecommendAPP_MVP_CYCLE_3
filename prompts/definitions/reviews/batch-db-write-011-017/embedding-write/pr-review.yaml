review_points:
  - "update_rows / upsert_rows が本番 SQL か"
  - "claim continue no-op / embedding claim 条件（queued + embedding）が正しいか"
  - "BATCH-014 成功時 processing 維持（DB no-op）か"
  - "item_embedding conflict 3列 / update 列が正しいか"
  - "embedding_vector が Writer に渡されているか（偽 op / dimension-only 廃止）"
  - "op / has_vector / embedding_dimension を DB payload に含めていないか"
  - "ログ・例外に vector 全文が出ていないか"
  - "IF-015 input UPSERT を再実装していないか"
  - "Wave 1/2 / metrics / summary を触っていないか"
  - "実 DB 疎通結果が PR に記録されているか（secret なし）"
  - "Related to / PR target が親 Epic"

notes:
  - "Epic #1635 Wave 3 / Issue #1690"
  - "CI 既定 live / production 無承認は禁止"
  - "Embedding API 本接続必須化は out of scope（stub 維持可）"
