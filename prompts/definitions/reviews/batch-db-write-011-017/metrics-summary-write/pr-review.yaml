review_points:
  - "upsert_rows が本番 SQL か（偽 write_rows / op 廃止）"
  - "IF-016 conflict 列が uq_*_snapshot_key と一致するか"
  - "update_columns が統計列 + calculated_at（+ updated_at）か。PK / conflict 非更新か"
  - "payload に table / op / 不要列が無いか（feature に entity_type 等）"
  - "sigma_zero_count が normalization のみか"
  - "IF-017 が update_columns=()（DO NOTHING）か"
  - "True/False 判定が scaffold（in-memory）/ postgres（rows_affected）で正しいか"
  - "partial UNIQUE 拡張を入れていないか"
  - "残リスク（uq_*_non_batch_snapshot）が明記されているか"
  - "Wave 1〜3 / Embedding API を触っていないか"
  - "実 DB 疎通結果が PR に記録されているか（secret なし）"
  - "Related to / PR target が親 Epic"

notes:
  - "Epic #1635 Wave 4 / Issue #1692"
  - "CI 既定 live / production 無承認は禁止"
  - "残は Epic PR 統合のみ"
  - "pr.number は PR 作成後に親が更新する"
