  title: "batch-db-write-011-017 metrics・summary書込 PRレビュー"
  summary: "BATCH-016/017 Wave 4 IF-016 Metric UPSERT + IF-017 item_import_summary DO NOTHING 本配線 Task の PR を AI Review する。"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  worktree_required: true

target:
  pr:
    number: null
  issue:
    number: 1692
  task_definition: "prompts/definitions/tasks/batch-db-write-011-017/metrics-summary-write.yaml"
  parent_epic_issue: "[Epic]batch-db-write-011-017:BATCH-011〜017書込本格化残"
