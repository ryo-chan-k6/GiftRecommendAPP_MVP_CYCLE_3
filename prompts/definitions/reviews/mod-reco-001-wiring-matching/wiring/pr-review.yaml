schema_version: "1.0"
definition_type: "review"

review:
  id: "review-mod-reco-001-wiring-matching-wiring-pr"
  title: "MOD-RECO-001 Matching Wiring PRレビュー"
  summary: "Matching フェーズ（MOD-RECO-014〜016）の Orchestrator 本実装配線 Task の PR を AI Review する"
  type: "task_pr_review"
  status: "draft"

work_mode: "ai-agent"

branch:
  worktree_required: true

target:
  pr: null
  issue:
    number: null
  task_definition: "prompts/definitions/tasks/mod-reco-001-wiring-matching/wiring.yaml"
  source_branch: "feature/task-<issue-number>-mod-reco-001-wiring-matching-wiring"
  target_branch: "feature/epic-790-mod-reco-001-wiring-matching"
  parent_epic_issue: 790
  parent_epic_branch: "feature/epic-790-mod-reco-001-wiring-matching"

commands:
  primary: "/review-pr"

agent:
  primary: "reviewer-ai"
  specialist:
    docs: false
    test: "test-ai"

review_scope:
  docs: false
  source: true
  tests: true
  project_operation: true
  security: true

input:
  task_definition:
    path: "prompts/definitions/tasks/mod-reco-001-wiring-matching/wiring.yaml"
    required: true

review_points:
  - "stubs.py の変更が Matching フェーズ Port に限定されているか"
  - "モジュール本体（MOD-RECO-014 / 015 / 016）への変更が混入していないか"
  - "orchestrator.py への変更が混入していないか（§19 は integration-test Task）"
  - "StubXxx クラスが削除されていないか"
  - "起動・User Meaning・Retrieval フェーズの配線が維持されているか"
  - "factory 選択（build_default_*）が各モジュール __init__.py の公開 I/F と一致しているか"
  - "exclusive_files（stubs.py）の直列化方針に反していないか"
  - "Task PR target が Epic Branch であるか"
  - "test_recommendation_orchestrator.py の red が配線起因であることと integration-test Task 委譲が PR に明記されているか"
  - "execution-context-typed-fields / integration-retest follow-up（playbook 順序 3〜4）委譲が PR に明記されているか"
  - "execution_context.py への変更が混入していないか"

notes:
  - "Issue / PR 確定後に target.pr / target.issue.number を更新する"
  - "配線 PR 単体では Orchestrator デフォルト経路テストが red になることを許容（integration-test Task で green 化）"
  - "playbook: prompts/definitions/tasks/mod-reco-001-recommendation-orchestrator/wiring-phase-follow-up-playbook.yaml"
