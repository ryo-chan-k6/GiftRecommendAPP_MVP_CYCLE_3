schema_version: "1.0"
definition_type: "review"

review:
  id: "review-mod-reco-023-reason-postgres-implementation-pr"
  title: "MOD-RECO-023 Reason Postgres永続実装 PRレビュー"
  summary: "Reason Postgres 永続実装 Task PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: 1414
  issue: 1413
  task_definition: "prompts/definitions/tasks/mod-reco-023-reason-postgres/implementation.yaml"
  source_branch: "feature/task-1413-mod-reco-023-reason-postgres-implementation"
  target_branch: "feature/epic-1412-mod-reco-023-reason-postgres"
  parent_epic_issue: "[Epic]MOD-RECO-023:Reason Postgres永続"
  parent_epic_branch: "feature/epic-1412-mod-reco-023-reason-postgres"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: true
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/mod-reco-023-reason-postgres/implementation.yaml"
    required: true
  issue:
    number: 1413
    required: true
  pr:
    number: 1414
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1412-mod-reco-023-reason-postgres"
  docs:
    - path: "docs/06_実装設計/database/recommendation_reason_テーブル定義書.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Task Definition scope / acceptance_criteria を満たしているか"
    - "PR target が親 Epic Branch か"
    - "Related to（Closes 禁止）か"
  source:
    - "PostgresRecommendationReasonRepository の列がテーブル定義と一致するか"
    - "production のみ Postgres、DEFAULT は InMemory か"
    - "migration / OpenAPI 変更がないか"
  tests:
    - "repository / composition UT があるか"
  security:
    - "secret / .env 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "PR / Issue 作成後に target.pr / input.pr.number を更新する"
