schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-post-mvp-regression-e2e-epic-pr"
  title: "SCR-005〜007回帰E2E Epic PRレビュー"
  summary: "Epic #1418（レーン1e:SCR-005〜007回帰E2E）の develop 向け統合 PR を AI Review する。チェックリスト拡張と手動回帰証跡を横断確認する。"
  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue:
    number: 1418
  task_definition: "prompts/definitions/epics/scr-post-mvp-regression-e2e/epic.yaml"
  source_branch: "test/epic-1418-scr-post-mvp-regression-e2e"
  target_branch: "develop"
  parent_epic_issue: "[Epic]レーン1e:SCR-005〜007回帰E2E"
  parent_epic_branch: "test/epic-1418-scr-post-mvp-regression-e2e"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/epics/scr-post-mvp-regression-e2e/epic.yaml"
    required: true
  issue:
    number: 1418
    required: true
  pr:
    number: null
    required: false
  diff:
    required: true
    compare_with: "develop"
  docs:
    - path: "docs/06_実装設計/cross_cutting/レーン1e_手動E2Eチェックリスト.md"
      required: true
      purpose: "§9 回帰シナリオと合否の確認"
    - path: "docs/06_実装設計/cross_cutting/ローカル開発手順書.md"
      required: true
      purpose: "§10.4.16 追記の確認"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Epic scope / epic_scope.allowed_paths 内に差分が収まっているか"
    - "子 Task #1419 / PR #1420 が親 Epic Branch 経由で統合されているか"
    - "PR target が develop であるか"
    - "PR 本文が Closes #1418 と整合するか（Epic PR）"
  docs:
    - "S5' / S7 / S8 が定義され合否が記録されているか"
    - "secret / .env 実値を含んでいないか"
  epic_scope:
    - "forbidden_paths（apps/** / openapi / migrations）への変更がないか"

acceptance_check:
  use_task_acceptance_criteria: false
  additional_criteria:
    - "実行 Task が Epic Branch に merge 済みである"
    - "Human Review 観点が PR 本文に整理されている"
    - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"

result_policy:
  approve_for_human_review:
    conditions:
      - "証跡が揃っている"
      - "epic_scope 外差分がない"
      - "修正必須事項がない"
  request_changes:
    conditions:
      - "同一 Branch で修正可能な不備がある"
      - "PR 本文の不足"
  needs_human_decision:
    conditions:
      - "未実施シナリオを許容して develop merge してよいか判断が必要"
  blocked:
    conditions:
      - "必須 Review Definition / Epic Definition が不足している"
      - "実行 Task が親 Epic に未 merge"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "Epic PR の AI Review は PR コメントを正とする"

notes:
  - "Epic PR 作成後に target.pr / input.pr.number を実番号へ更新する"
  - "/review-pr @prompts/definitions/reviews/scr-post-mvp-regression-e2e/epic/pr-review.yaml"
  - "前提: SCR-005/006/007 および Public reasonPoints/reasonDetail は develop merge 済み"
