schema_version: "1.0"
definition_type: "review"

review:
  id: "review-api-pub-005-relationship-masters-implementation-pr"
  title: "API-PUB-005 Relationshipマスタ取得エンドポイント実装 PRレビュー"
  summary: "API-PUB-005（Relationshipマスタ取得 / Public API）実装 Task（implementation.yaml）の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: 1177
  issue: 1175
  task_definition: "prompts/definitions/tasks/api-pub-005-relationship-masters/implementation.yaml"
  source_branch: "feature/task-1175-api-pub-005-relationship-masters-implementation"
  target_branch: "feature/epic-387-pub-005-relationship-masters"
  parent_epic_issue: "[Epic]API-PUB-005:Relationshipマスタ取得"
  parent_epic_branch: "feature/epic-387-pub-005-relationship-masters"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: "test-ai"
    contract: "contract-ai"
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: true
  tests: true
  api_contract: true
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/api-pub-005-relationship-masters/implementation.yaml"
    required: true
  issue:
    number: 1175
    required: true
  pr:
    number: 1177
    required: true
  diff:
    required: true
    compare_with: "feature/epic-387-pub-005-relationship-masters"
  docs:
    - path: "docs/06_実装設計/api/API-PUB-005_Relationshipマスタ取得API実装仕様書.md"
      required: true
      purpose: "実装正本との整合確認"
    - path: "docs/06_実装設計/api/API-PUB-005_Relationshipマスタ取得API契約仕様書.md"
      required: true
      purpose: "契約との整合確認"

review_points:
  common:
    - "Task Definition（implementation.yaml）の scope を満たしているか"
    - "acceptance_criteria を満たしているか"
    - "Task Branch から develop へ直接 PR していないか"
  source:
    - "MOD-API-011 / 012 責務と relationship_master 読取が実装仕様書と整合しているか"
    - "空配列 / GRS-CFG-005 / GRS-DB-002 境界が正しいか"
    - "isActive / Pair を Response に含めていないか"
  tests:
    - "スモーク UT が主要境界をカバーしているか"
  api_contract:
    - "OpenAPI / generated 変更が混在していないか"
  security:
    - "secret や .env 実値が含まれていないか"
  epic_scope:
    - "PR差分が親Epic epic_scope.allowed_paths 内に収まっているか"

acceptance_check:
  use_task_acceptance_criteria: true

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "scope 外変更がない"
  request_changes:
    conditions:
      - "実装不備がある"
      - "テスト失敗がある"
  needs_human_decision:
    conditions:
      - "契約との矛盾解消に Human 判断が必要"
  split_required:
    conditions:
      - "OpenAPI / generated 変更が混在している"
  blocked:
    conditions:
      - "PR diff を確認できない"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "AI Review"
    priority: "high"

issue:
  unit: "task"
  type: "feature"
  area: "api"

notes:
  - "PR 作成後に target.pr / input.pr.number を更新する"
  - "対応 Issue: #1175"
