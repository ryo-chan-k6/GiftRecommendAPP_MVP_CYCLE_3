    number: 1541
  issue:
    number: 1532
  task_definition: "prompts/definitions/epics/reco-perf-timeout-formal-docs/epic.yaml"
  target_branch: "develop"
  parent_epic_issue: "[Epic]docs:Reco性能タイムアウト正式反映"
  parent_epic_branch: "docs/epic-1532-reco-perf-timeout-formal-docs"

commands:
  primary: "/review-pr"

agent:
  primary: "reviewer-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: false
    security: true

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  epic_definition:
    path: "prompts/definitions/epics/reco-perf-timeout-formal-docs/epic.yaml"
  docs:
    - "docs/06_実装設計/reco/MOD-RECO-001_Recommendation Orchestratorモジュール仕様書.md"
