  - "#1533 Human 確定値（内部 1.5s/2s・外部 6s/8s・user_meaning 5s）が正本にあるか"
  - "phase_output 案 A が Human Review 明示付きで転記されているか"
  - "TV進捗・設計反映メモと正本の整合"
  - "apps/** 実装差分の非混入（BATCH 等の develop 追従差分は本 Epic 成果ではないことを確認）"
  - "Closes #1532 の扱い"

acceptance:
  human_review_required: true
  merge_by_ai: false

notes:
  - "merge 判断は Human"
  - "phase_output 最終採否は Human Review"
