review_points:
  common:
    - "Task Definition scope / acceptance_criteria"
    - "PR target が親 Epic Branch か"
    - "PR 本文が Related to で Closes を使っていないか"
  tests:
    - "§9 fixture 観点がカバーまたはスキップ理由明示か"
    - "既存スモークを壊していないか"
  security:
    - "secret / `.env` 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

notes:
  - "Issue / PR 作成後に target.pr / input.pr.number を更新する"
  - "PR 本文の Closes 禁止を重点確認"
