schema_version: "1.0"
definition_type: "review"

review:
  id: "review-api-int-002-reco-recommendation-run-implementation-pr"
  title: "API-INT-002 Reco推薦実行エンドポイント実装 PRレビュー"
  summary: "API-INT-002 reco エンドポイント実装 Task（implementation.yaml）の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: 1103
  task_definition: "prompts/definitions/tasks/api-int-002-reco-recommendation-run/implementation.yaml"
  source_branch: "feature/task-1103-api-int-002-reco-recommendation-run-implementation"
  target_branch: "feature/epic-366-api-int-002-reco-recommendation-run"
  parent_epic_issue: "[Epic]API-INT-002:Reco推薦実行"
  parent_epic_branch: "feature/epic-366-api-int-002-reco-recommendation-run"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: "test-ai"
    contract: "contract-ai"
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: true
  tests: true
  api_contract: true
  db: false
  generated: true
  cicd: true
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/api-int-002-reco-recommendation-run/implementation.yaml"
    required: true
  issue:
    number: 1103
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-366-api-int-002-reco-recommendation-run"
  docs:
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API実装仕様書.md"
      required: true
      purpose: "実装正本との整合確認"
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API契約仕様書.md"
      required: true
      purpose: "Response 外形・Validation・Error 参照"
    - path: "docs/05_アプリケーション設計/基盤/認証・認可方針書.md"
      required: true
      purpose: "Internal API Key 方針"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: false
      purpose: "GRS-* エラーマップ"
  files:
    - path: "apps/reco/src/reco/api/**"
      required: true
    - path: "packages/contracts/openapi/internal-reco-api.yaml"
      required: false
      purpose: "OpenAPI 正本参照（変更なし確認）"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: true
    source: "pr_checks"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Task Definition（implementation.yaml）の scope を満たしているか"
    - "Contract Gate（#1097 / openapi-sync）前提を満たしているか"
    - "out_of_scope（OpenAPI / generated / apps/api wrapper / application 層変更）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "PR target が親 Epic Branch であるか"
    - "Task PR で Closes を使っていないか（Related to を使用）"
  source:
    - "実装仕様書 §3〜§8（処理フロー・マッピング・認証・debug・エラー）と矛盾しないか"
    - "CompositionMode.PRODUCTION 固定で Orchestrator を呼び出しているか"
    - "data.resultItems / WarningItem[] / 0 件 completed の契約準拠か"
    - "trace_id / request_id が meta と一致するか"
    - "apps/reco/src/reco/application/** への変更がないか"
  tests:
    - "エンドポイント層のスモーク / unit test 結果が PR 本文に記載されているか"
    - "未実施テストの理由が明記されているか"
  api_contract:
    - "OpenAPI / generated の変更が含まれていないか"
    - "契約仕様書の Response 外形と整合しているか"
  generated:
    - "generated 手動編集や Orval 再実行差分が含まれていないか"
  security:
    - "secret / .env 実値が含まれていないか"
    - "Internal API Key がログに出力されていないか"
  branch:
    - "PR target が feature/epic-366-api-int-002-reco-recommendation-run であるか"
  epic_scope:
    - "allowed_paths（apps/reco/src/reco/api/**）内に収まっているか"
    - "forbidden_paths（application / api/src/app / openapi 変更）への違反がないか"

acceptance_check:
  use_task_acceptance_criteria: true
  additional_criteria:
    - "Contract Gate 前提（#1097 merge 済み）が PR 本文または diff で確認できる"
    - "後続単体テスト Task への影響が PR 本文に記載されている"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "Contract Gate 前提を満たしている"
      - "scope 外変更がない"
      - "修正必須事項がない"
  request_changes:
    conditions:
      - "実装仕様書・契約仕様書との不整合"
      - "OpenAPI / generated / application 層の scope 外変更"
      - "テスト不足または検証結果の記載不足"
  needs_human_decision:
    conditions:
      - "domain 型拡張の要否判断が必要"
      - "Orchestrator 接続方針の判断が必要"
  split_required:
    conditions:
      - "OpenAPI Contract 変更が混在している"
      - "apps/api wrapper 実装が混在している"
      - "推薦ロジック（application 層）変更が混在している"
  blocked:
    conditions:
      - "PR diff を確認できない"
      - "Contract Gate 未充足が確認された"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "AI Review"
    priority: "high"

issue:
  unit: "task"
  type: "feature"
  area: "reco"

dependencies:
  tasks:
    - "prompts/definitions/tasks/api-int-002-reco-recommendation-run/implementation.yaml"
    - "prompts/definitions/contracts/api-int-002-reco-recommendation-run/openapi-sync.yaml"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/api-int-002-reco-recommendation-run/implementation.yaml"
  - "review.target.pr / input.pr.number / input.issue.number は Issue 起票後に反映"
  - "resolve-review-definition.cjs は pr-review.yaml 固定名を探索。本ファイルパスを PR head に含める"
