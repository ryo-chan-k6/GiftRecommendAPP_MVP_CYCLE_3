schema_version: "1.0"
definition_type: "review"

review:
  id: "review-api-int-002-reco-recommendation-run-epic-pr"
  title: "API-INT-002 Reco推薦実行 Epic PRレビュー"
  summary: "Epic #366（API-INT-002 Reco推薦実行）の develop 向け統合 PR を AI Review する。Phase4b 縦串（実装仕様書 / OpenAPI Contract / reco エンドポイント実装 / 単体テスト）の成果を横断確認する。"
  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  worktree_required: true

target:
  pr: null
  issue:
    number: 366
  task_definition: "prompts/definitions/epics/api-int-002-reco-recommendation-run/epic.yaml"
  source_branch: "feature/epic-366-api-int-002-reco-recommendation-run"
  target_branch: "develop"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    contract: "contract-ai"
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: true
  tests: true
  api_contract: true
  db: false
  generated: true
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/epics/api-int-002-reco-recommendation-run/epic.yaml"
    required: true
  issue:
    number: 366
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "develop"
  docs:
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API契約仕様書.md"
      required: true
      purpose: "契約面正本"
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API実装仕様書.md"
      required: true
      purpose: "実装面正本"
  child_tasks:
    - issue: 1091
      pr: 1094
      task_definition: "prompts/definitions/tasks/api-int-002-reco-recommendation-run/api-implementation-spec.yaml"
    - issue: 1097
      pr: 1099
      task_definition: "prompts/definitions/contracts/api-int-002-reco-recommendation-run/openapi-sync.yaml"
    - issue: 1103
      pr: 1106
      task_definition: "prompts/definitions/tasks/api-int-002-reco-recommendation-run/implementation.yaml"
    - issue: 1107
      pr: 1109
      task_definition: "prompts/definitions/tasks/api-int-002-reco-recommendation-run/unit-test.yaml"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "pr_checks"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Epic Definition（epic.yaml）の scope / out_of_scope / acceptance_criteria を満たしているか"
    - "Epic PR の source が feature/epic-366-api-int-002-reco-recommendation-run、target が develop であるか"
    - "PR 本文に Closes #366（または運用に沿った Epic Issue 参照）があるか"
    - "Phase4b 子 Task（#1091 / #1097 / #1103 / #1107）が Epic 統合完了として整理されているか"
    - "子 Task PR（#1094 / #1099 / #1106 / #1109）の成果が Epic diff に含まれているか"
    - "secret / .env 実値が含まれていないか"
  epic_scope:
    - "epic_scope.allowed_paths 内に差分が収まっているか"
    - "epic_scope.forbidden_paths（apps/reco/src/reco/application/**、apps/api/src/app/**、apps/web/**、db）への変更がないか"
    - "apps/reco エンドポイント層（apps/reco/src/reco/api/**）が実装の中心であるか"
    - "apps/api reco-client wrapper（ScaffoldRecoClient 置換）が本 Epic に混入していないか（別 Task 想定）"
  docs:
    - "契約仕様書・実装仕様書が子 Task 成果として Epic に含まれているか"
    - "§14 確定事項（warnings / auth map / debug / reason）が docs 間で整合しているか"
  source:
    - "reco エンドポイント層が実装仕様書 §3〜§8 と整合しているか"
    - "CompositionMode.PRODUCTION 固定か"
    - "apps/reco/src/reco/application/** 本体の変更が混入していないか"
  api_contract:
    - "packages/contracts/openapi/internal-reco-api.yaml の変更が契約仕様書と整合しているか"
    - "apps/api/src/generated/reco-client/** が Orval 再生成結果であるか（手編集なし）"
  tests:
    - "apps/reco/tests/unit/api/** が契約仕様書 §12 unit 相当観点をカバーしているか"
    - "pytest 実行結果が Epic PR 本文に記載されているか"
    - "integration 観点が Epic PR で未実施として明記されているか"
  security:
    - "Internal API Key の実値がコード・テストに含まれていないか"
  project_operation:
    - "Task PR を develop に直接向けていないか（子 PR は Epic Branch 向けであったか）"
    - "Phase4b 縦串完了後の develop 統合であるか"

acceptance_check:
  use_epic_acceptance_criteria: true
  additional_criteria:
    - "child_task_areas（api-spec / openapi / implementation / unit-test）の成果が Epic diff に含まれる"
    - "apps/api reco-client wrapper 実装が Epic に含まれない（別 Task）"
    - "API-PUB-002 実装が Epic に含まれない"
    - "Human Review で確認してほしい事項が PR 本文に明記されている"

result_policy:
  approve_for_human_review:
    conditions:
      - "Epic acceptance_criteria を満たしている"
      - "epic_scope 外の変更がない"
      - "子 Task 成果の横断整合に Blocker がない"
      - "テスト・検証結果の記載が十分である"
  request_changes:
    conditions:
      - "epic_scope.forbidden_paths への変更が混入している"
      - "契約仕様書・実装仕様書・実装・テストの矛盾がある"
      - "子 Task 未完了の成果が含まれている"
      - "PR 本文の検証結果・未実施事項の記載が不足している"
  needs_human_decision:
    conditions:
      - "develop 反映タイミングと API-PUB-002 着手順序について判断が必要"
      - "reco-client wrapper を別 Epic / 同一 Epic 続行 Task とするか判断が必要"
  blocked:
    conditions:
      - "Epic diff を確認できない"
      - "子 Task Issue / PR の対応が不明"
      - "secret 漏えいの疑いがある"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    status: "AI Review"
