schema_version: "1.0"
definition_type: "review"

review:
  id: "review-reco-pipeline-timeout-epic-pr"
  title: "reco-pipeline-timeout Epic PRレビュー"
  summary: "本番主経路 soft6s/hard8s 整合 Epic の develop 向け PR を AI Review する。"
  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  worktree_required: false

target:
  pr: 1784
  issue: 1781
  epic_definition: "prompts/definitions/epics/reco-pipeline-timeout/epic.yaml"
  source_branch: "fix/epic-1781-reco-pipeline-timeout"
  target_branch: "develop"
  parent_epic_issue: null
  parent_epic_branch: null

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    contract: null
    security: "reviewer-ai"
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: true
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  epic_definition:
    path: "prompts/definitions/epics/reco-pipeline-timeout/epic.yaml"
    required: true
  issue:
    number: 1781
    required: true
  pr:
    number: 1784
    required: true
  diff:
    required: true
    compare_with: "develop"
  docs:
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API実装仕様書.md"
      required: true
    - path: "docs/06_実装設計/api/API-INT-002_Reco推薦実行API実装仕様書.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  - "子 Task の成果が Epic Branch に統合されているか"
  - "epic_scope.allowed_paths 外・forbidden_paths の変更がないか"
  - "soft 6_000 / hard 8_000 / api 9_000 が反映されているか"
  - "OpenAPI / generated / 性能要件数値変更がないか"
  - "PR target が develop、Closes #<Epic Issue> か"
  - "secret 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消、または Human 判断待ちとして明示される"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれか"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "Epic Issue / PR 番号確定後に target.* / input.* を同期する"
