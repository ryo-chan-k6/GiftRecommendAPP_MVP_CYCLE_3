schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-009-empty-result-screen-spec-pr"
  title: "SCR-009 0件結果表示画面仕様書 PRレビュー"
  summary: "SCR-009 画面仕様書 Task の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: 1384
  task_definition: "prompts/definitions/tasks/scr-009-empty-result/screen-spec.yaml"
  source_branch: "docs/task-1384-scr-009-empty-result-screen-spec"
  target_branch: "feature/epic-1382-scr-009-empty-result"
  parent_epic_issue: "[Epic]SCR-009:0件結果表示"
  parent_epic_branch: "feature/epic-1382-scr-009-empty-result"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/scr-009-empty-result/screen-spec.yaml"
    required: true
  issue:
    number: 1384
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1382-scr-009-empty-result"
  docs:
    - path: "docs/06_実装設計/web/SCR-009_0件結果表示画面仕様書.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables:
      - path: "prompts/templates/docs/screen-spec.md"
        required: true
        applies_to:
          - "docs/06_実装設計/web/SCR-009_0件結果表示画面仕様書.md"

review_points:
  common:
    - "Task Definition scope を満たしているか"
    - "PR target が親 Epic Branch か"
    - "Related to（Closes 禁止）か"
  docs:
    - "screen-spec.md テンプレートに準拠しているか"
    - "画面一覧 SCR-009 と整合しているか"
    - "画面状態として記載し、独立 URL 画面と誤記していないか"
    - "MVP 宿主（recommendation-input phase=empty）が明示されているか"
    - "画面遷移図（結果一覧の状態）と MVP 宿主の差が §5.2 等で整理されているか"
    - "専用 `/recommendations/{result_id}` route 新設が MVP out of scope か"
    - "ST-EMPTY / UI-033 EmptyState 対応がデザインルール・UIコンポーネント一覧と整合しているか"
    - "API-PUB-002 0件正常系（resultStatus=empty / GRS-REC-001）と矛盾していないか"
    - "SCR-003 からの 0件遷移・SCR-002 への復帰が整理されているか"
    - "再検索ボタン（△）の MVP 扱いが Human Review 観点として明示されているか"
  security:
    - "secret / .env 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "実装用 Review は後続 Task。本ファイルは画面仕様書専用"
  - "PR 作成後に target.pr / input.pr.number を同期する"
  - "再検索ボタン・displayMessage 統一・条件緩和具体化は Human Review 観点（仕様書 §22）"
