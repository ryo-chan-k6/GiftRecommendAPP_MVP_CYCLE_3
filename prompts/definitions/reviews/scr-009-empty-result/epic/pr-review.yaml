schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-009-empty-result-epic-pr"
  title: "SCR-009 0件結果表示 Epic PRレビュー"
  summary: "Epic #1382（SCR-009 0件結果表示）の develop 向け統合 PR を AI Review する。画面仕様書・実装（component UT 含む）の縦串成果を横断確認する。"
  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue:
    number: 1382
  task_definition: "prompts/definitions/epics/scr-009-empty-result/epic.yaml"
  source_branch: "feature/epic-1382-scr-009-empty-result"
  target_branch: "develop"
  parent_epic_issue: "[Epic]SCR-009:0件結果表示"
  parent_epic_branch: "feature/epic-1382-scr-009-empty-result"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: true
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/epics/scr-009-empty-result/epic.yaml"
    required: true
  issue:
    number: 1382
    required: true
  pr:
    number: null
    required: false
  diff:
    required: true
    compare_with: "develop"
  docs:
    - path: "docs/06_実装設計/web/SCR-009_0件結果表示画面仕様書.md"
      required: true
      purpose: "画面仕様書成果の確認"
    - path: "docs/06_実装設計/web/SCR-002_レコメンド条件入力画面画面仕様書.md"
      required: true
      purpose: "宿主画面との分担確認"
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
      purpose: "SCR-009 行との整合確認"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Epic scope / epic_scope.allowed_paths 内に差分が収まっているか"
    - "Task PR が親 Epic Branch 経由で統合されているか（画面仕様書 / 実装）"
    - "PR target が develop であるか"
    - "PR 本文が Closes #<Epic Issue> と整合するか（Epic PR）"
  docs:
    - "SCR-009 画面仕様書が成果として含まれているか"
    - "MVP 方針（画面状態・専用 route なし・再検索非採用・トップへ戻る採用・クライアント定数正本）が仕様と実装で一致するか"
  source:
    - "SCR-009 は recommendation-input 内の empty 状態として実装されているか"
    - "RecommendationEmptyPanel / EmptyState / 条件変更 / トップへ戻る TextLink が仕様どおりか"
    - "再検索専用 CTA・API displayMessage 表示がないか"
    - "専用 empty route 新設がないか"
    - "apps/api / reco / batch / OpenAPI への侵入がないか"
  tests:
    - "RecommendationEmptyPanel の component テストが含まれ、再現可能か"
  security:
    - "secret / .env 実値を含んでいないか"
  epic_scope:
    - "forbidden_paths（apps/api / reco / batch / openapi / db / home / recommendation-result 大規模改修）への変更がないか"

acceptance_check:
  use_task_acceptance_criteria: false
  additional_criteria:
    - "縦串（仕様書 → 実装＋UT）が Epic Branch に揃っている"
    - "Human Review 観点が PR 本文に整理されている"
    - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"

result_policy:
  approve_for_human_review: "Human Review"
  request_changes: "In Progress"
  needs_human_decision: "Human Decision"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の Epic AI Review は PR コメントを正とする"

notes:
  - "PR 作成後に target.pr を同期する"
  - "専用 unit-test Task は起票せず、実装 Task（#1386 / PR #1387）内の component UT で充足"
  - "前提: SCR-002（#1147）/ SCR-003（#1361）/ API-PUB-002（#357）は develop merge 済み"
