schema_version: "1.0"
definition_type: "review"
review:
  id: "review-lane-1e-manual-e2e-epic-pr"
  title: "レーン1e 手動E2E Epic PRレビュー"
  summary: "D1 Epic #1330 develop 向け AI Review"
  type: "epic_pr_review"
  status: "ready"
work_mode: "ai-agent"
branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false
target:
  pr: 1340
  issue: 1330
  task_definition: "prompts/definitions/epics/lane-1e-manual-e2e/epic.yaml"
  source_branch: "chore/epic-1330-lane-1e-manual-e2e"
  target_branch: "develop"
  parent_epic_issue: null
  parent_epic_branch: null
commands:
  primary: "/review-pr"
  allowed: ["/review-pr", "/fix-review-comments", "/summarize-work"]
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null
agent:
  primary: "reviewer-ai"
  support: ["support-ai", "test-ai"]
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"
review_scope:
  docs: true
  source: false
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true
input:
  task_definition:
    path: "prompts/definitions/epics/lane-1e-manual-e2e/epic.yaml"
    required: true
  issue:
    number: 1330
    required: true
  pr:
    number: 1340
    required: true
  diff:
    required: true
    compare_with: "develop"
  docs:
    - path: "docs/06_実装設計/cross_cutting/レーン1e_手動E2Eチェックリスト.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
review_points:
  common:
    - "Epic → develop / Closes #1330"
    - "子 Task #1331/#1332 が含まれるか"
  docs:
    - "S1〜S4 証跡と residual が明示されているか"
  security:
    - "secret 非含有"
acceptance_check:
  use_task_acceptance_criteria: true
result_policy:
  approve_for_human_review:
    conditions: ["acceptance 充足", "Must なし"]
  request_changes:
    conditions: ["同一 Branch 修正可能"]
  needs_human_decision:
    conditions: ["S2 fail の Close 可否"]
  blocked:
    conditions: ["子 Task 未 merge"]
acceptance_criteria:
  - "Blocker/Must 解消または明示"
operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: true
    experiments: false
  reason: "D1 Epic AI Review"
notes:
  - "PR 作成後に番号反映"
