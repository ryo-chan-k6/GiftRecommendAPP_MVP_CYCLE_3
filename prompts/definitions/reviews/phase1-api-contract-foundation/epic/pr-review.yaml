schema_version: "1.0"
definition_type: "review"

review:
  id: "review-phase1-api-contract-foundation-epic-pr"
  title: "Phase1 API Contract基盤 Epic PRレビュー"
  summary: "Phase1 第1波マイルストーン Epic PR（develop 向け）の AI Review。PUB-002 / INT-002 契約 docs・OpenAPI・generated 統合と Contract Gate §4 を横断確認する。"
  type: "epic_pr_review"
  status: "ready"

target:
  pr: 382
  issue:
    number: 381
  task_definition: "prompts/definitions/epics/phase1-api-contract-foundation/epic.yaml"
  source_branch: "feature/epic-381-phase1-api-contract-foundation"
  target_branch: "develop"

review_scope:
  docs: true
  project_operation: true
  contract: true

input:
  task_definition:
    path: "prompts/definitions/epics/phase1-api-contract-foundation/epic.yaml"
    required: true
  issue:
    number: 381
    required: true

review_points:
  common:
    - "Epic Definition scope / out_of_scope を満たしているか"
    - "epic_scope.forbidden_paths（apps 実装層）への変更がないか"
    - "識別子 Epic Branch（#357 / #366 / #367）の Phase1 成果が統合されているか"
    - "Epic PR target=develop / author=okuri-ai-bot であるか"
    - "Closes #<Epic Issue> が PR 本文にあるか"
  docs:
    - "API-PUB-002 / API-INT-002 契約仕様書が docs/06_実装設計/api/ に存在するか"
    - "実装フェーズ実行プロセス §6.2 / Contract Gate §4・§6 のマイルストーン記述と整合しているか"
  contract:
    - "packages/contracts/openapi に PUB-002 / INT-002 の実体が反映されているか（空プレースホルダ解消）"
    - "orval.config.ts + generated が再生成済みで手動編集がないか"
    - "Contract Gate §4 全項目が充足しているか"

result_policy:
  approve_for_human_review:
    conditions:
      - "Epic acceptance_criteria を満たしている"
      - "scope外変更（apps 実装）が混入していない"
      - "Contract Gate §4 が充足している"
      - "#357 / #366 / #367 が CLOSE されていない"

status_policy:
  on_approve: "Human Review"
  on_request_changes: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"

issue:
  unit: "epic"
  type: "feature"
  area: "api"
