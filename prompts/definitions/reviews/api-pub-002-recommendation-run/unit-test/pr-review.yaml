schema_version: "1.0"
definition_type: "review"

review:
  id: "review-api-pub-002-recommendation-run-unit-test-pr"
  title: "API-PUB-002 レコメンド実行API単体テスト PRレビュー"
  summary: "API-PUB-002 apps/api 単体テスト Task（unit-test.yaml）の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: 1130
  task_definition: "prompts/definitions/tasks/api-pub-002-recommendation-run/unit-test.yaml"
  source_branch: "test/task-1130-api-pub-002-recommendation-run-unit-test"
  target_branch: "feature/epic-357-api-pub-002-recommendation-run"
  parent_epic_issue: "[Epic]API-PUB-002:レコメンド実行"
  parent_epic_branch: "feature/epic-357-api-pub-002-recommendation-run"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: false
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/api-pub-002-recommendation-run/unit-test.yaml"
    required: true
  issue:
    number: 1130
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-357-api-pub-002-recommendation-run"
  docs:
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API契約仕様書.md"
      required: true
      purpose: "§12 契約面テスト観点"
    - path: "docs/06_実装設計/api/API-PUB-002_レコメンド実行API実装仕様書.md"
      required: true
      purpose: "§10 実装テスト観点"
    - path: "docs/05_アプリケーション設計/アプリ/エラーコード定義書.md"
      required: false
      purpose: "GRS-* 期待値"
  files:
    - path: "apps/api/tests/unit/app/recommendations/**"
      required: true
    - path: "apps/api/src/app/recommendations/**"
      required: false
      purpose: "テスト成立に必要な最小修正のみか確認"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Task Definition（unit-test.yaml）の scope を満たしているか"
    - "out_of_scope（integration / OpenAPI / generated / apps/reco / apps/web）の変更が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "PR本文に §12 / §10 unit 観点とテストケースの対応表が記載されているか"
    - "PR本文に変更内容、検証結果、未実施事項（integration 観点）が記載されているか"
    - "Task PR で Related to 親 Epic / Task Issue を使用し Closes を使っていないか"
    - "PR target が親 Epic Branch であるか"
  tests:
    - "契約仕様書 §12 の unit 相当観点がテストケースとしてカバーされているか"
    - "実装仕様書 §10 の unit 観点（Validation / Public フィルタ / createRecoClient）がカバーされているか"
    - "既存スモークテストが維持・成功しているか"
    - "スタブ reco-client / Repository 前提で安定して再現可能か（本番 DB / 外部 API 非依存）"
    - "integration 観点を unit で無理に検証していないか"
    - "`pnpm --filter @gift-recommendation/api test` 実行結果が PR に記載されているか"
  security:
    - "secret や .env 実値がテスト fixture に含まれていないか"
  epic_scope:
    - "差分が `apps/api/tests/unit/app/recommendations/**` および関連 definition / epic_scope 追記に限定されているか"
    - "OpenAPI / generated / apps/reco / apps/web の変更が含まれていないか"
    - "Public API 層の変更がテスト成立に必要な最小限か"

acceptance_check:
  use_task_acceptance_criteria: true
  additional_criteria:
    - "PR本文に §12 / §10 unit 観点カバレッジ対応表がある"
    - "integration 観点の未実施理由が明記されている"
    - "Human Reviewで確認してほしい事項が明記されている"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "§12 / §10 unit 相当観点のカバレッジが過不足ない"
      - "修正必須事項がない"
      - "scope 外変更がない"
  request_changes:
    conditions:
      - "§12 / §10 unit 観点のカバレッジ不足がある"
      - "テストが不安定または本番依存になっている"
      - "検証結果・対応表の記載不足がある"
  needs_human_decision:
    conditions:
      - "§12 / §10 unit / integration 境界の解釈判断が必要"
      - "テスト成立のための Public API 層変更の妥当性判断が必要"
      - "実装仕様書 §11 未決事項をテストに含めるかの判断が必要"
  split_required:
    conditions:
      - "Public API 層の機能追加・大規模リファクタが混在している"
      - "OpenAPI / generated 変更が混在している"
  blocked:
    conditions:
      - "PR diff を確認できない"
      - "secret や .env 実値の混入が疑われる"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "AI Review"
    priority: "high"

issue:
  number: 1130
  unit: "task"
  type: "test"
  area: "api"

dependencies:
  tasks:
    - "prompts/definitions/tasks/api-pub-002-recommendation-run/unit-test.yaml"
    - "prompts/definitions/tasks/api-pub-002-recommendation-run/implementation.yaml"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/api-pub-002-recommendation-run/unit-test.yaml"
  - "review.target.pr / input.pr.number / input.issue.number / target.source_branch は Issue 起票後に反映"
  - "resolve-review-definition.cjs は pr-review.yaml 固定名を探索。本ファイルパスを PR head に含める"
