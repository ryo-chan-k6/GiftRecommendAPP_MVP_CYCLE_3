schema_version: "1.0"
definition_type: "review"

review:
  id: "review-feature-integration-rule-seed-implementation-pr"
  title: "Feature Integration Rule Seed実装 PRレビュー"
  summary: "feature_integration_rule master seed実装Task PRをAI Reviewする"
  type: "task_pr_review"
  status: "draft"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: null
  task_definition: "prompts/definitions/tasks/feature-integration-rule-seed/implementation.yaml"
  source_branch: null
  target_branch: "feature/epic-1756-feature-integration-rule-seed"
  parent_epic_issue: "[Epic]Feature Integration Rule Seed整備"
  parent_epic_branch: "feature/epic-1756-feature-integration-rule-seed"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: true
  api_contract: false
  db: true
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/feature-integration-rule-seed/implementation.yaml"
    required: true
  issue:
    number: null
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1756-feature-integration-rule-seed"
  docs:
    - path: "docs/06_実装設計/database/feature_integration_rule_テーブル定義書.md"
      required: true
    - path: "docs/04_ドメインモデル設計/Featureルール定義書.md"
      required: true
    - path: "docs/06_実装設計/database/初期データ定義書.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Task Definition scope / acceptance_criteriaを満たすか"
    - "PR targetが親Epic Branchか"
    - "Related to（Closes禁止）か"
  source:
    - "8 Feature軸 × 6 input_source = 48行か"
    - "weightが両正本docsと一致するか"
    - "UPSERTが冪等で正本値へ収束するか"
    - "migration / application変更がないか"
  tests:
    - "初回投入・再投入・48行検証の証跡があるか"
  security:
    - "stg接続文字列・password・secret実値がないか"

acceptance_criteria:
  - "Blocker / Mustが解消、またはHuman判断待ちとして明示される"
  - "結論がHuman Reviewへ進行可 / 修正後に再AI Review / Human判断待ちのいずれか"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: false
  reason: "通常のAI ReviewはPRコメントを正とする"

notes:
  - "Task Issue / PR作成後にtarget/inputの実番号、source_branch、statusを更新する"
