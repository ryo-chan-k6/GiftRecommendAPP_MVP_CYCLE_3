schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-006-item-detail-implementation-pr"
  title: "SCR-006 商品詳細画面実装 PRレビュー"
  summary: "SCR-006 商品詳細画面実装 Task の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: 1313
  task_definition: "prompts/definitions/tasks/scr-006-item-detail/implementation.yaml"
  source_branch: "feature/task-1313-scr-006-item-detail-implementation"
  target_branch: "feature/epic-1303-scr-006-item-detail"
  parent_epic_issue: "[Epic]SCR-006:商品詳細画面"
  parent_epic_branch: "feature/epic-1303-scr-006-item-detail"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: true
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/scr-006-item-detail/implementation.yaml"
    required: true
  issue:
    number: null
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1303-scr-006-item-detail"
  docs:
    - path: "docs/06_実装設計/web/SCR-006_商品詳細画面画面仕様書.md"
      required: true
    - path: "docs/06_実装設計/api/API-PUB-003_商品詳細取得API契約仕様書.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Task Definition scope を満たしているか"
    - "PR target が親 Epic Branch か"
    - "Related to（Closes 禁止）か"
  source:
    - "プレースホルダが本実装に差し替えられているか"
    - "API-PUB-003 呼び出しとエラーマッピングが仕様どおりか"
    - "fromResultId / sessionStorage 推薦文脈が invent していないか"
    - "isSafeExternalUrl を使っているか"
    - "SCR-005 / SCR-007 が導線（disabled）のみか"
    - "epic_scope.allowed_paths 内か / SCR-001・002・004 exclusive へ侵入していないか"
  tests:
    - "最小 component テストがあるか"
    - "本番 network 非依存か"
  security:
    - "secret / .env 実値がないか"
    - "generated 手動編集がないか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "PR / Issue 作成後に target 番号を同期する"
