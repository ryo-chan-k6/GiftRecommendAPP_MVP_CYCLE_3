schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-006-item-detail-screen-spec-pr"
  title: "SCR-006 商品詳細画面仕様書 PRレビュー"
  summary: "SCR-006 画面仕様書作成 Task（screen-spec.yaml）の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: 1304
  task_definition: "prompts/definitions/tasks/scr-006-item-detail/screen-spec.yaml"
  source_branch: "docs/task-1304-scr-006-item-detail-screen-spec"
  target_branch: "feature/epic-1303-scr-006-item-detail"
  parent_epic_issue: "[Epic]SCR-006:商品詳細画面"
  parent_epic_branch: "feature/epic-1303-scr-006-item-detail"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: true
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/scr-006-item-detail/screen-spec.yaml"
    required: true
  issue:
    number: 1304
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1303-scr-006-item-detail"
  docs:
    - path: "docs/06_実装設計/web/SCR-006_商品詳細画面画面仕様書.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/web/画面遷移図.md"
      required: true
    - path: "docs/06_実装設計/api/API-PUB-003_商品詳細取得API契約仕様書.md"
      required: true
    - path: "docs/06_実装設計/web/SCR-004_レコメンド結果一覧画面画面仕様書.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables:
      - path: "prompts/templates/docs/screen-spec.md"
        required: true
        applies_to:
          - "docs/06_実装設計/web/SCR-006_商品詳細画面画面仕様書.md"

review_points:
  common:
    - "Task Definition scope / acceptance_criteria を満たしているか"
    - "out_of_scope（SCR-004 本文変更 / 実装 / OpenAPI）が混入していないか"
    - "PR target が親 Epic Branch か"
    - "Related to（Closes 禁止）か"
  docs:
    - "screen-spec.md テンプレート §1–24 に準拠しているか"
    - "画面一覧 §4.6・画面遷移図 §6.6 と整合しているか"
    - "API-PUB-003 404/422/400/画像なし 200 と画面状態が一致しているか"
    - "推薦文脈を sessionStorage のみから読み、invent していないか"
    - "SCR-005 / SCR-007 が導線レベルに留まっているか"
    - "SCR-004 スタブ差し替え方針が備考に記載されているか"
  api_contract:
    - "PUB-003 表示項目と shopName 非表示が契約と矛盾していないか"
  security:
    - "secret / .env 実値がないか"
    - "isSafeExternalUrl 方針が SCR-004 と一致しているか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "PR 作成後に target.pr を同期する"
  - "/review-pr @prompts/definitions/reviews/scr-006-item-detail/screen-spec/pr-review.yaml"
