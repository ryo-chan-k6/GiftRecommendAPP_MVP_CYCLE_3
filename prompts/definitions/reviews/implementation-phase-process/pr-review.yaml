schema_version: "1.0"
definition_type: "review"

review:
  id: "review-implementation-phase-process-design-doc-pr"
  title: "実装フェーズ実行プロセス設計書 PRレビュー"
  summary: "実装フェーズ実行プロセス設計書の作成と既存正本への統合 Task の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: 340
  issue: 339
  task_definition: "prompts/definitions/tasks/implementation-phase-process/process-design-doc.yaml"
  source_branch: "docs/task-339-process-design-doc"
  target_branch: "docs/epic-338-implementation-phase-process"
  parent_epic_issue: "[Epic]実装フェーズ実行プロセス設計"
  parent_epic_branch: "docs/epic-338-implementation-phase-process"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/implementation-phase-process/process-design-doc.yaml"
    required: true
  issue:
    number: 339
    required: true
  pr:
    number: 340
    required: true
  diff:
    required: true
    compare_with: "docs/epic-338-implementation-phase-process"
  docs:
    - path: "docs/00_共通/プロジェクト管理/実装フェーズ実行プロセス設計書.md"
      required: true
      purpose: "作成成果物（新規正本）の内容確認"
    - path: "docs/00_共通/プロジェクト管理/プロジェクト工程定義.md"
      required: true
      purpose: "§8.1.2 相互参照の整合確認（06→07順序の正本）"
    - path: "docs/00_共通/AIエージェント運用/成果物一覧×Task Definition化方針書.md"
      required: true
      purpose: "§3.5 / §5 のTask化方針・Epic依存との整合確認"
    - path: "docs/00_共通/ディレクトリ構成/プロジェクトディレクトリ構成定義書.md"
      required: false
      purpose: "配置先（apps/packages/db/openapi）方針との整合確認"
    - path: "docs/00_共通/AIエージェント運用/Contract Gate運用設計書.md"
      required: false
      purpose: "Phase1→Phase4b の Contract Gate 前提との整合確認"
  files: []
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: false
    source: "not_required"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Task Definition（process-design-doc.yaml）の scope を満たしているか"
    - "out_of_scope（Phase0-4の実作業 / 既存正本の方針変更 / apps・packages・db・openapi 変更）が混在していないか"
    - "acceptance_criteria を満たしているか"
    - "PR本文に変更内容、検証結果、未実施事項が記載されているか"
    - "Human Review観点が明記されているか"
    - "Task Branch から develop へ直接 PR していないか（target は親 Epic Branch）"
    - "Task PR で Closes #<Task Issue番号> を使っていないか（Related to を使用）"
  docs:
    - "実装フェーズ実行プロセス設計書が docs/00_共通/プロジェクト管理/ に作成されているか"
    - "プロセスの考え方（原則）・段取り（Phase0-4 / 4a-4b）・Phase別Epic/Task分割表・L2実行の進め方が記載されているか"
    - "既存正本（工程定義 §8.1.2 / 成果物化方針書 §5）からの相互参照が追加され、重複記載が抑制されているか（正本関係を崩していないか）"
    - "工程定義の 06→07 順序・成果物化方針書 §3.5 / §5 と矛盾していないか"
    - "API契約3雛形（api-contract-spec / openapi-spec / api-implementation-spec）の役割分担・分離後モデル前提の記述が整合しているか"
    - "ドメイン用語・運用用語に揺れがないか（terminology.mdc）"
    - "相互参照リンクが有効か（リンク切れがないか）"
    - "Notion 転記を想定した Markdown 体裁になっているか"
  source: []
  tests:
    - "docs 作成 Task として必要な manual check（整合確認 / 用語整合 / リンク確認）が記載されているか"
    - "未実施テストの理由が PR 本文に記載されているか"
  api_contract: []
  db: []
  generated:
    - "generated ファイルを手動編集していないか（本Taskは generated 影響なし想定）"
  cicd: []
  security:
    - "secret や .env 実値が含まれていないか"
  branch:
    - "Task Branch から develop へ直接 PR していないか"
    - "PR target が親 Epic Branch（docs/epic-338-implementation-phase-process）であるか"
    - "Task PR で Related to #339 が使われているか"
    - "Task PR で Closes #339 を使っていないか"
  project:
    - "レビュー結果に応じた Status 更新意図が明確か"
  epic_scope:
    - "PR差分が親Epic [Epic]実装フェーズ実行プロセス設計 の epic_scope.allowed_paths 内に収まっているか"
    - "epic_scope.forbidden_paths（apps / packages / db / openapi）への変更が混入していないか"

acceptance_check:
  use_task_acceptance_criteria: true
  additional_criteria:
    - "PR本文に実施済み検証と未実施テストの理由が記載されている"
    - "Human Reviewで確認してほしい事項が明記されている"
    - "AI Review結果をPRコメントに記録できる形式になっている"
    - "親Epic の epic_scope.allowed_paths から外れる差分がない"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "修正必須事項がない"
      - "scope 外変更がない"
      - "epic_scope.allowed_paths から外れる差分がない"
      - "Human Review で確認すべき事項が整理されている"
  request_changes:
    conditions:
      - "同一 Branch で修正可能な docs 不備がある"
      - "PR 本文に必要情報が不足している"
      - "相互参照リンク切れ・用語揺れがある"
  needs_human_decision:
    conditions:
      - "新規設計書の配置先・文書名の妥当性判断が必要"
      - "Phase0-4のEpic/Task分割粒度・並列方針の妥当性判断が必要"
      - "分離後モデル前提が進行中 Epic の結論と整合するかの判断が必要"
  split_required:
    conditions:
      - "既存正本の方針変更が混在している"
      - "Phase0-4の実作業が混在している"
      - "epic_scope.allowed_paths から外れる差分がある"
  blocked:
    conditions:
      - "PR diff を確認できない"
      - "Task Definition が存在しない"
      - "Issue と PR の対応が不明"
      - "secret や .env 実値の混入が疑われる"
      - "親 Epic Issue / Branch が存在しない"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false
  ai_logs:
    required: false
    path: null

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "06_実装設計"
    status: "AI Review"
    priority: "medium"
    planned_start: null
    due_date: null

issue:
  unit: "task"
  type: "docs"
  area: "project"

dependencies:
  epics: []
  issues: []
  prs: []
  tasks:
    - "prompts/definitions/tasks/implementation-phase-process/process-design-doc.yaml"
  blocking: false

parallel_control:
  depends_on: []
  blocks: []
  exclusive_files: []
  conflict_risk: "low"
  generated_impact: false
  contract_impact: false
  db_impact: false

test_policy:
  required:
    - "AI Review"
    - "PR diff check"
    - "docs review"
    - "secret check"
  commands: []
  manual_checks:
    - "Task Definitionのacceptance_criteriaを満たしているか確認する"
    - "PR本文に検証結果・未実施理由・Human Review観点が記載されているか確認する"
    - "既存正本との整合・相互参照リンクを確認する"
  not_required:
    - "unit test"
  skip_reason:
    "unit test": "Review Definitionはレビュー条件であり、実装テストを直接実行する作業定義ではないため"

operation_logging:
  level: "minimal"
  ai_logs:
    intake: false
    incidents: false
    cross_cutting: false
    experiments: false
  reason: "通常PRレビューのため、レビュー結果はPRコメントを正本とする"

risk_points:
  - "プロセス設計書が既存正本の方針と矛盾し、重複・齟齬を生む可能性"
  - "相互参照リンク切れ・用語揺れの可能性"

human_decision_points:
  - "新規設計書の配置先・文書名が妥当か"
  - "Phase0-4のEpic/Task分割粒度・並列方針が個人開発運用に合うか"
  - "API契約の分離後モデル前提が進行中 contract-impl-task-separation Epic の結論と整合するか"

stop_conditions:
  - "PR が存在しない場合"
  - "Task Definition が存在しない場合"
  - "Issue と PR の対応が不明な場合"
  - "diff を確認できない場合"
  - "secret や .env 実値の混入が疑われる場合"
  - "Human Review を省略する前提になっている場合"
  - "AI が merge 判断を行う必要がある場合"
  - "PR差分が親Epic の epic_scope.allowed_paths から外れている場合"

notes:
  - "本Taskは docs 作成・統合 Task のため、source code 変更は scope 外とする"
  - "対応 Task Definition: prompts/definitions/tasks/implementation-phase-process/process-design-doc.yaml"
  - "対応 Epic Definition: prompts/definitions/epics/implementation-phase-process/epic.yaml"
  - "本 Review Definition は PR head（docs/task-339-process-design-doc）に含めることで、AI Review 自動dispatch（pickReviewDefinitionFromChangedFiles / workstream convention）が解決できるようにしている"
