schema_version: "1.0"
definition_type: "review"

review:
  id: "review-implementation-phase-process-epic-pr"
  title: "実装フェーズ実行プロセス設計 Epic PRレビュー"
  summary: "Epic #338 統合PR（develop 向け）の AI Review。子Task #339 の成果物統合・epic_scope・完了条件を横断確認する。"
  type: "epic_pr_review"
  status: "ready"

target:
  pr: null
  issue:
    number: 338
  task_definition: "prompts/definitions/epics/implementation-phase-process/epic.yaml"
  source_branch: "docs/epic-338-implementation-phase-process"
  target_branch: "develop"

review_scope:
  docs: true
  project_operation: true
  contract: false

input:
  task_definition:
    path: "prompts/definitions/epics/implementation-phase-process/epic.yaml"
    required: true
  issue:
    number: 338
    required: true

review_points:
  common:
    - "Epic Definition scope / out_of_scope を満たしているか"
    - "epic_scope.forbidden_paths（apps / packages / db / openapi）への変更がないか"
    - "子Task #339（PR #340）が Epic Branch に統合されているか"
    - "Task PR target=Epic Branch / Epic PR target=develop の方針が維持されているか"
    - "Closes #338 が PR 本文にあるか"
  docs:
    - "実装フェーズ実行プロセス設計書が docs/00_共通/プロジェクト管理/ に存在し、Phase0-4・L2実行方針が記載されているか"
    - "工程定義 §8.1.2 / 成果物化方針書 §3.5・§5 との相互参照が追加され、正本関係を崩していないか"
    - "用語整合（terminology.mdc）・リンク切れがないか"

result_policy:
  approve_for_human_review:
    conditions:
      - "Epic acceptance_criteria を満たしている"
      - "scope外変更が混入していない"
      - "子Task PR #340 が MERGED である"

status_policy:
  on_approve: "Human Review"
  on_request_changes: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"

issue:
  unit: "epic"
  type: "docs"
  area: "project"
