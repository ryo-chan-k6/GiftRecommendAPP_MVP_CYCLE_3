review_points:
  common:
    - "Task Definition scope 内か（apps/**・User Meaning 改善・TV-005/006・bench 計測定義再変更の非混入）"
    - "PR target が親 Epic Branch（docs/epic-1552-reco-perf-phase-output-slo-revision）か"
    - "Related to #1553 のみで Closes #1553 を使っていないか"
  docs:
    - "phase_output soft/hard が Human 最終確定として明示されているか（soft 500ms / hard 2,000ms）"
    - "新計測定義（#1545・response_built 除外）との整合が書かれているか"
    - "性能要件 §4.1 / §5 と MOD-RECO-001 §13.2 が整合しているか"
    - "旧案 A（3s/7s）が廃止・履歴として扱い、現行値と混同していないか"
    - "local mock / local secrets / GHA secrets 再計測根拠が記載されているか"
    - "AI 推奨のみを確定済みと誤記していないか（Human 確定の明示があるか）"
    - "Reason LLM refinement OFF 前提と再計測注意が残っているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance:
  human_review_required: true
  merge_by_ai: false

notes:
  - "Issue #1553 / Branch docs/task-1553-phase-output-slo-docs / PR #1559"
  - "GHA secrets run: https://github.com/ryo-chan-k6/GiftRecommendAPP_MVP_CYCLE_3/actions/runs/29898487164"
