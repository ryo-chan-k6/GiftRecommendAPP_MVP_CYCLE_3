schema_version: "1.0"
definition_type: "review"

review:
  id: "review-mvp-test-release-prep-epic-pr"
  title: "mvp-test-release-prep Epic PRレビュー"
  summary: "テスト・リリース移行準備 Epic PR（develop 向け）を AI Review する。Must docs 統合と secret 非露出・allowed_paths を横断確認する。"
  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

target:
  pr:
    number: 1676
  issue:
    number: 1646
  task_definition: "prompts/definitions/epics/mvp-test-release-prep/epic.yaml"
  source_branch: "docs/epic-1646-mvp-test-release-prep"
  target_branch: "develop"
  parent_epic_branch: null

commands:
  primary: "/review-pr"

agent:
  primary: "reviewer-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    security: null

review_scope:
  docs: true
  source: false
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

review_points:
  - "Epic Definition の scope / out_of_scope / allowed_paths を満たしているか"
  - "子 Must Task（受入環境・環境変数・システム／品質計画・トリアージ・判定CL）が統合されているか"
  - "docs/09_リリース を新規正本に使っていないか"
  - "secret 実値・.env 実値が含まれていないか（.env.example はダミーのみ）"
  - "apps/** / packages/contracts/** / db/** 変更がないか"
  - "PR target が develop、Closes #1646 があるか"
  - "Human 判断事項（必須／任意削り込み等）を AI が確定済み扱いにしていないか"
  - "本実施・本番デプロイを完了扱いにしていないか"

notes:
  - "PR 番号確定後に更新"
  - "Epic Issue #1646 / Branch docs/epic-1646-mvp-test-release-prep"
