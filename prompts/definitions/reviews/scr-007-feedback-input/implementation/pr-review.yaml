review_scope:
  docs: false
  source: true
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/scr-007-feedback-input/implementation.yaml"
    required: true
  issue:
    number: 1337
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1325-scr-007-feedback-input"
