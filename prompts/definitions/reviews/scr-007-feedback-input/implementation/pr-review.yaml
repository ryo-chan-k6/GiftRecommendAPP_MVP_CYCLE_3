review_points:
  common:
    - "Task Definition scope を満たしているか"
    - "PR target が親 Epic Branch か"
    - "Related to（Closes 禁止）か"
  source:
    - "item 粒度 Feedback と rating 自動マッピングか"
    - "API-PUB-004 呼び出しが妥当か"
    - "004/006 変更が導線有効化に閉じているか"
    - "reason UI を出していないか"
  tests:
    - "モーダル送信・エラーのテストがあるか"
    - "本番 network 非依存か"
  security:
    - "secret / sessionId に PII がないか"
    - "generated 手動編集がないか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "PR 作成後に target.pr を同期する"
