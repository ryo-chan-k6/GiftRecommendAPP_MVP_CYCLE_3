schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-007-feedback-input-screen-spec-pr"
  title: "SCR-007 Feedback入力表示画面仕様書 PRレビュー"
  summary: "SCR-007 画面仕様書 Task の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: 1327
  task_definition: "prompts/definitions/tasks/scr-007-feedback-input/screen-spec.yaml"
  source_branch: "docs/task-1327-scr-007-feedback-input-screen-spec"
  target_branch: "feature/epic-1325-scr-007-feedback-input"
  parent_epic_issue: "[Epic]SCR-007:Feedback入力表示"
  parent_epic_branch: "feature/epic-1325-scr-007-feedback-input"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/scr-007-feedback-input/screen-spec.yaml"
    required: true
  issue:
    number: 1327
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1325-scr-007-feedback-input"
  docs:
    - path: "docs/06_実装設計/web/SCR-007_Feedback入力表示画面仕様書.md"
      required: true
    - path: "docs/06_実装設計/api/API-PUB-004_Feedback送信API契約仕様書.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  common:
    - "Task Definition scope を満たしているか"
    - "PR target が親 Epic Branch か"
    - "Related to（Closes 禁止）か"
  docs:
    - "screen-spec テンプレート主要章があるか"
    - "画面一覧 / PUB-004 / Feedback定義書と矛盾しないか"
    - "MVP 範囲（item 系・reason 除外・rating 自動）が明確か"
  security:
    - "secret / .env 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "PR 作成後に target.pr を同期する"
