schema_version: "1.0"
definition_type: "review"

review:
  id: "review-mod-reco-005-feature-rule-postgres-epic-pr"
  title: "MOD-RECO-005 Feature Rule Postgres読み取り Epic PRレビュー"
  summary: "MOD-RECO-005 Feature Rule Postgres 読み取り Epic の develop 向け PR を AI Review する。"
  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  worktree_required: false

target:
  pr: null
  issue: 1753
  epic_definition: "prompts/definitions/epics/mod-reco-005-feature-rule-postgres/epic.yaml"
  source_branch: "feature/epic-1753-mod-reco-005-feature-rule-postgres"
  target_branch: "develop"
  parent_epic_issue: null
  parent_epic_branch: null

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: "test-ai"
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: true
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  epic_definition:
    path: "prompts/definitions/epics/mod-reco-005-feature-rule-postgres/epic.yaml"
    required: true
  issue:
    number: 1753
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "develop"
  docs:
    - path: "docs/06_実装設計/reco/MOD-RECO-005_External Condition Feature Estimatorモジュール仕様書.md"
      required: true
    - path: "docs/06_実装設計/database/relationship_rule_テーブル定義書.md"
      required: true
    - path: "docs/06_実装設計/database/occasion_rule_テーブル定義書.md"
      required: true
    - path: "docs/06_実装設計/database/pair_rule_テーブル定義書.md"
      required: true
    - path: "docs/06_実装設計/database/feature_integration_rule_テーブル定義書.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"

review_points:
  - "子 Task #1769 / PR #1770 の成果が Epic Branch に統合されているか"
  - "epic_scope.allowed_paths 外の変更が含まれていないか"
  - "forbidden_paths（migrations / seeds / contracts / apps 他）の変更がないか"
  - "PostgresFeatureRuleRepository が FeatureRuleRepositoryPort を満たすか"
  - "production のみ Postgres、DEFAULT は InMemory を維持しているか"
  - "semantic_config_version_id / is_active 絞り込みが正しいか"
  - "pair_rule 未定義時に None、integration 欠損/不整合時に DEFAULT フォールバックか"
  - "migration / seed / OpenAPI / generated 変更が混入していないか"
  - "unit test（repository / composition）が妥当か"
  - "PR target が develop か、Closes #1753 か"
  - "secret / .env 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消、または Human 判断待ちとして明示される"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれか"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "PR 番号確定後に target.pr / input.pr.number を更新する"
  - "stg での spouse 等の実測は Epic PR merge 後の Reco 再デプロイ後に Human が実施する"
