schema_version: "1.0"
definition_type: "review"

review:
  id: "review-phase3b-epic-a-definitions-bootstrap-pr"
  title: "Phase3b Epic A Definition bootstrap PRレビュー"
  summary: "Epic A + 子Task 7件の Epic/Task/Review Definition 作成 chore PR の AI Review"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: null
  base: "develop"
  target: "develop"
  worktree_required: true

target:
  pr: 650
  issue:
    number: 649
  task_definition: "prompts/definitions/tasks/phase3b/epic-a-definitions-bootstrap.yaml"
  source_branch: "chore/task-649-epic-a-definitions-bootstrap"
  target_branch: "develop"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"

review_scope:
  docs: false
  project_operation: true
  security: false
  cicd: false

input:
  task_definition:
    path: "prompts/definitions/tasks/phase3b/epic-a-definitions-bootstrap.yaml"
    required: true
  issue:
    number: 649
    required: true
  pr:
    number: 650
    required: true

review_points:
  - "Epic Definition に agentic_process / agent_test_operations（§2.5 / §2.6）が反映されているか"
  - "子 Task A1〜A7 の scope・依存・並列が Phase3 環境再計画と一致するか"
  - "Review Definition 3点セット（Epic + 各 Task + 本 bootstrap）が揃っているか"
  - "Epic B Definition が作成されていないか（defer）"
  - "epic_scope.allowed_paths / forbidden_paths の妥当性"
  - "secret 非含有"

acceptance_criteria_check:
  - id: "epic-a-def"
    text: "epics/local-dev-environment/epic.yaml 存在・§2.6 記載"
  - id: "child-tasks"
    text: "子 Task 7件 Definition 存在"
  - id: "reviews"
    text: "Task×7 + Epic×1 Review Definition 存在"
  - id: "no-epic-b"
    text: "Epic B 未作成"

human_review_points:
  - "Epic A 子 Task 分割粒度が L2 実行に適切か"
  - "allowed_paths が Phase4 実装時に不足しないか"

notes:
  - "Issue #649。PR 番号は /create-pr 後に反映"
