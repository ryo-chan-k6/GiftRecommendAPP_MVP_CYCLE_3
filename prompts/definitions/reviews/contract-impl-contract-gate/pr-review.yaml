schema_version: "1.0"
definition_type: "review"

review:
  id: "review-contract-impl-contract-gate-pr"
  title: "Contract Gate定義 PRレビュー"
  summary: "Contract Gate 正本・schema・記入例 Task の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

target:
  pr: 0
  issue: 311
  task_definition: "prompts/definitions/tasks/contract-impl-task-separation/contract-gate.yaml"
  source_branch: "refactor/task-311-contract-gate-definition"
  target_branch: "refactor/epic-300-contract-impl-task-separation"

review_scope:
  docs: true
  api_contract: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/contract-impl-task-separation/contract-gate.yaml"
    required: true
  issue:
    number: 311
    required: true

review_points:
  common:
    - "Task Definition scope を満たしているか"
    - "Contract Gate運用設計書・schema・記入例が整合しているか"
    - ".cursor/commands/** が変更されていないか（scope外）"
    - "Related to #311 が PR 本文にあるか"
  docs:
    - "Gate 必須チェックが検証可能に定義されているか"
  api_contract:
    - "OpenAPI 正本 packages/contracts/ と generated パスが Gate 条件に含まれるか"

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "scope 外変更がない"

status_policy:
  on_approve: "Human Review"
  on_request_changes: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"

issue:
  unit: "task"
  type: "refactor"
  area: "docs"
