schema_version: "1.0"
definition_type: "review"

review:
  id: "review-scr-001-top-screen-spec-pr"
  title: "SCR-001 トップ画面仕様書 PRレビュー"
  summary: "SCR-001 画面仕様書作成 Task の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: null
  issue: 1258
  task_definition: "prompts/definitions/tasks/scr-001-top/screen-spec.yaml"
  source_branch: "docs/task-1258-scr-001-top-screen-spec"
  target_branch: "feature/epic-1255-scr-001-top"
  parent_epic_issue: "[Epic]SCR-001:トップ画面"
  parent_epic_branch: "feature/epic-1255-scr-001-top"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: null
    contract: null
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: true
  source: false
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/scr-001-top/screen-spec.yaml"
    required: true
  issue:
    number: null
    required: true
  pr:
    number: null
    required: true
  diff:
    required: true
    compare_with: "feature/epic-1255-scr-001-top"
  docs:
    - path: "docs/06_実装設計/web/SCR-001_トップ画面画面仕様書.md"
      required: true
    - path: "docs/05_アプリケーション設計/アプリ/web/画面一覧.md"
      required: true
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables:
      - path: "prompts/templates/docs/screen-spec.md"
        required: true
        applies_to:
          - "docs/06_実装設計/web/SCR-001_トップ画面画面仕様書.md"

review_points:
  common:
    - "Task Definition scope を満たしているか"
    - "PR target が親 Epic Branch か"
    - "Related to（Closes 禁止）か"
  docs:
    - "screen-spec.md テンプレートに準拠しているか"
    - "画面一覧 SCR-001 と整合しているか"
    - "CTA → /recommendations が明示されているか"
    - "先行実装との突合が記載されているか"
  security:
    - "secret / .env 実値がないか"

acceptance_criteria:
  - "Blocker / Must が解消されている、または Human 判断待ちとして明示されている"
  - "結論が Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: false
    experiments: false
  reason: "通常の AI Review は PR コメントを正とする"

notes:
  - "実装用 Review は reviews/scr-001-top/implementation/pr-review.yaml。本ファイルは画面仕様書専用"
  - "PR / Issue 作成後に target 番号を同期する"
