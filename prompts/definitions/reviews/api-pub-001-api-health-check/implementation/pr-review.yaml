schema_version: "1.0"
definition_type: "review"

review:
  id: "review-api-pub-001-api-health-check-implementation-pr"
  title: "API-PUB-001 APIヘルスチェックエンドポイント実装 PRレビュー"
  summary: "API-PUB-001 health エンドポイント実装 Task（implementation.yaml）の PR を AI Review する"
  type: "task_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  no_branch: true
  name: null
  base: null
  target: null
  worktree_required: false

target:
  pr: 1165
  issue: 1157
  task_definition: "prompts/definitions/tasks/api-pub-001-api-health-check/implementation.yaml"
  source_branch: "feature/task-1157-api-pub-001-api-health-check-implementation"
  target_branch: "feature/epic-384-pub-001-api-health-check"
  parent_epic_issue: "[Epic]API-PUB-001:APIヘルスチェック"
  parent_epic_branch: "feature/epic-384-pub-001-api-health-check"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    split_required: "/start-task"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: null
    test: "test-ai"
    contract: "contract-ai"
    security: null
  next:
    fixer: "fixer-ai"
    human: "human-reviewer"

review_scope:
  docs: false
  source: true
  tests: true
  api_contract: true
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/tasks/api-pub-001-api-health-check/implementation.yaml"
    required: true
  issue:
    number: 1157
    required: true
  pr:
    number: 1165
    required: true
  diff:
    required: true
    compare_with: "feature/epic-384-pub-001-api-health-check"
  docs:
    - path: "docs/06_実装設計/api/API-PUB-001_APIヘルスチェックAPI実装仕様書.md"
      required: true
      purpose: "実装正本との整合"
    - path: "docs/06_実装設計/api/API-PUB-001_APIヘルスチェックAPI契約仕様書.md"
      required: true
      purpose: "契約外形との整合"

review_points:
  common:
    - "Task Definition scope / acceptance_criteria を満たしているか"
    - "PR target が親 Epic Branch か（develop 直向けでないか）"
  source:
    - "方針 A（プロセスのみ）から逸脱していないか"
    - "service=okuri / apiVersion=v1 / status=ok が契約と一致するか"
    - "依存個別結果を Response に載せていないか"
  tests:
    - "スモーク UT が契約外形・trace 伝播を検証しているか"
  api_contract:
    - "OpenAPI / generated 変更が混在していないか"
  security:
    - "secret / .env 実値が含まれていないか"
  epic_scope:
    - "差分が epic_scope.allowed_paths 内か（tests 追記含む）"

acceptance_check:
  use_task_acceptance_criteria: true

result_policy:
  approve_for_human_review:
    conditions:
      - "acceptance_criteria を満たしている"
      - "scope 外変更がない"
  request_changes:
    conditions:
      - "実装・テスト不備がある"
  needs_human_decision:
    conditions:
      - "方針 B 実装が混入している"
  split_required:
    conditions:
      - "OpenAPI / generated 変更が混在している"
  blocked:
    conditions:
      - "PR diff を確認できない"

status_policy:
  current_status: "AI Review"
  on_approve: "Human Review"
  on_request_changes: "In Progress"
  on_needs_human_decision: "Human Review"
  on_split_required: "In Progress"
  on_blocked: "In Progress"

outputs:
  pr_comment_template: "prompts/templates/review/ai-review-comment.md"
  slack_template: "prompts/templates/slack/ai-review-result.md"
  update_pr_body: false
  create_follow_up_issue: false

project:
  project_name: "Gift Recommendation Service MVP Cycle 3"
  fields:
    phase: "07_開発・単体テスト"
    status: "AI Review"
    priority: "high"

issue:
  unit: "task"
  type: "feature"
  area: "api"

notes:
  - "PR 作成後に target.pr / input.pr.number を更新する"
  - "対応 Issue: #1157"
