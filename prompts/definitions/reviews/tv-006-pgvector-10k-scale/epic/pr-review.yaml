  files:
    - "scripts/perf/pgvector_search_bench.py"
    - "scripts/perf/README.md"

review_points:
  - "Epic PR target が develop か"
  - "1万件超を含む件数別検索時間（p50/p95）が結果 doc にあるか"
  - "テストデータ / ephemeral DB・production 非使用が明示されているか"
  - "Go / Adjust / Block があるか"
  - "JOIN / Hard Filter 未計測が残リスクとして明示されているか"
  - "apps/** 本格改修の非混入"
  - "secret 実値が成果物に含まれていないか"
  - "Closes #1586 の扱い"

acceptance:
  human_review_required: true
  merge_by_ai: false

notes:
  - "merge 判断は Human"
  - "子 Task #1574 / Task PR #1587 は Epic 着済"
  - "正式 DB / Retrieval docs 反映は別 Epic #1591"
