  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  worktree_required: true

target:
  pr:
    number: 1593
  issue:
    number: 1586
  task_definition: "prompts/definitions/epics/tv-006-pgvector-10k-scale/epic.yaml"
  target_branch: "develop"
  parent_epic_issue: "[Epic]PoC:TV-006後続1万件超pgvector"
  parent_epic_branch: "spike/epic-1586-tv-006-pgvector-10k-scale"

commands:
  primary: "/review-pr"

agent:
  primary: "reviewer-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    security: true

review_scope:
  docs: true
  source: true
  tests: false
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  epic_definition:
    path: "prompts/definitions/epics/tv-006-pgvector-10k-scale/epic.yaml"
  docs:
    - "docs/90_PoC/技術検証結果/TV-006_後続_1万件超_pgvector検索性能検証結果.md"
    - "docs/90_PoC/技術検証結果/設計反映メモ_TV-006.md"
    - "docs/90_PoC/計画/TV要件・実施方針/TV-006_pgvector検索性能.md"
