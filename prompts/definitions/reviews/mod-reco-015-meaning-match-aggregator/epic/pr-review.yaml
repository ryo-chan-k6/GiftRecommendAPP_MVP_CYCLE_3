schema_version: "1.0"
definition_type: "review"

review:
  id: "review-mod-reco-015-meaning-match-aggregator-epic-pr"
  title: "MOD-RECO-015 Epic PRレビュー"
  summary: "MOD-RECO-015（Meaning Match Aggregator）Epic（Issue #904）の develop 向け統合 PR を AI Review する。子 Task 3件完了、epic_scope 整合、api 非含有を確認する。"
  type: "epic_pr_review"
  status: "draft"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "feature/epic-904-mod-reco-015-meaning-match-aggregator"
  base: "develop"
  target: "develop"
  worktree_required: false

target:
  pr: 917
  issue:
    number: 904
  task_definition: "prompts/definitions/epics/mod-reco-015-meaning-match-aggregator/epic.yaml"
  source_branch: "feature/epic-904-mod-reco-015-meaning-match-aggregator"
  target_branch: "develop"

commands:
  primary: "/review-pr"
  allowed:
    - "/review-pr"
    - "/fix-review-comments"
    - "/summarize-work"
  next:
    approve_for_human_review: "Human Review"
    request_changes: "/fix-review-comments"
    needs_human_decision: "Human Decision"
    blocked: null

agent:
  primary: "reviewer-ai"
  support:
    - "support-ai"
  specialist:
    docs: "docs-reviewer-ai"
    test: "test-ai"
    contract: null
    security: null

review_scope:
  docs: true
  source: true
  tests: true
  api_contract: false
  db: false
  generated: false
  cicd: false
  security: true
  project_operation: true

input:
  task_definition:
    path: "prompts/definitions/epics/mod-reco-015-meaning-match-aggregator/epic.yaml"
    required: true
  issue:
    number: 904
    required: true
  pr:
    number: 917
    required: true
  diff:
    required: true
    compare_with: "develop"
  docs:
    - path: "docs/06_実装設計/reco/MOD-RECO-015_Meaning Match Aggregatorモジュール仕様書.md"
      required: true
      purpose: "Epic 成果物正本（develop 上は #908 版）"
  test_results:
    required: true
    source: "pr_body"
  ci_results:
    required: true
    source: "pr_checks"
  templates:
    review_outputs:
      pr_comment: "prompts/templates/review/ai-review-comment.md"
      slack: "prompts/templates/slack/ai-review-result.md"
    deliverables: []

review_points:
  common:
    - "Epic Definition scope / acceptance_criteria を満たしているか"
    - "子 Task 3件（module-spec / implementation / unit-test）が Epic Branch に統合済みか"
    - "Epic PR target が develop であるか"
  docs:
    - "MOD-RECO-015 モジュール仕様書が develop と整合しているか"
    - "epic_scope.allowed_paths 内に差分が収まっているか"
  source:
    - "meaning-match-aggregator モジュール本体が仕様書と整合しているか"
    - "apps/reco/src/reco/api/** を変更していないか"
    - "forbidden_paths 外モジュールを変更していないか"
  tests:
    - "unit test が Epic Branch 上で CI 成功しているか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "Orchestrator スタブ差し替え未実施のまま Epic merge してよいか"
  - "モジュール仕様書が develop 上 #908 版のみで Epic PR diff に含まれない点"

risk_points:
  - "develop 取り込み（#906/#907/#908）後の upstream I/F 前提"
  - "Orchestrator wiring Task との後続整合"

notes:
  - "対応 Epic Definition: prompts/definitions/epics/mod-reco-015-meaning-match-aggregator/epic.yaml"
  - "子 Task: #905 PR #909、#913 PR #914、#915 PR #916"
