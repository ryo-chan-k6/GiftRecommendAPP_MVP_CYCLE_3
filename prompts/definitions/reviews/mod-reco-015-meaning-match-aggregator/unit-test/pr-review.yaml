review_points:
  common:
    - "Task Definition scope / acceptance_criteria を満たしているか"
    - "out_of_scope（integration / Orchestrator 統合 / 機能追加）が混在していないか"
    - "Task PR target が親 Epic Branch であるか"
  tests:
    - "モジュール仕様書 §14 unit 観点がテストでカバーされているか"
    - "PR 本文に観点とテストケースの対応表があるか"
    - "`cd apps/reco && python -m pytest tests/unit/ -q` が PR 本文または CI で成功しているか"
    - "本番 DB / 外部 API / secret に依存していないか"
  security:
    - "secret / .env 実値が含まれていないか"

acceptance_criteria:
  review_outputs:
    - "AI Review 結論（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）"
    - "Blocker / Must / Should / Question の整理"
    - "Human Review 観点の明示"

human_decision_points:
  - "§14 未カバー観点を許容する場合の理由と後続 Task 化要否"

risk_points:
  - "実装 PR #914 の最小スモークと §14 網羅の重複・不足"
  - "テスト成立のためのモジュール本体最小修正の範囲"

notes:
  - "対応 Task Definition: prompts/definitions/tasks/mod-reco-015-meaning-match-aggregator/unit-test.yaml"
  - "前提: #913 PR #914 Epic merge 済み"
