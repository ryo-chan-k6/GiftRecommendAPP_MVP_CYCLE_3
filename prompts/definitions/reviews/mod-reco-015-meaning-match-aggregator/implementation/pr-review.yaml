  type: "task_pr_review"
  status: "draft"

work_mode: "ai-agent"

branch:
  no_branch: false
  name: "feature/task-913-mod-reco-015-meaning-match-aggregator-implementation"
  base: "feature/epic-904-mod-reco-015-meaning-match-aggregator"
