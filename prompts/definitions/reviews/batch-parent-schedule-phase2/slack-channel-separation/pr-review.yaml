  - "PR targetが親Epic Branchか"
  - "Related to Task Issueを使いClosesを使っていないか"

notes:
  - "Humanが新チャンネル作成・Bot招待・Repository Variable登録を完了済み"
  - "GitHub Variables / Secretsの値変更は本Taskのout of scope"
