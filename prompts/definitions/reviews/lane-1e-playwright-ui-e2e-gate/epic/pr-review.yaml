schema_version: "1.0"
definition_type: "review"

review:
  id: "review-lane-1e-playwright-ui-e2e-gate-epic"
  title: "Playwright UI E2E CIゲート化 Epic PRレビュー"
  summary: "UI E2E S1 を GHA で自動実行する workflow 追加 Epic PR を AI Review する"
  type: "epic_pr_review"
  status: "ready"

work_mode: "ai-agent"

branch:
  worktree_required: true

target:
  issue:
    number: 1464
  task_definition: "prompts/definitions/epics/lane-1e-playwright-ui-e2e-gate/epic.yaml"
  source_branch: "test/epic-1464-lane-1e-playwright-ui-e2e-gate"
  target_branch: "develop"

commands:
  primary: "/review-pr"

agent:
  primary: "reviewer-ai"
  specialist:
    test: "test-ai"

review_scope:
  project_operation: true
  security: true
  test: true

review_points:
  - "workflow が既存 test-system.yml のスタック起動と整合しているか"
  - "S1 skip を fail にする検証が有効か（false green 防止）"
  - "secret 実値を含まないか（mock のみ / permissions: contents: read）"
  - "必須(required)化を AI が独断で行っていないか（Human 判断として明示）"
  - "apps/api / reco / batch / OpenAPI / migration に変更がないか"

acceptance_criteria:
  - "結論が approve_for_human_review / request_changes / needs_human_decision のいずれかである"

operation_logging:
  level: "standard"
  ai_logs:
    intake: false
    incidents: true
    cross_cutting: true
    experiments: false
  reason: "CI/CD 横断影響（workflow 追加）"

notes:
  - "Epic PR（#1464 → develop）を対象とする。PR 番号は作成後に確定"
