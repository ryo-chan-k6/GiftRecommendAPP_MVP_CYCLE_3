name: Perf Feasibility Reco

# Layer2 Reco 性能フィジビリティ（CI・CD方針書 §12.2 / Epic #759 poc-harness）。
# TV-007 向け bench を workflow_dispatch のみで実行する。通常 PR CI（ci.yml）とは分離。

run-name: "perf-feasibility-reco · ${{ github.event_name }} · ${{ inputs.pipeline_mode }}"

on:
  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: "計測モード（Phase1: skeleton / Phase2: live は #260 後）"
        required: true
        default: skeleton
        type: choice
        options:
          - skeleton
          - live
      iterations:
        description: "計測繰り返し回数"
        required: true
        default: "50"
        type: string
      warmup:
        description: "ウォームアップ回数（集計対象外）"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: perf-feasibility-reco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reco-perf-bench:
    runs-on: ubuntu-latest
    env:
      PIPELINE_MODE: ${{ inputs.pipeline_mode }}
      ITERATIONS: ${{ inputs.iterations }}
      WARMUP: ${{ inputs.warmup }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install "$(tr -d '[:space:]' < .python-version)"

      - name: Prepare reco Python environment
        run: ./scripts/dev/setup-python-reco.sh

      - name: Run reco pipeline bench
        working-directory: apps/reco
        run: |
          uv run python ../../scripts/perf/reco_pipeline_bench.py \
            --mode "${PIPELINE_MODE}" \
            --iterations "${ITERATIONS}" \
            --warmup "${WARMUP}" \
            --output-dir ../../scripts/perf/output

      - name: Write job summary
        if: always() && hashFiles('scripts/perf/output/summary.md') != ''
        run: cat scripts/perf/output/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench artifacts
        if: always() && hashFiles('scripts/perf/output/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: reco-perf-bench-${{ github.run_id }}
          path: scripts/perf/output/
          if-no-files-found: error
