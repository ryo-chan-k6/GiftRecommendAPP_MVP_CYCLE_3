name: PR Created Status Sync

run-name: "pr-created · pr-open · PR #${{ github.event.pull_request.number || github.event.inputs.pr_number }}"

on:
  pull_request:
    types:
      - opened
  workflow_dispatch:
    inputs:
      pr_number:
        description: 対象PR番号
        required: true
      dry_run:
        description: trueの場合は更新せずログのみ出力する
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-created-status-and-slack-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  sync-status-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Project Status and notify Slack
        id: sync-status
        uses: actions/github-script@v8
        env:
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_DEVOPS: ${{ vars.SLACK_CHANNEL_ID_DEVOPS }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require("path");
            const slack = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/slack-notify.cjs"));
            const { createProjectV2Client } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github/scripts/project-v2-utils.cjs",
            ));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repositoryFullName = `${owner}/${repo}`;
            const projectOwner = process.env.PROJECT_OWNER || owner;
            const projectNumber = Number(process.env.PROJECT_NUMBER || "4");
            const dryRun =
              context.eventName === "workflow_dispatch" &&
              String(context.payload.inputs?.dry_run || "") === "true";
            const projectV2 = createProjectV2Client({
              github,
              projectOwner,
              projectNumber,
              dryRun,
            });

            async function markDispatchAiReview(prNumber, issueNumber, pr) {
              if (dryRun) {
                core.setOutput("dispatch_ai_review", "false");
                return;
              }
              core.setOutput("dispatch_ai_review", "true");
              core.setOutput("pr_number", String(prNumber));
              core.setOutput("issue_number", String(issueNumber));
              core.setOutput("pr_head_sha", pr.head.sha);
              core.setOutput("pr_head_ref", pr.head.ref);
            }

            let prNumber;
            if (context.eventName === "workflow_dispatch") {
              prNumber = Number(context.payload.inputs.pr_number);
            } else {
              const pr = context.payload.pull_request;
              if (pr.head?.repo?.full_name !== repositoryFullName) {
                core.info("PR from fork is out of scope for initial Slack notification workflow; skipped.");
                return;
              }
              prNumber = pr.number;
            }
            if (!prNumber) {
              core.setFailed("PR number is missing.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.head?.repo?.full_name !== repositoryFullName) {
              core.info("PR from fork is out of scope for initial Slack notification workflow; skipped.");
              return;
            }

            const issueNumber = slack.resolveStatusSyncTargetIssue({
              prBody: pr.body || "",
              headRef: pr.head?.ref || "",
            });
            if (!issueNumber) {
              core.setFailed("PR本文から対象Issueを解決できませんでした。Task Branch では `## 2. 対象Issue` に `Related to #<Task Issue番号>` を記載してください。");
              return;
            }

            const project = await projectV2.loadProject();
            if (!project) {
              core.setFailed("ProjectV2を解決できませんでした。");
              return;
            }
            const id = await projectV2.getRepositoryIssueNodeId(owner, repo, issueNumber);
            if (!id) {
              core.setFailed(`Issue #${issueNumber} のNode IDを解決できませんでした。`);
              return;
            }
            const itemId = await projectV2.ensureProjectItem(project, id);
            if (!itemId) {
              core.setFailed(`Issue #${issueNumber} のProject itemを解決できませんでした。`);
              return;
            }

            if (dryRun) {
              core.info("[dry_run] update status: AI Review");
            } else {
              await projectV2.updateStatus(project, itemId, "AI Review");
            }

            const channel = process.env.SLACK_CHANNEL_ID_DEVOPS || "";
            const threadKey = slack.buildThreadKey({ owner, repo, kind: "pr", number: prNumber });
            const comments = await slack.listIssueComments({ github, owner, repo, issueNumber: prNumber });
            const threadTs = slack.findThreadTsFromComments(comments, threadKey, channel);
            const text = slack.buildSlackText({
              level: "info",
              title: "PRを作成しました",
              summary: pr.title,
              fields: {
                PR: `#${prNumber}`,
                Issue: `#${issueNumber}`,
                Branch: pr.head.ref,
                Target: pr.base.ref,
                "Next Status": "AI Review",
              },
              links: {
                PR: pr.html_url,
                Issue: `${context.serverUrl}/${repositoryFullName}/issues/${issueNumber}`,
              },
              humanAction: "Definition Run Harness により AI Review を自動実行します。",
            });
            const result = await slack.postSlackMessage({
              token: process.env.SLACK_BOT_TOKEN,
              channel,
              text,
              threadTs,
              dryRun,
            });
            if (result.ok && result.ts && !threadTs) {
              await slack.upsertThreadMarkerComment({
                github,
                owner,
                repo,
                issueNumber: prNumber,
                threadKey,
                channel: result.channel || channel,
                ts: result.ts,
                comments,
                dryRun,
              });
            }

            if (!dryRun) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `Project Status更新意図: Issue #${issueNumber} を \`AI Review\` へ更新しました。`,
              });
            }

            await core.summary
              .addHeading("PR作成時 Status / Slack通知")
              .addRaw(`PR: #${prNumber}\n\nIssue: #${issueNumber}\n\nStatus: \`AI Review\`\n\nSlack: ${result.ok ? "ok" : "failed"}\n`)
              .addRaw(result.error ? `\nSlack error: \`${result.error}\`\n` : "")
              .write();
            if (!result.ok) {
              core.warning(`Slack notification failed: ${result.error || "unknown"}`);
            }

            await markDispatchAiReview(prNumber, issueNumber, pr);

      - name: Checkout PR head for Review Definition resolution
        if: steps.sync-status.outputs.dispatch_ai_review == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.sync-status.outputs.pr_head_sha }}

      - name: Setup Node
        if: steps.sync-status.outputs.dispatch_ai_review == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Dispatch AI Review via Definition Run Harness
        if: steps.sync-status.outputs.dispatch_ai_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node .github/scripts/dispatch-review-pr-harness.cjs \
            --repository "${{ github.repository }}" \
            --pr "${{ steps.sync-status.outputs.pr_number }}" \
            --issue "${{ steps.sync-status.outputs.issue_number }}" \
            --requested-by "pr-created-status-sync" \
            --context "pr-created"
