name: Batch Rakuten Item Pseudo Diff

# BATCH-003 楽天商品疑似差分取得（独立子 workflow）
# 正本: BATCH-003 バッチ仕様書 §18.1 — workflow_call / workflow_dispatch
# C3: environment stg + live Rakuten / live DB / live Object Storage

on:
  workflow_call:
    inputs:
      target_genre_ids:
        description: "Comma-separated genre IDs (empty = default fetch_plan placeholder)"
        required: false
        type: string
        default: ""
      keywords:
        description: "Comma-separated keywords (optional)"
        required: false
        type: string
        default: ""
      batch_run_id:
        description: "Shared pipeline batch_run_id (UUID)"
        required: false
        type: string
        default: ""
      job_run_id:
        description: "Optional leaf job_run_id override (UUID). Empty = generate new UUID"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      target_genre_ids:
        description: "Comma-separated genre IDs (empty = default fetch_plan placeholder)"
        required: false
        type: string
        default: ""
      keywords:
        description: "Comma-separated keywords (optional)"
        required: false
        type: string
        default: ""
      batch_run_id:
        description: "Shared pipeline batch_run_id (UUID)"
        required: false
        type: string
        default: ""
      job_run_id:
        description: "Optional leaf job_run_id override (UUID). Empty = generate new UUID"
        required: false
        type: string
        default: ""

concurrency:
  group: batch-rakuten-item-pseudo-diff
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  item-pseudo-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: stg
    env:
      DATABASE_URL: ${{ secrets.STG_DATABASE_URL }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      BATCH_RAKUTEN_LIVE: "1"
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
      OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
      BATCH_OBJECT_STORAGE_LIVE: ${{ vars.BATCH_OBJECT_STORAGE_LIVE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install "$(tr -d '[:space:]' < .python-version)"

      - name: Setup batch Python env
        run: bash ./scripts/dev/setup-python-batch.sh

      - name: Resolve run ids
        id: run_ids
        run: |
          PIPELINE_INPUT="${{ inputs.batch_run_id }}"
          JOB_INPUT="${{ inputs.job_run_id }}"
          if [ -n "$PIPELINE_INPUT" ]; then
            echo "batch_run_id=$PIPELINE_INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$JOB_INPUT" ]; then
            echo "batch_run_id=$JOB_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "batch_run_id=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PIPELINE_INPUT" ]; then
            if [ -n "$JOB_INPUT" ] && [ "$JOB_INPUT" != "$PIPELINE_INPUT" ]; then
              echo "job_run_id=$JOB_INPUT" >> "$GITHUB_OUTPUT"
            else
              echo "job_run_id=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
            fi
          elif [ -n "$JOB_INPUT" ]; then
            echo "job_run_id=$JOB_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "job_run_id=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
          fi

      - name: Run BATCH-003 live
        # Secrets must never be printed.
        working-directory: apps/batch
        run: |
          GENRE_ARGS=()
          if [ -n "${{ inputs.target_genre_ids }}" ]; then
            GENRE_ARGS+=(--genre-ids "${{ inputs.target_genre_ids }}")
          fi
          KEYWORD_ARGS=()
          if [ -n "${{ inputs.keywords }}" ]; then
            KEYWORD_ARGS+=(--keywords "${{ inputs.keywords }}")
          fi
          uv run python -m batch.application.item_pseudo_diff \
            --live-rakuten \
            --live-object-storage \
            --job-run-id "${{ steps.run_ids.outputs.job_run_id }}" \
            --batch-run-id "${{ steps.run_ids.outputs.batch_run_id }}" \
            "${GENRE_ARGS[@]}" \
            "${KEYWORD_ARGS[@]}"
