name: PR Merged Done Sync

run-name: "pr-merged · pr-closed · PR #${{ github.event.pull_request.number || github.event.inputs.pr_number }} · ${{ github.event_name == 'workflow_dispatch' && 'manual' || (github.event.pull_request.merged && 'merged' || 'closed') }}"

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: 対象PR番号
        required: true
      dry_run:
        description: trueの場合は更新せずログのみ出力する
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-merged-done-and-slack-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  done-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Done and notify Slack
        uses: actions/github-script@v8
        env:
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_DEVOPS: ${{ vars.SLACK_CHANNEL_ID_DEVOPS }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require("path");
            const slack = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/slack-notify.cjs"));
            const { createProjectV2Client } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github/scripts/project-v2-utils.cjs",
            ));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repositoryFullName = `${owner}/${repo}`;
            const serverUrl = process.env.GITHUB_SERVER_URL || "https://github.com";
            const projectOwner = process.env.PROJECT_OWNER || owner;
            const projectNumber = Number(process.env.PROJECT_NUMBER || "4");
            const dryRun =
              context.eventName === "workflow_dispatch" &&
              String(context.payload.inputs?.dry_run || "") === "true";
            const projectV2 = createProjectV2Client({
              github,
              projectOwner,
              projectNumber,
              dryRun,
            });

            function todayJstYmd(date = new Date()) {
              return new Intl.DateTimeFormat("en-CA", {
                timeZone: "Asia/Tokyo",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
              }).format(date);
            }

            let prNumber;
            if (context.eventName === "workflow_dispatch") {
              prNumber = Number(context.payload.inputs.pr_number);
            } else {
              const eventPr = context.payload.pull_request;
              if (!eventPr?.merged) {
                core.info("PR was closed without merge; skipped.");
                return;
              }
              if (eventPr.head?.repo?.full_name !== repositoryFullName) {
                core.info("PR from fork is out of scope for initial Slack notification workflow; skipped.");
                return;
              }
              prNumber = eventPr.number;
            }
            if (!prNumber) {
              core.setFailed("PR number is missing.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.head?.repo?.full_name !== repositoryFullName) {
              core.info("PR from fork is out of scope for initial Slack notification workflow; skipped.");
              return;
            }
            if (!pr.merged) {
              core.setFailed("PRがmerge済みではないため、Done更新とIssue closeを停止しました。");
              return;
            }
            const issueNumber = slack.resolveStatusSyncTargetIssue({
              prBody: pr.body || "",
              headRef: pr.head?.ref || "",
            });
            if (!issueNumber) {
              core.setFailed("PR本文から対象Issueを解決できませんでした。`Related to #<Task Issue番号>` または `Closes #<Epic Issue番号>` を記載してください。");
              return;
            }

            const project = await projectV2.loadProject();
            if (!project) {
              core.setFailed("ProjectV2を解決できませんでした。");
              return;
            }
            const id = await projectV2.getRepositoryIssueNodeId(owner, repo, issueNumber);
            if (!id) {
              core.setFailed(`Issue #${issueNumber} のNode IDを解決できませんでした。`);
              return;
            }
            const itemId = await projectV2.ensureProjectItem(project, id);
            if (!itemId) {
              core.setFailed(`Issue #${issueNumber} のProject itemを解決できませんでした。`);
              return;
            }

            const actualEnd = todayJstYmd();
            if (dryRun) {
              core.info("[dry_run] update status: Done");
              core.info(`[dry_run] update Actual End: ${actualEnd}`);
            } else {
              await projectV2.updateStatus(project, itemId, "Done");
              await projectV2.updateDate(project, itemId, "Actual End", actualEnd);
            }
            if (!dryRun) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                state: "closed",
              });
            }

            const channel = process.env.SLACK_CHANNEL_ID_DEVOPS || "";
            const threadKey = slack.buildThreadKey({ owner, repo, kind: "pr", number: prNumber });
            const comments = await slack.listIssueComments({ github, owner, repo, issueNumber: prNumber });
            const threadTs = slack.findThreadTsFromComments(comments, threadKey, channel);
            const text = slack.buildSlackText({
              level: "info",
              title: "PRがmergeされ、タスクが完了しました",
              summary: pr.title,
              fields: {
                PR: `#${prNumber}`,
                Issue: `#${issueNumber}`,
                Branch: pr.head.ref,
                Status: "Done",
                "Actual End": actualEnd,
              },
              links: {
                PR: pr.html_url,
                Issue: `${serverUrl}/${repositoryFullName}/issues/${issueNumber}`,
              },
            });
            const result = await slack.postSlackMessage({
              token: process.env.SLACK_BOT_TOKEN,
              channel,
              text,
              threadTs,
              dryRun,
            });

            await core.summary
              .addHeading("PR merge Done / Slack通知")
              .addRaw(`PR: #${prNumber}\n\nIssue: #${issueNumber}\n\nStatus: \`Done\`\n\nActual End: \`${actualEnd}\`\n\nSlack: ${result.ok ? "ok" : "failed"}\n`)
              .addRaw(result.error ? `\nSlack error: \`${result.error}\`\n` : "")
              .write();
            if (!result.ok) {
              core.warning(`Slack notification failed: ${result.error || "unknown"}`);
            }

