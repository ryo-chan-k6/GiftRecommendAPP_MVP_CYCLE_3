name: Batch Item Embedding

# BATCH-015 Item Embedding生成（独立子 workflow）
# 正本: BATCH-015 バッチ仕様書 §18.1 No.10 — workflow_call / workflow_dispatch（cron なし）
# 親 meaning-generation チェーン接続は本 Epic 外

on:
  workflow_call:
    inputs:
      job_run_id:
        description: "Optional batch_run_id override"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max queue rows (default 1000)"
        required: false
        type: string
        default: "1000"
      source:
        description: "source filter (default rakuten)"
        required: false
        type: string
        default: "rakuten"
      queue_batch_size:
        description: "Claim/process batch size (default 100)"
        required: false
        type: string
        default: "100"
      item_ids:
        description: "Comma-separated item_id list"
        required: false
        type: string
        default: ""
      queue_ids:
        description: "Comma-separated item_generation_queue_id list"
        required: false
        type: string
        default: ""
      live_embedding:
        description: "Enable real OpenAI Embeddings HTTP"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      job_run_id:
        description: "Optional batch_run_id override"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max queue rows (default 1000)"
        required: false
        type: string
        default: "1000"
      source:
        description: "source filter (default rakuten)"
        required: false
        type: string
        default: "rakuten"
      queue_batch_size:
        description: "Claim/process batch size (default 100)"
        required: false
        type: string
        default: "100"
      item_ids:
        description: "Comma-separated item_id list"
        required: false
        type: string
        default: ""
      queue_ids:
        description: "Comma-separated item_generation_queue_id list"
        required: false
        type: string
        default: ""
      live_embedding:
        description: "Enable real OpenAI Embeddings HTTP"
        required: false
        type: boolean
        default: false

concurrency:
  group: batch-item-embedding
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  item-embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stg
    env:
      DATABASE_URL: ${{ secrets.STG_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install "$(tr -d '[:space:]' < .python-version)"

      - name: Setup batch Python env
        run: bash ./scripts/dev/setup-python-batch.sh

      - name: Resolve job_run_id
        id: run_id
        run: |
          INPUT_ID="${{ inputs.job_run_id }}"
          if [ -n "$INPUT_ID" ]; then
            python3 -c 'import sys, uuid; uuid.UUID(sys.argv[1])' "$INPUT_ID"
            echo "value=$INPUT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
          fi

      - name: Run BATCH-015 on stg DB
        # Embedding は明示 live のみ実 API。既定 false は scaffold client + live DB。
        # IF-VEC-BATCH-001 = item_embedding Upsert。IF-EXT-005 = Embedding API（scaffold / 明示 live）。
        # IF-DB-BATCH-015 = BATCH-014 handoff 消費のみ（hash 再算出禁止）。
        # IF-DB-BATCH-016 / BATCH-016 は触らない。Queue 終端 succeeded は本 Batch。
        working-directory: apps/batch
        run: |
          MAX_ARGS=()
          if [ -n "${{ inputs.max_items }}" ]; then
            MAX_ARGS+=(--max-items "${{ inputs.max_items }}")
          fi
          SOURCE_ARGS=()
          if [ -n "${{ inputs.source }}" ]; then
            SOURCE_ARGS+=(--source "${{ inputs.source }}")
          fi
          BATCH_ARGS=()
          if [ -n "${{ inputs.queue_batch_size }}" ]; then
            BATCH_ARGS+=(--queue-batch-size "${{ inputs.queue_batch_size }}")
          fi
          ITEM_ARGS=()
          if [ -n "${{ inputs.item_ids }}" ]; then
            ITEM_ARGS+=(--item-ids "${{ inputs.item_ids }}")
          fi
          QUEUE_ARGS=()
          if [ -n "${{ inputs.queue_ids }}" ]; then
            QUEUE_ARGS+=(--queue-ids "${{ inputs.queue_ids }}")
          fi
          LIVE_ARGS=()
          if [ "${{ inputs.live_embedding }}" = "true" ]; then
            LIVE_ARGS+=(--live-embedding)
          fi
          uv run python -m batch.application.item_embedding \
            --job-run-id "${{ steps.run_id.outputs.value }}" \
            "${MAX_ARGS[@]}" \
            "${SOURCE_ARGS[@]}" \
            "${BATCH_ARGS[@]}" \
            "${ITEM_ARGS[@]}" \
            "${QUEUE_ARGS[@]}" \
            "${LIVE_ARGS[@]}"
