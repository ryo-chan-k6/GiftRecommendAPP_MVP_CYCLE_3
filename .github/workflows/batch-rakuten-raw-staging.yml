name: Batch Rakuten Raw Staging

# BATCH-005 Raw取込・Staging変換（独立子 workflow）
# 正本: BATCH-005 バッチ仕様書 §18.1 No.1 — workflow_call / workflow_dispatch
# C3: environment stg + live DB / live Object Storage

on:
  workflow_call:
    inputs:
      batch_run_id:
        description: "Shared pipeline batch_run_id (UUID)"
        required: false
        type: string
        default: ""
      job_run_id:
        description: "Optional leaf job_run_id override (UUID). Empty = generate new UUID"
        required: false
        type: string
        default: ""
      max_raw:
        description: "Max raw_product_metadata rows to stage (default 1000)"
        required: false
        type: string
        default: "1000"
      source_api:
        description: "Comma-separated source_api filter (default item_search)"
        required: false
        type: string
        default: "item_search"
      raw_metadata_ids:
        description: "Comma-separated raw_metadata_id list (subset / re-run)"
        required: false
        type: string
        default: ""
      force:
        description: "Re-stage even when import_status is staged/imported (true/false)"
        required: false
        type: string
        default: "false"
  workflow_dispatch:
    inputs:
      batch_run_id:
        description: "Shared pipeline batch_run_id (UUID)"
        required: false
        type: string
        default: ""
      job_run_id:
        description: "Optional leaf job_run_id override (UUID). Empty = generate new UUID"
        required: false
        type: string
        default: ""
      max_raw:
        description: "Max raw_product_metadata rows to stage (default 1000)"
        required: false
        type: string
        default: "1000"
      source_api:
        description: "Comma-separated source_api filter (default item_search)"
        required: false
        type: string
        default: "item_search"
      raw_metadata_ids:
        description: "Comma-separated raw_metadata_id list (subset / re-run)"
        required: false
        type: string
        default: ""
      force:
        description: "Re-stage even when import_status is staged/imported (true/false)"
        required: false
        type: string
        default: "false"

concurrency:
  group: batch-rakuten-raw-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  raw-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: stg
    env:
      DATABASE_URL: ${{ secrets.STG_DATABASE_URL }}
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
      OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
      BATCH_OBJECT_STORAGE_LIVE: ${{ vars.BATCH_OBJECT_STORAGE_LIVE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install "$(tr -d '[:space:]' < .python-version)"

      - name: Setup batch Python env
        run: bash ./scripts/dev/setup-python-batch.sh

      - name: Resolve run ids
        id: run_ids
        run: |
          PIPELINE_INPUT="${{ inputs.batch_run_id }}"
          JOB_INPUT="${{ inputs.job_run_id }}"
          if [ -n "$PIPELINE_INPUT" ]; then
            echo "batch_run_id=$PIPELINE_INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$JOB_INPUT" ]; then
            echo "batch_run_id=$JOB_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "batch_run_id=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PIPELINE_INPUT" ]; then
            if [ -n "$JOB_INPUT" ] && [ "$JOB_INPUT" != "$PIPELINE_INPUT" ]; then
              echo "job_run_id=$JOB_INPUT" >> "$GITHUB_OUTPUT"
            else
              echo "job_run_id=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
            fi
          elif [ -n "$JOB_INPUT" ]; then
            echo "job_run_id=$JOB_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "job_run_id=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
          fi

      - name: Run BATCH-005 live
        # Secrets must never be printed.
        working-directory: apps/batch
        run: |
          MAX_ARGS=()
          if [ -n "${{ inputs.max_raw }}" ]; then
            MAX_ARGS+=(--max-raw "${{ inputs.max_raw }}")
          fi
          API_ARGS=()
          if [ -n "${{ inputs.source_api }}" ]; then
            API_ARGS+=(--source-api "${{ inputs.source_api }}")
          fi
          ID_ARGS=()
          if [ -n "${{ inputs.raw_metadata_ids }}" ]; then
            ID_ARGS+=(--raw-metadata-ids "${{ inputs.raw_metadata_ids }}")
          fi
          FORCE_ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARGS+=(--force)
          fi
          uv run python -m batch.application.raw_staging \
            --live-object-storage \
            --job-run-id "${{ steps.run_ids.outputs.job_run_id }}" \
            --batch-run-id "${{ steps.run_ids.outputs.batch_run_id }}" \
            "${MAX_ARGS[@]}" \
            "${API_ARGS[@]}" \
            "${ID_ARGS[@]}" \
            "${FORCE_ARGS[@]}"
