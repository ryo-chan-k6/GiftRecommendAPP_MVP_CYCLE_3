name: Test System (Layer2)

# Layer2 システムテスト（CI・CD方針書 / Epic C C3 / テスト定義書 §9.5）。
# GHA runner 上で ephemeral DB + Redis を起動し、fixture / DB 前提と API E2E を検証する。
# Phase4b 最小 API 整備後は既定 skip_api_e2e=false（infra 切り分け時のみ true 可）。
# 通常 PR 品質ゲート（ci.yml）とは分離し、workflow_dispatch のみで利用する。

run-name: "test-system · ${{ github.event_name }} · skip_api=${{ inputs.skip_api_e2e }}"

on:
  workflow_dispatch:
    inputs:
      skip_api_e2e:
        description: "API health / RecommendationRun E2E を skip（既定 false。infra 切り分け時のみ true）"
        type: boolean
        default: false
      api_base_url:
        description: "api Base URL（空=GHA localhost:3001。将来 cloud dev 用）"
        type: string
        default: ""
      reco_base_url:
        description: "reco Base URL（空=GHA localhost:8000。将来 cloud dev 用）"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: test-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SKIP_API_E2E: ${{ inputs.skip_api_e2e }}
      API_BASE_URL: ${{ inputs.api_base_url != '' && inputs.api_base_url || 'http://localhost:3001' }}
      RECO_BASE_URL: ${{ inputs.reco_base_url != '' && inputs.reco_base_url || 'http://localhost:8000' }}
      REDIS_URL: redis://localhost:6379/0
      RECO_INTERNAL_API_KEY: ci-test-reco-internal-key
      OPENAI_API_KEY: mock-openai-key-for-layer2
      RAKUTEN_APPLICATION_ID: mock-rakuten-app-id-for-layer2
      RESULTS_DIR: tests/e2e/results

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read Supabase CLI pin
        id: cli-pin
        run: echo "version=$(tr -d '[:space:]' < supabase/.cli-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.cli-pin.outputs.version }}

      - name: Install PostgreSQL client and redis-cli
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools jq curl

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        if: inputs.skip_api_e2e == false
        uses: astral-sh/setup-uv@v5
        with:
          # Post cache prune が job failure になることがあるため Layer2 では無効化
          enable-cache: false

      - name: Setup Python for reco
        if: inputs.skip_api_e2e == false
        run: |
          uv python install "$(tr -d '[:space:]' < .python-version)"
          ./scripts/dev/setup-python-reco.sh

      - name: Verify seed setup
        run: bash scripts/db/verify-seed-setup.sh

      - name: Verify Supabase CLI pin
        run: bash scripts/db/check-cli-version.sh

      - name: Start ephemeral Supabase stack
        run: bash scripts/db/start-local.sh

      - name: Apply migrations
        run: bash scripts/db/migrate-up.sh

      - name: Apply master seed
        run: bash scripts/db/seed-masters.sh

      - name: Apply test-data seed
        run: bash scripts/db/seed-test-data.sh

      - name: Export DATABASE_URL
        id: db-url
        run: |
          # shellcheck source=scripts/db/_lib.sh
          source scripts/db/_lib.sh
          db_require_repo_root
          echo "url=$(db_local_database_url)" >> "$GITHUB_OUTPUT"

      - name: Prepare runtime .env
        run: |
          cp .env.example .env
          {
            echo "DATABASE_URL=${{ steps.db-url.outputs.url }}"
            echo "REDIS_URL=${REDIS_URL}"
            echo "RECO_INTERNAL_API_KEY=${RECO_INTERNAL_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "RAKUTEN_APPLICATION_ID=${RAKUTEN_APPLICATION_ID}"
            echo "API_BASE_URL=${API_BASE_URL}"
            echo "RECO_BASE_URL=${RECO_BASE_URL}"
            echo "NEXT_PUBLIC_API_BASE_URL=${API_BASE_URL}"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:3000"
          } >> .env

      - name: Start api and reco (when API E2E enabled)
        if: inputs.skip_api_e2e == false
        env:
          DATABASE_URL: ${{ steps.db-url.outputs.url }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          mkdir -p /tmp/test-system-logs
          pnpm dev:reco > /tmp/test-system-logs/reco.log 2>&1 &
          echo "${!}" > /tmp/test-system-logs/reco.pid
          pnpm dev:api > /tmp/test-system-logs/api.log 2>&1 &
          echo "${!}" > /tmp/test-system-logs/api.pid
          echo "info: api/reco start requested (DATABASE_URL sourced from .env)"

      - name: Wait for api/reco health (when API E2E enabled)
        if: inputs.skip_api_e2e == false
        run: |
          set -euo pipefail
          api_ok=0
          reco_ok=0
          # api は tsc build 後に listen するため、cold runner 向けに最大約 3 分待つ
          for _ in $(seq 1 90); do
            if curl -fsS "${API_BASE_URL}/api/v1/health" >/dev/null 2>&1; then
              api_ok=1
            fi
            if curl -fsS -H "X-Internal-Api-Key: ${RECO_INTERNAL_API_KEY}" \
              "${RECO_BASE_URL}/internal/reco/v1/health" >/dev/null 2>&1; then
              reco_ok=1
            fi
            if [[ "${api_ok}" -eq 1 && "${reco_ok}" -eq 1 ]]; then
              echo "info: api and reco health checks passed"
              exit 0
            fi
            sleep 2
          done
          echo "error: api/reco did not become healthy within timeout" >&2
          echo "--- api log ---" >&2
          tail -n 80 /tmp/test-system-logs/api.log >&2 || true
          echo "--- reco log ---" >&2
          tail -n 80 /tmp/test-system-logs/reco.log >&2 || true
          exit 1

      - name: Run system E2E tests
        id: e2e
        env:
          DATABASE_URL: ${{ steps.db-url.outputs.url }}
        run: bash tests/e2e/run-system-tests.sh

      - name: Write job summary
        if: always()
        run: |
          report="${RESULTS_DIR}/system-test-report.json"
          if [[ -f "${report}" ]]; then
            {
              echo "## Test System (Layer2) summary"
              echo ""
              echo "| 項目 | 値 |"
              echo "| --- | --- |"
              echo "| skip_api_e2e | \`${SKIP_API_E2E}\` |"
              echo "| api_base_url | \`${API_BASE_URL}\` |"
              echo "| reco_base_url | \`${RECO_BASE_URL}\` |"
              echo ""
              echo "### Case results"
              echo '```json'
              jq '.cases[] | {id, status, message}' "${report}"
              echo '```'
              echo ""
              echo "### Summary"
              jq -r '"passed=\(.summary.passed) failed=\(.summary.failed) skipped=\(.summary.skipped) phase4b_pending=\(.phase4bPending)"' "${report}"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "warn: report not found at ${report}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload system test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-system-report
          path: |
            tests/e2e/results/system-test-report.json
            tests/e2e/results/system-test-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload api/reco runtime logs
        if: always() && inputs.skip_api_e2e == false
        uses: actions/upload-artifact@v4
        with:
          name: test-system-runtime-logs
          path: |
            /tmp/test-system-logs/api.log
            /tmp/test-system-logs/reco.log
            /tmp/recommendation-run-response.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop api/reco background processes
        if: always() && inputs.skip_api_e2e == false
        run: |
          for name in api reco; do
            pid_file="/tmp/test-system-logs/${name}.pid"
            if [[ -f "${pid_file}" ]]; then
              kill "$(cat "${pid_file}")" 2>/dev/null || true
            fi
          done

      - name: Stop Supabase stack
        if: always()
        run: bash scripts/db/stop-local.sh
