name: PR Review Status Sync

run-name: "status-sync · ${{ github.event_name == 'repository_dispatch' && 'dispatch' || github.event_name == 'pull_request_review' && 'human-review' || 'manual' }} · PR #${{ github.event.client_payload.pr_number || github.event.pull_request.number || github.event.inputs.pr_number }} · ${{ github.event.client_payload.review_result || github.event.inputs.review_result || github.event.review.state || 'n/a' }}"

on:
  repository_dispatch:
    types:
      - ai_review_status_sync
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:
    inputs:
      pr_number:
        description: 対象PR番号
        required: true
      review_result:
        description: Review Result（Human Reviewへ進行可 / 修正後に再AI Review / Human判断待ち）
        required: true
      dry_run:
        description: trueの場合は更新せずログのみ出力する
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-review-status-sync-${{ github.event.client_payload.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync Project Status from AI Review result
        uses: actions/github-script@v8
        env:
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_DEVOPS: ${{ vars.SLACK_CHANNEL_ID_DEVOPS }}
          SLACK_MENTION_HUMAN_REVIEW: ${{ vars.SLACK_MENTION_HUMAN_REVIEW }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require("path");
            const slack = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/slack-notify.cjs"));
            const { createProjectV2Client } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github/scripts/project-v2-utils.cjs",
            ));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repositoryFullName = `${owner}/${repo}`;
            const serverUrl = process.env.GITHUB_SERVER_URL || "https://github.com";
            const dryRun =
              context.eventName === "workflow_dispatch" &&
              String(context.payload.inputs?.dry_run || "") === "true";
            const projectOwner = process.env.PROJECT_OWNER || owner;
            const projectNumber = Number(process.env.PROJECT_NUMBER || "4");
            const projectV2 = createProjectV2Client({
              github,
              projectOwner,
              projectNumber,
              dryRun,
            });

            function nextStatusFromReviewResult(result, body) {
              return slack.statusFromReviewResult(result, body);
            }

            function relatedIssueNumber(prBody) {
              return slack.relatedIssueNumber(prBody);
            }

            async function comment(issueNumber, body) {
              if (dryRun) {
                core.info(`[dry_run] comment on #${issueNumber}:\n${body}`);
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }

            function skipWithSummary(reason, details = {}) {
              core.info(`Skipped: ${reason}`);
              const lines = [`Skipped: ${reason}`];
              for (const [key, value] of Object.entries(details)) {
                if (value !== undefined && value !== "") lines.push(`${key}: ${value}`);
              }
              return core.summary.addRaw(lines.join("\n") + "\n").write();
            }

            let prNumber;
            let reviewResult;
            let reviewBody = "";
            let route = "";

            if (context.eventName === "workflow_dispatch") {
              route = "workflow_dispatch";
              prNumber = Number(context.payload.inputs.pr_number);
              reviewBody = String(context.payload.inputs.review_result || "");
              reviewResult = slack.normalizeReviewResult(reviewBody);
              if (!reviewResult) reviewResult = String(context.payload.inputs.review_result || "");
            } else if (context.eventName === "repository_dispatch") {
              route = "repository_dispatch";
              const payload = context.payload.client_payload || {};
              prNumber = Number(payload.pr_number);
              reviewBody = String(payload.review_body || "");
              reviewResult = slack.normalizeKnownReviewToken(payload.review_result || "");
              if (!reviewResult) {
                reviewResult = slack.normalizeReviewResult(String(payload.review_result || ""));
              }
              if (!prNumber || !reviewResult) {
                core.setFailed(
                  "client_payload requires pr_number and review_result (approve_for_human_review / request_changes / ...).",
                );
                return;
              }
            } else if (context.eventName === "pull_request_review") {
              route = "human_review";
              const review = context.payload.review;
              if (review?.state !== "changes_requested") {
                core.info("Pull request review is not changes_requested; skipped.");
                return;
              }
              prNumber = context.payload.pull_request?.number;
              reviewResult = "request_changes";
              reviewBody = review.body || "";
            } else {
              core.setFailed(`Unsupported event: ${context.eventName}`);
              return;
            }

            const nextStatus = nextStatusFromReviewResult(reviewResult, reviewBody);
            if (!nextStatus) {
              core.info("Review Result marker not found; skipped.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.head?.repo?.full_name !== repositoryFullName) {
              core.info("PR from fork is out of scope for initial Slack notification workflow; skipped.");
              return;
            }
            const taskIssueNumber = relatedIssueNumber(pr.body || "");
            if (!taskIssueNumber) {
              core.setFailed("PR本文から対象Issueを解決できませんでした。`Related to #<Task Issue番号>` または `Closes #<Epic Issue番号>` を記載してください。");
              return;
            }

            const project = await projectV2.loadProject();
            if (!project) {
              core.setFailed("ProjectV2を解決できませんでした。");
              return;
            }
            const id = await projectV2.getRepositoryIssueNodeId(owner, repo, taskIssueNumber);
            if (!id) {
              core.setFailed(`Issue #${taskIssueNumber} のNode IDを解決できませんでした。`);
              return;
            }
            const itemId = await projectV2.ensureProjectItem(project, id);
            if (!itemId) {
              core.setFailed(`Issue #${taskIssueNumber} のProject itemを解決できませんでした。`);
              return;
            }

            const currentStatus = await projectV2.readItemStatus(itemId);
            const expectedCurrent =
              route === "human_review"
                ? slack.expectedCurrentStatusForHumanReview()
                : slack.expectedCurrentStatusForAiReview(reviewResult);

            if (expectedCurrent && currentStatus && !slack.statusNamesEqual(currentStatus, expectedCurrent)) {
              return skipWithSummary("current_status_mismatch", {
                PR: `#${prNumber}`,
                Issue: `#${taskIssueNumber}`,
                "Current Status": currentStatus,
                "Expected Status": expectedCurrent,
                "Next Status": nextStatus,
              });
            }

            if (currentStatus && slack.statusNamesEqual(currentStatus, nextStatus)) {
              return skipWithSummary("already_at_next_status", {
                PR: `#${prNumber}`,
                Issue: `#${taskIssueNumber}`,
                Status: currentStatus,
              });
            }

            if (dryRun) {
              core.info(`[dry_run] update status: ${nextStatus}`);
            } else {
              await projectV2.updateStatus(project, itemId, nextStatus);
            }
            await comment(
              prNumber,
              slack.buildStatusSyncConfirmationComment({ taskIssueNumber, nextStatus }),
            );

            const channel = process.env.SLACK_CHANNEL_ID_DEVOPS || "";
            const threadKey = slack.buildThreadKey({ owner, repo, kind: "pr", number: prNumber });
            const comments = await slack.listIssueComments({ github, owner, repo, issueNumber: prNumber });
            const threadTs = slack.findThreadTsFromComments(comments, threadKey, channel);
            const level = slack.notificationLevelFromReviewResult(reviewResult);
            const mention = nextStatus === "Human Review" ? process.env.SLACK_MENTION_HUMAN_REVIEW || "" : "";
            const title = nextStatus === "Human Review" ? "Human Reviewをお願いします" : "AIレビューが完了しました";
            const text = slack.buildSlackText({
              level,
              title,
              summary: `Review Result: ${slack.reviewResultLabelForHumans(reviewResult)}`,
              mention,
              fields: {
                PR: `#${prNumber}`,
                Issue: `#${taskIssueNumber}`,
                "Next Status": nextStatus,
              },
              links: {
                PR: pr.html_url,
                Issue: `${serverUrl}/${repositoryFullName}/issues/${taskIssueNumber}`,
              },
              humanAction: nextStatus === "Human Review" ? "PRのHuman Reviewをお願いします。" : "修正要否または人間判断事項をPRで確認してください。",
            });
            const result = await slack.postSlackMessage({
              token: process.env.SLACK_BOT_TOKEN,
              channel,
              text,
              threadTs,
              replyBroadcast: nextStatus === "Human Review",
              dryRun,
            });
            if (result.ok && result.ts && !threadTs) {
              await slack.upsertThreadMarkerComment({
                github,
                owner,
                repo,
                issueNumber: prNumber,
                threadKey,
                channel: result.channel || channel,
                ts: result.ts,
                comments,
                dryRun,
              });
            }

            await core.summary
              .addHeading("PRレビュー Status / Slack通知")
              .addRaw(
                `PR: #${prNumber}\n\nIssue: #${taskIssueNumber}\n\nRoute: \`${route}\`\n\nReview Result: \`${reviewResult}\`\n\nCurrent Status: \`${currentStatus || "unknown"}\`\n\nNext Status: \`${nextStatus}\`\n\nSlack: ${result.ok ? "ok" : "failed"}\n`,
              )
              .addRaw(result.error ? `\nSlack error: \`${result.error}\`\n` : "")
              .write();
            if (!result.ok) {
              core.warning(`Slack notification failed: ${result.error || "unknown"}`);
            }
