name: Batch Daily Orchestrator

# 親 workflow（日次）— 案A: 複合子を jobs.needs で連鎖
# 正本: バッチ実行スケジュール設計書 §6.1 / §7
# MVP Phase1: schedule 無効（§16.1）。Phase2 で cron を有効化する。
# 018/019 は本線に載せない。

on:
  # Phase1 disabled — enable in Phase2:
  # schedule:
  #   # Monday-Saturday 00:30 JST = Sunday-Friday 15:30 UTC
  #   - cron: "30 15 * * 0-5"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Max items for meaning / embedding generation"
        required: false
        default: "500"
      run_retry_after:
        description: "Run retry workflow after daily mainline"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: batch-mainline
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  ranking_snapshot:
    uses: ./.github/workflows/batch-rakuten-ranking-snapshot.yml
    secrets: inherit

  item_import:
    needs: ranking_snapshot
    uses: ./.github/workflows/batch-rakuten-item-import.yml
    with:
      max_items: ${{ inputs.max_items || '1000' }}
    secrets: inherit

  item_meaning_generation:
    needs: item_import
    uses: ./.github/workflows/batch-item-meaning-generation.yml
    with:
      max_items: ${{ inputs.max_items || '500' }}
      diff_batch_run_id: ${{ needs.item_import.outputs.pipeline_batch_run_id }}
      include_backlog: "true"
    secrets: inherit

  distribution_metrics:
    needs: item_meaning_generation
    uses: ./.github/workflows/batch-distribution-metrics.yml
    with:
      trigger_mode: chain
    secrets: inherit

  retry_failed_items:
    if: ${{ inputs.run_retry_after == 'true' }}
    needs: distribution_metrics
    uses: ./.github/workflows/batch-retry-failed-items.yml
    with:
      max_items: "100"
    secrets: inherit

  notify_failure:
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs:
      - ranking_snapshot
      - item_import
      - item_meaning_generation
      - distribution_metrics
      - retry_failed_items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Notify Slack on daily orchestrator failure
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_SYSTEM_ALERTS: ${{ vars.SLACK_CHANNEL_ID_SYSTEM_ALERTS }}
          SLACK_MENTION_INCIDENT: ${{ vars.SLACK_MENTION_INCIDENT }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require("path");
            const slack = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/slack-notify.cjs"));
            const needs = JSON.parse(process.env.NEEDS_JSON || "{}");
            const failedJobs = Object.entries(needs)
              .filter(([, value]) => value.result === "failure")
              .map(([name]) => name);
            const serverUrl = process.env.GITHUB_SERVER_URL || "https://github.com";
            const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = slack.buildSlackText({
              level: "error",
              title: "Batch Daily Orchestrator が失敗しました",
              summary: `失敗 job: ${failedJobs.join(", ") || "unknown"}`,
              mention: process.env.SLACK_MENTION_INCIDENT || "",
              fields: {
                Workflow: context.workflow,
                Run: `#${context.runNumber}`,
                Ref: context.ref,
              },
              humanAction: "Actions の失敗 job とログを確認してください。",
              links: { Run: runUrl },
            });
            const result = await slack.postSlackMessage({
              token: process.env.SLACK_BOT_TOKEN,
              channel: process.env.SLACK_CHANNEL_ID_SYSTEM_ALERTS,
              text,
            });
            if (!result.ok) {
              core.warning(`Slack notification failed: ${result.error || "unknown"}`);
            }
            await core.summary.addHeading("Batch failure notification").addRaw(text).write();
