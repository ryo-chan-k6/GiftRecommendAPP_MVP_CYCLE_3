name: CI

# PR 品質ゲートのエントリポイント（CI・CD方針書 §7–§9 / 環境設計書 §19.8）。
#
# 役割分離:
# - 本 workflow 群（ci*.yml）: lint / typecheck / build / env / contract 等の品質ゲート
# - 既存 workflow（issue-metadata / pr-created / definition-run 等）: AI 運用・Projects・Slack 通知
#   破壊的変更は行わず、トリガー・permissions を混在させない。
#
# MVP 最小セット: env / secret scan / OpenAPI+Orval / app 別 Layer1（ci-api / ci-reco 等）。
# ci-api / ci-reco は Epic D 管轄。該当 path 変更時のみ各 check を実行（path filter）。
# ci-web.yml / ci-batch.yml 等はアプリ実装整備後に追加する。

run-name: "ci · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      reco: ${{ steps.filter.outputs.reco }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter app-related paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'tsconfig.base.json'
              - '.github/workflows/ci-api.yml'
              - '.github/workflows/ci.yml'
            reco:
              - 'apps/reco/**'
              - 'packages/shared-logic/**'
              - 'packages/test-fixtures/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'scripts/dev/setup-python.sh'
              - 'scripts/dev/setup-python-reco.sh'
              - 'scripts/dev/pytest-python.sh'
              - 'scripts/dev/pytest-reco.sh'
              - 'scripts/dev/_python-lib.sh'
              - '.github/workflows/ci-reco.yml'
              - '.github/workflows/ci.yml'

  env-check:
    uses: ./.github/workflows/ci-env.yml

  security-check:
    uses: ./.github/workflows/ci-security.yml

  contract-check:
    uses: ./.github/workflows/ci-contract.yml

  api-check:
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true'
      || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci-api.yml

  reco-check:
    needs: changes
    if: >-
      needs.changes.outputs.reco == 'true'
      || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci-reco.yml

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - env-check
      - security-check
      - contract-check
      - api-check
      - reco-check
    if: always()
    steps:
      - name: Aggregate CI result
        run: |
          if [[ "${{ needs.env-check.result }}" != "success" ]] \
            || [[ "${{ needs.security-check.result }}" != "success" ]] \
            || [[ "${{ needs.contract-check.result }}" != "success" ]]; then
            echo "CI quality gate failed."
            exit 1
          fi
          api_result="${{ needs.api-check.result }}"
          if [[ "${api_result}" != "success" && "${api_result}" != "skipped" ]]; then
            echo "CI quality gate failed (api-check: ${api_result})."
            exit 1
          fi
          reco_result="${{ needs.reco-check.result }}"
          if [[ "${reco_result}" != "success" && "${reco_result}" != "skipped" ]]; then
            echo "CI quality gate failed (reco-check: ${reco_result})."
            exit 1
          fi
          echo "CI quality gate passed."
