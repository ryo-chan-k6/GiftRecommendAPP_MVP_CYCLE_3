name: Batch Rakuten Product Diff

# BATCH-006 商品差分判定（独立子 workflow）
# 正本: BATCH-006 バッチ仕様書 §18.1 No.7 — workflow_call / workflow_dispatch
# 親 item-import / existing-item-recheck チェーン全体改修は本 Epic では行わない

on:
  workflow_call:
    inputs:
      job_run_id:
        description: "Optional batch_run_id override"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max staging_item rows to judge (default 1000)"
        required: false
        type: string
        default: "1000"
      source:
        description: "source filter (default rakuten)"
        required: false
        type: string
        default: "rakuten"
      staging_item_ids:
        description: "Comma-separated staging_item_id list (subset / re-run)"
        required: false
        type: string
        default: ""
      external_item_codes:
        description: "Comma-separated external_item_code list (subset / re-run)"
        required: false
        type: string
        default: ""
      force:
        description: "Re-judge even when staging_item.diff_status is set (true/false)"
        required: false
        type: string
        default: "false"
      sync_staging_diff_status:
        description: "Sync staging_item.diff_status after persist (default true)"
        required: false
        type: string
        default: "true"
  workflow_dispatch:
    inputs:
      job_run_id:
        description: "Optional batch_run_id override"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max staging_item rows to judge (default 1000)"
        required: false
        type: string
        default: "1000"
      source:
        description: "source filter (default rakuten)"
        required: false
        type: string
        default: "rakuten"
      staging_item_ids:
        description: "Comma-separated staging_item_id list (subset / re-run)"
        required: false
        type: string
        default: ""
      external_item_codes:
        description: "Comma-separated external_item_code list (subset / re-run)"
        required: false
        type: string
        default: ""
      force:
        description: "Re-judge even when staging_item.diff_status is set (true/false)"
        required: false
        type: string
        default: "false"
      sync_staging_diff_status:
        description: "Sync staging_item.diff_status after persist (default true)"
        required: false
        type: string
        default: "true"

concurrency:
  group: batch-rakuten-product-diff
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  product-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install "$(tr -d '[:space:]' < .python-version)"

      - name: Setup batch Python env
        run: bash ./scripts/dev/setup-python-batch.sh

      - name: Resolve job_run_id
        id: run_id
        run: |
          INPUT_ID="${{ inputs.job_run_id }}"
          if [ -n "$INPUT_ID" ]; then
            echo "value=$INPUT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "value=gha-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run BATCH-006 scaffold demo
        # Real DB client is not enabled in this Task.
        # Secrets must never be printed. Use --scaffold-demo for CI smoke.
        # Must NOT call Rakuten API / recalculate normalized_hash / update item tables.
        working-directory: apps/batch
        run: |
          MAX_ARGS=()
          if [ -n "${{ inputs.max_items }}" ]; then
            MAX_ARGS+=(--max-items "${{ inputs.max_items }}")
          fi
          SOURCE_ARGS=()
          if [ -n "${{ inputs.source }}" ]; then
            SOURCE_ARGS+=(--source "${{ inputs.source }}")
          fi
          ID_ARGS=()
          if [ -n "${{ inputs.staging_item_ids }}" ]; then
            ID_ARGS+=(--staging-item-ids "${{ inputs.staging_item_ids }}")
          fi
          CODE_ARGS=()
          if [ -n "${{ inputs.external_item_codes }}" ]; then
            CODE_ARGS+=(--external-item-codes "${{ inputs.external_item_codes }}")
          fi
          FORCE_ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARGS+=(--force)
          fi
          SYNC_ARGS=(--sync-staging-diff-status "${{ inputs.sync_staging_diff_status }}")
          uv run python -m batch.application.product_diff \
            --scaffold-demo \
            --job-run-id "${{ steps.run_id.outputs.value }}" \
            "${MAX_ARGS[@]}" \
            "${SOURCE_ARGS[@]}" \
            "${ID_ARGS[@]}" \
            "${CODE_ARGS[@]}" \
            "${FORCE_ARGS[@]}" \
            "${SYNC_ARGS[@]}"
