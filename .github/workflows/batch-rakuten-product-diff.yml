name: Batch Rakuten Product Diff

# BATCH-006 商品差分判定（独立子 workflow）
# 正本: BATCH-006 バッチ仕様書 §18.1 No.7 — workflow_call / workflow_dispatch
# C3: environment stg + live DB

on:
  workflow_call:
    inputs:
      batch_run_id:
        description: "Shared pipeline batch_run_id (UUID)"
        required: false
        type: string
        default: ""
      job_run_id:
        description: "Optional leaf job_run_id override (UUID). Empty = generate new UUID"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max staging_item rows to judge (default 1000)"
        required: false
        type: string
        default: "1000"
      source:
        description: "source filter (default rakuten)"
        required: false
        type: string
        default: "rakuten"
      staging_item_ids:
        description: "Comma-separated staging_item_id list (subset / re-run)"
        required: false
        type: string
        default: ""
      external_item_codes:
        description: "Comma-separated external_item_code list (subset / re-run)"
        required: false
        type: string
        default: ""
      force:
        description: "Re-judge even when staging_item.diff_status is set (true/false)"
        required: false
        type: string
        default: "false"
      sync_staging_diff_status:
        description: "Sync staging_item.diff_status after persist (default true)"
        required: false
        type: string
        default: "true"
  workflow_dispatch:
    inputs:
      batch_run_id:
        description: "Shared pipeline batch_run_id (UUID)"
        required: false
        type: string
        default: ""
      job_run_id:
        description: "Optional leaf job_run_id override (UUID). Empty = generate new UUID"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max staging_item rows to judge (default 1000)"
        required: false
        type: string
        default: "1000"
      source:
        description: "source filter (default rakuten)"
        required: false
        type: string
        default: "rakuten"
      staging_item_ids:
        description: "Comma-separated staging_item_id list (subset / re-run)"
        required: false
        type: string
        default: ""
      external_item_codes:
        description: "Comma-separated external_item_code list (subset / re-run)"
        required: false
        type: string
        default: ""
      force:
        description: "Re-judge even when staging_item.diff_status is set (true/false)"
        required: false
        type: string
        default: "false"
      sync_staging_diff_status:
        description: "Sync staging_item.diff_status after persist (default true)"
        required: false
        type: string
        default: "true"

concurrency:
  group: batch-rakuten-product-diff
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  product-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: stg
    env:
      DATABASE_URL: ${{ secrets.STG_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install "$(tr -d '[:space:]' < .python-version)"

      - name: Setup batch Python env
        run: bash ./scripts/dev/setup-python-batch.sh

      - name: Resolve run ids
        id: run_ids
        run: |
          PIPELINE_INPUT="${{ inputs.batch_run_id }}"
          JOB_INPUT="${{ inputs.job_run_id }}"
          if [ -n "$PIPELINE_INPUT" ]; then
            echo "batch_run_id=$PIPELINE_INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$JOB_INPUT" ]; then
            echo "batch_run_id=$JOB_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "batch_run_id=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PIPELINE_INPUT" ]; then
            if [ -n "$JOB_INPUT" ] && [ "$JOB_INPUT" != "$PIPELINE_INPUT" ]; then
              echo "job_run_id=$JOB_INPUT" >> "$GITHUB_OUTPUT"
            else
              echo "job_run_id=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
            fi
          elif [ -n "$JOB_INPUT" ]; then
            echo "job_run_id=$JOB_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "job_run_id=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
          fi

      - name: Run BATCH-006 live
        # Secrets must never be printed.
        # Must NOT call Rakuten API / recalculate normalized_hash / update item tables.
        working-directory: apps/batch
        run: |
          MAX_ARGS=()
          if [ -n "${{ inputs.max_items }}" ]; then
            MAX_ARGS+=(--max-items "${{ inputs.max_items }}")
          fi
          SOURCE_ARGS=()
          if [ -n "${{ inputs.source }}" ]; then
            SOURCE_ARGS+=(--source "${{ inputs.source }}")
          fi
          ID_ARGS=()
          if [ -n "${{ inputs.staging_item_ids }}" ]; then
            ID_ARGS+=(--staging-item-ids "${{ inputs.staging_item_ids }}")
          fi
          CODE_ARGS=()
          if [ -n "${{ inputs.external_item_codes }}" ]; then
            CODE_ARGS+=(--external-item-codes "${{ inputs.external_item_codes }}")
          fi
          FORCE_ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARGS+=(--force)
          fi
          SYNC_ARGS=(--sync-staging-diff-status "${{ inputs.sync_staging_diff_status }}")
          uv run python -m batch.application.product_diff \
            --job-run-id "${{ steps.run_ids.outputs.job_run_id }}" \
            --batch-run-id "${{ steps.run_ids.outputs.batch_run_id }}" \
            "${MAX_ARGS[@]}" \
            "${SOURCE_ARGS[@]}" \
            "${ID_ARGS[@]}" \
            "${CODE_ARGS[@]}" \
            "${FORCE_ARGS[@]}" \
            "${SYNC_ARGS[@]}"
