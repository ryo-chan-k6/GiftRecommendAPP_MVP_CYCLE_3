name: Batch Rakuten Existing Item Recheck

# BATCH-004 楽天既存商品再確認（独立子 workflow）
# 正本: BATCH-004 バッチ仕様書 §18 — workflow_call / workflow_dispatch
# 親チェーン全体改修は本 Epic では行わない

on:
  workflow_call:
    inputs:
      job_run_id:
        description: "Optional batch_run_id override"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max items to recheck (default 100; Human採択の開始件数)"
        required: false
        type: string
        default: "100"
      external_item_codes:
        description: "Comma-separated external_item_code list (overrides priority)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      job_run_id:
        description: "Optional batch_run_id override"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max items to recheck (default 100; Human採択の開始件数)"
        required: false
        type: string
        default: "100"
      external_item_codes:
        description: "Comma-separated external_item_code list (overrides priority)"
        required: false
        type: string
        default: ""

concurrency:
  group: batch-rakuten-existing-item-recheck
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  item-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install "$(tr -d '[:space:]' < .python-version)"

      - name: Setup batch Python env
        run: bash ./scripts/dev/setup-python-batch.sh

      - name: Resolve job_run_id
        id: run_id
        run: |
          INPUT_ID="${{ inputs.job_run_id }}"
          if [ -n "$INPUT_ID" ]; then
            echo "value=$INPUT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "value=gha-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run BATCH-004 scaffold demo
        # Real Rakuten HTTP client is not enabled in this Task.
        # Secrets (RAKUTEN_*) must never be printed. Use --scaffold-demo for CI smoke.
        working-directory: apps/batch
        run: |
          MAX_ARGS=()
          if [ -n "${{ inputs.max_items }}" ]; then
            MAX_ARGS+=(--max-items "${{ inputs.max_items }}")
          fi
          CODE_ARGS=()
          if [ -n "${{ inputs.external_item_codes }}" ]; then
            CODE_ARGS+=(--external-item-codes "${{ inputs.external_item_codes }}")
          fi
          uv run python -m batch.application.item_recheck \
            --scaffold-demo \
            --job-run-id "${{ steps.run_id.outputs.value }}" \
            "${MAX_ARGS[@]}" \
            "${CODE_ARGS[@]}"
