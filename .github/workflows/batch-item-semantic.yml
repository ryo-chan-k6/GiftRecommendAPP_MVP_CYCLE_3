name: Batch Item Semantic

# BATCH-010 Item Semantic 生成（独立子 workflow）
# 正本: BATCH-010 バッチ仕様書 §18.1 No.1 — workflow_call / workflow_dispatch
# stg live: DB接続は Environment `stg` の STG_DATABASE_URL を使用する

on:
  workflow_call:
    inputs:
      job_run_id:
        description: "Optional batch_run_id override"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max queue rows to claim (default 1000)"
        required: false
        type: string
        default: "1000"
      source:
        description: "source filter (default rakuten)"
        required: false
        type: string
        default: "rakuten"
      queue_batch_size:
        description: "Claim batch size (default 100)"
        required: false
        type: string
        default: "100"
      item_ids:
        description: "Comma-separated item_id list (subset / re-run)"
        required: false
        type: string
        default: ""
      queue_ids:
        description: "Comma-separated item_generation_queue_id list"
        required: false
        type: string
        default: ""
      apply_config_master_seed:
        description: "Apply 09_config_versions.sql before BATCH-010 (manual recovery only)"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      job_run_id:
        description: "Optional batch_run_id override"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max queue rows to claim (default 1000)"
        required: false
        type: string
        default: "1000"
      source:
        description: "source filter (default rakuten)"
        required: false
        type: string
        default: "rakuten"
      queue_batch_size:
        description: "Claim batch size (default 100)"
        required: false
        type: string
        default: "100"
      item_ids:
        description: "Comma-separated item_id list (subset / re-run)"
        required: false
        type: string
        default: ""
      queue_ids:
        description: "Comma-separated item_generation_queue_id list"
        required: false
        type: string
        default: ""
      apply_config_master_seed:
        description: "Apply 09_config_versions.sql before BATCH-010 (manual recovery only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: batch-item-semantic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  item-semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: stg
    env:
      DATABASE_URL: ${{ secrets.STG_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install "$(tr -d '[:space:]' < .python-version)"

      - name: Setup batch Python env
        run: bash ./scripts/dev/setup-python-batch.sh

      - name: Resolve job_run_id
        id: run_id
        run: |
          INPUT_ID="${{ inputs.job_run_id }}"
          if [ -n "$INPUT_ID" ]; then
            echo "value=$INPUT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply config master seed
        if: ${{ inputs.apply_config_master_seed }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/seeds/masters/09_config_versions.sql

      - name: Run BATCH-010 stg live
        # Rule-first generatorのみを使用し、実LLMは呼び出さない。
        # Must NOT INSERT item_generation_queue (IF-DB-BATCH-010) / update item /
        # call real LLM. Upsert target is item_semantic only (IF-DB-BATCH-011).
        working-directory: apps/batch
        run: |
          MAX_ARGS=()
          if [ -n "${{ inputs.max_items }}" ]; then
            MAX_ARGS+=(--max-items "${{ inputs.max_items }}")
          fi
          SOURCE_ARGS=()
          if [ -n "${{ inputs.source }}" ]; then
            SOURCE_ARGS+=(--source "${{ inputs.source }}")
          fi
          BATCH_ARGS=()
          if [ -n "${{ inputs.queue_batch_size }}" ]; then
            BATCH_ARGS+=(--queue-batch-size "${{ inputs.queue_batch_size }}")
          fi
          ITEM_ARGS=()
          if [ -n "${{ inputs.item_ids }}" ]; then
            ITEM_ARGS+=(--item-ids "${{ inputs.item_ids }}")
          fi
          QUEUE_ARGS=()
          if [ -n "${{ inputs.queue_ids }}" ]; then
            QUEUE_ARGS+=(--queue-ids "${{ inputs.queue_ids }}")
          fi
          uv run python -m batch.application.item_semantic \
            --job-run-id "${{ steps.run_id.outputs.value }}" \
            "${MAX_ARGS[@]}" \
            "${SOURCE_ARGS[@]}" \
            "${BATCH_ARGS[@]}" \
            "${ITEM_ARGS[@]}" \
            "${QUEUE_ARGS[@]}"
