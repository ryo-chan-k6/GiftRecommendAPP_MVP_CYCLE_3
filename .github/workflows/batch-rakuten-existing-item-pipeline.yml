name: Batch Rakuten Existing Item Pipeline

# 複合子（案A・週次用）: BATCH-004 → 005 → 006 → 007 → 008 → 017
# 注意: batch-rakuten-existing-item-recheck.yml は BATCH-004 独立子として維持する。
# 本ファイルは週次親から呼ぶ「再確認〜Item反映」連鎖用（スケジュール設計書の実装差分）。

on:
  workflow_call:
    inputs:
      job_run_id:
        description: "Optional shared batch_run_id override"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max items for recheck/staging/diff/apply/active-status"
        required: false
        type: string
        default: "1000"
      external_item_codes:
        description: "Comma-separated external_item_code list for BATCH-004"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      job_run_id:
        description: "Optional shared batch_run_id override"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max items for recheck/staging/diff/apply/active-status"
        required: false
        type: string
        default: "1000"
      external_item_codes:
        description: "Comma-separated external_item_code list for BATCH-004"
        required: false
        type: string
        default: ""

concurrency:
  group: batch-rakuten-existing-item-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-run-id:
    runs-on: ubuntu-latest
    outputs:
      job_run_id: ${{ steps.run_id.outputs.value }}
    steps:
      - id: run_id
        run: |
          INPUT_ID="${{ inputs.job_run_id }}"
          if [ -n "$INPUT_ID" ]; then
            echo "value=$INPUT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "value=gha-recheck-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          fi

  existing_item_recheck:
    needs: resolve-run-id
    uses: ./.github/workflows/batch-rakuten-existing-item-recheck.yml
    with:
      job_run_id: ${{ needs.resolve-run-id.outputs.job_run_id }}
      max_items: ${{ inputs.max_items }}
      external_item_codes: ${{ inputs.external_item_codes }}
    secrets: inherit

  raw_staging:
    needs: [resolve-run-id, existing_item_recheck]
    uses: ./.github/workflows/batch-rakuten-raw-staging.yml
    with:
      job_run_id: ${{ needs.resolve-run-id.outputs.job_run_id }}
      max_raw: ${{ inputs.max_items }}
    secrets: inherit

  product_diff:
    needs: [resolve-run-id, raw_staging]
    uses: ./.github/workflows/batch-rakuten-product-diff.yml
    with:
      job_run_id: ${{ needs.resolve-run-id.outputs.job_run_id }}
      max_items: ${{ inputs.max_items }}
    secrets: inherit

  item_apply:
    needs: [resolve-run-id, product_diff]
    uses: ./.github/workflows/batch-rakuten-item-apply.yml
    with:
      job_run_id: ${{ needs.resolve-run-id.outputs.job_run_id }}
      max_items: ${{ inputs.max_items }}
      diff_batch_run_id: ${{ needs.resolve-run-id.outputs.job_run_id }}
    secrets: inherit

  item_active_status:
    needs: [resolve-run-id, item_apply]
    uses: ./.github/workflows/batch-rakuten-item-active-status.yml
    with:
      job_run_id: ${{ needs.resolve-run-id.outputs.job_run_id }}
      max_items: ${{ inputs.max_items }}
      batch_run_id: ${{ needs.resolve-run-id.outputs.job_run_id }}
    secrets: inherit

  import_summary:
    needs: [resolve-run-id, item_active_status]
    uses: ./.github/workflows/batch-import-summary.yml
    with:
      job_run_id: ${{ needs.resolve-run-id.outputs.job_run_id }}
      batch_run_id: ${{ needs.resolve-run-id.outputs.job_run_id }}
    secrets: inherit
