name: Batch Weekly Orchestrator

# 親 workflow（週次）— 案A: 複合子を jobs.needs で連鎖（日次相当を内包）
# 正本: バッチ実行スケジュール設計書 §6.2 / §8
# MVP Phase1: schedule 無効（§16.1）。Phase3 で cron を有効化する。
# existing-item 連鎖は batch-rakuten-existing-item-pipeline.yml（004 独立子は維持）。
# BATCH-018 は default false（本線に載せない）。

on:
  # Phase1 disabled — enable in Phase3:
  # schedule:
  #   # Sunday 00:30 JST = Saturday 15:30 UTC
  #   - cron: "30 15 * * 6"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Max items for meaning / embedding generation"
        required: false
        default: "1000"
      run_offline_evaluation:
        description: "Run offline evaluation after weekly mainline (BATCH-018 / △)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: batch-mainline
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  genre_sync:
    uses: ./.github/workflows/batch-rakuten-genre-sync.yml
    secrets: inherit

  ranking_snapshot:
    needs: genre_sync
    uses: ./.github/workflows/batch-rakuten-ranking-snapshot.yml
    secrets: inherit

  item_import:
    needs: ranking_snapshot
    uses: ./.github/workflows/batch-rakuten-item-import.yml
    with:
      max_items: ${{ inputs.max_items || '1000' }}
    secrets: inherit

  existing_item_pipeline:
    needs: item_import
    uses: ./.github/workflows/batch-rakuten-existing-item-pipeline.yml
    with:
      max_items: ${{ inputs.max_items || '1000' }}
    secrets: inherit

  item_meaning_generation:
    needs: existing_item_pipeline
    uses: ./.github/workflows/batch-item-meaning-generation.yml
    with:
      max_items: ${{ inputs.max_items || '1000' }}
    secrets: inherit

  distribution_metrics:
    needs: item_meaning_generation
    uses: ./.github/workflows/batch-distribution-metrics.yml
    with:
      trigger_mode: chain
    secrets: inherit

  offline_evaluation:
    if: ${{ inputs.run_offline_evaluation == 'true' }}
    needs: distribution_metrics
    uses: ./.github/workflows/batch-offline-evaluation.yml
    secrets: inherit

  notify_failure:
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs:
      - genre_sync
      - ranking_snapshot
      - item_import
      - existing_item_pipeline
      - item_meaning_generation
      - distribution_metrics
      - offline_evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Notify Slack on weekly orchestrator failure
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_SYSTEM_ALERTS: ${{ vars.SLACK_CHANNEL_ID_SYSTEM_ALERTS }}
          SLACK_MENTION_INCIDENT: ${{ vars.SLACK_MENTION_INCIDENT }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require("path");
            const slack = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/slack-notify.cjs"));
            const needs = JSON.parse(process.env.NEEDS_JSON || "{}");
            const failedJobs = Object.entries(needs)
              .filter(([, value]) => value.result === "failure")
              .map(([name]) => name);
            const serverUrl = process.env.GITHUB_SERVER_URL || "https://github.com";
            const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = slack.buildSlackText({
              level: "error",
              title: "Batch Weekly Orchestrator が失敗しました",
              summary: `失敗 job: ${failedJobs.join(", ") || "unknown"}`,
              mention: process.env.SLACK_MENTION_INCIDENT || "",
              fields: {
                Workflow: context.workflow,
                Run: `#${context.runNumber}`,
                Ref: context.ref,
              },
              humanAction: "Actions の失敗 job とログを確認してください。",
              links: { Run: runUrl },
            });
            const result = await slack.postSlackMessage({
              token: process.env.SLACK_BOT_TOKEN,
              channel: process.env.SLACK_CHANNEL_ID_SYSTEM_ALERTS,
              text,
            });
            if (!result.ok) {
              core.warning(`Slack notification failed: ${result.error || "unknown"}`);
            }
            await core.summary.addHeading("Batch failure notification").addRaw(text).write();
