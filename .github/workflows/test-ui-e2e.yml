name: Test UI E2E (Layer3)

# Layer3 UI E2E（並列計画 D2 後続 / Epic #1464）。
# GHA runner 上で ephemeral Supabase + Redis + api + reco + web を起動し、
# Playwright S1 happy path（apps/web/e2e/s1-recommendation-happy-path.spec.ts）を自動実行する。
#
# 既存 test-system.yml（Layer2 API E2E, dispatch 専用）のスタック起動を踏襲し、その上に web + Playwright を積む。
# apps/web/** を変更する PR と workflow_dispatch で実行する（可視化）。
# PR 必須(required/blocking)化は branch protection 設定であり Human 判断とする（Epic #1464 §6）。

run-name: "test-ui-e2e · ${{ github.event_name }} · ${{ github.ref_name }}"

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/test-ui-e2e.yml"
  workflow_dispatch:
    inputs:
      web_base_url:
        description: "web Base URL（空=GHA localhost:3000）"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: test-ui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      WEB_BASE_URL: ${{ inputs.web_base_url != '' && inputs.web_base_url || 'http://localhost:3000' }}
      API_BASE_URL: http://localhost:3001
      RECO_BASE_URL: http://localhost:8000
      REDIS_URL: redis://localhost:6379/0
      RECO_INTERNAL_API_KEY: ci-test-reco-internal-key
      OPENAI_API_KEY: mock-openai-key-for-ui-e2e
      RAKUTEN_APPLICATION_ID: mock-rakuten-app-id-for-ui-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read Supabase CLI pin
        id: cli-pin
        run: echo "version=$(tr -d '[:space:]' < supabase/.cli-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.cli-pin.outputs.version }}

      - name: Install PostgreSQL client and redis-cli
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools jq curl

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Playwright 1.52.0 は Node 24 で worker 起動ハングが再現するため、
          # UI E2E runner は LTS 22 に固定する（切り分け結果 / Epic #1464）。
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium + OS deps)
        run: pnpm --filter @gift-recommendation/web exec playwright install --with-deps chromium

      - name: Diagnostic - smoke (stack 不要 / bounded / DEBUG)
        # WSL / CI で観測された playwright CLI ハングの早期切り分け。
        # 外部スタック不要の smoke を短時間で実行し、CLI 自体が起動するか確認する。
        env:
          DEBUG: pw:api,pw:test
        run: |
          set -uo pipefail
          timeout 120 pnpm --filter @gift-recommendation/web exec \
            playwright test e2e/00-playwright-smoke.spec.ts --reporter=list
          code=$?
          if [[ "${code}" -eq 124 ]]; then
            echo "::error::playwright smoke が 120s でタイムアウト（CLI 起動ハングの疑い）"
          fi
          exit "${code}"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Setup Python for reco
        run: |
          uv python install "$(tr -d '[:space:]' < .python-version)"
          ./scripts/dev/setup-python-reco.sh

      - name: Verify seed setup
        run: bash scripts/db/verify-seed-setup.sh

      - name: Verify Supabase CLI pin
        run: bash scripts/db/check-cli-version.sh

      - name: Start ephemeral Supabase stack
        run: bash scripts/db/start-local.sh

      - name: Apply migrations
        run: bash scripts/db/migrate-up.sh

      - name: Apply master seed
        run: bash scripts/db/seed-masters.sh

      - name: Apply test-data seed
        run: bash scripts/db/seed-test-data.sh

      - name: Export DATABASE_URL
        id: db-url
        run: |
          # shellcheck source=scripts/db/_lib.sh
          source scripts/db/_lib.sh
          db_require_repo_root
          echo "url=$(db_local_database_url)" >> "$GITHUB_OUTPUT"

      - name: Prepare runtime .env
        run: |
          cp .env.example .env
          {
            echo "DATABASE_URL=${{ steps.db-url.outputs.url }}"
            echo "REDIS_URL=${REDIS_URL}"
            echo "RECO_INTERNAL_API_KEY=${RECO_INTERNAL_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "RAKUTEN_APPLICATION_ID=${RAKUTEN_APPLICATION_ID}"
            echo "API_BASE_URL=${API_BASE_URL}"
            echo "RECO_BASE_URL=${RECO_BASE_URL}"
            echo "NEXT_PUBLIC_API_BASE_URL=${API_BASE_URL}"
            echo "CORS_ALLOWED_ORIGINS=${WEB_BASE_URL}"
          } >> .env

      - name: Start api and reco
        env:
          DATABASE_URL: ${{ steps.db-url.outputs.url }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          mkdir -p /tmp/ui-e2e-logs
          pnpm dev:reco > /tmp/ui-e2e-logs/reco.log 2>&1 &
          echo "${!}" > /tmp/ui-e2e-logs/reco.pid
          pnpm dev:api > /tmp/ui-e2e-logs/api.log 2>&1 &
          echo "${!}" > /tmp/ui-e2e-logs/api.pid
          echo "info: api/reco start requested"

      - name: Wait for api/reco health
        run: |
          set -euo pipefail
          api_ok=0
          reco_ok=0
          for _ in $(seq 1 90); do
            if curl -fsS "${API_BASE_URL}/api/v1/health" >/dev/null 2>&1; then
              api_ok=1
            fi
            if curl -fsS -H "X-Internal-Api-Key: ${RECO_INTERNAL_API_KEY}" \
              "${RECO_BASE_URL}/internal/reco/v1/health" >/dev/null 2>&1; then
              reco_ok=1
            fi
            if [[ "${api_ok}" -eq 1 && "${reco_ok}" -eq 1 ]]; then
              echo "info: api and reco health checks passed"
              exit 0
            fi
            sleep 2
          done
          echo "error: api/reco did not become healthy within timeout" >&2
          tail -n 80 /tmp/ui-e2e-logs/api.log >&2 || true
          tail -n 80 /tmp/ui-e2e-logs/reco.log >&2 || true
          exit 1

      - name: Build web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: pnpm --filter @gift-recommendation/web build

      - name: Start web and wait for readiness
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          pnpm --filter @gift-recommendation/web start > /tmp/ui-e2e-logs/web.log 2>&1 &
          echo "${!}" > /tmp/ui-e2e-logs/web.pid
          for _ in $(seq 1 60); do
            if curl -fsS "${WEB_BASE_URL}/recommendations" >/dev/null 2>&1; then
              echo "info: web is serving /recommendations"
              exit 0
            fi
            sleep 2
          done
          echo "error: web did not become ready within timeout" >&2
          tail -n 80 /tmp/ui-e2e-logs/web.log >&2 || true
          exit 1

      - name: Run Playwright S1 E2E
        id: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
          DEBUG: pw:api
        run: |
          set -uo pipefail
          timeout 600 pnpm --filter @gift-recommendation/web exec playwright test \
            --reporter=list,html,json
          code=$?
          if [[ "${code}" -eq 124 ]]; then
            echo "::error::playwright S1 が 600s でタイムアウト（ハングの疑い）"
          fi
          exit "${code}"

      - name: Verify S1 executed (not skipped)
        if: always()
        run: |
          set -euo pipefail
          report="apps/web/playwright-results.json"
          if [[ ! -f "${report}" ]]; then
            echo "error: Playwright JSON report not found at ${report}" >&2
            exit 1
          fi
          skipped=$(jq '[.. | objects | select(.status? == "skipped")] | length' "${report}")
          has_s1=$(jq '[.. | objects | select(.title? // "" | test("S1:"))] | length' "${report}")
          echo "skipped_results=${skipped} s1_present=${has_s1}"
          if [[ "${has_s1}" -lt 1 ]]; then
            echo "error: S1 happy path テストがレポートに存在しない。" >&2
            exit 1
          fi
          if [[ "${skipped}" -gt 0 ]]; then
            echo "error: 1件以上のテストが skip された。スタック未起動の疑いがあり、UI E2E ゲートとして無効。" >&2
            exit 1
          fi
          echo "info: S1 happy path executed (skip なし)"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/playwright-results.json
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-runtime-logs
          path: |
            /tmp/ui-e2e-logs/api.log
            /tmp/ui-e2e-logs/reco.log
            /tmp/ui-e2e-logs/web.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop background processes
        if: always()
        run: |
          for name in web api reco; do
            pid_file="/tmp/ui-e2e-logs/${name}.pid"
            if [[ -f "${pid_file}" ]]; then
              kill "$(cat "${pid_file}")" 2>/dev/null || true
            fi
          done

      - name: Stop Supabase stack
        if: always()
        run: bash scripts/db/stop-local.sh
