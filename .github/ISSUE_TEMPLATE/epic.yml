name: Epic Issue
description: 複数Taskを束ねるEpic Issueを作成する
title: "[Epic]"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Epic Issue
        Epic Issueは、成果物識別子または機能領域単位でTask Issueを束ねる作業計画の正本です。
        `no-branch` はIssue本文チェックのみを正本とし、GitHub Label `no-branch` は使いません。

  - type: input
    id: unit
    attributes:
      label: 作業単位
      description: "workflowが `unit: epic` Labelを導出するための値です。"
      value: epic
    validations:
      required: true

  - type: dropdown
    id: work_mode
    attributes:
      label: 作業主体
      description: Issue作成後のBranch作成タイミングを判断するための運用区分です。
      options:
        - ai-agent
        - human-led
    validations:
      required: true

  - type: input
    id: definition_path
    attributes:
      label: Definition
      description: 対応するEpic Definitionのpathを記載してください。
      placeholder: prompts/definitions/epics/<workstream_key>/epic.yaml
    validations:
      required: true

  - type: input
    id: epic_id
    attributes:
      label: Epic ID
      description: Epic Definitionの `epic.id` を記載してください。
      placeholder: epic-scr-002-recommendation-input
    validations:
      required: true

  - type: input
    id: artifact_id
    attributes:
      label: 成果物識別子
      description: Epicが管理する成果物識別子を記載してください。ID未整備領域のみ機能・領域単位を許容します。
      placeholder: SCR-002 / API-PUB-002 / MOD-RECO-001
    validations:
      required: true

  - type: input
    id: workstream_key
    attributes:
      label: workstream_key
      description: Definitionディレクトリと対応する英語kebab-caseのキーです。
      placeholder: scr-002-recommendation-input
    validations:
      required: true

  - type: input
    id: parent_issue
    attributes:
      label: 親Issue
      description: 上位Issueがある場合は `#123`、ない場合は `なし` と記載してください。
      placeholder: "#123 / なし"
      value: なし
    validations:
      required: true

  - type: dropdown
    id: project_phase
    attributes:
      label: プロジェクト工程
      description: Project Phase / Milestone同期に使う工程を選択してください。
      options:
        - 01_事業構想
        - 02_ドメイン探索
        - 03_ドメイン要件定義
        - 04_ドメインモデル設計
        - 05_アプリケーション設計
        - 06_実装設計
        - 07_開発・単体テスト
        - 08_モジュール結合テスト
        - 09_コンポーネント結合テスト
        - 10_システムテスト
        - 11_非機能テスト
        - 12_レコメンド品質評価テスト
        - 13_受入テスト
        - 14_リリース
        - 15_運用・改善
        - 90_PoC
        - なし
    validations:
      required: true

  - type: dropdown
    id: work_type
    attributes:
      label: 作業種別
      description: workflowが `type:*` Labelを導出するための値です。
      options:
        - feature
        - docs
        - refactor
        - chore
        - test
        - spike
        - fix
        - hotfix
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 対象領域
      description: workflowが `area:*` Labelを導出するための値です。
      multiple: true
      options:
        - web
        - api
        - reco
        - batch
        - db
        - docs
        - infra
        - project
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: workflowが `priority:*` LabelおよびProject Priorityを導出するための値です。
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: input
    id: planned_start
    attributes:
      label: Planned Start
      description: ProjectのPlanned Startへ同期する日付です。未定の場合は `未定` と記載してください。
      placeholder: "2026-05-25 / 未定"
    validations:
      required: true

  - type: input
    id: due_date
    attributes:
      label: Due Date
      description: ProjectのDue Dateへ同期する日付です。未定の場合は `未定` と記載してください。
      placeholder: "2026-05-27 / 未定"
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: 紐づけるMilestone名を記載してください。不要な場合は `なし` と記載してください。
      placeholder: 実装設計工程完了 / なし
      value: なし
    validations:
      required: true

  - type: input
    id: branch_summary
    attributes:
      label: Branch summary
      description: Branch名末尾に使う英語kebab-caseの概要です。
      placeholder: recommendation-input-epic
    validations:
      required: true

  - type: checkboxes
    id: no_branch
    attributes:
      label: Branch作成制御
      description: Issue作成時点でEpic Branchを作成しない場合のみチェックしてください。GitHub Labelには同期しません。
      options:
        - label: no-branch
          required: false

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: Epicの概要を記載してください。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜこのEpicが必要かを記載してください。
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: 目的
      description: このEpicで達成することを記載してください。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: scope
      description: このEpicで管理することを箇条書きで記載してください。
      placeholder: |
        - 
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: out_of_scope
      description: このEpicで管理しないことを箇条書きで記載してください。
      placeholder: |
        - 
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: epic_scope.allowed_paths
      description: 配下Taskが触ってよいpathまたはglobを記載してください。
      placeholder: |
        - docs/...
        - apps/...
    validations:
      required: true

  - type: textarea
    id: forbidden_paths
    attributes:
      label: epic_scope.forbidden_paths
      description: allowed_paths配下から除外するpathを記載してください。ない場合は `なし` と記載してください。
      placeholder: |
        - なし
    validations:
      required: true

  - type: textarea
    id: dependencies_epics
    attributes:
      label: dependencies.epics
      description: 依存Epic Issueを記載してください。ない場合は `なし` と記載してください。
      placeholder: |
        - #123
        - なし
    validations:
      required: true

  - type: textarea
    id: child_tasks
    attributes:
      label: 子Task候補
      description: 配下で作成予定のTask候補を記載してください。
      placeholder: |
        - [Task]SCR-002:...
    validations:
      required: true

  - type: textarea
    id: input_docs
    attributes:
      label: input docs
      description: 参照すべき正本docsを列挙してください。
      placeholder: |
        - docs/...
    validations:
      required: true

  - type: textarea
    id: output_files
    attributes:
      label: 管理対象成果物
      description: このEpic配下で作成・更新するdocs / files / testsを記載してください。
      placeholder: |
        - docs/...
        - apps/...
        - tests/...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 完了条件
      description: Epicを完了できる条件をチェックリストで記載してください。
      placeholder: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: review_points
    attributes:
      label: 確認観点
      description: AI Review / Human Reviewで確認すべき観点を記載してください。
      placeholder: |
        - 
    validations:
      required: true

  - type: textarea
    id: human_decision_points
    attributes:
      label: Human Reviewで確認してほしいこと
      description: 人間判断が必要な事項を記載してください。ない場合は `なし` と記載してください。
      placeholder: |
        - なし
    validations:
      required: true

  - type: textarea
    id: operation_logging
    attributes:
      label: operation_logging
      description: ai-logs記録要否と理由を記載してください。通常作業ログはai-logsへ保存しません。
      placeholder: |
        level: none
        reason: 通常作業のためIssue / PRを正本とする
    validations:
      required: true
