name: Task Issue
description: Epic配下のTask Issueを作成する
title: "[Task]"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Task Issue
        Task Issueは、1 Task = 1 Branch = 1 PRを基本とする作業計画の正本です。
        Task BranchはParent Epic Branchから作成し、Task PRはParent Epic Branchへ向けます。

  - type: input
    id: unit
    attributes:
      label: 作業単位
      description: "workflowが `unit: task` Labelを導出するための値です。"
      value: task
    validations:
      required: true

  - type: dropdown
    id: work_mode
    attributes:
      label: 作業主体
      description: Issue作成後のBranch作成タイミングを判断するための運用区分です。
      options:
        - ai-agent
        - human-led
    validations:
      required: true

  - type: input
    id: definition_path
    attributes:
      label: Definition
      description: 対応するTask Definitionのpathを記載してください。
      placeholder: prompts/definitions/tasks/<workstream_key>/<task-role>.yaml
    validations:
      required: true

  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: Task Definitionの `task.id` を記載してください。
      placeholder: task-scr-002-recommendation-input-screen-spec
    validations:
      required: true

  - type: input
    id: parent_issue
    attributes:
      label: 親Issue
      description: Parent Epic Issue番号を `#123` 形式で記載してください。
      placeholder: "#123"
    validations:
      required: true

  - type: input
    id: parent_epic_branch
    attributes:
      label: Parent Epic Branch
      description: Task Branchのbase / PR targetになるParent Epic Branch名を記載してください。
      placeholder: feature/epic-123-recommendation-input
    validations:
      required: true

  - type: dropdown
    id: project_phase
    attributes:
      label: プロジェクト工程
      description: Project Phase / Milestone同期に使う工程を選択してください。
      options:
        - 01_事業構想
        - 02_ドメイン探索
        - 03_ドメイン要件定義
        - 04_ドメインモデル設計
        - 05_アプリケーション設計
        - 06_実装設計
        - 07_開発・単体テスト
        - 08_モジュール結合テスト
        - 09_コンポーネント結合テスト
        - 10_システムテスト
        - 11_非機能テスト
        - 12_レコメンド品質評価テスト
        - 13_受入テスト
        - 14_リリース
        - 15_運用・改善
        - 90_PoC
        - なし
    validations:
      required: true

  - type: dropdown
    id: work_type
    attributes:
      label: 作業種別
      description: workflowが `type:*` Labelを導出するための値です。
      options:
        - feature
        - fix
        - docs
        - refactor
        - chore
        - test
        - hotfix
        - spike
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 対象領域
      description: workflowが `area:*` Labelを導出するための値です。
      multiple: true
      options:
        - web
        - api
        - reco
        - batch
        - db
        - docs
        - infra
        - project
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: workflowが `priority:*` LabelおよびProject Priorityを導出するための値です。
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: input
    id: planned_start
    attributes:
      label: Planned Start
      description: ProjectのPlanned Startへ同期する日付です。未定の場合は `未定` と記載してください。
      placeholder: "2026-05-25 / 未定"
    validations:
      required: true

  - type: input
    id: due_date
    attributes:
      label: Due Date
      description: ProjectのDue Dateへ同期する日付です。未定の場合は `未定` と記載してください。
      placeholder: "2026-05-27 / 未定"
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: 紐づけるMilestone名を記載してください。不要な場合は `なし` と記載してください。
      placeholder: 実装設計工程完了 / なし
      value: なし
    validations:
      required: true

  - type: input
    id: branch_summary
    attributes:
      label: Branch summary
      description: Branch名末尾に使う英語kebab-caseの概要です。
      placeholder: recommendation-input-screen-spec
    validations:
      required: true

  - type: checkboxes
    id: no_branch
    attributes:
      label: Branch作成制御
      description: Issue作成時点でTask Branchを作成しない場合のみチェックしてください。GitHub Labelには同期しません。
      options:
        - label: no-branch
          required: false

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜこのTaskが必要かを記載してください。
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: 目的
      description: このTaskで達成することを記載してください。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: scope
      description: 今回実施することを箇条書きで記載してください。
      placeholder: |
        - 
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: out_of_scope
      description: 今回実施しないことを箇条書きで記載してください。
      placeholder: |
        - 
    validations:
      required: true

  - type: textarea
    id: input_docs
    attributes:
      label: input docs
      description: 参照すべき正本docsを列挙してください。
      placeholder: |
        - docs/...
    validations:
      required: true

  - type: textarea
    id: input_files
    attributes:
      label: input files
      description: 参照すべき既存ファイルを列挙してください。ない場合は `なし` と記載してください。
      placeholder: |
        - apps/...
        - なし
    validations:
      required: true

  - type: textarea
    id: output_docs
    attributes:
      label: output docs
      description: 作成・更新するdocsを列挙してください。ない場合は `なし` と記載してください。
      placeholder: |
        - docs/...
        - なし
    validations:
      required: true

  - type: textarea
    id: output_files
    attributes:
      label: output files
      description: 作成・更新するファイルを列挙してください。ない場合は `なし` と記載してください。
      placeholder: |
        - apps/...
        - なし
    validations:
      required: true

  - type: textarea
    id: output_tests
    attributes:
      label: output tests
      description: 作成・更新するテストを列挙してください。ない場合は `なし` と記載してください。
      placeholder: |
        - apps/.../*.test.ts
        - なし
    validations:
      required: true

  - type: textarea
    id: generated
    attributes:
      label: generated files
      description: generated差分の想定と扱いを記載してください。ない場合は `なし` と記載してください。
      placeholder: |
        generated差分想定: false
        対象path: なし
        扱い: generatedファイルは手動編集しない
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 完了条件
      description: Taskを完了できる条件をチェックリストで記載してください。
      placeholder: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: test_policy
    attributes:
      label: テスト・検証方針
      description: 必要なテスト、実行コマンド、未実施時の理由を記載してください。
      placeholder: |
        required:
          - 
        commands:
          - 
        not_required:
          - 
    validations:
      required: true

  - type: textarea
    id: review_points
    attributes:
      label: 確認観点
      description: AI Review / Human Reviewで確認すべき観点を記載してください。
      placeholder: |
        - 
    validations:
      required: true

  - type: textarea
    id: human_decision_points
    attributes:
      label: Human Reviewで確認してほしいこと
      description: 人間判断が必要な事項を記載してください。ない場合は `なし` と記載してください。
      placeholder: |
        - なし
    validations:
      required: true

  - type: textarea
    id: operation_logging
    attributes:
      label: operation_logging
      description: ai-logs記録要否と理由を記載してください。通常作業ログはai-logsへ保存しません。
      placeholder: |
        level: none
        reason: 通常作業のためIssue / PRを正本とする
    validations:
      required: true
