# -----------------------------------------------------------------------------
# 毎日 0:00 JST: Planned Start が到来した Backlog を Todo に更新する
#
# 正本: docs/06_実装設計/github_actions/Planned Startに基づくStatus自動更新ワークフロー.md
# Project 定数は issue-opened-set-project-fields-from-issue-body.yml と揃えること
# 判定ロジックは .github/scripts/planned-start-status-policy.cjs と揃えること
# -----------------------------------------------------------------------------

name: Update project Status from Planned Start

on:
  schedule:
    # 00:00 Asia/Tokyo == 前日 15:00 UTC（日本は夏冬とも DST なし）
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-status-by-planned-start
  cancel-in-progress: false

jobs:
  promote-backlog-to-todo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote Backlog to Todo when Planned Start is due (JST)
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const path = require("path");
            const policy = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github/scripts/planned-start-status-policy.cjs",
            ));

            const PROJECT_OWNER = "ryo-chan-k6";
            const PROJECT_NUMBER = 4;
            const REPOSITORY_NAME_WITH_OWNER = "ryo-chan-k6/GiftRecommendAPP_MVP_CYCLE_3";

            const STATUS_FIELD_NAME = "Status";
            const PLANNED_START_FIELD_NAME = "Planned Start";
            const TODO_OPTION_NAME = "Todo";

            const projectPageQuery = `
              query($owner: String!, $number: Int!, $after: String) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        __typename
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                        ... on ProjectV2Field {
                          id
                          name
                        }
                      }
                    }
                    items(first: 100, after: $after) {
                      nodes {
                        id
                        fieldValues(first: 50) {
                          nodes {
                            __typename
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2FieldCommon {
                                  name
                                }
                              }
                            }
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field {
                                ... on ProjectV2FieldCommon {
                                  name
                                }
                              }
                            }
                          }
                        }
                        content {
                          __typename
                          ... on Issue {
                            number
                            repository {
                              nameWithOwner
                            }
                          }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
            `;

            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            function findTodoOptionId(statusField) {
              if (!statusField?.options) return null;
              const hit = statusField.options.find(
                (o) => String(o.name || "").trim().toLowerCase() === TODO_OPTION_NAME.toLowerCase(),
              );
              return hit ? hit.id : null;
            }

            function parseItemFieldValues(fieldValueNodes) {
              let statusName = null;
              let plannedRaw = null;
              for (const fv of fieldValueNodes || []) {
                if (fv.__typename === "ProjectV2ItemFieldSingleSelectValue") {
                  const fname = fv.field?.name;
                  if (fname === STATUS_FIELD_NAME) statusName = fv.name ?? null;
                }
                if (fv.__typename === "ProjectV2ItemFieldDateValue") {
                  const fname = fv.field?.name;
                  if (fname === PLANNED_START_FIELD_NAME) plannedRaw = fv.date ?? null;
                }
              }
              const plannedYmd = policy.normalizePlannedStartYmd(plannedRaw);
              return { statusName, plannedYmd, plannedRaw };
            }

            function itemLabel(item) {
              const issue = item.content;
              if (issue?.__typename === "Issue") return `#${issue.number}`;
              return item.id;
            }

            const todayYmd = policy.todayJstYmd();

            const first = await github.graphql(projectPageQuery, {
              owner: PROJECT_OWNER,
              number: PROJECT_NUMBER,
              after: null,
            });

            const project = first.user?.projectV2;
            if (!project) {
              core.setFailed(`projectV2 not found: user ${PROJECT_OWNER} #${PROJECT_NUMBER}`);
              return;
            }

            const projectId = project.id;
            const statusField = project.fields.nodes.find(
              (n) => n.__typename === "ProjectV2SingleSelectField" && n.name === STATUS_FIELD_NAME,
            );
            if (!statusField) {
              core.setFailed(`Single select field not found: ${STATUS_FIELD_NAME}`);
              return;
            }

            const todoOptionId = findTodoOptionId(statusField);
            if (!todoOptionId) {
              core.setFailed(`Status option not found: ${TODO_OPTION_NAME}`);
              return;
            }

            const updated = [];
            let after = null;
            for (;;) {
              const res = await github.graphql(projectPageQuery, {
                owner: PROJECT_OWNER,
                number: PROJECT_NUMBER,
                after,
              });
              const pageProject = res.user.projectV2;
              const nodes = pageProject.items.nodes;

              for (const item of nodes) {
                const issue = item.content;
                if (issue?.__typename !== "Issue") continue;
                if (issue.repository?.nameWithOwner !== REPOSITORY_NAME_WITH_OWNER) continue;

                const { statusName, plannedYmd } = parseItemFieldValues(item.fieldValues?.nodes);
                const promote = policy.shouldPromoteFromBacklogToTodo({
                  statusOptionName: statusName,
                  plannedStartYmd: plannedYmd,
                  todayYmd,
                });
                if (!promote) continue;

                await github.graphql(updateMutation, {
                  projectId,
                  itemId: item.id,
                  fieldId: statusField.id,
                  optionId: todoOptionId,
                });
                updated.push(itemLabel(item));
              }

              if (!pageProject.items.pageInfo.hasNextPage) break;
              after = pageProject.items.pageInfo.endCursor;
            }

            core.info(`JST today (YYYY-MM-DD): ${todayYmd}`);
            core.info(`Updated ${updated.length} item(s) to Todo: ${updated.join(", ") || "(none)"}`);

            await core.summary
              .addHeading("Planned Start に基づく Status 更新")
              .addRaw(
                [
                  `**JST 当日**: \`${todayYmd}\``,
                  `**Todo へ更新した件数**: ${updated.length}`,
                  updated.length ? `**対象**: ${updated.join(", ")}` : "",
                ]
                  .filter(Boolean)
                  .join("\n\n"),
              )
              .write();
